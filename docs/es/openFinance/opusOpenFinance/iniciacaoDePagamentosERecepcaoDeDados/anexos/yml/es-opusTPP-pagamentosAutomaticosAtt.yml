    CreateRecurringPixPayment:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/CreateRecurringPixPaymentData'
    CreateRecurringPixPaymentData:
      type: object
      description: Objeto que contiene datos del pago y del receptor (creditor).
      required:
        - endToEndId
        - date
        - payment
        - creditorAccount
        - cnpjInitiator
        - localInstrument
        - document
      properties:
        recurringConsentId:
          type: string
          pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
          maxLength: 256
          description: |
            Identificador único del consentimiento de larga duración creado para la iniciación de pago solicitada. Deberá ser un URN - Uniform Resource Name.
            Un URN, conforme se define en la [RFC8141](https://tools.ietf.org/html/rfc8141), es un Uniform Resource
            Identifier - URI - que se asigna bajo el URI scheme "urn" y un namespace URN específico, con la intención de que el URN
            sea un identificador de recurso persistente e independiente de la ubicación.
            Considerando la cadena urn:bancoex:C1DD33123 como ejemplo de `recurringConsentId` tenemos:
            - el namespace (urn)
            - el identificador asociado al namespace de la institución transmisora (bancoex)
            - el identificador específico dentro del namespace (C1DD33123).
            Información más detallada sobre la construcción de namespaces debe consultarse en la [RFC8141](https://tools.ietf.org/html/rfc8141).

            [Restricción] Este campo es de cumplimentación obligatoria cuando el valor del campo authorisationFlow sea igual a FIDO_FLOW.
        endToEndId:
          $ref: '#/components/schemas/EndToEndIdPost'
        date:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-01-01'
          description: Fecha en que el pago será realizado. Una cadena con la utilización de la timezone UTC-3 (UTC time format).
        payment:
          $ref: '#/components/schemas/PaymentPix'
        creditorAccount:
          type: object
          description: |
            Objeto que contiene la identificación de la cuenta de destino del beneficiario/receptor.

            [Restricción] - Si /data/paymentReference = "zero", la información de la cuenta de crédito enviada (/data/creditorAccount) debe ser igual a la presente en la cuenta de crédito informada en la creación del consentimiento (`/data/recurringConfiguration/automatic/firstPayment/creditorAccount`)
          required:
            - ispb
            - number
            - accountType
          properties:
            ispb:
              type: string
              minLength: 8
              maxLength: 8
              pattern: '^[0-9A-Z]{8}$'
              example: '12345678'
              description: |
                Debe completarse con el ISPB (Identificador del Sistema de Pagos Brasileño) del participante del SPI (Sistema de pagos instantáneos), únicamente con números.
            issuer:
              type: string
              minLength: 1
              maxLength: 4
              pattern: '^[0-9]{1,4}$'
              example: '1774'
              description: |
                Código de la sucursal emisora de la cuenta sin dígito.
                (La sucursal es la dependencia destinada a la atención de clientes, del público en general y de los asociados de cooperativas de crédito,
                en el ejercicio de las actividades de la institución, y no puede ser móvil ni transitoria).

                [Restricción] Cumplimentación obligatoria para los siguientes tipos de cuenta: CACC (CONTA_DEPOSITO_A_VISTA) y SVGS (CONTA_POUPANCA).
            number:
              type: string
              minLength: 1
              maxLength: 20
              pattern: '^[0-9]{1,20}$'
              example: '1234567890'
              description: |
                Debe completarse con el número de la cuenta transaccional del usuario receptor, con dígito verificador (si este existe);
                si hubiera un valor alfanumérico, este debe convertirse a 0.
            accountType:
              $ref: '#/components/schemas/EnumAccountTypePayments'
        remittanceInformation:
          type: string
          maxLength: 140
          pattern: '[\w\W\s]*'
          example: Pagamento da nota XPTO035-002.
          description: |
            Debe completarse siempre que el usuario pagador introduzca alguna información adicional en un pago, a ser enviada al receptor.
        cnpjInitiator:
          type: string
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          maxLength: 14
          example: '50685362000135'
          description: CNPJ del Iniciador de Pago debidamente habilitado para la prestación del Servicio de Iniciación en el Pix.
        ibgeTownCode:
          type: string
          minLength: 7
          maxLength: 7
          pattern: '^\d{7}$'
          example: '5300108'
          description: |
            El campo ibgeTownCode en el arreglo Pix tiene el mismo comportamiento que el campo codMun descrito en el ítem 1.6.6 del manual del Pix.

            En caso de que la información referente al municipio no sea enviada, el PSP del receptor asumirá que no existen feriados estatales ni municipales en el período en cuestión;
        authorisationFlow:
          type: string
          enum:
            - HYBRID_FLOW
            - CIBA_FLOW
            - FIDO_FLOW
          example: HYBRID_FLOW
          description: |
            Campo condicional utilizado para identificar el flujo de autorización en el que el pago fue solicitado.

            [Restricción] Si CIBA o FIDO, la cumplimentación es obligatoria. En caso de que el campo no esté presente en el payload, se entiende que el flujo de autorización utilizado es el HYBRID_FLOW.
        riskSignals:
          $ref: '#/components/schemas/RiskSignalsPayments'
        localInstrument:
          $ref: '#/components/schemas/LocalInstrument'
        proxy:
          type: string
          description: |
            Clave registrada en el DICT perteneciente al receptor. Los tipos de claves pueden ser: teléfono, e-mail, cpf/cnpj o clave aleatoria.
            En el caso de teléfono celular debe informarse en el estándar E.1641. Para e-mail debe tener el formato xxxxxxxx@xxxxxxx.xxx(.xx) y como máximo 77 caracteres.
            En el caso de CPF deberá informarse con 11 números, sin puntos ni guiones. Para el caso de CNPJ deberá informarse con 14 números, sin puntos ni guiones.
            En el caso de clave aleatoria debe informarse el UUID generado por el DICT, conforme al formato especificado en la [RFC4122](https://tools.ietf.org/html/rfc4122).

            [Restricción] Si localInstrument es igual a DICT o INIC, el campo proxy debe completarse.

