          properties:
            recurringConsentId:
              type: string
              pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
              maxLength: 256
              description: |
                Identificador único del consentimiento de larga duración creado para la iniciación de pago solicitada. Deberá ser un URN - Uniform Resource Name. Un URN, conforme se define en la [RFC8141](https://datatracker.ietf.org/doc/html/rfc8141), es un Uniform Resource Identifier - URI - que se asigna bajo el URI scheme "urn" y un namespace URN específico, con la intención de que el URN sea un identificador de recurso persistente e independiente de la ubicación.
                Considerando la cadena urn:bancoex:C1DD33123 como ejemplo de `recurringConsentId` tenemos:
                - el namespace (urn)
                - el identificador asociado al namespace de la institución transmisora (bancoex)
                - el identificador específico dentro del namespace (C1DD33123). Información más detallada sobre la construcción de namespaces debe consultarse en la [RFC8141](https://datatracker.ietf.org/doc/html/rfc8141).
            statusUpdateDateTime:
              type: string
              format: date-time
