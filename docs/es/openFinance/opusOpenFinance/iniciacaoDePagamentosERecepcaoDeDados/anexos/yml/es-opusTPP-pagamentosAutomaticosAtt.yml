        - CONSUMED
      example: AWAITING_AUTHORISATION
      description: |
        Estado actual del consentimiento recurrente de acuerdo con la máquina de estados
        - AWAITING_AUTHORISATION - Esperando autorización
        - PARTIALLY_ACCEPTED - Parcialmente aceptado
        - AUTHORISED - Autorizado
        - REJECTED - Rechazado
        - REVOKED - Revocado
