      required:
        - rejectedBy
        - rejectedFrom
        - rejectedAt
      properties:
        rejectedBy:
          type: string
          enum:
            - INICIADORA
            - USUARIO
            - DETENTORA
          example: INICIADORA
          description: |
            Quién inició la solicitud de rechazo
            - INICIADORA
            - USUARIO
            - DETENTORA
        rejectedFrom:
          type: string
          enum:
            - INICIADORA
            - DETENTORA
          example: DETENTORA
          description: |
            Canal donde se inició el proceso de rechazo
            - INICIADORA
            - DETENTORA
        rejectedAt:
          type: string
          format: date-time
          example: '2021-05-21T08:30:00Z'
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          maxLength: 20
