        - $ref: '#/components/parameters/xFapiInteractionId'
        - $ref: '#/components/parameters/xCustomerUserAgent'
        - $ref: '#/components/parameters/xIdempotencyKey'
        - name: originalRecurringPaymentId
          in: path
          description: |
            Campo que contiene el identificador del intento original de pago que falló. Código o identificador único creado por la institución detentora de la cuenta para representar la iniciación de pago.
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
            pattern: ^[a-zA-Z0-9][a-zA-Z0-9\-]{0,99}$
            example: TXpRMU9UQTROMWhZV2xSU1FUazJSMDl
      description: |
        Método para la creación de nuevos intentos de pago asociados a un intento original que falló. Exclusivo para el Pix Automático.
        El recurso creado que representa el nuevo intento debe consultarse a través del endpoint actual de consulta de pagos (GET /pix/recurring-payments/{recurringPaymentId}).
        En la consulta del recurso creado en este método, que representa ese nuevo intento, la institución detentora será responsable de devolver los campos que no fueron modificados entre los intentos.
        Las reglas de nuevos intentos pueden encontrarse en la versión más reciente de la documentación de la API, presente en el área del desarrollador.

        Sigue el estándar de solicitud/respuesta definido en la documentación oficial ([Open Finance - API Payment Initiation](https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/198410569/SV+API+-+Pagamentos+Autom+ticos)), versión 2.2.0.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecurringRetryPixPayment'
        description: Payload para un nuevo intento de liquidación del pago automático.
        required: true
      responses:
        '502':
          description: Error en Opus Open Client al comunicarse con la institución detentora de la cuenta
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
                $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Tiempo límite de conexión excedido al comunicarse con la institución detentora de la cuenta
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
                $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '201':
          description: Datos del nuevo intento de pago Pix obtenidos con éxito.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/xFapiInteractionIdResponse'
            x-v:
              $ref: '#/components/headers/xV'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseRecurringRetryPaymentsIdPost'
        '400':
          description: 'La solicitud fue mal formada, omitiendo atributos obligatorios, ya sea en el payload o mediante atributos en la URL.'
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '422':
          description: 'La solicitud fue bien formada, pero no pudo procesarse debido a la lógica de negocio específica de la solicitud.'
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422ResponseErrorCreateRetryPixRecurringPayment'
        default:
          description: Sigue el estándar de respuesta definido por el BACEN
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
                $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
