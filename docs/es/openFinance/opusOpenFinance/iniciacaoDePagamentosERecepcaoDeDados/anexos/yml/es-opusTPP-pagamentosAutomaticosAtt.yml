    ConsentRejectionReason:
      type: object
      description: |
        Información sobre el motivo del rechazo
      required:
        - code
        - detail
      properties:
        code:
          type: string
          enum:
            - NAO_INFORMADO
            - FALHA_INFRAESTRUTURA
            - TEMPO_EXPIRADO_AUTORIZACAO
            - REJEITADO_USUARIO
            - CONTAS_ORIGEM_DESTINO_IGUAIS
            - CONTA_NAO_PERMITE_PAGAMENTO
            - AUTENTICACAO_DIVERGENTE
            - FLUXO_NAO_SUPORTADO_PRODUTO
          example: AUTENTICACAO_DIVERGENTE
          description: |
            Código indicador del motivo de rechazo.
            - NAO_INFORMADO
            - FALHA_INFRAESTRUTURA
            - TEMPO_EXPIRADO_AUTORIZACAO
            - REJEITADO_USUARIO
            - CONTAS_ORIGEM_DESTINO_IGUAIS
            - CONTA_NAO_PERMITE_PAGAMENTO
            - AUTENTICACAO_DIVERGENTE
            - FLUXO_NAO_SUPORTADO_PRODUTO
        detail:
          type: string
          pattern: '[\w\W\s]*'
          maxLength: 2048
          description: |
            Detalle sobre el motivo de rechazo indicado en el campo `/data/rejection/reason/code`
            - NAO_INFORMADO: No informado por la institución detentora de la cuenta;
            - FALHA_INFRAESTRUTURA: [Descripción de cuál falla en la infraestructura imposibilitó el procesamiento];
            - TEMPO_EXPIRADO_AUTORIZACAO: El consentimiento expiró antes de que el usuario pudiera confirmarlo;
            - REJEITADO_USUARIO: El usuario rechazó la autorización del consentimiento;
            - CONTAS_ORIGEM_DESTINO_IGUAIS: La cuenta seleccionada es igual a la cuenta de destino y no permite realizar ese pago;
            - CONTA_NAO_PERMITE_PAGAMENTO: La cuenta seleccionada es del tipo [salario/inversión/liquidación/otros] y no permite realizar ese pago;
            - AUTENTICACAO_DIVERGENTE : El usuario autenticado en el detentor difiere del usuario autenticado en el iniciador;
            - FLUXO_NAO_SUPORTADO_PRODUTO: El consentimiento está configurado para un producto aún no soportado por el flujo que inició la solicitud.
          example: O usuário rejeitou a autorização do consentimento
    RejectionReasonGet:
      type: object
      description: |
        Objeto que contiene el motivo de rechazo asíncrono
      required:
        - code
        - detail
      properties:
        code:
          $ref: '#/components/schemas/EnumRejectionReasonCodeGet'
        detail:
          type: string
          pattern: '[\w\W\s]*'
          maxLength: 2048
          description: |
            Detalle sobre el código identificador del motivo de rechazo.

            - SALDO_INSUFICIENTE: La cuenta seleccionada no posee saldo suficiente para realizar el pago;
            - VALOR_ACIMA_LIMITE: Valida si el valor supera el límite establecido [en la institución (cuenta o canal)/en el arreglo] para permitir la realización de transacciones por el cliente;
            - VALOR_INVALIDO: El valor enviado no es válido para el consentimiento asociado al pago;
            - NAO_INFORMADO: No reportado/identificado por la institución detentora de la cuenta;
            - PAGAMENTO_DIVERGENTE_CONSENTIMENTO: Datos del pago divergentes de los datos del consentimiento;
            - PAGAMENTO_RECUSADO_DETENTORA: [descripción del motivo del rechazo];
            - PAGAMENTO_RECUSADO_SPI: [código de error conforme a la tabla de dominios reason PACS.002];
            - CONSENTIMENTO_INVALIDO: Consentimiento inválido (en estado final);
            - FALHA_INFRAESTRUTURA_SPI: Indica una falla en el Sistema de Pagos Instantáneos (SPI);
            - FALHA_INFRAESTRUTURA_ICP: Indica una falla en la Infraestructura de Claves Públicas (ICP);
            - FALHA_INFRAESTRUTURA_PSP_RECEBEDOR: Indica una falla en la infraestructura del Prestador de Servicio de Pago (PSP) que recibe el pago;
            - FALHA_INFRAESTRUTURA_DETENTORA: indica una falla en la infraestructura de la institución detentora de la información o de los recursos;
            - LIMITE_PERIODO_VALOR_EXCEDIDO – La transacción no puede realizarse pues el valor parametrizado en el consentimiento fue excedido.
            - LIMITE_PERIODO_QUANTIDADE_EXCEDIDO – La transacción no puede realizarse pues la cantidad parametrizada en el consentimiento fue excedida.
            - TITULARIDADE_INCONSISTENTE: Cuenta actualmente no asociada al CPF/CNPJ del consentimiento de larga duración.
            - LIMITE_VALOR_TOTAL_CONSENTIMENTO_EXCEDIDO: El valor de la transacción excede el límite global del consentimiento.
            - LIMITE_VALOR_TRANSACAO_CONSENTIMENTO_EXCEDIDO: El valor de la transacción supera el límite de valor por transacción.
            - LIMITE_TENTATIVAS_EXCEDIDO: Se alcanzó el máximo de intentos de liquidación permitidos por el arreglo
            - FORA_PRAZO_PERMITIDO: El horario o período de la solicitud no permite la programación por el detentor.
            - DETALHE_TENTATIVA_INVALIDO: El parámetro [nome_do(s)_campo(s)] insertado para el nuevo intento de pago no coincide con el pago original que falló y no está permitido en el nuevo intento de pago.
            - DETALHE_PAGAMENTO_INVALIDO: Valida si determinado parámetro informado obedece las reglas de negocio
