                - Si no fue recabada por la ITP, el usuario pagador necesitará definirla durante la autorización del consentimiento.
                - Incluso si es enviada por la ITP, el usuario pagador puede modificarla durante la autorización del consentimiento.

                [Restricciones]
                - Objeto obligatorio que deberá devolverse cuando el consentimiento esté o pase por el estado AUTHORISED;
              required:
