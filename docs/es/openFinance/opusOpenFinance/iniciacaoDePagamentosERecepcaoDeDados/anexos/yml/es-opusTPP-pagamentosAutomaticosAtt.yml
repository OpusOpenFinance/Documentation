        accountType:
          $ref: '#/components/schemas/EnumAccountTypeConsents'
    originalRecurringPaymentId:
      type: string
      description: |
        Campo que contiene el código o el identificador del intento original de pago que falló.
        El intento de pago original es el primer intento (Intradía – Primer Intento, véase la documentación) realizado para el pago de una determinada recurrencia.
        Código o identificador único informado por la institución detentora de la cuenta para representar la iniciación de pago.
        El recurringPaymentId debe ser diferente del endToEndId.
        Este es el identificador que deberá utilizarse en la consulta del estado de la iniciación de pago efectuada.

        [Restricción] Este campo es de envío obligatorio por la Iniciadora cuando sea un nuevo intento de liquidación de un pago que falló anteriormente.
      minLength: 1
      maxLength: 100
      pattern: ^[a-zA-Z0-9][a-zA-Z0-9\-]{0,99}$
      example: TXpRMU9UQTROMWhZV2xSU1FUazJSMDl
    EndToEndId:
      type: string
      minLength: 32
      maxLength: 32
      pattern: '^([E])([0-9A-Z]{8})([0-9]{4})(0[1-9]|1[0-2])(0[1-9]|[1-2][0-9]|3[0-1])(2[0-3]|[01][0-9])([0-5][0-9])([a-zA-Z0-9]{11})$'
      example: E9040088820241225150000123873170
      description: |
        Se trata de un identificador único, generado en la institución iniciadora de pago y recibido en la institución detentora de la cuenta, que permea toda la jornada del pago Pix.

        [Restricción] La institución detentora debe obligatoriamente devolver el campo con el mismo valor recibido de la iniciadora.

        En el caso de Pix Automático, la institución iniciadora deberá, en lo que respecta a la composición del endToEndId, utilizar la fecha para la cual el Pix está siendo programado y el horario fijo 15:00 UTC, que dará a la institución detentora la ventana de efectivización de 00:00 a 23:59 del horario de Brasilia, aun siendo la ventana, para el detentor, hasta las 21h.
    EndToEndIdPost:
      type: string
      minLength: 32
      maxLength: 32
      pattern: '^([E])([0-9A-Z]{8})([0-9]{4})(0[1-9]|1[0-2])(0[1-9]|[1-2][0-9]|3[0-1])(2[0-3]|[01][0-9])([0-5][0-9])([a-zA-Z0-9]{11})$'
      example: E9040088820241225150000123873170
      description: |
        Debe completarse en el formato estándar ExxxxxxxxyyyyMMddHHmmkkkkkkkkkkk (32 caracteres; "case sensitive", es decir, diferencia letras mayúsculas y minúsculas), siendo:

        - "E" - fijo (1 carácter);
        - xxxxxxxx - identificación del agente que generó el EndToEndId, que puede ser: el ISPB del participante directo o el ISPB del participante indirecto (8 caracteres numéricos [0-9]);
        - yyyyMMddHHmm – fecha, hora y minuto (12 caracteres), siguiendo el horario UTC, de la presentación de la orden de pago, en caso de que la liquidación sea prioritaria, o prevista para el envío de la orden al sistema de liquidación, en caso de que se realice una programación. Para órdenes prioritarias y no prioritarias, se acepta la cumplimentación, por el agente que generó el EndToEndId, con una tolerancia máxima de 12 horas, hacia el futuro y hacia el pasado, en relación con el horario efectivo de procesamiento de la orden por el SPI;
        - kkkkkkkkkkk – secuencia creada por el agente que generó el EndToEndId (11 caracteres alfanuméricos [a-z/A-Z/0-9]). Debe ser único dentro de cada “yyyyMMddHHmm”;

        Se admite que el EndToEndId sea generado por el participante directo, por el participante indirecto o por el iniciador de pago.

        Debe ser único, no pudiendo repetirse en ninguna otra operación enviada al SPI.
    EnumAccountTypePayments:
      type: string
      enum:
        - CACC
        - SVGS
        - TRAN
      example: CACC
      description: |
        Tipos de cuentas usadas para el pago vía Pix.
        Modalidades tradicionales previstas por la Resolución 4.753, sin contemplar cuentas vinculadas,
        cuenta de domiciliados en el exterior, cuentas en monedas extranjeras y cuenta correspondiente de moneda electrónica.
        A continuación se describe cada valor del ENUM para el ámbito del Pix.

        - CACC - Current - Cuenta Corriente.
        - SVGS - Savings - Cuenta de Ahorro.
        - TRAN - TransactingAccount - Cuenta de Pago prepago.
