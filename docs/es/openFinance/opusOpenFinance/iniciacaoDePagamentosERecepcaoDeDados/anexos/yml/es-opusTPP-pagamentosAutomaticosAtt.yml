            - LIMITE_PERIODO_VALOR_EXCEDIDO: La transacción no puede realizarse pues el valor parametrizado en el consentimiento fue excedido.
            - LIMITE_PERIODO_QUANTIDADE_EXCEDIDO: La transacción no puede realizarse pues la cantidad parametrizada en el consentimiento fue excedida.
            - LIMITE_VALOR_TOTAL_CONSENTIMENTO_EXCEDIDO: El valor de la transacción excede el límite global del consentimiento.
            - LIMITE_VALOR_TRANSACAO_CONSENTIMENTO_EXCEDIDO: El valor de la transacción supera el límite de valor por transacción.
            - LIMITE_TENTATIVAS_EXCEDIDO: Se alcanzó el máximo de intentos de liquidación permitidos por el arreglo.
            - FORA_PRAZO_PERMITIDO: El horario o período de la solicitud no permite la programación por el detentor.
            - DETALHE_TENTATIVA_INVALIDO: El parámetro [nome_do(s)_campo(s)] insertado para el nuevo intento de pago no coincide con el pago original que falló y no está permitido en el nuevo intento de pago.
            - DETALHE_PAGAMENTO_INVALIDO: Valida si determinado parámetro informado obedece las reglas de negocio.
    ConsentEdition:
      type: object
      required:
        - creditors
      properties:
        riskSignals:
          $ref: '#/components/schemas/RiskSignalsConsentEdition'
        creditors:
          type: array
          minItems: 1
          items:
            type: object
            description: |
             Objeto que contiene los datos del receptor (creditor).

              **Reglas para Transferencias inteligentes:**

              1. Para clientes persona física/natural:
              - Debe aceptar solo un ítem en el array; y;
              - El CPF informado debe ser el mismo de `/data/loggedUser/document/identification`.

              2. Para clientes persona jurídica:
              - No hay límite para la cantidad de ítems en el array; y;
              - El/los CNPJ informado(s) debe(n) poseer la misma raíz del CNPJ enviado en el campo `/data/businessEntity/document/identification`.

              **Reglas para Pix Automático:**

              - Solo se permite un ítem en el array; y;
              - El documento informado debe ser de un receptor persona jurídica.

              **Informar solo ese ítem no debe modificar ningún otro parámetro del consentimiento**
            properties:
              name:
                type: string
                pattern: ^([A-Za-zÀ-ÖØ-öø-ÿ,.@:&*+_<>()!?/\\$%\d' -]+)$
                maxLength: 120
                example: Marco Antonio de Brito
                description: |
                  En caso de persona natural debe informarse el nombre completo del titular de la cuenta del receptor.
                  En caso de persona jurídica debe informarse la razón social o el nombre de fantasía de la cuenta del receptor.
        expirationDateTime:
          description: |
            Fecha y hora en que el consentimiento debe dejar de ser válido. Una cadena con fecha y hora conforme a la especificación [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339), siempre con la utilización de la timezone UTC (UTC time format).

            [Restricción] En caso de que ese campo no sea enviado, la institución detentora debe considerar la extensión del plazo por un período indeterminado, excepto en casos de edición exclusiva del campo “/data/creditors/name; o;

            En caso de que sea enviado, ese campo debe ser, como mínimo, D, siendo D el día de la solicitud, y la hora debe ser a las 23:59:59 (UTC).
          type: string
          format: date-time
          example: '2021-05-21T08:30:00Z'
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          maxLength: 20
        recurringConfiguration:
          type: object
          description: Campo destinado a la configuración de los diferentes productos de pagos recurrentes.
          properties:
            automatic:
              type: object
              description: Definición de la configuración de recurrencia para pagos automáticos
              properties:
                maximumVariableAmount:
                  type: string
                  pattern: '^((\d{1,16}\.\d{2}))$'
                  minLength: 4
                  maxLength: 19
                  example: '1000000.12'
                  description: |
                    Valor máximo permitido por cobro; en caso de que se complete, representa un consentimiento para pagos de valores variables.

                    [Restricción]
                    En caso de que ese campo no sea enviado, la institución detentora debe considerar el valor máximo del pago variable como indefinido, excepto en casos de edición exclusiva del campo “/data/creditors/name”;

                    En caso de que se informe, el valor de ese campo no debe ser inferior al valor definido en el campo "/data/recurringConfiguration/automatic/minimumVariableAmount".
        loggedUser:
          type: object
          description: |
            Usuario (persona natural) que se encuentra conectado en la institución Iniciadora de Pago.

            [Restricción] Objeto de envío obligatorio para la edición de los parámetros del consentimiento, excepto para el caso de edición exclusiva del campo “/data/creditors/name”.
          required:
            - document
          properties:
            document:
              type: object
              required:
                - identification
                - rel
              properties:
                identification:
                  type: string
                  maxLength: 11
                  description: Número del documento de identificación oficial del usuario conectado en la institución iniciadora.
                  example: '11111111111'
                  pattern: '^\d{11}$'
                rel:
                  type: string
                  description: Tipo del documento de identificación oficial del usuario conectado en la institución iniciadora.
                  enum:
                    - CPF
        businessEntity:
          type: object
          description: |
            Usuario (persona jurídica) que se encuentra conectado en la institución Iniciadora de Pago.

            [Restricción] Cumplimentación obligatoria si el usuario conectado en la institución Iniciadora de Pago es un CNPJ (persona jurídica).
          required:
            - document
          properties:
            document:
              type: object
              required:
                - identification
                - rel
              properties:
                identification:
                  type: string
                  maxLength: 14
                  description: Número del documento de identificación oficial del titular persona jurídica.
                  example: '11111111111111'
                  pattern: '^[0-9A-Z]{12}[0-9]{2}$'
                rel:
                  type: string
                  maxLength: 4
                  description: Tipo del documento de identificación oficial del titular persona jurídica.
                  example: CNPJ
                  pattern: '^[A-Z]{4}$'
    ConsentRevocation:
      type: object
      properties:
        status:
          type: string
          enum:
            - REVOKED
          example: REVOKED
          description: |
            Estado actual del consentimiento de larga duración
        revocation:
          type: object
          description: Objeto que contiene la información de revocación de los consentimientos de larga duración.
          required:
            - revokedBy
            - revokedFrom
            - reason
          properties:
            revokedBy:
                type: string
                enum:
                  - INICIADORA
                  - USUARIO
                  - DETENTORA
                example: INICIADORA
                description: |
                  Quién inició la solicitud de revocación
                  - INICIADORA
                  - USUARIO
                  - DETENTORA
            revokedFrom:
              type: string
              enum:
                - INICIADORA
                - DETENTORA
              example: DETENTORA
              description: |
                Canal donde se inició el proceso de revocación
                - INICIADORA
                - DETENTORA
            reason:
              $ref: '#/components/schemas/ConsentRevokedReason'
    ConsentRevokedReason:
      type: object
      description: |
        Información sobre el motivo de la revocación
      required:
        - code
        - detail
      properties:
        code:
          type: string
          enum:
            - REVOGADO_RECEBEDOR
            - REVOGADO_USUARIO
            - NAO_INFORMADO
          example: REVOGADO_RECEBEDOR
          description: |
            Código indicador del motivo de revocación.
            - REVOGADO_RECEBEDOR
            - REVOGADO_USUARIO
            - NAO_INFORMADO
        detail:
          type: string
          pattern: '[\w\W\s]*'
          maxLength: 2048
          description: |
            Detalle sobre el motivo de revocación indicado en el campo `/data/revocation/reason/code`.
            - NAO_INFORMADO: No informado por la institución detentora de la cuenta;
            - REVOGADO_USUARIO: El usuario pagador revocó la recurrencia del consentimiento;
            - REVOGADO_RECEBEDOR: El usuario receptor revocó la recurrencia del consentimiento.
    RiskSignalsPayments:
      type: object
      description: |
        Señales de riesgo para la iniciación de pagos automáticos

        [Restricción] Debe enviarse cuando el consentimiento sea para el producto Sweeping Accounts (el objeto "/data/recurringConfiguration/sweeping" usado en el oneOf)
      properties:
        manual:
          type: object
          required:
            - deviceId
            - osVersion
            - userTimeZoneOffset
            - language
            - screenDimensions
            - accountTenure
          description: |
            Representa la recolección de señales de riesgo con la presencia del usuario

            [Restricción] Obligatorio de enviar cuando la transacción ocurra en presencia del usuario
          properties:
            deviceId:
              type: string
              description: |
                ID único del dispositivo generado por la plataforma.  Se utiliza la propiedad del sistema que identifica la combinación de usuario conectado, clave de firma de la aplicación y dispositivo.
                [Android] Información obtenida a través del [link](https://developer.android.com/reference/android/provider/Settings.Secure#ANDROID_ID).
                [iOS] Información obtenida a través del [link](https://developer.apple.com/documentation/uikit/uidevice/1620059-identifierforvendor/).
              example: 00aa11bb22cc33dd
            isRootedDevice:
              type: boolean
              description: |
                Indica si el dispositivo actualmente tiene permiso de “root”.
                [Restricción] Campo de envío obligatorio cuando el usuario utilice una aplicación nativa para Android o iOS.
              example: false
            screenBrightness:
              type: number
              format: double
              description: |
                Indica el nivel de brillo de la pantalla del dispositivo.
                [Android] El valor es entero, típicamente entre 0 y 255, y el rango de valores puede variar según el fabricante del teléfono. Referencia en el [link](https://developer.android.com/reference/android/provider/Settings.System#SCREEN_BRIGHTNESS).
                [iOS] El valor es de punto flotante entre “0.0” y “1.0”. Referencia en el [link](https://developer.apple.com/documentation/uikit/uiscreen/).
                [Restricción] Campo de envío obligatorio cuando el usuario utilice una aplicación nativa para Android o iOS.
            elapsedTimeSinceBoot:
              type: integer
              format: int64
              description: |
                Indica durante cuánto tiempo (en milisegundos) el dispositivo está encendido.
                [Android] Información obtenida a través del [link](https://developer.android.com/reference/android/os/SystemClock#elapsedRealtime%28%29).
                [iOS] Información obtenida a través del [link](https://developer.apple.com/documentation/kernel/kern/).
                [Restricción] Campo de envío obligatorio cuando el usuario utilice una aplicación nativa para Android o iOS.
              example: 6356027
            osVersion:
              type: string
              description: |
                Versión del sistema operativo.
                [Android] Información obtenida a través del [link](https://developer.android.com/reference/android/os/Build.VERSION#RELEASE).
                [iOS] - Información obtenida a través del [link](https://developer.apple.com/documentation/uikit/uidevice/1620043-systemversion/).
              example: "14"
            userTimeZoneOffset:
              type: string
              example: "-03"
              description: |
                Indica la configuración de zona horaria del dispositivo del usuario, con el formato UTC offset: ±hh[:mm]. El formato especificado permite la omisión de la parte correspondiente a los minutos, en caso de que esta última tenga valor cero. Así, ambos valores '-03:00' y '-03' son válidos y representan la misma zona horaria.
                [Android] Información obtenida a través del [link](https://developer.android.com/reference/java/time/ZonedDateTime#getOffset()) o, para versiones anteriores a la 8.0, [link](https://developer.android.com/reference/java/util/TimeZone#getOffset(long)).
                [iOS] Información obtenida a través del [link](https://developer.apple.com/documentation/foundation/timezone/).
            language:
              type: string
              example: "pt"
              description: |
                Indica el idioma del dispositivo en el formato ISO 639-1.
                [Android] Información obtenida a través del [link](https://developer.android.com/reference/java/util/Locale#getLanguage()).
                [iOS] - Información obtenida a través del [link](https://developer.apple.com/documentation/foundation/locale/languagecode/)
            screenDimensions:
              type: object
              description: |
                Dimensiones que la aplicación ocupa en la pantalla del dispositivo.
                [Android] Información obtenida a través del [link](https://developer.android.com/reference/android/view/WindowMetrics#getBounds()), o, para versiones anteriores a la 11, [link](https://developer.android.com/reference/android/util/DisplayMetrics).
                [iOS] - Información obtenida a través del [link](https://developer.apple.com/documentation/metal/mtlrasterizationratemap/3088873-screensize/).
              required:
                - height
                - width
              properties:
                height:
                  type: integer
                  format: int64
                  example: 2340
                  description: Altura de la pantalla, en píxeles.
                width:
                  type: integer
                  format: int64
                  example: 1080
                  description: Ancho de la pantalla, en píxeles.
            accountTenure:
              type: string
              format: date
              example: "2020-05-21"
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
              description: Fecha de registro del cliente en la institución iniciadora.
            geolocation:
              type: object
              description: |
                Ubicación del usuario, obtenida con su consentimiento.
                [Android] Información obtenida a través del [link](https://developers.google.com/android/reference/com/google/android/gms/location/FusedLocationProviderClient#public-abstract-tasklocation-getlastlocation) considerando los permisos necesarios.
                [iOS] Información obtenida a través del [link](https://developer.apple.com/documentation/corelocation/).
                [Restricción] La ITP debe solicitar al usuario el permiso para compartir su ubicación. Este campo podrá omitirse en caso de que el GPS esté indisponible, es decir, sin señal, o en dispositivos sin el hardware necesario; o en caso de que el usuario niegue el consentimiento.
              properties:
                latitude:
                  type: number
                  example: -15.738602
                  format: double
                  description: Coordenada de latitud del cliente mientras está conectado en la institución iniciadora
                longitude:
                  type: number
                  example: -47.926498
                  format: double
                  description: Coordenada de longitud del cliente mientras está conectado en la institución iniciadora
                type:
                  type: string
                  example: FINE
                  description: |
                    Tipo de mecanismo utilizado en la generación de la geolocalización
                  enum:
                    - COARSE
                    - FINE
                    - INFERRED
            isCallInProgress:
              type: boolean
              example: false
              description: |
                Indica llamada activa en el momento del vínculo o del pago.
                [Android] Información obtenida a través del [link](https://developer.android.com/reference/android/media/AudioManager#getMode()).
                [iOS] Información obtenida a través del [link](https://developer.apple.com/documentation/callkit/).
                [Restricción] En caso de que la señal de riesgo esté disponible (el cliente permitió que fuera recabada), la misma deberá enviarse.
            isDevModeEnabled:
              type: boolean
              example: false
              description: Indica si el dispositivo está en modo de desarrollador.
            isMockGPS:
              type: boolean
              example: false
              description: |
                Indica si el dispositivo está usando un GPS falso. Debe enviarse siempre que exista el campo geolocation con tipo `COARSE` o `FINE`.
                [Android] Información obtenida a través del [link](https://developer.android.com/reference/android/location/Location.html#isMock()) o, para versiones anteriores a la 12, [link](https://developer.android.com/reference/android/location/Location.html#isFromMockProvider()).
                [iOS] Información obtenida a través de los links: sourceInformation, [link](https://developer.apple.com/documentation/corelocation/cllocation/3861803-sourceinformation). isSimulatedBySoftware, [link](https://developer.apple.com/documentation/corelocation/cllocationsourceinformation/3861807-issimulatedbysoftware).
            isEmulated:
              type: boolean
              description: Indica si el dispositivo es emulado o real.
              example: false
            isMonkeyRunner:
              type: boolean
              example: false
              description: Indica el uso de MonkeyRunner.
            isCharging:
              type: boolean
              example: true
              description: |
                Indica si la batería del dispositivo está cargándose.
                [Android] Información obtenida a través del [link](https://developer.android.com/reference/android/os/BatteryManager).
                [iOS] Información obtenida a través del [link](https://developer.apple.com/documentation/uikit/uidevice/1620045-batterymonitoringenabled/).
            antennaInformation:
              type: string
              example: |
                CellIdentityLte:{mCi=2******60 mPci=274 mTac=5***1 mEarfcn=9510 mBands=[28] mBandwidth=2147483647 mMcc=724 mMnc=10 mAlphaLong=VIVO mAlphaShort=VIVO mAdditionalPlmns={} mCsgInfo=null}
              description: Indica a qué antena está conectado el dispositivo.
            isUsbConnected:
              type: boolean
              description: Indica si el dispositivo está conectado a otro dispositivo vía USB.
            integrity:
              type: object
              description: |
                Informa la integridad del dispositivo y de la app.
                [Android] Conforme a la documentación Play API Integrity, [link](https://developer.android.com/google/play/integrity/overview?hl=pt-br).
                [iOS] Conforme a la documentación App Attest, [link](https://developer.apple.com/documentation/devicecheck/establishing_your_app_s_integrity).
              properties:
                appRecognitionVerdict:
                  type: string
                  description: Informa la integridad de la app
                  example: PLAY_RECOGNIZED
                deviceRecognitionVerdict:
                  type: string
                  description: Informa la integridad del dispositivo
                  example: '[\"MEETS_DEVICE_INTEGRITY\"]'
        automatic:
          type: object
          required:
            - lastLoginDateTime
          description: |
            Representa la recolección de señales de riesgo sin la presencia del usuario

            [Restricción] Obligatorio de enviar cuando la transacción no ocurra en presencia del usuario
          properties:
            lastLoginDateTime:
              type: string
              format: date-time
              description: |
                En caso de que el usuario pagador tenga acceso al entorno de la iniciadora de pagos, utilizar la fecha y hora de la última interacción del cliente con su aplicación/sistema.
                Para los casos donde la iniciadora de pagos presta servicios a un tercero, debe enviarse el horario en que el pagador se conectó a la aplicación del tercero.
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
            pixKeyRegistrationDateTime:
              type: string
              format: date-time
              description: |
                Fecha y hora de registro de la clave Pix del receptor en la institución iniciadora

                [Restricción] Campo obligatorio a ser enviado en caso de que el valor del campo `/data/localInstrument` sea igual a `DICT` o `INIC`.
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
    RiskSignalsConsentEdition:
      type: object
      required:
        - deviceId
        - osVersion
        - userTimeZoneOffset
        - language
        - screenDimensions
        - accountTenure
      description: |
        Señales de riesgo para la iniciación de pagos automáticos

        [Restricción] Debe enviarse cuando el consentimiento sea para el producto Pix Automático (el objeto "/data/recurringConfiguration/automatic" usado en el oneOf).
        Solo estará presente después de la primera edición del consentimiento de larga duración.
        Objeto de envío obligatorio para la edición de los parámetros del consentimiento, excepto para el caso de edición exclusiva del campo “/data/creditors/name”.
      properties:
        deviceId:
          type: string
          description: |
            ID único del dispositivo generado por la plataforma.  Se utiliza la propiedad del sistema que identifica la combinación de usuario conectado, clave de firma de la aplicación y dispositivo.
            [Android] Información obtenida a través del [link](https://developer.android.com/reference/android/provider/Settings.Secure#ANDROID_ID).
            [iOS] Información obtenida a través del [link](https://developer.apple.com/documentation/uikit/uidevice/1620059-identifierforvendor/).
          example: 00aa11bb22cc33dd
        isRootedDevice:
          type: boolean
          description: |
            Indica si el dispositivo actualmente tiene permiso de “root”.
            [Restricción] Campo de envío obligatorio cuando el usuario utilice una aplicación nativa para Android o iOS.
          example: false
        screenBrightness:
          type: number
          format: double
          description: |
            Indica el nivel de brillo de la pantalla del dispositivo.
            [Android] El valor es entero, típicamente entre 0 y 255, y el rango de valores puede variar según el fabricante del teléfono. Referencia en el [link](https://developer.android.com/reference/android/provider/Settings.System#SCREEN_BRIGHTNESS).
            [iOS] El valor es de punto flotante entre “0.0” y “1.0”. Referencia en el [link](https://developer.apple.com/documentation/uikit/uiscreen/).
            [Restricción] Campo de envío obligatorio cuando el usuario utilice una aplicación nativa para Android o iOS.
        elapsedTimeSinceBoot:
          type: integer
          format: int64
          description: |
            Indica durante cuánto tiempo (en milisegundos) el dispositivo está encendido.
            [Android] Información obtenida a través del [link](https://developer.android.com/reference/android/os/SystemClock#elapsedRealtime%28%29).
            [iOS] Información obtenida a través del [link](https://developer.apple.com/documentation/kernel/kern/).
            [Restricción] Campo de envío obligatorio cuando el usuario utilice una aplicación nativa para Android o iOS.
          example: 6356027
        osVersion:
          type: string
          description: |
            Versión del sistema operativo.
            [Android] Información obtenida a través del [link](https://developer.android.com/reference/android/os/Build.VERSION#RELEASE).
            [iOS] - Información obtenida a través del [link](https://developer.apple.com/documentation/uikit/uidevice/1620043-systemversion/).
          example: "14"
        userTimeZoneOffset:
          type: string
          example: "-03"
          description: |
            Indica la configuración de zona horaria del dispositivo del usuario, con el formato UTC offset: ±hh[:mm]. El formato especificado permite la omisión de la parte correspondiente a los minutos, en caso de que esta última tenga valor cero. Así, ambos valores '-03:00' y '-03' son válidos y representan la misma zona horaria.
            [Android] Información obtenida a través del [link](https://developer.android.com/reference/java/time/ZonedDateTime#getOffset()) o, para versiones anteriores a la 8.0, [link](https://developer.android.com/reference/java/util/TimeZone#getOffset(long)).
            [iOS] Información obtenida a través del [link](https://developer.apple.com/documentation/foundation/timezone/).
        language:
          type: string
          example: "pt"
          description: |
            Indica el idioma del dispositivo en el formato ISO 639-1.
            [Android] Información obtenida a través del [link](https://developer.android.com/reference/java/util/Locale#getLanguage()).
            [iOS] - Información obtenida a través del [link](https://developer.apple.com/documentation/foundation/locale/languagecode/)
        screenDimensions:
          type: object
          description: |
            Dimensiones que la aplicación ocupa en la pantalla del dispositivo.
            [Android] Información obtenida a través del [link](https://developer.android.com/reference/android/view/WindowMetrics#getBounds()), o, para versiones anteriores a la 11, [link](https://developer.android.com/reference/android/util/DisplayMetrics).
            [iOS] - Información obtenida a través del [link](https://developer.apple.com/documentation/metal/mtlrasterizationratemap/3088873-screensize/).
          required:
            - height
            - width
          properties:
            height:
              type: integer
              format: int64
              example: 2340
              description: Altura de la pantalla, en píxeles.
            width:
              type: integer
              format: int64
              example: 1080
              description: Ancho de la pantalla, en píxeles.
        accountTenure:
          type: string
          format: date
          example: "2020-05-21"
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          description: Fecha de registro del cliente en la institución iniciadora.
        geolocation:
          type: object
          description: |
            Ubicación del usuario, obtenida con su consentimiento.
            [Android] Información obtenida a través del [link](https://developers.google.com/android/reference/com/google/android/gms/location/FusedLocationProviderClient#public-abstract-tasklocation-getlastlocation) considerando los permisos necesarios.
            [iOS] Información obtenida a través del [link](https://developer.apple.com/documentation/corelocation/).
            [Restricción] La ITP debe solicitar al usuario el permiso para compartir su ubicación. Este campo podrá omitirse en caso de que el GPS esté indisponible, es decir, sin señal, o en dispositivos sin el hardware necesario; o en caso de que el usuario niegue el consentimiento.
          properties:
            latitude:
              type: number
              example: -15.738602
              format: double
              description: Coordenada de latitud del cliente mientras está conectado en la institución iniciadora
            longitude:
              type: number
              example: -47.926498
              format: double
              description: Coordenada de longitud del cliente mientras está conectado en la institución iniciadora
            type:
              type: string
              example: FINE
              description: |
                Tipo de mecanismo utilizado en la generación de la geolocalización
              enum:
                - COARSE
                - FINE
                - INFERRED
        isCallInProgress:
          type: boolean
          example: false
          description: |
            Indica llamada activa en el momento del vínculo o del pago.
            [Android] Información obtenida a través del [link](https://developer.android.com/reference/android/media/AudioManager#getMode()).
            [iOS] Información obtenida a través del [link](https://developer.apple.com/documentation/callkit/).
            [Restricción] En caso de que la señal de riesgo esté disponible (el cliente permitió que fuera recabada), la misma deberá enviarse.
        isDevModeEnabled:
          type: boolean
          example: false
          description: Indica si el dispositivo está en modo de desarrollador.
        isMockGPS:
          type: boolean
          example: false
          description: |
            Indica si el dispositivo está usando un GPS falso. Debe enviarse siempre que exista el campo geolocation con tipo `COARSE` o `FINE`.
            [Android] Información obtenida a través del [link](https://developer.android.com/reference/android/location/Location.html#isMock()) o, para versiones anteriores a la 12, [link](https://developer.android.com/reference/android/location/Location.html#isFromMockProvider()).
            [iOS] Información obtenida a través de los links: sourceInformation, [link](https://developer.apple.com/documentation/corelocation/cllocation/3861803-sourceinformation). isSimulatedBySoftware, [link](https://developer.apple.com/documentation/corelocation/cllocationsourceinformation/3861807-issimulatedbysoftware).
        isEmulated:
          type: boolean
          description: Indica si el dispositivo es emulado o real.
          example: false
        isMonkeyRunner:
          type: boolean
          example: false
          description: Indica el uso de MonkeyRunner.
        isCharging:
          type: boolean
          example: true
          description: |
            Indica si la batería del dispositivo está cargándose.
            [Android] Información obtenida a través del [link](https://developer.android.com/reference/android/os/BatteryManager).
            [iOS] Información obtenida a través del [link](https://developer.apple.com/documentation/uikit/uidevice/1620045-batterymonitoringenabled/).
        antennaInformation:
          type: string
          example: |
            CellIdentityLte:{mCi=2******60 mPci=274 mTac=5***1 mEarfcn=9510 mBands=[28] mBandwidth=2147483647 mMcc=724 mMnc=10 mAlphaLong=VIVO mAlphaShort=VIVO mAdditionalPlmns={} mCsgInfo=null}
          description: Indica a qué antena está conectado el dispositivo.
        isUsbConnected:
          type: boolean
          description: Indica si el dispositivo está conectado a otro dispositivo vía USB.
        integrity:
          type: object
          description: |
            Informa la integridad del dispositivo y de la app.
            [Android] Conforme a la documentación Play API Integrity, [link](https://developer.android.com/google/play/integrity/overview?hl=pt-br).
            [iOS] Conforme a la documentación App Attest, [link](https://developer.apple.com/documentation/devicecheck/establishing_your_app_s_integrity).
          properties:
            appRecognitionVerdict:
              type: string
              description: Informa la integridad de la app
              example: PLAY_RECOGNIZED
            deviceRecognitionVerdict:
              type: string
              description: Informa la integridad del dispositivo
              example: '[\"MEETS_DEVICE_INTEGRITY\"]'
    RegulatoryMeta:
      type: object
      description: Metainformación referente a la API solicitada.
      required:
        - requestDateTime
      properties:
        requestDateTime:
          description: 'Fecha y hora de la consulta, conforme a la especificación [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339), formato UTC.'
          type: string
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
    LinkSingle:
      type: object
      description: Referencias a otros recursos de la API solicitada.
      required:
        - self
      properties:
        self:
          type: string
          format: url
          maxLength: 2000
          description: URI completo que generó la respuesta actual.
          example: 'https://api.banco.com.br/open-banking/api/v2/resource'
    PaymentPix:
      type: object
      description: Objeto que contiene la información del pago.
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          minLength: 4
          maxLength: 19
          pattern: '^((\d{1,16}\.\d{2}))$'
          example: '100000.12'
          description: |
            Valor de la transacción con 2 decimales.
        currency:
          type: string
          maxLength: 3
          pattern: '^([A-Z]{3})$'
          example: BRL
          description: |
            Código de la moneda nacional según el modelo ISO-4217, es decir, 'BRL'. Todos los valores monetarios informados están representados con la moneda vigente de Brasil.
    PatchPixPayment:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/PatchPixPaymentData'
    PatchPixPaymentData:
      type: object
      required:
        - status
        - cancellation
      properties:
        status:
          $ref: '#/components/schemas/EnumPaymentCancellationStatusType'
        cancellation:
          type: object
          description: |
           Información general sobre la cancelación.
          required:
            - cancelledBy
          properties:
            cancelledBy:
              type: object
              description: Información general sobre el usuario que solicitó la cancelación.
              required:
                - document
              properties:
                document:
                  type: object
                  description: Objeto que consolida los datos del documento del usuario que solicitó la cancelación.
                  required:
                    - identification
                    - rel
                  properties:
                    identification:
                      type: string
                      maxLength: 14
                      description: Número del documento de identificación oficial del pagador o receptor, persona natural o jurídica
                      example: '11111111111'
                      pattern: '^([0-9]{11})$|^([0-9A-Z]{12}[0-9]{2})$'
                    rel:
                      type: string
                      description: Tipo de documento de identificación oficial del pagador o receptor, persona natural o jurídica.
                      enum:
                        - CPF
                        - CNPJ
    PixPaymentCancellation:
      type: object
      description: |
        Objeto que contiene los datos referentes al usuario pagador que solicitó la cancelación, el canal utilizado por él y el motivo.

        [Restricción] El objeto cancellation será obligatorio únicamente cuando el valor del campo status sea igual a CANC.
      required:
        - cancelledAt
        - cancelledBy
        - reason
        - cancelledFrom
      properties:
        reason:
          $ref: '#/components/schemas/EnumPaymentCancellationReasonType'
        cancelledFrom:
          $ref: '#/components/schemas/EnumPaymentCancellationFromType'
        cancelledAt:
          type: string
          description: 'Fecha y hora en que se realizó la cancelación, conforme a la especificación [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339), formato UTC.'
          format: date-time
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2021-05-21T08:30:00Z'
        cancelledBy:
          type: object
          description: Información relacionada con el usuario pagador que solicitó la cancelación del pago.
          required:
            - document
          properties:
            document:
              type: object
              description: Objeto que consolida los datos del documento del usuario que solicitó la cancelación.
              required:
                - identification
                - rel
              properties:
                identification:
                  type: string
                  maxLength: 14
                  description: Número del documento de identificación oficial del pagador o receptor, persona natural o jurídica.
                  example: '11111111111'
                  pattern: '^([0-9]{11})$|^([0-9A-Z]{12}[0-9]{2})$'
                rel:
                  type: string
                  description: Tipo de documento de identificación oficial del pagador o receptor, persona natural o jurídica.
                  enum:
                    - CPF
                    - CNPJ
    ResponsePostRecurringConsent:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: object
          description: Objeto que contiene la información de consentimiento para la iniciación de pago individual.
          required:
            - recurringConsentId
            - statusUpdateDateTime
            - loggedUser
            - status
            - creditors
            - creationDateTime
            - recurringConfiguration
          properties:
            recurringConsentId:
              type: string
              pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
              maxLength: 256
              description: |
                Identificador único del consentimiento de larga duración creado para la iniciación de pago solicitada. Deberá ser un URN - Uniform Resource Name. Un URN, conforme se define en la [RFC8141](https://datatracker.ietf.org/doc/html/rfc8141), es un Uniform Resource Identifier - URI - que se asigna bajo el URI scheme "urn" y un namespace URN específico, con la intención de que el URN sea un identificador de recurso persistente e independiente de la ubicación.
                Considerando la cadena urn:bancoex:C1DD33123 como ejemplo de `recurringConsentId` tenemos:
                - el namespace (urn)
                - el identificador asociado al namespace de la institución transmisora (bancoex)
                - el identificador específico dentro del namespace (C1DD33123). Información más detallada sobre la construcción de namespaces debe consultarse en la [RFC8141](https://datatracker.ietf.org/doc/html/rfc8141).
            statusUpdateDateTime:
              type: string
              format: date-time
              example: '2021-05-21T08:30:00Z'
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              maxLength: 20
              description: |
                Fecha y hora en que el consentimiento tuvo el estado actualizado. Una cadena con fecha y hora conforme a la especificación [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339), siempre con la utilización de la timezone UTC (UTC time format).
            loggedUser:
              $ref: '#/components/schemas/LoggedUser'
            businessEntity:
              $ref: '#/components/schemas/BusinessEntity'
            status:
              $ref: '#/components/schemas/EnumAuthorisationStatusType'
            creditors:
              $ref: '#/components/schemas/Creditors'
            creationDateTime:
              description: Fecha y hora en que el consentimiento fue creado. Una cadena con fecha y hora conforme a la especificación [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339), siempre con la utilización de la timezone UTC (UTC time format).
              type: string
              format: date-time
              example: '2021-05-21T08:30:00Z'
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              maxLength: 20
            expirationDateTime:
              description: |
                Fecha y hora en que el consentimiento debe dejar de ser válido. Una cadena con fecha y hora conforme a la especificación [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339), siempre con la utilización de la timezone UTC (UTC time format).

                [Restricción] En caso de que el consentimiento sea para Pix Automático ("automatic" seleccionado en el oneOf "/data/recurringConfiguration/"), la hora de expiración del consentimiento debe ser a las 23:59:59 (UTC).
              type: string
              format: date-time
              example: '2021-05-21T08:30:00Z'
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              maxLength: 20
            additionalInformation:
              description: Debe completarse siempre que el usuario pagador introduzca alguna información adicional en el consentimiento
              type: string
              example: 'Minha recorrência'
              pattern: '[\w\W\s]*'
              maxLength: 140
            debtorAccount:
              type: object
              description: |
                Objeto que contiene la identificación de la cuenta de origen del pagador.
                - En caso de que la ITP haya recabado la información de cuenta del usuario pagador, esta podrá enviarse en el consentimiento a la institución detentora en este objeto, o;
                - Si no fue recabada por la ITP, el usuario pagador necesitará definirla durante la autorización del consentimiento.
                - Incluso si es enviada por la ITP, el usuario pagador puede modificarla durante la autorización del consentimiento.

                [Restricciones]
                - Objeto obligatorio que deberá devolverse cuando el consentimiento esté o pase por el estado AUTHORISED;
              required:
                - ispb
                - number
                - accountType
              properties:
                ispb:
                  type: string
                  minLength: 8
                  maxLength: 8
                  pattern: '^[0-9A-Z]{8}$'
                  example: '12345678'
                  description: |
                    Debe completarse con el ISPB (Identificador del Sistema de Pagos Brasileño) del participante del SPI (Sistema de pagos instantáneos), únicamente con números.
                issuer:
                  type: string
                  minLength: 1
                  maxLength: 4
                  pattern: '^[0-9]{1,4}$'
                  example: '1774'
                  description: |
                    Código de la sucursal emisora de la cuenta sin dígito.
                    (La sucursal es la dependencia destinada a la atención de clientes, del público en general y de los asociados de cooperativas de crédito,
                    en el ejercicio de las actividades de la institución, y no puede ser móvil ni transitoria).

                    [Restricción] Cumplimentación obligatoria para los siguientes tipos de cuenta: CACC (CONTA_DEPOSITO_A_VISTA) y SVGS (CONTA_POUPANCA).
                number:
                  type: string
                  minLength: 1
                  maxLength: 20
                  pattern: '^[0-9]{1,20}$'
                  example: '1234567890'
                  description: |
                    Debe completarse con el número de la cuenta transaccional del usuario pagador, con dígito verificador (si este existe); si hubiera un valor alfanumérico, este debe convertirse a 0.
                accountType:
                  $ref: '#/components/schemas/EnumAccountTypeConsents'
            rejection:
              $ref: '#/components/schemas/Rejection'
            revocation:
              type: object
              description: |
                Objeto que contiene la información de revocación de los consentimientos.

                [Restricción] Campo de cumplimentación obligatoria en caso de que el estado del consentimiento sea igual a "REVOKED".
              required:
                - revokedBy
                - revokedFrom
                - revokedAt
              properties:
                revokedBy:
                    type: string
                    enum:
                      - INICIADORA
                      - USUARIO
                      - DETENTORA
                    example: INICIADORA
                    description: |
                      Quién inició la solicitud de revocación
                      - INICIADORA
                      - USUARIO
                      - DETENTORA
                revokedFrom:
                  type: string
                  enum:
                    - INICIADORA
                    - DETENTORA
                  example: DETENTORA
                  description: |
                    Canal donde se inició el proceso de revocación
                    - INICIADORA
                    - DETENTORA
                revokedAt:
                  type: string
                  format: date-time
                  example: '2021-05-21T08:30:00Z'
                  pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
                  maxLength: 20
                  description: Fecha y hora en que el consentimiento fue revocado
                reason:
                  type: object
                  description: |
                    Información sobre el motivo de la revocación
                  required:
                    - code
                    - detail
                  properties:
                    code:
                      type: string
                      enum:
                        - NAO_INFORMADO
                        - REVOGADO_USUARIO
                        - REVOGADO_RECEBEDOR
                      example: REVOGADO_RECEBEDOR
                      description: |
                        Código indicador del motivo de la revocación
                    detail:
                      type: string
                      pattern: '[\w\W\s]*'
                      maxLength: 2048
                      description: |
                        Detalle sobre el motivo de revocación indicado en el campo `/data/revocation/reason/code`.
                        - NAO_INFORMADO: No informado por la institución detentora de la cuenta;
                        - REVOGADO_USUARIO: El usuario pagador revocó la recurrencia del consentimiento;
                        - REVOGADO_RECEBEDOR: El usuario receptor revocó la recurrencia del consentimiento.
                      example: O usuário rejeitou a autorização do consentimento
            recurringConfiguration:
              $ref: '#/components/schemas/RecurringConfiguration'
            authorisedAtDateTime:
              type: string
              format: date-time
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              minLength: 20
              maxLength: 20
              example: '2021-05-21T08:30:00Z'
              description: |
                Fecha y hora en que el consentimiento fue autorizado.

                [Restricción] Campo de envío obligatorio cuando el consentimiento transite a AUTHORISED.
            updatedAtDateTime:
              type: string
              format: date-time
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              minLength: 20
              maxLength: 20
              example: '2021-05-21T08:30:00Z'
              description: |
                Fecha y hora en que el consentimiento fue actualizado por el usuario pagador.
                El campo debe ser actualizado por el detentor siempre que el consentimiento sea editado.
                En caso de que la edición se realice desde el iniciador, el detentor debe completar con la fecha y hora (UTC) en que recibió la solicitud de edición.
                La edición solo está permitida para el producto Pix automático.
            journey:
              $ref: '#/components/schemas/Journey'
        links:
          $ref: '#/components/schemas/LinkSingle'
        meta:
          $ref: '#/components/schemas/RegulatoryMeta'
