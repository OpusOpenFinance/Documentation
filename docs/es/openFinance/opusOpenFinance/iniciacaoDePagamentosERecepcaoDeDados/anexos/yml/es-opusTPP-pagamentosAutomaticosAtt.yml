              maxLength: 20
              description: |
                Fecha y hora en que el consentimiento tuvo el estado actualizado. Una cadena con fecha y hora conforme a la especificación [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339), siempre con la utilización de la timezone UTC (UTC time format).
