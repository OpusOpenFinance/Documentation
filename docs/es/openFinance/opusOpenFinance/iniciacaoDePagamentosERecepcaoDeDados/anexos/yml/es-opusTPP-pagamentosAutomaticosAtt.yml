        - creationDateTime
        - statusUpdateDateTime
        - status
        - cnpjInitiator
        - payment
        - creditorAccount
        - localInstrument
        - document
      properties:
        recurringPaymentId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9\-]{0,99}$'
          example: TXpRMU9UQTROMWhZV2xSU1FUazJSMDl
          description: |
            Código o identificador único informado por la institución detentora de la cuenta para representar la iniciación de pago. El `recurringPaymentId` debe ser diferente del `endToEndId`.
            Este es el identificador que deberá utilizarse en la consulta del estado de la iniciación de pago efectuada.
        recurringConsentId:
          type: string
          maxLength: 256
          pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
          example: 'urn:bancoex:C1DD33123'
          description: |
            Identificador único del consentimiento creado para la iniciación de pago solicitada. Deberá ser un URN - Uniform Resource Name.
            Un URN, conforme se define en la [RFC8141](https://tools.ietf.org/html/rfc8141), es un Uniform Resource
            Identifier - URI - que se asigna bajo el URI scheme "urn" y un namespace URN específico, con la intención de que el URN
            sea un identificador de recurso persistente e independiente de la ubicación.
            Considerando la cadena urn:bancoex:C1DD33123 como ejemplo de `recurringConsentId` tenemos:
            - el namespace (urn)
            - el identificador asociado al namespace de la institución transmisora (bancoex)
            - el identificador específico dentro del namespace (C1DD33123).
            Información más detallada sobre la construcción de namespaces debe consultarse en la [RFC8141](https://tools.ietf.org/html/rfc8141).

            [Restricción] Este campo es de cumplimentación obligatoria cuando el valor del campo authorisationFlow sea igual a FIDO_FLOW.
        endToEndId:
          $ref: '#/components/schemas/EndToEndId'
        date:
          type: string
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2023-10-10'
          description: Fecha en que el pago será realizado. Una cadena con la utilización de la timezone UTC-3 (UTC time format).
        creationDateTime:
          type: string
          format: date-time
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2020-07-21T08:30:00Z'
          description: |
            Fecha y hora en que el pago fue creado.
            Una cadena con fecha y hora conforme a la especificación [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339),
            siempre con la utilización de la timezone UTC (UTC time format).
        statusUpdateDateTime:
          type: string
          format: date-time
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2020-07-21T08:30:00Z'
          description: |
            Fecha y hora en que el pago tuvo el estado actualizado.
            Una cadena con fecha y hora conforme a la especificación [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339),
            siempre con la utilización de la timezone UTC (UTC time format).
        status:
          $ref: '#/components/schemas/EnumPaymentStatusType'
        rejectionReason:
          $ref: '#/components/schemas/RejectionReason'
        cnpjInitiator:
          type: string
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          maxLength: 14
          example: '50685362000135'
          description: CNPJ del Iniciador de Pago debidamente habilitado para la prestación del Servicio de Iniciación en el Pix.
        payment:
          $ref: '#/components/schemas/PaymentPix'
        remittanceInformation:
          type: string
          maxLength: 140
          pattern: '[\w\W\s]*'
          example: Pagamento da nota RSTO035-002.
          description: |
            Debe completarse siempre que el usuario pagador introduzca alguna información adicional en un pago, a ser enviada al receptor.
        creditorAccount:
          $ref: '#/components/schemas/CreditorAccountPostPixPaymentsResponse'
        debtorAccount:
            $ref: '#/components/schemas/DebtorAccount'
        authorisationFlow:
          type: string
          enum:
            - HYBRID_FLOW
            - CIBA_FLOW
            - FIDO_FLOW
          example: HYBRID_FLOW
          description: |
            Campo condicional utilizado para identificar el flujo de autorización en el que el pago fue solicitado.

            [Restricción] Si CIBA o FIDO, la cumplimentación es obligatoria. En caso de que el campo no esté presente en el payload, se entiende que el flujo de autorización utilizado es el HYBRID_FLOW.
        localInstrument:
          $ref: '#/components/schemas/LocalInstrument'
        proxy:
          type: string
          description: |
            Clave registrada en el DICT perteneciente al receptor. Los tipos de claves pueden ser: teléfono, e-mail, cpf/cnpj o clave aleatoria.
            En el caso de teléfono celular debe informarse en el estándar E.1641. Para e-mail debe tener el formato xxxxxxxx@xxxxxxx.xxx(.xx) y como máximo 77 caracteres.
            En el caso de CPF deberá informarse con 11 números, sin puntos ni guiones. Para el caso de CNPJ deberá informarse con 14 números, sin puntos ni guiones.
            En el caso de clave aleatoria debe informarse el UUID generado por el DICT, conforme al formato especificado en la [RFC4122](https://tools.ietf.org/html/rfc4122).

            [Restricción] Si localInstrument es igual a DICT o INIC, el campo proxy debe completarse.

            [Restricción] Si se informa, la institución detentora de la cuenta debe validar el proxy en el DICT (cuando localInstrument sea igual a DICT) y validar el objeto creditorAccount. Acción opcional en caso de que localInstrument sea igual a INIC

            [Restricción] En caso de que el campo “/data/localInstrument” sea enviado como “MANU”, el campo “/data/proxy” no debe informarse
          pattern: '[\w\W\s]*'
          example: '11221131242'
        transactionIdentification:
          $ref: '#/components/schemas/TransactionIdentification'
        document:
          type: object
          description: Información del documento identificador del receptor de la transacción.
          required:
            - identification
            - rel
          properties:
            identification:
              type: string
              pattern: '^([0-9]{11})$|^([0-9A-Z]{12}[0-9]{2})$'
              minLength: 11
              maxLength: 14
              example: '11111111111111'
              description: |
                Número del documento de identificación oficial del receptor persona natural o jurídica.
                El valor informado debe ser igual a uno de los valores enviados en la etapa de creación del consentimiento (dentro del array “/data/creditors”).
                Cuando no se respete esa regla, el detentor debe devolver, de manera síncrona, el error HTTP 422 - PAGAMENTO_DIVERGENTE_CONSENTIMENTO
            rel:
              type: string
              enum:
                - CPF
                - CNPJ
              example: 'CNPJ'
              description: Tipo del documento de identificación oficial del titular persona natural o jurídica.
        paymentReference:
          $ref: '#/components/schemas/PaymentReference'
