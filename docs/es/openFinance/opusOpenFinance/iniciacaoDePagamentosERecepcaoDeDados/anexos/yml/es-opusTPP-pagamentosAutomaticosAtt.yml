                    (La sucursal es la dependencia destinada a la atención de clientes, del público en general y de los asociados de cooperativas de crédito,
                    en el ejercicio de las actividades de la institución, y no puede ser móvil ni transitoria).

                    [Restricción] Cumplimentación obligatoria para los siguientes tipos de cuenta: CACC (CONTA_DEPOSITO_A_VISTA) y SVGS (CONTA_POUPANCA).
                number:
                  type: string
                  minLength: 1
                  maxLength: 20
                  pattern: '^[0-9]{1,20}$'
                  example: '1234567890'
                  description: |
                    Debe completarse con el número de la cuenta transaccional del usuario pagador, con dígito verificador (si este existe); si hubiera un valor alfanumérico, este debe convertirse a 0.
                accountType:
                  $ref: '#/components/schemas/EnumAccountTypeConsents'
                ibgeTownCode:
                  type: string
                  minLength: 7
                  maxLength: 7
                  pattern: '^\d{7}$'
                  example: '5300108'
                  description: |
                    Campo utilizado por la institución iniciadora para el cálculo del día hábil de liquidación del pago (véase la especificación del endToEndId) basado en el municipio de registro del usuario pagador en el detentor.

                    [Restricciones]
                    Campo de cumplimentación obligatoria cuando el oneOf utilizado de recurringConfiguration sea “automatic”, y el consentimiento pase por el estado AUTHORISED.
            rejection:
              $ref: '#/components/schemas/Rejection'
            revocation:
              type: object
              description: |
                Objeto que contiene la información de revocación de los consentimientos.

                [Restricción] Campo de cumplimentación obligatoria en caso de que el estado del consentimiento sea igual a "REVOKED".
              required:
                - revokedBy
                - revokedFrom
                - revokedAt
              properties:
                revokedBy:
                    type: string
                    enum:
                      - INICIADORA
                      - USUARIO
                      - DETENTORA
                    example: INICIADORA
                    description: |
                      Quién inició la solicitud de revocación
                      - INICIADORA
                      - USUARIO
                      - DETENTORA
                revokedFrom:
                  type: string
                  enum:
                    - INICIADORA
                    - DETENTORA
                  example: DETENTORA
                  description: |
                    Canal donde se inició el proceso de revocación
                    - INICIADORA
                    - DETENTORA
                revokedAt:
                  type: string
                  format: date-time
                  example: '2021-05-21T08:30:00Z'
                  pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
                  maxLength: 20
                  description: Fecha y hora en que el consentimiento fue revocado
                reason:
                  type: object
                  description: |
                    Información sobre el motivo de la revocación
                  required:
                    - code
                    - detail
                  properties:
                    code:
                      type: string
                      enum:
                        - NAO_INFORMADO
                        - REVOGADO_USUARIO
                        - REVOGADO_RECEBEDOR
                      example: REVOGADO_RECEBEDOR
                      description: |
                        Código indicador del motivo de la revocación
                    detail:
                      type: string
                      pattern: '[\w\W\s]*'
                      maxLength: 2048
                      description: |
                        Detalle sobre el motivo de revocación indicado en el campo `/data/revocation/reason/code`.
                        - NAO_INFORMADO: No informado por la institución detentora de la cuenta;
                        - REVOGADO_USUARIO: El usuario pagador revocó la recurrencia del consentimiento;
                        - REVOGADO_RECEBEDOR: El usuario receptor revocó la recurrencia del consentimiento.
                      example: O usuário rejeitou a autorização do consentimento
            recurringConfiguration:
              $ref: '#/components/schemas/RecurringConfiguration'
            authorisedAtDateTime:
              type: string
              format: date-time
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              minLength: 20
              maxLength: 20
              example: '2021-05-21T08:30:00Z'
              description: |
                Fecha y hora en que el consentimiento fue autorizado.

                [Restricción] Campo de envío obligatorio cuando el consentimiento transite a AUTHORISED.
            updatedAtDateTime:
              type: string
              format: date-time
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              minLength: 20
              maxLength: 20
              example: '2021-05-21T08:30:00Z'
              description: |
                Fecha y hora en que el consentimiento fue actualizado por el usuario pagador.
                El campo debe ser actualizado por el detentor siempre que el consentimiento sea editado.
                En caso de que la edición se realice desde el iniciador, el detentor debe completar con la fecha y hora (UTC) en que recibió la solicitud de edición.
                La edición solo está permitida para el producto Pix automático.
            approvalDueDate:
              description: |
                Representa la fecha máxima para la aprobación de un consentimiento que se encuentra (o pasó) por el estado PARTIALLY_ACCEPTED. La aprobación debe ocurrir hasta las 23:59h del día informado; en caso contrario, el consentimiento debe ser rechazado.

                [Restricción]
                Debe ser completado por la institución detentora siempre que un consentimiento esté (o haya pasado) en el estado PARTIALLY_ACCEPTED
              type: string
              format: date
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
              example: '2024-12-25'
            journey:
              $ref: '#/components/schemas/Journey'
        links:
          $ref: '#/components/schemas/LinkSingle'
        meta:
          $ref: '#/components/schemas/RegulatoryMeta'
    ResponseRecurringConsentPatch:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: object
          description: Objeto que contiene la información de consentimiento para la iniciación de pago individual.
          required:
            - recurringConsentId
            - statusUpdateDateTime
            - status
