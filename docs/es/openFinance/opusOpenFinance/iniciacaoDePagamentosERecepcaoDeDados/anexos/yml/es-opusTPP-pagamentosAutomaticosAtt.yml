                - number
                - accountType
              properties:
                ispb:
                  type: string
                  minLength: 8
                  maxLength: 8
                  pattern: '^[0-9A-Z]{8}$'
                  example: '12345678'
                  description: |
                    Debe completarse con el ISPB (Identificador del Sistema de Pagos Brasileño) del participante del SPI (Sistema de pagos instantáneos), únicamente con números.
                issuer:
                  type: string
                  minLength: 1
                  maxLength: 4
                  pattern: '^[0-9]{1,4}$'
                  example: '1774'
                  description: |
                    Código de la sucursal emisora de la cuenta sin dígito.
                    (La sucursal es la dependencia destinada a la atención de clientes, del público en general y de los asociados de cooperativas de crédito,
                    en el ejercicio de las actividades de la institución, y no puede ser móvil ni transitoria).

                    [Restricción] Cumplimentación obligatoria para los siguientes tipos de cuenta: CACC (CONTA_DEPOSITO_A_VISTA) y SVGS (CONTA_POUPANCA).
                number:
                  type: string
                  minLength: 1
                  maxLength: 20
