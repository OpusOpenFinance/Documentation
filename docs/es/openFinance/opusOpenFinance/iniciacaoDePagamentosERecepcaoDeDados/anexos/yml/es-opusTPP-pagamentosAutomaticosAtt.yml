          schema:
            type: string
          required: true
          example: D730A10D6784379085391417F3EF657C1247B2B3645210DD97F739B33B349376
      description: |
        Método proxy para revocar una iniciación de pago. Sigue el estándar de solicitud/respuesta definido en la documentación oficial ([Open Finance - API Payment Initiation](https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/198410569/SV+API+-+Pagamentos+Autom+ticos)), versión 2.2.0.

        Ese endpoint debe usarse para cancelar las transacciones que se encuentren en una de las siguientes situaciones:
        programada con éxito (SCHD), retenida para análisis (PDNG). En caso de que la solicitud sea exitosa, la transacción pasa a la situación CANC.

        En caso de que el estado del pago sea diferente de SCHD/PDNG o alguna otra regla de negocio impida la cancelación, la solicitud PATCH devuelve
        HTTP Status 422 con el code PAGAMENTO_NAO_PERMITE_CANCELAMENTO.

        En caso de que reciba un 422, la institución iniciadora debe hacer una solicitud GET del pago para verificar su situación actual, así como los detalles asociados.

        [Restricción] Para el Pix automático (“recurringConfiguration” igual a “automatic”), tanto el receptor como el pagador podrán realizar la cancelación,
        permitiéndose al receptor la solicitud de cancelación hasta las 22:00 (hora de Brasilia) y al pagador hasta las 23:59 (hora de Brasilia) del día anterior a la fecha de efectivización del pago,
        excepto para los casos de nuevos intentos en días subsiguientes, donde solo el receptor puede cancelar, también hasta las 22:00h.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchPixPayment'
