    EnumPaymentCancellationStatusType:
      type: string
      enum:
        - CANC
      example: CANC
      description: |
        Estado al cual el pago deberá transitar
    EnumPaymentPersonType:
      type: string
      enum:
        - PESSOA_NATURAL
        - PESSOA_JURIDICA
      example: PESSOA_NATURAL
      description: |
        Titular, persona natural o jurídica a quien se refieren los datos del receptor (creditor).
    EnumPaymentStatusType:
      type: string
      enum:
        - RCVD
        - CANC
        - ACCP
        - ACPD
        - RJCT
        - ACSC
        - PDNG
        - SCHD
      example: PDNG
      description: |
        Estado actual del pago. El estado evoluciona en el siguiente orden:
        - RCVD (Received) - Indica que la solicitud de pago fue recibida con éxito por la institución detentora, pero aún hay validaciones por realizar antes de ser presentada para liquidación.
        - CANC (Cancelled) - Indica que la transacción Pix pendiente fue cancelada con éxito por el usuario antes de que fuera confirmada (ACCP) o rechazada (RJCT) por la institución detentora.
        - ACCP( Accepted Customer Profile) - Indica que todas las verificaciones necesarias ya fueron realizadas por la institución detentora y que la transacción está lista para ser enviada a liquidación (en el SPI si es un Pix a otra institución o internamente si es a otra cuenta en la misma institución).
        - ACPD (Accepted Clearing Processed) - Indica que la institución detentora ya presentó la transacción para liquidación, pero aún no tiene la confirmación de si fue liquidada o rechazada.
        - RJCT (Rejected) Indica que la transacción fue rechazada por la institución detentora o por el SPI.
        - ACSC (Accepted Settlement Completed Debitor Account) - Indica que la transacción fue efectivizada por la institución detentora o por el SPI.
        - PDNG (Pending) - Indica que la institución detentora retuvo temporalmente la transacción Pix para análisis. No se aplica a Transferencias inteligentes.
        - SCHD (Scheduled) - Indica que la transacción Pix fue programada con éxito en la institución detentora.
        En caso de fracaso:
        - RJCT (REJECTED) - Instrucción de pago rechazada.
