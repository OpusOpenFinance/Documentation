          $ref: '#/components/schemas/PaymentReference'
    PaymentReference:
      type: string
      example: 'R/2025-09-23/P1M'
      description: |
        [Restricción] Campo de cumplimentación obligatoria en caso de que sea un pago de Pix automático, y debe enviarse a efectos de recolección de métricas del ecosistema. En caso de que esa regla no se respete, la institución detentora de la cuenta debe devolver un error HTTP 422 con el código DETALHE_PAGAMENTO_INVALIDO.
        La cumplimentación debe seguir la siguiente lógica:
        - Primer Pago: Si es el pago inicial especificado en el campo /data/firstPayment, complete el campo con la cadena fija "zero".
        - Pagos Recurrentes (Subsiguientes): Para todos los pagos recurrentes después del inicial, el campo paymentReference debe completarse con una cadena ISO 8601 en el formato ```R/<start>/<duration>```, representando el ciclo exacto que está siendo pagado.
          - ```R```, siguiendo el estándar ISO8601 para representar la recurrencia única del ciclo que se inició en el día informado en el componente ```<start>```.
          - El componente ```<start>``` debe ser la fecha de inicio del ciclo específico, en el formato ```YYYY-MM-DD```, al cual se refiere el pago que está siendo enviado.
          - El componente ```<duration>``` representa el intervalo de ciclos definido para el consentimiento autorizado (P1W para semanal, P1M para mensual, P3M para trimestral, P6M para semestral y P1Y para anual).
            - Ejemplos:
              - 1: Fecha de inicio del ciclo definido en el consentimiento: 23/07/25
                - Periodicidad definida en el consentimiento: Semanal
                - Cumplimentación del paymentReference:
                - Primer ciclo: R/2025-07-23/P1W
                - Segundo ciclo:  R/2025-07-30/P1W
                - Tercer ciclo: R/2025-08-06/P1W
              - 2: Fecha de inicio del ciclo definido en el consentimiento: 23/07/25
                - Periodicidad definida en el consentimiento: Mensual
                - Cumplimentación del paymentReference:
                - Primer ciclo: R/2025-07-23/P1M
                - Segundo ciclo: R/2025-08-23/P1M
                - Tercer ciclo: R/2025-09-23/P1M
