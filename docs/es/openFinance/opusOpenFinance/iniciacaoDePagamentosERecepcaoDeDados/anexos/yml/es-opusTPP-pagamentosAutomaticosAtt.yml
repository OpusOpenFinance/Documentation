                  - PAGAMENTO_NAO_PERMITE_CANCELAMENTO: El pago está con un estado que no permite cancelación.
                  - CANCELAMENTO_FORA_PERIODO_PERMITIDO: El usuario solicitó la cancelación fuera de la ventana de tiempo permitida.
                  - PARAMETRO_INVALIDO: Los parámetros informados no obedecen el formato especificado.
                  - PARAMETRO_NAO_INFORMADO: Alguno o todos los campos obligatorios no fueron informados.
              title:
                type: string
                maxLength: 255
                pattern: '[\w\W\s]*'
                example: O pagamento está com um status que não permite o cancelamento.
                description: |
                  - PAGAMENTO_NAO_PERMITE_CANCELAMENTO: El pago está con un estado que no permite cancelación.
                  - CANCELAMENTO_FORA_PERIODO_PERMITIDO: El usuario solicitó la cancelación fuera de la ventana de tiempo permitida.
                  - PARAMETRO_INVALIDO: Los parámetros informados no obedecen el formato especificado.
                  - PARAMETRO_NAO_INFORMADO: Alguno o todos los campos obligatorios no fueron informados.
              detail:
                type: string
                maxLength: 2048
                pattern: '[\w\W\s]*'
                example: O pagamento está com um status que não permite o cancelamento.
                description: |
                  - PAGAMENTO_NAO_PERMITE_CANCELAMENTO: El pago está con un estado que no permite cancelación.
                  - CANCELAMENTO_FORA_PERIODO_PERMITIDO: El usuario solicitó la cancelación fuera de la ventana de tiempo permitida.
                  - PARAMETRO_INVALIDO: Los parámetros informados no obedecen el formato especificado.
                  - PARAMETRO_NAO_INFORMADO: Alguno o todos los campos obligatorios no fueron informados.
        meta:
          $ref: '#/components/schemas/RegulatoryMeta'
    XFapiInteractionId:
      type: string
      format: uuid
      minLength: 1
      maxLength: 36
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      example: d78fc4e5-37ca-4da3-adf2-9b082bf92280
    XV:
      type: string
      pattern: '^\d+\.\d+\.\d+$'
      example: 1.0.0
  headers:
    xOriginError:
      description: Indica el origen del error.
      schema:
        $ref: '#/components/schemas/EnumOriginError'
      required: false
    xErrorSourceUrl:
      description: URL de la llamada que originó el error, presente solo cuando `x-origin-error` = `participant`.
      schema:
        type: string
      required: false
    xRegulatoryV:
      description: Versión regulatoria deseada para la llamada al participante (disponible solo en rutas no-proxy).
      schema:
        $ref: '#/components/schemas/RegulatoryVersion'
      required: false
    xSelectedRegulatoryV:
      description: Versión regulatoria efectivamente utilizada en la solicitud al participante.
      schema:
        $ref: '#/components/schemas/SelectedRegulatoryVersion'
      required: true
    xFapiInteractionIdResponse:
      description: |
        Un UUID [RFC4122](https://tools.ietf.org/html/rfc4122) usado como ID de correlación entre request y response. Campo de generación y envío obligatorio por la institución iniciadora (client), y su valor debe ser “espejado” por la institución detentora (server) en el encabezado de respuesta.
      schema:
        $ref: '#/components/schemas/XFapiInteractionId'
      required: true
    xV:
      description: |
        Encabezado que indica la versión implementada de la API por la institución financiera para atender la solicitud. Debe completarse de forma completa, por ejemplo: x-v : 1.0.2.
      required: true
      schema:
        $ref: '#/components/schemas/XV'
  parameters:
    applicationId:
      name: x-application-id
      in: header
      required: true
      description: Identificador de la aplicación que realiza la solicitud
      schema:
        $ref: '#/components/schemas/UUID'
    authorisationServerId:
      name: x-authorisation-server-id
      required: true
      description: Identificador del Authorisation Server de la institución transmisora del consentimiento, obtenido mediante la consulta de la lista de participantes
      in: header
      schema:
        $ref: '#/components/schemas/UUID'
    headerRecurringConsentId:
      name: x-recurring-consent-id
      required: true
      in: header
      description: Identificador del consentimiento a utilizar en esta operación, obtenido en la respuesta de su creación
      schema:
        type: string
        pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
        maxLength: 256
      example: 'urn:bancox:f865cd66-392a-420b-9ff0-1b6d7cc60ee0'
    recurringConsentId:
      name: recurringConsentId
      required: true
      in: path
      description: |
        El recurringConsentId es el identificador único del consentimiento de larga duración y deberá ser un URN - Uniform Resource Name.
        Un URN, conforme se define en la RFC8141, es un Uniform Resource Identifier - URI - que se asigna bajo el URI scheme "urn" y un namespace URN específico, con la intención de que el URN sea un identificador de recurso persistente e independiente de la ubicación.
        Considerando la cadena urn:bancoex:C1DD33123 como ejemplo de recurringConsentId tenemos:
        - namespace (urn)
        - identificador asociado al namespace de la institución detentora (bancoex).
        - identificador específico dentro del namespace (C1DD33123).
        Información más detallada sobre la construcción de namespaces debe consultarse en la RFC8141.
      schema:
        type: string
        pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
        maxLength: 256
      example: 'urn:bancox:f865cd66-392a-420b-9ff0-1b6d7cc60ee0'
    authorisationFlowIntent:
      name: x-authorisation-flow-intent
      required: false
      description: Indicador de cuál será el modelo de aprobación del consentimiento de pago
      in: header
      schema:
        $ref: '#/components/schemas/EnumAuthorisationFlowIntent'
    regulatoryV:
        name: x-regulatory-v
        required: false
        description: Versión regulatoria deseada para la llamada al participante (disponible solo en rutas no-proxy).
        in: header
        schema:
          $ref: '#/components/schemas/RegulatoryVersion'
    authorizationHeader:
      name: Authorization
      in: header
      description: Encabezado HTTP estándar. Permite que las credenciales se proporcionen dependiendo del tipo de recurso solicitado
      required: true
      schema:
        type: string
        pattern: '[\w\W\s]*'
        minLength: 1
        maxLength: 2048
    xCustomerUserAgent:
      name: x-customer-user-agent
      in: header
      description: Indica el user-agent que utiliza el usuario.
      required: false
      schema:
        type: string
        pattern: '[\w\W\s]*'
        minLength: 1
        maxLength: 100
    xFapiAuthDate:
      name: x-fapi-auth-date
      in: header
      description: 'Fecha en que el usuario se conectó por última vez con el iniciador. Representada de acuerdo con la [RFC7231](https://tools.ietf.org/html/rfc7231). Ejemplo: Sun, 10 Sep 2017 19:43:31 UTC'
      required: false
      schema:
        type: string
        pattern: '^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), \d{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) \d{4} \d{2}:\d{2}:\d{2} (GMT|UTC)$'
        minLength: 29
        maxLength: 29
    xFapiCustomerIpAddress:
      name: x-fapi-customer-ip-address
      in: header
      description: La dirección IP del usuario si se encuentra actualmente conectado con el iniciador.
      required: false
      schema:
        type: string
        pattern: '[\w\W\s]*'
        minLength: 1
        maxLength: 100
    xFapiInteractionId:
      name: x-fapi-interaction-id
      in: header
      description: Un UUID [RFC4122](https://tools.ietf.org/html/rfc4122) usado como ID de correlación entre request y response. Campo de generación y envío obligatorio por la institución iniciadora (client), y su valor debe ser “espejado” por la institución detentora (server) en el encabezado de respuesta. En caso de que no se reciba o de que se reciba un valor inválido, la institución detentora debe generar un x-fapi-interaction-id y devolverlo en la respuesta con el HTTP status code 400. La institución iniciadora debe acatar el valor recibido de la detentora.
      required: true
      schema:
        type: string
        format: uuid
        minLength: 1
        maxLength: 36
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        example: d78fc4e5-37ca-4da3-adf2-9b082bf92280
    xIdempotencyKey:
      name: x-idempotency-key
      in: header
      description: Encabezado HTTP personalizado. Identificador de solicitud exclusivo para soportar la idempotencia.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 40
        pattern: ^(?!\s)(.*)(\S)$
    startDate:
      name: startDate
      in: query
      description: Fecha inicial de corte de la ocurrencia del pago ligada al consentimiento de larga duración.
      required: false
      schema:
        type: string
        pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
        minLength: 10
        maxLength: 10
    endDate:
      name: endDate
      in: query
      description: Fecha final de corte para la recuperación de la ocurrencia del pago ligada al consentimiento de larga duración.
      required: false
      schema:
        type: string
        pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
        minLength: 10
        maxLength: 10
    originalRecurringPaymentIdQuery:
      name: originalRecurringPaymentId
      in: query
      description: |
        Campo que contiene el código o el identificador del intento original de pago que falló.
        Código o identificador único creado por la institución detentora de la cuenta para representar la iniciación de pago.
        En caso de que se informe, deben devolverse todos los pagos asociados al identificador informado, siendo estos el pago original (dueño del identificador) y los nuevos intentos que enviaron el identificador en su solicitud, indicando que representan un nuevo intento.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9\-]{0,99}$
        example: TXpRMU9UQTROMWhZV2xSU1FUazJSMDl
