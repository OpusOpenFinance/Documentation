            authorisedAtDateTime:
              type: string
              format: date-time
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              minLength: 20
              maxLength: 20
              example: '2021-05-21T08:30:00Z'
              description: |
                Fecha y hora en que el consentimiento fue autorizado.

                [Restricción] Campo de envío obligatorio cuando el consentimiento transite a AUTHORISED.
            updatedAtDateTime:
