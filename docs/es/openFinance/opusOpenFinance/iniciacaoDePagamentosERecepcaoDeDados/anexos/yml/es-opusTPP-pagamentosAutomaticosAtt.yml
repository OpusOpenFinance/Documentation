            creationDateTime:
              description: Fecha y hora en que el consentimiento fue creado. Una cadena con fecha y hora conforme a la especificación [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339), siempre con la utilización de la timezone UTC (UTC time format).
              type: string
              format: date-time
              example: '2021-05-21T08:30:00Z'
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              maxLength: 20
            expirationDateTime:
              description: |
                Fecha y hora en que el consentimiento debe dejar de ser válido. Una cadena con fecha y hora conforme a la especificación [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339), siempre con la utilización de la timezone UTC (UTC time format).

                [Restricción] En caso de que el consentimiento sea para Pix Automático ("automatic" seleccionado en el oneOf "/data/recurringConfiguration/"), la hora de expiración del consentimiento debe ser a las 23:59:59 (UTC).
              type: string
              format: date-time
              example: '2021-05-21T08:30:00Z'
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              maxLength: 20
            additionalInformation:
              description: Debe completarse siempre que el usuario pagador introduzca alguna información adicional en el consentimiento
