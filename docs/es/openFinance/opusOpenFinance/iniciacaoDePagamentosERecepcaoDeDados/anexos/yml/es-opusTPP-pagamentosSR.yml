      description: 'un UUID [RFC4122](https://tools.ietf.org/html/rfc4122) usado como un ID de correlación entre request y
        response. campo de generación y envío obligatorio por la iniciadora de pagos (client) y o seu valor debe ser "reflejado"
        por la institución titular (server) en el cabecera de respuesta.

        '
      schema:
        $ref: '#/components/schemas/XFapiInteractionId'
      required: true
    xV:
      description: 'cabecera que indica a versión implementada de la API por la institución financeira para atender a la solicitud.
