      - $ref: '#/components/parameters/authorisationServerId'
      - $ref: '#/components/parameters/enrollmentId'
      - $ref: '#/components/parameters/authorizationHeader'
      - $ref: '#/components/parameters/xFapiAuthDate'
      - $ref: '#/components/parameters/xFapiCustomerIpAddress'
      - $ref: '#/components/parameters/xFapiInteractionId'
      - $ref: '#/components/parameters/xCustomerUserAgent'
      - $ref: '#/components/parameters/xIdempotencyKey'
      responses:
        '502':
          description: Error en Opus Open Client al comunicarse con la institución titular de la cuenta
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Tiempo de conexión agotado al comunicarse con la institución titular de la cuenta
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '204':
          description: Credenciales FIDO2 validadas y asociadas a la vinculación de cuenta.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/xFapiInteractionIdResponse'
            x-v:
              $ref: '#/components/headers/xV'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
        '400':
          description: A solicitud fue malformada, omitindo atributos obligatorios, seja en el payload o mediante de atributos
            en la URL.
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '422':
          description: 'A solicitud fue bien formada, mas no pôde ser procesada debido a la lógica de negocios específica
            de la solicitud.

            A fallo de verificación de la credencial FIDO2 debe causar a rechazo del vinculación de cuenta por parte de la
            institución titular, una vez que no es posible reusar un mesmo "challenge" para más de un registro.

            '
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422ResponseErrorFidoRegistration'
        default:
          description: Segue o estándar de respuesta definido por el BACEN
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /proxy/open-banking/enrollments/v2/consents/{consentId}/authorise:
    post:
      tags:
      - Consentimiento
      operationId: authorizeConsent
      description: 'autorización de un consentimiento de pagos en status `AWAITING_AUTHORISATION` a partir del access_token
        emitido por la flujo sin redirección y envío de señales de risco.

        para pagos de niveles de aprobación únicas, o consentimiento de pago debe transitar al status `AUTHORISED` en la execução
        con sucesso desse método.

        para pagos con múltiples niveles de aprobación aprovadoras, o consentimiento de pago ficará en `PARTIALLY_ACCEPTED`
        hasta que todos tenham autorizado.

        en caso de fallo de negocio (HTTP Status Code 422), o consentimiento de pago precisa transitar para o status `REJECTED`
        y seguir os motivos de rechazo presentes en la API de pagos.

        caso a institución titular identifique que a cuenta de débito informada por el iniciador en la creación del consentimiento
        difiere de la cuenta de débito vinculada al dispositivo, o detentor debe devolver o error HTTP 422 con código `CONTA_DEBITO_DIVERGENTE_CONSENTIMENTO_VINCULO`
        y rechazar o consentimiento con o motivo `CONTA_NAO_PERMITE_PAGAMENTO`.

        si o iniciador, durante a creación del consentimiento, omitir a cuenta de débito, o detentor debe considerar a cuenta
        de débito asociada al vinculación para o relleno del objeto `/data/debtorAccount`, presente en el consentimiento,
        após a sua autorización.

        Os límites relacionados al vinculación deben ser validados solo en momento de liquidación del pago, independiente
        dele ser programado o inmediato.

        '
      summary: Autorización de un consentimiento de pagos en el flujo sin redirección
      externalDocs:
        description: Open Finance - API Enrollments for Payment Initiation
        url: https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/141557761/SV+API+-+Pagamentos+sem+Redirecionamento
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentAuthorization'
      parameters:
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/authorisationServerId'
      - $ref: '#/components/parameters/consentId'
      - $ref: '#/components/parameters/authorizationHeader'
      - $ref: '#/components/parameters/xFapiAuthDate'
      - $ref: '#/components/parameters/xFapiCustomerIpAddress'
      - $ref: '#/components/parameters/xFapiInteractionId'
      - $ref: '#/components/parameters/xCustomerUserAgent'
      - $ref: '#/components/parameters/xIdempotencyKey'
      - $ref: '#/components/parameters/xBcbNfc'
      responses:
        '502':
          description: Error en Opus Open Client al comunicarse con la institución titular de la cuenta
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Tiempo de conexión agotado al comunicarse con la institución titular de la cuenta
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '204':
          description: Señales de riesgo recibidas correctamente.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/xFapiInteractionIdResponse'
            x-v:
              $ref: '#/components/headers/xV'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
        '400':
          description: A solicitud fue malformada, omitindo atributos obligatorios, seja en el payload o mediante de atributos
            en la URL.
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '422':
          description: A solicitud fue bien formada, mas no pôde ser procesada debido a la lógica de negocios específica de
            la solicitud.
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422ResponseConsentsAuthorization'
        default:
          description: Segue o estándar de respuesta definido por el BACEN
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /proxy/open-banking/enrollments/v2/recurring-consents/{recurringConsentId}/authorise:
    post:
      tags:
      - Pix Automático
      operationId: authorizeRecurringConsent
      description: 'autorización de un consentimiento de Pix automático en status AWAITING_AUTHORISATION a partir del access_token
        emitido por la flujo sin redirección y envío de señales de risco. Consentimientos de niveles de aprobación únicas
        deben transitar para o status AUTHORISED en la execução con sucesso desse método. para consentimientos con múltiples
        niveles de aprobación aprovadoras, o consentimiento deberá permanecer en PARTIALLY_ACCEPTED hasta que todos os aprobadores
        tenham autorizado. en caso de fallo de negocio (HTTP Status Code 422), o consentimiento de pago debe transitar para
        o status REJECTED y seguir os motivos de rechazo presentes en la API de pagos automáticos.

        caso a institución titular identifique que a cuenta de débito informada por el iniciador en la creación del consentimiento
        difiere de la cuenta de débito vinculada al dispositivo, o detentor debe devolver neste método o error HTTP 422 con
        código CONTA_DEBITO_DIVERGENTE_CONSENTIMENTO_VINCULO y rechazar o consentimiento con o motivo CONTA_NAO_PERMITE_PAGAMENTO.

        si o iniciador, durante a creación del consentimiento, omitir a cuenta de débito, o detentor debe considerar a cuenta
        de débito asociada al vinculación autorizado para o relleno del objeto /fecha/debtorAccount, presente en el consentimiento.

        Os límites relacionados al vinculación no deben ser validados durante o proceso de autorización deste consentimiento
        nem durante o ciclo de vida.

        '
      summary: Autorización de un consentimiento de Pix Automático en el flujo sin redirección
      externalDocs:
        description: Open Finance - API Enrollments for Payment Initiation
        url: https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/141557761/SV+API+-+Pagamentos+sem+Redirecionamento
