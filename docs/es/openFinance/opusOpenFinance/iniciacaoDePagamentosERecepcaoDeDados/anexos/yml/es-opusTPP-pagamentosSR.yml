openapi: 3.0.0
info:
  title: OpusTPP - Pagos sin Redirección
  description: 'OpusTPP - Núcleo de gestión de dispositivos vinculados a cuentas


    # Iniciación de Transacciones de Pago sin Redirección


    familia de API para permitir o pago sin redirección via Open Finance Brasil.

    permite tanto o gestión de los dispositivos vinculados as cuentas sobre a autorización de consentimientos creados via
    flujo sin redirección.'
  version: 1.0.0
tags:
- name: Vinculación de dispositivo
  description: Gestión de los dispositivos vinculados a las cuentas
- name: Consentimiento
  description: Autorización de consentimientos creados mediante el flujo sin redirección.
- name: Pix Automático
  description: autorización de consentimientos de Pix automático creados via flujo sin redirección.
servers:
- url: https://open-finance-core.instituicao.com.br
paths:
  /opus-open-finance/enrollments/v1/enrollments:
    post:
      tags:
      - Vinculación de dispositivo
      operationId: postEnrollments
      description: método para crear una nueva vinculación de cuenta. Devuelve un enrollment en estado AWAITING_RISK_SIGNALS.
      summary: Crear vinculación de cuenta.
      externalDocs:
        description: Open Finance - API Enrollments for Payment Initiation
        url: https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/141557761/SV+API+-+Pagamentos+sem+Redirecionamento
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentRequest'
      parameters:
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/authorisationServerId'
      - $ref: '#/components/parameters/regulatoryV'
      responses:
        '502':
          description: Error en Opus Open Client al comunicarse con la institución titular de la cuenta
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Tiempo de conexión agotado al comunicarse con la institución titular de la cuenta
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '201':
          description: Datos de la vinculación de cuenta obtenidos correctamente.
          headers:
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEnrollmentResponse'
        '400':
          description: Error enviado por la institución titular de la cuenta, siguiendo el estándar definido por BACEN
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        default:
          description: Error enviado por la institución titular de la cuenta, siguiendo el estándar definido por BACEN
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
