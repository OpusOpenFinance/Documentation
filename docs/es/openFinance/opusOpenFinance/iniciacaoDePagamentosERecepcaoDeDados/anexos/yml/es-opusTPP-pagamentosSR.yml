      in: path
      description: 'O consentId es o identificador único del consentimiento y deberá ser un URN - Uniform Resource Name.

        un URN, según definido en la [RFC8141](https://tools.ietf.org/html/rfc8141) es un Uniform Resource

        Identifier - URI - que es asignado sob o URI scheme "urn" y un namespace URN específico, con a intenção de que o URN

