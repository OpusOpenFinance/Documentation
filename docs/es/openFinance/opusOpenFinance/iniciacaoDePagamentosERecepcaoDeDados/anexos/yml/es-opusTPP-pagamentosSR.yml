    patch:
      tags:
      - Vinculación de dispositivo
      operationId: deleteEnrollment
      description: 'método para revocar o rechazar un vinculación de cuenta. Após a execução con sucesso deste método irreversível,
        o vinculación de cuenta

        no poderá más ser utilizado para autenticación nem autorización de iniciación de pagos.

        Os conceitos de revocación y rechazo estão asociados a la máquina de estados del vinculación de cuenta\:


        • revocación: cancelación de un vinculación de cuenta en el status "AUTHORISED";


        • rechazo: cancelación del vinculación de cuenta en los status "AWATING_RISK_SIGNALS", "AWATING_ENROLLMENT" y "AWAITING_ACCOUNT_HOLDER_VALIDATION"


        Cabe al cliente desta API distinguir entre os dois escenarios para determinar o motivo adequado.

        '
      summary: Revocar o rechazar la vinculación de cuenta.
      externalDocs:
        description: Open Finance - API Enrollments for Payment Initiation
        url: https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/141557761/SV+API+-+Pagamentos+sem+Redirecionamento
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchEnrollmentRequest'
      parameters:
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/authorisationServerId'
      - $ref: '#/components/parameters/enrollmentId'
      responses:
        '502':
          description: Error en Opus Open Client al comunicarse con la institución titular de la cuenta
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Tiempo de conexión agotado al comunicarse con la institución titular de la cuenta
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '204':
          description: Vinculación de cuenta revocada correctamente.
          headers:
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
        '400':
          description: Error enviado por la institución titular de la cuenta, siguiendo el estándar definido por BACEN
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        default:
          description: Error enviado por la institución titular de la cuenta, siguiendo el estándar definido por BACEN
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
