        - Uniform Resource Name.

        un URN, según definido en la [RFC8141](https://tools.ietf.org/html/rfc8141) es un Uniform Resource

        Identifier - URI - que es asignado sob o URI scheme "urn" y un namespace URN específico, con a intenção de que o URN

        seja un identificador de recurso persistente y independe de la ubicación.

        considerando a string urn:bancoex:C1DD33123 como exemplo para `recurringConsentId` temos:

        - o namespace(urn)

        - o identificador asociado al namespace de la institución institución titular (bancoex).

        - o identificador específico dentro del namespace (C1DD33123).

        información más detalladas sobre a construcción de namespaces deben ser consultadas en la [RFC8141](https://tools.ietf.org/html/rfc8141).

        '
      required: true
      schema:
        type: string
        pattern: ^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*'%\/?#]+$
        maxLength: 256
    regulatoryV:
      name: x-regulatory-v
      required: false
      description: Versión regulatoria deseada para la llamada al participante (disponible solo en rutas no proxy).
      in: header
      schema:
        $ref: '#/components/schemas/RegulatoryVersion'
    authorizationHeader:
      name: Authorization
      in: header
      description: Cabecera HTTP estándar. Permite proporcionar credenciales según el tipo de recurso solicitado
      required: true
      schema:
        type: string
        pattern: '[\w\W\s]*'
        maxLength: 2048
    xCustomerUserAgent:
      name: x-customer-user-agent
      in: header
      description: Indica el user-agent utilizado por el usuario.
      required: false
      schema:
        type: string
        pattern: '[\w\W\s]*'
        minLength: 1
        maxLength: 100
    xFapiAuthDate:
      name: x-fapi-auth-date
      in: header
      description: 'Fecha en que el usuario inició sesión por última vez con la iniciadora de pagos de pagos. Representada
        de acordo con a [RFC7231](https://tools.ietf.org/html/rfc7231).Exemplo: Sun, 10 Sep 2017 19:43:31 UTC'
      required: false
      schema:
        type: string
        pattern: ^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), \d{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) \d{4} \d{2}:\d{2}:\d{2}
          (GMT|UTC)$
        minLength: 29
        maxLength: 29
    xFapiCustomerIpAddress:
      name: x-fapi-customer-ip-address
      in: header
      description: La dirección IP del usuario si está actualmente conectado a la iniciadora de pagos.
      required: false
      schema:
        type: string
        pattern: '[\w\W\s]*'
        minLength: 1
        maxLength: 100
    xFapiInteractionId:
      name: x-fapi-interaction-id
      in: header
      description: un UUID [RFC4122](https://tools.ietf.org/html/rfc4122) usado como un ID de correlación entre request y
        response. campo de generación y envío obligatorio por la iniciadora de pagos (client) y o seu valor debe ser "reflejado"
        por la institución titular (server) en el cabecera de respuesta. caso no seja recibido o si for recibido un valor
        inválido, a institución titular debe gerar un x-fapi-interaction-id y retorná-lo en la respuesta con o HTTP status
        code 400. A iniciadora de pagos debe acatar o valor recibido de la institución titular.
      required: true
      schema:
        type: string
        format: uuid
        minLength: 1
        maxLength: 36
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        example: d78fc4e5-37ca-4da3-adf2-9b082bf92280
    xIdempotencyKey:
      name: x-idempotency-key
      in: header
      description: Cabecera HTTP personalizada. Identificador de solicitud único para admitir la idempotencia.
      required: true
      schema:
        type: string
        maxLength: 40
        pattern: ^(?!\s)(.*)(\S)$
    xBcbNfc:
      name: x-bcb-nfc
      in: header
      description: O campo representa una transacción iniciada via NFC. O envío desse campo es obligatorio nesse cenário.
        As detentoras deben almacenar a información y correlacioná-la con o consentimiento y o pago originado.
      required: false
      schema:
        type: boolean
