  /proxy/open-banking/enrollments/v2/enrollments/{enrollmentId}/fido-registration-options:
    post:
      tags:
      - Vinculación de dispositivo
      operationId: enrollmentCreateFidoRegistrationOptions
      description: 'método para obtener os parâmetros para creación de una nueva credencial FIDO2. un nuevo challenge debe
        ser creado a cada llamada.

        Os parâmetros de la respuesta deben ser compatíveis con a definição [W3C](https://www.w3.org/TR/webauthn-2/#dictionary-makecredentialoptions)

        '
      summary: obtener parâmetros para creación de credenciales FIDO2.
      externalDocs:
        description: Open Finance - API Enrollments for Payment Initiation
        url: https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/141557761/SV+API+-+Pagamentos+sem+Redirecionamento
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentFidoOptionsRequest'
      parameters:
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/authorisationServerId'
      - $ref: '#/components/parameters/enrollmentId'
      - $ref: '#/components/parameters/authorizationHeader'
      - $ref: '#/components/parameters/xFapiAuthDate'
      - $ref: '#/components/parameters/xFapiCustomerIpAddress'
      - $ref: '#/components/parameters/xFapiInteractionId'
      - $ref: '#/components/parameters/xCustomerUserAgent'
      - $ref: '#/components/parameters/xIdempotencyKey'
      responses:
        '502':
          description: Error en Opus Open Client al comunicarse con la institución titular de la cuenta
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Tiempo de conexión agotado al comunicarse con la institución titular de la cuenta
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '201':
          description: Datos para crear una nueva credencial FIDO2.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/xFapiInteractionIdResponse'
            x-v:
              $ref: '#/components/headers/xV'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentFidoRegistrationOptions'
        '400':
          description: A solicitud fue malformada, omitindo atributos obligatorios, seja en el payload o mediante de atributos
            en la URL.
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '422':
          description: A solicitud fue bien formada, mas no pôde ser procesada debido a la lógica de negocios específica de
            la solicitud.
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422ResponseErrorFidoRegistrationOptions'
        default:
          description: Segue o estándar de respuesta definido por el BACEN
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /proxy/open-banking/enrollments/v2/enrollments/{enrollmentId}/fido-registration:
    post:
      tags:
      - Vinculación de dispositivo
      operationId: enrollmentRegisterFidoCredential
      description: 'O vinculación de cuenta debe estar en el status "AWAITING_ENROLLMENT".

        Após o registro con sucesso, o vinculación de cuenta debe transitar al status "AUTHORISED".

        A fallo de verificación de la credencial FIDO2 debe causar a rechazo del vinculación de cuenta por parte de la institución
        titular, una vez que no es posible reusar un mesmo "challenge" para más de un registro.

        '
      summary: Asociación de la credencial FIDO2 a la vinculación de cuenta.
      externalDocs:
        description: Open Finance - API Enrollments for Payment Initiation
        url: https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/141557761/SV+API+-+Pagamentos+sem+Redirecionamento
      requestBody:
