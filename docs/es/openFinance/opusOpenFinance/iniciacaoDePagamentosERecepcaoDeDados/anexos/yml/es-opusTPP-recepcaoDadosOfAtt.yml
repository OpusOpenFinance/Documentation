    FundsTransactionsData:
      type: object
      description: Información de la posición del fondo de inversión al que se refiere investmentId.
      required:
        - transactionId
        - type
        - transactionType
        - transactionConversionDate
        - transactionQuotaPrice
        - transactionQuotaQuantity
        - transactionValue
        - transactionGrossValue
      properties:
        transactionId:
          type: string
          description: Código o identificador único proporcionado por la institución que mantiene la representación individual del movimiento en la posición del fondo.
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: ABCD2126019929279212650822221989319253344
        type:
          $ref: '#/components/schemas/FundsEnumTransactionsType'
        transactionType:
          $ref: '#/components/schemas/FundsEnumTransactionsTransactionType'
        transactionTypeAdditionalInfo:
          type: string
          description: |
            Información adicional del tipo del motivo, para cumplimentar en el caso de movimientos no delimitados en el dominio.

            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando el campo 'transactionType' esté cumplimentado con el valor 'OUTROS'.
          maxLength: 100
          pattern: '[\w\W\s]*'
        transactionConversionDate:
          type: string
          format: date
          description: Fecha de la conversión de la transacción de movimiento del fondo de inversión.
          maxLength: 10
          minLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2023-01-07'
        transactionQuotaPrice:
          type: object
          description: 'Es el valor de la cuota utilizada en la conversión para la realización del movimiento del cliente en el fondo, conforme a la regla prevista en el reglamento - el valor puede ser negativo.'
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor relacionado con el objeto.
              maxLength: 25
              pattern: '^-?\d{1,15}\.\d{2,8}$'
              example: '1000.04'
            currency:
              type: string
              description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        transactionQuotaQuantity:
          type: string
          format: double
          description: |
            Número de cuotas convertidas en la fecha del movimiento.
          maxLength: 24
          pattern: '^\d{1,15}\.\d{2,8}$'
          example: '42.25'
        transactionValue:
