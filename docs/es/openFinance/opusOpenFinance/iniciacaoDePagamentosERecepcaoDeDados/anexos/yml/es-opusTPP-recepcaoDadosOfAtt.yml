    AccountsResponseAccountTransactions:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          description: |
            Lista de los asientos referentes a las transacciones realizadas y de asientos futuros para las cuentas de: depósito a la vista, de ahorro y de pago prepago
          minItems: 0
          items:
            $ref: '#/components/schemas/AccountsAccountTransactionsData'
        links:
          $ref: '#/components/schemas/AccountsTransactionsLinks'
