      example: UNICA
    LoansWarranties:
      type: object
      description: Conjunto de información referente a la identificación de la operación de crédito de préstamo
      required:
      - currency
      - warrantyAmount
      - warrantyType
      - warrantySubType
      properties:
        currency:
          type: string
          pattern: ^(\w{3}){1}$
          maxLength: 3
          description: Moneda referente al valor de la garantía, según el modelo ISO-4217. p.ej. 'BRL'. Todos los valores monetarios informados están representados con la moneda vigente de Brasil
          example: BRL
        warrantyType:
          $ref: '#/components/schemas/LoansEnumWarrantyType'
        warrantySubType:
          $ref: '#/components/schemas/LoansEnumWarrantySubType'
        warrantyAmount:
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: "Valor original de la garantía. Expresado en valor monetario con un mínimo de 2 y un máximo de 4 decimales.\n\n[Restricción] Para los casos en que warrantyType sea igual a \"GARANTIA_FIDEJUSSORIA\" el valor de la garantía corresponde a un porcentaje del total garantizado. \nDe esa forma, los casos de garantía fideiusoria para los cuales no es posible determinar un valor monetario para la garantía deben ser cumplimentados con 0.00.\n"
    LoansChargeOverParcel:
      type: object
      required:
      - chargeType
      - chargeAmount
      properties:
        chargeType:
          $ref: '#/components/schemas/LoansEnumContractFinanceChargeType'
        chargeAdditionalInfo:
          type: string
          pattern: ^[^\s](.*[^\s])?$
          maxLength: 140
          example: Informações adicionais
          description: "Campo libre para la cumplimentación de la información adicional referente al cargo.\n\n[Restricción] Obligatorio cuando chargeType sea igual a 'OUTROS'.\n"
        chargeAmount:
          type: string
          format: double
          pattern: ^-?\d{1,15}\.\d{2,4}$
          maxLength: 21
          minLength: 4
          example: '1000.0400'
          description: Valor del pago del cargo pagado fuera de la cuota. Expresado en valor monetario con un mínimo de 2 y un máximo de 4 decimales.
