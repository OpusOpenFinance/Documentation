      type: string
    TreasureTitlesTransactionId:
      description: Código o identificador único proporcionado por la institución para individualizar el movimiento.
      maxLength: 100
      pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
