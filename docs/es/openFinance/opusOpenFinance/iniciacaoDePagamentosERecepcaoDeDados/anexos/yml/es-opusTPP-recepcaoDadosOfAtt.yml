        - meta
      properties:
        data:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CustomersPersonalIdentificationData'
        links:
          $ref: '#/components/schemas/CustomersLinks'
        meta:
          $ref: '#/components/schemas/CustomersMeta'
    CustomersResponsePersonalCustomersQualification:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          $ref: '#/components/schemas/CustomersPersonalQualificationData'
        links:
          $ref: '#/components/schemas/CustomersLinks'
        meta:
          $ref: '#/components/schemas/CustomersMeta'
    CustomersResponsePersonalCustomersFinancialRelation:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          $ref: '#/components/schemas/CustomersPersonalFinancialRelationData'
        links:
          $ref: '#/components/schemas/CustomersLinks'
        meta:
          $ref: '#/components/schemas/CustomersMeta'
    CustomersResponseBusinessCustomersIdentification:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CustomersBusinessIdentificationData'
        links:
          $ref: '#/components/schemas/CustomersLinks'
        meta:
          $ref: '#/components/schemas/CustomersMeta'
    CustomersResponseBusinessCustomersQualification:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          $ref: '#/components/schemas/CustomersBusinessQualificationData'
        links:
          $ref: '#/components/schemas/CustomersLinks'
        meta:
          $ref: '#/components/schemas/CustomersMeta'
    CustomersResponseBusinessCustomersFinancialRelation:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          $ref: '#/components/schemas/CustomersBusinessFinancialRelationData'
        links:
          $ref: '#/components/schemas/CustomersLinks'
        meta:
          $ref: '#/components/schemas/CustomersMeta'
    CustomersPersonalIdentificationData:
      type: object
      description: Conjunto de informaciones relativas a la Identificación, es decir, la acción y el efecto de identificar de forma única a la persona natural a través de sus datos de registro.
      required:
        - updateDateTime
        - personalId
        - brandName
        - civilName
        - birthDate
        - documents
        - hasBrazilianNationality
        - contacts
        - companiesCnpj
      properties:
        updateDateTime:
          type: string
          maxLength: 20
          format: date-time
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2021-05-21T08:30:00Z'
          description: |
            Fecha y hora de la actualización de los campos \<_endpoint_\>, conforme a la especificación RFC-3339, formato UTC. Cuando no exista una fecha vinculada específicamente al bloque, asumir la fecha y hora de actualización del registro como un todo.
        personalId:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          maxLength: 100
          minLength: 1
          description: Un identificador único e inmutable utilizado para identificar el recurso cliente persona natural. Este identificador no tiene significado para el cliente que dio el consentimiento
          example: 578-psd-71md6971kjh-2d414
        brandName:
          type: string
          maxLength: 80
          pattern: '[\w\W\s]*'
          example: Organização A
          description: 'Nombre de la Marca reportada por el participante en el Open Finance. Se recomienda utilizar, siempre que sea posible, el mismo nombre de marca atribuido en el campo del directorio Customer Friendly Server Name (Authorisation Server).'
        civilName:
          type: string
          maxLength: 70
          pattern: '^[\w\W]*$'
          example: Juan Kaique Cláudio Fernandes
          description: |
            Nombre civil completo de la persona natural (Derecho fundamental de la persona, el nombre civil es aquel atribuido a la persona natural desde el registro de su nacimiento, con el cual será identificada durante toda su vida, así como después de su muerte).

            En caso de que el nombre civil informado exceda el límite de 70 caracteres, deben mantenerse el primer y el último nombre completos, realizando la abreviación progresiva de los nombres intermedios (reduciéndolos a sus respectivas iniciales, seguidas de punto), hasta que el nombre se ajuste al límite definido.
            Si persiste el exceso después de la abreviación de todos los intermedios, aplicar truncamiento simple al final del campo para respetar el límite máximo. No utilizar puntos suspensivos.
        socialName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Jaqueline de Freitas
          description: 'Nombre social de la persona natural, si lo hubiere. (aquel por el cual travestis y transexuales se reconocen, así como son identificados por su comunidad y en su medio social, conforme al Decreto Local)'
        birthDate:
          type: string
          maxLength: 10
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '1989-03-23'
          description: 'Fecha de nacimiento, conforme a la especificación RFC-3339'
        maritalStatusCode:
          $ref: '#/components/schemas/CustomersEnumMaritalStatusCode'
        maritalStatusAdditionalInfo:
          type: string
          pattern: '[\w\W\s]*'
          maxLength: 50
          example: Amasiado
          description: |
            Campo libre para complementar la información relativa al estado marital.

            [Restricción] Cumplimentación obligatoria cuando se seleccione el tipo 'OUTRO'.
        sex:
          $ref: '#/components/schemas/CustomersEnumSex'
        companiesCnpj:
          type: array
          minItems: 1
          items:
            type: string
            pattern: '^[0-9A-Z]{12}[0-9]{2}$'
            maxLength: 14
          example:
            - '01773247000103'
            - '01773247000563'
          description: |
            Representación alfanumérica completa del CNPJ de la institución responsable del Registro - el CNPJ corresponde a la representación alfanumérica de inscripción en el Registro de Persona Jurídica.
            Deben constar únicamente los caracteres del CNPJ, sin máscara.
        documents:
          $ref: '#/components/schemas/CustomersPersonalDocument'
        otherDocuments:
          type: array
          items:
            $ref: '#/components/schemas/CustomersPersonalOtherDocument'
          minItems: 1
          description: Relación de los demás documentos
        hasBrazilianNationality:
          type: boolean
          example: false
          description: Informa si el Cliente tiene nacionalidad brasileña.
        nationality:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CustomersNationality'
        filiation:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - type
              - civilName
            properties:
              type:
                $ref: '#/components/schemas/CustomersEnumFiliationType'
              civilName:
                type: string
                maxLength: 70
                pattern: '^[\w\W]*$'
                example: Marcelo Cláudio Fernandes
                description: |
                  Nombre civil completo de la persona natural (Derecho fundamental de la persona, el nombre civil es aquel atribuido a la persona natural desde el registro de su nacimiento, con el cual será identificada durante toda su vida, así como después de su muerte).

                  En caso de que el nombre civil informado exceda el límite de 70 caracteres, deben mantenerse el primer y el último nombre completos, realizando la abreviación progresiva de los nombres intermedios (reduciéndolos a sus respectivas iniciales, seguidas de punto), hasta que el nombre se ajuste al límite definido.
                  Si persiste el exceso después de la abreviación de todos los intermedios, aplicar truncamiento simple al final del campo para respetar el límite máximo. No utilizar puntos suspensivos.
              socialName:
                type: string
                maxLength: 70
                pattern: '^[\w\W]*$'
                description: |
                  Nombre social de la persona natural, si lo hubiere.
                  (aquel por el cual travestis y transexuales se reconocen,
                  así como son identificados por su comunidad y en su medio social, conforme al Decreto Local).
        contacts:
          $ref: '#/components/schemas/CustomersPersonalContacts'
    CustomersPersonalDocument:
      type: object
      description: Objeto agrupador de informaciones relativas a Documentos de la persona natural
      properties:
        cpfNumber:
          type: string
          maxLength: 11
          pattern: '^\d{11}$'
          example: '25872252137'
          description: |
            Número completo del CPF.
            Atributo que corresponde a las informaciones mínimas exigidas por la Reglamentación en vigor.
            El CPF es el Registro de Persona natural. Es un documento hecho por la Receita Federal y sirve para identificar a los contribuyentes. El CPF es una numeración con 11 dígitos, que solo cambian por decisión judicial. El documento es emitido por la receita federal.

            [Restricción] Cumplimentación obligatoria cuando no se informe el passport.
        passport:
          $ref: '#/components/schemas/CustomersPersonalPassport'
    CustomersPersonalPassport:
      type: object
      description: |
        Documento concedido a los viajeros por una autoridad administrativa nacional a fin de certificar su identidad ante autoridades extranjeras.

        [Restricción] Aplicable solamente a la Persona natural residente en el exterior no obligada a la inscripción en el CPF.

        [Restricción] Cumplimentación obligatoria cuando no se informe el cpfNumber.
      required:
        - number
        - country
      properties:
        number:
          type: string
          maxLength: 20
          pattern: '^[\w\W]*$'
          example: '75253468744594820620'
          description: |
            Número del Pasaporte.
        country:
          type: string
          maxLength: 3
          pattern: '^(\w{3}){1}$'
          example: CAN
          description: |
            País de emisión del pasaporte. Código del país de acuerdo con el código 'alpha3' del ISO-3166.
        expirationDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: |
            Fecha de vigencia del Pasaporte, conforme a la especificación RFC-3339.
        issueDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: |
            Fecha de emisión del pasaporte, conforme a la especificación RFC-3339.
    CustomersPersonalOtherDocument:
      type: object
      required:
        - type
        - number
      properties:
        type:
          $ref: '#/components/schemas/CustomersEnumPersonalOtherDocumentType'
        typeAdditionalInfo:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: CREA-RJ
          description: Campo libre de cumplimentación obligatoria si se selecciona la opción OUTROS tipos de documentos
        number:
          type: string
          maxLength: 40
          pattern: '[\w\W\s]*'
          example: '15291908'
          description: Identificación/Número del documento informado
        checkDigit:
          type: string
          maxLength: 2
          pattern: '[\w\W\s]*'
          example: P
          description: Dígito verificador del documento informado. De cumplimentación obligatoria si el documento informado tiene dígito verificador
        additionalInfo:
          type: string
          maxLength: 50
          pattern: '[\w\W\s]*'
          example: SSP/SP
          description: |
            Para documentos en los que se aplique el uso del lugar de emisión, el mismo debe ser enviado obligatoriamente, con la información del órgano y UF. Ejemplo: RG, lugar de emisión: SSP/RS.
            [Restricción] Obligatorio cuando el Lugar de Emisión del Documento sea relevante.
        expirationDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: 'Fecha de validez del documento informado, conforme a la especificación RFC-3339.'
    CustomersEnumPersonalOtherDocumentType:
      type: string
      enum:
        - CNH
        - RG
        - NIF
        - RNE
        - OUTROS
      description: |
        Relación de los Códigos de los demás documentos de persona natural.
    CustomersNationality:
      type: object
      description: Objeto que agrupa informaciones relativas a la nacionalidad de la Persona Natural
      required:
        - otherNationalitiesInfo
        - documents
      properties:
        otherNationalitiesInfo:
          type: string
          pattern: '^\S[\s\S]*$'
          maxLength: 40
          example: CAN
          description: |
            Campo de cumplimentación obligatoria en caso de que el cliente no posea nacionalidad brasileña. Cumplimentar indicando todas sus demás nacionalidades utilizando el código de país de acuerdo con el código alpha3 del ISO-3166.p.ej.'CAN'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/CustomersNationalityOtherDocument'
          description: Lista que trae la relación de documentos complementarios de personas con nacionalidad distinta de la brasileña
    CustomersNationalityOtherDocument:
      type: object
      required:
        - type
        - number
      properties:
        type:
          type: string
          maxLength: 10
          pattern: '[\w\W\s]*'
          description: 'Tipo de documento. Campo libre, de cumplimentación obligatoria cuando la nacionalidad sea distinta de la brasileña. Informar el tipo y el número del documento, además de la vigencia y demás informaciones complementarias para identificar el documento de persona extranjera'
          example: SOCIAL SEC
        number:
          type: string
          maxLength: 40
          pattern: '[\w\W\s]*'
          description: 'Número de identificación del documento. Campo libre, de cumplimentación obligatoria cuando la nacionalidad sea distinta de la brasileña. Informar el número del documento y demás informaciones complementarias para identificar el documento de persona extranjera'
          example: '423929299'
        expirationDate:
          description: 'Fecha de validez del documento informado, conforme a la especificación RFC-3339.'
          type: string
          maxLength: 10
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
        issueDate:
          description: 'Fecha de emisión del documento, conforme a la especificación RFC-3339.'
          type: string
          maxLength: 10
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
        country:
          type: string
          maxLength: 80
          pattern: '[\w\W\s]*'
          example: Brasil
          description: |
            Nombre del país.
        additionalInfo:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          description: Campo libre de cumplimentación cuando sea necesario.
          example: Informações adicionais.
    CustomersEnumFiliationType:
      type: string
      enum:
        - MAE
        - PAI
      example: PAI
      description: Tipo de filiación.
    CustomersPersonalContacts:
      type: object
      description: |
        Conjunto de informaciones referentes a las formas de contactar al cliente.
        Los datos de este campo son de envío obligatorio. Solo no deben ser enviados en caso de que la institución no los posea.
      required:
        - postalAddresses
        - phones
        - emails
      properties:
        postalAddresses:
          type: array
          items:
            $ref: '#/components/schemas/CustomersPersonalPostalAddress'
          minItems: 0
          description: Lista de direcciones de la persona natural
        phones:
          type: array
          items:
            $ref: '#/components/schemas/CustomersCustomerPhone'
          minItems: 0
          description: Lista con teléfonos de contacto de la persona natural
        emails:
          type: array
          items:
            $ref: '#/components/schemas/CustomersCustomerEmail'
          minItems: 0
          description: Lista de correos electrónicos de contacto
    CustomersPersonalPostalAddress:
      type: object
      required:
        - isMain
        - address
        - townName
        - postCode
        - country
      properties:
        isMain:
          type: boolean
          example: true
          description: Indica si la dirección informada es la principal.
        address:
          type: string
          maxLength: 150
          pattern: '[\w\W\s]*'
          example: 'Av Naburo Ykesaki, 1270'
          description: Corresponde a la dirección residencial del cliente.
        additionalInfo:
          type: string
          maxLength: 30
          pattern: '[\w\W\s]*'
          example: Fundos
          description: Algunas vías públicas todavía necesitan ser especificadas por medio de un complemento.
        districtName:
          type: string
          maxLength: 50
          pattern: '[\w\W\s]*'
          example: Centro
          description: |
            El barrio es una comunidad o región ubicada en una ciudad o municipio de acuerdo con sus subdivisiones geográficas.
            [Restricción] De cumplimentación obligatoria, si lo hubiere.
        townName:
          type: string
          maxLength: 50
          pattern: '[\w\W\s]*'
          example: Marília
          description: |
            Localidad: El nombre de la localidad corresponde a la designación de la ciudad o municipio en el cual la dirección está ubicada.
        ibgeTownCode:
          type: string
          pattern: '\d{7}$'
          maxLength: 7
          example: '3550308'
          description: 'Código IBGE de Municipio. La Tabla de Códigos de Municipios del IBGE presenta la lista de los municipios brasileños asociados a un código compuesto de 7 dígitos, siendo los dos primeros referentes al código de la Unidad de la Federación.'
        countrySubDivision:
          $ref: '#/components/schemas/CustomersEnumCountrySubDivision'
        postCode:
          type: string
          pattern: '^\d{8}$'
          maxLength: 8
          example: '17500001'
          description: |
            Código de Direccionamiento Postal: Compuesto por un conjunto numérico de ocho dígitos, el objetivo principal del CEP es orientar y agilizar el encaminamiento, el tratamiento y la entrega de objetos enviados en los Correios, por medio de su atribución a localidades, vías públicas, unidades de los Correios, servicios, órganos públicos, empresas y edificios. p.ej. '01311000'.
        country:
          type: string
          maxLength: 80
          pattern: '[\w\W\s]*'
          example: Brasil
          description: Nombre del país
        countryCode:
          type: string
          pattern: '^([A-Z]{3})$'
          maxLength: 3
          example: BRA
          description: Código del país conforme al código alpha3 de la ISO-3166.
        geographicCoordinates:
          $ref: '#/components/schemas/CustomersGeographicCoordinates'
    CustomersEnumCountrySubDivision:
      type: string
      description: 'Enumeración referente a cada sigla de la unidad de la federación que identifica el estado o el distrito federal en el cual está ubicada la dirección. p.ej. ''AC''. Solo se consideran las siglas de los estados brasileños'
      enum:
        - AC
        - AL
        - AP
        - AM
        - BA
        - CE
        - DF
        - ES
        - GO
        - MA
        - MT
        - MS
        - MG
        - PA
        - PB
        - PR
        - PE
        - PI
        - RJ
        - RN
        - RS
        - RO
        - RR
        - SC
        - SP
        - SE
        - TO
      example: SP
    CustomersGeographicCoordinates:
      type: object
      description: 'Conjunto de informaciones que corresponden a los valores de las coordenadas geográficas en grados decimales, en el Sistema de referencia WGS84'
      required:
        - latitude
        - longitude
      properties:
        latitude:
          description: |
            Información de la Latitud referente a la geolocalización informada. Entre -90 y 90.p.ej. '-23.5475000'. (2 dígitos antes de la coma, 11 posiciones)
          type: string
          pattern: '^-?\d{1,2}\.\d{1,9}$'
          maxLength: 13
          example: '-23.5475000'
        longitude:
          description: |
            Información de la Longitud referente a la geolocalización informada. Entre -180 y 180. p.ej '-46.6361100'. (3 dígitos antes de la coma, 11 posiciones)
          type: string
          pattern: '^-?\d{1,3}\.\d{1,8}$'
          maxLength: 13
          example: '-46.6361100'
    CustomersCustomerPhone:
      type: object
      required:
        - isMain
        - type
        - areaCode
        - number
      properties:
        isMain:
          type: boolean
          description: Indica si el teléfono informado es el principal
          example: true
        type:
          $ref: '#/components/schemas/CustomersEnumCustomerPhoneType'
        additionalInfo:
          type: string
          description: 'Información complementaria relativa al tipo de teléfono seleccionado. [Restricción] De cumplimentación obligatoria cuando se selecciona el tipo ''OUTRO''.'
          pattern: '[\w\W\s]*'
          maxLength: 70
          example: Informações adicionais.
        countryCallingCode:
          type: string
          maxLength: 4
          pattern: '^\d{1,4}$'
          example: '55'
          description: |
            Número de DDI (Discado Directo Internacional) para el teléfono de acceso al Cliente - si hubiera

            [Restricción] La cumplimentación es obligatoria cuando sea diferente de 55.
        areaCode:
          $ref: '#/components/schemas/CustomersAreaCode'
        number:
          type: string
          maxLength: 13
          pattern: '^([0-9]{6,13})$'
          example: '29875132'
          description: Número de teléfono del cliente
        phoneExtension:
          type: string
          maxLength: 5
          pattern: '^\d{1,5}$'
          description: Número de extensión. De cumplimentación obligatoria si forma parte de la identificación del número de teléfono informado
          example: '932'
    CustomersEnumCustomerPhoneType:
      type: string
      description: Identificación del Tipo de teléfono del cliente.
      enum:
        - FIXO
        - MOVEL
        - OUTRO
      example: FIXO
    CustomersAreaCode:
      type: string
      example: '19'
      description: Número de DDD (Discado Directo a Distancia) del teléfono del cliente - si hubiera
      maxLength: 3
      minLength: 2
      pattern: ^(\d{2,3})$
    CustomersCustomerEmail:
      type: object
      required:
        - isMain
        - email
      properties:
        isMain:
          type: boolean
          description: Indica si el email informado es el principal
          example: true
        email:
          type: string
          format: email
          description: Dirección de email
          maxLength: 320
          example: karinafernandes-81@br.inter.net
    CustomersEnumMaritalStatusCode:
      type: string
      enum:
        - SOLTEIRO
        - CASADO
        - VIUVO
        - SEPARADO_JUDICIALMENTE
        - DIVORCIADO
        - UNIAO_ESTAVEL
        - OUTRO
      example: OUTRO
      description: |
        Estado civil del cliente.
    CustomersEnumSex:
      type: string
      enum:
        - FEMININO
        - MASCULINO
        - OUTRO
      example: FEMININO
      description: |
        "Conjunto de características anatomofisiológicas que distinguen al hombre y a la mujer: Sexo masculino; sexo femenino".
        En caso de no ser femenino ni masculino se clasifica como 'OUTRO'
    CustomersPersonalQualificationData:
      type: object
      description: 'Conjunto de informaciones relativas al proceso de calificación. Se considera calificación la información que permite a las instituciones apreciar, evaluar, caracterizar y clasificar al cliente con la finalidad de conocer su perfil de riesgo y su capacidad económico-financiera'
      required:
        - updateDateTime
        - companyCnpj
      properties:
        updateDateTime:
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
          description: |
            Fecha y hora de la actualización de los campos \<_endpoint_\>, conforme a la especificación RFC-3339, formato UTC. Cuando no exista una fecha vinculada específicamente al bloque, asumir la fecha y hora de actualización del registro como un todo.
        companyCnpj:
          type: string
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          maxLength: 14
          example: '50685362000135'
          description: |
            Representación alfanumérica completa del CNPJ de la institución responsable del Registro - el CNPJ corresponde a la representación alfanumérica de la inscripción en el Registro de Persona Jurídica. Se deben incluir solamente los caracteres del CNPJ, sin máscara.
        occupationCode:
          $ref: '#/components/schemas/CustomersEnumOccupationMainCodeType'
        occupationDescription:
          type: string
          maxLength: 100
          pattern: '[\w\W\s]*'
          example: '01'
          description: |
            Campo de libre cumplimentación para informar el código de la ocupación o una descripción de la ocupación. Al completar el campo, atender a los siguientes puntos:
            - Cuando se seleccione la opción `occupationCode` `RECEITA_FEDERAL` o `CBO`, informar el código de esa lista estandarizada;
            - Si se selecciona `occupationCode` `OUTRO`, informar la descripción de la ocupación cuando la IF no sigue la lista estandarizada de la Receita Federal ni la de la CBO;
            - En el envío del código estandarizado de la Receita Federal y de la CBO, informar solamente el código conforme consta en las listas correspondientes.

            [Restricción] Este campo es de envío obligatorio cuando se envíe el campo `/data/occupationCode`.
        informedIncome:
          $ref: '#/components/schemas/CustomersInformedIncome'
        informedPatrimony:
          $ref: '#/components/schemas/CustomersPersonalInformedPatrimony'
        employers:
          type: array
          description: Lista de empleadores vinculados al cliente conforme a los registros de la institución transmisora.
          minItems: 1
          items:
            type: object
            properties:
              cnpjCpf:
                type: string
                description: Número de inscripción (CPF/CNPJ) del empleador con el cual el cliente tenga vínculo laboral.
                pattern: '^([0-9]{11}|[0-9A-Z]{12}[0-9]{2})$'
                example: '30386566000164'
              name:
                type: string
                description: Nombre del empleador o razón social del empleador con el cual el cliente tenga vínculo laboral.
                pattern: '^[^\s](.*[^\s])?$'
                example: 'Organização A'
    CustomersEnumOccupationMainCodeType:
      type: string
      enum:
        - RECEITA_FEDERAL
        - CBO
        - OUTRO
      example: RECEITA_FEDERAL
      description: |
        Trae la relación de los códigos relativos a la ocupación.
    CustomersInformedIncome:
      type: object
      required:
        - frequency
        - amount
        - date
      properties:
        frequency:
          $ref: '#/components/schemas/CustomersEnumInformedIncomeFrequency'
        amount:
          $ref: '#/components/schemas/CustomersInformedIncomeAmount'
        date:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: 'Fecha del ingreso, conforme a la especificación RFC-3339.'
    CustomersEnumInformedIncomeFrequency:
      type: string
      enum:
        - DIARIA
        - SEMANAL
        - QUINZENAL
        - MENSAL
        - BIMESTRAL
        - TRIMESTRAL
        - SEMESTRAL
        - ANUAL
        - OUTROS
      description: Trae la frecuencia o el período del ingreso informado.
    CustomersInformedIncomeAmount:
      type: object
      required:
        - amount
        - currency
      description: Valor total del ingreso informado
      properties:
        amount:
          description: |
            Valor total del ingreso informado. Expresado en valor monetario con un mínimo de 2 y un máximo de 4 decimales.
            El ingreso primario indica los montos a pagar o a recibir a cambio del uso temporal de recursos financieros, trabajo o activos no financieros no producidos, a saber, remuneración de trabajadores, ingresos de inversiones y demás ingresos primarios.
            Forman parte del primero la remuneración del trabajo asalariado (sueldos y salarios); del segundo, ingresos de inversión directa, ingresos de inversión en cartera, ingresos de otras inversiones e ingresos de activos de reserva; y del tercero, tributos sobre la producción y la importación, subsidios y alquileres.
            Fuente: Banco Central de Brasil – Departamento Económico
          type: string
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '100000.0400'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
          example: BRL
    CustomersPersonalInformedPatrimony:
      type: object
      required:
        - amount
        - year
      properties:
        amount:
          $ref: '#/components/schemas/CustomersInformedPatrimonyAmount'
        year:
          type: number
          maximum: 9999
          example: 2010
          description: 'Año de referencia del Ingreso, conforme a la especificación RFC-3339.'
    CustomersInformedPatrimonyAmount:
      type: object
      required:
        - amount
        - currency
      description: Valor del patrimonio informado
      properties:
        amount:
          description: |
            Valor del patrimonio informado. Expresado en valor monetario con un mínimo de 2 y un máximo de 4 decimales.
            El patrimonio es el conjunto de bienes vinculado a una persona o a una entidad.
          type: string
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '100000.0400'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
          example: BRL
    CustomersPersonalFinancialRelationData:
      type: object
      description: 'Objeto que reúne las informaciones relativas a la relación del cliente con la Institución. Se considera relación la información que permite conocer desde cuándo la persona consultada es cliente de la institución, así como un indicador de los productos y servicios que consume actualmente y sus representantes'
      required:
        - updateDateTime
        - startDate
        - productsServicesType
        - accounts
        - procurators
      properties:
        updateDateTime:
          type: string
          format: date-time
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2021-05-21T08:30:00Z'
          description: |
            Fecha y hora de la actualización de los campos \<_endpoint_\>, conforme a la especificación RFC-3339, formato UTC. Cuando no exista una fecha vinculada específicamente al bloque, asumir la fecha y hora de actualización del registro como un todo.
        startDate:
          type: string
          format: date-time
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2021-05-21T08:30:00Z'
          description: Fecha de inicio de la relación con la Institución Financiera. Debe traer el menor valor entre la información reportada al BACEN por el DOC 3040 y el CCS.
        productsServicesType:
          type: array
          items:
            $ref: '#/components/schemas/CustomersEnumProductServiceType'
          minItems: 1
          maxItems: 12
        productsServicesTypeAdditionalInfo:
          type: string
          pattern: '^[\w\W]*$'
          maxLength: 100
          example: Informações adicionais do tipo de serviço.
          description: |
            Informaciones adicionales del tipo de servicio.
            [Restricción] Campo obligatorio cuando productsServicesType sea 'OUTROS'.
        procurators:
          type: array
          items:
            $ref: '#/components/schemas/CustomersPersonalProcurator'
          minItems: 0
          description: |
            Lista de los representantes.
            [Restricción] De cumplimentación obligatoria si hay representante.
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/CustomersPersonalAccount'
          minItems: 0
          description: |
            Lista de cuentas de depósito a la vista, de ahorro y de pago prepago mantenidas por el cliente en la institución transmisora.
        portabilitiesReceived:
          type: array
          items:
            $ref: '#/components/schemas/CustomersPortabilitiesReceived'
          minItems: 1
          description: |
            Lista de informaciones de empleador recibidas a través de portabilidad de salario solicitada por el cliente de la transmisora a la(s) institución(es) detentora(s) de su cuenta salario, activos o que ya estuvieron activos,. Cada vínculo está asociado a una portabilidad de salario recibida por la transmisora.

            Obs.: la portabilidad no se cierra explícitamente, es decir, la IF hacia la cual se portó el salario no es avisada cuando la cuenta salario se cierra o el salario se porta a otra IF. No es posible garantizar que los datos informados sean de una portabilidad activa, ni que el vínculo con el banco de nómina aún exista. La transmisora tendrá tales informaciones solamente cuando la solicitud de portabilidad haya sido efectuada en sus canales.
        paychecksBankLink:
          type: array
          items:
            $ref: '#/components/schemas/CustomersPaychecksBankLink'
          minItems: 1
          description: |
            Lista de informaciones de cuentas salario relacionadas con vínculos laborales, existentes o que ya existieron, celebrados entre el cliente persona natural y uno o más empleadores. Cada vínculo está asociado a una cuenta salario abierta mantenida en el banco de nómina (institución transmisora).

            Obs: como los empleadores antiguos pueden no haber solicitado el cierre de la cuenta salario, no es posible garantizar que los datos informados sean del empleador actual.
    CustomersEnumProductServiceType:
      type: string
      enum:
        - CONTA_DEPOSITO_A_VISTA
        - CONTA_POUPANCA
        - CONTA_PAGAMENTO_PRE_PAGA
        - CARTAO_CREDITO
        - OPERACAO_CREDITO
        - SEGURO
        - PREVIDENCIA
        - INVESTIMENTO
        - OPERACOES_CAMBIO
        - CONTA_SALARIO
        - CREDENCIAMENTO
        - OUTROS
      example: SEGURO
      description: Lista con la relación de los productos y servicios con contrato vigente.
    CustomersPersonalProcurator:
      type: object
      required:
        - type
        - cpfNumber
        - civilName
      properties:
        type:
          $ref: '#/components/schemas/CustomersEnumProcuratorsTypePersonal'
        cpfNumber:
          type: string
          maxLength: 11
          pattern: '^\d{11}$'
          example: '73677831148'
          description: 'Número completo del CPF. El CPF es el Registro de Persona natural. Es un documento hecho por la Receita Federal y sirve para identificar a los contribuyentes. El CPF es una numeración de 11 dígitos, que solo cambian por decisión judicial. El documento es emitido por la receita federal'
        civilName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Elza Milena Stefany Teixeira
          description: |
            Nombre civil completo de la persona natural (Derecho fundamental de la persona, el nombre civil es aquel atribuido a la persona natural desde el registro de su nacimiento, con el cual será identificada durante toda su vida, así como después de su muerte).

            En caso de que el nombre civil informado exceda el límite de 70 caracteres, deben mantenerse el primer y el último nombre completos, realizando la abreviación progresiva de los nombres intermedios (reduciéndolos a sus respectivas iniciales, seguidas de punto), hasta que el nombre se ajuste al límite definido.
            Si persiste el exceso después de la abreviación de todos los intermedios, aplicar truncamiento simple al final del campo para respetar el límite máximo. No utilizar puntos suspensivos.
        socialName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Carlos
          description: 'Nombre social de la persona natural, si hubiera. (aquel por el cual travestis y transexuales se reconocen, así como son identificados por su comunidad y en su medio social, conforme al Decreto Nº 51.180, del 14 de enero de 2010)'
    CustomersEnumProcuratorsTypePersonal:
      type: string
      enum:
        - REPRESENTANTE_LEGAL
        - PROCURADOR
      example: PROCURADOR
      description: |
        Tipo de representante.
        Representante legal - Nombre Civil completo de la Persona Natural que represente a una entidad o a una empresa y es designado en su acto constitutivo, es decir, en el contrato social o estatuto social.
        Apoderado - es cualquier persona que represente a la Persona Natural en algún negocio, mediante autorización escrita de la misma.
    CustomersPersonalAccount:
      type: object
      description: |
        Lista de cuentas de depósito a la vista, de ahorro y de pago prepago mantenidas por el cliente en la institución transmisora y para las cuales haya otorgado consentimiento
      required:
        - compeCode
        - number
        - checkDigit
        - type
        - subtype
      properties:
        compeCode:
          type: string
          maxLength: 3
          pattern: '^\d{3}$'
          description: 'Código identificador atribuido por el Banco Central de Brasil a las instituciones participantes del STR (Sistema de Transferencia de reservas).El Compe (Sistema de Compensación de Cheques y Otros Papeles) es un sistema que identifica y procesa las compensaciones bancarias. Está representado por un código de tres dígitos que sirve como identificador de bancos, siendo así, cada institución bancaria posee un número exclusivo'
          example: '001'
        branchCode:
          type: string
          maxLength: 4
          pattern: '^\d{4}$'
          description: |
            Código de la Sucursal detentora de la cuenta. (La sucursal es la dependencia destinada a la atención a los clientes, al público en general y a los asociados de cooperativas de crédito, en el ejercicio de las actividades de la institución, no pudiendo ser móvil o transitoria)
            [Restricción] Obligatoriamente debe ser completado cuando el campo "type" sea diferente de cuenta prepago.
          example: '6272'
        number:
          type: string
          maxLength: 20
          pattern: '^\d{8,20}$'
          description: |
            Número de la cuenta
          example: '24550245'
        checkDigit:
          type: string
          maxLength: 1
          pattern: '[\w\W\s]*'
          description: |
            Dígito de la cuenta
          example: '4'
        type:
          $ref: '#/components/schemas/CustomersEnumAccountTypeCustomers'
        subtype:
          type: string
          enum:
            - INDIVIDUAL
            - CONJUNTA_SIMPLES
            - CONJUNTA_SOLIDARIA
          description: |
            Subtipo de cuenta (véase Enum):
            Cuenta individual - posee un único titular
            Cuenta conjunta simple - donde los movimientos financieros solo pueden realizarse mediante autorización de TODOS los cuentacorrentistas de la cuenta.
            Cuenta conjunta solidaria - es la modalidad cuyos titulares pueden realizar movimientos de forma aislada, es decir, sin que sea necesaria la autorización de los demás titulares.
          example: INDIVIDUAL
    CustomersEnumAccountTypeCustomers:
      type: string
      enum:
        - CONTA_DEPOSITO_A_VISTA
        - CONTA_POUPANCA
        - CONTA_PAGAMENTO_PRE_PAGA
      description: |
        Tipos de cuentas. Modalidades tradicionales previstas por la Resolución 4.753, no contemplando cuentas vinculadas, cuenta de domiciliados en el exterior, cuentas en monedas extranjeras y cuenta correspondiente de moneda electrónica. Véase Enum:

        Cuenta de depósito a la vista o Cuenta corriente - es el tipo más común. En ella, el dinero queda a su disposición para ser retirado en cualquier momento. Esta cuenta no genera rendimientos para el depositante.

        Cuenta de ahorro - fue creada para estimular a las personas a ahorrar. El dinero que permanezca en la cuenta por treinta días pasa a generar rendimientos, con exención de impuesto sobre la renta para quien declara. Es decir, el dinero “crece” (rinde) mientras permanezca guardado en la cuenta. Cada depósito tendrá rendimientos de mes en mes, siempre en el día del mes en que el dinero haya sido depositado.

        Cuenta de pago prepago - según la CIRCULAR Nº 3.680, BCB de  2013, es la 'destinada a la ejecución de transacciones de pago en moneda electrónica realizadas con base en fondos denominados en reales previamente aportados'.
      example: CONTA_DEPOSITO_A_VISTA
    CustomersPortabilitiesReceived:
      type: object
      required:
        - employerName
        - employerCnpjCpf
        - paycheckBankDetainerCnpj
        - paycheckBankDetainerIspb
        - portabilityApprovalDate
      properties:
        employerName:
          type: string
          pattern: '^[^\s](.*[^\s])?$'
          maxLength: 80
          description: |
            Nombre del empleador conforme recibido por la comunicación de portabilidad. El empleador puede ser persona natural o persona jurídica; cuando se trate de persona jurídica, debe enviarse la razón social.
        employerCnpjCpf:
          type: string
          pattern: '^([0-9]{11}|[0-9A-Z]{12}[0-9]{2})$'
          maxLength: 14
          description: |
            Registro de inscripción (CPF/CNPJ) del empleador (contratante de los servicios de pago), conforme recibido por la comunicación de portabilidad.
        paycheckBankDetainerCnpj:
          type: string
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          maxLength: 14
          description: |
            Registro de inscripción en el Registro Nacional de la Persona Jurídica (CNPJ) del banco de nómina (institución detentora de la cuenta salario) conforme recibido por la comunicación de portabilidad.
        paycheckBankDetainerIspb:
          type: string
          pattern: '^[0-9A-Z]{8}$'
          maxLength: 8
          description: |
            Registro del ISPB del Banco de Nómina (institución detentora de la cuenta salario) conforme recibido por la comunicación de portabilidad.
        portabilityApprovalDate:
          type: string
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          maxLength: 10
          description: |
            Fecha de aprobación de la portabilidad, conforme recibido por la comunicación de portabilidad.

            Obs.: solamente deben compartirse solicitudes aprobadas, aunque lo hayan sido de forma compulsoria.
    CustomersPaychecksBankLink:
      type: object
      required:
        - employerName
        - employerCnpjCpf
        - paycheckBankCnpj
        - paycheckBankIspb
        - accountOpeningDate
      properties:
        employerName:
          type: string
          pattern: '^[^\s](.*[^\s])?$'
          maxLength: 80
          description: |
            Nombre del empleador conforme registrado en la apertura de la cuenta salario. El empleador puede ser persona natural o persona jurídica; cuando se trate de persona jurídica, debe enviarse la razón social.
        employerCnpjCpf:
          type: string
          pattern: '^([0-9]{11}|[0-9A-Z]{12}[0-9]{2})$'
          maxLength: 14
          description: |
            Documento del empleador (CNPJ/CPF), conforme registrado en la apertura de la cuenta salario.
        paycheckBankCnpj:
          type: string
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          maxLength: 14
          description: |
            CNPJ de la institución financiera contratada para prestar el servicio de pago de salario (banco de nómina).
        paycheckBankIspb:
          type: string
          pattern: '^[0-9A-Z]{8}$'
          maxLength: 8
          description: |
            Registro ISPB (Identificador del Sistema de Pagos Brasileño) de la institución contratada para prestar el servicio de pago de salario (banco de nómina).
        accountOpeningDate:
          type: string
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          maxLength: 10
          description: |
            Fecha de apertura de la cuenta salario.
    CustomersBusinessIdentificationData:
      type: object
      description: Conjunto de informaciones relativas a la Identificación, es decir, la acción y el efecto de identificar de forma única a la persona jurídica a través de sus datos de registro
      required:
        - businessId
        - updateDateTime
        - brandName
        - cnpjNumber
        - companiesCnpj
        - companyName
        - incorporationDate
        - parties
        - contacts
      properties:
        updateDateTime:
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
          description: |
            Fecha y hora de la actualización de los campos \<_endpoint_\>, conforme a la especificación RFC-3339, formato UTC. Cuando no exista una fecha vinculada específicamente al bloque, asumir la fecha y hora de actualización del registro como un todo.
        businessId:
          type: string
          maxLength: 100
          minLength: 1
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: 578-psd-71md6971kjh-2d414
          description: Un identificador único e inmutable usado para identificar el recurso cliente persona jurídica. Este identificador no tiene significado para el cliente que otorgó el consentimiento
        brandName:
          type: string
          maxLength: 80
          pattern: '[\w\W\s]*'
          example: Organização A
          description: |
            Nombre de la Marca reportada por el participante en Open Finance. Se recomienda utilizar, siempre que sea posible, el mismo nombre de marca atribuido en el campo del directorio Customer Friendly Server Name (Authorisation Server).
        companyName:
          type: string
          maxLength: 144
          pattern: '[\w\W\s]*'
          example: Luiza e Benjamin Assessoria Jurídica Ltda
          description: La razón social de la empresa consultada es el término registrado bajo el cual una persona jurídica (PJ) se individualiza y ejerce sus actividades. También puede denominarse denominación social o firma empresarial
        tradeName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Mundo da Eletronica
          description: 'Nombre de fantasía de la persona jurídica, si hubiera. (Es el nombre popular de la empresa, utilizado para la divulgación de la empresa y una mejor fijación con el público). De cumplimentación obligatoria si hubiera'
        incorporationDate:
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
          description: 'Fecha de constitución de la empresa, conforme a la especificación RFC-3339.'
        cnpjNumber:
          type: string
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '50685362006773'
          description: |
            Número completo del CNPJ de la Empresa consultada - el CNPJ corresponde a la representación alfanumérica de la inscripción en el Registro de Persona Jurídica.
            Se deben incluir solamente caracteres del CNPJ, sin máscara
        companiesCnpj:
          minItems: 1
          type: array
          example:
            - '50685362000135'
            - '50685362006555'
          description: |
            Representación alfanumérica completa del CNPJ de la institución responsable del Registro - el CNPJ corresponde a la representación alfanumérica de inscripción en el Registro de Persona Jurídica.
            Deben constar únicamente los caracteres del CNPJ, sin máscara.
          items:
            type: string
            maxLength: 14
            pattern: '^[0-9A-Z]{12}[0-9]{2}$'
            example: '50685362000135'
        otherDocuments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CustomersBusinessOtherDocument'
          description: Relación de los demás documentos
        parties:
          type: array
          items:
            $ref: '#/components/schemas/CustomersPartiesParticipation'
          minItems: 0
          description: |
            Lista relativa a las informaciones de las partes involucradas, como: socio y/o administrador. Objeto de envío obligatorio para todos los CNPJ que posean socios y/o administradores en el registro del QSA (Cuadro de Socios y Administradores)
        contacts:
          $ref: '#/components/schemas/CustomersBusinessContacts'
    CustomersBusinessOtherDocument:
      type: object
      required:
        - type
        - number
        - country
      properties:
        type:
          type: string
          maxLength: 20
          pattern: '[\w\W\s]*'
          example: EIN
          description: 'Número del Tipo de documento informado. De cumplimentación obligatoria para la Persona jurídica con domicilio o sede en el exterior, exenta de inscripción en el CNPJ'
        number:
          type: string
          maxLength: 20
          pattern: '[\w\W\s]*'
          example: '128328453'
          description: 'Número del otro documento. De cumplimentación obligatoria para la Persona jurídica con domicilio o sede en el exterior, exenta de inscripción en el CNPJ'
        country:
          type: string
          maxLength: 3
          pattern: '^(\w{3}){1}$'
          example: CAN
          description: País de emisión del tipo de documento informado. Código del país conforme al código alpha3 de la ISO-3166
        expirationDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: 'Fecha de vigencia del tipo de  documento informado, conforme a la especificación RFC-3339.'
    CustomersPartiesParticipation:
      type: object
      description: |
        Lista relativa a las informaciones de las partes involucradas, como: socio y /o administrador
      required:
        - type
        - personType
        - documentType
        - documentNumber
      properties:
        personType:
          type: string
          enum:
            - PESSOA_NATURAL
            - PESSOA_JURIDICA
          description: Indica si la persona de la parte involucrada es una persona natural o jurídica
        type:
          type: string
          description: |
            Indica el perfil de actuación en la empresa. Véase Enum
            El administrador es el responsable de desempeñar todas las funciones administrativas de la empresa. Es él quien conduce el día a día del negocio, firmando documentos, respondiendo legalmente por la sociedad, realizando préstamos y otras acciones gerenciales. A pesar de estar en la línea de frente de la empresa, se le denomina socio por poseer también su parte de participación en el Capital Social.
            El socio no tiene ningún involucramiento en las actividades administrativas de la sociedad.
          enum:
            - SOCIO
            - ADMINISTRADOR
        civilName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Juan Kaique Cláudio Fernandes
          description: |
            Nombre civil completo de la persona natural (Derecho fundamental de la persona, el nombre civil es aquel atribuido a la persona natural desde el registro de su nacimiento, con el cual será identificada durante toda su vida, así como después de su muerte).

            En caso de que el nombre civil informado exceda el límite de 70 caracteres, deben mantenerse el primer y el último nombre completos, realizando una abreviación progresiva de los nombres intermedios (reduciéndolos a las respectivas iniciales, seguidas de punto), hasta que el nombre se ajuste al límite definido.
            Si persiste el exceso después de la abreviación de todos los intermedios, aplicar truncamiento simple al final del campo para respetar el límite máximo. No utilizar puntos suspensivos.

            [Restricción] El campo civilName debe ser obligatoriamente completado cuando personType sea PESSOA_NATURAL.
        socialName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Karina
          description: |
            Nombre social de la persona natural, si hubiera. (aquel por el cual travestis y transexuales se reconocen, así como son identificados por su comunidad y en su medio social, conforme al Decreto Local).
        companyName:
          type: string
          maxLength: 144
          pattern: '[\w\W\s]*'
          example: Luiza e Benjamin Assessoria Jurídica Ltda
          description: |
            La razón social de la empresa consultada es el término registrado bajo el cual una persona jurídica (PJ) se individualiza y ejerce sus actividades. También puede denominarse denominación social o firma empresarial

            [Restricción] el campo companyName debe ser obligatoriamente completado cuando personType sea PESSOA_JURIDICA.
        tradeName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Mundo da Eletronica
          description: 'Nombre de fantasía de la persona jurídica, si hubiera. (Es el nombre popular de la empresa, utilizado para la divulgación de la empresa y una mejor fijación con el público). De cumplimentación obligatoria si hubiera'
        startDate:
          type: string
          maxLength: 20
          format: date-time
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2021-05-21T08:30:00Z'
          description: 'Fecha de inicio de la participación, conforme a la especificación RFC-3339.'
        shareholding:
          type: string
          format: double
          maxLength: 8
          minLength: 8
          pattern: '^[01]\.\d{6}$'
          example: '0.510000'
          description: |
            Porcentaje de participación societaria (informar con 6 decimales). El Socio solo debe ser informado si su participación societaria es igual o superior al 25%. p.ej: 0.250000 (Este valor  representa el 25%. El valor '1 'representa el 100%).

            [Restricción]: Campo obligatorio en caso de que el type sea igual a SOCIO y este tenga participación societaria mayor que el 25%.
        documentType:
          $ref: '#/components/schemas/CustomersEnumPartiesParticipationDocumentType'
        documentNumber:
          type: string
          maxLength: 20
          pattern: '[\w\W\s]*'
          example: '73677831148'
          description: Número del documento informado. Campo de Texto Libre para completar el número y el dígito del documento si hubiera
        documentAdditionalInfo:
          type: string
          maxLength: 100
          pattern: '[\w\W\s]*'
          example: CNH
          description: 'Campo libre, de cumplimentación obligatoria cuando el documento informado tenga informaciones complementarias relevantes para su identificación'
        documentCountry:
          type: string
          maxLength: 3
          pattern: '[\w\W\s]*'
          example: CAN
          description: |
            País de emisión del documento. Código del país conforme al código alpha3 de la ISO-3166.
        documentExpirationDate:
          type: string
          format: date
          maxLength: 10
          example: '2021-05-21'
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          description: 'Fecha de validez del documento informado, conforme a la especificación RFC-3339.'
        documentIssueDate:
          type: string
          maxLength: 10
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: 'Fecha de emisión del documento, conforme a la especificación RFC-3339.'
    CustomersEnumPartiesParticipationDocumentType:
      type: string
      enum:
        - CPF
        - PASSAPORTE
        - OUTRO_DOCUMENTO_VIAGEM
        - CNPJ
      description: |
        Tipo del documento informado.
    CustomersBusinessContacts:
      type: object
      description: Conjunto de informaciones referentes a las formas de contactar al cliente.
      required:
        - postalAddresses
        - phones
        - emails
      properties:
        postalAddresses:
          type: array
          items:
            $ref: '#/components/schemas/CustomersBusinessPostalAddress'
          minItems: 0
          description: Lista de direcciones de la persona jurídica
        phones:
          type: array
          items:
            $ref: '#/components/schemas/CustomersCustomerPhone'
          minItems: 0
          description: Lista con teléfonos de contacto de la persona jurídica
        emails:
          type: array
          items:
            $ref: '#/components/schemas/CustomersCustomerEmail'
          minItems: 0
          description: Lista de correos electrónicos de contacto
    CustomersBusinessPostalAddress:
      type: object
      required:
        - isMain
        - townName
        - country
        - countryCode
      properties:
        isMain:
          type: boolean
          example: true
          description: Indica si la dirección informada es la principal
        address:
          type: string
          maxLength: 150
          minLength: 2
          pattern: '^[\w\W\s]*$'
          example: 'Av Naburo Ykesaki, 1270'
          description: |
            Corresponde a la dirección comercial del cliente.
        additionalInfo:
          type: string
          maxLength: 30
          pattern: '[\w\W\s]*'
          example: Fundos
          description: Algunas vías públicas aún necesitan ser especificadas por medio de un complemento
        districtName:
          type: string
          maxLength: 50
          pattern: '[\w\W\s]*'
          example: Centro
          description: |
            El barrio es una comunidad o región ubicada en una ciudad o municipio de acuerdo con sus subdivisiones geográficas. Cumplimentación obligatoria, si hubiera.
        townName:
          type: string
          maxLength: 50
          pattern: '^[\w\W\s]*$'
          minLength: 2
          example: Marília
          description: |
            Localidad: El nombre de la localidad corresponde a la designación de la ciudad o municipio en el cual la dirección está ubicada.
        ibgeTownCode:
          type: string
          pattern: '\d{7}$'
          maxLength: 7
          example: '3550308'
          description: 'Código IBGE de Municipio. La Tabla de Códigos de Municipios del IBGE presenta la lista de los municipios brasileños asociados a un código compuesto de 7 dígitos, siendo los dos primeros referentes al código de la Unidad de la Federación.'
        countrySubDivision:
          $ref: '#/components/schemas/CustomersEnumCountrySubDivision'
        postCode:
          type: string
          pattern: '^\d{8}$'
          maxLength: 8
          example: '17500001'
          description: |
            Código de Direccionamiento Postal: Compuesto por un conjunto numérico de ocho dígitos, el objetivo principal del CEP es orientar y acelerar el encaminamiento, el tratamiento y la entrega de objetos enviados en los Correios, por medio de su atribución a localidades, vías públicas, unidades de los Correios, servicios, órganos públicos, empresas y edificios. p.ej. '01311000'
        country:
          type: string
          maxLength: 80
          pattern: '[\w\W\s]*'
          example: Brasil
          description: Nombre del país
        countryCode:
          type: string
          maxLength: 3
          pattern: '^([A-Z]{3})$'
          example: BRA
          description: Código del país conforme al código alpha3 de la ISO-3166
        geographicCoordinates:
          $ref: '#/components/schemas/CustomersGeographicCoordinates'
    CustomersBusinessQualificationData:
      type: object
      description: 'Objeto que reúne las informaciones relativas al proceso de calificación. Se considera calificación la información que permite a las instituciones apreciar, evaluar, caracterizar y clasificar al cliente con la finalidad de conocer su perfil de riesgo y su capacidad económico-financiera'
      required:
        - updateDateTime
      properties:
        updateDateTime:
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
          description: |
            Fecha y hora de la actualización de los campos \<_endpoint_\>, conforme a la especificación RFC-3339, formato UTC. Cuando no exista una fecha vinculada específicamente al bloque, asumir la fecha y hora de actualización del registro como un todo.
        economicActivities:
          type: array
          items:
            $ref: '#/components/schemas/CustomersEconomicActivity'
          minItems: 0
          description: 'Lista de los demás códigos relativos a las demás actividades económicas de la empresa, según el estándar CNAE (Clasificación Nacional de Actividades Económicas). De cumplimentación obligatoria, si hubiera'
        informedRevenue:
          $ref: '#/components/schemas/CustomersInformedRevenue'
        informedPatrimony:
          $ref: '#/components/schemas/CustomersBusinessInformedPatrimony'
    CustomersEconomicActivity:
      type: object
      required:
        - code
        - isMain
      properties:
        code:
          type: string
          pattern: '^\d{7}$'
          description: |
            Trae el código del ramo de la actividad principal de la empresa consultada, según el estándar CNAE (Clasificación Nacional de Actividades Económicas)

            [Observación] El campo siempre debe enviarse con 7 caracteres, siguiendo la clasificación “CNAE-Subclasse 2.3”. En casos en que el valor inicie con ceros, debe contener todos los caracteres, incluidos los ceros.
          example: '0600001'
        isMain:
          type: boolean
          description: 'Indica si es el ramo principal de actividad de la empresa cuando true y si es el ramo secundario cuando false. [Restricción] Solamente una ocurrencia relativa al código de la actividad económica principal debe traer el valor true.'
          example: true
    CustomersInformedRevenue:
      type: object
      required:
        - amount
      properties:
        frequency:
          $ref: '#/components/schemas/CustomersEnumInformedRevenueFrequency'
        frequencyAdditionalInfo:
          type: string
          maxLength: 100
          pattern: '[\w\W\s]*'
          example: Informações adicionais
          description: |
            Texto libre para complementar información relativa al patrimonio.

            [Restricción] Completar cuando frequency sea igual a OUTROS.
        amount:
          $ref: '#/components/schemas/CustomersInformedRevenueAmount'
        year:
          type: number
          maximum: 9999
          example: 2010
          description: 'Año de referencia del Ingreso, conforme a la especificación RFC-3339.'
    CustomersEnumInformedRevenueFrequency:
      type: string
      description: |
        Trae la frecuencia o el período de la facturación informada.
        "La facturación se calcula a partir de todos los beneficios que la empresa consiguió con su actividad económica en un determinado período. Esos beneficios son los rendimientos o ganancias de la organización a través de sus ventas o servicios prestados".
      enum:
        - DIARIA
        - SEMANAL
        - QUINZENAL
        - MENSAL
        - BIMESTRAL
        - TRIMESTRAL
        - SEMESTRAL
        - ANUAL
        - OUTROS
      example: DIARIA
    CustomersInformedRevenueAmount:
      type: object
      required:
        - amount
        - currency
      description: Valor del patrimonio informado
      properties:
        amount:
          description: |
            Valor del patrimonio informado. Expresado en valor monetario con un mínimo de 2 y un máximo de 4 decimales.
            El patrimonio es el conjunto de bienes vinculado a una persona o a una entidad.
          type: string
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '100000.0400'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
          example: BRL
    CustomersBusinessInformedPatrimony:
      type: object
      required:
        - amount
        - date
      properties:
        amount:
          $ref: '#/components/schemas/CustomersInformedPatrimonyAmount'
        date:
          type: string
          format: date
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: 'Fecha de referencia del Patrimonio, conforme a la especificación RFC-3339.'
    CustomersBusinessFinancialRelationData:
      type: object
      description: 'Objeto que reúne las informaciones relativas a la relación del cliente con la Institución. Se considera relación la información que permite conocer desde cuándo la persona consultada es cliente de la institución, así como un indicador de los productos y servicios que consume actualmente y sus representantes'
      required:
        - updateDateTime
        - startDate
        - productsServicesType
        - procurators
        - accounts
      properties:
        updateDateTime:
          type: string
          format: date-time
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2020-07-21T08:30:00Z'
          description: |
            Fecha y hora de la actualización de los campos \<_endpoint_\>, conforme a la especificación RFC-3339, formato UTC. Cuando no exista una fecha vinculada específicamente al bloque, asumir la fecha y hora de actualización del registro como un todo.
        startDate:
          type: string
          format: date-time
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2020-07-21T08:30:00Z'
          description: Fecha de inicio de la relación con la Institución Financiera. Debe traer el menor valor entre la información reportada al BACEN por el DOC 3040 y el CCS.
        productsServicesType:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: '#/components/schemas/CustomersEnumProductServiceType'
        procurators:
          type: array
          items:
            $ref: '#/components/schemas/CustomersBusinessProcurator'
          minItems: 0
          description: Lista de los representantes. De cumplimentación obligatoria si hay representante.
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/CustomersBusinessAccount'
          minItems: 0
          description: |
            Lista de cuentas de depósito a la vista, de ahorro y de pago prepago mantenidas por el cliente en la institución transmisora.
    CustomersBusinessProcurator:
      type: object
      required:
        - type
        - cnpjCpfNumber
        - civilName
      properties:
        type:
          type: string
          enum:
            - REPRESENTANTE_LEGAL
            - PROCURADOR
          description: |
            Tipo de representante.
            Representante legal - Nombre Civil completo de la Persona Natural que represente a una entidad o a una empresa y es designado en su acto constitutivo, es decir, en el contrato social o estatuto social.
            Apoderado - es cualquier persona que represente a la Persona Natural en algún negocio, mediante autorización escrita de la misma.
          example: PROCURADOR
        cnpjCpfNumber:
          type: string
          maxLength: 14
          pattern: '^([0-9]{11}|[0-9A-Z]{12}[0-9]{2})$'
          example: '73677831148'
          description: Identificación del Representante Legal o Apoderado. Registro de la inscripción en la Receita Federal (Completar con CPF o CNPJ sin formato).
        civilName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Elza Milena Stefany Teixeira
          description: |
            Nombre civil completo de la persona natural (Derecho fundamental de la persona, el nombre civil es aquel atribuido a la persona natural desde el registro de su nacimiento, con el cual será identificada durante toda su vida, así como después de su muerte).

            En caso de que el nombre civil informado exceda el límite de 70 caracteres, deben mantenerse el primer y el último nombre completos, realizando la abreviación progresiva de los nombres intermedios (reduciéndolos a sus respectivas iniciales, seguidas de punto), hasta que el nombre se ajuste al límite definido.
            Si persiste el exceso después de la abreviación de todos los intermedios, aplicar truncamiento simple al final del campo para respetar el límite máximo. No utilizar puntos suspensivos.
        socialName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Stefany Teixeirass
          description: |
            Nombre social de la persona natural, si hubiera.
            así como son identificados por su comunidad y en su medio social, conforme al Decreto Local.
    CustomersBusinessAccount:
      type: object
      required:
        - compeCode
        - number
        - checkDigit
        - type
      properties:
        compeCode:
          type: string
          maxLength: 3
          pattern: '^\d{3}$'
          description: 'Código identificador atribuido por el Banco Central de Brasil a las instituciones participantes del STR (Sistema de Transferencia de reservas).El Compe (Sistema de Compensación de Cheques y Otros Papeles) es un sistema que identifica y procesa las compensaciones bancarias. Está representado por un código de tres dígitos que sirve como identificador de bancos, siendo así, cada institución bancaria posee un número exclusivo'
          example: '001'
        branchCode:
          type: string
          maxLength: 4
          pattern: '^\d{4}$'
          description: |
            Código de la Sucursal detentora de la cuenta. (La sucursal es la dependencia destinada a la atención a los clientes, al público en general y a los asociados de cooperativas de crédito, en el ejercicio de las actividades de la institución, no pudiendo ser móvil o transitoria)
            [Restricción] Obligatoriamente debe ser completado cuando el campo "type" sea diferente de cuenta prepago.
          example: '6272'
        number:
          type: string
          maxLength: 20
          pattern: '^\d{8,20}$'
          description: |
            Número de la cuenta
          example: '24550245'
        checkDigit:
          type: string
          maxLength: 1
          pattern: '[\w\W\s]*'
          description: |
            Dígito de la cuenta
          example: '4'
        type:
          $ref: '#/components/schemas/CustomersEnumAccountTypeCustomers'
    CreditCardsAccountsAccountPaymentMethod:
      description: Conjunto de informaciones relativas a los Medios de Pago de la Cuenta de pago pospago
      properties:
        identificationNumber:
          description: "Número de identificación de la tarjeta: corresponde a los 4 últimos dígitos de la tarjeta para persona natural, o bien, completar con un identificador para persona jurídica, con las características definidas para los ID en Open Finance.\n"
          example: '4453'
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        isMultipleCreditCard:
          description: "Indica si la Tarjeta de crédito asociada a la cuenta de pago pospago es múltiple o no. Las tarjetas denominadas múltiples poseen tanto la función crédito como la función débito, debiendo el propietario de la tarjeta, en el momento de su utilización, informar si el pago es en la función crédito (que lleva a un pago futuro, por medio de una factura de la tarjeta de crédito) o en la función débito.\n"
          example: true
          type: boolean
      required:
      - identificationNumber
      - isMultipleCreditCard
      type: object
    CreditCardsAccountsAvailableAmount:
      description: "Valor disponible del límite informado   \n"
      properties:
        amount:
          description: "Valor disponible del límite informado expresado en valor monetario con un mínimo de 2 y un máximo de 4 decimales.\n\n[Restricción] El campo es obligatorio en caso de que isLimitFlexible sea igual a false.\n"
          example: '1000.0400'
          format: double
          maxLength: 21
          minLength: 4
          pattern: ^-?\d{1,15}\.\d{2,4}$
          type: string
        currency:
          description: "Moneda referente al límite informado, según el modelo ISO-4217. p.ej. 'BRL.'\nTodos los saldos informados están representados con la moneda vigente de Brasil.  \n\n[Restricción] El campo es obligatorio en caso de que isLimitFlexible sea igual a false.\n"
          example: BRL
          maxLength: 3
          pattern: ^[A-Z]{3}$
          type: string
      type: object
    CreditCardsAccountsBillMinimumAmount:
      description: "Valor del pago mínimo de la factura\n"
      properties:
        amount:
          description: Valor del pago mínimo de la factura
          example: '1000.0400'
          format: double
          maxLength: 20
          minLength: 4
          pattern: ^\d{1,15}\.\d{2,4}$
          type: string
        currency:
          description: Moneda referente al valor monetario, siguiendo el modelo ISO-4217.
          example: BRL
          maxLength: 3
          pattern: ^[A-Z]{3}$
          type: string
      required:
      - amount
      - currency
      type: object
    CreditCardsAccountsBillTotalAmount:
      description: "Valor total de las facturas.\nEl campo debe asumir valor positivo para saldo deudor y negativo para saldo acreedor.\n"
      properties:
        amount:
          description: Valor total de las facturas. Expresado en valor monetario con un mínimo de 2 y un máximo de 4 decimales.
          example: '1000.0400'
          format: double
          maxLength: 21
          minLength: 4
          pattern: ^-?\d{1,15}\.\d{2,4}$
          type: string
        currency:
          description: Moneda referente al valor monetario, siguiendo el modelo ISO-4217.
          example: BRL
          maxLength: 3
          pattern: ^[A-Z]{3}$
          type: string
      required:
      - amount
      - currency
      type: object
    CreditCardsAccountsBillsData:
      description: Conjunto de las informaciones referentes a la lista de facturas asociadas a la cuenta de pago pospago
      properties:
        billClosingDate:
          description: fecha de cierre de la Factura
          example: '2021-05-21'
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          type: string
        billId:
          description: Código único e inmutable que identifica la factura.
          example: 3459087XXZTR
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        billMinimumAmount:
          $ref: '#/components/schemas/CreditCardsAccountsBillMinimumAmount'
        billTotalAmount:
          $ref: '#/components/schemas/CreditCardsAccountsBillTotalAmount'
        dueDate:
          description: Fecha de vencimiento de la Factura, que aparece para el pago por parte del cliente
          example: '2021-05-21'
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          type: string
        financeCharges:
          description: Lista de los cargos cobrados en la factura
          items:
            $ref: '#/components/schemas/CreditCardsAccountsBillsFinanceCharge'
          minItems: 1
          type: array
        isInstalment:
          description: Indica si la factura permite el pago en cuotas (true) o no (false).
          example: false
          type: boolean
        payments:
          description: "Lista que trae los valores relativos a los pagos de la Factura de la cuenta de pago pospago.\nLos pagos efectuados a partir del momento en que una nueva factura es cerrada y expuesta deben estar listados en la factura cerrada, hasta que haya un nuevo cierre.\n"
          items:
            $ref: '#/components/schemas/CreditCardsAccountsBillsPayment'
          minItems: 0
          type: array
      required:
      - billId
      - dueDate
      - billClosingDate
      - billTotalAmount
      - billMinimumAmount
      - isInstalment
      - payments
      type: object
    CreditCardsAccountsBillsFinanceCharge:
      properties:
        additionalInfo:
          description: Campo libre, de cumplimentación obligatoria si se selecciona el tipo de cargo 'OUTROS'
          example: Informações Adicionais
          maxLength: 140
          pattern: '[\w\W\s]*'
          type: string
        amount:
          description: Valor cobrado por el cargo. Expresado en valor monetario con un mínimo de 2 y un máximo de 4 decimales.
          example: '100000.0400'
          format: double
          maxLength: 20
          minLength: 4
          pattern: ^\d{1,15}\.\d{2,4}$
          type: string
        currency:
          description: "Moneda referente al valor cobrado por el cargo, según el modelo ISO-4217. p.ej. 'BRL' \nTodos los saldos informados están representados con la moneda vigente de Brasil.\n"
          example: BRL
          maxLength: 3
          pattern: ^(\w{3}){1}$
          type: string
        type:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsFinanceChargeType'
      required:
      - type
      - amount
      - currency
      type: object
    CreditCardsAccountsBillsPayment:
      properties:
        amount:
          description: "Valor del pago según el valueType.  \nExpresado en valor monetario con un mínimo de 2 y un máximo de 4 decimales.   \nEl campo no puede asumir valor negativo por tratarse de un pago.\n"
          example: '1000.0400'
          format: double
          maxLength: 20
          minLength: 4
          pattern: ^\d{1,15}\.\d{2,4}$
          type: string
        currency:
          description: "Moneda referente al valor de pago de la factura, según el modelo ISO-4217. p.ej. 'BRL' Todos los valores informados están representados con la moneda vigente de Brasil\n"
          example: BRL
          maxLength: 3
          pattern: ^(\w{3}){1}$
          type: string
        paymentDate:
          description: Fecha efectiva de cuándo fue realizado el Pago de la factura
          example: '2021-05-21'
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          type: string
        paymentMode:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsPaymentMode'
        valueType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsBillingValueType'
      required:
      - valueType
      - paymentDate
      - paymentMode
      - amount
      - currency
      type: object
    CreditCardsAccountsBillsTransactions:
      description: Lista que trae los valores relativos a los saldos del Límite de crédito total de la cuenta de pago pospago
      properties:
        amount:
          $ref: '#/components/schemas/CreditCardsAccountsTransactionAmountBills'
        billId:
          description: Código único e inmutable que identifica la factura en la que consta la transacción informada.
          example: MTU0OTU1NjI2NTk4OTRmc2ZhZDRmc2Q1NmZkM
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        billPostDate:
          description: "Fecha en que la transacción fue insertada en la factura.\n"
          example: '2021-05-21'
          format: date
          maxLength: 20
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          type: string
        brazilianAmount:
          $ref: '#/components/schemas/CreditCardsAccountsTransactionBrazilianAmountBills'
        chargeIdentificator:
          description: "Número de la cuota que se está informando.\n\n[Restricción] De cumplimentación obligatoria si el Tipo de Pago (paymentType) seleccionado es 'A_PRAZO'.\n"
          example: 12
          format: integer
          maximum: 999
          minimum: 1
          type: number
        chargeNumber:
          description: "Cantidad de cuotas.   \n[Restricción] El campo debe ser cumplimentado cuando existan cuotas relacionadas con la transacción.\n"
          example: 12
          format: integer
          maximum: 999
          type: number
        creditDebitType:
          $ref: '#/components/schemas/EnumCreditDebitIndicator'
        feeType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountFee'
        feeTypeAdditionalInfo:
          description: Campo libre, de cumplimentación obligatoria cuando se selecciona el tipo de tarifa "OUTRA"
          maxLength: 140
          pattern: ^\S[\s\S]*$
          type: string
        identificationNumber:
          description: "Número de identificación de la tarjeta: corresponde a los 4 últimos dígitos de la tarjeta para PF, o bien, cumplimentar con un identificador para PJ, con las características definidas para los IDs en el Open Finance.\n"
          example: '4453'
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        otherCreditsAdditionalInfo:
          description: "Campo libre para la cumplimentación de datos adicionales de otros tipos de crédito contratados en la tarjeta.\n\n[Restricción] De cumplimentación obligatoria cuando se selecciona \"OUTROS\" en el campo otros tipos de crédito.\n"
          maxLength: 50
          pattern: ^\S[\s\S]*$
          type: string
        otherCreditsType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsOtherCreditType'
        payeeMCC:
          description: "El MCC o el código de la categoría del establecimiento comercial. Los MCC se agrupan según sus similitudes. El MCC se utiliza para clasificar el negocio por el tipo de bienes o servicios suministrados. Los MCC se atribuyen por tipo de comerciante (por ejemplo, uno para hoteles, uno para tiendas de material de oficina, etc.) o por nombre de comerciante (por ejemplo, 3000 para United Airlines).\n\n[Restricción] Información de envío obligatorio cuando el valor del campo transactionType sea igual a PAGAMENTO.\n"
          example: 5137
          format: integer
          maximum: 2147483647
          type: number
        paymentType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsPaymentType'
        transactionDateTime:
          description: "Fecha y hora de la transacción.   \n\nEn las compras en cuotas, el `transactionDateTime` debe ser idéntico en todas las cuotas. El campo debe reflejar obligatoriamente la información exhibida al cliente en los canales digitales de la institución, con precisión de fecha, hora y minuto — incluso si la institución no exhibe ese nivel de granularidad en sus canales. En esos casos, los segundos y milisegundos pueden ser cumplimentados con cero (0). Ejemplo: 2024-01-29T11:15:00.000Z.\n"
          example: '2016-01-29T12:29:03.374Z'
          format: date-time
          maxLength: 24
          pattern: (^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)\.(?:[0-9]){3}Z$)
          type: string
        transactionId:
          description: "Código o identificador único proporcionado por la institución que mantiene la cuenta para representar la transacción individual. \nSe espera que el `transactionId` sea único, inmutable y estable.\n"
          example: TXpRMU9UQTROMWhZV2xSU1FUazJSMDl
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        transactionName:
          description: Literal utilizada en la institución financiera para identificar la transacción. La información presentada debe ser la misma utilizada en los canales electrónicos de la institución (extracto y factura).
          example: PGTO
          maxLength: 200
          pattern: '[\w\W\s]*'
          type: string
        transactionType:
          $ref: '#/components/schemas/EnumCreditCardTransactionType'
        transactionalAdditionalInfo:
          description: Campo libre, de cumplimentación obligatoria cuando se selecciona el tipo de transacción "OUTROS"
          maxLength: 140
          pattern: ^\S[\s\S]*$
          type: string
      required:
      - transactionId
      - identificationNumber
      - transactionName
      - creditDebitType
      - transactionType
      - brazilianAmount
      - amount
      - transactionDateTime
      - billPostDate
      type: object
    CreditCardsAccountsData:
      description: Conjunto de información de las Cuentas de pago pospago
      properties:
        brandName:
          description: Nombre de la Marca reportada por el participante en el Open Finance. Se recomienda utilizar, siempre que sea posible, el mismo nombre de marca atribuido en el campo del directorio Customer Friendly Server Name (Authorisation Server).
          example: Organização A
          maxLength: 80
          pattern: '[\w\W\s]*'
          type: string
        companyCnpj:
          description: Registro completo del CNPJ de la institución responsable del Registro – el CNPJ corresponde a la representación alfanumérica de la inscripción en el Cadastro de Pessoa Jurídica. Se deben tener únicamente los caracteres del CNPJ, sin máscara.
          example: '21128159000166'
          maxLength: 14
          pattern: ^[0-9A-Z]{12}[0-9]{2}$
          type: string
        creditCardAccountId:
          description: Identifica de forma única la cuenta de pago pospago del cliente, manteniendo las reglas de inmutabilidad dentro de la institución transmisora.
          example: XXZTR3459087
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        creditCardNetwork:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountNetwork'
        name:
          description: 'Denominación/Identificación del nombre de la cuenta de pago pospago (tarjeta). Conforme a la CIRCULAR N.º 3.680,BCB, 2013: ''cuenta de pago pospago: destinada a la ejecución de transacciones de pago que no dependen del aporte previo de recursos'
          example: Cartão Universitário
          maxLength: 50
          pattern: '[\w\W\s]*'
          type: string
        networkAdditionalInfo:
          description: Texto libre para especificar la categoría de marca de tarjeta marcada como 'OUTRAS'
          example: AURA CARD
          maxLength: 50
          pattern: '[\w\W\s]*'
          type: string
        productAdditionalInfo:
          description: Información complementaria si el tipo de Tarjeta es 'OUTROS'
          maxLength: 50
          pattern: '[\w\W\s]*'
          type: string
        productType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsProductType'
      required:
      - brandName
      - companyCnpj
      - name
      - productType
      - creditCardNetwork
      - creditCardAccountId
      type: object
    CreditCardsAccountsEnumCreditCardAccountFee:
      description: "Presenta los tipos de Tarifas: (Ver Enum) Anualidad, Retiro con tarjeta en Brasil, Retiro con tarjeta en el exterior, Evaluación de emergencia de crédito, Emisión de segunda copia, Tarifa de pago de cuentas, SMS, OUTRA.\n\n[Restricción] De cumplimentación obligatoria si el Tipo de Transacción seleccionado es 'TARIFA'.\n"
      enum:
      - ANUIDADE
      - SAQUE_CARTAO_BRASIL
      - SAQUE_CARTAO_EXTERIOR
      - AVALIACAO_EMERGENCIAL_CREDITO
      - EMISSAO_SEGUNDA_VIA
      - TARIFA_PAGAMENTO_CONTAS
      - SMS
      - OUTRA
      example: ANUIDADE
      type: string
    CreditCardsAccountsEnumCreditCardAccountNetwork:
      description: "Categoría de Marcas de Tarjetas de Crédito (Instituidor del arreglo de pago).\nLa marca es la titular de todos los derechos y deberes de la utilización de la marca estampada en la tarjeta, incluidas las marcas pertenecientes a los emisores.\n"
      enum:
      - VISA
      - MASTERCARD
      - AMERICAN_EXPRESS
      - DINERS_CLUB
      - HIPERCARD
      - BANDEIRA_PROPRIA
      - CHEQUE_ELETRONICO
      - ELO
      - OUTRAS
      example: VISA
      type: string
    CreditCardsAccountsEnumCreditCardAccountsBillingValueType:
      description: "Presenta los tipos de valores relativos a los pagos de la factura de la cuenta de pago pospago: (Ver Enum)\n - Valor de pago de la factura con fraccionamiento en cuotas\n - Valor de pago de la factura realizado\n - Otro Valor pagado en la factura\n\n VALOR_PAGAMENTO_FATURA_PARCELADO: Cuando el pago corresponde al hecho generador para la apertura del plan de fraccionamiento en cuotas de la factura\n\n VALOR_PAGAMENTO_FATURA_REALIZADO: Cuando el pago corresponde al valor total de la factura\n\n OUTRO_VALOR_PAGO_FATURA: Demás casos\n"
      enum:
      - VALOR_PAGAMENTO_FATURA_PARCELADO
      - VALOR_PAGAMENTO_FATURA_REALIZADO
      - OUTRO_VALOR_PAGO_FATURA
      type: string
    CreditCardsAccountsEnumCreditCardAccountsConsolidationType:
      description: "Indicador que permite informar si el valor del límite es consolidado o individual.\n\nCONSOLIDADO: utilizado cuando el límite de la cuenta tarjeta es compartido entre todos los métodos de pago (paymentMethod) vinculados a la cuenta.\n\nINDIVIDUAL: Utilizado cuando cada método de pago (paymentMethod) posee su límite segregado.\n"
      enum:
      - CONSOLIDADO
      - INDIVIDUAL
      example: CONSOLIDADO
      type: string
    CreditCardsAccountsEnumCreditCardAccountsFinanceChargeType:
      description: "Presenta la denominación de los Cargos que\ninciden en la factura de la cuenta de pago pospago. (Ver Enum)\n- Intereses remuneratorios por atraso en el pago de la factura\n- Multa por atraso en el pago de la factura\n- Intereses de mora por atraso en el pago de la factura\n- IOF\n- Otros\n"
      enum:
      - JUROS_REMUNERATORIOS_ATRASO_PAGAMENTO_FATURA
      - MULTA_ATRASO_PAGAMENTO_FATURA
      - JUROS_MORA_ATRASO_PAGAMENTO_FATURA
      - IOF
      - OUTROS
      type: string
    CreditCardsAccountsEnumCreditCardAccountsLineLimitType:
      description: "Indicador del tipo de límite\n\nLIMITE_CREDITO_TOTAL: Límite de crédito total aplicado a la cuenta tarjeta.\n\nLIMITE_CREDITO_MODALIDADE_OPERACAO: Límite de crédito por modalidad de esa cuenta tarjeta (observar lineName y listar los aplicables de la institución).\n"
      enum:
      - LIMITE_CREDITO_TOTAL
      - LIMITE_CREDITO_MODALIDADE_OPERACAO
      example: LIMITE_CREDITO_TOTAL
      type: string
    CreditCardsAccountsEnumCreditCardAccountsOtherCreditType:
      description: "Presenta otros tipos de crédito contratados en la tarjeta.\n\n[Restricción] De cumplimentación obligatoria si el tipo de transacción seleccionado es 'OPERACOES_CREDITO_CONTRATADAS_CARTAO'.\n"
      enum:
      - CREDITO_ROTATIVO
      - PARCELAMENTO_FATURA
      - EMPRESTIMO
      - OUTROS
      example: CREDITO_ROTATIVO
      type: string
    CreditCardsAccountsEnumCreditCardAccountsPaymentMode:
      description: "Presenta las formas de efectivización del pago realizado: (Ver Enum)\n- Débito en cuenta corriente\n- Boleto bancario\n- Descuento en nómina\n- PIX\n"
      enum:
      - DEBITO_CONTA_CORRENTE
      - BOLETO_BANCARIO
      - AVERBACAO_FOLHA
      - PIX
      type: string
    CreditCardsAccountsEnumCreditCardAccountsPaymentType:
      description: "Presenta los tipos de pago.\n\n[Restricción] De cumplimentación obligatoria si el Tipo de Transacción seleccionado es 'PAGAMENTO'.\n"
      enum:
      - A_VISTA
      - A_PRAZO
      example: A_VISTA
      type: string
    CreditCardsAccountsEnumCreditCardAccountsProductType:
      description: Categoría atribuida a una tarjeta de pago, bajo una determinada denominación, que le agrega un conjunto de ventajas, diferenciándola de acuerdo con el perfil del portador.
      enum:
      - CLASSIC_NACIONAL
      - CLASSIC_INTERNACIONAL
      - GOLD
      - PLATINUM
      - INFINITE
      - ELECTRON
      - STANDARD_NACIONAL
      - STANDARD_INTERNACIONAL
      - ELETRONIC
      - BLACK
      - REDESHOP
      - MAESTRO_MASTERCARD_MAESTRO
      - GREEN
      - BLUE
      - BLUEBOX
      - PROFISSIONAL_LIBERAL
      - CHEQUE_ELETRONICO
      - CORPORATIVO
      - EMPRESARIAL
      - COMPRAS
      - BASICO_NACIONAL
      - BASICO_INTERNACIONAL
      - NANQUIM
      - GRAFITE
      - MAIS
      - OUTROS
      example: OUTROS
      type: string
    CreditCardsAccountsIdentificationData:
      description: Conjunto de información referente a la identificación de la cuenta de pago pospago.
      properties:
        creditCardNetwork:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountNetwork'
        name:
          description: "Denominación/Identificación del nombre de la cuenta de pago pospago (tarjeta). Conforme a la CIRCULAR N.º 3.680,BCB, 2013: 'cuenta de pago pospago: destinada a la ejecución de transacciones de pago que no dependen del aporte previo de recursos'.\n"
          example: Cartão Universitário
          maxLength: 50
          pattern: '[\w\W\s]*'
          type: string
        networkAdditionalInfo:
          description: Texto libre para especificar la categoría de marca de tarjeta marcada como 'OUTRAS'.
          example: AURA CARD
          maxLength: 50
          pattern: '[\w\W\s]*'
          type: string
        paymentMethod:
          description: "Listado de las tarjetas (ej.: virtual/adicional/titular) asociadas a la cuenta tarjeta consentida, conforme estén disponibles al usuario en los canales propietarios.\n\nEl envío del listado paymentMethod vacío solo debe ocurrir en los siguientes escenarios:\n- Cuenta con pago activo, pero con todos los métodos de pago cancelados;\n- Cuenta nueva sin emisión de métodos de pago;\n- Cuenta con tarjeta no-name: entrega de tarjeta de emergencia al cliente sin datos del cliente en el plástico;\n- Cuenta bloqueada por hurto, robo o pérdida: la tarjeta está inactiva y a la espera del embossing de una nueva tarjeta;\n- Cuenta suspendida: cuenta suspendida por falta de pago, suspensión judicial, entre otros, sin embargo la tarjeta se mantiene en posesión del cliente;\n- Cuenta inactiva: sin utilización de tarjeta por más de X días, sin embargo la tarjeta aún está vinculada al cliente;\n- Cuenta a la espera / revisión del análisis del cliente: el cliente ya solicitó tarjeta, embossing en proceso, pero aún hay análisis adicionales (ej.: fraude) por concluir.\n"
          items:
            $ref: '#/components/schemas/CreditCardsAccountsAccountPaymentMethod'
          minItems: 0
          type: array
        productAdditionalInfo:
          description: Información complementaria si el tipo de Tarjeta es 'OUTROS'
          example: OURO_INTERNACIONAL
          maxLength: 50
          pattern: '[\w\W\s]*'
          type: string
        productType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsProductType'
      required:
      - name
      - productType
      - creditCardNetwork
      - paymentMethod
      type: object
    CreditCardsAccountsLimitAmount:
      description: "Valor total del límite concedido.\n"
      properties:
        amount:
          description: "Valor total del límite informado expresado en valor monetario con un mínimo de 2 y un máximo de 4 decimales.\n\n[Restricción] El campo es obligatorio en caso de que isLimitFlexible sea igual a false.\n"
          example: '1000.0400'
          format: double
          maxLength: 20
          minLength: 4
          pattern: ^\d{1,15}\.\d{2,4}$
          type: string
        currency:
          description: "Moneda referente al límite informado, según el modelo ISO-4217. p.ej. 'BRL.'\nTodos los límites informados están representados con la moneda vigente de Brasil.\n\n[Restricción] El campo es obligatorio en caso de que isLimitFlexible sea igual a false.\n"
          example: BRL
          maxLength: 3
          pattern: ^[A-Z]{3}$
          type: string
        limitAmountReason:
          description: "Razón por la cual el valor total del límite informado es igual a cero.\n\n[Restricción] Campo de cumplimentación obligatoria cuando limitAmount sea igual a 0.00.\n"
          example: O perfil do cliente passou por uma análise e o limite precisou ser zerado
          maxLength: 200
          pattern: '[\w\W\s]*'
          type: string
      required:
      - amount
      - currency
      type: object
    CreditCardsAccountsLimitsData:
      description: Conjunto de información referente a los límites de la cuenta de pago pospago.
      properties:
        availableAmount:
          $ref: '#/components/schemas/CreditCardsAccountsAvailableAmount'
        consolidationType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsConsolidationType'
        creditLineLimitType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsLineLimitType'
        customizedLimitAmount:
          description: "Valor total del límite personalizado por el cliente en los canales electrónicos de la institución. Este objeto es de envío obligatorio en los casos en que la institución permita al cliente alterar su límite.\n"
          properties:
            amount:
              description: "Valor total del límite informado expresado en valor monetario con un mínimo de 2 y un máximo de 4 decimales.\n"
              example: '1000.0400'
              format: double
              maxLength: 20
              minLength: 4
              pattern: ^\d{1,15}\.\d{2,4}$
              type: string
            currency:
              description: "Moneda referente al límite informado, según el modelo ISO-4217. p.ej. 'BRL.' Todos los límites informados están representados con la moneda vigente de Brasil.\n"
              example: BRL
              maxLength: 3
              pattern: ^[A-Z]{3}$
              type: string
          required:
          - amount
          - currency
          type: object
        identificationNumber:
          description: "Número de identificación de la tarjeta: corresponde a los 4 últimos dígitos de la tarjeta para PF, o bien, cumplimentar con un identificador para PJ, con las características definidas para los IDs en el Open Finance.\n"
          example: '4453'
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        isLimitFlexible:
          description: True= Indica que la cuenta tarjeta posee límite total flexible o “sin límite”. False = Indica que la cuenta tarjeta posee límite predeterminado exhibido en el canal para el cliente.
          example: true
          type: boolean
        limitAmount:
          $ref: '#/components/schemas/CreditCardsAccountsLimitAmount'
        lineName:
          enum:
          - CREDITO_A_VISTA
          - CREDITO_PARCELADO
          - SAQUE_CREDITO_BRASIL
          - SAQUE_CREDITO_EXTERIOR
          - EMPRESTIMO_CARTAO_CONSIGNADO
          - OUTROS
          example: CREDITO_A_VISTA
          type: string
        lineNameAdditionalInfo:
          description: Campo de cumplimentación obligatoria si se selecciona la opción 'OUTRAS' en lineName.
          example: Informações adicionais e complementares.
          maxLength: 50
          pattern: '[\w\W\s]*'
          type: string
        usedAmount:
          $ref: '#/components/schemas/CreditCardsAccountsUsedAmount'
      required:
      - creditLineLimitType
      - consolidationType
      - identificationNumber
      - isLimitFlexible
      - usedAmount
      type: object
    CreditCardsAccountsLinks:
      description: Referencias a otros recursos de la API solicitada.
      properties:
        first:
          description: URI de la primera página que originó esta lista de resultados. Restricción - Obligatorio cuando no sea la primera página de la respuesta
          example: https://api.banco.com.br/open-banking/api/v2/resource
          format: url
          maxLength: 4048
          type: string
        last:
          description: URI de la última página de esta lista de resultados. Restricción - Obligatorio cuando no sea la última página de la respuesta
          example: https://api.banco.com.br/open-banking/api/v2/resource
          format: url
          maxLength: 4048
          type: string
        next:
          description: URI de la página siguiente de esta lista de resultados. Restricción - Obligatorio cuando no sea la última página de la respuesta
