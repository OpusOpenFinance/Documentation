      properties:
        transactionId:
          type: string
          description: Código o identificador único proporcionado por la institución que mantiene la representación individual del movimiento en la posición del fondo.
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: ABCD2126019929279212650822221989319253344
        type:
          $ref: '#/components/schemas/FundsEnumTransactionsCurrentType'
        transactionType:
          $ref: '#/components/schemas/FundsEnumTransactionsCurrentTransactionType'
        transactionTypeAdditionalInfo:
          type: string
          description: |
            Información adicional del tipo del motivo, para cumplimentar en el caso de movimientos no delimitados en el dominio.

            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando el campo 'transactionType' esté cumplimentado con el valor 'OUTROS'.
          maxLength: 100
          pattern: '[\w\W\s]*'
        transactionConversionDate:
          type: string
          format: date
          description: Fecha de la conversión de la transacción de movimiento del fondo de inversión.
          maxLength: 10
          minLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2023-01-07'
        transactionQuotaPrice:
          type: object
          description: 'Es el valor de la cuota utilizada en la conversión para la realización del movimiento del cliente en el fondo, conforme a la regla prevista en el reglamento - el valor puede ser negativo.'
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor relacionado con el objeto.
              maxLength: 25
              pattern: '^-?\d{1,15}\.\d{2,8}$'
              example: '1000.04'
            currency:
              type: string
              description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        transactionQuotaQuantity:
          type: string
          format: double
          description: |
            Número de cuotas convertidas en la fecha del movimiento.
          maxLength: 24
          pattern: '^\d{1,15}\.\d{2,8}$'
          example: '42.25'
        transactionValue:
          type: object
          description: Valor solicitado por el cliente.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor relacionado con el objeto.
              maxLength: 21
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              example: '1000.04'
            currency:
              type: string
              description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        transactionGrossValue:
          type: object
          description: |
            Valor del movimiento que se refiere a la cantidad de cuotas x valor de la cuota del movimiento.
            En los casos en que no haya movimiento de cuotas, por ejemplo: amortización, no considerar la regla descrita.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor relacionado con el objeto.
              maxLength: 21
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              example: '1000.04'
            currency:
              type: string
              description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        incomeTax:
          type: object
          description: |
            Valor del Impuesto sobre la Renta (IR) retenido en la fuente considerando la alícuota vigente en la fecha del movimiento.

            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando el campo 'type' esté cumplimentado con el valor 'SAIDA'.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor relacionado con el objeto.
              maxLength: 21
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              example: '1000.04'
            currency:
              type: string
              description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        financialTransactionTax:
          type: object
          description: |
            Valor del Impuesto sobre Operaciones Financieras (IOF) retenido en la fuente considerando la alícuota vigente en la fecha del movimiento.

            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando el campo 'type' esté cumplimentado con el valor 'SAIDA'.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor relacionado con el objeto.
              maxLength: 21
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              example: '1000.04'
            currency:
              type: string
              description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        transactionExitFee:
          type: object
          description: |
            Valor de la tasa de salida considerado en el movimiento.

            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando el campo 'type' esté cumplimentado con el valor 'SAIDA'.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor relacionado con el objeto.
              maxLength: 20
              pattern: '^\d{1,15}\.\d{2,4}$'
              example: '1000.04'
            currency:
              type: string
              description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        transactionNetValue:
          type: object
          description: |
            Valor neto del movimiento posterior a la deducción de impuestos (IOF e IR) y tasa de salida.
            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando el campo 'type' esté cumplimentado con el valor 'SAIDA'.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor relacionado con el objeto.
              maxLength: 21
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              example: '1000.04'
            currency:
              type: string
              description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
      additionalProperties: false
    FundsEnumTransactionsType:
      type: string
      description: |
        Tipo de movimiento (Entrada o Salida).

        ENTRADA: APLICACAO, TRANSFERENCIA_COTAS,  OUTROS.

        SAIDA: RESGATE, COME_COTAS, TRANSFERENCIA_COTAS, AMORTIZACAO, OUTROS.
      enum:
        - ENTRADA
        - SAIDA
      example: ENTRADA
    FundsEnumTransactionsTransactionType:
      type: string
      description: |
        El campo debe clasificar la transacción de movimiento de inversión en uno de los tipos descritos (amortización, transferencia de cuotas, aplicación, rescate o come-cotas).
        La opción OUTROS solo debe utilizarse para los casos en que efectivamente la transacción compartida no pueda clasificarse como uno de los ítems de este Enum, y en ese caso se deben cumplimentar informaciones adicionales.
      enum:
        - AMORTIZACAO
        - TRANSFERENCIA_COTAS
        - APLICACAO
        - RESGATE
        - COME_COTAS
        - OUTROS
      example: AMORTIZACAO
    FundsEnumTransactionsCurrentType:
      type: string
      description: |
        Tipo de movimiento (Entrada o Salida).

        ENTRADA: APLICACAO, TRANSFERENCIA_COTAS,  OUTROS.

        SAIDA: RESGATE, COME_COTAS, TRANSFERENCIA_COTAS, AMORTIZACAO, OUTROS.
      enum:
        - ENTRADA
        - SAIDA
      example: ENTRADA
    FundsEnumTransactionsCurrentTransactionType:
      type: string
      description: |
        El campo debe clasificar la transacción de movimiento de inversión en uno de los tipos descritos (amortización, transferencia de cuotas, aplicación, rescate o come-cotas).
        La opción OUTROS solo debe utilizarse para los casos en que efectivamente la transacción compartida no pueda clasificarse como uno de los ítems de este Enum, y en ese caso se deben cumplimentar informaciones adicionales.
      enum:
        - AMORTIZACAO
        - TRANSFERENCIA_COTAS
        - APLICACAO
        - RESGATE
        - COME_COTAS
        - OUTROS
      example: AMORTIZACAO
