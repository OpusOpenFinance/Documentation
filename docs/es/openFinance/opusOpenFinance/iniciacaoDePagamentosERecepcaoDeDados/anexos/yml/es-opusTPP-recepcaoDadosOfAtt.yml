    LoansListContract:
      type: object
      description: Conjunto de informaciones de contratos de préstamo mantenidos por el cliente en la institución transmisora y para los cuales él haya proporcionado consentimiento
      required:
      - contractId
      - brandName
      - companyCnpj
      - productType
      - productSubType
      - ipocCode
      - productSubTypeCategory
      properties:
        contractId:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          maxLength: 100
          minLength: 1
          example: '92792126019929279212650822221989319252576'
          description: Identifica de forma única el contrato de la operación de crédito del cliente, manteniendo las reglas de inmutabilidad dentro de la institución transmisora.
        brandName:
          type: string
          pattern: ^[^\s](.*[^\s])?$
          maxLength: 80
          example: Organização A
          description: Nombre de la Marca reportada por el participante en el Open Finance. Se recomienda utilizar, siempre que sea posible, el mismo nombre de marca atribuido en el campo del directorio Customer Friendly Server Name (Authorisation Server).
        companyCnpj:
          type: string
          pattern: ^[0-9A-Z]{12}[0-9]{2}$
          maxLength: 14
          example: '21128159000166'
          description: Representación alfanumérica completa del CNPJ de la institución responsable del contrato de préstamo a fin de identificar la institución acreedora en los casos de portabilidad de crédito - el CNPJ corresponde al registro alfanumérico de inscripción en el Cadastro de Pessoa Jurídica. Se debe tener únicamente la representación alfanumérica del CNPJ, sin máscara.
        productType:
          $ref: '#/components/schemas/LoansEnumContractProductTypeLoans'
        productSubType:
          $ref: '#/components/schemas/LoansEnumContractProductSubTypeLoans'
        productSubTypeCategory:
          $ref: '#/components/schemas/LoansEnumContractProductSubTypeCategory'
        ipocCode:
          type: string
          maxLength: 67
          minLength: 22
          pattern: ^[\w\W]{22,67}$
          example: '92792126019929279212650822221989319252576'
          description: "Número estandarizado del contrato - IPOC (Identificação Padronizada da Operação de Crédito). Según el DOC 3040, compuesto por:\n- **CNPJ de la institución:** 8 (ocho) posiciones iniciales;\n- **Modalidad de la operación:** 4 (cuatro) posiciones;\n- **Tipo del cliente:** 1 (una) posición( 1 = persona natural - CPF, 2= persona jurídica – CNPJ, 3 = persona física en el exterior, 4 = persona jurídica en el exterior, 5 = persona natural sin CPF y 6 = persona jurídica sin CNPJ);\n- **Código del cliente:** El número de posiciones varía conforme el tipo del cliente:\n  1. Para clientes persona física con CPF (tipo de cliente = 1), informar las 11 (once) posiciones del CPF;\n  2. Para clientes persona jurídica con CNPJ (tipo de cliente = 2), informar las 8 (ocho) posiciones iniciales del CNPJ;\n  3. Para los demás clientes (tipos de cliente 3, 4, 5 y 6), informar 14 (catorce) posiciones con complemento de ceros a la izquierda si la identificación tuviera tamaño inferior;\n- **Código del contrato:** 1 (una) hasta 40 (cuarenta) posiciones, sin complemento de caracteres.          \n"
    LoansEnumContractTaxPeriodicity:
      type: string
      description: "\"Periodicidad de la tasa. (Véase  Enum)\na.m - al mes\na.a. - al año\"\n"
      enum:
      - AM
      - AA
      example: AA
    LoansFinanceCharge:
      type: object
      description: Conjunto de informaciones referentes a la identificación de la operación de crédito
      required:
      - chargeType
      properties:
        chargeType:
          $ref: '#/components/schemas/LoansEnumContractFinanceChargeType'
        chargeAdditionalInfo:
          type: string
          maxLength: 140
          description: "Campo para informaciones adicionales.\n\n[Restricción] Obligatorio si se selecciona la opción 'OUTROS' en Tipo de cargo pactado en el contrato.\n"
          pattern: ^[^\s](.*[^\s])?$
          example: Informações adicionais sobre encargos.
        chargeRate:
          type: string
          pattern: ^\d{1}\.\d{6}$
          format: double
          maxLength: 8
          minLength: 8
          description: "Representa el valor del cargo en porcentaje pactado en el contrato.\n\nLa cumplimentación debe respetar las 6 posiciones decimales, aunque vengan cumplimentadas con ceros(representación de porcentaje p.ej.: 0.150000. Este valor representa 15%. El valor 1 representa 100%).\n"
          example: '0.070000'
    LoansEnumContractReferentialRateIndexerSubType:
      type: string
      description: "\"Subtipos de tasas referenciales o indexadores, conforme al Anexo 5: Tasa referencial o Indexador (Indx), del Documento 3040.\n\n[Restricción] En caso de que en el campo postFixedRate se informe un valor aplicable al contrato, el envío de este campo será obligatorio.\"\n"
      enum:
      - SEM_SUB_TIPO_INDEXADOR
      - PRE_FIXADO
      - TR_TBF
      - TJLP
      - LIBOR
      - TLP
      - OUTRAS_TAXAS_POS_FIXADAS
      - CDI
      - SELIC
      - OUTRAS_TAXAS_FLUTUANTES
      - IGPM
      - IPCA
      - IPCC
      - OUTROS_INDICES_PRECO
      - TCR_PRE
      - TCR_POS
      - TRFC_PRE
      - TRFC_POS
      - OUTROS_INDEXADORES
      example: TJLP
    LoansContractInterestRate:
      type: object
      description: Objeto que presenta el conjunto de informaciones necesarias para demostrar la composición de las tasas de interés remuneratorias de la Modalidad de crédito
      required:
      - taxType
      - interestRateType
      - taxPeriodicity
      - calculation
      - referentialRateIndexerType
      properties:
        taxType:
          $ref: '#/components/schemas/LoansEnumContractTaxType'
        interestRateType:
          $ref: '#/components/schemas/LoansEnumContractInterestRateType'
        taxPeriodicity:
          $ref: '#/components/schemas/LoansEnumContractTaxPeriodicity'
        calculation:
          $ref: '#/components/schemas/LoansEnumContractCalculation'
        referentialRateIndexerType:
          $ref: '#/components/schemas/LoansEnumContractReferentialRateIndexerType'
        referentialRateIndexerSubType:
          $ref: '#/components/schemas/LoansEnumContractReferentialRateIndexerSubType'
        referentialRateIndexerAdditionalInfo:
          type: string
          description: "Campo libre para complementar la información relativa al Tipo de tasa referencial o indexador.\n[Restricción] Obligatorio para complementar la información relativa al Tipo de tasa referencial o indexador, cuando se seleccione el tipo o subtipo OUTRO.\n"
          maxLength: 140
          pattern: ^[^\s](.*[^\s])?$
          example: Informações adicionais
        preFixedRate:
          type: string
          pattern: ^\d{1,2}\.\d{6}$
          format: double
          maxLength: 9
          minLength: 8
          example: '0.600000'
          description: "Tasa prefijada aplicada sobre el contrato de la modalidad de crédito. p.ej. 0.014500. La cumplimentación debe respetar las 6 posiciones decimales, aunque vengan cumplimentadas con ceros(representación de porcentaje p.ej.: 0.150000. Este valor representa 15%. El valor 1 representa 100%).\n\n[Restricción] Este campo es de envío obligatorio en caso de que no sea enviado el campo postFixedRate.\n"
        postFixedRate:
          type: string
          pattern: ^\d{1,2}\.\d{6}$
          format: double
          maxLength: 9
          minLength: 8
          description: "Tasa posfijada aplicada sobre el contrato de la modalidad de crédito. p.ej. 0.0045.La cumplimentación debe respetar las 6 posiciones decimales, aunque vengan cumplimentadas con ceros (representación de porcentaje p.ej.: 0.1500. Este valor representa 15%. El valor 1 representa 100%). Para tasas posfijadas es necesario informar el indexador (campo referentialRateIndexerSubType).\n\n[Restricción] Este campo es de envío obligatorio en caso de que no sea enviado el campo preFixedRate.\n"
          example: '0.550000'
        additionalInfo:
          type: string
          maxLength: 1200
          pattern: ^[^\s](.*[^\s])?$
          example: Informações adicionais
          description: "Texto con informaciones adicionales sobre la composición de las tasas de interés pactadas. \n\n[Restricción] En caso de que la institución posea la información para compartir, esta deberá ser informada.\n"
    LoansLinksNonPaginated:
      type: object
      description: Referencias a otros recursos de la API solicitada.
      required:
      - self
      properties:
        self:
          type: string
          format: url
          maxLength: 4048
          description: URI completo que generó la respuesta actual.
          example: https://api.banco.com.br/open-banking/api/v1/resource
    LoansPayments:
      type: object
      description: Conjunto de informaciones referentes a los pagos realizados de una operación de crédito de préstamos.
      required:
      - contractOutstandingBalance
      - releases
      properties:
        paidInstalments:
          type: number
          maximum: 2147483647
          example: 73
          description: Cantidad total de cuotas pagadas del contrato referente a la Modalidad de Crédito informada.
        contractOutstandingBalance:
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: "Valor necesario para que el cliente liquide la deuda, o sea, este campo debe ser cumplimentado con el saldo deudor actualizado descrito en el DDC (Documento Descritivo de Crédito). El valor a liquidar actualizado del día debe ser ajustado para compartir por la Transmisora hasta las 10:00 del mismo día, especialmente para los productos contemplados en el alcance de Portabilidad de Crédito vía OFB, pues este valor es utilizado por la Receptora en papel de Proponente para el pago a la Transmisora en papel de Acreedora.  \n"
        lastUpdatedContractOutstandingBalance:
          type: string
          format: date-time
          description: "Fecha y hora de la última actualización del valor del campo contractOutstandingBalance, conforme a la especificación RFC-3339, formato UTC.\n\n[Restricción] Este campo es de envío obligatorio en caso de que el campo `productSubTypeCategory` sea cumplimentado con `CREDITO_PESSOAL_CLEAN` o `CONSIGNADO_SIAPE` en el endpoint /contracts/{contractId}.  \n"
          minLength: 24
          maxLength: 24
          example: '2021-05-21T08:30:03.374Z'
        totalRemainingAmount:
          description: "Valor total que falta para que el cliente liquide el contrato, considerando la sumatoria total de todas las cuotas por vencer y vencidas, así como todas las tasas, tarifas y cargos de las cuotas. En los casos de contrato con tasas posfijadas, considerar únicamente valores prefijados, ya que el cálculo posfijado ocurre solo en un momento futuro, y que el valor está sujeto a las variaciones de su indexador.\n\n[Restricción] Este campo es de envío obligatorio en caso de que el campo `productSubTypeCategory` sea cumplimentado con `CREDITO_PESSOAL_CLEAN` o `CONSIGNADO_SIAPE` en el endpoint /contracts/{contractId}.  \n"
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
        releases:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/LoansReleases'
          description: Lista de los pagos realizados en el período
    LoansFeeOverParcel:
      type: object
      required:
      - feeName
      - feeCode
      - feeAmount
      properties:
        feeName:
          type: string
          maxLength: 140
          pattern: ^[^\s](.*[^\s])?$
          example: Reavaliação periódica do bem
          description: "Denominación de la Tarifa pactada.\n"
        feeCode:
          type: string
          maxLength: 140
          pattern: ^[^\s](.*[^\s])?$
          example: aval_bem
          description: "Sigla identificadora de la tarifa pactada.\n"
        feeAmount:
          type: string
          pattern: ^-?\d{1,15}\.\d{2,4}$
          maxLength: 21
          minLength: 4
          example: '100000.0400'
          description: "Valor monetario de la tarifa pactada en el contrato.\n\nExpresado en valor monetario con un mínimo de 2 y un máximo de 4 posiciones decimales.\n"
    LoansResponseLoansContractList:
      type: object
