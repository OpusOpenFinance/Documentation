        operationOutstandingBalance:
          type: object
          description: Valor del saldo de la operación a liquidar en moneda extranjera. Objeto de envío obligatorio para eventos creados (eventDate) a partir del 15/04/2024 en los casos de operaciones de cambio con liquidación futura.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor relacionado con el objeto.
              maxLength: 20
              pattern: '^\d{1,17}\.\d{2}$'
              example: '1000.04'
            currency:
              type: string
              description: Moneda referente al valor monetario, siguiendo el modelo ISO-4217.
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        vetAmount:
          type: object
          description: Representa el costo de una operación de cambio en reales por moneda extranjera, englobando el tipo de cambio, las tarifas y los tributos que inciden sobre esa operación. Campo de envío obligatorio en las operaciones de cambio al contado que alcancen hasta el límite de US$100.000 o equivalente en otras monedas.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor relacionado con el objeto.
              maxLength: 31
              pattern: '\d{1,15}\.\d{1,15}$'
              example: '1000.000004'
            currency:
              type: string
              description: Moneda referente al valor monetario, siguiendo el modelo ISO-4217.
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        localCurrencyAdvancePercentage:
          type: string
          description: |
            Porcentaje del valor de moneda extranjera concedido al cliente anticipadamente. p.ej. 0.014500.

            La cumplimentación debe respetar las 6 casas decimales, aunque vengan cumplimentadas con ceros(representación de porcentaje p.ej: 0.150000. Este valor representa 15%. El valor 1 representa 100%). Campos de envío obligatorio en el caso de operaciones de cambio con liquidación futura.
          pattern: '^\d{1}\.\d{1,6}$'
          maxLength: 8
          minLength: 3
          example: '0.12'
        deliveryForeignCurrency:
          $ref: '#/components/schemas/ExchangesEnumDeliveryForeignCurrency'
        operationCategoryCode:
          type: string
          maxLength: 5
          pattern: '^\d{5}$'
          description: Código de la naturaleza hecho del cierre de la operación. Debe respetar los códigos de naturaleza referenciados en la Resolución 277 o en la Circular 3690, conforme se aplique al contrato de cambio.
          example: '90302'
        foreignPartie:
          type: object
          required:
            - relationshipCode
            - foreignPartieName
            - foreignPartieCountryCode
          description: |
            Lista para el envío de informaciones de parte involucrada.

            [Restricción] Lista de cumplimentación opcional por las participantes cuando:
            - El campo `deliveryForeignCurrency` sea igual a ESPECIE_CHEQUES_VIAGEM o CARTAO_PREPAGO.
            - El campo `eventType` sea diferente de "4 - Liquidación de Operación Cambiaria en el Mercado Primario."

            En caso de que la institución posea la información, esta es de envío obligatorio. En caso de que la información se actualice
            posteriormente a la contratación, debe enviarse a través de eventos.
          properties:
            relationshipCode:
              type: string
              maxLength: 2
              pattern: '^\d{2}$'
              description: |
                Código de Relación de vínculo entre el Cliente y el Pagador/Receptor en el Exterior. Debe respetar los códigos de vínculo referenciados en la Resolución 277 o en la Circular 3690, conforme se aplique al contrato de cambio.
              example: '50'
            foreignPartieName:
              type: string
              description: |
                Nombre del pagador o receptor en el exterior.
              maxLength: 120
              pattern: '[\w\W\s]*'
              example: José da Silva
            foreignPartieCountryCode:
              type: string
              description: |
                País del pagador o receptor. Código del país según la norma ISO 3166-1.
              maxLength: 2
              pattern: '^[A-Z]{2}$'
              example: ZA
      additionalProperties: false
    ExchangesEnumOperationType:
      type: string
      description: Compra o venta de moneda extranjera.
      enum:
        - COMPRA
        - VENDA
      example: COMPRA
    ExchangesEnumEventType:
      type: string
      description: |
        Para el campo dominio:

        1 - Contratación en el Mercado Primario.
        2 - Alteración de Operación Cambiaria en el Mercado Primario.
        3 - Cancelación de Operación Cambiaria en el Mercado Primario.
        4 - Liquidación de Operación Cambiaria en el Mercado Primario.
        5 - Baja de Valor a Liquidar de Operación Cambiaria en el Mercado Primario.
        6 - Restablecimiento de Baja de Valor a Liquidar de Operación Cambiaria en el Mercado Primario.
        9 - Anulación de Operación Cambiaria en el Mercado Primario (utilizado, por ejemplo, en la anulación de un evento de liquidación/cancelación).
        Obs.: Los códigos siguen el layout de mensajería enviada por las instituciones al Banco Central.

        El evento está relacionado con el tipo de contratación.
      enum:
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
        - '6'
        - '9'
      example: '2'
    ExchangesEnumDeliveryForeignCurrency:
      type: string
      description: |
        Forma de entrega de la moneda extranjera.

        ```
        |--------|-------------------------------------------------------------|
        | Código | ENUM                                                        |
        |--------|-------------------------------------------------------------|
        |   10   | CARTA_CREDITO_A_VISTA                                       |
        |   15   | CARTA_CREDITO_A_PRAZO                                       |
        |   20   | CONTA_DEPOSITO                                              |
        |   21   | CONTA_DEPOSITO_MOEDA_ESTRANGEIRA_PAIS                       |
        |   22   | CONTA_DEPOSITO_EXPORTADOR_MANTIDA_NO_EXTERIOR               |
        |   23   | CONTA_DEPOSITO_OU_PAGAMENTO_EXPORTADOR_INSTITUICAO_EXTERIOR |
        |   25   | CONVENIO_PAGAMENTOS_E_CREDITOS_RECIPROCOS                   |
        |   30   | CHEQUE                                                      |
        |   50   | ESPECIE_CHEQUES_VIAGEM                                      |
        |   55   | CARTAO_PREPAGO                                              |
        |   65   | TELETRANSMISSAO                                             |
        |   75   | TITULOS_VALORES                                             |
        |   90   | SIMBOLICA                                                   |
        |   91   | SEM_MOVIMENTACAO_VALORES                                    |
        |   99   | DEMAIS                                                      |
        |   N/A  | OUTRO_NAO_MAPEADO_OFB                                       |
        |--------|-------------------------------------------------------------|
        ```
      enum:
        - CONTA_DEPOSITO_MOEDA_ESTRANGEIRA_PAIS
        - CONTA_DEPOSITO_OU_PAGAMENTO_EXPORTADOR_INSTITUICAO_EXTERIOR
        - ESPECIE_CHEQUES_VIAGEM
        - CARTAO_PREPAGO
        - TELETRANSMISSAO
        - SEM_MOVIMENTACAO_VALORES
        - DEMAIS
        - CARTA_CREDITO_A_VISTA
        - CARTA_CREDITO_A_PRAZO
        - CONTA_DEPOSITO
        - CHEQUE
        - TITULOS_VALORES
        - SIMBOLICA
        - CONTA_DEPOSITO_EXPORTADOR_MANTIDA_NO_EXTERIOR
        - CONVENIO_PAGAMENTOS_E_CREDITOS_RECIPROCOS
        - OUTRO_NAO_MAPEADO_OFB
      example: CARTA_CREDITO_A_PRAZO
    ExchangesLinks:
      type: object
      description: Referencias a otros recursos de la API solicitada.
      required:
        - self
      properties:
        self:
          type: string
          format: url
          maxLength: 4048
          description: URL completo que generó la respuesta actual.
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        first:
          type: string
          format: url
          maxLength: 4048
          description: URL de la primera página que originó esta lista de resultados. Restricción - Obligatorio cuando no sea la primera página de la respuesta
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        prev:
          type: string
          format: url
          maxLength: 4048
          description: "URL de la página anterior de esta lista de resultados. Restricción - \tObligatorio cuando no sea la primera página de la respuesta"
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        next:
          type: string
          format: url
          maxLength: 4048
          description: URL de la próxima página de esta lista de resultados. Restricción - Obligatorio cuando no sea la última página de la respuesta
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        last:
          type: string
          format: url
          maxLength: 4048
          description: URL de la última página de esta lista de resultados. Restricción - Obligatorio cuando no sea la última página de la respuesta
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
    ExchangesLinksOperationId:
      type: object
      description: Referencias a otros recursos de la API solicitada.
      required:
        - self
      properties:
        self:
          type: string
          format: url
          maxLength: 4048
          description: URL completo que generó la respuesta actual.
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
    ExchangesMeta:
      type: object
      description: Metainformación referente a la API solicitada.
      required:
        - totalRecords
        - totalPages
        - requestDateTime
      properties:
        totalRecords:
          type: integer
          format: int32
          description: Número total de registros en el resultado
          example: 1
        totalPages:
          type: integer
          format: int32
          description: Número total de páginas en el resultado
          example: 1
        requestDateTime:
          description: 'Fecha y hora de la consulta, conforme a la especificación RFC-3339, formato UTC.'
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
      additionalProperties: false
    ExchangesMetaOperationId:
      type: object
      description: Metainformación referente a la API solicitada.
      required:
        - requestDateTime
      properties:
        requestDateTime:
          description: 'Fecha y hora de la consulta, conforme a la especificación RFC-3339, formato UTC.'
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
      additionalProperties: false
  headers:
    xOriginError:
      description: Indica el origen del error.
      schema:
        $ref: '#/components/schemas/EnumOriginError'
      required: false
    xErrorSourceUrl:
      description: URL de la llamada que originó el error, presente solo cuando `x-origin-error` = `participant`.
      schema:
        type: string
      required: false
    xRegulatoryV:
      description: Versión regulatoria deseada para la llamada al participante (disponible solo en rutas no-proxy).
      schema:
        $ref: '#/components/schemas/RegulatoryVersion'
      required: false
    xSelectedRegulatoryV:
      description: Versión regulatoria efectivamente utilizada en la solicitud al participante.
      schema:
        $ref: '#/components/schemas/SelectedRegulatoryVersion'
      required: true
    xFapiInteractionIdResponse:
      description: |
        Un UUID [RFC4122](https://tools.ietf.org/html/rfc4122) usado como ID de correlación entre request y response. Campo de generación y envío obligatorio por la institución receptora (client), y su valor debe ser "espejado" por la institución transmisora (server) en el encabezado de respuesta.
      schema:
        $ref: '#/components/schemas/XFapiInteractionId'
      required: true
    xV:
      description: 'Encabezado que indica la versión implementada de la API por la institución financiera para atender la solicitud. Debe completarse de forma completa, por ejemplo: x-v : 1.0.2.'
      required: true
      schema:
        $ref: '#/components/schemas/XV'
  parameters:
    applicationId:
      name: x-application-id
      in: header
      required: true
      description: Identificador de la aplicación que realiza la solicitud
      schema:
        $ref: '#/components/schemas/UUID'
    customerUserAgent:
      name: x-customer-user-agent
      in: header
      required: true
      description: Indica el user-agent que utiliza el usuario.
      schema:
        type: string
        pattern: '[\w\W\s]*'
        minLength: 1
        maxLength: 100
    fapiCustomerIpAddress:
      name: x-fapi-customer-ip-address
      in: header
      required: true
      description: La dirección IP del usuario si se encuentra actualmente conectado con la institución receptora.
      schema:
        type: string
        pattern: '[\w\W\s]*'
    authorisationServerId:
      name: x-authorisation-server-id
      required: true
      description: Identificador del Authorisation Server de la institución transmisora del consentimiento, obtenido mediante la consulta de la lista de participantes
      in: header
      schema:
        $ref: '#/components/schemas/UUID'
    regulatoryV:
      name: x-regulatory-v
      required: false
      description: Versión regulatoria deseada para la llamada al participante (disponible solo en rutas no-proxy).
      in: header
      schema:
        $ref: '#/components/schemas/RegulatoryVersion'
    headerConsentId:
      name: x-consent-id
      required: true
      in: header
      description: Identificador del consentimiento a utilizar en esta operación, obtenido en la respuesta de su creación
      schema:
        type: string
        pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
        maxLength: 256
      example: 'urn:bancox:f865cd66-392a-420b-9ff0-1b6d7cc60ee0'
    consentId:
      name: consentId
      required: true
      in: path
      description: |
        El consentId es el identificador único del consentimiento y deberá ser un URN - Uniform Resource Name.
        Un URN, conforme se define en la [RFC8141](https://tools.ietf.org/html/rfc8141), es un Uniform Resource
        Identifier - URI - que se asigna bajo el URI scheme "urn" y un namespace URN específico, con la intención de que el URN
        sea un identificador de recurso persistente e independiente de la ubicación.
        Considerando la cadena urn:prudential:C1DD93123 como ejemplo de consentId tenemos:
        - el namespace (urn)
        - el identificador asociado al namespace de la institución transmisora (bancox)
        - el identificador específico dentro del namespace (f865cd66-392a-420b-9ff0-1b6d7cc60ee0).
        Información más detallada sobre la construcción de namespaces debe consultarse en la [RFC8141](https://tools.ietf.org/html/rfc8141).
      schema:
        type: string
        pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
        maxLength: 256
      example: 'urn:bancox:f865cd66-392a-420b-9ff0-1b6d7cc60ee0'
    creditCardAccountId:
      name: creditCardAccountId
      description: 'Identifica de forma única la cuenta de pago pospago del cliente, manteniendo las reglas de inmutabilidad dentro de la institución transmisora'
      in: path
      schema:
        type: string
      required: true
    accountId:
      name: accountId
      description: 'Identificador de la cuenta de depósito a la vista, de ahorro o de pago prepago.'
      in: path
      schema:
        type: string
      required: true
    contractId:
      name: contractId
      description: 'Identificador del contrato para todos los tipos de operación de crédito.'
      in: path
      schema:
        type: string
      required: true
    investmentId:
      name: investmentId
      description: 'Identifica de forma única la relación del cliente con el producto, manteniendo las reglas de inmutabilidad dentro de la institución transmisora'
      in: path
      schema:
        type: string
      required: true
    brokerNoteId:
      name: brokerNoteId
      description: 'Identifica de forma única la relación del cliente con el producto, manteniendo las reglas de inmutabilidad dentro de la institución transmisora'
      in: path
      schema:
        type: string
      required: true
    operationId:
      name: operationId
      description: 'Identifica de forma única la relación del cliente con el producto, manteniendo las reglas de inmutabilidad dentro de la institución transmisora'
      in: path
      schema:
        type: string
      required: true
    page:
      name: page
      in: query
      description: Número de la página que se está solicitando (el valor de la primera página es 1).
      schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 2147483647
        format: int32
    pageSize:
      name: page-size
      in: query
      description: Cantidad total de registros por páginas. La transmisora debe considerar la entrada como 25, en caso de que la receptora informe algún valor menor. Mientras haya más de 25 registros por enviar, la transmisora debe considerar el mínimo por página como 25. Solo la última página devuelta (o la primera, en el caso de página única) puede contener menos de 25 registros. Para más información, acceda a Especificaciones de APIs > Estándares > Paginación.
      schema:
        type: integer
        default: 25
        minimum: 25
        format: int32
        maximum: 1000
    creditCardPayeeMCC:
      name: payeeMCC
      description: 'MCC es el Merchant Category Code, o el código de la categoría del establecimiento comercial. Los MCC se agrupan según sus similitudes'
      required: false
      in: query
      schema:
        type: number
        maximum: 9999
        example: 8299
        format: int32
    fromDueDate:
      name: fromDueDate
      description: Fecha inicial de filtrado.
      required: false
      in: query
      schema:
        type: string
        maxLength: 10
        format: date
        example: '2021-05-21'
    fromTransactionDate:
      name: fromTransactionDate
      description: |
        Fecha inicial de filtrado.

        [Restricción] Debe enviarse obligatoriamente en caso de que el campo toTransactionDate sea informado. En caso de que no sea informado, debe asumirse el día actual.
      required: false
      in: query
      schema:
        type: string
        maxLength: 10
        format: date
        example: '2021-05-21'
    fromTransactionDateMaxLimited:
      name: fromTransactionDate
      description: |
        Fecha inicial de filtrado. El período máximo utilizado en el filtro es de 7 días inclusive (D-6).

        [Restricción] Debe enviarse obligatoriamente en caso de que el campo toTransactionDate sea informado. En caso de que no sea informado, debe asumirse el día actual.
      required: false
      in: query
      schema:
        type: string
        maxLength: 10
        format: date
        example: '2021-05-21'
    toDueDate:
      name: toDueDate
      description: Fecha final de filtrado.
      required: false
      in: query
      schema:
        type: string
        maxLength: 10
        format: date
        example: '2021-05-21'
    toTransactionDate:
      name: toTransactionDate
      description: |
        Fecha final de filtrado.

        [Restricción] Debe enviarse obligatoriamente en caso de que el campo fromTransactionDate sea informado. En caso de que no sea informado, debe asumirse el día actual.
      required: false
      in: query
      schema:
        type: string
        maxLength: 10
        format: date
        example: '2021-05-21'
    toTransactionDateMaxLimited:
      name: toTransactionDate
      description: |
        Fecha final de filtrado. El período máximo utilizado en el filtro es de 7 días inclusive (D-6).

        [Restricción] Debe enviarse obligatoriamente en caso de que el campo fromTransactionDate sea informado. En caso de que no sea informado, debe asumirse el día actual.
      required: false
      in: query
      schema:
        type: string
        maxLength: 10
        format: date
        example: '2021-05-21'
    creditCardTransactionType:
      name: transactionType
      description: Trae los tipos de Transacción
      required: false
      in: query
      schema:
        $ref: '#/components/schemas/EnumCreditCardTransactionType'
    accountType:
      name: accountType
      description: 'Tipos de cuentas. Modalidades tradicionales previstas por la Resolución 4.753, sin contemplar cuentas vinculadas, cuenta de domiciliados en el exterior, cuentas en monedas extranjeras y cuenta correspondiente de moneda electrónica. Véase el Enum.'
      required: false
      in: query
      schema:
        $ref: '#/components/schemas/EnumAccountType'
    fromBookingDate:
      name: fromBookingDate
      description: 'Fecha inicial de filtrado. [Restricción] Debe enviarse obligatoriamente en caso de que el campo toBookingDate sea informado. En caso de que no sea informado, debe asumirse el día actual.'
      required: false
      in: query
      schema:
        type: string
        maxLength: 10
        format: date
        example: '2021-05-21'
    toBookingDate:
      name: toBookingDate
      description: 'Fecha final de filtrado. [Restricción] Debe enviarse obligatoriamente en caso de que el campo fromBookingDate sea informado. En caso de que no sea informado, debe asumirse el día actual.'
      required: false
      in: query
      schema:
        type: string
        maxLength: 10
        format: date
        example: '2021-05-21'
    creditDebitIndicator:
      name: creditDebitIndicator
      description: Indicador del tipo de asiento
      required: false
      in: query
      schema:
        $ref: '#/components/schemas/EnumCreditDebitIndicator'
    authorizationHeader:
      name: Authorization
      in: header
      description: Encabezado HTTP estándar. Permite que las credenciales se proporcionen dependiendo del tipo de recurso solicitado
      required: true
      schema:
        type: string
        pattern: '[\w\W\s]*'
        maxLength: 2048
    xFapiAuthDate:
      name: x-fapi-auth-date
      in: header
      description: 'Fecha en que el usuario se conectó por última vez con el receptor. Representada de acuerdo con la [RFC7231](https://tools.ietf.org/html/rfc7231). Ejemplo: Sun, 10 Sep 2017 19:43:31 UTC'
      required: false
      schema:
        type: string
        pattern: '^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), \d{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) \d{4} \d{2}:\d{2}:\d{2} (GMT|UTC)$'
        minLength: 29
        maxLength: 29
    xFapiInteractionId:
      name: x-fapi-interaction-id
      in: header
      description: Un UUID [RFC4122](https://tools.ietf.org/html/rfc4122) usado como ID de correlación entre request y response. Campo de generación y envío obligatorio por la institución receptora (client), y su valor debe ser "espejado" por la institución transmisora (server) en el encabezado de respuesta. En caso de que no sea enviado por la receptora, la transmisora debe generar un x-fapi-interaction-id y devolverlo en la respuesta con el HTTP status code 400.
      required: true
      schema:
        type: string
        format: uuid
        minLength: 1
        maxLength: 36
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        example: d78fc4e5-37ca-4da3-adf2-9b082bf92280
