          $ref: '#/components/schemas/AccountsMetaOnlyRequestDateTime'
    AccountsAccountData:
      type: object
      required:
        - brandName
        - companyCnpj
        - type
        - compeCode
        - number
        - accountId
      properties:
        brandName:
          type: string
          description: 'Nombre de la Marca reportada por el participante en el Open Finance. Se recomienda utilizar, siempre que sea posible, el mismo nombre de marca atribuido en el campo del directorio Customer Friendly Server Name (Authorisation Server).'
          maxLength: 80
          pattern: '[\w\W\s]*'
          example: Organização A
        companyCnpj:
          type: string
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          description: 'Registro completo del CNPJ de la institución responsable del Registro - el CNPJ corresponde a la representación alfanumérica de la inscripción en el Cadastro de Pessoa Jurídica. Se deben tener únicamente los caracteres del CNPJ, sin máscara.'
          example: '21128159000166'
        type:
          $ref: '#/components/schemas/EnumAccountType'
        compeCode:
          type: string
          description: 'Código identificador atribuido por el Banco Central de Brasil a las instituciones participantes del STR (Sistema de Transferencia de reservas).El Compe (Sistema de Compensación de Cheques y Otros Papeles) es un sistema que identifica y procesa las compensaciones bancarias. Está representado por un código de tres dígitos que sirve como identificador de bancos, siendo así, cada institución bancaria posee un número exclusivo'
          pattern: '^\d{3}$'
          maxLength: 3
          example: '001'
        branchCode:
          type: string
          description: |
            Código de la Agencia detentora de la cuenta. (La agencia es la dependencia destinada a la atención a los clientes, al público en general y a los asociados de cooperativas de crédito, en el ejercicio de actividades de la institución, no pudiendo ser móvil o transitoria)

            [Restricción] Obligatoriamente debe ser cumplimentado cuando el campo "type" sea diferente de CONTA_PAGAMENTO_PRE_PAGA.
          pattern: '^\d{4}$'
          maxLength: 4
          example: '6272'
        number:
          type: string
          description: Número de la cuenta
          pattern: '^\d{8,20}$'
          maxLength: 20
          example: '94088392'
        checkDigit:
          type: string
          description: |
            Dígito de la cuenta

            [Restricción] Obligatoriamente debe ser cumplimentado cuando el campo `type` sea diferente de cuenta prepago. En los casos en que la cuenta prepago posea dígito, el envío es obligatorio.
          pattern: '[\w\W\s]*'
          maxLength: 1
          example: '4'
        accountId:
          type: string
          description: 'Identifica de forma única  la cuenta del cliente, manteniendo las reglas de inmutabilidad dentro de la institución transmisora.'
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          maxLength: 100
          minLength: 1
          example: '92792126019929279212650822221989319252576'
    AccountsAccountIdentificationData:
      type: object
      description: |
        Conjunto de los atributos que caracterizan las Cuentas de: depósito a la vista, de ahorro y de pago prepago
      required:
        - compeCode
        - number
        - type
        - subtype
        - currency
      properties:
        compeCode:
          type: string
          maxLength: 3
          pattern: '^\d{3}$'
          description: 'Código identificador atribuido por el Banco Central do Brasil a las instituciones participantes del STR (Sistema de Transferencia de reservas). El número-código sustituyó al antiguo código COMPE. Todos los participantes del STR, excepto las Infraestructuras del Mercado Financiero (IMF) y la Secretaría del Tesoro Nacional, poseen un número-código independientemente de que participen en la Centralizadora de Compensación de Cheques (Compe).'
          example: '001'
        branchCode:
          type: string
          maxLength: 4
          pattern: '^\d{4}$'
          description: |
            Código de la Agencia detentora de la cuenta. (La agencia es la dependencia destinada a la atención a los clientes, al público en general y a los asociados de cooperativas de crédito, en el ejercicio de actividades de la institución, no pudiendo ser móvil o transitoria)

            [Restricción] Obligatoriamente debe ser cumplimentado cuando el campo "type" sea diferente de cuenta prepago.
          example: '6272'
        number:
          type: string
          maxLength: 20
          pattern: '^\d{8,20}$'
          description: |
            Número de la cuenta
          example: '24550245'
        checkDigit:
          type: string
          maxLength: 1
          pattern: '[\w\W\s]*'
          description: |
            Dígito de la cuenta.

            [Restricción] Obligatoriamente debe ser cumplimentado cuando el campo "type" sea diferente de cuenta prepago. En los casos en que la cuenta prepago posea dígito, el envío es obligatorio
          example: '4'
        type:
          $ref: '#/components/schemas/EnumAccountType'
        subtype:
          $ref: '#/components/schemas/AccountsEnumAccountSubType'
        currency:
          type: string
          pattern: '^(\w{3}){1}$'
          maxLength: 3
          description: |
            Moneda referente al valor de la transacción, según el modelo ISO-4217. p.ej. 'BRL'
            Todos los saldos informados están representados con la moneda vigente de Brasil
          example: BRL
    AccountsAccountBalancesData:
      type: object
      description: |
        Conjunto de información de las Cuentas de: depósito a la vista, de ahorro y de pago prepago
      required:
        - availableAmount
        - blockedAmount
        - automaticallyInvestedAmount
        - updateDateTime
      properties:
        availableAmount:
          $ref: '#/components/schemas/AccountsAccountBalancesDataAvailableAmount'
        blockedAmount:
          $ref: '#/components/schemas/AccountsAccountBalancesDataBlockedAmount'
        automaticallyInvestedAmount:
          $ref: '#/components/schemas/AccountsAccountBalancesDataAutomaticallyInvestedAmount'
        updateDateTime:
          type: string
          format: date-time
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2021-05-21T08:30:00Z'
          description: |
            Fecha y hora de la última actualización del saldo. Se espera que la institución informe la última vez que capturó el saldo para compartirlo en el Open Finance. De esa forma, es posible que:
            - En caso de que la institución capture datos de forma sincrónica, esa información sea de pocos momentos;
            - En caso de que la institución capture datos de forma asincrónica, esa información sea de horas o días en el pasado;
            - Cuando no exista una fecha vinculada específicamente al bloque, se asume la fecha y hora de actualización del registro como un todo.

            De todas formas, es necesario continuar respetando el plazo máximo de tempestividad de la API de Cuentas.
        hasReservedBalance:
          type: boolean
          description: |
            Informa si el cliente posee un saldo reservado. En caso de que el cliente posea reservas de saldo activas, incluso en los casos de saldo en cero, el valor enviado debe ser `TRUE`.
            En caso de que el cliente no posea el producto, debe ser `FALSE`. Si el campo retorna `TRUE`, los datos del saldo reservado se encuentran en el endpoint `GET /accounts/{accountId}/reserved-balances`

            [Restricción] Campo de envío obligatorio por parte de la institución transmisora que oferta productos de reservas de saldo vinculados a la cuenta.
            Este campo se refiere exclusivamente a saldos de reserva que no están asociados a inversiones.
            Los productos de inversiones deben ser reportados en las API de Inversiones.
          example: true
    AccountsAccountReservedBalancesData:
      type: array
      description: Lista de alcancías/reservas
      minItems: 0
      items:
        type: object
        required:
          - reservedIdentification
          - availableAmount
        properties:
          reservedName:
            type: string
            description: Nombre dado por el usuario a la reserva
            pattern: '^[^\s][\w\W\s]*[^\s]$'
            maxLength: 248
            minLength: 5
            example: Caixinha Paras Férias
          reservedIdentification:
            type: string
            description: Identificador único de la reserva
            format: uuid
            pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
            maxLength: 36
            minLength: 1
            example: d78fc4e5-37ca-4da3-adf2-9b082bf92280
          availableAmount:
            type: array
            description: Saldo que se encuentra disponible en la reserva
            minLength: 1
            items:
              type: object
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  description: Valor relacionado con el objeto.
                  format: double
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  maxLength: 20
                  minLength: 4
                  example: '1000.0400'
                currency:
                  type: string
                  description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
                  pattern: '^[A-Z]{3}$'
                  maxLength: 3
                  example: BRL
                remuneration:
                  type: object
                  description: Remuneración aplicada a la reserva
                  required:
                    - rateType
                    - indexer
                    - calculation
                    - ratePeriodicity
                  properties:
                    preFixedRate:
                      type: string
                      description: |
                        Tasa de remuneración prefijada para la reserva de saldo. p.ej. 0.014500. La cumplimentación debe respetar los 6 decimales, aunque vengan cumplimentados con ceros(representación de porcentaje p.ej: 0.150000. Este valor representa 15%. El valor 1 representa 100%).

                        [Restricción] Campo de cumplimentación obligatoria por parte de las participantes cuando el campo `postFixedIndexerPercentage` no sea cumplimentado
                      format: double
                      pattern: '^\d{1}\.\d{6}$'
                      minLength: 8
                      maxLength: 8
                      example: '0.300000'
                    postFixedIndexerPercentage:
                      type: string
                      description: |
                        Porcentaje del indexador posfijado para la reserva de saldo. p.ej. 0.014500. La cumplimentación debe respetar los 6 decimales, aunque vengan cumplimentados con ceros(representación de porcentaje p.ej: 0.150000. Este valor representa 15%. El valor 1 representa 100%).

                        [Restricción] Campo de cumplimentación obligatoria por parte de las participantes cuando el campo `preFixedRate` no sea cumplimentado
                      format: double
                      pattern: '^\d{1}\.\d{6}$'
                      minLength: 8
                      maxLength: 8
                      example: '0.300000'
                    rateType:
                      type: string
                      description: Tipo de la tasa de remuneración (lineal o exponencial)
                      enum:
                        - LINEAR
                        - EXPONENCIAL
                      example: LINEAR
                    indexer:
                      type: string
                      description: Índice utilizado como referencia para la remuneración de la reserva
                      enum:
                        - CDI
                        - DI
                        - TR
                        - IPCA
                        - IGP_M
                        - IGP_DI
                        - INPC
                        - BCP
                        - TLC
                        - SELIC
                        - PRE_FIXADO
                        - OUTROS
                      example: CDI
                    calculation:
                      type: string
                      description: Base de cálculo (días hábiles o días corridos)
                      enum:
                        - DIAS_UTEIS
                        - DIAS_CORRIDOS
                      example: DIAS_UTEIS
                    ratePeriodicity:
                      type: string
                      description: Periodicidad de la tasa de remuneración (mensual, anual, diaria, semestral)
                      enum:
                        - MENSAL
                        - ANUAL
                        - DIARIO
                        - SEMESTRAL
                      example: MENSAL
                    indexerAdditionalInfo:
                      type: string
                      description: |
                        Información adicional del indexador

                        [Restricción] Campo de cumplimentación obligatoria por parte de las participantes cuando haya `Outros` en el campo `indexer`
                      pattern: '[\w\W\s]*'
                      maxLength: 50
                      example: Dólar
    AccountsAccountOverdraftLimitsData:
      type: object
      description: |
        Conjunto de información de la Cuenta de: depósito a la vista
      properties:
        overdraftContractedLimit:
          $ref: '#/components/schemas/AccountsAccountOverdraftLimitsDataOverdraftContractedLimit'
        overdraftUsedLimit:
          $ref: '#/components/schemas/AccountsAccountOverdraftLimitsDataOverdraftUsedLimit'
        unarrangedOverdraftAmount:
          $ref: '#/components/schemas/AccountsAccountOverdraftLimitsDataUnarrangedOverdraftAmount'
    AccountsAccountTransactionsData:
      type: object
      required:
        - transactionId
        - completedAuthorisedPaymentType
        - creditDebitType
        - transactionName
        - type
        - transactionAmount
        - transactionDateTime
      properties:
        transactionId:
          type: string
          description: |
            Código o identificador único proporcionado por la institución que mantiene la cuenta para representar la transacción individual.
            Lo ideal es que el `transactionId` sea inmutable.
            Sin embargo, el `transactionId` debe obedecer, como mínimo, las reglas de inmutabilidad propuestas conforme a la tabla “Fecha de inmutabilidad por tipo de transacción” presente en las orientaciones de esta API.
          maxLength: 100
          minLength: 1
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: TXpRMU9UQTROMWhZV2xSU1FUazJSMDl
        completedAuthorisedPaymentType:
          $ref: '#/components/schemas/AccountsEnumCompletedAuthorisedPaymentIndicator'
        creditDebitType:
          $ref: '#/components/schemas/EnumCreditDebitIndicator'
        transactionName:
          type: string
          maxLength: 200
          pattern: '[\w\W\s]*'
          description: |
            Literal utilizada en la institución financiera para identificar la transacción.
            La información presentada debe ser la misma utilizada en los canales digitales de la institución (así como el historial de transacciones presentado en la pantalla de la aplicación o del navegador).
            En caso de que la institución posea más de un canal digital, la información compartida debe ser la del canal que presenta la descripción más completa posible de la transacción.
            En los casos en que la descripción de la transacción se presenta con múltiples líneas, todas las líneas deben ser enviadas (concatenadas) en este atributo, no siendo obligatoria la concatenación de la información ya enviada en otros atributos (ej: valor, fecha) del mismo endpoint.
            Adicionalmente, el Banco Central puede determinar el formato de compartición a ser adoptado por una institución participante específica.
          example: Transferencia Enviada Lima Santos
        type:
          $ref: '#/components/schemas/AccountsEnumTransactionTypes'
        typeAdditionalInfo:
          type: string
          maxLength: 144
          pattern: '[\w\W\s]*'
          description: |
            Información complementaria para el tipo de transacción.

            [Restricción] Este campo es de envío obligatorio en caso de que el campo `type` sea definido como `OUTROS`.
          example: 'APLIC_FINANCEIRA'
        transactionAmount:
          $ref: '#/components/schemas/AccountsAccountTransactionsDataAmount'
        transactionDateTime:
          type: string
          maxLength: 24
          pattern: '(^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)\.(?:[0-9]){3}Z$)'
          description: |
            Fecha y hora original de la transacción que se informa en los canales digitales. Para los asientos Futuros la fecha informada debe ser la fecha prevista de efectivización informada en los canales digitales. En caso de que la institución no sepa el horario exacto de la efectivización, los valores hora, minuto, segundo y milisegundo pueden ser cumplimentados con cero. Después de la efectivización de la transacción, el campo debe ser cumplimentado con la fecha y la hora de la efectivización de la transacción.
          example: '2016-01-29T12:29:03.374Z'
        partieCnpjCpf:
          type: string
          maxLength: 14
          pattern: '^([0-9]{11}|[0-9A-Z]{12}[0-9]{2})$'
          description: |
            Identificación de la persona involucrada en la transacción: pagador o receptor (Cumplimentar con el CPF o CNPJ, sin formato). Con la IN BCB n.º 371, a partir del 02/05/23, el envío de la información de identificación de contraparte se volvió obligatorio para transacciones de pago. Para mayores detalles, favor de consultar la página `Orientações - Contas`.

            [Restricción] Cuando el "type“ sea cumplimentado con el valor FOLHA_PAGAMENTO y la institución transmisora sea la responsable del pago de salario (banco-nómina), el partieCnpjCpf informado debe ser del empleador relacionado.
          example: '43908445778'
        partiePersonType:
          $ref: '#/components/schemas/EnumPartiePersonType'
        partieCompeCode:
          type: string
          maxLength: 3
          pattern: '^\d{3}$'
          description: |
            Código identificador atribuido por el Banco Central do Brasil a las instituciones participantes del STR (Sistema de Transferencia de reservas) referente a la persona involucrada en la transacción. El número-código sustituyó al antiguo código COMPE. Todos los participantes del STR, excepto las Infraestructuras del Mercado Financiero (IMF) y la Secretaría del Tesoro Nacional, poseen un número-código independientemente de que participen en la Centralizadora de Compensación de Cheques (Compe).

            [RESTRICCIÓN] Es de cumplimentación obligatoria cuando la institución posea el número-código.
          example: '001'
        partieBranchCode:
          type: string
          maxLength: 4
          pattern: '^\d{4}$'
          description: 'Código de la Agencia detentora de la cuenta de la persona involucrada en la transacción. (La agencia es la dependencia destinada a la atención a los clientes, al público en general y a los asociados de cooperativas de crédito, en el ejercicio de actividades de la institución, no pudiendo ser móvil o transitoria)'
          example: '6272'
        partieNumber:
          type: string
          maxLength: 20
          pattern: '^\d{8,20}$'
          description: Número de la cuenta de la persona involucrada en la transacción
          example: '67890854360'
        partieCheckDigit:
          type: string
          maxLength: 1
          pattern: '[\w\W\s]*'
          description: Dígito de la cuenta de la persona involucrada en la transacción
          example: '4'
        codeISPB:
          type: string
          pattern: '^[0-9A-Z]{8}$'
          description: |
            Código único atribuido por el Banco Central do Brasil a cada institución participante del Sistema de Pagos.

            Este campo identifica el ISPB de la institución contraparte de la transacción y debe ser cumplimentado de acuerdo con el atributo que indica el sentido financiero de la transacción, de acuerdo con el campo `creditDebitType`:
             - Para transacciones de `CREDITO` (entrada de recursos en la cuenta): informar el ISPB de la institución de origen de los recursos.
             - Para transacciones de `DEBITO` (salida de recursos de la cuenta): informar el ISPB de la institución de destino de los recursos. [RESTRICCIÓN] Es de cumplimentación   obligatoria cuando exista información de contraparte.
          example: '00300300'
    AccountsAccountTransactionsDataAmount:
      type: object
      description: Valor de la transacción. Expresado en valor monetario con un mínimo de 2 y un máximo de 4 decimales.
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          format: double
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: Valor relacionado con el objeto.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
          example: BRL
    AccountsAccountBalancesDataAvailableAmount:
      type: object
      description: |
        Saldo disponible para utilización inmediata. No considera cheque especial, inversiones automáticas vinculadas a la cuenta ni reserva de saldo.
        Expresado en valor monetario con un mínimo de 2 y un máximo de 4 decimales.
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          format: double
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '1000.0400'
          description: Valor relacionado con el objeto.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
          example: BRL
    AccountsAccountBalancesDataBlockedAmount:
      type: object
      description: 'Saldo bloqueado, no disponible para utilización inmediata, por motivo de bloqueo presentado al cliente en los canales electrónicos. Expresado en valor monetario con un mínimo de 2 y un máximo de 4 decimales.'
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          format: double
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: Valor relacionado con el objeto.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
          example: BRL
    AccountsAccountBalancesDataAutomaticallyInvestedAmount:
      type: object
      description: Saldo disponible con aplicación automática - corresponde a la suma del saldo disponible más el valor obtenido a partir de la aplicación automática. Expresado en valor monetario con un mínimo de 2 y un máximo de 4 decimales.
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          format: double
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '1000.0400'
          description: Valor relacionado con el objeto.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
          example: BRL
    AccountsAccountOverdraftLimitsDataOverdraftContractedLimit:
      type: object
      description: Valor del límite contratado del cheque especial.
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          format: double
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: Valor relacionado con el objeto.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
          example: BRL
    AccountsAccountOverdraftLimitsDataOverdraftUsedLimit:
      type: object
      description: Valor utilizado total del límite del cheque especial y el adelanto a depositante.
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          format: double
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: Valor relacionado con el objeto.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
          example: BRL
    AccountsAccountOverdraftLimitsDataUnarrangedOverdraftAmount:
      type: object
      description: Valor de operación contratada con carácter de emergencia para cobertura de saldo deudor en cuenta de depósitos a la vista y de exceso sobre el límite pactado de cheque especial.
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          format: double
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: Valor relacionado con el objeto.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
          example: BRL
    AccountsEnumAccountSubType:
      type: string
      enum:
        - INDIVIDUAL
        - CONJUNTA_SIMPLES
        - CONJUNTA_SOLIDARIA
      description: |
        Subtipo de cuenta (ver Enum):
        Cuenta individual - posee un único titular
        Cuenta conjunta simple - donde los movimientos financieros solo pueden ser realizados mediante autorización de TODOS los titulares de la cuenta.
        Cuenta conjunta solidaria - es la modalidad cuyos titulares pueden realizar movimientos de forma aislada, es decir, sin que sea necesaria la autorización de los demás titulares
      example: INDIVIDUAL
    AccountsEnumCompletedAuthorisedPaymentIndicator:
      type: string
      description: |
        Indicador de la transacción:
          - Transacción efectivizada: la transacción alcanza ese estado cuando el `transactionId` se vuelve inmutable;
          - Asiento futuro: la transacción será efectivizada en un momento futuro, es decir, el `transactionId` puede cambiar;
          - Transacción procesando: la transacción está en procesamiento, es decir, el `transactionId` puede cambiar.
      enum:
        - TRANSACAO_EFETIVADA
        - LANCAMENTO_FUTURO
        - TRANSACAO_PROCESSANDO
      example: TRANSACAO_EFETIVADA
    AccountsEnumTransactionTypes:
      type: string
      description: |
        El campo debe clasificar la transacción en uno de los tipos descritos.
        El transmisor debe clasificar las transacciones disponibles asociándola a uno de los ítems del Enum listado en este campo.
        La opción OUTROS solo debe ser utilizada para los casos en que de hecho la transacción compartida no pueda ser clasificada como uno de los ítems de este Enum.
        Por ejemplo en el caso de recepción de pensión alimenticia.
      enum:
        - TED
        - DOC
        - PIX
        - TRANSFERENCIA_MESMA_INSTITUICAO
        - BOLETO
        - CONVENIO_ARRECADACAO
        - PACOTE_TARIFA_SERVICOS
        - TARIFA_SERVICOS_AVULSOS
        - FOLHA_PAGAMENTO
        - DEPOSITO
        - SAQUE
        - CARTAO
        - ENCARGOS_JUROS_CHEQUE_ESPECIAL
        - RENDIMENTO_APLIC_FINANCEIRA
        - PORTABILIDADE_SALARIO
        - APLICACAO_FINANCEIRA
        - RESGATE_APLIC_FINANCEIRA
        - OPERACAO_CREDITO
        - TRANSFERENCIA_SALDO_RESERVADO
        - OUTROS
      example: PIX
