      description: "Categoría destinada a la clasificación específica relacionada con la submodalidad del producto.\nLas orientaciones a continuación deben ser observadas para la correcta cumplimentación de este campo:\n* La cumplimentación con el enum `CREDITO_PESSOAL_CLEAN` será obligatoria, a partir de la publicación de la versión 2.5.0 de la API Préstamos, **para contratos abiertos**, cuando sea aplicable;\n* El enum `CONSIGNADO_SIAPE`, **que engloba todos los contratos consignados bajo la reglamentación del Sistema Integrado de Administración de Recursos Humanos (Siape), presentando informaciones de servidores estatutarios, temporales, celetistas (CLT), entre otros**, será de envío obligatorio, a partir del inicio del piloto para crédito consignado;\n* Los contratos liquidados hasta la entrada en producción (go live) de la versión 2.5.0 podrán ser cumplimentados con la opción OUTRO;\n* Las demás submodalidades deben ser clasificadas en la opción `OUTRO`.\n"
