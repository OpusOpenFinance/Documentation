    LoansEnumContractAmortizationScheduled:
      type: string
      description: "Sistema de amortización (Véase Enum):\n- SAC (Sistema de Amortización Constante) - Es aquel en el que el valor de la amortización permanece igual hasta el final. Los intereses cobrados sobre el fraccionamiento no entran en esta cuenta.\n- PRICE (Sistema Francés de Amortización) - Las cuotas son fijas del inicio al fin del contrato. O sea, todas las cuotas tendrán el mismo valor, desde la primera hasta la última. En los primeros pagos, la mayor parte del valor de la cuota corresponde a los intereses. A lo largo del tiempo, la tasa de interés va decreciendo. Como el valor de la cuota es fijo, con el paso de las cuotas, el valor de amortización va aumentando.\n- SAM (Sistema de Amortización Mixto) - Cada cuota (pago) es la media aritmética de las cuotas respectivas en el Sistema Price y en el Sistema de Amortización Constante (SAC).\n- SIN SISTEMA DE AMORTIZACIÓN\n"
      enum:
      - SAC
      - PRICE
      - SAM
      - SEM_SISTEMA_AMORTIZACAO
      - OUTROS
      example: SAC
    LoansResponseLoansWarranties:
