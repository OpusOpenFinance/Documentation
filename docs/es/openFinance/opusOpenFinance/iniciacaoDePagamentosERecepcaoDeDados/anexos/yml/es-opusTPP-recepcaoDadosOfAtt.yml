    FundsResponseInvestmentList:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/FundsInvestmentListItem'
        links:
          $ref: '#/components/schemas/FundsLinks'
        meta:
          $ref: '#/components/schemas/FundsMeta'
      additionalProperties: false
    FundsInvestmentListItem:
      type: object
      description: Lista de fondos de inversión mantenidos por el cliente en la institución transmisora y para los cuales haya otorgado consentimiento.
      required:
        - brandName
        - companyCnpj
        - investmentId
      properties:
        brandName:
          type: string
          description: 'Nombre de la Marca reportada por el participante en el Open Finance. Se recomienda utilizar, siempre que sea posible, el mismo nombre de marca atribuido en el campo del directorio Customer Friendly Server Name (Authorisation Server).'
          pattern: '^[^\s](.*[^\s])?$'
          example: Organização A
          maxLength: 80
        companyCnpj:
          type: string
          description: Registro completo del CNPJ de la institución responsable del Registro - el CNPJ corresponde a la representación alfanumérica de la inscripción en el Cadastro de Pessoa Jurídica. Se deben tener únicamente los caracteres del CNPJ, sin máscara.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '21128159000166'
        anbimaCategory:
          type: string
          description: |
            Conforme a la clasificación ANBIMA, que sigue la deliberación 77 de ANBIMA.

            – Renta Fija

            – Acciones

            – Multimercado

            – Cambiario

            https://www.anbima.com.br/data/files/5A/44/2C/B7/8411B510CD3B4DA568A80AC2/DeliberacaoN77-Diretriz-de-Classificacao-de-Fundos.pdf
          enum:
            - RENDA_FIXA
            - ACOES
            - MULTIMERCADO
            - CAMBIAL
          example: RENDA_FIXA
        anbimaClass:
          type: string
          description: Campo necesario para la adherencia a la Resolución CVM175. A la espera de definiciones de mercado. Debe tratarse de un campo de tipo enum.
          maxLength: 70
          pattern: '[\w\W\s]*'
        anbimaSubclass:
          type: string
          description: Campo necesario para la adherencia a la Resolución CVM175. A la espera de definiciones de mercado. Debe tratarse de un campo de tipo enum.
          maxLength: 70
          pattern: '[\w\W\s]*'
        investmentId:
          type: string
          description: Identifica de forma única la relación del cliente con el producto, manteniendo las reglas de inmutabilidad dentro de la institución transmisora. En los casos en que el cliente, después de completar 12 meses desde el último movimiento y con cantidad de activos en cero (el cliente ya no tiene la posesión del producto bajo la custodia de la transmisora), compre nuevamente el activo en el que ya invirtió en períodos pasados, mantener el mismo investmentId utilizado anteriormente.
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: '92792126019929200000000000000000000000000'
      additionalProperties: false
    FundsResponseInvestmentIdentification:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          $ref: '#/components/schemas/FundsInvestmentIdentificationData'
        links:
          $ref: '#/components/schemas/FundsLinks'
        meta:
          $ref: '#/components/schemas/FundsMeta'
      additionalProperties: false
    FundsInvestmentIdentificationData:
      type: object
      description: Información del producto de fondo de inversión al que se refiere investmentId.
      required:
        - name
        - cnpjNumber
      properties:
        name:
          type: string
          description: Nombre oficial del fondo de inversión conforme se muestra a los clientes en los canales electrónicos.
          maxLength: 250
          example: CONSTELLATION MASTER FIA
        cnpjNumber:
          type: string
          description: CNPJ del fondo de inversión.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '11225860000140'
        isinCode:
          type: string
          description: |
            Código universal que identifica cada valor mobiliario o instrumento financiero, conforme a la Norma ISO 6166.

            DEFINICIÓN: El ISIN (International Securities Identification Number) es un código que identifica un valor mobiliario, conforme a la norma ISO 6166.

            ESTRUCTURA: El ISIN es un código alfanumérico que posee 12 caracteres con la siguiente estructura:
            - Un prefijo, compuesto por 2 caracteres alfa, que identifica el código del país (Norma ISO 3166);
            - El número básico, compuesto por 9 caracteres alfabéticos o numéricos en su extensión;
            - Un dígito numérico de control.
          maxLength: 12
          minLength: 12
          pattern: '^[A-Z]{2}([A-Z0-9]){9}\d{1}$'
          example: BRCST4CTF001
        anbimaCategory:
          type: string
          description: |
            Conforme a la clasificación ANBIMA, que sigue la deliberación 77 de ANBIMA.

            – Renta Fija

            – Acciones

            – Multimercado

            – Cambiario

            https://www.anbima.com.br/data/files/5A/44/2C/B7/8411B510CD3B4DA568A80AC2/DeliberacaoN77-Diretriz-de-Classificacao-de-Fundos.pdf
          enum:
            - RENDA_FIXA
            - ACOES
            - MULTIMERCADO
            - CAMBIAL
          example: RENDA_FIXA
        anbimaClass:
          type: string
          description: Campo necesario para la adherencia a la Resolución CVM175. A la espera de definiciones de mercado. Debe tratarse de un campo de tipo enum.
          maxLength: 70
          pattern: '[\w\W\s]*'
        anbimaSubclass:
          type: string
          description: Campo necesario para la adherencia a la Resolución CVM175. A la espera de definiciones de mercado. Debe tratarse de un campo de tipo enum.
          maxLength: 70
          pattern: '[\w\W\s]*'
      additionalProperties: false
