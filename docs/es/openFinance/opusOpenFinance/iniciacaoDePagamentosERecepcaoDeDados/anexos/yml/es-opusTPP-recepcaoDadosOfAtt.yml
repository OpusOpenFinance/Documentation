    CreditCardsAccountsUsedAmount:
      description: "Valor utilizado del límite informado. \nLos límites extras proporcionados o contratados y usados por el cliente deben ser sumados en este campo. \nAsí, si el valor de este campo es mayor que el límite del cliente, significa el uso y la contratación de límites extras en la tarjeta.\n"
      properties:
