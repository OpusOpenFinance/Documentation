              example: AWAITING_AUTHORISATION
            statusUpdateDateTime:
              description: 'Fecha y hora en que el recurso fue actualizado. Una cadena con fecha y hora conforme a la especificación RFC-3339, siempre con la utilización de timezone UTC(UTC time format).'
