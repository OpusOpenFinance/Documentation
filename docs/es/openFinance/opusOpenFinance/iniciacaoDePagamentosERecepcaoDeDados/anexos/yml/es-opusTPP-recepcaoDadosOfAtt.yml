          example: https://api.banco.com.br/open-banking/api/v1/resource
    FinancingsEnumProductSubType:
      type: string
      description: "\"Subtipo de las modalidades de crédito contratadas, conforme  circular 4.015 y descripción del DOC3040 del SCR). (Véase Enum)\nAdquisición de bienes vehículos automotores, Adquisición de bienes de otros bienes, Microcrédito, Costeo, Inversión, Industrialización, Comercialización, Financiamiento habitacional SFH y Financiamiento habitacional excepto SFH\"\n"
      enum:
      - AQUISICAO_BENS_VEICULOS_AUTOMOTORES
      - AQUISICAO_BENS_OUTROS_BENS
      - MICROCREDITO
      - CUSTEIO
      - INVESTIMENTO
      - INDUSTRIALIZACAO
      - COMERCIALIZACAO
      - FINANCIAMENTO_HABITACIONAL_SFH
      - FINANCIAMENTO_HABITACIONAL_EXCETO_SFH
      example: AQUISICAO_BENS_VEICULOS_AUTOMOTORES
    FinancingsLinksSingle:
      type: object
      description: Referencias a otros recursos de la API solicitada.
      required:
      - self
      properties:
        self:
          type: string
          format: url
          maxLength: 4048
          description: URI completo que generó la respuesta actual.
          example: https://api.banco.com.br/open-banking/api/v1/resource
    FinancingsMeta:
      type: object
      description: Metainformación referente a la API solicitada.
      required:
      - totalRecords
      - totalPages
      - requestDateTime
      properties:
        totalRecords:
          type: integer
          format: int32
          description: Número total de registros en el resultado
          example: 1
        totalPages:
          type: integer
          format: int32
          description: Número total de páginas en el resultado
          example: 1
        requestDateTime:
          description: Fecha y hora de la consulta, conforme a la especificación RFC-3339, formato UTC.
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
    FinancingsResponseFinancingsContractList:
      type: object
      required:
      - data
      - links
      - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/FinancingsListContract'
        links:
          $ref: '#/components/schemas/FinancingsLinks'
        meta:
          $ref: '#/components/schemas/FinancingsMeta'
    FinancingsContract:
      type: object
      description: Conjunto de informaciones referentes a la identificación de la operación de crédito de financiamientos
      required:
      - contractNumber
      - ipocCode
      - productName
      - productType
      - productSubType
      - contractDate
      - contractAmount
      - instalmentPeriodicity
      - CET
      - amortizationScheduled
      - interestRates
      - contractedFees
      - contractedFinanceCharges
      properties:
        contractNumber:
          type: string
          maxLength: 100
          pattern: ^[\w\W]{1,100}$
          example: '1324926521496'
          description: Número del contrato dado por la institución contratante.
        ipocCode:
          type: string
          maxLength: 67
          minLength: 22
          pattern: ^[\w\W]{22,67}$
          description: "\"Número estandarizado del contrato - IPOC (Identificação Padronizada da Operação de Crédito). Según el DOC 3040, compuesto por:\n- **CNPJ de la institución:** 8 (ocho) posiciones iniciales;\n- **Modalidad de la operación:** 4 (cuatro) posiciones;\n- **Tipo del cliente:** 1 (una) posición( 1 = persona natural - CPF, 2= persona jurídica – CNPJ, 3 = persona física en el exterior, 4 = persona jurídica en el exterior, 5 = persona natural sin CPF y 6 = persona jurídica sin CNPJ);\n- **Código del cliente:** El número de posiciones varía conforme el tipo del cliente:\n  1. Para clientes persona física con CPF (tipo de cliente = 1), informar las 11 (once) posiciones del CPF;\n  2. Para clientes persona jurídica con CNPJ (tipo de cliente = 2), informar las 8 (ocho) posiciones iniciales del CNPJ;\n  3. Para los demás clientes (tipos de cliente 3, 4, 5 y 6), informar 14 (catorce) posiciones con complemento de ceros a la izquierda si la identificación tuviera tamaño inferior;\n- **Código del contrato:** 1 (una) hasta 40 (cuarenta) posiciones, sin complemento de caracteres.\"\n"
          example: '92792126019929279212650822221989319252576'
        productName:
          type: string
          maxLength: 140
          pattern: ^[^\s](.*[^\s])?$
          example: Crédito Pessoal Consignado
          description: "Denominación/Identificación del nombre de la Modalidad de la Operación de Crédito divulgado al cliente\n"
        productType:
          $ref: '#/components/schemas/FinancingsEnumProductType'
        productSubType:
          $ref: '#/components/schemas/FinancingsEnumProductSubType'
        contractDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2018-01-05'
          description: Fecha de contratación de la operación de crédito. Especificación RFC-3339
        disbursementDates:
          type: array
          minItems: 1
          description: "Lista que presenta las Fechas de Desembolso del valor contratado.\n"
          items:
            type: string
            format: date
            maxLength: 10
            pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
            example: '2018-01-15'
            description: "Fecha del Desembolso del valor contratado. Especificación RFC-3339.\nEn el caso de una liberación de recursos realizada en D0 pero con referencia retroactiva realizada en D -1, contablemente la fecha correcta sería D -1.\n"
        settlementDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2018-01-15'
          description: "Fecha de liquidación de la operación.\n"
        contractAmount:
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: Valor contratado de la operación. Expresado en valor monetario con un mínimo de 2 y un máximo de 4 posiciones decimales. En los casos en que no exista este valor explícito en el contrato del producto, enviar como 0.00.
        currency:
          type: string
          pattern: ^(\w{3}){1}$
          maxLength: 3
          description: "Moneda referente al valor de la garantía, según el modelo ISO-4217. p.ej. 'BRL'\nTodos los valores monetarios informados están representados con la moneda vigente de Brasil\n"
          example: BRL
        dueDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2028-01-15'
          description: "Fecha de vencimiento Final de la operación. Especificación RFC-3339.   \n"
        instalmentPeriodicity:
          type: string
          description: "\"Información relativa a la periodicidad regular de las cuotas. (Véase Enum)\nsin periodicidad regular, semanal, quincenal, mensual, bimestral, trimestral, semestral, anual\"\n"
          enum:
          - SEM_PERIODICIDADE_REGULAR
          - SEMANAL
          - QUINZENAL
          - MENSAL
          - BIMESTRAL
          - TRIMESTRAL
          - SEMESTRAL
          - ANUAL
          - OUTROS
          example: SEMANAL
        instalmentPeriodicityAdditionalInfo:
          type: string
          pattern: ^[^\s](.*[^\s])?$
          maxLength: 50
          example: Informações adicionais sobre periodicidade
          description: "Campo para complementar la información relativa a la periodicidad de pago regular. \n\n[Restricción] Obligatorio cuando el campo instalmentPeriodicity sea igual a OUTROS.\n"
        firstInstalmentDueDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2018-02-15'
          description: "Fecha de vencimiento de la primera cuota del principal.\n"
        CET:
          type: string
          format: double
          maxLength: 13
          minLength: 8
          pattern: ^\d{1,6}\.\d{6}$
          example: '0.290000'
          description: "CET – Costo Efectivo Total debe ser expresado en forma de tasa porcentual anual e incorpora todos los cargos y gastos incidentes en las operaciones de crédito (tasa de interés, pero también tarifas, tributos, seguros y otros gastos cobrados).\n\nLa cumplimentación debe respetar las 6 posiciones decimales, aunque vengan cumplimentadas con ceros (representación de porcentaje p.ej.: 0.150000.\nEste valor representa 15%. El valor 1 representa 100%).  \n\nPara el público PF (persona física) el campo es de envío obligatorio para contratos firmados a partir de 2008, conforme a la Resolución CMN 3.517. Para el público PJ (persona jurídica) el campo es de envío obligatorio para contratos firmados a partir de 2011, conforme a la Resolución CMN 3.909. Excepcionalmente en los casos de operaciones de crédito rural, el envío del campo CET será obligatorio a partir de 2019, conforme a la Resolución CMN 4.699. El campo podrá ser cumplimentado con 0.00 en escenarios en los que la institución no tenga la información de CET (Costo efectivo total) solo para las excepciones listadas a continuación:\n- En contratos anteriores a 2008 (para el público PF);\n- En contratos anteriores a 2011 (para el público PJ);\n- En contratos anteriores a 2019 para los casos de operaciones de crédito rural (ambos los públicos PF y PJ);\n- Público PJ de mediano o gran porte.\n\nCuando el CET sea indexado dinámicamente a un indicador aún no divulgado, informar el valor recalculado con el último índice oficial disponible en la fecha de la consulta. Tan pronto como el nuevo índice sea publicado, el CET debe ser actualizado en la próxima exposición.\n"
        amortizationScheduled:
          type: string
          description: "Sistema de amortización (Véase Enum):\n- SAC (Sistema de Amortización Constante) - Es aquel en el que el valor de la amortización permanece igual hasta el final. Los intereses cobrados sobre el fraccionamiento no entran en esta cuenta.\n- PRICE (Sistema Francés de Amortización) - Las cuotas son fijas del inicio al fin del contrato. O sea, todas las cuotas tendrán el mismo valor, desde la primera hasta la última. En los primeros pagos, la mayor parte del valor de la cuota corresponde a los intereses. A lo largo del tiempo, la tasa de interés va decreciendo. Como el valor de la cuota es fijo, con el paso de las cuotas, el valor de amortización va aumentando.\n- SAM (Sistema de Amortización Mixto) - Cada cuota (pago) es la media aritmética de las cuotas respectivas en el Sistema Price y en el Sistema de Amortización Constante (SAC).\n- SIN SISTEMA DE AMORTIZACIÓN\n"
          enum:
          - SAC
          - PRICE
          - SAM
          - SEM_SISTEMA_AMORTIZACAO
          - OUTROS
          example: SAC
        amortizationScheduledAdditionalInfo:
          type: string
          pattern: ^[^\s](.*[^\s])?$
          maxLength: 200
          example: Informações complementares relativa à amortização do tipo 'OUTROS'
          description: "Campo para complementar la información relativa a la amortización.\n\n[Restricción] Obligatorio cuando el campo amortizationScheduled sea igual a OUTROS.\n"
        interestRates:
          type: array
          minItems: 0
          description: "Objeto que presenta el conjunto de informaciones necesarias para demostrar la composición de las tasas de interés remuneratorias de la Modalidad de crédito.  \nEn caso de que el contrato no posea tasas de interés, debe compartirse una lista vacía. En caso de que el contrato posea una tasa de interés con valor 0, debe compartirse un objeto con el valor 0 de forma explícita.\n"
          items:
            $ref: '#/components/schemas/FinancingsContractInterestRate'
        contractedFees:
          type: array
          minItems: 0
          description: "Lista que presenta las informaciones de las tarifas pactadas en el contrato.\n"
          items:
            $ref: '#/components/schemas/FinancingsContractFee'
        contractedFinanceCharges:
          type: array
          minItems: 0
          description: Lista que presenta los cargos pactados en el contrato
          items:
            $ref: '#/components/schemas/FinancingsFinanceCharge'
        hasInsuranceContracted:
          type: boolean
          description: Campo que identifica si existe seguro contratado para el Financiamiento, donde seguro contratado es true y no contratado es false. El no envío del campo significa que la institución no ofrece este producto.
    FinancingsResponseFinancingsWarranties:
      type: object
      required:
      - data
      - links
      - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/FinancingsWarranties'
        links:
          $ref: '#/components/schemas/FinancingsLinks'
        meta:
          $ref: '#/components/schemas/FinancingsMeta'
    FinancingsPayments:
      type: object
      description: Conjunto de informaciones referentes a los pagos realizados de una operación de crédito de adelanto a depositantes
      required:
      - contractOutstandingBalance
      - releases
      properties:
        paidInstalments:
          type: number
          maximum: 2147483647
          example: 73
          description: "Cantidad total de cuotas pagadas del contrato referente a la Modalidad de Crédito informada.\n\n[Restricción] Obligatorio para modalidades que posean cuotas.\n"
        contractOutstandingBalance:
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: Valor necesario para que el cliente liquide la deuda, o sea, este campo debe ser cumplimentado con el saldo deudor actualizado descrito en el DDC (Documento Descritivo de Crédito).
        releases:
          type: array
          minItems: 0
          description: Lista de los pagos realizados en el período
          items:
            $ref: '#/components/schemas/FinancingsReleases'
    FinancingsReleases:
      type: object
      description: Lista de los pagos realizados en el período
      required:
      - paymentId
      - isOverParcelPayment
      - paidDate
      - currency
      - paidAmount
      properties:
        paymentId:
          type: string
          maxLength: 100
          minLength: 1
          example: XlthLXpBLVowLTldW2EtekEtWjAtOVwtXXswLDk5fSQ
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          description: Código o identificador único proporcionado por la institución para representar el pago individual.
        isOverParcelPayment:
          type: boolean
          example: true
          description: Identifica si es un pago pactado (false) o suelto (true).
        instalmentId:
          type: string
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          example: WGx0aExYcEJMVm93TFRsZFcyRXRla0V0V2pBdE9Wd3RYWH
          description: "Identificador de cuota, de responsabilidad de cada institución transmisora.  \n[Restricción] Información de envío obligatorio cuando isOverParcelPayment tenga el valor FALSE.\n"
        paidDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2021-05-21'
          description: Fecha efectiva del pago referente al contrato de la modalidad de crédito consultada, conforme a la especificación RFC-3339. p.ej. 2014-03-19
        currency:
          type: string
          maxLength: 3
          pattern: ^(\w{3}){1}$
          example: BRL
          description: "Moneda referente al valor monetario informado, según el modelo ISO-4217. p.ej. 'BRL'.\nTodos los valores monetarios informados están representados con la moneda vigente de Brasil.\n"
        paidAmount:
          type: string
          format: double
          pattern: ^-?\d{1,15}\.\d{2,4}$
          maxLength: 21
          minLength: 4
          example: '1000.0400'
          description: "Valor del pago referente al  contrato de la modalidad de crédito consultada.\nExpresado en valor monetario con un mínimo de 2 y un máximo de 4 posiciones decimales.\n"
        overParcel:
          $ref: '#/components/schemas/FinancingsOverParcel'
    FinancingsOverParcel:
      type: object
      description: "Objeto de las tarifas y cargos que fueron pagados fuera de la cuota.\n\n[Restricción] La información debe ser enviada en caso de que exista.\n"
      required:
      - fees
      - charges
      properties:
        fees:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/FinancingsFeeOverParcel'
          description: Lista de las tarifas que fueron pagadas fuera de la cuota, solo para pago suelto.
        charges:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/FinancingsChargeOverParcel'
          description: Lista de los cargos que fueron pagados fuera de la cuota.
    FinancingsResponseFinancingsContract:
      type: object
      required:
      - data
      - links
      - meta
      properties:
        data:
          $ref: '#/components/schemas/FinancingsContract'
        links:
          $ref: '#/components/schemas/FinancingsLinksSingle'
        meta:
          $ref: '#/components/schemas/FinancingsMetaSingle'
    FinancingsBalloonPayment:
      type: object
      description: Lista que presenta las fechas de vencimiento y el valor de las cuotas no regulares  del contrato de la modalidad de crédito consultada.
      required:
      - dueDate
      - amount
      properties:
        dueDate:
          type: string
          format: date
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          description: Fecha de vencimiento de la cuota no regular  por vencer del contrato de la modalidad de crédito consultada, conforme a la especificación RFC-3339. p.ej. 2014-03-19
          maxLength: 10
          example: '2020-01-10'
        amount:
          $ref: '#/components/schemas/FinancingsBalloonPaymentAmount'
    FinancingsFinanceCharge:
      type: object
      description: Conjunto de informaciones referentes a la identificación de la operación de crédito
      required:
      - chargeType
      properties:
        chargeType:
          $ref: '#/components/schemas/FinancingsEnumContractFinanceChargeType'
        chargeAdditionalInfo:
          type: string
          maxLength: 50
          description: "Campo para informaciones adicionales.\n\n[Restricción] Obligatorio si se selecciona la opción 'OUTROS' en Tipo de cargo pactado en el contrato.\n"
          pattern: ^[^\s](.*[^\s])?$
          example: Informações adicionais sobre encargos.
        chargeRate:
          type: string
          format: double
          pattern: ^\d{1}\.\d{6}$
          maxLength: 8
          minLength: 8
          description: "Representa el valor del cargo en porcentaje pactado en el contrato.   \nLa cumplimentación debe respetar las 6 posiciones decimales, aunque vengan cumplimentadas con ceros(representación de porcentaje p.ej.: 0.150000. \nEste valor representa 15%. El valor 1 representa 100%).\n"
          example: '0.071200'
    FinancingsChargeOverParcel:
      type: object
      required:
      - chargeType
      - chargeAmount
      properties:
        chargeType:
          $ref: '#/components/schemas/FinancingsEnumContractFinanceChargeType'
        chargeAmount:
          type: string
          format: double
          pattern: ^-?\d{1,15}\.\d{2,4}$
          maxLength: 21
          minLength: 4
          example: '1000.0400'
          description: Valor del pago del cargo pagado fuera de la cuota. Expresado en valor monetario con un mínimo de 2 y un máximo de 4 decimales.
        chargeAdditionalInfo:
          type: string
          pattern: ^[^\s](.*[^\s])?$
          maxLength: 140
          example: Informações adicionais
          description: "Campo libre para la cumplimentación de la información adicional referente al cargo.\n\n[Restricción] Obligatorio cuando chargeType sea igual a 'OUTROS'.\n"
    FinancingsEnumProductType:
      type: string
      description: "\"Tipo de la modalidad de crédito contratada, conforme  circular 4.015 y descripción del DOC3040 del SCR). (Véase Enum)\nFinanciamientos, Financiamientos rurales  y Financiamientos inmobiliarios\"\n"
      enum:
      - FINANCIAMENTOS
      - FINANCIAMENTOS_RURAIS
      - FINANCIAMENTOS_IMOBILIARIOS
      example: FINANCIAMENTOS
    FinancingsEnumContractFinanceChargeType:
      type: string
      description: Tipo de cargo pactado en el contrato.
      enum:
      - JUROS_REMUNERATORIOS_POR_ATRASO
      - MULTA_ATRASO_PAGAMENTO
      - JUROS_MORA_ATRASO
      - IOF_CONTRATACAO
      - IOF_POR_ATRASO
      - SEM_ENCARGO
      - OUTROS
      example: JUROS_REMUNERATORIOS_POR_ATRASO
    FinancingsContractInterestRate:
      type: object
      description: Objeto que presenta el conjunto de informaciones necesarias para demostrar la composición de las tasas de interés remuneratorias de la Modalidad de crédito
      required:
      - taxType
      - interestRateType
      - taxPeriodicity
      - calculation
      - referentialRateIndexerType
      properties:
        taxType:
          type: string
          description: "\"Tipo de Tasa (ver  Enum)\n- NOMINAL (la tasa nominal es una tasa de interés en la que la unidad referencial no coincide con la unidad de tiempo de la capitalización. Ella siempre se proporciona en términos anuales, y sus períodos de capitalización pueden ser diarios, mensuales, trimestrales o semestrales. p.ej. Una tasa de 12% al año con capitalización mensual)\n- EFETIVA (Es la tasa de interés en la que la unidad referencial coincide con la unidad de tiempo de la capitalización. Como las unidades de medida de tiempo de la tasa de interés y de los períodos de capitalización son iguales, se usan ejemplos simples como 1% al mes, 60% al año)\"\n"
          enum:
          - NOMINAL
          - EFETIVA
          example: EFETIVA
        interestRateType:
          type: string
          description: "\"Tipo de Intereses  (véase  Enum)\n- SIMPLES (aplicada/cobrada siempre sobre el capital inicial, que es el valor prestado/invertido. No hay cobro de intereses sobre intereses acumulados en el(los) período(s) anterior(es). Ejemplo: en un préstamo de R$1.000, con tasa de interés simple de 8% a.a., con duración de 2 años, el total de intereses será R$80 en el primer año y R$ 80 en el segundo año. Al final del contrato, el tomador devolverá el principal y los intereses simples de cada año: R$1.000+R$80+R$80=R$1.160)\n- COMPOSTO (para cada período del contrato (diario, mensual, anual etc.), hay un “nuevo capital” para el cobro de la tasa de interés contratada. Ese “nuevo capital” es la suma del capital y del interés cobrado en el período anterior. Ejemplo: en un préstamo de R$1.000, con tasa de interés compuesta de 8% a.a., con duración de 2 años, el total de intereses será R$80 en el primer año. En el segundo año, los intereses serán sumados al capital (R$1.000 + R$ 80 = R$ 1.080), resultando en intereses de R$ 86 (8% de R$ 1.080))\"\n"
          enum:
          - SIMPLES
          - COMPOSTO
          example: SIMPLES
        taxPeriodicity:
          type: string
          description: "\"Periodicidad de la tasa . (Véase  Enum)\na.m - al mes\na.a. - al año\"\n"
          enum:
          - AM
          - AA
          example: AA
        calculation:
          type: string
          description: Base de cálculo
          enum:
          - 21/252
          - 30/360
          - 30/365
          example: 21/252
        referentialRateIndexerType:
          type: string
          description: "\"Tipos de tasas referenciales o indexadores, conforme al Anexo 5: Tasa referencial o Indexador (Indx), del Documento 3040\"\n"
          enum:
          - SEM_TIPO_INDEXADOR
          - PRE_FIXADO
          - POS_FIXADO
          - FLUTUANTES
          - INDICES_PRECOS
          - CREDITO_RURAL
          - OUTROS_INDEXADORES
          example: PRE_FIXADO
        referentialRateIndexerSubType:
          type: string
          description: "\"Subtipos de tasas referenciales o indexadores, conforme al Anexo 5: Tasa referencial o Indexador (Indx), del Documento 3040\"\n"
          enum:
          - SEM_SUB_TIPO_INDEXADOR
          - PRE_FIXADO
          - TR_TBF
          - TJLP
          - LIBOR
          - TLP
          - OUTRAS_TAXAS_POS_FIXADAS
          - CDI
          - SELIC
          - OUTRAS_TAXAS_FLUTUANTES
          - IGPM
          - IPCA
          - IPCC
          - OUTROS_INDICES_PRECO
          - TCR_PRE
          - TCR_POS
          - TRFC_PRE
          - TRFC_POS
          - OUTROS_INDEXADORES
          example: TJLP
        referentialRateIndexerAdditionalInfo:
          type: string
          maxLength: 140
          pattern: ^[^\s](.*[^\s])?$
          example: Informações adicionais
          description: "Campo libre para complementar la información relativa al Tipo de tasa referencial o indexador.\n\n[Restricción] Obligatorio para complementar la información relativa al Tipo de tasa referencial o indexador, cuando se seleccione el tipo o subtipo OUTRO.\n"
        preFixedRate:
          type: string
          format: double
          maxLength: 9
          minLength: 8
          pattern: ^\d{1,2}\.\d{6}$
          example: '0.600000'
          description: "Tasa prefijada aplicada sobre el contrato de la modalidad de crédito. p.ej. 0.014500.   \nLa cumplimentación debe respetar las 6 posiciones decimales, aunque vengan cumplimentadas con ceros(representación de porcentaje p.ej.: 0.150000. Este valor representa 15%. El valor 1 representa 100%).\n"
        postFixedRate:
          type: string
          format: double
          maxLength: 9
          minLength: 8
          pattern: ^\d{1,2}\.\d{6}$
          example: '0.550000'
          description: "Tasa posfijada aplicada sobre el contrato de la modalidad de crédito. p.ej. 0.014500.   \nLa cumplimentación debe respetar las 6 posiciones decimales, aunque vengan cumplimentadas con ceros (representación de porcentaje p.ej.: 0.150000. Este valor representa 15%. El valor 1 representa 100%).\n"
        additionalInfo:
          type: string
          maxLength: 1200
          pattern: ^[^\s](.*[^\s])?$
          example: Informações adicionais
          description: "Texto con informaciones adicionales sobre la composición de las tasas de interés pactadas. \n\n[Restricción] En caso de que la institución posea la información para compartir, esta deberá ser informada.\n"
    FinancingsMetaSingle:
      type: object
      description: Metainformación referente a la API solicitada.
      required:
      - requestDateTime
      properties:
        requestDateTime:
          description: Fecha y hora de la consulta, conforme a la especificación RFC-3339, formato UTC.
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
    FinancingsContractFee:
      type: object
      description: Objeto que presenta el conjunto de informaciones necesarias para demostrar la composición de las tasas de interés remuneratorias de la Modalidad de crédito
      required:
      - feeName
      - feeCode
      - feeChargeType
      - feeCharge
      properties:
        feeName:
          type: string
          maxLength: 140
          pattern: ^[^\s](.*[^\s])?$
          description: Denominación de la Tarifa pactada
          example: Excesso em Conta
        feeCode:
          type: string
          maxLength: 140
          pattern: ^[^\s](.*[^\s])?$
          description: Sigla identificadora de la tarifa pactada
          example: EXCESSO_CONTA
        feeChargeType:
          type: string
          description: Tipo de cobro para la tarifa pactada en el contrato.
          enum:
          - UNICA
          - POR_PARCELA
          example: UNICA
        feeCharge:
          type: string
          description: "\"Forma de cobro relativa a la tarifa pactada en el contrato. (Véase Enum)\n- Mínimo\n- Máximo\n- Fijo\n- Porcentual\"\n"
          enum:
          - MINIMO
          - MAXIMO
          - FIXO
          - PERCENTUAL
          example: MINIMO
        feeAmount:
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: "Valor monetario de la tarifa pactada en el contrato. \n\n[Restricción] Cumplimentación obligatoria cuando la forma de cobro sea diferente de Porcentual.\n"
        feeRate:
          type: string
          format: double
          maxLength: 8
          minLength: 8
          pattern: ^\d{1}\.\d{6}$
          description: "Es el valor de la tarifa en porcentaje pactada en el contrato.\n\n[Restricción] Cumplimentación obligatoria cuando la forma de cobro sea Porcentual.\n"
          example: '0.200000'
    FinancingsWarranties:
      type: object
      description: Conjunto de informaciones referentes a la identificación de la operación de crédito de financiamiento.
      required:
      - currency
      - warrantyType
      - warrantySubType
      - warrantyAmount
      properties:
        currency:
          type: string
          pattern: ^(\w{3}){1}$
          maxLength: 3
          description: Moneda referente al valor de la garantía, según el modelo ISO-4217. p.ej. 'BRL'. Todos los valores monetarios informados están representados con la moneda vigente de Brasil
          example: BRL
        warrantyType:
          type: string
          description: Denominación/Identificación del tipo de la garantía que avala la Modalidad de la Operación de Crédito contratada  (Doc 3040, Anexo 12)
          enum:
          - CESSAO_DIREITOS_CREDITORIOS
          - CAUCAO
          - PENHOR
          - ALIENACAO_FIDUCIARIA
          - HIPOTECA
          - OPERACOES_GARANTIDAS_PELO_GOVERNO
          - OUTRAS_GARANTIAS_NAO_FIDEJUSSORIAS
          - SEGUROS_ASSEMELHADOS
          - GARANTIA_FIDEJUSSORIA
          - BENS_ARRENDADOS
          - GARANTIAS_INTERNACIONAIS
          - OPERACOES_GARANTIDAS_OUTRAS_ENTIDADES
          - ACORDOS_COMPENSACAO
          example: CESSAO_DIREITOS_CREDITORIOS
        warrantySubType:
          type: string
          description: "Denominación/Identificación del subtipo de la garantía que avala la Modalidad de la Operación de Crédito contratada (Doc 3040, Anexo 12).\n"
          enum:
          - ACOES_DEBENTURES
          - ACORDOS_COMPENSACAO_LIQUIDACAO_OBRIGACOES
          - APLICACOES_FINANCEIRAS_RENDA_FIXA
          - APLICACOES_FINANCEIRAS_RENDA_VARIAVEL
          - APOLICES_CREDITO_EXPORTACAO
          - CCR_CONVENIO_CREDITOS_RECIPROCOS
          - CHEQUES
          - CIVIL
          - DIREITOS_SOBRE_ALUGUEIS
          - DEPOSITOS_A_VISTA_A_PRAZO_POUPANCA_OURO_TITULOS_PUBLICOS_FEDERAIS_ART_36
          - DEPOSITO_TITULOS_EMITIDOS_ENTIDADES_ART_23
          - DUPLICATAS
          - EMD_ENTIDADES_MULTILATERAIS_DESENVOLVIMENTO_ART_37
          - EQUIPAMENTOS
          - ESTADUAL_OU_DISTRITAL
          - FATURA_CARTAO_CREDITO
          - FEDERAL
          - FCVS_FUNDO_COMPENSACAO_VARIACOES_SALARIAIS
          - FGI_FUNDO_GARANTIDOR_INVESTIMENTOS
          - FGPC_FUNDO_GARANTIA_PROMOCAO_COMPETIT
          - FGTS_FUNDO_GARANTIA_TEMPO_SERVICO
          - FUNDO_GARANTIDOR_AVAL
          - GARANTIA_PRESTADA_FGPC_LEI_9531_ART_37
          - GARANTIA_PRESTADA_FUNDOS_QUAISQUER_OUTROS_MECANISMOS_COBERTURA_RISCO_CREDITO_ART_37
          - GARANTIA_PRESTADA_TESOURO_NACIONAL_OU_BACEN_ART_37_BENS_DIREITOS_INTEGRANTES_PATRIMONIO_AFETACAO
          - IMOVEIS
          - IMOVEIS_RESIDENCIAIS
          - MITIGADORAS
          - MUNICIPAL
          - NAO_MITIGADORAS
          - NOTAS_PROMISSORIAS_OUTROS_DIREITOS_CREDITO
          - OUTRAS
          - OUTROS
          - OUTROS_BENS
          - OUTROS_GRAUS
          - OUTROS_IMOVEIS
          - OUTROS_SEGUROS_ASSEMELHADOS
          - PESSOA_FISICA
          - PESSOA_FISICA_EXTERIOR
          - PESSOA_JURIDICA
          - PESSOA_JURIDICA_EXTERIOR
          - PRIMEIRO_GRAU_BENS_DIREITOS_INTEGRANTES_PATRIMONIO_AFETACAO
          - PRIMEIRO_GRAU_IMOVEIS_RESIDENCIAIS
          - PRIMEIRO_GRAU_OUTROS
          - PROAGRO
          - PRODUTOS_AGROPECUARIOS_COM_WARRANT
          - PRODUTOS_AGROPECUARIOS_SEM_WARRANT
          - SBCE_SOCIEDADE_BRASILEIRA_CREDITO_EXPORTAÇÃO
          - SEGURO_RURAL
          - SEM_SUB_TIPO_GARANTIA
          - TRIBUTOS_RECEITAS_ORCAMENTARIAS
          - VEICULOS
          - VEICULOS_AUTOMOTORES
          example: NOTAS_PROMISSORIAS_OUTROS_DIREITOS_CREDITO
        warrantyAmount:
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: "Valor original de la garantía. Expresado en valor monetario con un mínimo de 2 y un máximo de 4 decimales.\n\n[Restricción] Para los casos en que warrantyType sea igual a \"GARANTIA_FIDEJUSSORIA\" el valor de la garantía corresponde a un porcentaje del total garantizado. \nDe esa forma, los casos de garantía fideiusoria para los cuales no es posible determinar un valor monetario para la garantía deben ser cumplimentados con 0.00.\n"
    FinancingsFeeOverParcel:
      type: object
      required:
