                  description: Define la razón por la cual el consentimiento fue rechazado.
                  required:
                    - code
                  properties:
                    code:
                      type: string
                      description: |
                        Define el código de la razón por la cual el consentimiento fue rechazado.

                        - CONSENT_EXPIRED – consentimiento que superó el tiempo límite para la autorización.
                        - CUSTOMER_MANUALLY_REJECTED – el cliente efectuó el rechazo del consentimiento manualmente mediante interacción en las instituciones participantes.
                        - CUSTOMER_MANUALLY_REVOKED – el cliente efectuó la revocación después de la autorización del consentimiento.
                        - CONSENT_MAX_DATE_REACHED – consentimiento que superó el tiempo límite de compartición.
                        - CONSENT_TECHNICAL_ISSUE – consentimiento que fue rechazado debido a un problema técnico que imposibilita su uso por la institución receptora, por ejemplo: falla asociada al intercambio del AuthCode por el AccessToken, durante el proceso de Hybrid Flow.
                        - INTERNAL_SECURITY_REASON – consentimiento que fue rechazado debido a las políticas de seguridad aplicadas por la institución transmisora.
                      enum:
                        - CONSENT_EXPIRED
                        - CUSTOMER_MANUALLY_REJECTED
                        - CUSTOMER_MANUALLY_REVOKED
                        - CONSENT_MAX_DATE_REACHED
                        - CONSENT_TECHNICAL_ISSUE
                        - INTERNAL_SECURITY_REASON
                      example: CONSENT_EXPIRED
                    additionalInformation:
                      type: string
                      description: Contiene informaciones adicionales a criterio de la transmisora.
                      maxLength: 140
                      pattern: '^[^\s](.*[^\s])?$'
                      example: Tempo de confirmação da múltipla alçada excedido.
            journey:
              type: object
              description: |
                Informaciones adicionales sobre el contexto de Jornada Optimizada. [RESTRICCIÓN] Objeto de envío obligatorio cuando el usuario manifieste consentimiento para la compartición de saldo a través de la Jornada Optimizada.
              properties:
                isLinked:
                  type: boolean
                  example: true
                  description: |
                    Campo para identificación de consentimiento iniciado en Jornada Optimizada. [RESTRICCIÓN] Campo de cumplimentación obligatoria para todo consentimiento iniciado a partir de la jornada optimizada, independientemente del estado del consentimiento.
                linkId:
                  type: string
                  pattern: ^urn:[a-zA-Z0-9][a-zA-Z0-9-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*'%\/?#]+$
                  maxLength: 256
                  example: urn:bancoex:C1DD331237
                  description: |
                    Identificador del consentimiento de pago/vínculo al cual este consentimiento está vinculado. [RESTRICCIÓN] Este campo será cumplimentado en caso de que el consentimiento haya sido autorizado o rechazado por acción del cliente.

        links:
          $ref: '#/components/schemas/LinksConsents'
        meta:
          $ref: '#/components/schemas/RegulatoryMeta'
    ResponseConsentReadExtensions:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            type: object
            required:
              - loggedUser
              - requestDateTime
            properties:
              expirationDateTime:
                description: |
                  Fecha y hora de expiración del permiso. Refleja la fecha límite de validez del consentimiento. Una cadena con fecha y hora conforme a la especificación RFC-3339, siempre con la utilización de timezone UTC(UTC time format), utilizado solamente para la consulta de modificaciones históricas de extensión del consentimiento.

                  [Restricción] De cumplimentación obligatoria en los casos en que haya validez determinada.

                  En casos de consentimiento con plazo indeterminado el campo no debe ser cumplimentado.
                type: string
                format: date-time
                pattern: '(^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$)'
                maxLength: 20
                example: '2021-05-21T08:30:00Z'
              loggedUser:
                $ref: '#/components/schemas/LoggedUser'
              requestDateTime:
                description: Fecha y hora en que el recurso fue creado. Una cadena con fecha y hora conforme a la especificación RFC-3339, siempre con la utilización de timezone UTC(UTC time format).
                type: string
                format: date-time
                example: '2021-05-21T08:30:00Z'
                maxLength: 20
              previousExpirationDateTime:
                description: |
                  Fecha y hora de expiración anteriores a la renovación. Refleja la fecha límite anterior de validez del consentimiento. Una cadena con fecha y hora conforme a la especificación RFC-3339, siempre con la utilización de timezone UTC (UTC time format).

                  [Restricción] De cumplimentación obligatoria en los casos en que haya validez determinada. En casos de consentimiento con plazo indeterminado, o renovaciones hechas con la v2.2.0 en que no exista persistencia de esa información, el campo no debe ser cumplimentado.
                type: string
                format: date-time
                pattern: '(^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$)'
                maxLength: 20
                example: '2023-10-18T18:30:00Z'
              xFapiCustomerIpAddress:
                description: |
                  La dirección IP del usuario conectado con la receptora que solicitó la renovación sin redireccionamiento.

                  [Restricción] De cumplimentación obligatoria a partir de la v3.0.0. Opcional para renovaciones hechas con la v2.2.0 cuando no exista persistencia de esa información.
                type: string
                pattern: '^[^\s](.*[^\s])?$'
                minLength: 1
                maxLength: 100
                example: '172.217.22.14'
              xCustomerUserAgent:
                description: |
                  Indica el user-agent que el usuario utilizó cuando solicitó la renovación sin redireccionamiento.

                  [Restricción] De cumplimentación obligatoria a partir de la v3.0.0. Opcional para renovaciones hechas con la v2.2.0 cuando no exista persistencia de esa información.
                type: string
                pattern: '^[^\s](.*[^\s])?$'
                minLength: 1
                maxLength: 255
                example: Mozilla/5.0 (iPhone14,6; U; CPU iPhone OS 15_4 like Mac OS X)
        links:
          $ref: '#/components/schemas/Links'
        meta:
          $ref: '#/components/schemas/MetaExtensions'
