    FinancingsInstalments:
      type: object
      description: Conjunto de informaciones referentes a las cuotas / prestaciones de la operación de crédito de financiamientos contratada
      required:
      - typeContractRemaining
      - typeNumberOfInstalments
      - paidInstalments
      properties:
        typeNumberOfInstalments:
          type: string
          description: Tipo de plazo total del contrato referente a la modalidad de crédito informada.
          enum:
          - DIA
          - SEMANA
          - MES
          - ANO
          - SEM_PRAZO_TOTAL
          example: MES
        totalNumberOfInstalments:
          type: number
          example: 130632
          maximum: 999999
          description: "Plazo Total según el tipo (día, semana, mes, año) referente a la Modalidad de Crédito informada.\n\n[Restricción] Obligatoriamente debe ser cumplimentado en caso de que typeNumberOfInstalments sea diferente de SEM_PRAZO_TOTAL.\n"
        typeContractRemaining:
          type: string
          enum:
          - DIA
          - SEMANA
          - MES
          - ANO
          - SEM_PRAZO_REMANESCENTE
          description: "Tipo de plazo remanente del contrato referente a la modalidad de crédito informada.\n"
        contractRemainingNumber:
          type: number
          maximum: 999999
          description: "Plazo Remanente según el tipo (día, semana, mes, año) referente a la Modalidad de Crédito informada.\n\n[Restricción] Obligatoriamente debe ser cumplimentado en caso de que el typeContractRemaining sea diferente de SEM_PRAZO_REMANESCENTE.\n"
          example: 14600
        paidInstalments:
          type: number
          description: Cantidad de cuotas pagadas. (En el caso de modalidades que no posean cuotas, el número de cuotas es igual a cero)
          maximum: 999999
          example: 73
        dueInstalments:
          type: number
          maximum: 999999
          description: "Cantidad de prestaciones por vencer.\n\n[Restricción] Obligatorio para modalidades que posean cuotas.\n"
          example: 57
        pastDueInstalments:
          type: number
          maximum: 999999
          description: "Cantidad de prestaciones vencidas.\n\n[Restricción] Obligatorio para modalidades que posean cuotas.\n"
          example: 73
        balloonPayments:
          type: array
          items:
            $ref: '#/components/schemas/FinancingsBalloonPayment'
          minItems: 1
          description: Lista que presenta las fechas de vencimiento y el valor de las cuotas no regulares del contrato de la modalidad de crédito consultada
    FinancingsResponseFinancingsInstalments:
      type: object
      required:
      - data
      - links
      - meta
      properties:
        data:
          $ref: '#/components/schemas/FinancingsInstalments'
        links:
          $ref: '#/components/schemas/FinancingsLinksSingle'
        meta:
          $ref: '#/components/schemas/FinancingsMetaSingle'
    FinancingsListContract:
      type: object
      description: Conjunto de informaciones  de contratos de financiamiento mantenidos por el cliente en la institución transmisora y para los cuales él haya proporcionado consentimiento
      required:
      - contractId
      - brandName
      - companyCnpj
      - productType
      - productSubType
      - ipocCode
      properties:
        contractId:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          maxLength: 100
          example: '92792126019929279212650822221989319252576'
          description: Identifica de forma única el contrato de la operación de crédito del cliente, manteniendo las reglas de inmutabilidad dentro de la institución transmisora.
        brandName:
          type: string
          pattern: ^[^\s](.*[^\s])?$
          maxLength: 80
          example: Organização A
          description: Nombre de la Marca reportada por el participante en el Open Finance. Se recomienda utilizar, siempre que sea posible, el mismo nombre de marca atribuido en el campo del directorio Customer Friendly Server Name (Authorisation Server).
        companyCnpj:
          type: string
          pattern: ^[0-9A-Z]{12}[0-9]{2}$
          description: "Registro completo del CNPJ de la institución responsable del Registro - el CNPJ corresponde a la representación alfanumérica de la inscripción en el Cadastro de Pessoa Jurídica. \nSe deben tener únicamente los caracteres del CNPJ, sin máscara.\n"
          maxLength: 14
          example: '21128159000166'
        productType:
          $ref: '#/components/schemas/FinancingsEnumProductType'
        productSubType:
          $ref: '#/components/schemas/FinancingsEnumProductSubType'
        ipocCode:
          type: string
          maxLength: 67
          minLength: 22
          pattern: ^[\w\W]{22,67}$
          example: '92792126019929279212650822221989319252576'
          description: "Número estandarizado del contrato - IPOC (Identificación Estandarizada de la Operación de Crédito). Según el DOC 3040, compuesta por:\n- **CNPJ de la institución:** 8 (ocho) posiciones iniciales;\n- **Modalidad de la operación:** 4 (cuatro) posiciones;\n- **Tipo del cliente:** 1 (una) posición( 1 = persona natural - CPF, 2= persona jurídica – CNPJ, 3 = persona física en el exterior, 4 = persona jurídica en el exterior, 5 = persona natural sin CPF y 6 = persona jurídica sin CNPJ);\n- **Código del cliente:** El número de posiciones varía conforme al tipo del cliente:\n  1. Para clientes persona física con CPF (tipo de cliente = 1), informar las 11 (once) posiciones del CPF;\n  2. Para clientes persona jurídica con CNPJ (tipo de cliente = 2), informar las 8 (ocho) posiciones iniciales del CNPJ;\n  3. Para los demás clientes (tipos de cliente 3, 4, 5 y 6), informar 14 (catorce) posiciones con complemento de ceros a la izquierda si la identificación tiene un tamaño inferior;\n- **Código del contrato:** 1 (una) hasta 40 (cuarenta) posiciones, sin complemento de caracteres.\n"
