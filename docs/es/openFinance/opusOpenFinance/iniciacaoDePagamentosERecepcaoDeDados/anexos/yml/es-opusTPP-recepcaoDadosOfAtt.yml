    VariableIncomesEnumTransactionsType:
      type: string
      description: |
        Tipo de movimiento en la visión de inversión: entrada o salida. En los casos de pago de dividendos, JCP y alquileres, queda convencionado que se considerará que el tipo de movimiento será salida.
      enum:
        - ENTRADA
        - SAIDA
      example: SAIDA
    VariableIncomesEnumTransactionsTransactionType:
      type: string
      description: |
        El campo debe clasificar el movimiento en uno de los tipos descritos: compra, venta, dividendos, JCP, alquileres, transferencia de custodia, transferencia de titularidad y otros.
        El transmisor debe clasificar los movimientos disponibles asociándolos a uno de los ítems del Enum listado en este campo.
        La opción OUTROS solo debe utilizarse para los casos en que efectivamente el movimiento compartido no pueda clasificarse como uno de los ítems de este Enum.
        La expresión "aluguéis" deberá utilizarse únicamente para informar los intereses/la remuneración pagados/recibidos por el cliente de los contratos de acciones alquiladas, siguiendo el mismo entendimiento de ENTRADA/SAÍDA de la expresión "dividendos".
      enum:
        - COMPRA
        - VENDA
        - DIVIDENDOS
        - JCP
        - ALUGUEIS
        - TRANSFERENCIA_CUSTODIA
        - TRANSFERENCIA_TITULARIDADE
        - OUTROS
      example: DIVIDENDOS
    VariableIncomesEnumTransactionsCurrentType:
      type: string
      description: |
        Tipo de movimiento en la visión de inversión: entrada o salida. En los casos de pago de dividendos, JCP y alquileres, queda convencionado que se considerará que el tipo de movimiento será salida.
      enum:
        - ENTRADA
        - SAIDA
      example: SAIDA
