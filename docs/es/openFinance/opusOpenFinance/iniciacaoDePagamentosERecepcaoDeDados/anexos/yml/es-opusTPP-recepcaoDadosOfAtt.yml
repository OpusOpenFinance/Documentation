    LoansInstalments:
      type: object
      description: Conjunto de información referente al plazo remanente y a las cuotas de una operación de crédito de préstamos
      required:
      - dueInstalments
      - pastDueInstalments
      - typeContractRemaining
      - typeNumberOfInstalments
      - paidInstalments
      properties:
        typeNumberOfInstalments:
          type: string
          description: Tipo de plazo total del contrato referente a la modalidad de crédito informada.
          enum:
          - DIA
          - SEMANA
          - MES
          - ANO
          - SEM_PRAZO_TOTAL
          example: MES
        totalNumberOfInstalments:
          type: number
          maximum: 999999999
          example: 130632
          description: "Plazo Total según el tipo (día, semana, mes, año) referente a la Modalidad de Crédito informada. Debe corresponder a la suma de `paidInstalments` + `pastDueInstalments` + `dueInstalments`.\n\n[Restricción] Obligatoriamente debe ser cumplimentado en caso de que el `typeNumberOfInstalments` sea diferente de `SEM_PRAZO_TOTAL`.\n"
        typeContractRemaining:
          type: string
          enum:
          - DIA
          - SEMANA
          - MES
          - ANO
          - SEM_PRAZO_REMANESCENTE
          description: "Tipo de plazo remanente del contrato referente a la modalidad de crédito informada.\n"
        contractRemainingNumber:
          type: number
          maximum: 999999999
          example: 14600
          description: "Plazo Remanente según el tipo (día, semana, mes, año) referente a la Modalidad de Crédito informada.\n\n[Restricción] Obligatoriamente debe ser cumplimentado en caso de que el typeContractRemaining sea diferente de SEM_PRAZO_REMANESCENTE.\n"
        paidInstalments:
          type: number
          description: Cantidad de cuotas pagadas. (En el caso de modalidades que no posean cuotas, el número de cuotas es igual a cero)
          maximum: 999999
          example: 73
        dueInstalments:
          type: number
          description: Cantidad de cuotas por vencer.(En el caso de modalidades que no posean cuotas, el número de cuotas es igual a cero)
          maximum: 999999
          example: 57
        pastDueInstalments:
          type: number
          description: Cantidad de cuotas vencidas. (En el caso de modalidades que no posean cuotas, el número de cuotas es igual a cero)
          maximum: 999999
          example: 73
        balloonPayments:
          type: array
          items:
            $ref: '#/components/schemas/LoansBalloonPayment'
          minItems: 1
          description: Lista que presenta las fechas de vencimiento y el valor de las cuotas no regulares del contrato de la modalidad de crédito consultada
    LoansMeta:
      type: object
      description: Metainformación referente a la API solicitada.
      required:
      - totalRecords
      - totalPages
      - requestDateTime
      properties:
        totalRecords:
          type: integer
          format: int32
          description: Número total de registros en el resultado
          example: 1
        totalPages:
          type: integer
          format: int32
          description: Número total de páginas en el resultado
          example: 1
        requestDateTime:
          description: Fecha y hora de la consulta, conforme a la especificación RFC-3339, formato UTC.
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
    LoansResponseLoansPayments:
      type: object
      required:
      - data
      - links
      - meta
      properties:
        data:
          $ref: '#/components/schemas/LoansPayments'
        links:
          $ref: '#/components/schemas/LoansLinksNonPaginated'
        meta:
          $ref: '#/components/schemas/LoansMetaNonPaginated'
    LoansEnumContractTaxType:
      type: string
      description: "\"Tipo de Tasa (ver  Enum)\n- NOMINAL (la tasa nominal es una tasa de interés en la que la unidad referencial no coincide con la unidad de tiempo de la capitalización. Ella siempre se proporciona en términos anuales, y sus períodos de capitalización pueden ser diarios, mensuales, trimestrales o semestrales. p.ej. Una tasa de 12% al año con capitalización mensual)\n- EFETIVA (Es la tasa de interés en la que la unidad referencial coincide con la unidad de tiempo de la capitalización. Como las unidades de medida de tiempo de la tasa de interés y de los períodos de capitalización son iguales, se usan ejemplos simples como 1% al mes, 60% al año)\"\n"
      enum:
      - NOMINAL
      - EFETIVA
      example: EFETIVA
    LoansBalloonPaymentAmount:
      type: object
      required:
      - amount
      - currency
      description: Valor monetario de la cuota no regular por vencer.
      properties:
        amount:
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: Valor monetario de la cuota no regular por vencer. Expresado en valor monetario con un mínimo de 2 y un máximo de 4 decimales.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          maxLength: 3
          description: Moneda referente al valor monetario, siguiendo el modelo ISO-4217.
          example: BRL
    LoansContract:
      type: object
      description: Conjunto de información referente a la identificación de la operación de crédito de préstamo
      required:
      - contractNumber
      - ipocCode
      - productName
      - productType
      - productSubType
      - contractDate
      - contractAmount
      - instalmentPeriodicity
      - CET
      - amortizationScheduled
      - interestRates
      - contractedFees
      - contractedFinanceCharges
      - productSubTypeCategory
      properties:
        contractNumber:
          type: string
          maxLength: 100
          minLength: 1
          pattern: ^[\w\W]{1,100}$
          example: '1324926521496'
          description: Número del contrato dado por la institución contratante.
        ipocCode:
          type: string
          maxLength: 67
          minLength: 22
          pattern: ^[\w\W]{22,67}$
          example: '92792126019929279212650822221989319252576'
          description: "Número estandarizado del contrato - IPOC (Identificación Estandarizada de la Operación de Crédito). Según el DOC 3040, compuesta por:\n- **CNPJ de la institución:** 8 (ocho) posiciones iniciales;\n- **Modalidad de la operación:** 4 (cuatro) posiciones;\n- **Tipo del cliente:** 1 (una) posición( 1 = persona natural - CPF, 2= persona jurídica – CNPJ, 3 = persona física en el exterior, 4 = persona jurídica en el exterior, 5 = persona natural sin CPF y 6 = persona jurídica sin CNPJ);\n- **Código del cliente:** El número de posiciones varía conforme al tipo del cliente:\n  1. Para clientes persona física con CPF (tipo de cliente = 1), informar las 11 (once) posiciones del CPF;\n  2. Para clientes persona jurídica con CNPJ (tipo de cliente = 2), informar las 8 (ocho) posiciones iniciales del CNPJ;\n  3. Para los demás clientes (tipos de cliente 3, 4, 5 y 6), informar 14 (catorce) posiciones con complemento de ceros a la izquierda si la identificación tiene un tamaño inferior;\n- **Código del contrato:** 1 (una) hasta 40 (cuarenta) posiciones, sin complemento de caracteres.\n"
        productName:
          type: string
          maxLength: 140
          pattern: ^[^\s](.*[^\s])?$
          example: Crédito Pessoal Consignado
          description: "Denominación/Identificación del nombre de la Modalidad de la Operación de Crédito divulgado al cliente\n"
        productType:
          $ref: '#/components/schemas/LoansEnumContractProductTypeLoans'
        productSubType:
          $ref: '#/components/schemas/LoansEnumContractProductSubTypeLoans'
        productSubTypeCategory:
          $ref: '#/components/schemas/LoansEnumContractProductSubTypeCategory'
        contractDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2018-01-05'
          description: "Fecha de contratación de la operación de crédito. Especificación RFC-3339. Para productos rotativos, productSubType `CHEQUE_ESPECIAL` y `CONTA_GARANTIDA`, en caso de que existan múltiples contrataciones del mismo producto, se debe enviar la última fecha disponible.\n"
        disbursementDates:
          type: array
          minItems: 1
          description: "Lista que presenta las Fechas de Desembolso del valor contratado.\n"
          items:
            type: string
            format: date
            maxLength: 10
            pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
            example: '2018-01-15'
            description: "Fecha del Desembolso del valor contratado. Especificación RFC-3339.\nEn el caso de una liberación de recursos realizada en D0 pero con referencia retroactiva realizada en D -1, contablemente la fecha correcta sería D -1.\n"
        settlementDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2018-01-15'
          description: "Fecha de liquidación de la operación. Fecha de cancelación del contrato para los casos en que no exista saldo deudor restante. En el caso de cancelación con saldo deudor, la fecha solo debe ser cumplimentada cuando el mismo sea liquidado.\n"
        contractAmount:
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: "Valor contratado de la operación. No incluir valores de tasas, tarifas, cargos y seguros. \nExpresado en valor monetario con un mínimo de 2 y un máximo de 4 posiciones decimales. \nEn los casos en que no exista este valor explícito en el contrato del producto, enviar como 0.00\n"
        currency:
          type: string
          maxLength: 3
          pattern: ^(\w{3}){1}$
          example: BRL
          description: "Moneda referente al valor de la garantía, según el modelo ISO-4217. p.ej. 'BRL'\nTodos los valores monetarios informados están representados con la moneda vigente de Brasil\n"
        dueDate:
          type: string
          format: date
          maxLength: 10
          minLength: 2
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2028-01-15'
          description: "Fecha del último vencimiento de la operación, siguiendo la especificación RFC-3339. La información debe ser enviada en caso de que exista. Especialmente para contratos repactados, se debe alterar la fecha a la del último vencimiento. Para productos rotativos, productSubType `CHEQUE_ESPECIAL` y `CONTA_GARANTIDA`, el campo representa la fecha de fin de la renovación para contratos activos o la fecha de cancelación para contratos cancelados o vencidos.\n"
        instalmentPeriodicity:
          $ref: '#/components/schemas/LoansEnumContractInstalmentPeriodicity'
        instalmentPeriodicityAdditionalInfo:
          type: string
          pattern: ^[^\s](.*[^\s])?$
          maxLength: 50
          example: Informações adicionais sobre periodicidade
          description: "Campo obligatorio para complementar la información relativa a la periodicidad de pago regular cuando se tenga la opción OUTROS.\n"
        firstInstalmentDueDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2018-02-15'
          description: "Fecha de vencimiento de la primera cuota del principal.\nLa información debe ser enviada en caso de que exista.\n"
        CET:
          type: string
          pattern: ^\d{1,6}\.\d{6}$
          format: double
          maxLength: 13
          minLength: 8
          example: '0.290000'
          description: "CET – Costo Efectivo Total debe ser expresado en forma de tasa porcentual anual e incorpora todos los cargos y gastos incidentes en las operaciones de crédito (tasa de interés, pero también tarifas, tributos, seguros y otros gastos cobrados).\n\nLa cumplimentación debe respetar las 6 posiciones decimales, aunque vengan cumplimentadas con ceros (representación de porcentaje p.ej.: 0.150000. Este valor representa 15%. El valor 1 representa 100%).\n\nPara el público PF (persona física) el campo es de envío obligatorio para contratos firmados a partir de 2008, conforme a la Resolución CMN 3.517. Para el público PJ (persona jurídica) el campo es de envío obligatorio para contratos firmados a partir de 2011, conforme a la Resolución CMN 3.909. El campo podrá ser cumplimentado con 0.00 en escenarios en los que la institución no tenga la información de CET (Costo efectivo total) solo para las excepciones listadas a continuación: \n\n- En contratos anteriores a 2008 (para el público PF); \n- En contratos anteriores a 2011 (para el público PJ); \n- Público PJ de mediano o gran porte. \n"
        hasInsuranceContracted:
          type: boolean
          description: "Campo que identifica si existe seguro contratado para el Préstamo, donde seguro contratado es `true` y no contratado es `false`.  \n\n[Restricción] Este campo es de envío obligatorio en caso de que el campo productSubTypeCategory sea cumplimentado con `CREDITO_PESSOAL_CLEAN` o `CONSIGNADO_SIAPE`.  \n"
          example: true
        amortizationScheduled:
          $ref: '#/components/schemas/LoansEnumContractAmortizationScheduled'
        amortizationScheduledAdditionalInfo:
          type: string
          pattern: ^[^\s](.*[^\s])?$
          maxLength: 200
          example: Informações complementares relativa à amortização do tipo 'OUTROS'
          description: "Campo obligatorio para complementar la información relativa a la amortización cuando se seleccione la opción OUTROS.\n"
        cnpjConsignor:
          type: string
          maxLength: 14
          pattern: ^[0-9A-Z]{12}[0-9]{2}$
          example: '60500998000135'
          description: "CNPJ del consignante (el CNPJ corresponde al registro alfanumérico de inscripción en el Cadastro de Pessoa Jurídica). \n\nSe debe tener únicamente la representación alfanumérica del CNPJ, sin máscara.\n\n[Restricción] Información adicional específica para cuando el `productSubType` sea igual a `CREDITO_PESSOAL_COM_CONSIGNACAO`. \nEste campo es de envío obligatorio solamente mientras exista vínculo (consignación activa). \nEn los casos de desconsignación, el campo puede ser omitido.\n"
        interestRates:
          type: array
          description: "Objeto que presenta el conjunto de informaciones necesarias para demostrar la composición de las tasas de interés remuneratorias de la Modalidad de crédito. En caso de que el contrato no posea tasas de interés, debe compartirse una lista vacía. En caso de que el contrato posea una tasa de interés con valor 0, debe compartirse un objeto con el valor 0 de forma explícita. Para contratos en renegociación, la tasa de préstamo compartida debe mantenerse como la tasa del contrato vigente, siendo alterada a la renegociada al final del proceso de renegociación. Para los productos CPC (campo `productSubTypeCategory` cumplimentado con `CREDITO_PESSOAL_CLEAN`) o Consignado Federal (campo `productSubTypeCategory` cumplimentado con `CONSIGNADO_SIAPE`) se debe contener obligatoriamente la tasa nominal y la tasa efectiva (campo taxPeriodicity) con periodicidad a.a. (al año), pudiendo adicionalmente contener, además de las tasas nominal y efectiva al año, otras con otra periodicidad.  \n"
          items:
            $ref: '#/components/schemas/LoansContractInterestRate'
          minItems: 0
        contractedFees:
          type: array
          description: Lista que presenta las informaciones de las tarifas pactadas en el contrato.
          items:
            $ref: '#/components/schemas/LoansContractedFee'
          minItems: 0
        contractedFinanceCharges:
          type: array
          description: Lista que presenta los cargos pactados en el contrato
          items:
            $ref: '#/components/schemas/LoansFinanceCharge'
          minItems: 0
        nextInstalmentAmount:
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: "Informa el valor nominal (corresponde al valor de la cuota en el vencimiento). Para contratos liquidados, retornar cero, siguiendo el pattern. \n[Restricción] Este campo es de envío obligatorio en caso de que el campo `productSubTypeCategory` sea cumplimentado con `CREDITO_PESSOAL_CLEAN` o `CONSIGNADO_SIAPE` en el endpoint /contracts/{contractId}.  \n"
    LoansBalloonPayment:
      type: object
      description: Lista que presenta las fechas de vencimiento y el valor de las cuotas no regulares  del contrato de la modalidad de crédito consultada.
      required:
      - dueDate
      - amount
      properties:
        dueDate:
          type: string
          maxLength: 10
          minLength: 2
          format: date
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2021-05-21'
          description: "'Fecha de vencimiento de la cuota no regular  por vencer del contrato de la modalidad de crédito consultada, conforme a la especificación RFC-3339. p.ej. 2014-03-19'\n"
        amount:
          $ref: '#/components/schemas/LoansBalloonPaymentAmount'
    LoansEnumContractCalculation:
      type: string
      description: Base de cálculo
      enum:
      - 21/252
      - 30/360
      - 30/365
      example: 21/252
