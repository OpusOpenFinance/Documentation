      example: NOTAS_PROMISSORIAS_OUTROS_DIREITOS_CREDITO
    UnarrangedAccountsOverdraftEnumWarrantyType:
      type: string
      description: 'Denominación/Identificación del tipo de la garantía que avala la Modalidad de la Operación de Crédito contratada  (Doc 3040, Anexo 12)'
      enum:
        - CESSAO_DIREITOS_CREDITORIOS
        - CAUCAO
        - PENHOR
        - ALIENACAO_FIDUCIARIA
        - HIPOTECA
        - OPERACOES_GARANTIDAS_PELO_GOVERNO
        - OUTRAS_GARANTIAS_NAO_FIDEJUSSORIAS
        - SEGUROS_ASSEMELHADOS
        - GARANTIA_FIDEJUSSORIA
        - BENS_ARRENDADOS
        - GARANTIAS_INTERNACIONAIS
        - OPERACOES_GARANTIDAS_OUTRAS_ENTIDADES
        - ACORDOS_COMPENSACAO
      example: CESSAO_DIREITOS_CREDITORIOS
    UnarrangedAccountsOverdraftChargeType:
      type: string
      description: Tipo de cargo pactado en el contrato.
      enum:
        - JUROS_REMUNERATORIOS_POR_ATRASO
        - MULTA_ATRASO_PAGAMENTO
        - JUROS_MORA_ATRASO
        - IOF_CONTRATACAO
        - IOF_POR_ATRASO
        - SEM_ENCARGO
        - OUTROS
      example: JUROS_REMUNERATORIOS_POR_ATRASO
    UnarrangedAccountsOverdraftFeeOverParcel:
      type: object
      required:
        - feeName
        - feeCode
        - feeAmount
      properties:
        feeName:
          type: string
          description: |
            Denominación de la Tarifa pactada.
          maxLength: 140
          pattern: '^[^\s](.*[^\s])?$'
          example: Saque a descoberto
        feeCode:
          type: string
          description: |
            Sigla identificadora de la tarifa pactada.
          maxLength: 140
          pattern: '^[^\s](.*[^\s])?$'
          example: Saque descoberto
        feeAmount:
          type: string
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '100000.0400'
          description: |
            Valor monetario de la tarifa pactada en el contrato.

            Expresado en valor monetario con un mínimo de 2 y un máximo de 4 posiciones decimales.
    UnarrangedAccountsOverdraftFinanceCharge:
      type: object
      required:
        - chargeType
      properties:
        chargeType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftChargeType'
        chargeAdditionalInfo:
          type: string
          pattern: '^[^\s](.*[^\s])?$'
          example: Informações adicionais sobre encargos.
          description: |
            Campo para informaciones adicionales.

            [Restricción] Obligatorio si se selecciona la opción 'OUTROS' en Tipo de cargo pactado en el contrato.
        chargeRate:
          type: string
          format: double
          pattern: '^\d{1}\.\d{6}$'
          maxLength: 8
          minLength: 8
          description: |
            Representa el valor del cargo en porcentaje pactado en el contrato.

            La cumplimentación debe respetar las 6 posiciones decimales, aunque vengan cumplimentadas con ceros(representación de porcentaje p.ej.: 0.150000. Este valor representa 15%. El valor 1 representa 100%).
          example: '0.071200'
    UnarrangedAccountsOverdraftInstalmentsData:
      type: object
      description: Conjunto de informaciones referentes al plazo remanente y a las cuotas de una operación de crédito de adelanto a depositante
      required:
        - dueInstalments
        - pastDueInstalments
        - typeContractRemaining
        - typeNumberOfInstalments
        - paidInstalments
      properties:
        typeNumberOfInstalments:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumTypeNumberOfInstalments'
        totalNumberOfInstalments:
          type: number
          maximum: 999999
          example: 130632
          description: |
            Plazo Total según el tipo (día, semana, mes, año) referente a la Modalidad de Crédito informada.

            [Restricción] Obligatoriamente debe ser cumplimentado en caso de que typeNumberOfInstalments sea diferente de SEM_PRAZO_TOTAL.
        typeContractRemaining:
          type: string
          enum:
            - DIA
            - SEMANA
            - MES
            - ANO
            - SEM_PRAZO_REMANESCENTE
          description: |
            Tipo de plazo remanente del contrato referente a la modalidad de crédito informada.
        contractRemainingNumber:
          type: number
          maximum: 999999
          description: |
            Plazo Remanente según el tipo (día, semana, mes, año) referente a la Modalidad de Crédito informada.

            [Restricción] Obligatoriamente debe ser cumplimentado en caso de que el typeContractRemaining sea diferente de SEM_PRAZO_REMANESCENTE.
          example: 80
        paidInstalments:
          type: number
          description: 'Cantidad de cuotas pagadas. (En el caso de modalidades que no posean cuotas, el número de cuotas es igual a cero)'
          maximum: 999999
          example: 73
        dueInstalments:
          type: number
          maximum: 999999
          description: 'Cantidad de cuotas por vencer.(En el caso de modalidades que no posean cuotas, el número de cuotas es igual a cero)'
          example: 57
        pastDueInstalments:
          type: number
          maximum: 999999
          description: 'Cantidad de cuotas vencidas. (En el caso de modalidades que no posean cuotas, el número de cuotas es igual a cero)'
          example: 73
        balloonPayments:
          type: array
          items:
            $ref: '#/components/schemas/UnarrangedAccountsOverdraftBalloonPayment'
          minItems: 1
          description: Lista que presenta las fechas de vencimiento y el valor de las cuotas no regulares del contrato de la modalidad de crédito consultada
    UnarrangedAccountsOverdraftPaymentsData:
      type: object
      description: Conjunto de informaciones referentes a los pagos realizados de una operación de crédito de adelanto a depositantes
      required:
        - contractOutstandingBalance
        - releases
      properties:
        paidInstalments:
          type: number
          maximum: 999
          example: 73
          description: Cantidad total de cuotas pagadas del contrato referente a la Modalidad de Crédito informada.
        contractOutstandingBalance:
          type: string
          minLength: 4
          maxLength: 21
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          example: '100000.0400'
          description: Valor necesario para que el cliente liquide la deuda, o sea, este campo debe ser cumplimentado con el saldo deudor actualizado descrito en el DDC (Documento Descritivo de Crédito).
        releases:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/UnarrangedAccountsOverdraftReleases'
          description: Lista de los pagos realizados en el período
    UnarrangedAccountsOverdraftReleases:
      type: object
      description: Lista de los pagos realizados en el período
      required:
        - paymentId
        - isOverParcelPayment
        - paidDate
        - currency
        - paidAmount
      properties:
        paymentId:
          type: string
          maxLength: 100
          minLength: 1
          example: XlthLXpBLVowLTldW2EtekEtWjAtOVwtXXswLDk5fSQ
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          description: Código o identificador único proporcionado por la institución para representar el pago individual.
        isOverParcelPayment:
          type: boolean
          example: true
          description: Identifica si es un pago pactado (false) o suelto (true).
        instalmentId:
          type: string
          maxLength: 100
          minLength: 1
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: WGx0aExYcEJMVm93TFRsZFcyRXRla0V0V2pBdE9Wd3RYWH
          description: |
            Identificador de cuota, de responsabilidad de cada institución transmisora.

            [Restricción] Información de envío obligatorio cuando isOverParcelPayment tenga el valor FALSE.
        paidDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: 'Fecha efectiva del pago referente al contrato de la modalidad de crédito consultada, conforme a la especificación [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339). p.ej. 2014-03-19'
        currency:
          type: string
          maxLength: 3
          pattern: '^(\w{3}){1}$'
          example: BRL
          description: |
            Moneda referente al valor monetario informado, según el modelo ISO-4217. p.ej. 'BRL'.
            Todos los valores monetarios informados están representados con la moneda vigente de Brasil.
        paidAmount:
          type: string
          maxLength: 21
          minLength: 4
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          example: '100000.0400'
          description: |
            Valor del pago referente al  contrato de la modalidad de crédito consultada.
            Expresado en valor monetario con un mínimo de 2 y un máximo de 4 posiciones decimales.
        overParcel:
          type: object
          description: |
            Objeto de las tarifas y cargos que fueron pagados fuera de la cuota.

            [Restricción] La información debe ser enviada en caso de que exista.
          required:
            - fees
            - charges
          properties:
            fees:
              type: array
              minItems: 0
              items:
                $ref: '#/components/schemas/UnarrangedAccountsOverdraftFeeOverParcel'
              description: 'Lista de las tarifas que fueron pagadas fuera de la cuota, solo para pago suelto.'
            charges:
              type: array
              minItems: 0
              items:
                $ref: '#/components/schemas/UnarrangedAccountsOverdraftChargeOverParcel'
              description: Lista de los cargos que fueron pagados fuera de la cuota.
    UnarrangedAccountsOverdraftContractedFee:
      type: object
      required:
        - feeName
        - feeCode
        - feeChargeType
        - feeCharge
      properties:
        feeName:
          type: string
          maxLength: 140
          pattern: '^[^\s](.*[^\s])?$'
          description: Denominación de la Tarifa pactada
          example: Excesso em Conta
        feeCode:
          type: string
          maxLength: 140
          pattern: '^[^\s](.*[^\s])?$'
          description: Sigla identificadora de la tarifa pactada
          example: EXCESSO_CONTA
        feeChargeType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumContractFeeChargeType'
        feeCharge:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumContractFeeCharge'
        feeAmount:
          type: string
          format: double
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: |
            Valor monetario de la tarifa pactada en el contrato.

            [Restricción] Cumplimentación obligatoria cuando la forma de cobro sea diferente de Porcentual.
        feeRate:
          type: string
          pattern: '^\d{1}\.\d{6}$'
          format: double
          maxLength: 8
          minLength: 8
          description: |
            Es el valor de la tarifa en porcentaje pactada en el contrato.

            [Restricción] Cumplimentación obligatoria cuando la forma de cobro sea Porcentual.
          example: '0.062000'
    UnarrangedAccountsOverdraftContractedWarranty:
      type: object
      description: Conjunto de informaciones referentes a las garantías que avalan la operación de crédito contratada
      required:
        - currency
        - warrantyAmount
        - warrantyType
        - warrantySubType
      properties:
        currency:
          type: string
          pattern: '^(\w{3}){1}$'
          maxLength: 3
          description: 'Moneda referente al valor de la garantía, según el modelo ISO-4217. p.ej. ''BRL''. Todos los valores monetarios informados están representados con la moneda vigente de Brasil'
          example: BRL
        warrantyType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumWarrantyType'
        warrantySubType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumWarrantySubType'
        warrantyAmount:
          description: |
            Valor original de la garantía. Expresado en valor monetario con un mínimo de 2 y un máximo de 4 posiciones decimales.

            [Restricción] Para los casos en que warrantyType sea igual a "GARANTIA_FIDEJUSSORIA" el valor de la garantía corresponde a un porcentaje del total garantizado.
            De esta forma, los casos de garantía fideyusoria para los cuales no es posible determinar un valor monetario para la garantía deben ser cumplimentados con 0.00.
          type: string
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '100000.0400'
    UnarrangedAccountsOverdraftBalloonPayment:
      type: object
      description: Lista que presenta las fechas de vencimiento y el valor de las cuotas no regulares  del contrato de la modalidad de crédito consultada.
      required:
        - dueDate
        - amount
      properties:
        dueDate:
          type: string
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          description: 'Fecha de vencimiento de la cuota no regular  por vencer del contrato de la modalidad de crédito consultada, conforme a la especificación [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339). p.ej. 2014-03-19'
          maxLength: 10
          example: '2020-01-10'
        amount:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftBalloonPaymentAmount'
    UnarrangedAccountsOverdraftChargeOverParcel:
      type: object
      description: Lista de los cargos que fueron pagados fuera de la cuota.
      required:
        - chargeType
        - chargeAmount
      properties:
        chargeType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftChargeType'
        chargeAdditionalInfo:
          type: string
          pattern: '^[^\s](.*[^\s])?$'
          maxLength: 140
          example: Informações adicionais
          description: |
            Campo libre para la cumplimentación de las informaciones adicionales referentes al cargo.
            [Restricción] Obligatorio cuando chargeType sea igual a 'OUTROS'.
        chargeAmount:
          description: Valor del pago del cargo pagado fuera de la cuota. Expresado en valor monetario con un mínimo de 2 y un máximo de 4 decimales.
          type: string
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '100000.0400'
    UnarrangedAccountsOverdraftContractData:
      type: object
      description: Conjunto de informaciones referentes a la identificación de la operación de crédito de adelanto a depositantes
      required:
        - contractNumber
        - ipocCode
        - productName
        - productType
        - productSubType
        - contractDate
        - contractAmount
        - instalmentPeriodicity
        - amortizationScheduled
        - interestRates
        - contractedFees
        - contractedFinanceCharges
      properties:
        contractNumber:
          type: string
          maxLength: 100
          minLength: 1
          pattern: '^[\w\W]{1,100}$'
          example: '1324926521496'
          description: Número del contrato dado por la institución contratante.
        ipocCode:
          type: string
          maxLength: 67
          minLength: 22
          pattern: '^[\w\W]{22,67}$'
          example: '92792126019929279212650822221989319252576'
          description: |
            Número estandarizado del contrato - IPOC (Identificación Estandarizada de la Operación de Crédito). Según el DOC 3040, compuesta por:
            - **CNPJ de la institución:** 8 (ocho) posiciones iniciales;
            - **Modalidad de la operación:** 4 (cuatro) posiciones;
            - **Tipo del cliente:** 1 (una) posición( 1 = persona natural - CPF, 2= persona jurídica – CNPJ, 3 = persona física en el exterior, 4 = persona jurídica en el exterior, 5 = persona natural sin CPF y 6 = persona jurídica sin CNPJ);
            - **Código del cliente:** El número de posiciones varía conforme al tipo del cliente:
              1. Para clientes persona física con CPF (tipo de cliente = 1), informar las 11 (once) posiciones del CPF;
              2. Para clientes persona jurídica con CNPJ (tipo de cliente = 2), informar las 8 (ocho) posiciones iniciales del CNPJ;
              3. Para los demás clientes (tipos de cliente 3, 4, 5 y 6), informar 14 (catorce) posiciones con complemento de ceros a la izquierda si la identificación tiene un tamaño inferior;
            - **Código del contrato:** 1 (una) hasta 40 (cuarenta) posiciones, sin complemento de caracteres.
        productName:
          type: string
          maxLength: 140
          pattern: '^[^\s](.*[^\s])?$'
          example: AD
          description: |
            Denominación/Identificación del nombre de la Modalidad de la Operación de Crédito divulgado al cliente
        productType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftProductType'
        productSubType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftProductSubType'
        contractDate:
          description: |
            Fecha de contratación de la operación de crédito. Especificación [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339).
            Para operaciones en que el adelanto a depositantes está disponible para el cliente desde la apertura de la cuenta, utilizar la fecha de apertura de la cuenta como fecha de contratación.
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-01-05'
        disbursementDates:
          type: array
          minItems: 1
          description: |
            Lista que presenta las Fechas de Desembolso del valor contratado.
          items:
            type: string
            format: date
            maxLength: 10
            pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
            example: '2018-01-15'
            description: |
              Fecha del Desembolso del valor contratado. Especificación [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339).
              En el caso de una liberación de recursos realizada en D0 pero con referencia retroactiva realizada en D -1, contablemente la fecha correcta sería D -1.
        settlementDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-01-15'
          description: |
            Fecha de liquidación de la operación.
        contractAmount:
          description: Valor contratado de la operación. Expresado en valor monetario con un mínimo de 2 y un máximo de 4 posiciones decimales. En los casos en que no exista este valor explícito en el contrato del producto, enviar como 0.00.
          type: string
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '100000.0400'
        currency:
          type: string
          pattern: '^(\w{3}){1}$'
          maxLength: 3
          description: |
            Moneda referente al valor de la garantía, según el modelo ISO-4217. p.ej. 'BRL'
            Todos los valores monetarios informados están representados con la moneda vigente de Brasil
          example: BRL
        dueDate:
          type: string
          format: date
          maxLength: 10
          minLength: 2
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2028-01-15'
          description: |
            Fecha de vencimiento Final de la operación. Especificación [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339).
            No aplicable para contratos activos / Informar la fecha de cancelación para contratos cancelados.
        instalmentPeriodicity:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumContractInstalmentPeriodicity'
        instalmentPeriodicityAdditionalInfo:
          type: string
          pattern: '[\w\W\s]*'
          maxLength: 50
          example: Informações adicionais sobre periodicidade
          description: |
            Campo para complementar la información relativa a la periodicidad de pago regular.

            [Restricción] Obligatorio cuando el campo `instalmentPeriodicity` sea igual a `OUTROS`.
        firstInstalmentDueDate:
          type: string
          format: date
          maxLength: 10
          minLength: 2
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
          description: |
            Fecha de vencimiento de la primera cuota del principal
        CET:
          type: string
          pattern: '^\d{1,6}\.\d{6}$'
          format: double
          description: |
            CET – Costo Efectivo Total debe ser expresado en forma de tasa porcentual anual e incorpora todos los cargos y gastos incidentes en las operaciones de crédito (tasa de interés, pero también tarifas, tributos, seguros y otros gastos cobrados).

            La cumplimentación debe respetar las 6 posiciones decimales, aunque vengan cumplimentadas con ceros (representación de porcentaje p.ej.: 0.150000. Este valor representa 15%. El valor 1 representa 100%).
          maxLength: 13
          minLength: 8
          example: '0.290000'
        amortizationScheduled:
          type: string
          description: |
            Sistema de amortización (Véase Enum):
            - SAC (Sistema de Amortización Constante) - Es aquel en el que el valor de la amortización permanece igual hasta el final. Los intereses cobrados sobre el fraccionamiento no entran en esta cuenta.
            - PRICE (Sistema Francés de Amortización) - Las cuotas son fijas del inicio al fin del contrato. O sea, todas las cuotas tendrán el mismo valor, desde la primera hasta la última. En los primeros pagos, la mayor parte del valor de la cuota corresponde a los intereses. A lo largo del tiempo, la tasa de interés va decreciendo. Como el valor de la cuota es fijo, con el paso de las cuotas, el valor de amortización va aumentando.
            - SAM (Sistema de Amortización Mixto) - Cada cuota (pago) es la media aritmética de las cuotas respectivas en el Sistema Price y en el Sistema de Amortización Constante (SAC).
            - SIN SISTEMA DE AMORTIZACIÓN
          enum:
            - SAC
            - PRICE
            - SAM
            - SEM_SISTEMA_AMORTIZACAO
            - OUTROS
          example: SAC
        amortizationScheduledAdditionalInfo:
          type: string
          pattern: '[\w\W\s]*'
          maxLength: 200
          example: Informações complementares relativa à amortização do tipo 'OUTROS'
          description: |
            Campo para complementar la información relativa a la amortización.

            [Restricción] Obligatorio cuando el campo `amortizationScheduled` sea igual a `OUTROS`.
        interestRates:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/UnarrangedAccountsOverdraftContractInterestRate'
          description: |
            Objeto que presenta el conjunto de informaciones necesarias para demostrar la composición de las tasas de interés remuneratorias de la Modalidad de crédito.
            En caso de que el contrato no posea tasas de interés, debe compartirse una lista vacía. En caso de que el contrato posea una tasa de interés con valor 0, debe compartirse un objeto con el valor 0 de forma explícita.
        contractedFees:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/UnarrangedAccountsOverdraftContractedFee'
          description: Lista que presenta las informaciones de las tarifas pactadas en el contrato.
        contractedFinanceCharges:
          type: array
          minItems: 0
          description: Lista que presenta los cargos pactados en el contrato
          items:
            $ref: '#/components/schemas/UnarrangedAccountsOverdraftFinanceCharge'
        hasInsuranceContracted:
          type: boolean
          description: Campo que identifica si existe seguro contratado para el Adelanto a Depositante, donde seguro contratado es true y no contratado es false. El no envío del campo significa que la institución no ofrece este producto.
    UnarrangedAccountsOverdraftContractInterestRate:
      type: object
      description: Objeto que presenta el conjunto de informaciones necesarias para demostrar la composición de las tasas de interés remuneratorias de la Modalidad de crédito
      required:
        - taxType
        - interestRateType
        - taxPeriodicity
        - calculation
        - referentialRateIndexerType
      properties:
        taxType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumContractTaxType'
        interestRateType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumContractInterestRateType'
        taxPeriodicity:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumContractTaxPeriodicity'
        calculation:
          type: string
          description: Base de cálculo
          enum:
            - 21/252
            - 30/360
            - 30/365
          example: 21/252
        referentialRateIndexerType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumContractReferentialRateIndexerType'
        referentialRateIndexerSubType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumContractReferentialRateIndexerSubType'
        referentialRateIndexerAdditionalInfo:
          type: string
          maxLength: 140
          pattern: '^[^\s](.*[^\s])?$'
          example: Informações adicionais
          description: |
            Campo libre para complementar la información relativa al Tipo de tasa referencial o indexador.
            [Restricción] Obligatorio para complementar la información relativa al Tipo de tasa referencial o indexador, cuando se seleccione el tipo o subtipo OUTRO.
        preFixedRate:
          type: string
          format: double
          pattern: '^\d{1,2}\.\d{6}$'
          maxLength: 9
          minLength: 8
          description: |
            Tasa prefijada aplicada sobre el contrato de la modalidad de crédito. p.ej. 0.014500. La cumplimentación debe respetar las 6 posiciones decimales, aunque vengan cumplimentadas con ceros(representación de porcentaje p.ej.: 0.150000. Este valor representa 15%. El valor 1 representa 100%).

            [Restricción] Este campo es de envío obligatorio en caso de que no sea enviado el campo `postFixedRate`.
          example: '0.600000'
        postFixedRate:
          type: string
          format: double
          pattern: '^\d{1,2}\.\d{6}$'
          maxLength: 9
          minLength: 8
          description: |
            Tasa posfijada aplicada bajo el contrato de la modalidad de crédito. p.ej. 0.0045. La cumplimentación debe respetar las 6 posiciones decimales, aunque vengan rellenas con ceros (representación de porcentaje p.ej.: 0.1500. Este valor representa el 15%. El valor 1 representa el 100%).

            [Restricción] Este campo es de envío obligatorio en caso de que no se envíe el campo `preFixedRate`.
          example: '0.550000'
        additionalInfo:
          type: string
          maxLength: 1200
          pattern: '^[^\s](.*[^\s])?$'
          example: Informações adicionais
          description: |
            Texto con información adicional sobre la composición de las tasas de interés pactadas.

            [Restricción] En caso de que la institución posea la información para compartir, esta deberá ser informada.
    UnarrangedAccountsOverdraftBalloonPaymentAmount:
      type: object
      required:
        - amount
        - currency
      description: Valor monetario de la cuota no regular por vencer. Expresado en valor monetario con un mínimo de 2 y un máximo de 4 decimales.
      properties:
        amount:
          type: string
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '100000.0400'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
          example: BRL
    UnarrangedAccountsOverdraftProductType:
      type: string
      description: |
        "Tipo de la modalidad de crédito contratada, conforme a la Circular 4.015 y la descripción del DOC3040 del SCR). (Véase Enum)
        Adelanto a depositantes, Derechos crediticios descontados Préstamos,  Financiamientos, Financiamientos rurales  y Financiamientos inmobiliarios"
      enum:
        - ADIANTAMENTO_A_DEPOSITANTES
      example: ADIANTAMENTO_A_DEPOSITANTES
    UnarrangedAccountsOverdraftProductSubType:
      type: string
      description: |
        "Subtipo de las modalidades de crédito contratadas, conforme a la  Circular 4.015 y la descripción del DOC3040 del SCR). (Véase Enum)
        Adelanto a depositantes
      enum:
        - ADIANTAMENTO_A_DEPOSITANTES
      example: ADIANTAMENTO_A_DEPOSITANTES
    UnarrangedAccountsOverdraftEnumTypeNumberOfInstalments:
      type: string
      description: Tipo de plazo total del contrato referente a la modalidad de crédito informada.
      enum:
        - DIA
        - SEMANA
        - MES
        - ANO
        - SEM_PRAZO_TOTAL
      example: MES
    UnarrangedAccountsOverdraftLinks:
      type: object
      description: Referencias a otros recursos de la API solicitada.
      required:
        - self
      properties:
        self:
          type: string
          format: url
          maxLength: 4048
          description: URI completo que generó la respuesta actual.
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        first:
          type: string
          format: url
          maxLength: 4048
          description: URI de la primera página que originó esta lista de resultados. Restricción - Obligatorio cuando no sea la primera página de la respuesta
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        prev:
          type: string
          format: url
          maxLength: 4048
          description: "URI de la página anterior de esta lista de resultados. Restricción - Obligatorio cuando no sea la primera página de la respuesta"
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        next:
          type: string
          format: url
          maxLength: 4048
          description: URI de la página siguiente de esta lista de resultados. Restricción - Obligatorio cuando no sea la última página de la respuesta
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        last:
          type: string
          format: url
          maxLength: 4048
          description: URI de la última página de esta lista de resultados. Restricción - Obligatorio cuando no sea la última página de la respuesta
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
    UnarrangedAccountsOverdraftLinksSingle:
      type: object
      description: Referencias a otros recursos de la API solicitada.
      required:
        - self
      properties:
        self:
          type: string
          format: url
          maxLength: 4048
          description: URI completo que generó la respuesta actual.
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
    UnarrangedAccountsOverdraftMeta:
      type: object
      description: Metainformación referente a la API solicitada.
      required:
        - totalRecords
        - totalPages
        - requestDateTime
      properties:
        totalRecords:
          type: integer
          format: int32
          description: Número total de registros en el resultado
          example: 1
        totalPages:
          type: integer
          format: int32
          description: Número total de páginas en el resultado
          example: 1
        requestDateTime:
          description: 'Fecha y hora de la consulta, conforme a la especificación [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339), formato UTC.'
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
    UnarrangedAccountsOverdraftMetaSingle:
      type: object
      description: Metainformación referente a la API solicitada.
      required:
        - requestDateTime
      properties:
        requestDateTime:
          description: 'Fecha y hora de la consulta, conforme a la especificación [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339), formato UTC.'
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
