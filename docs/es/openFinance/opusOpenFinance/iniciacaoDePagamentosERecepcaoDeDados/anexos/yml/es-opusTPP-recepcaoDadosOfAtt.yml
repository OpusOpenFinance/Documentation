          maxLength: 100
          minLength: 1
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          description: Un identificador único e inmutable usado para identificar el contrato de una operación de crédito. Este identificador no tiene significado para el tomador del crédito
          example: xcjklompowsa279212650822221989319aadrtjk
        brandName:
          type: string
          maxLength: 80
          pattern: '^[^\s](.*[^\s])?$'
          description: |
            Nombre de la Marca reportada por el participante en Open Finance. Se recomienda utilizar, siempre que sea posible, el mismo nombre de marca atribuido en el campo del directorio Customer Friendly Server Name (Authorisation Server).
          example: Organização A
        companyCnpj:
          type: string
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          description: |
            Registro completo del CNPJ de la institución responsable del Registro - el CNPJ corresponde a la representación alfanumérica de la inscripción en el Cadastro de Pessoa Jurídica.
            Se deben tener únicamente los caracteres del CNPJ, sin máscara.
          example: '60500998000144'
        productType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftProductType'
        productSubType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftProductSubType'
        ipocCode:
          type: string
          maxLength: 67
          minLength: 22
          pattern: '^[\w\W]{22,67}$'
          description: |
            "Número estandarizado del contrato - IPOC (Identificação Padronizada da Operação de Crédito). Según el DOC 3040, compuesto por:
            - **CNPJ de la institución:** 8 (ocho) posiciones iniciales;
            - **Modalidad de la operación:** 4 (cuatro) posiciones;
            - **Tipo del cliente:** 1 (una) posición( 1 = persona natural - CPF, 2= persona jurídica – CNPJ, 3 = persona física en el exterior, 4 = persona jurídica en el exterior, 5 = persona natural sin CPF y 6 = persona jurídica sin CNPJ);
            - **Código del cliente:** El número de posiciones varía conforme el tipo del cliente:
              1. Para clientes persona física con CPF (tipo de cliente = 1), informar las 11 (once) posiciones del CPF;
              2. Para clientes persona jurídica con CNPJ (tipo de cliente = 2), informar las 8 (ocho) posiciones iniciales del CNPJ;
              3. Para los demás clientes (tipos de cliente 3, 4, 5 y 6), informar 14 (catorce) posiciones con complemento de ceros a la izquierda si la identificación tuviera tamaño inferior;
            - **Código del contrato:** 1 (una) hasta 40 (cuarenta) posiciones, sin complemento de caracteres."
          example: '92792126019929279212650822221989319252576'
    UnarrangedAccountsOverdraftEnumContractFeeCharge:
      type: string
      description: |
        "Forma de cobro relativa a la tarifa pactada en el contrato. (Véase Enum)
        - Mínimo
        - Máximo
        - Fijo
        - Porcentual"
      enum:
        - MINIMO
        - MAXIMO
        - FIXO
        - PERCENTUAL
      example: MINIMO
    UnarrangedAccountsOverdraftEnumContractFeeChargeType:
      type: string
      description: Tipo de cobro para la tarifa pactada en el contrato.
      enum:
        - UNICA
        - POR_PARCELA
      example: UNICA
    UnarrangedAccountsOverdraftEnumContractInstalmentPeriodicity:
      type: string
      description: |
        "Información relativa a la periodicidad regular de las cuotas. (Véase Enum)
        sin periodicidad regular, semanal, quincenal, mensual, bimestral, trimestral, semestral, anual"
      enum:
        - SEM_PERIODICIDADE_REGULAR
        - SEMANAL
        - QUINZENAL
        - MENSAL
        - BIMESTRAL
        - TRIMESTRAL
        - SEMESTRAL
        - ANUAL
        - OUTROS
      example: SEMANAL
    UnarrangedAccountsOverdraftEnumContractInterestRateType:
      type: string
      description: |
        "Tipo de Intereses  (véase  Enum)
        - SIMPLES (aplicada/cobrada siempre sobre el capital inicial, que es el valor prestado/invertido. No hay cobro de intereses sobre intereses acumulados en el(los) período(s) anterior(es). Ejemplo: en un préstamo de R$1.000, con tasa de interés simple de 8% a.a., con duración de 2 años, el total de intereses será R$80 en el primer año y R$ 80 en el segundo año. Al final del contrato, el tomador devolverá el principal y los intereses simples de cada año: R$1.000+R$80+R$80=R$1.160)
        - COMPOSTO (para cada período del contrato (diario, mensual, anual etc.), hay un “nuevo capital” para el cobro de la tasa de interés contratada. Ese “nuevo capital” es la suma del capital y del interés cobrado en el período anterior. Ejemplo: en un préstamo de R$1.000, con tasa de interés compuesta de 8% a.a., con duración de 2 años, el total de intereses será R$80 en el primer año. En el segundo año, los intereses serán sumados al capital (R$1.000 + R$ 80 = R$ 1.080), resultando en intereses de R$ 86 (8% de R$ 1.080))"
      enum:
        - SIMPLES
        - COMPOSTO
      example: SIMPLES
    UnarrangedAccountsOverdraftEnumContractReferentialRateIndexerSubType:
      type: string
      description: |
        "Subtipos de tasas referenciales o indexadores, conforme al Anexo 5: Tasa referencial o Indexador (Indx), del Documento 3040"
      enum:
        - SEM_SUB_TIPO_INDEXADOR
        - PRE_FIXADO
        - TR_TBF
        - TJLP
        - LIBOR
        - TLP
        - OUTRAS_TAXAS_POS_FIXADAS
        - CDI
        - SELIC
        - OUTRAS_TAXAS_FLUTUANTES
        - IGPM
        - IPCA
        - IPCC
        - OUTROS_INDICES_PRECO
        - TCR_PRE
        - TCR_POS
        - TRFC_PRE
        - TRFC_POS
        - OUTROS_INDEXADORES
      example: TJLP
    UnarrangedAccountsOverdraftEnumContractReferentialRateIndexerType:
      type: string
      description: |
        "Tipos de tasas referenciales o indexadores, conforme al Anexo 5: Tasa referencial o Indexador (Indx), del Documento 3040"
      enum:
        - SEM_TIPO_INDEXADOR
        - PRE_FIXADO
        - POS_FIXADO
        - FLUTUANTES
        - INDICES_PRECOS
        - CREDITO_RURAL
        - OUTROS_INDEXADORES
      example: PRE_FIXADO
    UnarrangedAccountsOverdraftEnumContractTaxPeriodicity:
      type: string
      description: |
        "Periodicidad de la tasa. (Véase  Enum)
        a.m - al mes
        a.a. - al año"
      enum:
        - AM
        - AA
      example: AA
    UnarrangedAccountsOverdraftEnumContractTaxType:
      type: string
      description: |
        "Tipo de Tasa (ver  Enum)
        - NOMINAL (la tasa nominal es una tasa de interés en la que la unidad referencial no coincide con la unidad de tiempo de la capitalización. Ella siempre se proporciona en términos anuales, y sus períodos de capitalización pueden ser diarios, mensuales, trimestrales o semestrales. p.ej. Una tasa de 12% al año con capitalización mensual)
        - EFETIVA (Es la tasa de interés en la que la unidad referencial coincide con la unidad de tiempo de la capitalización. Como las unidades de medida de tiempo de la tasa de interés y de los períodos de capitalización son iguales, se usan ejemplos simples como 1% al mes, 60% al año)"
      enum:
        - NOMINAL
        - EFETIVA
      example: EFETIVA
    UnarrangedAccountsOverdraftEnumWarrantySubType:
      type: string
      description: |
        Denominación/Identificación del subtipo de la garantía que avala la Modalidad de la Operación de Crédito contratada (Doc 3040, Anexo 12).
      enum:
        - ACOES_DEBENTURES
        - ACORDOS_COMPENSACAO_LIQUIDACAO_OBRIGACOES
        - APLICACOES_FINANCEIRAS_RENDA_FIXA
