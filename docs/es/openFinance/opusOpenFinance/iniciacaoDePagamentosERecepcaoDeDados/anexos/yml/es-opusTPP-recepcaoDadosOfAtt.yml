    ExchangesResponseOperationList:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/ExchangesProductList'
        links:
          $ref: '#/components/schemas/ExchangesLinks'
        meta:
          $ref: '#/components/schemas/ExchangesMeta'
      additionalProperties: false
    ExchangesProductList:
      type: object
      description: Lista de operaciones de cambio
      required:
        - brandName
        - companyCnpj
        - operationId
      properties:
        brandName:
          type: string
          description: 'Nombre de la Marca informada por el participante en Open Finance. Se recomienda utilizar, siempre que sea posible, el mismo nombre de marca atribuido en el campo del directorio Customer Friendly Server Name (Authorisation Server). Institución autorizada a operar'
          pattern: '[\w\W\s]*'
          example: Organização A
          maxLength: 80
        companyCnpj:
          type: string
          description: 'Registro completo del CNPJ de la institución responsable del Registro - el CNPJ corresponde a la representación alfanumérica de la inscripción en el Cadastro de Pessoa Jurídica. Se deben tener únicamente los caracteres del CNPJ, sin máscara.'
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '21128159000166'
        operationId:
          type: string
          description: 'Identifica de forma única  la relación del cliente con el producto, manteniendo las reglas de inmutabilidad dentro de la institución transmisora.'
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: '92792126019929240'
      additionalProperties: false
    ExchangesResponseOperationDetails:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          $ref: '#/components/schemas/ExchangesOperationDetails'
        links:
          $ref: '#/components/schemas/ExchangesLinksOperationId'
        meta:
          $ref: '#/components/schemas/ExchangesMetaOperationId'
    ExchangesOperationDetails:
      type: object
      description: Detalles de la operación de cambio.
      required:
        - authorizedInstitutionCnpjNumber
        - authorizedInstitutionName
        - operationType
        - operationDate
        - dueDate
        - localCurrencyOperationTax
        - localCurrencyOperationValue
        - foreignOperationValue
        - deliveryForeignCurrency
        - operationCategoryCode
      properties:
        authorizedInstitutionCnpjNumber:
          type: string
          description: CNPJ de la institución autorizada a operar en el mercado de cambio.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '11225860000140'
        authorizedInstitutionName:
          type: string
          description: Nombre de la Institución Financiera en Brasil.
          maxLength: 250
          pattern: '[\w\W\s]*'
          example: AGENCIA CORRETORA
        intermediaryInstitutionCnpjNumber:
          type: string
          description: |
            CNPJ de la institución intermediadora autorizada a operar en el mercado de cambio.
            Campo de envío obligatorio en los casos en que haya institución intermediadora.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '11225860000140'
        intermediaryInstitutionName:
          type: string
          description: |
            Nombre de la corredora interviniente autorizada a operar en el mercado de cambio.

            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando el campo 'intermediaryInstitutionCnpjNumber' sea informado.
          maxLength: 250
          pattern: '[\w\W\s]*'
          example: AGENCIA CORRETORA
        operationNumber:
          type: string
          description: Número del registro de la operación en el Bacen. Debe cumplimentarse en el compartimiento, después del registro en el Sistema de Câmbio y cuando el número esté disponible en la transmisora/detentora.
          maxLength: 12
          pattern: '^\d{12}$'
          example: '393874649456'
        operationType:
          $ref: '#/components/schemas/ExchangesEnumOperationType'
        operationDate:
          type: string
          format: date-time
          description: Fecha del cierre del contrato de cambio.
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2023-03-07T08:30:00Z'
        dueDate:
          type: string
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          description: Fecha en que se prevé que la operación (compra o venta) sea liquidada.
          maxLength: 10
          example: '2018-02-15'
        localCurrencyOperationTax:
          type: object
          description: Valor del tipo de cambio aplicado a este contrato, en moneda nacional.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor relacionado con el objeto.
              maxLength: 31
              pattern: '^\d{1,15}\.\d{1,15}$'
              example: '1.3'
            currency:
              type: string
              description: Moneda referente al valor monetario, siguiendo el modelo ISO-4217.
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        localCurrencyOperationValue:
          type: object
          description: Valor negociado en moneda nacional.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor relacionado con el objeto.
              maxLength: 20
              pattern: '^\d{1,17}\.\d{2}$'
              example: '1000.04'
            currency:
              type: string
              description: Moneda referente al valor monetario, siguiendo el modelo ISO-4217.
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        foreignOperationValue:
          type: object
          description: Valor de la operación en moneda extranjera.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor relacionado con el objeto.
              maxLength: 20
              pattern: '^\d{1,17}\.\d{2}$'
              example: '1000.04'
            currency:
              type: string
              description: Moneda referente al valor monetario, siguiendo el modelo ISO-4217.
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: USD
        operationOutstandingBalance:
          type: object
          description: Valor del saldo de la operación a liquidar en moneda extranjera. Objeto de envío obligatorio en los casos de operaciones de cambio con liquidación futura.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor relacionado con el objeto.
              maxLength: 20
              pattern: '^\d{1,17}\.\d{2}$'
              example: '1000.04'
            currency:
              type: string
              description: Moneda referente al valor monetario, siguiendo el modelo ISO-4217.
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        vetAmount:
          type: object
          description: Representa el costo de una operación de cambio en reales por moneda extranjera, englobando el tipo de cambio, las tarifas y los tributos que inciden sobre esa operación. Campo de envío obligatorio en las operaciones de cambio al contado que alcancen hasta el límite de US$100.000 o equivalente en otras monedas.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor relacionado con el objeto.
              maxLength: 31
              pattern: '\d{1,15}\.\d{1,15}$'
              example: '1000.000004'
            currency:
              type: string
              description: Moneda referente al valor monetario, siguiendo el modelo ISO-4217.
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        localCurrencyAdvancePercentage:
          type: string
          description: |
            Porcentaje del valor de moneda extranjera concedido al cliente anticipadamente. p.ej. 0.014500.

            La cumplimentación debe respetar las 6 casas decimales, aunque vengan cumplimentadas con ceros(representación de porcentaje p.ej: 0.150000. Este valor representa 15%. El valor 1 representa 100%). Campos de envío obligatorio en el caso de operaciones de cambio con liquidación futura.
          pattern: '^\d{1}\.\d{1,6}$'
          maxLength: 8
          minLength: 3
          example: '0.12'
        deliveryForeignCurrency:
          $ref: '#/components/schemas/ExchangesEnumDeliveryForeignCurrency'
        operationCategoryCode:
          type: string
          maxLength: 5
          pattern: '^\d{5}$'
          description: Código de la naturaleza hecho del cierre de la operación. Debe respetar los códigos de naturaleza referenciados en la Resolución 277 o en la Circular 3690, conforme se aplique al contrato de cambio.
          example: '90302'
      additionalProperties: false
