    CreditFixedIncomesMetaTransactions:
      type: object
      description: Metainformación referente a la API solicitada.
      required:
        - requestDateTime
      properties:
        requestDateTime:
          description: 'Fecha y hora de la consulta, conforme a la especificación RFC-3339, formato UTC.'
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
    CreditFixedIncomesResponseBalances:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: object
          required:
            - referenceDateTime
            - updatedUnitPrice
            - quantity
            - grossAmount
            - netAmount
            - incomeTax
            - financialTransactionTax
            - blockedBalance
            - purchaseUnitPrice
          properties:
            referenceDateTime:
              type: string
              format: date-time
              description: 'fecha y hora de la última posición consolidada disponible a la que se refieren los datos transaccionales del cliente disponibles en los canales electrónicos; En la representación de la fecha se deben considerar los minutos y segundos como cero (00:00:00Z)'
              maxLength: 20
              pattern: '(^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$)'
              example: '2022-07-21T17:32:00Z'
            updatedUnitPrice:
              type: object
              description: valor bruto unitario actualizado en la fecha de referencia;
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,8}$'
                  maxLength: 24
                  minLength: 4
                  example: '1000.0400'
                  description: Valor relacionado con el objeto.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
            quantity:
              type: string
              format: double
              description: cantidad de títulos mantenidos en la fecha de la posición del cliente
              maxLength: 24
              minLength: 4
              pattern: '^\d{1,15}\.\d{2,8}$'
              example: '15.00'
            grossAmount:
              type: object
              description: valor de la inversión que se refiere a la cantidad x PU actualizado en la fecha de referencia
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  maxLength: 20
                  minLength: 4
                  example: '1000.04'
                  description: Valor relacionado con el objeto.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
            netAmount:
              type: object
              description: 'valor de la inversión actualizado en la fecha de referencia, posterior a la deducción de impuestos (IOF e IR)'
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  maxLength: 20
                  minLength: 4
                  example: '1000.04'
                  description: Valor relacionado con el objeto.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
            incomeTax:
              type: object
              description: Valor del impuesto a la renta provisionado considerando la tasa vigente en la fecha de referencia.
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  maxLength: 20
                  minLength: 4
                  example: '1000.04'
                  description: Valor relacionado con el objeto.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
            financialTransactionTax:
              type: object
              description: Valor del impuesto (IOF) provisionado considerando la tasa vigente en la fecha de referencia.
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  maxLength: 20
                  minLength: 4
                  example: '1000.04'
                  description: Valor relacionado con el objeto.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
            blockedBalance:
              type: object
              description: Valor no disponible para movimiento en aquel momento por cualquier motivo (bloqueo judicial, bloqueo en garantía, entre otros). El plazo de carencia no se considera como bloqueo.
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  maxLength: 20
                  minLength: 4
                  example: '1000.04'
                  description: Valor relacionado con el objeto.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
            purchaseUnitPrice:
              type: object
              description: valor unitario negociado con el cliente en la fecha de adquisición
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,8}$'
                  maxLength: 24
                  minLength: 4
                  example: '1000.000004'
                  description: Valor relacionado con el objeto.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
            preFixedRate:
              type: string
              description: |
                Tasa de remuneración acordada con el cliente en la contratación. En casos de productos progresivos, considerar la tasa máxima contratada.
              maxLength: 9
              minLength: 8
              pattern: '^-?\d{1}\.\d{6}$'
              example: '0.300000'
            postFixedIndexerPercentage:
              type: string
              description: |
                Porcentaje del indexador acordado con el cliente en la contratación. En casos de productos progresivos, considerar la tasa máxima contratada.
              maxLength: 9
              minLength: 8
              pattern: '^-?\d{1}\.\d{6}$'
              example: '1.100000'
            fine:
              type: object
              description: |
                Valor de multa debido al atraso del pago acordado en el contrato.
                En caso de que la transmisora posea la información, el envío de este campo es obligatorio.
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  maxLength: 20
                  minLength: 4
                  example: '1000.04'
                  description: Valor relacionado con el objeto.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
            latePayment:
              type: object
              description: |
                Valor de interés moratorio debido al atraso del pago acordado en el contrato.
                En caso de que la transmisora posea la información, el envío de este campo es obligatorio.
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  maxLength: 20
                  minLength: 4
                  example: '1000.04'
                  description: Valor relacionado con el objeto.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
        links:
          $ref: '#/components/schemas/CreditFixedIncomesLinks'
        meta:
          $ref: '#/components/schemas/CreditFixedIncomesMeta'
      additionalProperties: false
    CreditFixedIncomesResponseTransactions:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/CreditFixedIncomesTransaction'
        links:
          $ref: '#/components/schemas/CreditFixedIncomesTransactionsLinks'
        meta:
          $ref: '#/components/schemas/CreditFixedIncomesMetaTransactions'
      additionalProperties: false
    CreditFixedIncomesTransaction:
      type: object
      required:
        - type
        - transactionType
        - transactionDate
        - transactionGrossValue
        - transactionNetValue
        - transactionId
      properties:
        type:
          $ref: '#/components/schemas/CreditFixedIncomesEnumType'
        transactionType:
          $ref: '#/components/schemas/CreditFixedIncomesEnumTransactionType'
        transactionTypeAdditionalInfo:
          type: string
          description: |
            Información adicional del tipo de movimiento, para cumplimentar en el caso de movimientos no delimitados en el dominio.
            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando haya 'OUTROS' en el campo 'transactionType'.
          maxLength: 100
          pattern: '[\w\W\s]*'
        transactionDate:
          type: string
          format: date
          description: Fecha del movimiento
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
        transactionUnitPrice:
          type: object
          description: |
            Valor unitario negociado con el cliente en la fecha de adquisición. En transferencias de custodia, cuando el PU original (de la institución de origen) no esté disponible para la transmisora, debe informarse el PU marcado por la institución en la fecha de transferencia.

            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando el campo `transactionType` sea rellenado con los valores `COMPRA`, `VENDA` o `VENCIMENTO`.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              pattern: '^\d{1,15}\.\d{2,8}$'
              maxLength: 24
              minLength: 4
              example: '1000.000004'
              description: Valor relacionado con el objeto.
            currency:
              $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
        transactionQuantity:
          type: string
          description: |
            Cantidad de títulos involucrados en el movimiento

            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando el campo 'transactionType' sea rellenado con los valores 'COMPRA', 'VENDA', 'VENCIMENTO', 'TRANSFERENCIA_TITULARIDADE' o 'TRANSFERENCIA_CUSTODIA'.
          maxLength: 24
          pattern: '^\d{1,15}\.\d{2,8}$'
          example: '42.25'
        transactionGrossValue:
          type: object
          description: 'Valor bruto de la transacción (Precio unitario del movimiento x Cantidad)'
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              pattern: '^\d{1,15}\.\d{2,4}$'
              maxLength: 20
              minLength: 4
              example: '1000.04'
              description: Valor relacionado con el objeto.
            currency:
              $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
        incomeTax:
          type: object
          description: |
            Valor del impuesto a la renta recaudado en la transacción.
            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando el campo 'type' sea rellenado con el valor 'SAIDA'.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              pattern: '^\d{1,15}\.\d{2,4}$'
              maxLength: 20
              minLength: 4
              example: '1000.04'
              description: Valor relacionado con el objeto.
            currency:
              $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
        financialTransactionTax:
          type: object
          description: |
            Valor del IOF recaudado en la transacción.
            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando el campo 'type' sea rellenado con el valor 'SAIDA'.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              pattern: '^\d{1,15}\.\d{2,4}$'
              maxLength: 20
              minLength: 4
              example: '1000.04'
              description: Valor relacionado con el objeto.
            currency:
              $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
        transactionNetValue:
          type: object
          description: Valor neto de la transacción
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              pattern: '^\d{1,15}\.\d{2,4}$'
              maxLength: 20
              minLength: 4
              example: '1000.04'
              description: Valor relacionado con el objeto.
            currency:
              $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
        remunerationTransactionRate:
          type: string
          description: |
            Tasa de remuneración acordada con el cliente en la contratación.

            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando el campo 'type' sea rellenado con el valor 'ENTRADA' y se trate de un producto prefijado o híbrido.
          maxLength: 9
          minLength: 8
          pattern: '^-?\d{1}\.\d{6}$'
          example: '0.300000'
        indexerPercentage:
          type: string
          description: |
            Porcentaje máximo del indexador en la transacción acordado con el cliente en la contratación.

            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando el campo 'type' sea rellenado con el valor 'ENTRADA' y se trate de un producto posfijado o híbrido.
          maxLength: 8
          minLength: 8
          pattern: '^\d{1}\.\d{6}$'
          example: '1.100000'
        transactionId:
          type: string
          description: |
            Código o identificador único proporcionado por la institución para individualizar el movimiento.
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: ABCD2126019929279212650822221989319253344
    CreditFixedIncomesEnumType:
      type: string
      description: |
        Tipo de movimiento en la visión de inversión:

        ENTRADA: COMPRA, CANCELAMENTO, TRANSFERENCIA_TITULARIDADE, TRANSFERENCIA_CUSTODIA, OUTROS.

        SAIDA: VENDA, CANCELAMENTO, VENCIMENTO, PAGAMENTO_JUROS, AMORTIZACAO, PREMIO, TRANSFERENCIA_TITULARIDADE, TRANSFERENCIA_CUSTODIA, MULTA, MORA, OUTROS.
      enum:
        - ENTRADA
        - SAIDA
      example: ENTRADA
    CreditFixedIncomesEnumTransactionType:
      type: string
      description: Compra, venta, cancelación, vencimiento, pago de intereses, amortización, prima, transferencia de titularidad, transferencia de custodia, multa, interés moratorio y otros.
      enum:
        - COMPRA
        - VENDA
        - CANCELAMENTO
        - VENCIMENTO
        - PAGAMENTO_JUROS
        - AMORTIZACAO
        - PREMIO
        - TRANSFERENCIA_TITULARIDADE
        - TRANSFERENCIA_CUSTODIA
        - MULTA
        - MORA
        - OUTROS
      example: COMPRA
    VariableIncomesResponseProductList:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/VariableIncomesProductListData'
        links:
          $ref: '#/components/schemas/VariableIncomesLinks'
        meta:
          $ref: '#/components/schemas/VariableIncomesMeta'
      additionalProperties: false
    VariableIncomesResponseProductIdentification:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          $ref: '#/components/schemas/VariableIncomesProductIdentificationData'
        links:
          $ref: '#/components/schemas/VariableIncomesLinks'
        meta:
          $ref: '#/components/schemas/VariableIncomesMeta'
      additionalProperties: false
    VariableIncomesResponseBalances:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          $ref: '#/components/schemas/VariableIncomesBalanceData'
        links:
          $ref: '#/components/schemas/VariableIncomesLinks'
        meta:
          $ref: '#/components/schemas/VariableIncomesMeta'
      additionalProperties: false
    VariableIncomesResponseTransactions:
      type: object
      required:
        - data
