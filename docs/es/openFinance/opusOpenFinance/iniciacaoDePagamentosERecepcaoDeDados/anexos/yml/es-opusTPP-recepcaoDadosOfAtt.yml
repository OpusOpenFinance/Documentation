    LoansEnumContractReferentialRateIndexerType:
      type: string
      description: "\"Tipos de tasas referenciales o indexadores, conforme al Anexo 5: Tasa referencial o Indexador (Indx), del Documento 3040\"\n"
      enum:
      - SEM_TIPO_INDEXADOR
      - PRE_FIXADO
      - POS_FIXADO
      - FLUTUANTES
      - INDICES_PRECOS
      - CREDITO_RURAL
      - OUTROS_INDEXADORES
      example: PRE_FIXADO
    LoansEnumContractInterestRateType:
      type: string
      description: "\"Tipo de Intereses  (véase  Enum)\n- SIMPLES (aplicada/cobrada siempre sobre el capital inicial, que es el valor prestado/invertido. No hay cobro de intereses sobre intereses acumulados en el(los) período(s) anterior(es). Ejemplo: en un préstamo de R$1.000, con tasa de interés simple de 8% a.a., con duración de 2 años, el total de intereses será R$80 en el primer año y R$ 80 en el segundo año. Al final del contrato, el tomador devolverá el principal y los intereses simples de cada año: R$1.000+R$80+R$80=R$1.160)\n- COMPOSTO (para cada período del contrato (diario, mensual, anual etc.), hay un “nuevo capital” para el cobro de la tasa de interés contratada. Ese “nuevo capital” es la suma del capital y del interés cobrado en el período anterior. Ejemplo: en un préstamo de R$1.000, con tasa de interés compuesta de 8% a.a., con duración de 2 años, el total de intereses será R$80 en el primer año. En el segundo año, los intereses serán sumados al capital (R$1.000 + R$ 80 = R$ 1.080), resultando en intereses de R$ 86 (8% de R$ 1.080))\"\n"
      enum:
      - SIMPLES
      - COMPOSTO
      example: SIMPLES
    LoansReleases:
      type: object
      description: Lista de los pagos realizados en el período
      required:
      - paymentId
      - isOverParcelPayment
      - paidDate
      - currency
      - paidAmount
      properties:
        paymentId:
          type: string
          maxLength: 100
          minLength: 1
          example: XlthLXpBLVowLTldW2EtekEtWjAtOVwtXXswLDk5fSQ
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          description: Código o identificador único proporcionado por la institución para representar el pago individual.
        isOverParcelPayment:
          type: boolean
          example: true
          description: Identifica si es un pago pactado (false) o suelto (true).
        instalmentId:
          type: string
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          example: WGx0aExYcEJMVm93TFRsZFcyRXRla0V0V2pBdE9Wd3RYWH
          description: "Identificador de cuota, de responsabilidad de cada institución transmisora.  \n[Restricción] Información de envío obligatorio cuando isOverParcelPayment tenga el valor FALSE.\n"
        paidDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2021-05-21'
          description: Fecha efectiva del pago referente al contrato de la modalidad de crédito consultada, conforme a la especificación RFC-3339. p.ej. 2014-03-19
        currency:
          type: string
          maxLength: 3
          pattern: ^(\w{3}){1}$
          example: BRL
          description: "Moneda referente al valor monetario informado, según el modelo ISO-4217. p.ej. 'BRL'.\nTodos los valores monetarios informados están representados con la moneda vigente de Brasil.\n"
        paidAmount:
          type: string
          format: double
          pattern: ^-?\d{1,15}\.\d{2,4}$
          maxLength: 21
          minLength: 4
          example: '1000.0400'
          description: "Valor del pago referente al contrato de la modalidad de crédito consultada. Expresado en valor monetario con un mínimo de 2 y un máximo de 4 posiciones decimales. Si los cargos y tarifas fueron pagados junto con la cuota, la suma total debe ser añadida al valor de la cuota en este campo. En caso de que el pago de tarifas y cargos haya sido realizado aparte, deben ser listados en el campo ovelParcel.\n"
        overParcel:
          type: object
          description: "Objeto de las tarifas y cargos que fueron pagados fuera de la cuota.\n\n[Restricción] La información debe ser enviada en caso de que exista.\n"
          required:
          - fees
          - charges
          properties:
            fees:
              type: array
              minItems: 0
              items:
                $ref: '#/components/schemas/LoansFeeOverParcel'
              description: Lista de las tarifas que fueron pagadas fuera de la cuota, solo para pago suelto.
            charges:
              type: array
              minItems: 0
              items:
                $ref: '#/components/schemas/LoansChargeOverParcel'
              description: Lista de los cargos que fueron pagados fuera de la cuota.
    LoansEnumContractFeeCharge:
      type: string
      description: "\"Forma de cobro relativa a la tarifa pactada en el contrato. (Véase Enum)\n- Mínimo\n- Máximo\n- Fijo\n- Porcentual\"\n"
      enum:
      - MINIMO
