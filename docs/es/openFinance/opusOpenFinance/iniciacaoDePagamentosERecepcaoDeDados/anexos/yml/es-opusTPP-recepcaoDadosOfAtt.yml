    CreditCardsAccountsResponseCreditCardAccountsLimits:
      properties:
        data:
          description: "[Restricción] El envío de los datos de límites debe seguir las siguientes orientaciones:\n- La lista vacía debe ser interpretada como la ausencia de la información;\n- El escenario de límite con valor en cero debe tener un registro explícito informando el valor como cero;\n- El escenario de \"tarjeta sin límite\", es decir, tarjetas en las que el uso del límite es flexible, debe ser informado en un registro explícito con isLimitFlexible como true;\n- Los límites globales deben ser compartidos en la lista de límites, definidos por el enum CONSOLIDADO, en el campo consolidationType. Los límites ya incluidos en el global no deben ser compartidos, para que no ocurra redundancia de información;\n- Los límites segregados, que no forman parte del global, deben ser compartidos por el enum INDIVIDUAL, en el campo consolidationType.\n- Las tarjetas virtuales solo deben tener su límite listado en caso de que el límite de la misma esté segregado del global, así, deben ser compartidas por el enum INDIVIDUAL, en el campo consolidationType.\n- Solo deben ser compartidos límites de tarjetas activas. Exclusivamente en el caso de cuentas tarjetas canceladas, enviar lista vacía.\n"
          items:
            $ref: '#/components/schemas/CreditCardsAccountsLimitsData'
          minItems: 0
          type: array
        links:
          $ref: '#/components/schemas/CreditCardsAccountsLinks'
        meta:
          $ref: '#/components/schemas/CreditCardsAccountsMeta'
