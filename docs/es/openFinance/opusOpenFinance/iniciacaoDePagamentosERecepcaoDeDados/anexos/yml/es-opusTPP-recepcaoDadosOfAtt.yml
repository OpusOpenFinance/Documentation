        totalPages:
          type: integer
          format: int32
          description: Número total de páginas en el resultado
          example: 1
        requestDateTime:
          description: 'Fecha y hora de la consulta, conforme a la especificación RFC-3339, formato UTC.'
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
    InvoiceFinancingsMetaSingle:
      type: object
      description: Metainformación referente a la API solicitada.
      required:
        - requestDateTime
      properties:
        requestDateTime:
          description: 'Fecha y hora de la consulta, conforme a la especificación RFC-3339, formato UTC.'
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
    BankFixedIncomesResponseInvestmentList:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            type: object
            description: Lista de títulos de renta fija bancaria mantenidos por el cliente en la institución transmisora y para los cuales él haya otorgado consentimiento
            required:
              - brandName
              - companyCnpj
              - investmentType
              - investmentId
            properties:
              brandName:
                type: string
                description: 'Nombre de la Marca reportada por el participante en el Open Finance. Se recomienda utilizar, siempre que sea posible, el mismo nombre de marca atribuido en el campo del directorio Customer Friendly Server Name (Authorisation Server).'
                pattern: '^[^\s](.*[^\s])?$'
                example: Organização A
                maxLength: 80
              companyCnpj:
                type: string
                description: 'Registro completo del CNPJ de la institución responsable del Registro - el CNPJ corresponde a la representación alfanumérica de la inscripción en el Cadastro de Pessoa Jurídica. Se deben tener únicamente los caracteres del CNPJ, sin máscara.'
                maxLength: 14
                pattern: '^[0-9A-Z]{12}[0-9]{2}$'
                example: '21281590001660'
              investmentType:
                $ref: '#/components/schemas/BankFixedIncomesEnumInvestmentType'
              investmentId:
                type: string
                description: 'Identifica de forma única  la relación del cliente con el producto, manteniendo las reglas de inmutabilidad dentro de la institución transmisora.'
                maxLength: 100
                pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
                example: '92792126019929200000000000000000000000000'
            additionalProperties: false
        links:
          $ref: '#/components/schemas/BankFixedIncomesLinks'
        meta:
          $ref: '#/components/schemas/BankFixedIncomesMeta'
      additionalProperties: false
    BankFixedIncomesResponseProductIdentification:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          $ref: '#/components/schemas/BankFixedIncomesIdentifyProduct'
        links:
          $ref: '#/components/schemas/BankFixedIncomesLinks'
        meta:
          $ref: '#/components/schemas/BankFixedIncomesMeta'
      additionalProperties: false
    BankFixedIncomesIdentifyProduct:
      type: object
      required:
        - issuerInstitutionCnpjNumber
        - investmentType
        - remuneration
        - issueUnitPrice
        - dueDate
        - issueDate
        - purchaseDate
        - gracePeriodDate
      properties:
        issuerInstitutionCnpjNumber:
          type: string
          description: CNPJ de la institución emisora.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '11225860000140'
        isinCode:
          type: string
          description: |
            Código ISIN de la emisión, Código ISIN del producto, Código de la emisora (campo opcional): código universal que identifica cada valor mobiliario o instrumento financiero, conforme a la Norma ISO 6166
          maxLength: 12
          minLength: 12
          pattern: '^[A-Z]{2}([A-Z0-9]){9}\d{1}$'
          example: BRCST4CTF001
        investmentType:
          $ref: '#/components/schemas/BankFixedIncomesEnumInvestmentType'
        remuneration:
          $ref: '#/components/schemas/BankFixedIncomesRemuneration'
        issueUnitPrice:
          type: object
          description: Precio unitario de emisión del título.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              maxLength: 24
              pattern: '^\d{1,15}\.\d{2,8}$'
              example: '1000.000004'
              description: Valor relacionado con el objeto.
            currency:
              $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
        dueDate:
          type: string
          format: date
          maxLength: 10
          minLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
          description: Fecha de vencimiento del título.
        issueDate:
          type: string
          format: date
          maxLength: 10
          minLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-16'
          description: Fecha de emisión del título.
        clearingCode:
          type: string
          maxLength: 30
          pattern: '[\w\W-]*'
          example: CDB421GPXXX
          description: Código de registro del activo en la clearing.
        purchaseDate:
          type: string
          format: date
          maxLength: 10
          minLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
          description: Fecha de adquisición del cliente.
        gracePeriodDate:
          type: string
          format: date
          maxLength: 10
          minLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-16'
          description: Fecha hasta la cual el cliente no podrá rescatar anticipadamente su inversión.
      additionalProperties: false
    BankFixedIncomesEnumInvestmentType:
      type: string
      description: 'Especificación del activo en cuestión (CDB, RDB, LCI o LCA)'
      enum:
        - CDB
        - RDB
        - LCI
        - LCA
      example: CDB
    BankFixedIncomesRemuneration:
      type: object
      description: Objeto para el detalle de la remuneración del título.
      required:
        - rateType
        - ratePeriodicity
        - calculation
        - indexer
      properties:
        preFixedRate:
          type: string
          format: double
          pattern: '^-?\d{1}\.\d{6}$'
          maxLength: 9
          minLength: 8
          example: '0.300000'
          description: |
            Tasa de remuneración prefijada de emisión del título. p.ej. 0.014500.

            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando haya 'PRE_FIXADO' en el campo 'indexer' o cuando se trate de un producto con remuneración híbrida.
        postFixedIndexerPercentage:
          type: string
          format: double
          pattern: '^-?\d{1}\.\d{6}$'
          maxLength: 9
          minLength: 8
          example: '1.100000'
          description: |
            Porcentaje del indexador posfijado de emisión del título. p.ej. 0.014500.

            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando el campo 'indexer' sea rellenado de forma diferente de 'PRE_FIXADO' o cuando se trate de un producto con remuneración híbrida.
        rateType:
          $ref: '#/components/schemas/BankFixedIncomesEnumRateType'
        ratePeriodicity:
          $ref: '#/components/schemas/BankFixedIncomesEnumRatePeriodicity'
        calculation:
          $ref: '#/components/schemas/BankFixedIncomesEnumCalculation'
        indexer:
          $ref: '#/components/schemas/BankFixedIncomesEnumIndexer'
        indexerAdditionalInfo:
          type: string
          description: |
            Informaciones adicionales del indexador

            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando haya 'Outros' en el campo 'indexer'.
          maxLength: 50
          example: Dólar
          pattern: '[\w\W\s]*'
      additionalProperties: false
    BankFixedIncomesEnumRateType:
      type: string
      description: 'Tipo de la tasa de remuneración (lineal o exponencial)'
      enum:
        - LINEAR
        - EXPONENCIAL
      example: LINEAR
    BankFixedIncomesEnumRatePeriodicity:
      type: string
      description: 'Periodicidad de la tasa de remuneración (mensual, anual, diaria, semestral)'
      enum:
        - MENSAL
        - ANUAL
        - DIARIO
        - SEMESTRAL
      example: MENSAL
    BankFixedIncomesEnumCalculation:
      type: string
      description: 'Base de cálculo (días hábiles o días corridos)'
      enum:
        - DIAS_UTEIS
        - DIAS_CORRIDOS
      example: DIAS_CORRIDOS
    BankFixedIncomesEnumIndexer:
      type: string
      description: 'Índice utilizado como referencia para la corrección de la rentabilidad y/o los rendimientos del activo (CDI, DI , TR, IPCA, IGP_M, IGP_DI, INPC, BCP, TLC, SELIC, PRE_FIXADO y OUTROS)'
      enum:
        - CDI
        - DI
        - TR
        - IPCA
        - IGP_M
        - IGP_DI
        - INPC
        - BCP
        - TLC
        - SELIC
        - PRE_FIXADO
        - OUTROS
      example: CDI
    BankFixedIncomesCurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      maxLength: 3
      description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
      example: BRL
    BankFixedIncomesLinks:
