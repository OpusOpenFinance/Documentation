              pattern: '^-?\d{1,15}\.\d{2,4}$'
              example: '1000.04'
            currency:
              type: string
              description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        financialTransactionTax:
          type: object
          description: |
            Valor del Impuesto sobre Operaciones Financieras (IOF) retenido en la fuente considerando la alícuota vigente en la fecha del movimiento.

            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando el campo 'type' esté cumplimentado con el valor 'SAIDA'.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor relacionado con el objeto.
              maxLength: 21
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              example: '1000.04'
            currency:
              type: string
              description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        transactionExitFee:
          type: object
          description: |
            Valor de la tasa de salida considerado en el movimiento.

            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando el campo 'type' esté cumplimentado con el valor 'SAIDA'.
          required:
            - amount
