            $ref: '#/components/schemas/VariableIncomesTransactionsData'
        links:
          $ref: '#/components/schemas/VariableIncomesTransactionsLinks'
        meta:
          $ref: '#/components/schemas/VariableIncomesMetaSingle'
      additionalProperties: false
    VariableIncomesResponseTransactionsCurrent:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/VariableIncomesTransactionsCurrentData'
        links:
          $ref: '#/components/schemas/VariableIncomesTransactionsLinks'
        meta:
          $ref: '#/components/schemas/VariableIncomesMetaSingle'
      additionalProperties: false
    VariableIncomesProductListData:
      type: object
      description: Lista de activos de renta variable mantenidos por el cliente en la institución transmisora y para los cuales él haya otorgado consentimiento.
      required:
        - brandName
        - companyCnpj
        - investmentId
      properties:
        brandName:
          type: string
          description: 'Nombre de la Marca reportada por el participante en el Open Finance. Se recomienda utilizar, siempre que sea posible, el mismo nombre de marca atribuido en el campo del directorio Customer Friendly Server Name (Authorisation Server).'
          pattern: '^[^\s](.*[^\s])?$'
          example: Organização A
          maxLength: 80
        companyCnpj:
          type: string
          description: Registro completo del CNPJ de la institución responsable del Registro - el CNPJ corresponde a la representación alfanumérica de la inscripción en el Cadastro de Pessoa Jurídica. Se deben tener únicamente los caracteres del CNPJ, sin máscara.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '21281590001660'
        investmentId:
          type: string
          description: Identifica de forma única la relación del cliente con el producto, manteniendo las reglas de inmutabilidad dentro de la institución transmisora. En los casos en que el cliente, después de completar 12 meses desde el último movimiento y con cantidad de activos en cero (el cliente ya no tiene la posesión del producto bajo la custodia de la transmisora), compre nuevamente el activo en el que ya invirtió en períodos pasados, mantener el mismo investmentId utilizado anteriormente.
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: '92792126019929200000000000000000000000000'
      additionalProperties: false
    VariableIncomesProductIdentificationData:
      type: object
      required:
        - isinCode
        - ticker
      properties:
        issuerInstitutionCnpjNumber:
          type: string
          description: CNPJ de la institución emisora. En caso de que la transmisora posea la información, el envío de este campo es obligatorio.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '11225860000140'
        isinCode:
          type: string
          description: |
            Código ISIN de la emisión, Código ISIN del producto, Código de la emisora: código universal que identifica cada valor mobiliario o instrumento financiero, conforme a la Norma ISO 6166.
          maxLength: 12
          pattern: '^[A-Z]{2}([A-Z0-9]){9}\d{1}$'
          example: BRCST4CTF001
        ticker:
          type: string
          description: Código de negociación para la identificación de activos negociados en bolsa.
          maxLength: 35
          pattern: '[\w\W\s]*'
          example: PETR4
      additionalProperties: false
    VariableIncomesBalanceData:
      type: object
      required:
        - referenceDate
        - priceFactor
        - grossAmount
        - blockedBalance
        - quantity
        - closingPrice
      properties:
        referenceDate:
          type: string
          format: date
          description: Posición cerrada para el activo de la fecha del día anterior.
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2023-01-07'
          maxLength: 10
        priceFactor:
          type: string
          format: double
          description: |
            Factor que indica el número de acciones utilizadas para la formación del precio. El valor informado debe ser mayor que cero.
          pattern: '^\d{1,15}\.\d{2,8}$'
          maxLength: 24
          example: '100.0005'
        grossAmount:
          $ref: '#/components/schemas/VariableIncomesBalancesGrossAmount'
        blockedBalance:
          $ref: '#/components/schemas/VariableIncomesBalancesBlockedBalance'
        quantity:
          type: string
          format: double
          description: Cantidad total del activo en la fecha de referencia.
          pattern: '^-?\d{1,15}\.\d{2,8}$'
          maxLength: 25
          example: '1000.00000004'
        closingPrice:
          $ref: '#/components/schemas/VariableIncomesBalancesClosingPrice'
    VariableIncomesTransactionsData:
      type: object
      required:
        - type
        - transactionType
        - transactionDate
        - transactionValue
        - transactionId
      properties:
        type:
          $ref: '#/components/schemas/VariableIncomesEnumTransactionsType'
        transactionType:
          $ref: '#/components/schemas/VariableIncomesEnumTransactionsTransactionType'
        transactionTypeAdditionalInfo:
          type: string
          description: |
            Información adicional del tipo de movimiento, para cumplimentar en el caso de movimientos no delimitados en el dominio.

            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando el campo 'transactionType' sea rellenado con el valor 'OUTROS'.
          maxLength: 100
          pattern: '[\w\W\s]*'
        transactionDate:
          type: string
          format: date
          description: |
            Fecha del movimiento de acuerdo con la fecha visualizada por el cliente en los canales de la institución. Fecha de la sesión de negociación: compartir movimientos hasta la fecha de la posición.
          maxLength: 10
          minLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
        priceFactor:
          type: string
          format: double
          description: |
            Factor que indica el número de acciones utilizadas para la formación del precio. El valor informado debe ser mayor que cero.
          pattern: '^\d{1,15}\.\d{2,8}$'
          maxLength: 24
          example: '100.0005'
        transactionUnitPrice:
          type: object
          description: |
            Precio unitario del movimiento: valor de la unidad del producto en el movimiento de la inversión. En transferencias de custodia, cuando el PU original (de la institución de origen) no esté disponible para la transmisora, se debe informar el PU marcado por la institución en la fecha de transferencia.

            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando el campo `transactionType` esté cumplimentado con los valores `COMPRA` o `VENDA`.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor relacionado con el objeto.
              maxLength: 21
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              example: '1000.0004'
            currency:
              type: string
              description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        transactionQuantity:
          type: string
          format: double
          description: |
            Cantidad de activos movidos.

            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando el campo 'transactionType' esté cumplimentado con los valores 'COMPRA' o 'VENDA'.
          maxLength: 24
          pattern: '^\d{1,15}\.\d{2,8}$'
          example: '42.00000025'
        transactionValue:
          type: object
          description: Valor de la operación realizada por el cliente.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor relacionado con el objeto.
              maxLength: 20
              pattern: '^\d{1,15}\.\d{2,4}$'
              example: '1000.04'
            currency:
              type: string
              description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        transactionId:
          type: string
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: ABCD2126019929279212650822221989319253344
          description: Código o identificador único proporcionado por la institución que mantiene la representación individual del movimiento.
        brokerNoteId:
          type: string
          description: |
            Identifica de forma única la relación del cliente con el producto para cada número de nota de negociación (`brokerNoteNumber`), manteniendo las reglas de inmutabilidad dentro de la institución transmisora.
            El contenido de este campo debe utilizarse como parámetro en la llamada del endpoint `GET /broker-notes/{brokerNoteId}`.

            La relación entre `investmentId` y `brokerNoteId` es de N a N, lo que refleja que una nota de negociación puede contemplar múltiples inversiones y, al mismo tiempo, una inversión puede estar asociada a diferentes notas de negociación.

            La relación entre `brokerNoteId` y `brokerNoteNumber` es de 1 a 1, lo que garantiza que cada nota de negociación natural corresponda a un identificador único e inmutable en el ecosistema.

            [Restricción] Información de envío obligatorio en caso de que el motivo del movimiento sea compra o venta.
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: XWYZ555019929279212650822221989319252233
      additionalProperties: false
