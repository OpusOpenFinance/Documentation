    CreditCardsAccountsTransaction:
      description: Lista que trae los valores relativos a los saldos del Límite de crédito total de la cuenta de pago pospago
      properties:
        amount:
          $ref: '#/components/schemas/CreditCardsAccountsTransactionAmount'
        billForecastDate:
          description: "Mes y año en que la transacción/cuota será facturada, pudiendo ser una factura abierta, futura o cerrada.\n\n- En caso de que sea una transacción futura, esa fecha podrá ser ajustada conforme el cliente altere los ciclos de su factura. Independientemente de ello, el mes y el año deben corresponder exactamente a la previsión de cobro de esa cuota.\n\n- Todas las transacciones deben ser reflejadas de forma idéntica a los canales digitales y, en caso de que no estén en los canales, deben ser presentadas conforme a la previsión de cobro de la propia institución.\n"
          example: 2021-05
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])$
          type: string
        billId:
          description: "Código único e inmutable que identifica la factura en la que consta la transacción informada. \nCumplimentar únicamente para los casos de transacción en factura cerrada, es decir, este campo no se espera en los casos de transacción en factura abierta.\n"
          example: MTU0OTU1NjI2NTk4OTRmc2ZhZDRmc2Q1NmZkM
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        billPostDate:
          description: "Fecha en que la transacción fue insertada en la factura. \nCumplimentar el campo con la fecha dummy: 0001-01-01, únicamente para los casos en los que aún no exista la fecha de inserción en la factura.\n"
          example: '2021-05-21'
          format: date
          maxLength: 20
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          type: string
        brazilianAmount:
          $ref: '#/components/schemas/CreditCardsAccountsTransactionBrazilianAmount'
        chargeIdentificator:
          description: "Número de la cuota que se está informando.\n\n[Restricción] De cumplimentación obligatoria si el Tipo de Pago (paymentType) seleccionado es 'A_PRAZO'.\n"
          example: 12
          format: integer
          maximum: 999
          minimum: 1
          type: number
        chargeNumber:
          description: "Cantidad de cuotas.   \n[Restricción] El campo debe ser cumplimentado cuando existan cuotas relacionadas con la transacción.\n"
          example: 12
          format: integer
          maximum: 999
          type: number
        creditDebitType:
          $ref: '#/components/schemas/EnumCreditDebitIndicator'
        feeType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountFee'
        feeTypeAdditionalInfo:
          description: Campo libre, de cumplimentación obligatoria cuando se selecciona el tipo de tarifa "OUTRA"
          maxLength: 140
          pattern: ^\S[\s\S]*$
          type: string
        identificationNumber:
          description: "Número de identificación de la tarjeta: corresponde a los 4 últimos dígitos de la tarjeta para PF, o bien, cumplimentar con un identificador para PJ, con las características definidas para los IDs en el Open Finance.\n"
          example: '4453'
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        otherCreditsAdditionalInfo:
          description: "Campo libre para la cumplimentación de datos adicionales de otros tipos de crédito contratados en la tarjeta.\n\n[Restricción] De cumplimentación obligatoria cuando se selecciona \"OUTROS\" en el campo otros tipos de crédito.\n"
          maxLength: 50
          pattern: ^\S[\s\S]*$
          type: string
        otherCreditsType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsOtherCreditType'
        payeeMCC:
          description: "El MCC o el código de la categoría del establecimiento comercial. Los MCC se agrupan según sus similitudes. El MCC se utiliza para clasificar el negocio por el tipo de bienes o servicios suministrados. Los MCC se atribuyen por tipo de comerciante (por ejemplo, uno para hoteles, uno para tiendas de material de oficina, etc.) o por nombre de comerciante (por ejemplo, 3000 para United Airlines).\n\n[Restricción] Información de envío obligatorio cuando el valor del campo transactionType sea igual a PAGAMENTO.\n"
          example: 5137
          format: integer
          maximum: 2147483647
          type: number
        paymentType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsPaymentType'
        transactionDateTime:
          description: "Fecha y hora de la transacción.   \n\nEn las compras en cuotas, el `transactionDateTime` debe ser idéntico en todas las cuotas. El campo debe reflejar obligatoriamente la información exhibida al cliente en los canales digitales de la institución, con precisión de fecha, hora y minuto — incluso si la institución no exhibe ese nivel de granularidad en sus canales. En esos casos, los segundos y milisegundos pueden ser cumplimentados con cero (0). Ejemplo: 2024-01-29T11:15:00.000Z.\n"
          example: '2016-01-29T12:29:03.374Z'
          format: date-time
          maxLength: 24
          pattern: (^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)\.(?:[0-9]){3}Z$)
          type: string
        transactionId:
          description: "Código o identificador único e inmutable proporcionado por la institución que mantiene la cuenta para representar la transacción individual. \nSolo deben ser compartidas transacciones después de la conciliación, haciendo que el `transactionId` sea inmutable.\n"
          example: TXpRMU9UQTROMWhZV2xSU1FUazJSMDl
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        transactionName:
          description: Literal utilizada en la institución financiera para identificar la transacción. La información presentada debe ser la misma utilizada en los canales electrónicos de la institución (extracto y factura).
          example: PGTO
          maxLength: 200
          pattern: '[\w\W\s]*'
          type: string
        transactionType:
          $ref: '#/components/schemas/EnumCreditCardTransactionType'
        transactionalAdditionalInfo:
          description: Campo libre, de cumplimentación obligatoria cuando se selecciona el tipo de transacción "OUTROS"
          maxLength: 140
          pattern: ^\S[\s\S]*$
          type: string
      required:
      - transactionId
      - identificationNumber
      - transactionName
      - creditDebitType
      - transactionType
      - brazilianAmount
      - amount
      - transactionDateTime
      - billPostDate
      - billForecastDate
      type: object
    CreditCardsAccountsTransactionAmount:
      description: "Valor original de la transacción. Expresado en valor monetario con un mínimo de 2 decimales y un máximo de 4 decimales. \nDebe ser siempre cumplimentado con el valor original de la transacción independientemente de la nacionalidad, sin convertirlo. \nPara compras en cuotas el valor del campo debe corresponder al valor de la cuota.   \n"
      properties:
        amount:
          description: Valor relacionado con el objeto.
          example: '1000.0400'
          format: double
          maxLength: 20
          minLength: 4
          pattern: ^\d{1,15}\.\d{2,4}$
          type: string
        currency:
          description: Moneda referente al valor monetario, siguiendo el modelo ISO-4217.
          example: BRL
          maxLength: 3
          pattern: ^[A-Z]{3}$
          type: string
      required:
      - amount
      - currency
      type: object
    CreditCardsAccountsTransactionAmountBills:
