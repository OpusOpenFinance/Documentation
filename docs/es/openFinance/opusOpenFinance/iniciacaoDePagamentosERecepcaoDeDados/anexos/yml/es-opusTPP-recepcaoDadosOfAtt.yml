    InvoiceFinancingsBallonPaymentAmount:
      type: object
      required:
        - amount
        - currency
      description: Valor monetario de la cuota no regular por vencer. Expresado en valor monetario con un mínimo de 2 y un máximo de 4 decimales.
      properties:
        amount:
          type: string
          format: double
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '1000.0400'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          description: 'Moneda referente al valor monetario, siguiendo el modelo ISO-4217.'
          example: BRL
    InvoiceFinancingsContract:
      type: object
      required:
        - contractNumber
        - ipocCode
        - productName
        - productType
        - productSubType
        - contractDate
        - contractAmount
        - instalmentPeriodicity
        - CET
        - amortizationScheduled
        - interestRates
        - contractedFees
        - contractedFinanceCharges
      properties:
        contractNumber:
          type: string
          maxLength: 100
          pattern: '^[\w\W]{1,100}$'
          example: '1324926521496'
          description: Número del contrato dado por la institución contratante.
        ipocCode:
          type: string
          maxLength: 67
          minLength: 22
          pattern: '^[\w\W]{22,67}$'
          description: |
            Número estandarizado del contrato - IPOC (Identificación Estandarizada de la Operación de Crédito). Según el DOC 3040, compuesta por:
            - **CNPJ de la institución:** 8 (ocho) posiciones iniciales;
            - **Modalidad de la operación:** 4 (cuatro) posiciones;
            - **Tipo del cliente:** 1 (una) posición( 1 = persona natural - CPF, 2= persona jurídica – CNPJ, 3 = persona física en el exterior, 4 = persona jurídica en el exterior, 5 = persona natural sin CPF y 6 = persona jurídica sin CNPJ);
            - **Código del cliente:** El número de posiciones varía conforme al tipo del cliente:
              1. Para clientes persona física con CPF (tipo de cliente = 1), informar las 11 (once) posiciones del CPF;
              2. Para clientes persona jurídica con CNPJ (tipo de cliente = 2), informar las 8 (ocho) posiciones iniciales del CNPJ;
              3. Para los demás clientes (tipos de cliente 3, 4, 5 y 6), informar 14 (catorce) posiciones con complemento de ceros a la izquierda si la identificación tiene un tamaño inferior;
            - **Código del contrato:** 1 (una) hasta 40 (cuarenta) posiciones, sin complemento de caracteres.
          example: '92792126019929279212650822221989319252576'
        productName:
          type: string
          maxLength: 140
          pattern: '^[^\s](.*[^\s])?$'
          example: AD
          description: |
            Denominación/Identificación del nombre de la Modalidad de la Operación de Crédito divulgado al cliente
        productType:
          $ref: '#/components/schemas/EnumContractProductTypeInvoiceFinancings'
        productSubType:
          $ref: '#/components/schemas/EnumContractProductSubTypeInvoiceFinancings'
        contractDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-01-05'
          description: Fecha de contratación de la operación de crédito. Especificación RFC-3339
        disbursementDates:
          type: array
          minItems: 1
          description: |
            Lista que presenta las Fechas de Desembolso del valor contratado.
          items:
            type: string
            format: date
            maxLength: 10
            pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
            example: '2018-01-15'
            description: |
              Fecha del Desembolso del valor contratado. Especificación RFC-3339.
              En el caso de una liberación de recursos realizada en D0 pero con referencia retroactiva realizada en D -1, contablemente la fecha correcta sería D -1.
        settlementDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-01-15'
          description: |
            Fecha de liquidación de la operación.
        contractAmount:
          type: string
          format: double
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: Valor contratado de la operación. Expresado en valor monetario con un mínimo de 2 y un máximo de 4 posiciones decimales. En los casos en que no exista este valor explícito en el contrato del producto, enviar como 0.00.
        currency:
          type: string
          maxLength: 3
          pattern: '^(\w{3}){1}$'
          example: BRL
          description: |
            Moneda referente al valor de la garantía, según el modelo ISO-4217. p.ej. 'BRL'
            Todos los valores monetarios informados están representados con la moneda vigente de Brasil
        dueDate:
          type: string
          format: date
          maxLength: 10
          minLength: 2
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2028-01-15'
          description: Fecha de vencimiento Final de la operación. Especificación RFC-3339
        instalmentPeriodicity:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractInstalmentPeriodicity'
        instalmentPeriodicityAdditionalInfo:
          type: string
          pattern: '^[^\s](.*[^\s])?$'
          maxLength: 50
          example: Informações adicionais sobre periodicidade
          description: |
            Campo obligatorio para complementar la información relativa a la periodicidad de pago regular cuando se tenga la opción OUTROS.
        firstInstalmentDueDate:
          type: string
          format: date
          maxLength: 10
          minLength: 2
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
          description: |
            Fecha de vencimiento de la primera cuota del principal.
        CET:
          type: string
          format: double
          maxLength: 13
          minLength: 8
          example: '0.290000'
          pattern: '^\d{1,6}\.\d{6}$'
          description: |
            CET – Costo Efectivo Total debe expresarse en forma de tasa porcentual anual e incorpora todos los cargos y gastos incidentes en las operaciones de crédito (tasa de interés, pero también tarifas, tributos, seguros y otros gastos cobrados).

            La cumplimentación debe respetar las 6 posiciones decimales, aunque vengan rellenas con ceros (representación de porcentaje p.ej.: 0.150000. Este valor representa el 15%. El valor 1 representa el 100%).

            Para el público PF (persona natural) el campo es de envío obligatorio para contratos firmados a partir de 2008, conforme a la Resolución CMN 3.517. Para el público PJ (persona jurídica) el campo es de envío obligatorio para contratos firmados a partir de 2011, conforme a la Resolución CMN 3.909. El campo podrá ser rellenado con 0.00 en escenarios en los cuales la institución no tenga la información de CET (Costo efectivo total), solo para las excepciones listadas a continuación:
            - En contratos anteriores a 2008 (para el público PF);
            - En contratos anteriores a 2011 (para el público PJ);
            - Público PJ de mediano o gran porte.
        amortizationScheduled:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractAmortizationScheduled'
        amortizationScheduledAdditionalInfo:
          type: string
          pattern: '^[^\s](.*[^\s])?$'
          maxLength: 200
          example: Informações complementares relativa à amortização do tipo 'OUTROS'
          description: |
            Campo obligatorio para complementar la información relativa a la amortización cuando se seleccione la opción OUTROS.
        interestRates:
          type: array
          minItems: 0
          description: |
            Objeto que presenta el conjunto de informaciones necesarias para demostrar la composición de las tasas de interés remuneratorias de la Modalidad de crédito.
            En caso de que el contrato no posea tasas de interés, debe compartirse una lista vacía. En caso de que el contrato posea una tasa de interés con valor 0, debe compartirse un objeto con el valor 0 de forma explícita.
          items:
            $ref: '#/components/schemas/InvoiceFinancingsContractInterestRate'
        contractedFees:
          type: array
          description: Lista que presenta las informaciones de las tarifas pactadas en el contrato.
          items:
            $ref: '#/components/schemas/InvoiceFinancingsContractedFee'
          minItems: 0
        contractedFinanceCharges:
          type: array
          description: Lista que presenta los cargos pactados en el contrato
          items:
            $ref: '#/components/schemas/InvoiceFinancingsFinanceCharge'
          minItems: 0
        hasInsuranceContracted:
          type: boolean
          description: Campo que identifica si existe seguro contratado para el Derecho Crediticio Descontado, donde seguro contratado es true y no contratado es false. El no envío del campo significa que la institución no ofrece este producto.
    InvoiceFinancingsContractedWarranty:
      type: object
      description: Conjunto de informaciones referentes a las garantías que avalan la operación de crédito contratada
      required:
        - currency
        - warrantyType
        - warrantySubType
        - warrantyAmount
      properties:
        currency:
          type: string
          pattern: '^(\w{3}){1}$'
          maxLength: 3
          description: 'Moneda referente al valor de la garantía, según el modelo ISO-4217. p.ej. ''BRL''. Todos los valores monetarios informados están representados con la moneda vigente de Brasil'
          example: BRL
        warrantyType:
          $ref: '#/components/schemas/InvoiceFinancingsEnumWarrantyType'
        warrantySubType:
          $ref: '#/components/schemas/InvoiceFinancingsEnumWarrantySubType'
        warrantyAmount:
          type: string
          format: double
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: |
            Valor original de la garantía. Expresado en valor monetario con un mínimo de 2 y un máximo de 4 posiciones decimales.

            [Restricción]  Para los casos en que warrantyType sea igual a "GARANTIA_FIDEJUSSORIA" el valor de la garantía corresponde a un porcentaje del total garantizado.
            De esta forma, los casos de garantía fideiusoria para los cuales no es posible determinar un valor monetario para la garantía deben ser rellenados con 0.00.
    InvoiceFinancingsContractInterestRate:
      type: object
      description: Objeto que presenta el conjunto de informaciones necesarias para demostrar la composición de las tasas de interés remuneratorias de la Modalidad de crédito
      required:
        - taxType
        - interestRateType
        - taxPeriodicity
        - calculation
        - referentialRateIndexerType
      properties:
        taxType:
          type: string
          description: |
            "Tipo de Tasa (ver  Enum)
            - NOMINAL (la tasa nominal es una tasa de interés en la que la unidad referencial no coincide con la unidad de tiempo de la capitalización. Ella siempre se proporciona en términos anuales, y sus períodos de capitalización pueden ser diarios, mensuales, trimestrales o semestrales. p.ej. Una tasa de 12% al año con capitalización mensual)
            - EFETIVA (Es la tasa de interés en la que la unidad referencial coincide con la unidad de tiempo de la capitalización. Como las unidades de medida de tiempo de la tasa de interés y de los períodos de capitalización son iguales, se usan ejemplos simples como 1% al mes, 60% al año)"
          enum:
            - NOMINAL
            - EFETIVA
          example: EFETIVA
        interestRateType:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractInterestRateType'
        taxPeriodicity:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractTaxPeriodicity'
        calculation:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractCalculation'
        referentialRateIndexerType:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractReferentialRateIndexerType'
        referentialRateIndexerSubType:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractReferentialRateIndexerSubType'
        referentialRateIndexerAdditionalInfo:
          type: string
          description: |
            Campo libre para complementar la información relativa al Tipo de tasa referencial o indexador.
            [Restricción] Obligatorio para complementar la información relativa al Tipo de tasa referencial o indexador, cuando se seleccione el tipo o subtipo OUTRO.
          maxLength: 140
          pattern: '^[^\s](.*[^\s])?$'
          example: Informações adicionais de Indexador ou tipo de taxa referencial
        preFixedRate:
          type: string
          format: double
          description: |
            Tasa prefijada aplicada bajo el contrato de la modalidad de crédito.
            p.ej. 0.014500. La cumplimentación debe respetar las 6 posiciones decimales, aunque vengan rellenas con ceros(representación de porcentaje p.ej.: 0.150000.
            Este valor representa el 15%. El valor 1 representa el 100%).
          maxLength: 9
          minLength: 8
          example: '0.600000'
          pattern: '^\d{1,2}\.\d{6}$'
        postFixedRate:
          type: string
          format: double
          description: |
            Tasa posfijada aplicada bajo el contrato de la modalidad de crédito.
            p.ej. 0.014500. La cumplimentación debe respetar las 6 posiciones decimales, aunque vengan rellenas con ceros (representación de porcentaje p.ej.: 0.150000.
            Este valor representa el 15%. El valor 1 representa el 100%).
          maxLength: 9
          minLength: 8
          example: '0.550000'
          pattern: '^\d{1,2}\.\d{6}$'
        additionalInfo:
          type: string
          maxLength: 1200
          description: |
            Texto con información adicional sobre la composición de las tasas de interés pactadas.

            [Restricción] En caso de que la institución posea la información para compartir, esta deberá ser informada.
          pattern: '^[^\s](.*[^\s])?$'
          example: Informações adicionais
    InvoiceFinancingsFinanceCharge:
      type: object
      description: Conjunto de informaciones referentes a la identificación de la operación de crédito
      required:
        - chargeType
      properties:
        chargeType:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractFinanceChargeType'
        chargeAdditionalInfo:
          type: string
          maxLength: 50
          description: |
            Campo para informaciones adicionales.

            [Restricción] Obligatorio si se selecciona la opción 'OUTROS' en Tipo de cargo pactado en el contrato.
          pattern: '^[^\s](.*[^\s])?$'
          example: Informações adicionais sobre encargos
        chargeRate:
          type: string
          format: double
          pattern: '^\d{1}\.\d{6}$'
          maxLength: 8
          minLength: 8
          description: |
            Representa el valor del cargo en porcentaje pactado en el contrato.
            La cumplimentación debe respetar las 6 posiciones decimales, aunque vengan rellenas con ceros
            (representación de porcentaje p.ej.: 0.150000. Este valor representa el 15%. El valor 1 representa el 100%).
          example: '0.071200'
    InvoiceFinancingsBalloonPayment:
      type: object
      description: Conjunto de informaciones relativas a las cuotas no regulares del contrato de la modalidad de crédito consultada
      required:
        - dueDate
        - amount
      properties:
        dueDate:
          description: 'Fecha de vencimiento de la cuota no regular  por vencer del contrato de la modalidad de crédito consultada, conforme a la especificación RFC-3339. p.ej. 2014-03-19'
          type: string
          maxLength: 10
          minLength: 2
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
        amount:
          $ref: '#/components/schemas/InvoiceFinancingsBallonPaymentAmount'
    InvoiceFinancingsInstalments:
      type: object
      description: Conjunto de informaciones referentes a las cuotas / pagos de la operación de crédito contratada
      required:
        - dueInstalments
        - pastDueInstalments
        - typeContractRemaining
        - typeNumberOfInstalments
        - paidInstalments
      properties:
        typeNumberOfInstalments:
          type: string
          description: Tipo de plazo total del contrato referente a la modalidad de crédito informada.
          enum:
            - DIA
            - SEMANA
            - MES
            - ANO
            - SEM_PRAZO_TOTAL
          example: MES
        totalNumberOfInstalments:
          type: number
          maximum: 999999
          example: 130632
          description: |
            Plazo Total según el tipo (día, semana, mes, año) referente a la Modalidad de Crédito informada.

            [Restricción] Obligatoriamente debe ser cumplimentado en caso de que typeNumberOfInstalments sea diferente de SEM_PRAZO_TOTAL.
        typeContractRemaining:
          type: string
          enum:
            - DIA
            - SEMANA
            - MES
            - ANO
            - SEM_PRAZO_REMANESCENTE
          description: |
            Tipo de plazo remanente del contrato referente a la modalidad de crédito informada.
        contractRemainingNumber:
          type: number
          maximum: 999999
          description: |
            Plazo Remanente según el tipo (día, semana, mes, año) referente a la Modalidad de Crédito informada.

            [Restricción] Obligatoriamente debe ser cumplimentado en caso de que el typeContractRemaining sea diferente de SEM_PRAZO_REMANESCENTE.
          example: 14600
        paidInstalments:
          type: number
          description: 'Cantidad de cuotas pagadas. (En el caso de modalidades que no posean cuotas, el número de cuotas es igual a cero)'
          maximum: 999999
          example: 73
        dueInstalments:
          type: number
          maximum: 999999
          description: 'Cantidad de cuotas por vencer.(En el caso de modalidades que no posean cuotas, el número de cuotas es igual a cero)'
          example: 57
        pastDueInstalments:
          type: number
          maximum: 999999
          description: 'Cantidad de cuotas vencidas. (En el caso de modalidades que no posean cuotas, el número de cuotas es igual a cero)'
          example: 73
        balloonPayments:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceFinancingsBalloonPayment'
          minItems: 1
          description: Lista que presenta las fechas de vencimiento y el valor de las cuotas no regulares del contrato de la modalidad de crédito consultada
    InvoiceFinancingsContractData:
      type: object
      description: Conjunto de informaciones de anticipo de cuentas por cobrar mantenidos por el cliente en la institución transmisora y para los cuales él haya otorgado consentimiento
      required:
        - contractId
        - brandName
        - companyCnpj
        - productType
        - productSubType
        - ipocCode
      properties:
        contractId:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          maxLength: 100
          minLength: 1
          example: '92792126019929279212650822221989319252576'
          description: 'Identifica de forma única el contrato de la operación de crédito del cliente, manteniendo las reglas de inmutabilidad dentro de la institución transmisora.'
        brandName:
          type: string
          description: 'Nombre de la Marca reportada por el participante en el Open Finance. Se recomienda utilizar, siempre que sea posible, el mismo nombre de marca atribuido en el campo del directorio Customer Friendly Server Name (Authorisation Server).'
          pattern: '^[^\s](.*[^\s])?$'
          maxLength: 80
          example: Organização A
        companyCnpj:
          type: string
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          description: 'Registro completo del CNPJ de la institución responsable del Registro - el CNPJ corresponde a la representación alfanumérica de la inscripción en el Cadastro de Pessoa Jurídica. Se deben tener únicamente los caracteres del CNPJ, sin máscara.'
          maxLength: 14
          example: '21128159000166'
        productType:
          $ref: '#/components/schemas/EnumContractProductTypeInvoiceFinancings'
        productSubType:
          $ref: '#/components/schemas/EnumContractProductSubTypeInvoiceFinancings'
        ipocCode:
          type: string
          maxLength: 67
          minLength: 22
          pattern: '^[\w\W]{22,67}$'
          description: |
            Número estandarizado del contrato - IPOC (Identificación Estandarizada de la Operación de Crédito). Según el DOC 3040, compuesta por:
            - **CNPJ de la institución:** 8 (ocho) posiciones iniciales;
            - **Modalidad de la operación:** 4 (cuatro) posiciones;
            - **Tipo del cliente:** 1 (una) posición( 1 = persona natural - CPF, 2= persona jurídica – CNPJ, 3 = persona física en el exterior, 4 = persona jurídica en el exterior, 5 = persona natural sin CPF y 6 = persona jurídica sin CNPJ);
            - **Código del cliente:** El número de posiciones varía conforme al tipo del cliente:
              1. Para clientes persona física con CPF (tipo de cliente = 1), informar las 11 (once) posiciones del CPF;
              2. Para clientes persona jurídica con CNPJ (tipo de cliente = 2), informar las 8 (ocho) posiciones iniciales del CNPJ;
              3. Para los demás clientes (tipos de cliente 3, 4, 5 y 6), informar 14 (catorce) posiciones con complemento de ceros a la izquierda si la identificación tiene un tamaño inferior;
            - **Código del contrato:** 1 (una) hasta 40 (cuarenta) posiciones, sin complemento de caracteres.
          example: '92792126019929279212650822221989319252576'
    InvoiceFinancingsPayments:
      type: object
      description: Conjunto de informaciones de los pagos referentes a las operaciones de derechos crediticios descontados contratadas
      required:
        - contractOutstandingBalance
        - releases
      properties:
        paidInstalments:
          type: number
          maximum: 999
          example: 73
          description: Cantidad total de cuotas pagadas del contrato referente a la Modalidad de Crédito informada.
        contractOutstandingBalance:
          type: string
          format: double
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: Valor necesario para que el cliente liquide la deuda, o sea, este campo debe ser cumplimentado con el saldo deudor actualizado descrito en el DDC (Documento Descritivo de Crédito).
        releases:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/InvoiceFinancingsReleases'
          description: Lista de los pagos realizados en el período.
    InvoiceFinancingsReleases:
      type: object
      description: Lista de los pagos realizados en el período
      required:
        - isOverParcelPayment
        - paidDate
        - currency
        - paidAmount
      properties:
        paymentId:
          type: string
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: XlthLXpBLVowLTldW2EtekEtWjAtOVwtXXswLDk5fSQ
          description: Identificador de pago de responsabilidad de cada institución transmisora.
        isOverParcelPayment:
          type: boolean
          example: true
          description: Identifica si es un pago pactado (false) o suelto (true).
        instalmentId:
          type: string
          maxLength: 100
          pattern: '^[^\s](.*[^\s])?$'
          example: '15'
          description: |
            Identificador de cuota, de responsabilidad de cada institución transmisora.
            [Restricción] Información de envío obligatorio cuando isOverParcelPayment tenga el valor FALSE.
        paidDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: 'Fecha efectiva del pago referente al contrato de la modalidad de crédito consultada, conforme a la especificación RFC-3339. p.ej. 2014-03-19'
        currency:
          type: string
          maxLength: 3
          pattern: '^(\w{3}){1}$'
          example: BRL
          description: |
            Moneda referente al valor monetario informado, según el modelo ISO-4217. p.ej. ''BRL'''.
            Todos los valores monetarios informados están representados con la moneda vigente de Brasil.
        paidAmount:
          type: string
          format: double
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '1000.0400'
          description: |
            Valor del pago referente al  contrato de la modalidad de crédito consultada.
            Expresado en valor monetario con un mínimo de 2 y un máximo de 4 posiciones decimales.
        overParcel:
          type: object
          description: |
            Objeto de las tarifas y cargos que fueron pagados fuera de la cuota.

            [Restricción] La información debe ser enviada en caso de que exista.
          required:
            - fees
            - charges
          properties:
            fees:
              type: array
              minItems: 0
              items:
                $ref: '#/components/schemas/InvoiceFinancingsFeeOverParcel'
              description: 'Lista de las tarifas que fueron pagadas fuera de la cuota, solo para pago suelto.'
            charges:
              type: array
              minItems: 0
              items:
                $ref: '#/components/schemas/InvoiceFinancingsChargeOverParcel'
              description: Lista de los cargos que fueron pagados fuera de la cuota.
    InvoiceFinancingsFeeOverParcel:
      type: object
      required:
        - feeName
        - feeCode
        - feeAmount
      properties:
        feeName:
          type: string
          maxLength: 140
          minLength: 2
          pattern: '[\w\W\s]+'
          description: |
            Denominación de la Tarifa pactada.
          example: Excesso em Conta
        feeCode:
          type: string
          maxLength: 140
          minLength: 2
          pattern: '[\w\W\s]+'
          description: |
            Sigla identificadora de la tarifa pactada.
          example: EXCESSO_CONTA
        feeAmount:
          type: string
          format: double
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '1000.0400'
          description: |
            Valor monetario de la tarifa pactada en el contrato.

            Expresado en valor monetario con un mínimo de 2 y un máximo de 4 posiciones decimales.
    InvoiceFinancingsChargeOverParcel:
      type: object
      required:
        - chargeType
        - chargeAmount
      properties:
        chargeType:
          type: string
          description: Tipo de cargo pactado en el contrato.
          enum:
            - JUROS_REMUNERATORIOS_POR_ATRASO
            - MULTA_ATRASO_PAGAMENTO
            - JUROS_MORA_ATRASO
            - IOF_CONTRATACAO
            - IOF_POR_ATRASO
            - SEM_ENCARGO
            - OUTROS
          example: JUROS_REMUNERATORIOS_POR_ATRASO
        chargeAdditionalInfo:
          type: string
          description: |
            Campo libre para la cumplimentación de la información adicional referente al cargo.

            [Restricción] Obligatorio cuando chargeType sea igual a 'OUTROS'.
          pattern: '^[^\s](.*[^\s])?$'
          example: Informações adicionais
          maxLength: 140
        chargeAmount:
          type: string
          format: double
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '1000.0400'
          description: Valor del pago del cargo pagado fuera de la cuota. Expresado en valor monetario con un mínimo de 2 y un máximo de 4 decimales.
    InvoiceFinancingsLinks:
      type: object
      description: Referencias a otros recursos de la API solicitada.
      required:
