          format: url
          maxLength: 4048
          description: URI de la primera página que originó esta lista de resultados. Restricción - Obligatorio cuando no sea la primera página de la respuesta
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        prev:
          type: string
          format: url
          maxLength: 4048
          description: "URI de la página anterior de esta lista de resultados. Restricción - Obligatorio cuando no sea la primera página de la respuesta"
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        next:
          type: string
          format: url
          maxLength: 4048
          description: URI de la página siguiente de esta lista de resultados. Restricción - Obligatorio cuando no sea la última página de la respuesta
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
    BankFixedIncomesMeta:
      type: object
      description: Metainformación referente a la API solicitada.
      required:
        - totalRecords
        - totalPages
        - requestDateTime
      properties:
        totalRecords:
          type: integer
          format: int32
          description: Número total de registros en el resultado
          example: 1
        totalPages:
          type: integer
          format: int32
          description: Número total de páginas en el resultado
          example: 1
        requestDateTime:
          description: 'Fecha y hora de la consulta, conforme a la especificación RFC-3339, formato UTC.'
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
      additionalProperties: false
    BankFixedIncomesTransactionsMeta:
      type: object
      description: Metainformación referente a la API solicitada.
      required:
        - requestDateTime
      properties:
        requestDateTime:
          description: 'Fecha y hora de la consulta, conforme a la especificación RFC-3339, formato UTC.'
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
      additionalProperties: false
    BankFixedIncomesResponseBalances:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: object
          required:
            - referenceDateTime
            - quantity
            - updatedUnitPrice
            - grossAmount
            - netAmount
            - incomeTax
            - financialTransactionTax
            - blockedBalance
            - purchaseUnitPrice
          properties:
            referenceDateTime:
              type: string
              format: date-time
              description: |
                Fecha y hora de la última posición consolidada a la que se refieren los datos transaccionales del cliente disponibles en los canales electrónicos.
                En la representación de la fecha se deben considerar los minutos y segundos como cero (00:00:00Z).
              pattern: '(^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$)'
              example: '2022-07-21T17:32:00Z'
              maxLength: 20
            quantity:
              type: string
              format: double
              description: Cantidad de títulos mantenidos en la fecha de la posición del cliente
              maxLength: 26
              pattern: '^\d{1,15}\.\d{2,10}$'
              example: '1000.0004'
            updatedUnitPrice:
              type: object
              required:
                - amount
                - currency
              description: Valor bruto unitario actualizado en la fecha de referencia.
              properties:
                amount:
                  description: Valor relacionado con el objeto.
                  type: string
                  format: double
                  maxLength: 26
                  pattern: '^\d{1,15}\.\d{2,10}$'
                  example: '1000.000004'
                currency:
                  $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
            grossAmount:
              description: Valor de la inversión que se refiere a la cantidad multiplicada por el PU actualizado en la fecha de referencia;
              type: object
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  maxLength: 20
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  example: '1000.0004'
                  description: Valor relacionado con el objeto.
                currency:
                  $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
            netAmount:
              description: 'Valor de la inversión actualizado en la fecha de referencia, posterior a la deducción de impuestos (IOF e IR).'
              type: object
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  maxLength: 20
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  example: '1000.0004'
                  description: Valor relacionado con el objeto.
                currency:
                  $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
            incomeTax:
              type: object
              required:
                - amount
                - currency
              description: Valor del impuesto a la renta provisionado considerando la tasa vigente en la fecha de referencia.
              properties:
                amount:
                  type: string
                  format: double
                  maxLength: 20
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  example: '1000.0004'
                  description: Valor relacionado con el objeto.
                currency:
                  $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
            financialTransactionTax:
              type: object
              required:
                - amount
                - currency
              description: Valor del impuesto (IOF) provisionado considerando la tasa vigente en la fecha de referencia.
              properties:
                amount:
                  type: string
                  format: double
                  maxLength: 20
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  example: '1000.0004'
                  description: Valor relacionado con el objeto.
                currency:
                  $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
            blockedBalance:
              type: object
              required:
                - amount
                - currency
              description: Valor no disponible para movimiento en aquel momento por cualquier motivo (bloqueo judicial, bloqueo en garantía, entre otros). El plazo de carencia no se considera como bloqueo.
              properties:
                amount:
                  type: string
                  format: double
                  maxLength: 20
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  example: '1000.0004'
                  description: Valor relacionado con el objeto.
                currency:
                  $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
            purchaseUnitPrice:
              type: object
              required:
                - amount
                - currency
              description: Valor unitario negociado con el cliente en la fecha de adquisición
              properties:
                amount:
                  type: string
                  format: double
                  maxLength: 24
                  pattern: '^\d{1,15}\.\d{2,8}$'
                  example: '1000.000004'
                  description: Valor relacionado con el objeto.
                currency:
                  $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
            preFixedRate:
              type: string
              format: double
              description: |
                Tasa de remuneración acordada con el cliente en la contratación. En casos de productos progresivos, considerar la tasa máxima contratada.
              pattern: '^-?\d{1}\.\d{6}$'
              maxLength: 9
              minLength: 8
              example: '0.300000'
            postFixedIndexerPercentage:
              type: string
              format: double
              description: |
                Porcentaje del indexador acordado con el cliente en la contratación. En casos de productos progresivos, considerar la tasa máxima contratada.
              pattern: '^-?\d{1}\.\d{6}$'
              maxLength: 9
              minLength: 8
              example: '1.000000'
        links:
          $ref: '#/components/schemas/BankFixedIncomesLinks'
        meta:
          $ref: '#/components/schemas/BankFixedIncomesMeta'
      additionalProperties: false
    BankFixedIncomesResponseTransactions:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/BankFixedIncomesProductMovement'
        links:
          $ref: '#/components/schemas/BankFixedIncomesTransactionsLinks'
        meta:
          $ref: '#/components/schemas/BankFixedIncomesTransactionsMeta'
      additionalProperties: false
    BankFixedIncomesProductMovement:
      type: object
      required:
        - type
        - transactionType
        - transactionDate
        - transactionUnitPrice
        - transactionQuantity
        - transactionGrossValue
        - transactionNetValue
        - transactionId
      properties:
        type:
          $ref: '#/components/schemas/BankFixedIncomesEnumMovementType'
        transactionType:
          $ref: '#/components/schemas/BankFixedIncomesEnumTransactionType'
        transactionTypeAdditionalInfo:
          type: string
          maxLength: 100
          pattern: '[\w\W\s]*'
          description: |
            Información adicional del tipo de movimiento, para cumplimentar en el caso de movimientos no delimitados en el dominio.

            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando haya 'Outros' en el campo Motivo del movimiento.
        transactionDate:
          type: string
          format: date
          maxLength: 10
          minLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
          description: Fecha del movimiento.
        transactionUnitPrice:
          type: object
          description: Precio unitario bruto negociado en la transacción.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              maxLength: 24
              pattern: '^\d{1,15}\.\d{2,8}$'
              example: '1000.04'
            currency:
              $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
        transactionQuantity:
          type: string
          format: double
          maxLength: 24
          pattern: '^\d{1,15}\.\d{2,8}$'
          example: '42.25'
          description: Cantidad de títulos involucrados en el movimiento.
        transactionGrossValue:
          type: object
          description: Valor bruto de la transacción (Precio unitario del movimiento x Cantidad).
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              maxLength: 20
              pattern: '^\d{1,15}\.\d{2,4}$'
              example: '1000.04'
            currency:
              $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
        incomeTax:
          type: object
          description: |
            Valor del impuesto a la renta recaudado en la transacción.

            [Restricción] Campo de cumplimentación obligatoria para los productos a los cuales esta tasa se aplica cuando el campo `type` sea rellenado con el valor `SAIDA`.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              maxLength: 20
              pattern: '^\d{1,15}\.\d{2,4}$'
              example: '1000.04'
            currency:
              $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
        financialTransactionTax:
          type: object
          description: |
            Valor del IOF recaudado en la transacción.

            [Restricción] Campo de cumplimentación obligatoria para los productos a los cuales esta tasa se aplica cuando el campo `type` sea rellenado con el valor `SAIDA`.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              maxLength: 20
              pattern: '^\d{1,15}\.\d{2,4}$'
              example: '1000.04'
              description: Valor relacionado con el objeto.
            currency:
              $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
        transactionNetValue:
          type: object
          description: Valor neto de la transacción.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              maxLength: 20
              pattern: '^\d{1,15}\.\d{2,4}$'
              example: '1000.04'
              description: Valor relacionado con el objeto.
            currency:
              $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
        remunerationTransactionRate:
          type: string
          format: double
          maxLength: 9
          minLength: 8
          pattern: '^-?\d{1}\.\d{6}$'
          example: '0.300000'
          description: |
            Tasa de remuneración de la transacción.

            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando el campo 'type' sea rellenado con el valor 'ENTRADA' y se trate de un producto prefijado o híbrido.
        indexerPercentage:
          type: string
          format: double
          maxLength: 8
          minLength: 8
          pattern: '^\d{1}\.\d{6}$'
          example: '1.100000'
          description: |
            Porcentaje máximo del indexador acordado con el cliente en la contratación.

            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando el campo 'type' sea rellenado con el valor 'ENTRADA' y se trate de un producto posfijado o híbrido.
        transactionId:
          type: string
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: ABCD2126019929279212650822221989319253344
          description: Código o identificador único proporcionado por la institución que mantiene la representación individual del movimiento.
      additionalProperties: false
    BankFixedIncomesEnumMovementType:
      type: string
      description: |
        Tipo de movimiento en la visión de inversión

        - ENTRADA: APLICACAO, CANCELAMENTO, TRANSFERENCIA_TITULARIDADE, TRANSFERENCIA_CUSTODIA, OUTROS.

        - SAIDA: RESGATE, CANCELAMENTO, VENCIMENTO, PAGAMENTO_JUROS, AMORTIZACAO, TRANSFERENCIA_TITULARIDADE, TRANSFERENCIA_CUSTODIA, OUTROS.
      enum:
        - ENTRADA
        - SAIDA
      example: ENTRADA
    BankFixedIncomesEnumTransactionType:
      type: string
      description: Aplicación, rescate, cancelación, vencimiento, pago de intereses, amortización, transferencia de titularidad, transferencia de custodia y otros.
      enum:
        - APLICACAO
        - RESGATE
        - CANCELAMENTO
        - VENCIMENTO
        - PAGAMENTO_JUROS
        - AMORTIZACAO
        - TRANSFERENCIA_TITULARIDADE
        - TRANSFERENCIA_CUSTODIA
        - OUTROS
      example: APLICACAO
    CreditFixedIncomesResponseInvestmentList:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            type: object
            description: Lista de títulos de renta fija crédito mantenidos por el cliente en la institución transmisora y para los cuales él haya otorgado consentimiento
            required:
              - brandName
              - companyCnpj
              - investmentType
              - investmentId
            properties:
              brandName:
                type: string
                description: 'Nombre de la Marca reportada por el participante en el Open Finance. Se recomienda utilizar, siempre que sea posible, el mismo nombre de marca atribuido en el campo del directorio Customer Friendly Server Name (Authorisation Server).'
                pattern: '^[^\s](.*[^\s])?$'
                maxLength: 80
                example: Organização A
              companyCnpj:
                type: string
                description: 'Registro completo del CNPJ de la institución responsable del Registro - el CNPJ corresponde a la representación alfanumérica de la inscripción en el Cadastro de Pessoa Jurídica. Se deben tener solo los caracteres del CNPJ, sin máscara'
                maxLength: 14
                pattern: '^[0-9A-Z]{12}[0-9]{2}$'
                example: '21128159000166'
              investmentType:
                $ref: '#/components/schemas/CreditFixedIncomesEnumInvestmentType'
              investmentId:
                type: string
                description: 'Identifica de forma única  la relación del cliente con el producto, manteniendo las reglas de inmutabilidad dentro de la institución transmisora.'
                maxLength: 100
                pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
                example: '92792126019929200000000000000000000000000'
            additionalProperties: false
        links:
          $ref: '#/components/schemas/CreditFixedIncomesProductListLinks'
        meta:
          $ref: '#/components/schemas/CreditFixedIncomesMeta'
      additionalProperties: false
    CreditFixedIncomesResponseProductIdentification:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          $ref: '#/components/schemas/CreditFixedIncomesIdentification'
        links:
          $ref: '#/components/schemas/CreditFixedIncomesLinks'
        meta:
          $ref: '#/components/schemas/CreditFixedIncomesMeta'
      additionalProperties: false
    CreditFixedIncomesIdentification:
      type: object
      required:
        - investmentType
        - remuneration
        - issueUnitPrice
        - issueDate
        - dueDate
        - voucherPaymentIndicator
        - purchaseDate
        - taxExemptProduct
      properties:
        issuerInstitutionCnpjNumber:
          type: string
          description: |
            CNPJ de la institución emisora.

            En caso de que la institución tenga la información, el envío será obligatorio.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '11225860000140'
        isinCode:
          type: string
          description: |
            El Código ISIN es un código universal que identifica cada valor mobiliario o instrumento financiero, conforme a la Norma ISO 6166. En caso de que la transmisora posea la información, el envío de este campo es obligatorio.

            [Restricción] Debe ser rellenado en los casos en que el 'clearingCode' no sea rellenado.
          maxLength: 12
          pattern: '^[A-Z]{2}([A-Z0-9]){9}\d{1}$'
          example: BRCST4CTF001
        investmentType:
          $ref: '#/components/schemas/CreditFixedIncomesEnumInvestmentType'
        debtorCnpjNumber:
          type: string
          description: |
            CNPJ del deudor. En caso de que la transmisora posea la información para los productos CRI y CRA, el envío de este campo es obligatorio.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '11225860000140'
        debtorName:
          type: string
          description: |
            Nombre del deudor. En caso de que la transmisora posea la información para los productos CRI y CRA, el envío de este campo es obligatorio.
          pattern: '[\w\W\s]*'
          maxLength: 70
          example: Roberto Marino
        taxExemptProduct:
          $ref: '#/components/schemas/CreditFixedIncomesEnumTaxExemptProduct'
        remuneration:
          $ref: '#/components/schemas/CreditFixedIncomesRemuneration'
        issueUnitPrice:
          type: object
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              description: Valor relacionado con el objeto.
              maxLength: 24
              pattern: '^\d{1,15}\.\d{2,8}$'
              example: '1000.000004'
            currency:
              $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
        issueDate:
          type: string
          format: date
          description: Fecha de emisión del título
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-16'
        dueDate:
          type: string
          format: date
          description: Fecha de vencimiento del título
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
        voucherPaymentIndicator:
          $ref: '#/components/schemas/CreditFixedIncomesEnumVoucherPaymentIndicator'
        voucherPaymentPeriodicity:
          $ref: '#/components/schemas/CreditFixedIncomesEnumVoucherPaymentPeriodicity'
        voucherPaymentPeriodicityAdditionalInfo:
          type: string
          description: |
            Informaciones adicionales de la periodicidad de pago de cupón
            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando haya 'Outros' en el campo 'voucherPaymentPeriodicity'.
          maxLength: 50
          pattern: '[\w\W\s]*'
          example: Diária
        clearingCode:
          type: string
          description: |
            Código de registro del activo en la Clearing. En caso de que la transmisora posea la información, el envío de este campo es obligatorio.

            [Restricción] Debe ser rellenado en los casos en que el 'isinCode' no sea rellenado.
          maxLength: 30
          pattern: '[\w\W-]*'
          example: CDB421GPXXX
        purchaseDate:
          type: string
          format: date
          description: Fecha de adquisición del cliente
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
        gracePeriodDate:
          type: string
          format: date
          description: |
            Fecha hasta la cual el cliente no podrá rescatar anticipadamente su inversión.

            En caso de que la institución tenga la información, el envío será obligatorio.
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-16'
      additionalProperties: false
    CreditFixedIncomesEnumInvestmentType:
      type: string
      description: 'Especificación del activo en cuestión (Debentures, CRI o CRA).'
      enum:
        - DEBENTURES
        - CRI
        - CRA
      example: CRI
    CreditFixedIncomesEnumTaxExemptProduct:
      type: string
      description: Indicador de un producto incentivado
      enum:
        - SIM
        - NAO
      example: SIM
    CreditFixedIncomesEnumVoucherPaymentIndicator:
      type: string
      description: |
        Indicativo de si hay pago de cupón
          1. Sí
          2. No
      enum:
        - SIM
        - NAO
      example: SIM
    CreditFixedIncomesEnumVoucherPaymentPeriodicity:
      type: string
      description: |
        En caso de haber pago de cupón, describir la periodicidad (mensual, trimestral, semestral, anual, irregular y otros)
      enum:
        - MENSAL
        - TRIMESTRAL
        - SEMESTRAL
        - ANUAL
        - IRREGULAR
        - OUTROS
      example: MENSAL
    CreditFixedIncomesRemuneration:
      type: object
      required:
        - indexer
      properties:
        preFixedRate:
          type: string
          description: |
            Valor de la tasa de emisión del contrato.
            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando haya 'PRE_FIXADO' en el campo 'indexer' o cuando se trate de un producto con remuneración híbrida.
          maxLength: 9
          pattern: '^-?\d{1}\.\d{6}$'
          example: '0.300000'
        postFixedIndexerPercentage:
          type: string
          description: |
            Porcentaje del indexador de emisión del contrato.
            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando el campo 'indexer' sea rellenado de forma diferente de 'PRE_FIXADO' o cuando se trate de un producto con remuneración híbrida.
          maxLength: 9
          pattern: '^-?\d{1}\.\d{6}$'
          example: '1.100000'
        rateType:
          $ref: '#/components/schemas/CreditFixedIncomesEnumRateType'
        ratePeriodicity:
          $ref: '#/components/schemas/CreditFixedIncomesEnumRatePeriodicity'
        calculation:
          $ref: '#/components/schemas/CreditFixedIncomesEnumCalculation'
        indexer:
          $ref: '#/components/schemas/CreditFixedIncomesEnumIndexer'
        indexerAdditionalInfo:
          type: string
          description: |
            Informaciones adicionales del indexador
            [Restricción] Campo de cumplimentación obligatoria por las participantes cuando haya 'Outros' en el campo 'indexer'.
          pattern: '[\w\W\s]*'
          maxLength: 50
          example: Dólar
    CreditFixedIncomesEnumRateType:
      type: string
      description: |
        Tipo de la tasa de remuneración (lineal o exponencial).

        En caso de que la institución tenga la información, el envío será obligatorio.
      enum:
        - LINEAR
        - EXPONENCIAL
      example: LINEAR
    CreditFixedIncomesEnumRatePeriodicity:
      type: string
      description: |
        Periodicidad de la tasa de remuneración (mensual, anual, diaria, semestral).

        En caso de que la institución tenga la información, el envío será obligatorio.
      enum:
        - MENSAL
        - ANUAL
        - DIARIO
        - SEMESTRAL
      example: MENSAL
    CreditFixedIncomesEnumCalculation:
      type: string
      description: |
        Base de cálculo (días hábiles o días corridos).

        En caso de que la institución tenga la información, el envío será obligatorio.
      enum:
        - DIAS_UTEIS
        - DIAS_CORRIDOS
      example: DIAS_CORRIDOS
    CreditFixedIncomesEnumIndexer:
      type: string
      description: 'Índice utilizado como referencia para la corrección de la rentabilidad y/o los rendimientos del activo (CDI, DI, TR, IPCA, IGP_M, IGP_DI, INPC, BCP, TLC, SELIC, PRE_FIXADO y OUTROS)'
      enum:
        - CDI
        - DI
        - TR
        - IPCA
        - IGP_M
        - IGP_DI
