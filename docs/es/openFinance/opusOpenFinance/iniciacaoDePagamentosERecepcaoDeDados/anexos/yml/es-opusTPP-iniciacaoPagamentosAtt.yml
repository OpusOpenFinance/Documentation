              type: object
              description: Objeto que consolida los datos del documento del usuario que solicitó la cancelación.
              required:
                - identification
                - rel
              properties:
                identification:
                  type: string
                  maxLength: 11
                  description: Número del documento del usuario pagador responsable de la cancelación del pago.
                  example: '11111111111'
                  pattern: '^\d{11}$'
                rel:
                  type: string
                  maxLength: 3
                  description: Tipo del documento del usuario pagador responsable de la cancelación del pago.
                  example: CPF
                  pattern: '^[A-Z]{3}$'
    EnumPaymentCancellationReasonType:
      type: string
      enum:
        - CANCELADO_PENDENCIA
        - CANCELADO_AGENDAMENTO
        - CANCELADO_MULTIPLAS_ALCADAS
      example: CANCELADO_PENDENCIA
      description: |
        La cumplimentación de ese campo para el retorno debe ser realizada por la institución detentora de cuentas a partir del estado en que el pago se encuentre en el momento de la solicitud de la cancelación (ej. Estado de pago = PDNG, el campo debe completarse con el enum CANCELADO_PENDENCIA)

        Valores posibles:

        CANCELADO_PENDENCIA - Pago cancelado mientras estaba en la situación PDNG

        CANCELADO_AGENDAMENTO - Pago cancelado mientras estaba en la situación SCHD

        CANCELADO_MULTIPLAS_ALCADAS - Pago cancelado mientras estaba en la situación PATC
    EnumPaymentCancellationFromType:
      type: string
      enum:
        - INICIADORA
        - DETENTORA
      example: INICIADORA
      description: |
        Campo utilizado para informar el medio por el cual se realizó la cancelación.

        Valores posibles:

        INICIADORA - Pago cancelado por el usuario pagador en los canales de la institución iniciadora

        DETENTORA - Pago cancelado por el usuario pagador en los canales de la institución detentora
    ResponsePatchPixPayment:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          $ref: '#/components/schemas/ResponsePatchPixPaymentData'
        links:
          $ref: '#/components/schemas/LinkSingle'
        meta:
          $ref: '#/components/schemas/RegulatoryMeta'
    ResponsePatchPixPaymentData:
      type: object
      description: Objeto que contiene datos del pago y de la cuenta del receptor (creditor).
      required:
        - paymentId
        - endToEndId
        - consentId
        - creationDateTime
        - statusUpdateDateTime
        - status
        - localInstrument
        - payment
        - creditorAccount
        - cnpjInitiator
        - debtorAccount
        - cancellation
      properties:
        paymentId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9\-]{0,99}$'
          example: TXpRMU9UQTROMWhZV2xSU1FUazJSMDl
          description: |
            Código o identificador único informado por la institución detentora de la cuenta para representar
            la iniciación de pago individual. El `paymentId` debe ser diferente del `endToEndId`.
            Este es el identificador que deberá utilizarse en la consulta del estado de la iniciación de pago efectuada.
        endToEndId:
          $ref: '#/components/schemas/EndToEndId'
        consentId:
          type: string
          maxLength: 256
          pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
          example: 'urn:bancoex:C1DD33123'
          description: |
            Identificador único del consentimiento creado para la iniciación de pago solicitada. Deberá ser un URN - Uniform Resource Name.
            Un URN, conforme se define en la [RFC8141](https://tools.ietf.org/html/rfc8141), es un Uniform Resource
            Identifier - URI - que se asigna bajo el URI scheme "urn" y un namespace URN específico, con la intención de que el URN
            sea un identificador de recurso persistente e independiente de la ubicación.
            Considerando la cadena urn:bancoex:C1DD33123 como ejemplo de consentId tenemos:
            - el namespace (urn)
            - el identificador asociado al namespace de la institución transmisora (bancoex)
            - el identificador específico dentro del namespace (C1DD33123).
            Información más detallada sobre la construcción de namespaces debe consultarse en la [RFC8141](https://tools.ietf.org/html/rfc8141).
        creationDateTime:
          type: string
          format: date-time
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2020-07-21T08:30:00Z'
          description: |
            Fecha y hora en que el recurso fue creado.
            Una cadena con fecha y hora conforme a la especificación RFC-3339,
            siempre con la utilización de la timezone UTC (UTC time format).
        statusUpdateDateTime:
          type: string
          format: date-time
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2020-07-21T08:30:00Z'
          description: |
            Fecha y hora de la última actualización de la iniciación de pago.
            Una cadena con fecha y hora conforme a la especificación RFC-3339,
            siempre con la utilización de la timezone UTC (UTC time format).
        proxy:
          $ref: '#/components/schemas/ProxyV5'
        status:
          $ref: '#/components/schemas/EnumPaymentStatusType'
        rejectionReason:
          $ref: '#/components/schemas/RejectionReason'
        localInstrument:
          $ref: '#/components/schemas/EnumLocalInstrumentV5'
        cnpjInitiator:
          type: string
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          maxLength: 14
          example: '50685362000135'
          description: CNPJ del Iniciador de Pago debidamente habilitado para la prestación del Servicio de Iniciación en el Pix.
        payment:
          $ref: '#/components/schemas/PaymentPix'
        transactionIdentification:
          $ref: '#/components/schemas/TxId'
        remittanceInformation:
          type: string
          maxLength: 140
          pattern: '[\w\W\s]*'
          example: Pagamento da nota RSTO035-002.
          description: |
            Debe completarse siempre que el usuario pagador introduzca alguna información adicional en un pago, a ser enviada al receptor.
        creditorAccount:
          $ref: '#/components/schemas/CreditorAccountV5'
        cancellation:
          $ref: '#/components/schemas/PatchPixPaymentCancellation'
        debtorAccount:
          $ref: '#/components/schemas/DebtorAccountV5'
        authorisationFlow:
          type: string
          enum:
            - HYBRID_FLOW
            - CIBA_FLOW
            - FIDO_FLOW
          example: HYBRID_FLOW
          description: |
            Campo condicional utilizado para identificar el flujo de autorización en el que el pago fue solicitado.

            [Restricción] Si CIBA o FIDO, la cumplimentación es obligatoria. En caso de que el campo no esté presente en el payload, se entiende que el flujo de autorización utilizado es el HYBRID_FLOW.
