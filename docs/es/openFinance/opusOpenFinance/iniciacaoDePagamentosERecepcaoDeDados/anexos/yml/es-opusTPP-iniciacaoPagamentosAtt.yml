    LoggedUser:
      type: object
      description: Usuario (persona natural) que se encuentra conectado en la institución Iniciadora de Pago.
      required:
        - document
      properties:
        document:
          type: object
          required:
            - identification
            - rel
          properties:
            identification:
              type: string
              maxLength: 11
              description: Número del documento de identificación oficial del usuario.
              example: '11111111111'
              pattern: '^\d{11}$'
            rel:
              type: string
              maxLength: 3
              description: Tipo del documento de identificación oficial del usuario.
              example: CPF
              pattern: '^[A-Z]{3}$'
    BusinessEntityV4:
      type: object
      description: 'Usuario (persona jurídica) que se encuentra conectado en la institución Iniciadora de Pago. [Restricción] Cumplimentación obligatoria si el usuario conectado en la institución Iniciadora de Pago es un CNPJ (persona jurídica).'
      required:
        - document
      properties:
        document:
          type: object
          required:
            - identification
            - rel
          properties:
            identification:
              type: string
              maxLength: 14
              description: Número del documento de identificación oficial del titular persona jurídica.
              example: '11111111111111'
              pattern: '^\d{14}$'
            rel:
              type: string
              maxLength: 4
              description: Tipo del documento de identificación oficial del titular persona jurídica.
              example: CNPJ
              pattern: '^[A-Z]{4}$'
    BusinessEntityV5:
      type: object
      description: 'Usuario (persona jurídica) que se encuentra conectado en la institución Iniciadora de Pago. [Restricción] Cumplimentación obligatoria si el usuario conectado en la institución Iniciadora de Pago es un CNPJ (persona jurídica).'
      required:
        - document
      properties:
        document:
          type: object
          required:
            - identification
            - rel
          properties:
            identification:
              type: string
              maxLength: 14
              description: Número del documento de identificación oficial del titular persona jurídica.
              example: '11111111111111'
              pattern: '^[0-9A-Z]{12}[0-9]{2}$'
            rel:
              type: string
              maxLength: 4
              description: Tipo del documento de identificación oficial del titular persona jurídica.
              example: CNPJ
              pattern: '^[A-Z]{4}$'
    IdentificationV4:
      type: object
      description: Objeto que contiene los datos del receptor (creditor).
      required:
        - personType
        - cpfCnpj
        - name
      properties:
        personType:
          $ref: '#/components/schemas/EnumPaymentPersonType'
        cpfCnpj:
          type: string
          minLength: 11
          maxLength: 14
          pattern: '^\d{11}$|^\d{14}$'
          example: '58764789000137'
          description: |
            Identificación de la persona involucrada en la transacción.
            Completar con el CPF o el CNPJ, de acuerdo con el valor elegido en el campo type.
            El CPF se utilizará con 11 números y deberá informarse sin puntos ni guiones.
            El CNPJ se utilizará con 14 números y deberá informarse sin puntos ni guiones.
        name:
          type: string
          pattern: ^([A-Za-zÀ-ÖØ-öø-ÿ,.@:&*+_<>()!?/\\$%\d' -]+)$
          maxLength: 120
          example: Marco Antonio de Brito
          description: |
            En caso de persona natural debe informarse el nombre completo del titular de la cuenta del receptor.
            En caso de persona jurídica debe informarse la razón social o el nombre de fantasía de la cuenta del receptor.
    IdentificationV5:
      type: object
      description: Objeto que contiene los datos del receptor (creditor).
      required:
        - personType
        - cpfCnpj
        - name
      properties:
        personType:
          $ref: '#/components/schemas/EnumPaymentPersonType'
        cpfCnpj:
          type: string
          minLength: 11
          maxLength: 14
          pattern: '^([0-9]{11})$|^([0-9A-Z]{12}[0-9]{2})$'
          example: '58764789000137'
          description: |
            Identificación de la persona involucrada en la transacción.
            Completar con el CPF o el CNPJ, de acuerdo con el valor elegido en el campo type.
            El CPF se utilizará con 11 números y deberá informarse sin puntos ni guiones.
            El CNPJ se utilizará con 14 números y deberá informarse sin puntos ni guiones.
        name:
          type: string
          pattern:  ^[ -~¡-ÿ]+$
          maxLength: 150
          example: Marco Antonio de Brito
          description: |
            En caso de persona natural debe informarse el nombre completo del titular de la cuenta del receptor.
            En caso de persona jurídica debe informarse la razón social o el nombre de fantasía de la cuenta del receptor.
    PaymentConsentPaymentV4:
      type: object
