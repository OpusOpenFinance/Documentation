    LinkSinglePost:
      type: object
      description: Referencias a otros recursos de la API solicitada.
      required:
        - self
      properties:
        self:
          type: string
          format: uri
          maxLength: 2000
          description: URI completo del primer ítem presente en la respuesta.
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
          pattern: '^(https:\/\/)?(www\.)?[-a-zA-Z0-9@:%._\+~#=]{2,256}\.[a-z]{2,6}\b([-a-zA-Z0-9@:%_\+.~#?&\/\/=]*)$'
    PatchPixPayment:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/PatchPixPaymentData'
    PatchPixPaymentData:
      type: object
      required:
        - status
        - cancellation
      properties:
        status:
          $ref: '#/components/schemas/EnumPaymentCancellationStatusType'
        cancellation:
          type: object
          description: |
            Objeto que agrupa la información sobre cuál fue el usuario pagador que solicitó la cancelación de la transacción.
            Observación: este campo es necesario porque, en casos de múltiples instancias de autorización, es posible que el pago sea solicitado por un usuario pagador y cancelado por otro.
          required:
            - cancelledBy
          properties:
            cancelledBy:
              type: object
              description: Información relacionada con el usuario pagador que solicitó la cancelación del pago.
              required:
                - document
              properties:
                document:
                  type: object
                  description: Objeto que consolida los datos del documento del usuario que solicitó la cancelación.
                  required:
                    - identification
                    - rel
                  properties:
                    identification:
                      type: string
                      maxLength: 11
                      description: Número del documento del usuario pagador responsable de la cancelación del pago.
                      example: '11111111111'
                      pattern: '^\d{11}$'
                    rel:
                      type: string
                      maxLength: 3
                      description: Tipo del documento del usuario pagador responsable de la cancelación del pago.
                      example: CPF
                      pattern: '^[A-Z]{3}$'
    EnumPaymentCancellationStatusType:
      type: string
      enum:
        - CANC
      example: CANC
      description: |
        Utilizado para informar a qué estado debe pasar el pago.
        Actualmente el único valor posible es CANC.
    PatchPixPaymentCancellation:
      type: object
      description: |
        Objeto que contiene los datos referentes al usuario pagador que solicitó la cancelación, el canal utilizado por él y el motivo.
