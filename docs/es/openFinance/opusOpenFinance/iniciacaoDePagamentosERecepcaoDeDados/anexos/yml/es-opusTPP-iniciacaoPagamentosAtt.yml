    ResponseCreatePaymentConsentV4:
      description: Versión 4.1.0 de la API regulatoria Payment Initiation.
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: object
          description: Objeto que contiene la información de consentimiento para la iniciación de pago.
          required:
            - consentId
            - statusUpdateDateTime
            - creationDateTime
            - expirationDateTime
            - status
            - loggedUser
            - creditor
            - payment
          properties:
            consentId:
              type: string
              maxLength: 256
              pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
              example: 'urn:bancoex:C1DD33123'
              description: |
                Identificador único del consentimiento creado para la iniciación de pago solicitada. Deberá ser un URN - Uniform Resource Name.
                Un URN, conforme se define en la [RFC8141](https://tools.ietf.org/html/rfc8141), es un Uniform Resource
                Identifier - URI - que se asigna bajo el URI scheme "urn" y un namespace URN específico, con la intención de que el URN
                sea un identificador de recurso persistente e independiente de la ubicación.
                Considerando la cadena urn:bancoex:C1DD33123 como ejemplo de consentId tenemos:
                - el namespace (urn)
                - el identificador asociado al namespace de la institución transmisora (bancoex)
                - el identificador específico dentro del namespace (C1DD33123).
                Información más detallada sobre la construcción de namespaces debe consultarse en la [RFC8141](https://tools.ietf.org/html/rfc8141).
            creationDateTime:
              description: 'Fecha y hora en que el consentimiento fue creado. Una cadena con fecha y hora conforme a la especificación RFC-3339, siempre con la utilización de la timezone UTC (UTC time format).'
              type: string
              format: date-time
              example: '2021-05-21T08:30:00Z'
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              maxLength: 20
            expirationDateTime:
              description: |
                Fecha y hora en que el consentimiento de la iniciación de pago expira.
                Para consentimientos con estado AWAITING_AUTHORISATION, debe ser siempre “creationDateTime + 5 minutos”.
                Después de ese tiempo, si no es aprobado (sea la aprobación única o el primer aprobador), el consentimiento debe pasar a REJECTED.
                Para consentimientos con estado PARTIALLY_ACCEPTED, debe asumir el valor de la política de aprobación de cada institución.
                Para consentimientos con estado AUTHORISED, deben asumir el valor de “statusUpdateDateTime + 60 minutos”, siendo ese el tiempo máximo permitido para el consumo del consentimiento.
                En caso de que no sea consumido, debe moverse al estado REJECTED.
              type: string
              format: date-time
              example: '2021-05-21T08:30:00Z'
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              maxLength: 20
            statusUpdateDateTime:
              type: string
              format: date-time
              example: '2021-05-21T08:30:00Z'
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              maxLength: 20
              description: |
                Fecha y hora en que el recurso fue actualizado. Una cadena con fecha y hora conforme a la especificación RFC-3339, siempre con la utilización de la timezone UTC (UTC time format).
            status:
              $ref: '#/components/schemas/EnumAuthorisationStatusType'
            loggedUser:
              $ref: '#/components/schemas/LoggedUser'
            businessEntity:
              $ref: '#/components/schemas/BusinessEntityV4'
            creditor:
              $ref: '#/components/schemas/IdentificationV4'
            payment:
              $ref: '#/components/schemas/PaymentConsentPaymentV4'
            debtorAccount:
              $ref: '#/components/schemas/ConsentsDebtorAccountV4'
        links:
          $ref: '#/components/schemas/LinkSingle'
        meta:
          $ref: '#/components/schemas/RegulatoryMeta'
