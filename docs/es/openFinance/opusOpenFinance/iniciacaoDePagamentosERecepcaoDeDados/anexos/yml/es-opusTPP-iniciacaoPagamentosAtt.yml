    RejectionReason:
      type: object
      description: |-
        Motivo del rechazo del pago. Información complementaria sobre el motivo del estado
        [Restricción] Ese motivo deberá enviarse cuando el campo /data/status sea igual a RJCT (REJECTED).
      required:
        - code
        - detail
      properties:
        code:
          $ref: '#/components/schemas/EnumRejectionReasonType'
        detail:
          type: string
          pattern: '[\w\W\s]*'
          maxLength: 2048
          description: Contiene información adicional del pago rechazado
    RejectionReasonGetPix:
      type: object
      description: |-
        Motivo del rechazo del pago. Información complementaria sobre el motivo del estado
        [Restricción] Ese motivo deberá enviarse cuando el campo /data/status sea igual a RJCT (REJECTED).
      required:
        - code
