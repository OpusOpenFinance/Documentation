        En el caso en que el cliente no complete los datos en la iniciadora, la detentora deberá persistir la información de la cuenta seleccionada siguiendo las condiciones de abajo.

        [Restricción]
        - AUTHORISED y CONSUMED: Para esos dos estados, la cumplimentación del campo deberá ser obligatoria.
        - REJECTED: Para este estado la cumplimentación es condicional, dado que hay escenarios en que la detentora tampoco tendrá conocimiento de la cuenta de origen, pues la misma no fue seleccionada por el usuario. En los casos en que haya selección, la cuenta debe completarse obligatoriamente.
      required:
        - ispb
        - number
        - accountType
      properties:
        ispb:
          type: string
          minLength: 8
          maxLength: 8
          pattern: '^[0-9]{8}$'
          example: '12345678'
          description: |
            Debe completarse con el ISPB (Identificador del Sistema de Pagos Brasileño) del participante del SPI (Sistema de pagos instantáneos), únicamente con números.
        issuer:
          type: string
          minLength: 1
          maxLength: 4
          pattern: '^[0-9]{1,4}$'
          example: '1774'
          description: |
            Código de la sucursal emisora de la cuenta sin dígito.
            (La sucursal es la dependencia destinada a la atención de clientes, del público en general y de los asociados de cooperativas de crédito,
            en el ejercicio de las actividades de la institución, y no puede ser móvil ni transitoria).

            [Restricción] Cumplimentación obligatoria para los siguientes tipos de cuenta: CACC (CONTA_DEPOSITO_A_VISTA) y SVGS (CONTA_POUPANCA).
        number:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[0-9]{1,20}$'
          example: '1234567890'
          description: |
            Debe completarse con el número de la cuenta transaccional del usuario pagador, con dígito verificador (si este existe);
            si hubiera un valor alfanumérico, este debe convertirse a 0.
        accountType:
          $ref: '#/components/schemas/EnumAccountPaymentsTypePix'
    ConsentsDebtorAccountV5:
      type: object
      description: |
        Objeto que contiene la identificación de la cuenta de origen del pagador.
        La información sobre la cuenta de origen del pagador podrá aportarse en el consentimiento a la institución detentora, en caso de que la institución iniciadora haya recabado esa información del cliente.
        En el caso en que el cliente no complete los datos en la iniciadora, la detentora deberá persistir la información de la cuenta seleccionada siguiendo las condiciones de abajo.

        [Restricción]
        - AUTHORISED y CONSUMED: Para esos dos estados, la cumplimentación del campo deberá ser obligatoria.
        - REJECTED: Para este estado la cumplimentación es condicional, dado que hay escenarios en que la detentora tampoco tendrá conocimiento de la cuenta de origen, pues la misma no fue seleccionada por el usuario. En los casos en que haya selección, la cuenta debe completarse obligatoriamente.
      required:
        - ispb
        - number
        - accountType
      properties:
        ispb:
          type: string
          minLength: 8
          maxLength: 8
          pattern: '^[0-9A-Z]{8}$'
          example: '123456BC'
          description: |
            Debe completarse con el ISPB (Identificador del Sistema de Pagos Brasileño) del participante del SPI (Sistema de pagos instantáneos), únicamente con números.
        issuer:
          type: string
          minLength: 1
          maxLength: 4
          pattern: '^[0-9]{1,4}$'
          example: '1774'
          description: |
            Código de la sucursal emisora de la cuenta sin dígito.
            (La sucursal es la dependencia destinada a la atención de clientes, del público en general y de los asociados de cooperativas de crédito,
            en el ejercicio de las actividades de la institución, y no puede ser móvil ni transitoria).

            [Restricción] Cumplimentación obligatoria para los siguientes tipos de cuenta: CACC (CONTA_DEPOSITO_A_VISTA) y SVGS (CONTA_POUPANCA).
        number:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[0-9]{1,20}$'
          example: '1234567890'
          description: |
            Debe completarse con el número de la cuenta transaccional del usuario pagador, con dígito verificador (si este existe);
            si hubiera un valor alfanumérico, este debe convertirse a 0.
        accountType:
          $ref: '#/components/schemas/EnumAccountPaymentsTypePix'
    EnumAccountPaymentsTypePix:
      type: string
      enum:
        - CACC
        - SVGS
        - TRAN
      example: CACC
      description: |
        Tipos de cuentas usadas para el pago.
        Modalidades tradicionales previstas por la Resolución 4.753, sin contemplar cuentas vinculadas,
        cuenta de domiciliados en el exterior, cuentas en monedas extranjeras y cuenta correspondiente de moneda electrónica.
        A continuación se describe cada valor del ENUM.

        - CACC - Current - Cuenta Corriente.
        - SVGS - Savings - Cuenta de Ahorro.
        - TRAN - TransactingAccount - Cuenta de Pago prepago.
    ScheduleV4:
      description: |
        [Restricción] Mutuamente excluyente con el campo date.
        Este campo es obligatorio en el caso de programación.
        En ese caso, el campo date no deberá informarse.
        El plazo máximo para el consentimiento deberá ser de dos años, contados a partir de la fecha de creación del consentimiento devuelta en su creación (campo /data/creationDateTime).
        La programación de un pago único debe utilizar exclusivamente el objeto "single".
      oneOf:
        - $ref: '#/components/schemas/ScheduleSingleV4'
        - $ref: '#/components/schemas/ScheduleDaily'
        - $ref: '#/components/schemas/ScheduleWeekly'
        - $ref: '#/components/schemas/ScheduleMonthly'
        - $ref: '#/components/schemas/ScheduleCustomV4'
    ScheduleV5:
      description: |
        [Restricción] Mutuamente excluyente con el campo date.
        Este campo es obligatorio en el caso de programación.
        En ese caso, el campo date no deberá informarse.
        El plazo máximo para el consentimiento deberá ser de dos años, contados a partir de la fecha de creación del consentimiento devuelta en su creación (campo /data/creationDateTime).
        La programación de un pago único debe utilizar exclusivamente el objeto "single".
      oneOf:
        - $ref: '#/components/schemas/ScheduleSingleV5'
        - $ref: '#/components/schemas/ScheduleDaily'
        - $ref: '#/components/schemas/ScheduleWeekly'
        - $ref: '#/components/schemas/ScheduleMonthly'
        - $ref: '#/components/schemas/ScheduleCustomV5'
      type: object
      required:
        - additionalInformation
      properties:
        additionalInformation:
          type: string
          description: |
            Texto libre para que el Iniciador describa, de forma comprensible para el usuario aprobador/pagador, las características de la programación solicitada.
            El texto puede ser utilizado por el detentor para exhibir el resumen de la transacción durante la aprobación del usuario aprobador/pagador.
          pattern: '[\w\W\s]*'
          maxLength: 255
          example: Todas quintas e domingos por 6 meses
    ScheduleSingleV4:
      type: object
      required:
        - single
      properties:
        single:
          type: object
          description: Define la política de programación única.
          required:
            - date
          properties:
            date:
              type: string
              format: date
              maxLength: 10
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
              example: '2023-08-23'
              description: |
                Define la fecha objetivo de la liquidación del pago.
                El huso horario de Brasilia debe utilizarse para la creación y el razonamiento sobre los datos de este campo.

                [Restricción] Ese campo deberá ser siempre como mínimo D+1 corrido, es decir, la fecha inmediatamente posterior en
                relación con la fecha del consentimiento considerando el huso horario de Brasilia, y deberá ser como máximo D+730 corridos a
                partir de la fecha del consentimiento, también considerando el huso horario de Brasilia.
    ScheduleSingleV5:
      type: object
      required:
        - single
      properties:
        single:
          type: object
          description: Define la política de programación única.
          required:
            - date
          properties:
            date:
              type: string
              format: date
              maxLength: 10
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
              example: '2023-08-23'
              description: |
                Define la fecha objetivo de la liquidación del pago. El huso horario de Brasilia debe utilizarse para la creación y el razonamiento sobre los datos de este campo.
                [Restricción] Ese campo deberá ser siempre como mínimo D+1 corrido, es decir, la fecha inmediatamente posterior a la fecha de creación del consentimiento. El plazo máximo admitido para la programación es de dos años, contados a partir de la fecha de creación del consentimiento, limitándose al día y mes correspondientes en el segundo año subsiguiente (Ej.: un consentimiento creado el 10/07/2026 permite programación hasta el 10/07/2028).
    ScheduleDaily:
      type: object
      required:
        - daily
      properties:
        daily:
          type: object
          required:
            - startDate
            - quantity
          properties:
            startDate:
              description: Define el inicio de la vigencia de la recurrencia.
              type: string
              format: date
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
              maxLength: 10
              example: '2023-08-23'
            quantity:
              description: Define la cantidad de pagos que serán enviados para liquidación.
              type: integer
              format: int32
              minimum: 2
              maximum: 60
              example: 3
    ScheduleWeekly:
      type: object
      required:
        - weekly
      properties:
        weekly:
          type: object
          required:
            - dayOfWeek
            - startDate
            - quantity
          properties:
            dayOfWeek:
              description: Define el día de la semana planificado para la ocurrencia de las liquidaciones.
              type: string
              enum:
                - SEGUNDA_FEIRA
                - TERCA_FEIRA
                - QUARTA_FEIRA
                - QUINTA_FEIRA
                - SEXTA_FEIRA
                - SABADO
                - DOMINGO
              example: QUINTA_FEIRA
            startDate:
              description: Define el inicio de la vigencia de la recurrencia.
              type: string
              format: date
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
              maxLength: 10
              example: '2023-08-23'
            quantity:
              description: Define la cantidad de pagos que serán enviados para liquidación.
              type: integer
              format: int32
              minimum: 2
              maximum: 60
              example: 10
    ScheduleMonthly:
      type: object
      required:
        - monthly
      properties:
        monthly:
          type: object
          required:
            - dayOfMonth
            - startDate
            - quantity
          properties:
            dayOfMonth:
              description: Define el día del mes planificado para la ocurrencia de las liquidaciones.
              type: integer
              minimum: 1
              maximum: 31
              example: 10
            startDate:
              description: Define el inicio de la vigencia de la recurrencia.
              type: string
              format: date
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
              maxLength: 10
              example: '2023-08-23'
            quantity:
              description: Define la cantidad de pagos que serán enviados para liquidación.
              type: integer
              format: int32
              minimum: 2
              maximum: 24
              example: 24
    ScheduleCustomV4:
      type: object
      required:
        - custom
      properties:
        custom:
          type: object
          description: |
            [Restricción] Las fechas enviadas en la lista de fechas (array “dates”) no pueden estar repetidas.
            En caso de que se envíen fechas repetidas, el detentor debe rechazar la creación del consentimiento, informando el error PARAMETRO_INVALIDO.
          required:
            - dates
            - additionalInformation
          properties:
            dates:
              description: Define los días en que están planificadas las ocurrencias de las liquidaciones.
              type: array
              maxItems: 60
              minItems: 2
              example: ['2023-08-23', '2023-09-26']
              items:
                type: string
                format: date
                pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
                maxLength: 10
                example: '2023-08-23'
            additionalInformation:
              type: string
              description: |
                Texto libre para que el Iniciador complete de forma comprensible para el usuario aprobador/pagador.
                El texto puede ser utilizado por el detentor para exhibir el resumen de la transacción durante la aprobación del usuario aprobador/pagador.
              pattern: '[\w\W\s]*'
              maxLength: 255
              example: Todas quintas e domingos por 6 meses
    ScheduleCustomV5:
      type: object
      required:
        - custom
      properties:
        custom:
          type: object
          description: |
            [Restricción] Las fechas enviadas en la lista de fechas (array “dates”) no pueden estar repetidas.
            En caso de que se envíen fechas repetidas, el detentor debe rechazar la creación del consentimiento, informando el error PARAMETRO_INVALIDO.
          required:
            - dates
          properties:
            dates:
              description: Define los días en que están planificadas las ocurrencias de las liquidaciones.
              type: array
              maxItems: 60
              minItems: 2
              example: ['2023-08-23', '2023-09-26']
              items:
                type: string
                format: date
                pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
                maxLength: 10
                example: '2023-08-23'
    EnumPaymentType:
      type: string
      enum:
        - PIX
      example: PIX
      description: |
        Este campo define el tipo de pago que será iniciado tras la autorización del consentimiento.
    EnumAuthorisationStatusType:
      type: string
      enum:
        - AWAITING_AUTHORISATION
        - AUTHORISED
        - REJECTED
        - CONSUMED
        - PARTIALLY_ACCEPTED
      example: AWAITING_AUTHORISATION
      description: |
        Devuelve el estado del consentimiento, el cual en el momento de su creación será AWAITING_AUTHORISATION. En la situación de múltiples instancias de aprobación, PARTIALLY_ACCEPTED indica que el consentimiento necesita la confirmación de más autorizadores. Este estado será modificado después de la(s) autorización(es) del/de los consentimiento(s) en la institución detentora de la cuenta del pagador (Debtor) a AUTHORISED o REJECTED. El consentimiento queda en el estado CONSUMED después de que ocurra la iniciación del pago referente al consentimiento.

        En caso de consentimiento expirado, la institución detentora deberá devolver el estado REJECTED.


        Estados posibles:

        AWAITING_AUTHORISATION - Esperando autorización

        PARTIALLY_ACCEPTED – Esperando múltiples instancias de aprobación

        AUTHORISED - Autorizado

        REJECTED - Rechazado

        CONSUMED - Consumido
    EnumPaymentPersonType:
      type: string
      enum:
        - PESSOA_NATURAL
        - PESSOA_JURIDICA
      description: |
        Titular, persona natural o jurídica a quien se refieren los datos del receptor (creditor).
    ConsentRejectionReasonV4:
      type: object
      description: |
        Motivo del rechazo del consentimiento. Información complementaria sobre el motivo del estado.

        [Restricción] Ese motivo deberá enviarse cuando el campo /data/status sea igual a REJECTED.
      required:
        - code
        - detail
      properties:
        code:
          $ref: '#/components/schemas/EnumConsentRejectionReasonTypeV4'
        detail:
          type: string
          pattern: '[\w\W\s]*'
          maxLength: 2048
          description: |
            Contiene información adicional del consentimiento rechazado.
            - AUTENTICACAO_DIVERGENTE : El usuario autenticado en el detentor difiere del usuario autenticado en el iniciador​
            - VALOR_INVALIDO: El valor enviado no es válido para el QR Code informado;
            - NAO_INFORMADO: No informado por la institución detentora de la cuenta;
            - FALHA_INFRAESTRUTURA: [Descripción de cuál falla en la infraestructura imposibilitó el procesamiento].
            - TEMPO_EXPIRADO_AUTORIZACAO: El consentimiento expiró antes de que el usuario pudiera confirmarlo.
            - TEMPO_EXPIRADO_CONSUMO: El usuario no finalizó el flujo de pago y el consentimiento expiró;
            - REJEITADO_USUARIO: El usuario rechazó la autorización del consentimiento
            - CONTAS_ORIGEM_DESTINO_IGUAIS: La cuenta seleccionada es igual a la cuenta de destino y no permite realizar ese pago.
            - CONTA_NAO_PERMITE_PAGAMENTO: La cuenta seleccionada es del tipo [salario/inversión/liquidación/otros] y no permite realizar ese pago.
            - SALDO_INSUFICIENTE: La cuenta seleccionada no posee saldo suficiente para realizar el pago.
            - VALOR_ACIMA_LIMITE: El valor supera el límite establecido [en la institución/en el arreglo/otro] para permitir la realización de transacciones por el cliente.
            - QRCODE_INVALIDO: El QRCode utilizado para la iniciación de pago no es válido.

            [Restricción] En caso de consentimiento rechazado de versiones en las cuales no existía el campo rejectionReason, devolver el siguiente detail: Motivo de rejeição inexistente em versões anteriores.
          example: O usuário rejeitou a autorização do consentimento
    ConsentRejectionReasonV5:
      type: object
      description: |
        Motivo del rechazo del consentimiento. Información complementaria sobre el motivo del estado.

        [Restricción] Ese motivo deberá enviarse cuando el campo /data/status sea igual a REJECTED.
