    PurposeV5:
      description: |
        Representa cuál es la finalidad de la transacción recibida.
        - IMMEDIATE: Debe utilizarse cuando el pago generado por el consentimiento sea único e inmediato y no sea un Pix    Saque o Pix Troco;
        - SINGLE_SCHEDULED: Debe utilizarse cuando el pago generado por el consentimiento sea único y programado;
        - RECURRENT_SCHEDULED: Debe utilizarse cuando el pago generado por el consentimiento no sea único y sea programado;
        - WITHDRAW: Debe utilizarse cuando el pago sea único, inmediato y represente una operación de retiro;
        - CHANGE: Debe utilizarse cuando el pago sea único, inmediato y represente una operación de vuelto.

        [Restricciones]
        - Campo de envío obligatorio cuando el valor del campo /data/payment/type sea igual a PIX, y;
        - Si se completa el objeto /data/payment/scheduled/single, solo se permite el valor SINGLE_SCHEDULED, o;
        - Si se completa uno de los objetos /data/payment/scheduled/daily, /data/payment/scheduled/weekly, /data/payment/scheduled/monthly o /data/payment/scheduled/custom, solo se permite el valor RECURRENT_SCHEDULED.
      type: string
      enum:
        - IMMEDIATE
        - SINGLE_SCHEDULED
        - RECURRENT_SCHEDULED
        - WITHDRAW
        - CHANGE
    AmountV4:
      type: string
      minLength: 4
      maxLength: 19
      pattern: '^((\d{1,16}\.\d{2}))$'
      example: '100000.12'
      description: |
        Valor de la transacción con 2 decimales. El valor debe ser el mismo enviado en el consentimiento.

        Para QR Code estático con valor predeterminado en el QR Code o para QR Code dinámico con indicación de que el valor no puede modificarse: el campo amount debe completarse con el valor establecido en el QR Code.
        En caso de que se complete con un valor divergente del QR Code, debe devolverse un error HTTP Status 422.
    AmountV5:
      type: string
      minLength: 4
      maxLength: 19
      pattern: '^((\d{1,16}\.\d{2}))$'
      example: '100000.12'
      description: |
       Valor de la transacción con 2 decimales. Para el pago de QRCodes, la composición del valor sigue las reglas de abajo, de acuerdo con el tipo de QRCode y el producto asociado a él:
        ▪ QR Code Estático: Si el QR Code contiene valor, el campo amount debe completarse con ese valor. Si el valor no está presente, el valor debe ser completado por el usuario pagador, en el entorno de la ITP, antes de la creación del consentimiento.
        ▪ QR Code Dinámico de Cobro Inmediato (COB): El campo amount debe completarse con el valor del cobro (valor.original). Cuando valor.modalidadeAlteracao sea igual a 1, el valor puede ser modificado por el usuario pagador, en el entorno de la ITP, antes de la creación del consentimiento.
        ▪ QR Code Dinámico de Cobro con Vencimiento (COBV): El campo amount debe completarse con el valor final del cobro, correspondiente a la composición: valor original, deducidas eventuales bonificaciones y descuentos, sumados eventuales intereses y multa. El campo modalidadeAlteracao no se aplica a COBV; el valor no puede ser modificado por el usuario pagador.
        ▪ QR Code Dinámico de Pix Saque: El campo amount debe completarse con el valor del retiro (valor.retirada.saque.valor). Cuando valor.retirada.saque.modalidadeAlteracao sea igual a 1, el valor del retiro puede ser modificado por el usuario pagador, en el entorno de la ITP, antes de la creación del consentimiento y respetando los límites definidos por el facilitador del servicio de retiro.
        ▪ QR Code Dinámico de Pix Troco: El campo amount debe completarse con el valor total de la transacción, correspondiente a la suma del valor de la compra (valor.original) con el valor del vuelto (valor.retirada.troco.valor). El valor de la compra (valor.original) no puede modificarse. Cuando valor.retirada.troco.modalidadeAlteracao sea igual a 1, solo el valor del vuelto puede ser modificado por el usuario pagador, en el entorno de la ITP, antes de la creación del consentimiento y respetando los límites definidos por el facilitador del servicio de retiro.
        ▪ Para todos los escenarios en que el valor no puede modificarse, el campo amount debe completarse con el valor establecido en el QR Code. En caso de que el campo amount se complete con un valor divergente del esperado, debe devolverse el error HTTP Status 422 con código VALOR_INVALIDO.
    IbgeTownCodeV4:
      type: string
      minLength: 7
      maxLength: 7
      pattern: '^\d{7}$'
      example: '5300108'
      description: |
        El campo ibgetowncode en el arreglo PIX tiene el mismo comportamiento que el campo codMun descrito en el ítem 1.6.6 del manual del PIX, conforme sigue:

        1. En caso de que la información referente al municipio no sea enviada, el PSP del receptor asumirá que no existen feriados estatales ni municipales en el período en cuestión;
    IbgeTownCodeV5:
      type: string
      minLength: 7
      maxLength: 7
      pattern: '^\d{7}$'
      example: '5300108'
      description: |
        El campo ibgetowncode, en el arreglo PIX, tiene el mismo comportamiento que el campo codMun descrito en el manual del PIX.
        En caso de que la información referente al municipio no sea enviada, el PSP del receptor asumirá que no existen feriados estatales ni municipales en el período en cuestión;
        En el caso de QRCode Dinámico con vencimiento, debe prevalecer el código del municipio del usuario pagador informado por el prestador del servicio de iniciación.
        [Restricción] Para QRCode Dinámico con vencimiento es obligatorio el envío de ese parámetro por la ITP para que el Detentor pueda utilizarlo en su consulta. Es obligatorio que el Detentor utilice el valor informado por la ITP en su consulta del QRCode en el PSP Receptor
    DetailsV4:
      type: object
      description: |
        Objeto que contiene los detalles del pago.
      required:
        - localInstrument
        - creditorAccount
      properties:
        localInstrument:
          $ref: '#/components/schemas/EnumLocalInstrumentV4'
        qrCode:
          type: string
          maxLength: 512
          pattern: '[\w\W\s]*'
          example: |
            00020104141234567890123426660014BR.GOV.BCB.PIX014466756C616E6F32303139406578616D706C652E636F6D27300012
            BR.COM.OUTRO011001234567895204000053039865406123.455802BR5915NOMEDORECEBEDOR6008BRASILIA61087007490062
            530515RP12345678-201950300017BR.GOV.BCB.BRCODE01051.0.080450014BR.GOV.BCB.PIX0123PADRAO.URL.PIX/0123AB
            CD81390012BR.COM.OUTRO01190123.ABCD.3456.WXYZ6304EB76
          description: |
            Secuencia de caracteres que corresponde al QR Code puesto a disposición del pagador.
            Es la secuencia de caracteres que sería leída por el lector de QR Code, y debe propiciar el retorno de los datos del pagador tras la consulta en el DICT.
            Esta funcionalidad es posible tanto para QR Code estático como para QR Code dinámico.
            En el arreglo del Pix esta es la misma secuencia generada y/o leída por la funcionalidad Pix Copia e Cola.
            Este campo deberá estar en el formato UTF-8.
            [Restricción] Cumplimentación obligatoria para pagos por QR Code, observado el tamaño máximo de 512 bytes.
        proxy:
          $ref: '#/components/schemas/ProxyV4'
        creditorAccount:
          $ref: '#/components/schemas/CreditorAccountV4'
    DetailsV5:
      type: object
      description: |
        Objeto que contiene los detalles del pago.
      required:
        - localInstrument
        - creditorAccount
      properties:
        payloadJWS:
          description: |
            Representa el payloadJWS obtenido por la ITP en la lectura del QR dinámico. Deben enviarse todos los fragmentos capturados del JWT que representa el QR generado por el PSP del Receptor, permitiendo al detentor de cuentas validar los datos de los cobros transmitidos por la ITP.
            [Restricción] Campo de envío obligatorio cuando el valor presente en ```/data/payment/details/localInstrument``` sea igual a APDN o QRDN.
          type: string
          maxLength: 16384
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
        localInstrument:
          $ref: '#/components/schemas/EnumLocalInstrumentV5'
        qrCode:
          type: string
          maxLength: 512
          pattern: '[\w\W\s]*'
          example: |
            00020104141234567890123426660014BR.GOV.BCB.PIX014466756C616E6F32303139406578616D706C652E636F6D27300012
            BR.COM.OUTRO011001234567895204000053039865406123.455802BR5915NOMEDORECEBEDOR6008BRASILIA61087007490062
            530515RP12345678-201950300017BR.GOV.BCB.BRCODE01051.0.080450014BR.GOV.BCB.PIX0123PADRAO.URL.PIX/0123AB
            CD81390012BR.COM.OUTRO01190123.ABCD.3456.WXYZ6304EB76
          description: |
            Representa la secuencia de caracteres correspondiente al QRCode puesto a disposición del pagador, que puede obtenerse mediante el lector del dispositivo del pagador o por copiar y pegar. Debe estar en el formato UTF-8 y propiciar el retorno de los datos del pagador tras la consulta en el DICT. Para los casos donde “/data/payment/details/localInstrument” sea igual a QRDN o APDN, los datos del cobro serán transmitidos por la ITP en el campo “/data/payment/details/payloadJWS”, permitiendo al detentor validar los datos del cobro sin necesidad de consultar el payloadJWS del QRCode en cuestión a través de la URL. No se le veda al detentor realizar la consulta; sin embargo, en casos de cambio del valor del campo "txId", la institución detentora deberá confiar en el payloadJWS transmitido por la ITP.
            [Restricción] Campo de cumplimentación obligatoria cuando el valor de /data/payment/details/localInstrument sea igual a QRDN, APDN, QRES o APES, observado el tamaño máximo de 512 bytes.
        proxy:
          $ref: '#/components/schemas/ProxyV5'
        creditorAccount:
          $ref: '#/components/schemas/CreditorAccountV5'
    EnumLocalInstrumentV4:
      type: string
      enum:
        - MANU
        - DICT
        - QRDN
        - QRES
        - INIC
      example: DICT
      description: |
        Especifica la forma de iniciación del pago:
        - MANU - Inserción manual de datos de la cuenta transaccional
        - DICT - Inserción manual de clave Pix
        - QRDN - QR code dinámico
        - QRES - QR code estático
        - INIC - Indica que el receptor (creditor) contrató al Iniciador de Pagos específicamente para realizar iniciaciones de pago en las que el beneficiario es previamente conocido.

        [Restricción] Si /data/payment/schedule se envía con un valor diferente de single durante la creación del consentimiento, solo se permiten los métodos MANU, DICT o QRES.
    EnumLocalInstrumentV5:
      type: string
      enum:
        - MANU
        - DICT
        - QRDN
        - QRES
        - INIC
        - APES
        - APDN
      example: DICT
      description: |
        Especifica la forma de iniciación del pago:
        - MANU - Inserción manual de datos de la cuenta transaccional
        - DICT - Inserción manual de clave Pix
        - APDN - Lectura de QR code dinámico vía NFC
        - QRDN - Lectura de QR code dinámico (excepto NFC)
        - APES - Lectura de QR code estático vía NFC
        - QRES - Lectura de QR code estático (excepto NFC)
        - INIC - Indica que el receptor (creditor) contrató al Iniciador de Pagos específicamente para realizar iniciaciones de pago en las que el beneficiario es previamente conocido.

        [Restricción] Si /data/payment/schedule se envía con un valor diferente de single durante la creación del consentimiento, solo se permiten los métodos MANU, DICT o QRES.
    ProxyV4:
      type: string
      maxLength: 77
      pattern: '[\w\W\s]*'
      example: '12345678901'
      description: |
        Clave registrada en el DICT perteneciente al receptor. Los tipos de claves pueden ser: teléfono, e-mail, cpf/cnpj o clave aleatoria.
        En el caso de teléfono celular debe informarse en el estándar E.1641.
        Para e-mail debe tener el formato xxxxxxxx@xxxxxxx.xxx(.xx) y como máximo 77 caracteres.
        En el caso de CPF deberá informarse con 11 números, sin puntos ni guiones.
        Para el caso de CNPJ deberá informarse con 14 números, sin puntos ni guiones.
        En el caso de clave aleatoria debe informarse el UUID generado por el DICT, conforme al formato especificado en la RFC41223.
        Si se informa, la institución detentora de la cuenta debe validar el proxy en el DICT cuando localInstrument sea igual a DICT, QRDN o QRES y validar el campo creditorAccount.
        Esta validación es opcional en caso de que localInstrument sea igual a INIC.
        [Restricción] Si localInstrument es igual a MANU, el campo proxy no debe completarse. Si localInstrument es igual a INIC, DICT, QRDN o QRES, el campo proxy debe completarse siempre con la clave Pix.
    ProxyV5:
      type: string
      maxLength: 77
      pattern: '[\w\W\s]*'
      example: '12345678901'
      description: |
        Clave registrada en el DICT perteneciente al receptor. Los tipos de claves pueden ser: teléfono, e-mail, cpf/cnpj o clave aleatoria. En el caso de teléfono celular debe informarse en el estándar E.1641. Para e-mail debe tener el formato xxxxxxxx@xxxxxxx.xxx(.xx) y como máximo 77 caracteres. En el caso de CPF deberá informarse con 11 números, sin puntos ni guiones. Para el caso de CNPJ deberá informarse con 14 caracteres, sin puntos ni guiones. En el caso de clave aleatoria debe informarse el UUID generado por el DICT, conforme al formato especificado en la RFC4122. Si se informa, la institución detentora de la cuenta debe validar el proxy en el DICT cuando localInstrument sea igual a DICT, APDN, APES, QRDN o QRES y validar el campo creditorAccount. Esta validación es opcional en caso de que localInstrument sea igual a INIC.
        [Restricción] Si localInstrument es igual a MANU, el campo proxy no debe completarse. Si localInstrument es igual a INIC, DICT, APDN, APES, QRDN o QRES, el campo proxy debe completarse siempre con la clave Pix.
