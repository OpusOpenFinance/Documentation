        detail:
          type: string
          pattern: '[\w\W\s]*'
          maxLength: 2048
          description: Contiene información adicional del pago rechazado
    EnumRejectionReasonType:
      type: string
      enum:
        - SALDO_INSUFICIENTE
        - VALOR_ACIMA_LIMITE
        - VALOR_INVALIDO
        - COBRANCA_INVALIDA
        - NAO_INFORMADO
        - PAGAMENTO_DIVERGENTE_CONSENTIMENTO
        - DETALHE_PAGAMENTO_INVALIDO
        - PAGAMENTO_RECUSADO_DETENTORA
        - PAGAMENTO_RECUSADO_SPI
        - FALHA_INFRAESTRUTURA
        - FALHA_INFRAESTRUTURA_SPI
        - FALHA_INFRAESTRUTURA_DICT
        - FALHA_INFRAESTRUTURA_ICP
        - FALHA_INFRAESTRUTURA_PSP_RECEBEDOR
        - FALHA_INFRAESTRUTURA_DETENTORA
        - CHAVE_PIX_DIVERGENTE_AGENDAMENTO_LIQUIDACAO
        - CONTAS_ORIGEM_DESTINO_IGUAIS
        - CONTA_NAO_PERMITE_PAGAMENTO
        - QRCODE_INVALIDO
      example: SALDO_INSUFICIENTE
      description: |
        Define el código de la razón por la cual el pago fue rechazado

        - SALDO_INSUFICIENTE - La cuenta seleccionada no posee saldo suficiente para realizar el pago.

        - VALOR_ACIMA_LIMITE - El valor supera el límite establecido [en la institución/en el arreglo/otro] para permitir la realización de transacciones por el cliente.

        - VALOR_INVALIDO - El valor enviado no es válido para el QR Code informado.

        - COBRANCA_INVALIDA - Validación de expiración, validación de vencimiento o Estado Válido.

        - NAO_INFORMADO - No reportado/identificado por la institución detentora de la cuenta.

        - PAGAMENTO_DIVERGENTE_CONSENTIMENTO - Datos del pago divergentes de los datos del consentimiento.

        - DETALHE_PAGAMENTO_INVALIDO - El parámetro [nome_campo] no obedece las reglas de negocio.

        - PAGAMENTO_RECUSADO_DETENTORA - [Descripción del motivo del rechazo].

        - PAGAMENTO_RECUSADO_SPI - [Código de error conforme a la tabla de dominios reason PACS.002].

        - FALHA_INFRAESTRUTURA - [Descripción de cuál falla en la infraestructura imposibilitó el procesamiento].

        - FALHA_INFRAESTRUTURA_SPI - Indica una falla en el Sistema de Pagos Instantáneos (SPI).

        - FALHA_INFRAESTRUTURA_DICT - Indica una falla en el Directorio de Identificadores de Cuentas Transaccionales (DICT).

        - FALHA_INFRAESTRUTURA_ICP - Indica una falla en la Infraestructura de Claves Públicas (ICP).

        - FALHA_INFRAESTRUTURA_PSP_RECEBEDOR - Indica una falla en la infraestructura del Prestador de Servicio de Pago (PSP) que recibe el pago.

        - FALHA_INFRAESTRUTURA_DETENTORA - indica una falla en la infraestructura de la institución detentora de la información o de los recursos.

        - CHAVE_PIX_DIVERGENTE_AGENDAMENTO_LIQUIDACAO: Divergencias entre datos de las claves Pix en la programación y en la liquidación

        - CONTAS_ORIGEM_DESTINO_IGUAIS - Indica un intento de pago donde la cuenta de origen y la cuenta de destino son iguales.

        - CONTA_NAO_PERMITE_PAGAMENTO – La cuenta seleccionada es del tipo [salario/inversión/liquidación/otros] y no permite realizar ese pago.

        - QRCODE_INVALIDO - El QRCode utilizado para la iniciación de pago no es válido.

        Los rejectionReasons FALHA_INFRAESTRUTURA y CONTAS_ORIGEM_DESTINO_IGUAIS no serán eliminados, solo dejaron de ser utilizados, permitiendo así la retrocompatibilidad y la integridad con las versiones anteriores de la API.
