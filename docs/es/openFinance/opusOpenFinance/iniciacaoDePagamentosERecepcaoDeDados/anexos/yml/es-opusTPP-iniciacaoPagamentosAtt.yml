    EnumPaymentStatusType:
      type: string
      enum:
        - RCVD
        - CANC
        - ACCP
        - ACPD
        - RJCT
        - ACSC
        - PDNG
        - SCHD
      example: PDNG
      description: |
        Estado actual de la iniciación de pago. El estado evoluciona en el siguiente orden:

        1.  RCVD (Received) - Indica que la solicitud de pago fue recibida con éxito por la institución detentora, pero aún hay validaciones por realizar antes de ser presentada para liquidación.

        2.  CANC (Cancelled) - Indica que la transacción Pix pendiente fue cancelada con éxito por el usuario antes de que fuera confirmada (ACCP) o rechazada (RJCT) por la institución detentora.

        3.  ACCP( Accepted Customer Profile) - Indica que todas las verificaciones necesarias ya fueron realizadas por la institución detentora y que la transacción está lista para ser enviada a liquidación (en el SPI si es un Pix a otra institución o internamente si es a otra cuenta en la misma institución).

        4.  ACPD (Accepted Clearing Processed) - Indica que la institución detentora ya presentó la transacción para liquidación, pero aún no tiene la confirmación de si fue liquidada o rechazada.

        5.  RJCT (Rejected) Indica que la transacción fue rechazada por la institución detentora o por el SPI.

        6.  ACSC (Accepted Settlement Completed Debitor Account) - Indica que la transacción fue efectivizada por la institución detentora o por el SPI.

        7.  PDNG (Pending) - Indica que la institución detentora retuvo temporalmente la transacción Pix para análisis. No se aplica cuando la cuenta receptora y la pagadora poseen la misma titularidad.

        8.  SCHD (Scheduled) - Indica que la transacción Pix fue programada con éxito en la institución detentora.

        En caso de fracaso:

        RJCT (REJECTED) - Instrucción de pago rechazada.
    422ResponseErrorCreatePixPayment:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          minItems: 1
          maxItems: 9
          items:
            type: object
            required:
              - code
              - title
              - detail
            properties:
              code:
                $ref: '#/components/schemas/EnumErrorsCreatePixPayment'
              title:
                type: string
                maxLength: 255
                pattern: '[\w\W\s]*'
                example: Pagamento não permite cancelamento.
                description: |
                  Título específico del error reportado, de acuerdo con el código enviado:

                  • PAGAMENTO_NAO_PERMITE_CANCELAMENTO: El pago no permite cancelación
                  • ERRO_IDEMPOTENCIA: El contenido del mensaje (claim data) difiere del contenido asociado a esta clave de idempotencia (x-idempotency-key).
              detail:
                type: string
                maxLength: 2048
                pattern: '[\w\W\s]*'
                example: Pagamento não permite cancelamento.
                description: |
                  Descripción específica del error de acuerdo con el código reportado:

                  • PAGAMENTO_NAO_PERMITE_CANCELAMENTO: El pago no permite cancelación
                  • ERRO_IDEMPOTENCIA: El contenido del mensaje (claim data) difiere del contenido asociado a esta clave de idempotencia (x-idempotency-key).
        meta:
          $ref: '#/components/schemas/RegulatoryMeta'
    422ResponseErrorCreatePixPayments:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          minItems: 1
          maxItems: 9
          items:
            type: object
            required:
              - code
              - title
              - detail
            properties:
              code:
                $ref: '#/components/schemas/EnumErrorsCreatePayment'
              title:
                type: string
                maxLength: 255
                pattern: '[\w\W\s]*'
                example: Saldo insuficiente.
                description: |
                  Título específico del error reportado, de acuerdo con el código enviado:
                  - SALDO_INSUFICIENTE: Saldo insuficiente.
                  - VALOR_ACIMA_LIMITE: Por encima del límite establecido.
                  - VALOR_INVALIDO: Valor inválido.
                  - COBRANCA_INVALIDA: Cobro inválido.
                  - CONSENTIMENTO_INVALIDO – Consentimiento inválido (en estado final).
                  - PARAMETRO_NAO_INFORMADO: Parámetro obligatorio no informado.
                  - PARAMETRO_INVALIDO: Parámetro con valor inválido.
                  - NAO_INFORMADO: No informado.
                  - PAGAMENTO_DIVERGENTE_CONSENTIMENTO: Divergencia entre pago y consentimiento.
                  - DETALHE_PAGAMENTO_INVALIDO: Detalle del pago inválido.
                  - PAGAMENTO_RECUSADO_DETENTORA: Pago rechazado por la institución detentora de la cuenta.
                  - PAGAMENTO_RECUSADO_SPI: Pago rechazado en el Sistema de Pagos Instantáneos (SPI).
                  - ERRO_IDEMPOTENCIA: Error de idempotencia.
                  - CONSENTIMENTO_PENDENTE_AUTORIZACAO: Consentimiento pendiente de autorización de múltiples instancias de aprobación (estado “PARTIALLY_ACCEPTED”).
                  - CONTA_NAO_PERMITE_PAGAMENTO – La cuenta seleccionada es del tipo [salario/inversión/liquidación/otros] y no permite realizar ese pago.
                  - QRCODE_INVALIDO - El QRCode utilizado para la iniciación de pago no es válido.
              detail:
                type: string
                maxLength: 2048
                pattern: '[\w\W\s]*'
                example: A conta selecionada não possui saldo suficiente para realizar o pagamento.
                description: |
                  Descripción específica del error de acuerdo con el código reportado:
                  - SALDO_INSUFICIENTE: La cuenta seleccionada no posee saldo suficiente para realizar el pago.
                  - VALOR_ACIMA_LIMITE: El valor (o la cantidad de transacciones) supera la franja de límite parametrizada en la institución detentora para permitir la realización de transacciones por el cliente.
                  - VALOR_INVALIDO: El valor enviado no es válido para el QR Code informado.
                  - COBRANCA_INVALIDA: Validación de expiración, validación de vencimiento o Estado Válido.
                  - CONSENTIMENTO_INVALIDO – Consentimiento inválido (en estado final).
                  - PARAMETRO_NAO_INFORMADO: endToEndId
                  - PARAMETRO_INVALIDO: endToEndId
                  - NAO_INFORMADO: No reportado/identificado por la institución detentora de la cuenta.
                  - PAGAMENTO_DIVERGENTE_CONSENTIMENTO: Datos del pago divergentes de los datos del consentimiento.
                  - DETALHE_PAGAMENTO_INVALIDO: El parámetro [nome_campo] no obedece las reglas de negocio.
                  - PAGAMENTO_RECUSADO_DETENTORA: [descripción del motivo del rechazo].
                  - PAGAMENTO_RECUSADO_SPI: [código de error conforme a la tabla de dominios reason PACS.002].
                  - ERRO_IDEMPOTENCIA: El contenido del mensaje (claim data) difiere del contenido asociado a esta clave de idempotencia (x-idempotency-key).
                  - CONSENTIMENTO_PENDENTE_AUTORIZACAO: Consentimiento pendiente de autorización de múltiples instancias de aprobación (estado “PARTIALLY_ACCEPTED”).
                  - CONTA_NAO_PERMITE_PAGAMENTO – La cuenta seleccionada es del tipo [salario/inversión/liquidación/otros] y no permite realizar ese pago.
                  - QRCODE_INVALIDO - El QRCode utilizado para la iniciación de pago no es válido.
        meta:
          $ref: '#/components/schemas/RegulatoryMeta'
    EnumErrorsCreatePixPayment:
      type: string
      enum:
        - PAGAMENTO_NAO_PERMITE_CANCELAMENTO
        - ERRO_IDEMPOTENCIA
      example: PAGAMENTO_NAO_PERMITE_CANCELAMENTO
      description: |
        Códigos de errores previstos en la creación de la iniciación de pago:

        • PAGAMENTO_NAO_PERMITE_CANCELAMENTO: El pago no permite cancelación
        • ERRO_IDEMPOTENCIA: El contenido del mensaje (claim data) difiere del contenido asociado a esta clave de idempotencia (x-idempotency-key).
    EnumErrorsCreatePayment:
      type: string
      enum:
        - SALDO_INSUFICIENTE
        - VALOR_ACIMA_LIMITE
        - VALOR_INVALIDO
        - COBRANCA_INVALIDA
        - CONSENTIMENTO_INVALIDO
        - PARAMETRO_NAO_INFORMADO
        - PARAMETRO_INVALIDO
        - NAO_INFORMADO
        - PAGAMENTO_DIVERGENTE_CONSENTIMENTO
        - DETALHE_PAGAMENTO_INVALIDO
        - PAGAMENTO_RECUSADO_DETENTORA
        - PAGAMENTO_RECUSADO_SPI
        - ERRO_IDEMPOTENCIA
        - CONSENTIMENTO_PENDENTE_AUTORIZACAO
        - CONTA_NAO_PERMITE_PAGAMENTO
        - QRCODE_INVALIDO
      example: SALDO_INSUFICIENTE
      description: |
        Códigos de errores previstos en la creación de la iniciación de pago:
        - SALDO_INSUFICIENTE: Esta cuenta no posee saldo suficiente para realizar el pago.
        - VALOR_ACIMA_LIMITE: El valor (o la cantidad de transacciones) supera la franja de límite parametrizada en la institución detentora para permitir la realización de transacciones por el cliente.
        - VALOR_INVALIDO: El valor enviado no es válido para el QR Code informado.
        - COBRANCA_INVALIDA: Validación de expiración, validación de vencimiento, Estado Válido.
        - CONSENTIMENTO_INVALIDO – Consentimiento inválido (en estado final).
        - PARAMETRO_NAO_INFORMADO: Parámetro no informado.
        - PARAMETRO_INVALIDO: Parámetro inválido.
        - NAO_INFORMADO: No informado por la institución detentora de la cuenta.
        - PAGAMENTO_DIVERGENTE_CONSENTIMENTO: Datos del pago divergentes de los datos del consentimiento.
        - DETALHE_PAGAMENTO_INVALIDO: Detalle del pago inválido.
        - PAGAMENTO_RECUSADO_DETENTORA: Pago rechazado por la institución detentora de la cuenta.
        - PAGAMENTO_RECUSADO_SPI: Pago rechazado en el Sistema de Pagos Instantáneos (SPI).
        - ERRO_IDEMPOTENCIA: Error de idempotencia.
        - CONSENTIMENTO_PENDENTE_AUTORIZACAO: Consentimiento pendiente de autorización de múltiples instancias de aprobación (estado “PARTIALLY_ACCEPTED”)
        - CONTA_NAO_PERMITE_PAGAMENTO – La cuenta seleccionada es del tipo [salario/inversión/liquidación/otros] y no permite realizar ese pago.
        - QRCODE_INVALIDO - El QRCode utilizado para la iniciación de pago no es válido.
    ResponsePaymentsGetConsentsConsentIdPayments:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          description: Objeto que contiene datos del pago
          items:
            type: object
            required:
              - paymentId
              - endToEndId
              - consentId
              - creationDateTime
              - statusUpdateDateTime
              - status
              - localInstrument
              - payment
              - creditorAccount
              - cnpjInitiator
              - debtorAccount
            properties:
              paymentId:
                type: string
                minLength: 1
                maxLength: 100
                pattern: '^[a-zA-Z0-9][a-zA-Z0-9\-]{0,99}$'
                example: TXpRMU9UQTROMWhZV2xSU1FUazJSMDl
                description: |
                  Código o identificador único informado por la institución detentora de la cuenta para representar
                  la iniciación de pago individual. El `paymentId` debe ser diferente del `endToEndId`.
                  Este es el identificador que deberá utilizarse en la consulta del estado de la iniciación de pago efectuada.
              endToEndId:
                $ref: '#/components/schemas/EndToEndId'
              statusUpdateDateTime:
                type: string
                format: date-time
                pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
                example: '2020-07-21T08:30:00Z'
                description: |
                  Fecha y hora de la última actualización de la iniciación de pago.
                  Una cadena con fecha y hora conforme a la especificación RFC-3339,
                  siempre con la utilización de la timezone UTC (UTC time format).
              status:
                $ref: '#/components/schemas/EnumPaymentStatusType'
        links:
          $ref: '#/components/schemas/LinkSingle'
        meta:
          $ref: '#/components/schemas/RegulatoryMeta'
    XV:
      description: 'Encabezado que indica la versión implementada de la API por la institución financiera para atender la solicitud. Debe completarse de forma completa, por ejemplo: x-v : 1.0.2.'
      type: string
      pattern: '^\d+\.\d+\.\d+$'
      example: 1.0.0
    XFapiInteractionId:
      type: string
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      minLength: 1
      maxLength: 36
      format: uuid
      example: d78fc4e5-37ca-4da3-adf2-9b082bf92280
      description: Un UUID [RFC4122](https://tools.ietf.org/html/rfc4122) usado como ID de correlación entre request y response. Campo de generación y envío obligatorio por la institución iniciadora (client), y su valor debe ser “espejado” por la institución detentora (server) en el encabezado de respuesta. En caso de que no sea enviado por la iniciadora, la detentora debe generar un x-fapi-interaction-id y devolverlo en la respuesta con el HTTP status code 400. En caso de que se reciba un valor inválido, la detentora debe generar un x-fapi-interaction-id y devolverlo en la respuesta con el HTTP status code 400 o 422 (con el código PARAMETRO_INVALIDO). La iniciadora debe acatar el valor generado por el detentor y recibido en la respuesta.
  headers:
    xOriginError:
      description: Indica el origen del error.
      schema:
        $ref: '#/components/schemas/EnumOriginError'
      required: false
    xErrorSourceUrl:
      description: URL de la llamada que originó el error, presente solo cuando `x-origin-error` = `participant`.
      schema:
        type: string
      required: false
    xRegulatoryV:
      description: Versión regulatoria deseada para la llamada al participante (disponible solo en rutas no-proxy).
      schema:
        $ref: '#/components/schemas/RegulatoryVersion'
      required: false
    xSelectedRegulatoryV:
      description: Versión regulatoria efectivamente utilizada en la solicitud al participante.
      schema:
        $ref: '#/components/schemas/SelectedRegulatoryVersion'
      required: true
    xFapiInteractionIdResponse:
      description: |
        Un UUID [RFC4122](https://tools.ietf.org/html/rfc4122) usado como ID de correlación entre request y response. Campo de generación y envío obligatorio por la institución iniciadora (client), y su valor debe ser “espejado” por la institución detentora (server) en el encabezado de respuesta. En caso de que no sea enviado por la iniciadora, la detentora debe generar un x-fapi-interaction-id y devolverlo en la respuesta con el HTTP status code 400. En caso de que se reciba un valor inválido, la detentora debe generar un x-fapi-interaction-id y devolverlo en la respuesta con el HTTP status code 400 o 422 (con el código PARAMETRO_INVALIDO). La iniciadora debe acatar el valor generado por el detentor y recibido en la respuesta.
      schema:
        $ref: '#/components/schemas/XFapiInteractionId'
      required: true
    xV:
      description: 'Encabezado que indica la versión implementada de la API por la institución financiera para atender la solicitud. Debe completarse de forma completa, por ejemplo: x-v : 1.0.2.'
      required: true
      schema:
        $ref: '#/components/schemas/XV'
  parameters:
    applicationId:
      name: x-application-id
      in: header
      required: true
      description: Identificador de la aplicación que realiza la solicitud
      schema:
        $ref: '#/components/schemas/UUID'
    authorisationServerId:
      name: x-authorisation-server-id
      required: true
      description: Identificador del Authorisation Server de la institución transmisora del consentimiento, obtenido mediante la consulta de la lista de participantes
      in: header
      schema:
        $ref: '#/components/schemas/UUID'
    headerConsentId:
      name: x-consent-id
      required: true
      in: header
      description: Identificador del consentimiento a utilizar en esta operación, obtenido en la respuesta de su creación
      schema:
        type: string
        pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
        maxLength: 256
      example: 'urn:bancox:f865cd66-392a-420b-9ff0-1b6d7cc60ee0'
    consentId:
      name: consentId
      required: true
      in: path
      description: |
        El consentId es el identificador único del consentimiento y deberá ser un URN - Uniform Resource Name.
        Un URN, conforme se define en la [RFC8141](https://tools.ietf.org/html/rfc8141), es un Uniform Resource
        Identifier - URI - que se asigna bajo el URI scheme "urn" y un namespace URN específico, con la intención de que el URN
        sea un identificador de recurso persistente e independiente de la ubicación.
        Considerando la cadena urn:prudential:C1DD93123 como ejemplo de consentId tenemos:
        - el namespace (urn)
        - el identificador asociado al namespace de la institución transmisora (bancox)
        - el identificador específico dentro del namespace (f865cd66-392a-420b-9ff0-1b6d7cc60ee0).
        Información más detallada sobre la construcción de namespaces debe consultarse en la [RFC8141](https://tools.ietf.org/html/rfc8141).
      schema:
        type: string
        pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
        maxLength: 256
      example: 'urn:bancox:f865cd66-392a-420b-9ff0-1b6d7cc60ee0'
    authorisationFlowIntent:
      name: x-authorisation-flow-intent
      required: false
      description: Indicador de cuál será el modelo de aprobación del consentimiento de pago
      in: header
      schema:
        $ref: '#/components/schemas/EnumAuthorisationFlowIntent'
    regulatoryV:
        name: x-regulatory-v
        required: false
        description: Versión regulatoria deseada para la llamada al participante (disponible solo en rutas no-proxy).
        in: header
        schema:
          $ref: '#/components/schemas/RegulatoryVersion'
    authorizationHeader:
      name: Authorization
      in: header
      description: Encabezado HTTP estándar. Permite que las credenciales se proporcionen dependiendo del tipo de recurso solicitado
      required: true
      schema:
        type: string
        pattern: '[\w\W\s]*'
        minLength: 1
        maxLength: 2048
    xCustomerUserAgent:
      name: x-customer-user-agent
      in: header
      description: Indica el user-agent que utiliza el usuario.
      required: false
      schema:
        type: string
        pattern: '[\w\W\s]*'
        minLength: 1
        maxLength: 100
    xFapiAuthDate:
      name: x-fapi-auth-date
      in: header
      description: 'Fecha en que el usuario se conectó por última vez con el receptor. Representada de acuerdo con la [RFC7231](https://tools.ietf.org/html/rfc7231). Ejemplo: Sun, 10 Sep 2017 19:43:31 UTC'
      required: false
      schema:
        type: string
        pattern: '^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), \d{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) \d{4} \d{2}:\d{2}:\d{2} (GMT|UTC)$'
        minLength: 29
        maxLength: 29
    xFapiCustomerIpAddress:
      name: x-fapi-customer-ip-address
      in: header
      description: La dirección IP del usuario si se encuentra actualmente conectado con la institución receptora.
      required: false
      schema:
        type: string
        pattern: '[\w\W\s]*'
        minLength: 1
        maxLength: 100
    xFapiInteractionId:
      name: x-fapi-interaction-id
      in: header
      description: Un UUID [RFC4122](https://tools.ietf.org/html/rfc4122) usado como ID de correlación entre request y response. Campo de generación y envío obligatorio por la institución iniciadora (client), y su valor debe ser “espejado” por la institución detentora (server) en el encabezado de respuesta. En caso de que no sea enviado por la iniciadora, la detentora debe generar un x-fapi-interaction-id y devolverlo en la respuesta con el HTTP status code 400. En caso de que se reciba un valor inválido, la detentora debe generar un x-fapi-interaction-id y devolverlo en la respuesta con el HTTP status code 400 o 422 (con el código PARAMETRO_INVALIDO). La iniciadora debe acatar el valor generado por el detentor y recibido en la respuesta.
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        minLength: 1
        maxLength: 36
        format: uuid
        example: d78fc4e5-37ca-4da3-adf2-9b082bf92280
    xIdempotencyKey:
      name: x-idempotency-key
      in: header
      description: Encabezado HTTP personalizado. Identificador de solicitud exclusivo para soportar la idempotencia.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 40
        pattern: ^(?!\s)(.*)(\S)$
    startDate:
      name: startDate
      in: query
      description: Fecha inicial de corte, incluyendo el día informado, para la recuperación del pago ligado al consentimiento.
      required: false
      schema:
        type: string
        format: date
        example: '2025-04-16'
        pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
        minLength: 10
        maxLength: 10
    endDate:
      name: endDate
      in: query
      description: Fecha final de corte, incluyendo el día informado, de la ocurrencia del pago ligada al consentimiento.
      required: false
      schema:
        format: date
        type: string
        example: '2025-04-17'
        pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
        minLength: 10
        maxLength: 10
