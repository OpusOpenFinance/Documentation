    RegulatoryMeta:
      type: object
      description: Metainformación referente a la API solicitada.
      required:
        - requestDateTime
      properties:
        requestDateTime:
          description: 'Fecha y hora de la consulta, conforme a la especificación RFC-3339, formato UTC.'
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
    LinkSingle:
      type: object
      description: Referencias a otros recursos de la API solicitada.
      required:
        - self
      properties:
        self:
          type: string
          format: uri
          maxLength: 2000
          description: URI completo que generó la respuesta actual.
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
          pattern: '^(https:\/\/)?(www\.)?[-a-zA-Z0-9@:%._\+~#=]{2,256}\.[a-z]{2,6}\b([-a-zA-Z0-9@:%_\+.~#?&\/\/=]*)$'
    ResponsePaymentConsentV5:
      description: Versión 5.0.0 de la API regulatoria Payment Initiation.
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: object
          description: Objeto que contiene la información de consentimiento para la iniciación de pago.
          required:
            - consentId
            - statusUpdateDateTime
            - creationDateTime
            - expirationDateTime
            - status
            - loggedUser
            - creditor
            - payment
          properties:
            consentId:
              type: string
              maxLength: 256
              pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
              example: 'urn:bancoex:C1DD33123'
              description: |
                Identificador único del consentimiento creado para la iniciación de pago solicitada. Deberá ser un URN - Uniform Resource Name.
                Un URN, conforme se define en la [RFC8141](https://tools.ietf.org/html/rfc8141), es un Uniform Resource
                Identifier - URI - que se asigna bajo el URI scheme "urn" y un namespace URN específico, con la intención de que el URN
                sea un identificador de recurso persistente e independiente de la ubicación.
                Considerando la cadena urn:bancoex:C1DD33123 como ejemplo de consentId tenemos:
                - el namespace (urn)
                - el identificador asociado al namespace de la institución transmisora (bancoex)
                - el identificador específico dentro del namespace (C1DD33123).
                Información más detallada sobre la construcción de namespaces debe consultarse en la [RFC8141](https://tools.ietf.org/html/rfc8141).
            creationDateTime:
              description: 'Fecha y hora en que el consentimiento fue creado. Una cadena con fecha y hora conforme a la especificación RFC-3339, siempre con la utilización de la timezone UTC (UTC time format).'
              type: string
              format: date-time
              example: '2021-05-21T08:30:00Z'
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              maxLength: 20
            expirationDateTime:
              description: |
                Fecha y hora en que el consentimiento de la iniciación de pago expira.
                Para consentimientos con estado AWAITING_AUTHORISATION, debe ser siempre “creationDateTime + 5 minutos”.
                Después de ese tiempo, si no es aprobado (sea la aprobación única o el primer aprobador), el consentimiento debe pasar a REJECTED.
                Para consentimientos con estado PARTIALLY_ACCEPTED, debe asumir el valor de la política de aprobación de cada institución.
                Para consentimientos con estado AUTHORISED, deben asumir el valor de “statusUpdateDateTime + 60 minutos”, siendo ese el tiempo máximo permitido para el consumo del consentimiento.
                En caso de que no sea consumido, debe moverse al estado REJECTED.
              type: string
              format: date-time
              example: '2021-05-21T08:30:00Z'
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              maxLength: 20
            statusUpdateDateTime:
              type: string
              format: date-time
              example: '2021-05-21T08:30:00Z'
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              maxLength: 20
              description: |
                Fecha y hora en que el recurso fue actualizado. Una cadena con fecha y hora conforme a la especificación RFC-3339, siempre con la utilización de la timezone UTC (UTC time format).
            status:
              $ref: '#/components/schemas/EnumAuthorisationStatusType'
            loggedUser:
              $ref: '#/components/schemas/LoggedUser'
            businessEntity:
              $ref: '#/components/schemas/BusinessEntityV5'
            creditor:
              $ref: '#/components/schemas/IdentificationV5'
            payment:
              $ref: '#/components/schemas/PaymentConsentPaymentV5'
            debtorAccount:
              $ref: '#/components/schemas/ConsentsDebtorAccountV5'
            rejectionReason:
              $ref: '#/components/schemas/ConsentRejectionReasonV5'
        links:
          $ref: '#/components/schemas/LinkSingle'
        meta:
          $ref: '#/components/schemas/RegulatoryMeta'
    CreatePixPayment:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          minItems: 1
          items:
            type: object
            description: Objeto que contiene datos del pago y del receptor (creditor).
            required:
              - endToEndId
              - localInstrument
              - payment
              - creditorAccount
              - cnpjInitiator
            properties:
              endToEndId:
                $ref: '#/components/schemas/EndToEndIdWithoutRestriction'
              localInstrument:
                $ref: '#/components/schemas/EnumLocalInstrumentV5'
              payment:
                $ref: '#/components/schemas/PaymentPix'
              creditorAccount:
                $ref: '#/components/schemas/CreditorAccountV5'
              remittanceInformation:
                type: string
                maxLength: 140
                pattern: '[\w\W\s]*'
                example: Pagamento da nota XPTO035-002.
                description: |
                  Debe completarse siempre que el usuario pagador introduzca alguna información adicional en un pago, a ser enviada al receptor.
              qrCode:
                type: string
                maxLength: 512
                pattern: '[\w\W\s]*'
                example: |
                  00020104141234567890123426660014BR.GOV.BCB.PIX014466756C616E6F32303139406578616D706C652E636F6D27300012
                  BR.COM.OUTRO011001234567895204000053039865406123.455802BR5915NOMEDORECEBEDOR6008BRASILIA61087007490062
                  530515RP12345678-201950300017BR.GOV.BCB.BRCODE01051.0.080450014BR.GOV.BCB.PIX0123PADRAO.URL.PIX/0123AB
                  CD81390012BR.COM.OUTRO01190123.ABCD.3456.WXYZ6304EB76
                description: |
                  Representa la secuencia de caracteres correspondiente al QRCode puesto a disposición del pagador, que puede obtenerse mediante el lector del dispositivo del pagador o por copiar y pegar. Debe estar en el formato UTF-8 y propiciar el retorno de los datos del pagador tras la consulta en el DICT. Para los casos donde “/data/payment/details/localInstrument” sea igual a QRDN o APDN, los datos del cobro serán transmitidos por la ITP en el campo “/data/payment/details/payloadJWS”, permitiendo al detentor validar los datos del cobro sin necesidad de consultar el payloadJWS del QRCode en cuestión a través de la URL. No se le veda al detentor realizar la consulta; sin embargo, en casos de cambio del valor del campo "txId", la institución detentora deberá confiar en el payloadJWS transmitido por la ITP.
                  [Restricción] Campo de cumplimentación obligatoria cuando el valor de /data/payment/details/localInstrument sea igual a QRDN, APDN, QRES o APES, observado el tamaño máximo de 512 bytes.
              proxy:
                $ref: '#/components/schemas/ProxyV5'
              cnpjInitiator:
                type: string
                pattern: '^[0-9A-Z]{12}[0-9]{2}$'
                maxLength: 14
                example: '50685362000135'
                description: CNPJ del Iniciador de Pago debidamente habilitado para la prestación del Servicio de Iniciación en el Pix.
              transactionIdentification:
                $ref: '#/components/schemas/TxId'
              authorisationFlow:
                type: string
                enum:
                  - HYBRID_FLOW
                  - CIBA_FLOW
                  - FIDO_FLOW
                example: HYBRID_FLOW
                description: |
                  Campo condicional utilizado para identificar el flujo de autorización en el que el pago fue solicitado.

                  [Restricción] Si CIBA o FIDO, la cumplimentación es obligatoria. En caso de que el campo no esté presente en el payload, se entiende que el flujo de autorización utilizado es el HYBRID_FLOW.
              consentId:
                type: string
                maxLength: 256
                pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
                example: 'urn:bancoex:C1DD33123'
                description: |
                  Identificador único del consentimiento creado para la iniciación de pago solicitada. Deberá ser un URN - Uniform Resource Name.
                  Un URN, conforme se define en la [RFC8141](https://tools.ietf.org/html/rfc8141), es un Uniform Resource
                  Identifier - URI - que se asigna bajo el URI scheme "urn" y un namespace URN específico, con la intención de que el URN
                  sea un identificador de recurso persistente e independiente de la ubicación.
                  Considerando la cadena urn:bancoex:C1DD33123 como ejemplo de consentId tenemos:
                  - el namespace (urn)
                  - el identificador asociado al namespace de la institución transmisora (bancoex)
                  - el identificador específico dentro del namespace (C1DD33123).
                  Información más detallada sobre la construcción de namespaces debe consultarse en la [RFC8141](https://tools.ietf.org/html/rfc8141).

                  [Restricción] Este campo es de cumplimentación obligatoria cuando el valor del campo authorisationFlow sea igual a FIDO_FLOW.
    EndToEndId:
      type: string
      minLength: 32
      maxLength: 32
      pattern: '^([E])([0-9A-Z]{8})([0-9]{4})(0[1-9]|1[0-2])(0[1-9]|[1-2][0-9]|3[0-1])(2[0-3]|[01][0-9])([0-5][0-9])([a-zA-Z0-9]{11})$'
      example: E9040088820210128000800123873170
      description: |
        Se trata de un identificador único, generado en la institución iniciadora de pago y recibido en la institución detentora de la cuenta, que permea toda la jornada del pago Pix.

        [Restricción] La institución detentora debe obligatoriamente devolver el campo con el mismo valor recibido de la iniciadora.
    EndToEndIdWithoutRestriction:
      type: string
      minLength: 32
      maxLength: 32
      pattern: '^([E])([0-9A-Z]{8})([0-9]{4})(0[1-9]|1[0-2])(0[1-9]|[1-2][0-9]|3[0-1])(2[0-3]|[01][0-9])([0-5][0-9])([a-zA-Z0-9]{11})$'
      example: E9040088820210128000800123873170
      description: |
        Debe completarse en el formato estándar ExxxxxxxxyyyyMMddHHmmkkkkkkkkkkk (32 caracteres; “case sensitive”, es decir, diferencia letras mayúsculas y minúsculas), siendo:

        • “E” – fijo (1 carácter);

        • xxxxxxxx – identificación del agente que generó el ´EndToEndId´, que puede ser: el ISPB del participante directo o el ISPB del participante indirecto (8 caracteres numéricos [0-9]);

        • yyyyMMddHHmm – fecha, hora y minuto (12 caracteres), siguiendo el horario UTC, de la presentación de la orden de pago, en caso de que la liquidación sea prioritaria, o prevista para el envío de la orden al sistema de liquidación, en caso de que se realice una programación. Para órdenes prioritarias y no prioritarias, se acepta la cumplimentación, por el agente que generó el ´EndToEndId´, con una tolerancia máxima de 12 horas, hacia el futuro y hacia el pasado, en relación con el horario efectivo de procesamiento de la orden por el SPI;

        • kkkkkkkkkkk – secuencial creado por el agente que generó el ´EndToEndId´ (11 caracteres alfanuméricos [a-z/A-Z/0-9]). Debe ser único dentro de cada “yyyyMMddHHmm”.

        Se admite que el ´EndToEndId´ sea generado por el participante directo, por el participante indirecto o por el iniciador de pago.

        Debe ser único, no pudiendo repetirse en ninguna otra operación enviada al SPI.

        En el caso de Pix programado, la institución iniciadora deberá, en lo que respecta a la composición del endToEndId, utilizar la fecha para la cual el Pix está siendo programado y el horario fijo 15:00 UTC, que dará a la institución detentora la ventana de efectivización de 00:00 a 23:59 del horario de Brasilia.
    PaymentPix:
      type: object
      description: Objeto que contiene datos del pago como moneda y valor.
      required:
        - amount
        - currency
      properties:
        amount:
          $ref: '#/components/schemas/AmountV5'
        currency:
          type: string
          maxLength: 3
          pattern: '^([A-Z]{3})$'
          example: BRL
          description: |
            Código de la moneda nacional según el modelo ISO-4217, es decir, 'BRL'.
            Todos los valores monetarios informados están representados con la moneda vigente de Brasil.
    TxId:
      type: string
      pattern: '^[a-zA-Z0-9]{1,35}$'
      maxLength: 35
      example: E00038166201907261559y6j6
      description: |
        Se trata de un identificador de transacción que debe ser retransmitido intacto por el PSP del pagador al generar la orden de pago. Esa información permitirá al receptor identificar y correlacionar la transferencia, cuando sea recibida, con la presentación de las instrucciones al pagador.
        Los caracteres permitidos en el contexto del Pix para el campo txid (EMV 62-05) son:
        - Letras minúsculas, de ‘a’ a ‘z’
        - Letras mayúsculas, de ‘A’ a ‘z’
        - Dígitos decimales, de ‘0’ a ‘9’

        [Restricción] Cumplimentación condicional de acuerdo con el contenido del campo localInstument:

        – MANU - El campo transactionIdentification no debe completarse.
        – DICT - El campo transactionIdentification no debe completarse.
        – INIC - El campo transactionIdentification debe completarse obligatoriamente y debe contener hasta 25 caracteres alfanuméricos ([a-z|A-Z|0-9]).
        – QRES - En caso de que el QR Code estático posea el dato TxId completado, el campo transactionIdentification deberá completarse con ese valor; en caso de que el QR Code no posea el TxId, el campo transactionIdentification no deberá completarse. El TxId debe contener hasta 25 caracteres alfanuméricos ([a-z|A-Z|0-9]).
        – QRDN - Será obligatoria su cumplimentación con el TxId del payload JSON del QR Code dinámico. El TxId debe contener entre 26 y 35 caracteres alfanuméricos ([a-z|A-Z|0-9]).
        – APDN - Será obligatoria su cumplimentación con el TxId del payload JSON del QR Code dinámico. El TxId debe contener entre 26 y 35 caracteres alfanuméricos ([a-z|A-Z|0-9]).
        – APES - En caso de que el QR Code estático posea el dato TxId completado, el campo transactionIdentification deberá completarse con ese valor; en caso de que el QR Code no posea el TxId, el campo transactionIdentification no deberá completarse. El TxId debe contener hasta 25 caracteres alfanuméricos ([a-z|A-Z|0-9]).

        La institución detentora de la cuenta debe validar si la condicionalidad y el formato del campo fueron atendidos por la institución iniciadora de pago.
