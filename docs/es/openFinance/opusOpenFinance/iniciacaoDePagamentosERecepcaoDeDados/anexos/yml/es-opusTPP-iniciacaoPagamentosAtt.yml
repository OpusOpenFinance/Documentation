                $ref: '#/components/schemas/ResponsePaymentsGetConsentsConsentIdPayments'
        '400':
          description: 'La solicitud fue mal formada, omitiendo atributos obligatorios, ya sea en el payload o mediante atributos en la URL.'
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        default:
          description: Sigue el estándar de respuesta definido por el BACEN
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
                $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
    patch:
      tags:
        - Pago
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - $ref: '#/components/parameters/authorisationServerId'
        - $ref: '#/components/parameters/headerConsentId'
        - $ref: '#/components/parameters/authorizationHeader'
        - $ref: '#/components/parameters/xFapiAuthDate'
        - $ref: '#/components/parameters/xFapiCustomerIpAddress'
        - $ref: '#/components/parameters/xFapiInteractionId'
        - $ref: '#/components/parameters/xCustomerUserAgent'
        - $ref: '#/components/parameters/xIdempotencyKey'
        - name: consentId
          in: path
          description: Identificador del consentimiento
          schema:
            type: string
          required: true
          example: urn:amazingbank:5e456567-e53c-41c4-80f6-b16bcd63d243
      description: |
        Método proxy para revocar todos los pagos referentes al mismo consentimiento. Sigue el estándar de solicitud/respuesta definido en la documentación oficial ([Open Finance - API Payment Initiation](https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/17375943/API+-+Pagamentos)), versión 5.0.0.

        Este endpoint debe usarse únicamente para cancelar, a pedido del cliente pagador, las transacciones que se encuentren programadas con éxito (SCHD). Los pagos que estén Pendientes (PDNG) o en otro estado diferente de SCHD no son susceptibles de cancelación en este endpoint. La cancelación de pagos programados (SCHD) puede enviarse hasta las 22:00 (hora de Brasilia) del día anterior a la fecha de efectivización del pago.
        Todos los pagos vinculados a ese consentimiento y previstos para ocurrir a partir del día siguiente serán cancelados en un plazo de hasta 60 minutos.
        La ITP deberá, con posterioridad al pedido de cancelación, consultar los pagos y verificar su estado.
        - Si no resta ningún pago (ocurrencia) que pueda ser cancelado, la solicitud PATCH devuelve HTTP Status 422 con el code PAGAMENTO_NAO_PERMITE_CANCELAMENTO.
        - En caso de que reciba un 422, la institución iniciadora debe hacer una solicitud GET del pago para verificar su situación actual, así como los detalles asociados.
        - En caso de que el consentimiento enviado por el iniciador en el path de la solicitud no exista en la institución detentora de la cuenta, la detentora deberá devolver el código 404.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchPixPayment'
        description: Payload para la cancelación del pago.
        required: true
      responses:
        '502':
          description: Error en Opus Open Client al comunicarse con la institución detentora de la cuenta
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
                $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Tiempo límite de conexión excedido al comunicarse con la institución detentora de la cuenta
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
                $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '202':
          description: Solicitud de cancelación de los pagos realizada.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/xFapiInteractionIdResponse'
            x-v:
              $ref: '#/components/headers/xV'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
        '422':
          description: 'Seguir las orientaciones presentes en la descripción de este endpoint.'
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422ResponseErrorCreatePixPayment'
        default:
          description: Sigue el estándar de respuesta definido por el BACEN
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
                $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
