  headers:
    xOriginError:
      description: Indica el origen del error.
      schema:
        $ref: '#/components/schemas/EnumOriginError'
      required: false
    xErrorSourceUrl:
      description: URL de la llamada que originó el error, presente solo cuando `x-origin-error` = `participant`.
      schema:
        type: string
      required: false
    xRegulatoryV:
      description: Versión regulatoria deseada para la llamada al participante (disponible solo en rutas no-proxy).
      schema:
        $ref: '#/components/schemas/RegulatoryVersion'
      required: false
    xSelectedRegulatoryV:
      description: Versión regulatoria efectivamente utilizada en la solicitud al participante.
      schema:
        $ref: '#/components/schemas/SelectedRegulatoryVersion'
      required: true
    xFapiInteractionIdResponse:
      description: |
        Un UUID [RFC4122](https://tools.ietf.org/html/rfc4122) usado como ID de correlación entre request y response. Campo de generación y envío obligatorio por la institución iniciadora (client), y su valor debe ser "espejado" por la institución detentora (server) en el encabezado de respuesta.
      schema:
        $ref: '#/components/schemas/XFapiInteractionId'
      required: true
    xV:
      description: 'Encabezado que indica la versión implementada de la API por la institución financiera para atender la solicitud. Debe completarse de forma completa, por ejemplo: x-v : 1.0.2.'
      required: true
      schema:
        $ref: '#/components/schemas/XV'
  parameters:
    applicationId:
      name: x-application-id
      in: header
      required: true
      description: Identificador de la aplicación que realiza la solicitud
      schema:
        $ref: '#/components/schemas/UUID'
    authorisationServerId:
      name: x-authorisation-server-id
      required: true
      description: Identificador del Authorisation Server de la institución transmisora del consentimiento, obtenido mediante la consulta de la lista de participantes
      in: header
      schema:
        $ref: '#/components/schemas/UUID'
    enrollmentId:
      name: enrollmentId
      in: path
      required: true
      description: |
        Identificador único del vínculo de cuenta creado para la iniciación de pago solicitada. Deberá ser un URN - Uniform Resource Name.
        Un URN, conforme se define en la [RFC8141](https://tools.ietf.org/html/rfc8141), es un Uniform Resource
        Identifier - URI - que se asigna bajo el URI scheme "urn" y un namespace URN específico, con la intención de que el URN
        sea un identificador de recurso persistente e independiente de la ubicación.
        Considerando la cadena urn:bancoex:C1DD33123 como ejemplo de enrollmentId tenemos:
        - el namespace (urn)
        - el identificador asociado al namespace de la institución detentora de la cuenta (bancoex)
        - el identificador específico dentro del namespace (C1DD33123).
        Información más detallada sobre la construcción de namespaces debe consultarse en la [RFC8141](https://tools.ietf.org/html/rfc8141).
      schema:
        $ref: '#/components/schemas/enrollmentId'
    consentId:
      name: consentId
      in: path
      description: |
        El consentId es el identificador único del consentimiento y deberá ser un URN - Uniform Resource Name.
        Un URN, conforme se define en la [RFC8141](https://tools.ietf.org/html/rfc8141), es un Uniform Resource
        Identifier - URI - que se asigna bajo el URI scheme "urn" y un namespace URN específico, con la intención de que el URN
        sea un identificador de recurso persistente e independiente de la ubicación.
        Considerando la cadena urn:bancoex:C1DD33123 como ejemplo de consentId tenemos:
        - el namespace (urn)
        - el identificador asociado al namespace de la institución detentora de la cuenta (bancoex)
        - el identificador específico dentro del namespace (C1DD33123).
        Información más detallada sobre la construcción de namespaces debe consultarse en la [RFC8141](https://tools.ietf.org/html/rfc8141).
      required: true
      schema:
        type: string
        pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
        maxLength: 256
    recurringConsentId:
      name: recurringConsentId
      in: path
      description: |
        El `recurringConsentId` es el identificador único del consentimiento de larga duración y deberá ser un URN - Uniform Resource Name.
        Un URN, conforme se define en la [RFC8141](https://tools.ietf.org/html/rfc8141), es un Uniform Resource
        Identifier - URI - que se asigna bajo el URI scheme "urn" y un namespace URN específico, con la intención de que el URN
        sea un identificador de recurso persistente e independiente de la ubicación.
        Considerando la cadena urn:bancoex:C1DD33123 como ejemplo de `recurringConsentId` tenemos:
        - el namespace (urn)
        - el identificador asociado al namespace de la institución detentora (bancoex).
        - el identificador específico dentro del namespace (C1DD33123).
        Información más detallada sobre la construcción de namespaces debe consultarse en la [RFC8141](https://tools.ietf.org/html/rfc8141).
      required: true
      schema:
        type: string
        pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
        maxLength: 256
    regulatoryV:
        name: x-regulatory-v
        required: false
        description: Versión regulatoria deseada para la llamada al participante (disponible solo en rutas no-proxy).
        in: header
        schema:
          $ref: '#/components/schemas/RegulatoryVersion'
    authorizationHeader:
      name: Authorization
      in: header
      description: Encabezado HTTP estándar. Permite que las credenciales se proporcionen dependiendo del tipo de recurso solicitado
      required: true
      schema:
        type: string
        pattern: '[\w\W\s]*'
        maxLength: 2048
    xCustomerUserAgent:
      name: x-customer-user-agent
      in: header
      description: Indica el user-agent que utiliza el usuario.
      required: false
      schema:
        type: string
        pattern: '[\w\W\s]*'
        minLength: 1
        maxLength: 100
    xFapiAuthDate:
      name: x-fapi-auth-date
      in: header
      description: 'Fecha en que el usuario se conectó por última vez con la institución iniciadora. Representada de acuerdo con la [RFC7231](https://tools.ietf.org/html/rfc7231). Ejemplo: Sun, 10 Sep 2017 19:43:31 UTC'
      required: false
      schema:
        type: string
        pattern: '^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), \d{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) \d{4} \d{2}:\d{2}:\d{2} (GMT|UTC)$'
        minLength: 29
        maxLength: 29
    xFapiCustomerIpAddress:
      name: x-fapi-customer-ip-address
      in: header
      description: La dirección IP del usuario si se encuentra actualmente conectado con la institución iniciadora.
      required: false
      schema:
        type: string
        pattern: '[\w\W\s]*'
        minLength: 1
        maxLength: 100
    xFapiInteractionId:
      name: x-fapi-interaction-id
      in: header
      description: Un UUID [RFC4122](https://tools.ietf.org/html/rfc4122) usado como ID de correlación entre request y response. Campo de generación y envío obligatorio por la institución iniciadora (client), y su valor debe ser "espejado" por la institución detentora (server) en el encabezado de respuesta. En caso de que no se reciba o de que se reciba un valor inválido, la institución detentora debe generar un x-fapi-interaction-id y devolverlo en la respuesta con el HTTP status code 400. La institución iniciadora debe acatar el valor recibido de la detentora.
      required: true
      schema:
        type: string
        format: uuid
        minLength: 1
        maxLength: 36
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        example: d78fc4e5-37ca-4da3-adf2-9b082bf92280
    xIdempotencyKey:
      name: x-idempotency-key
      in: header
      description: Encabezado HTTP personalizado. Identificador de solicitud exclusivo para soportar la idempotencia.
      required: true
      schema:
        type: string
        maxLength: 40
        pattern: ^(?!\s)(.*)(\S)$
    xBcbNfc:
      name: x-bcb-nfc
      in: header
      description: El campo representa una transacción iniciada vía NFC. El envío de este campo es obligatorio en ese escenario. Las instituciones detentoras deben almacenar la información y correlacionarla con el consentimiento y el pago originado.
      required: false
      schema:
        type: boolean

