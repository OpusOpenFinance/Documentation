                  - RP_INVALIDA: El identificador de la Relying Party informado no puede verificarse.
                  - STATUS_VINCULO_INVALIDO: El estado del vínculo de cuenta es tal que no permite el registro de una nueva credencial.
                  - PARAMETRO_NAO_INFORMADO: Parámetro no informado.
                  - PARAMETRO_INVALIDO: Parámetro inválido.
                  - ERRO_IDEMPOTENCIA: Error de idempotencia.
                  - MAXIMO_CHALLENGES_ATINGIDO: Los parámetros de firma FIDO ya fueron generados para el enrollmentId especificado.
              title:
                type: string
                maxLength: 255
                pattern: '[\w\W\s]*'
                example: Permissões inválidas
                description: |
                  Título específico del error reportado, de acuerdo con el código enviado:
                  - RP_INVALIDA: Relying party inválida.
                  - STATUS_VINCULO_INVALIDO: Estado del vínculo de cuenta inválido.
                  - PARAMETRO_NAO_INFORMADO: Parámetro no informado.
                  - PARAMETRO_INVALIDO: Parámetro inválido.
                  - ERRO_IDEMPOTENCIA: Error de idempotencia.
                  - MAXIMO_CHALLENGES_ATINGIDO: Los parámetros de firma FIDO ya fueron generados para el enrollmentId especificado.
              detail:
                type: string
                maxLength: 2048
                pattern: '[\w\W\s]*'
                example: 'Permissões inválidas'
