                  - RP_INVALIDA: El identificador de la Relying Party informado no puede verificarse.
                  - STATUS_VINCULO_INVALIDO: El estado del vínculo de cuenta es tal que no permite el registro de una nueva credencial.
                  - PARAMETRO_NAO_INFORMADO: Parámetro [nome_campo] obligatorio no informado.
                  - PARAMETRO_INVALIDO: El parámetro [nome_campo] no obedece las reglas de formato esperadas.
                  - ERRO_IDEMPOTENCIA: El contenido del mensaje (claim data) difiere del contenido asociado a esta clave de idempotencia (x-idempotency-key).
                  - MAXIMO_CHALLENGES_ATINGIDO: Los parámetros de firma FIDO ya fueron generados para el enrollmentId especificado.
