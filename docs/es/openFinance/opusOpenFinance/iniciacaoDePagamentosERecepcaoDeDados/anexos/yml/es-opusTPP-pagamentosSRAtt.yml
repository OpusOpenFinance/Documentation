                  - ORIGEM_FIDO_INVALIDA: El valor contenido en el campo [response.clientDataJSON.origin](https://www.w3.org/TR/webauthn-2/#dom-authenticatorresponse-clientdatajson) no puede verificarse.
                  - RP_INVALIDA: El valor contenido en el campo [data.response.attestationObject.authData.rpIdHash](https://www.w3.org/TR/webauthn-2/#sctn-authenticator-data) no puede verificarse.
                  - CHALLENGE_INVALIDO: El campo [response.clientDataJSON.challenge](https://www.w3.org/TR/webauthn-2/#dom-authenticatorresponse-clientdatajson) posee un valor codificado diferente del valor generado por el servidor.
                  - PUBLIC_KEY_INVALIDA: La clave pública enviada es incompatible con las definiciones del servidor FIDO2.
                  - EXTENSION_INVALIDA: Las extensiones extraídas son incompatibles con las directrices de seguridad del servidor FIDO2.
                  - PARAMETRO_NAO_INFORMADO: Parámetro no informado.
                  - PARAMETRO_INVALIDO: Parámetro inválido.
                  - ERRO_IDEMPOTENCIA: Error de idempotencia.
              title:
