      operationId: authorizeRecurringConsent
      description: |
        Autorización de un consentimiento de Pix Automático con estado AWAITING_AUTHORISATION a partir del access_token emitido por la jornada sin redirección y el envío de señales de riesgo. Los consentimientos con una única instancia de aprobación deben transitar al estado AUTHORISED en la ejecución exitosa de este método. Para consentimientos con múltiples instancias aprobadoras, el consentimiento deberá permanecer en PARTIALLY_ACCEPTED hasta que todos los aprobadores hayan autorizado. En caso de fallo de negocio (HTTP Status Code 422), el consentimiento de pago debe transitar al estado REJECTED y seguir los motivos de rechazo presentes en la API de pagos Automáticos.
        Si la institución detentora identifica que la cuenta de débito informada por el iniciador en la creación del consentimiento difiere de la cuenta de débito vinculada al dispositivo, la detentora debe devolver en este método el error HTTP 422 con el código CONTA_DEBITO_DIVERGENTE_CONSENTIMENTO_VINCULO y rechazar el consentimiento con el motivo CONTA_NAO_PERMITE_PAGAMENTO.
        Si el iniciador, durante la creación del consentimiento, omite la cuenta de débito, la detentora debe considerar la cuenta de débito asociada al vínculo autorizado para completar el objeto /data/debtorAccount, presente en el consentimiento.
        Los límites relacionados con el vínculo no deben validarse durante el proceso de autorización de este consentimiento ni durante su ciclo de vida.
      summary: Autorización de un consentimiento de Pix Automático en la jornada sin redirección
      externalDocs:
        description: Open Finance - API Enrollments for Payment Initiation
        url: https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/141557761/SV+API+-+Pagamentos+sem+Redirecionamento
