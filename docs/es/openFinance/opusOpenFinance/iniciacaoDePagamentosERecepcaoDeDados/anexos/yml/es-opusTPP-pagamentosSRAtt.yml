                  - RP_INVALIDA: El "RpIdHash" no puede verificarse.
                  - CHALLENGE_INVALIDO: Challenge inválido.
                  - PUBLIC_KEY_INVALIDA: Clave pública inválida.
                  - EXTENSION_INVALIDA: Extensiones inválidas.
                  - PARAMETRO_NAO_INFORMADO: Parámetro no informado.
                  - PARAMETRO_INVALIDO: Parámetro inválido.
                  - ERRO_IDEMPOTENCIA: Error de idempotencia.
              detail:
                type: string
                maxLength: 2048
                pattern: '[\w\W\s]*'
                example: 'Permissões inválidas'
                description: |
