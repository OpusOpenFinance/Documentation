openapi: 3.0.3
info:
  title: OOF FIDO Server API
  description: |
    Opus Open Finance FIDO Server OpenAPI spec
  version: 1.0.0

servers:
  - url: http://oof-fido-server
    description: Default FIDO Server

tags:
  - name: Relying Party
    description: Relying party management
  - name: Attestation
    description: WebAuthn registration (attestation) flow
  - name: Assertion
    description: WebAuthn authentication (assertion) flow

paths:
  /relying-party:
    put:
      tags: [Relying Party]
      summary: Create or update relying party
      description: |
        **Provisioning hook for Open Finance Brasil onboarding.**

        This endpoint should be called whenever **DCR (Dynamic Client Registration)** or
        **DCM (Dynamic Client Management)** occurs, so the FIDO Server can **provision or
        refresh the Relying Party (RP)** configuration (e.g., rpId, rpName, allowed origins)
        before attestation/assertion ceremonies.
      operationId: putRelyingParty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelyingPartyRequest'
      responses:
        '200':
          description: Success (client ignores body)
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/ClientError'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /attestation/options:
    post:
      tags: [Attestation]
      summary: Get attestation (registration) options
      operationId: postAttestationOptions
      parameters:
        - $ref: '#/components/parameters/XRpId'
        - $ref: '#/components/parameters/XBrandId'
        - $ref: '#/components/parameters/XIdempotencyKey'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttestationOptionsRequest'
      responses:
        '200':
          description: Attestation options for registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestationOptionsResponse'
        '400':
          $ref: '#/components/responses/ClientError'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /attestation/result:
    post:
      tags: [Attestation]
      summary: Submit attestation (registration) result
      operationId: postAttestationResult
      parameters:
        - $ref: '#/components/parameters/XRpId'
        - $ref: '#/components/parameters/XBrandId'
        - $ref: '#/components/parameters/XIdempotencyKey'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttestationResultRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
        '400':
          $ref: '#/components/responses/ClientError'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /assertion/options:
    post:
      tags: [Assertion]
      summary: Get assertion (sign-in) options
      operationId: postAssertionOptions
      parameters:
        - $ref: '#/components/parameters/XRpId'
        - $ref: '#/components/parameters/XBrandId'
        - $ref: '#/components/parameters/XIdempotencyKey'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssertionOptionsRequest'
      responses:
        '200':
          description: Assertion options for authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssertionOptionsResponse'
        '400':
          $ref: '#/components/responses/ClientError'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /assertion/result:
    post:
      tags: [Assertion]
      summary: Submit assertion (sign-in) result
      operationId: postAssertionResult
      parameters:
        - $ref: '#/components/parameters/XRpId'
        - $ref: '#/components/parameters/XBrandId'
        - $ref: '#/components/parameters/XIdempotencyKey'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssertionResultRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStatus'
        '400':
          $ref: '#/components/responses/ClientError'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'

components:
  parameters:
    XRpId:
      name: x-rp-id
      in: header
      required: true
      schema:
        type: string
      description: Relying party ID
    XBrandId:
      name: x-brand-id
      in: header
      required: true
      schema:
        type: string
      description: Brand ID (OFB Authorization Server ID)
    XIdempotencyKey:
      name: x-idempotency-key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Idempotency key
    XCorrelationId:
      name: x-correlation-id
      in: header
      required: true
      schema:
        type: string
      description: Correlation ID for tracing

  responses:
    ClientError:
      description: Client error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseStatus'
    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseStatus'
    UnexpectedError:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseStatus'

  schemas:
    RelyingPartyRequest:
      type: object
      properties:
        relyingPartyId:
          type: string
        relyingPartyName:
          type: string
        relyingPartyOrigins:
          type: array
          items:
            type: string
        brandId:
          type: string
          description: OFB Authorization Server ID

    AttestationOptionsRequest:
      type: object
      properties:
        username:
          type: string
        displayName:
          type: string
        authenticatorSelection:
          $ref: '#/components/schemas/AuthenticatorSelection'
        attestation:
          type: string
        extensions:
          type: object
          additionalProperties: true

    AttestationOptionsResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseStatus'
        - type: object
          properties:
            rp:
              $ref: '#/components/schemas/RP'
            user:
              $ref: '#/components/schemas/AttestationUser'
            challenge:
              type: string
            pubKeyCredParams:
              type: array
              items:
                $ref: '#/components/schemas/PublicKeyCredentialParams'
            timeout:
              type: integer
              format: int64
            excludeCredentials:
              type: array
              items:
                $ref: '#/components/schemas/ExcludeCredentials'
            authenticatorSelection:
              $ref: '#/components/schemas/AuthenticatorSelection'
            attestation:
              type: string
            extensions:
              type: object
              additionalProperties: true

    AttestationResultRequest:
      type: object
      properties:
        id:
          type: string
        rawId:
          type: string
        response:
          $ref: '#/components/schemas/Attestation'
        getClientExtensionResults:
          type: object
          additionalProperties: true
        authenticatorAttachment:
          type: string
        type:
          type: string

    AssertionOptionsRequest:
      type: object
      properties:
        username:
          type: string
        userVerification:
          type: string
        extensions:
          type: object
          additionalProperties: true
          description: Extension payload (map/object)

    AssertionOptionsResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseStatus'
        - type: object
          properties:
            challenge:
              type: string
            timeout:
              type: integer
              format: int64
            rpId:
              type: string
            allowCredentials:
              type: array
              items:
                $ref: '#/components/schemas/ExternalPublicKeyCredentialDescriptor'
            userVerification:
              type: string
            extensions:
              type: object
              additionalProperties: true

    AssertionResultRequest:
      type: object
      properties:
        id:
          type: string
        rawId:
          type: string
        response:
          $ref: '#/components/schemas/Assertion'
        getClientExtensionResults:
          type: object
          additionalProperties: true
        type:
          type: string

    ResponseStatus:
      type: object
      properties:
        status:
          type: string
        errorMessage:
          type: string
          description: Present on error responses (4xx/5xx)

    RP:
      type: object
      properties:
        name:
          type: string

    AttestationUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        displayName:
          type: string

    AuthenticatorSelection:
      type: object
      properties:
        authenticatorAttachment:
          type: string
        userVerification:
          type: string
        residentKey:
          type: string
        requireResidentKey:
          type: boolean

    PublicKeyCredentialParams:
      type: object
      properties:
        type:
          type: string
        alg:
          type: integer
          format: int64

    ExcludeCredentials:
      type: object
      properties:
        type:
          type: string
        id:
          type: string

    Attestation:
      type: object
      properties:
        clientDataJSON:
          type: string
        attestationObject:
          type: string

    Assertion:
      type: object
      properties:
        authenticatorData:
          type: string
        signature:
          type: string
        userHandle:
          type: string
        clientDataJSON:
          type: string

    ExternalPublicKeyCredentialDescriptor:
      type: object
      properties:
        type:
          type: string
        id:
          type: string
        transport:
          type: array
          items:
            type: string
