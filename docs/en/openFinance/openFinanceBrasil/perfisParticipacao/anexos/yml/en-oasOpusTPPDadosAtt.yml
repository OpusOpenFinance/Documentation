          properties:
            callbackApplicationUri:
              type: string
              format: uri
              maxLength: 2000
              description: Callback URI of the application after the authentication process
              example: 'https://aplicativo.instituicao.com.br'
              pattern: '^(https?:\/\/)?(www\.)?[-a-zA-Z0-9@:%._\+~#=]{2,256}\.[a-z]{2,6}\b([-a-zA-Z0-9@:%_\+.~#?&\/\/=]*)$'
            loggedUser:
