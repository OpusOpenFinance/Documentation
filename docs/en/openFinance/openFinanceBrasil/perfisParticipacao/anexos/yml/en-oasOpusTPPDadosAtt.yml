openapi: 3.0.0
info:
  title: oofc-core
  description: |-
    Opus Open Client - Consent management core

    # (Data Sharing Requests for) Customer Registration and Transactional Data

    For more information about the consent creation flow, refer to the Opus Open Finance Platform documentation.
  version: 1.0.0
tags:
  - name: Opus Open Finance
    description: |-
      Consent management endpoints
  - name: Resources
    description: |-
      Endpoints for listing the resources linked to the consent. The expected and returned data models are the same as those defined by the official documentation ([Open Finance - API Resources](https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/17369706/API+-+Resources)).
  - name: Customer Data
    description: |-
      Endpoints for querying the customer's registration data. The expected and returned data models are the same as those defined by the official documentation ([Open Finance - API Customers](https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/17370003/API+-+Dados+Cadastrais)).
  - name: Credit Cards
    description: |-
      Endpoints for querying post-paid account data (credit cards). The expected and returned data models are the same as those defined by the official documentation ([Open Finance - API Credit-cards-account](https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/17370864/API+-+Cart+o+de+Cr+dito)).
  - name: Accounts
    description: |-
      Endpoints for querying account data. The expected and returned data models are the same as those defined by the official documentation ([Open Finance - API Accounts](https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/17371726/API+-+Contas)).
  - name: Loans
    description: |-
      Endpoints for querying loan data. The expected and returned data models are the same as those defined by the official documentation ([Open Finance - API Loans](https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/17372520/API+-+Opera+es+de+Cr+dito+-+Empr+stimos)).
  - name: Financings
    description: |-
      Endpoints for querying financing data. The expected and returned data models are the same as those defined by the official documentation ([Open Finance - API Financings](https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/17373362/API+-+Opera+es+de+Cr+dito+-+Financiamento)).
  - name: Unarranged Account Overdrafts
    description: |-
      Endpoints for querying unarranged account overdraft data. The expected and returned data models are the same as those defined by the official documentation ([Open Finance - API Unarranged-accounts-overdraft](https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/17374226/API+-+Opera+es+de+Cr+dito+-+Adiantamento+a+Depositantes)).
  - name: Discounted Credit Rights
    description: |-
      Endpoints for querying discounted credit rights (invoice financing) data. The expected and returned data models are the same as those defined by the official documentation ([Open Finance - API Invoice-financings](https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/17375055/API+-+Opera+es+de+Cr+dito+-+Direitos+Credit+rios+Descontados)).
  - name: Investments - Bank Fixed Income
    description: |-
      Endpoints for querying bank fixed income data. The expected and returned data models are the same as those defined by the official documentation ([Open Finance - API Bank-fixed-incomes](https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/75006394/API+-+Investimentos+-+Renda+Fixa+Banc+ria)).
  - name: Investments - Credit Fixed Income
    description: |-
      Endpoints for querying credit fixed income data. The expected and returned data models are the same as those defined by the official documentation ([Open Finance - API Credit-fixed-incomes](https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/75005953/API+-+Investimentos+-+Renda+Fixa+Cr+dito)).
  - name: Investments - Variable Income
    description: |-
      Endpoints for querying variable income data. The expected and returned data models are the same as those defined by the official documentation ([Open Finance - API Variable-incomes](https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/82378753/API+-+Investimentos+-+Renda+Vari+vel)).
  - name: Investments - Treasury Direct Securities
    description: |-
      Endpoints for querying Treasury Direct securities data. The expected and returned data models are the same as those defined by the official documentation ([Open Finance - API Treasure-titles](https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/86605826/API+-+Investimentos+-+T+tulos+do+Tesouro+Direto)).
  - name: Investments - Investment Funds
    description: |-
      Endpoints for querying investment fund data. The expected and returned data models are the same as those defined by the official documentation ([Open Finance - API Funds](https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/89784321/API+-+Investimentos+-+Fundos+de+Investimento)).
  - name: Deeplinks
    description: |-
      Endpoints for retrieving the iOS Universal Links and Android App Links settings so that the receiving institution's application can intercept URLs.
servers:
  - url: https://open-finance-core.instituicao.com.br
paths:
  /.well-known/assetlinks.json:
    get:
      tags:
        - Deeplinks
      operationId: oofcDeeplinksGetAssetLinks
      description: Method for retrieving the contents of the assetlinks.json file
      summary: Retrieve Android App Links configuration file
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetLinks'
  /.well-known/apple-app-site-association:
    get:
      tags:
        - Deeplinks
      operationId: oofcDeeplinksGetAppleAppSiteAssociation
      description: Method for retrieving the contents of the apple-app-site-association file
      summary: Retrieve Apple App Site Association configuration file
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppleAppSiteAssociation'
  /opus-open-finance/consents/v1/consents:
    post:
      tags:
        - Opus Open Finance
      operationId: oofcConsentsPostConsents
      description: Method for creating a new consent request.
      summary: Create new consent request.
      externalDocs:
        description: Open Finance - Consent API
        url: https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/17369335/API+-+Consentimento
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsentRequest'
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - $ref: '#/components/parameters/authorisationServerId'
      responses:
        '502':
          description: Error in Opus Open Client while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateConsentResponse'
        default:
          description: Error returned by the transmitting institution, following the standard defined by BACEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /opus-open-finance/consents/v1/consents/{consentId}/authorisation-retry:
    post:
      tags:
        - Opus Open Finance
      operationId: oofcConsentsPostConsentsConsentIdAuthorisationRetry
      description: Method for generating a new authorisation URL for the consent identified by consentId
      summary: Generate a new authorisation URL for the consent identified by consentId.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryConsentRequest'
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - $ref: '#/components/parameters/authorisationServerId'
        - $ref: '#/components/parameters/consentId'
      responses:
        '502':
          description: Error in Opus Open Client while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryConsentResponse'
  /opus-open-finance/consents/v1/consents/{consentId}/extensions:
    post:
      tags:
        - Opus Open Finance
      operationId: oofcConsentsPostConsentsConsentIdExtends
      description: Method for extending the consent period
      summary: Renew an existing consent by consentId.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsentExtends'
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - $ref: '#/components/parameters/authorisationServerId'
        - $ref: '#/components/parameters/consentId'
        - $ref: '#/components/parameters/customerUserAgent'
        - $ref: '#/components/parameters/fapiCustomerIpAddress'
      responses:
        '502':
          description: Error in Opus Open Client while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseConsentExtends'
    get:
      tags:
        - Opus Open Finance
      operationId: oofcConsentsGetConsentsConsentIdExtends
      description: Method for retrieving details of extensions to the consent identified by consentId.
      summary: Retrieve details of the extensions made to the consent identified by consentId.
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - $ref: '#/components/parameters/authorisationServerId'
        - $ref: '#/components/parameters/consentId'
      responses:
        '502':
          description: Error in Opus Open Client while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseConsentReadExtends'
  /opus-open-finance/consents/v1/consents/{consentId}:
    get:
      tags:
        - Opus Open Finance
      operationId: oofcConsentsGetConsentsConsentId
      description: Method for retrieving the details of a consent identified by consentId
      summary: Retrieve the details of the consent identified by consentId.
      externalDocs:
        description: Open Finance - Consent API
        url: https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/17369335/API+-+Consentimento
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - $ref: '#/components/parameters/authorisationServerId'
        - $ref: '#/components/parameters/consentId'
      responses:
        '200':
          description: Consent successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetConsentResponse'
        '502':
          description: Error in Opus Open Client while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        default:
          description: Error returned by the transmitting institution, following the standard defined by BACEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
    delete:
      tags:
        - Opus Open Finance
      operationId: oofcConsentsDeleteConsentsConsentId
      description: Method for deleting / revoking the consent identified by consentId
      summary: Delete / Revoke the consent identified by consentId.
      externalDocs:
        description: Open Finance - Consent API
        url: https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/17369335/API+-+Consentimento
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - $ref: '#/components/parameters/authorisationServerId'
        - $ref: '#/components/parameters/consentId'
      responses:
        '204':
          description: Consent successfully revoked.
        '502':
          description: Error in Opus Open Client while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        default:
          description: Error returned by the transmitting institution, following the standard defined by BACEN
          content:
            application/jwt:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /opus-open-finance/participants:
    get:
      tags:
        - Opus Open Finance
      operationId: oofcGetParticipants
      description: Method for retrieving the participants registered in the directory
      summary: Details of the participants registered in the directory, identifying their APIs
      externalDocs:
        description: Open Finance - Regulatory roles for OpenID and OAuth 2.0 mappings
        url: https://openbanking-brasil.github.io/specs-seguranca/open-banking-brasil-dynamic-client-registration-1_ID2-ptbr.html#section-7.2
      parameters:
       - in: query
         name: role
         schema:
           type: string
         description: Filters OrgDomainRoleClaims containing the given role. Role types are subject to change; check the externalDocs described.
       - in: query
         name: familyType
         schema:
           type: string
         description: Filters ApiResources containing the given familyType
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantsResponse'
        '502':
          description: Error in Opus Open Client while communicating with the BACEN participants API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded while communicating with the BACEN participants API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /opus-open-finance/dcm:
    get:
      operationId: oofcGetDcm
      description: Method for retrieving the dcm data of all the application's brand clients.
      tags:
        - Opus Open Finance
      summary: Details of the dcm status of the brand clients.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DcmData'
        '502':
          description: Error in Opus Open Client while communicating with the account-holding institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded while communicating with the BACEN participants API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
    put:
      operationId: oofcPutDcm
      description: Method for updating the dcm data of all the application's brand clients.
      tags:
        - Opus Open Finance
      summary: Update of the dcm data of the brand clients.
      parameters:
        - $ref: '#/components/parameters/applicationId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutDcmRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DcmData'
        '502':
          description: Error in Opus Open Client while communicating with the account-holding institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded while communicating with the BACEN participants API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /opus-open-finance/authorization-result:
    post:
      tags:
        - Opus Open Finance
      operationId: oofcAppToAppAuthorizationResult
      description: Method used in the App-To-App flow so that the authorization code returned can be exchanged for tokens, or so that any authorisation errors are handled.
      summary: Send the OIDC flow response back to Opus TPP.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppToAppAuthorizationResultRequest'
      responses:
        '204':
          description: Authorisation process completed successfully
        '422':
          description: Error in the authorisation process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppToAppAuthorizationErrorResponse'
  /proxy/open-banking/resources/v2/resources:
    get:
      tags:
        - Resources
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - $ref: '#/components/parameters/authorisationServerId'
        - $ref: '#/components/parameters/headerConsentId'
      description: Proxy method for retrieving the list of resources held by the customer at the transmitting institution and for which consent has been granted.
      responses:
        '502':
          description: Error in Opus Open Client while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        default:
          description: Follows the response standard defined by BACEN
  /proxy/open-banking/customers/v2/personal/identifications:
    get:
      tags:
        - Customer Data
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - $ref: '#/components/parameters/authorisationServerId'
        - $ref: '#/components/parameters/headerConsentId'
      description: 'Proxy method for retrieving the identification records of the natural person held at the transmitting institution.'
      responses:
        '502':
          description: Error in Opus Open Client while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        default:
          description: Follows the response standard defined by BACEN
  /proxy/open-banking/customers/v2/business/identifications:
    get:
      tags:
        - Customer Data
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - $ref: '#/components/parameters/authorisationServerId'
        - $ref: '#/components/parameters/headerConsentId'
      description: 'Proxy method for retrieving the identification records of the legal entity held at the transmitting institution'
      responses:
        '502':
          description: Error in Opus Open Client while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        default:
          description: Follows the response standard defined by BACEN
  /proxy/open-banking/customers/v2/personal/qualifications:
    get:
      tags:
        - Customer Data
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - $ref: '#/components/parameters/authorisationServerId'
        - $ref: '#/components/parameters/headerConsentId'
      description: 'Proxy method for retrieving the qualification records of the natural person held at the transmitting institution.'
      responses:
        '502':
          description: Error in Opus Open Client while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        default:
          description: Follows the response standard defined by BACEN
  /proxy/open-banking/customers/v2/business/qualifications:
    get:
      tags:
        - Customer Data
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - $ref: '#/components/parameters/authorisationServerId'
        - $ref: '#/components/parameters/headerConsentId'
      description: 'Proxy method for retrieving the qualification records of the legal entity held at the transmitting institution.'
      responses:
        '502':
          description: Error in Opus Open Client while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        default:
          description: Follows the response standard defined by BACEN
  /proxy/open-banking/customers/v2/personal/financial-relations:
    get:
      tags:
        - Customer Data
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - $ref: '#/components/parameters/authorisationServerId'
        - $ref: '#/components/parameters/headerConsentId'
      description: 'Proxy method for retrieving records of relationships with the financial institution and of representatives of the natural person held at the transmitting institution.'
      responses:
        '502':
          description: Error in Opus Open Client while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        default:
          description: Follows the response standard defined by BACEN
  /proxy/open-banking/customers/v2/business/financial-relations:
    get:
      tags:
        - Customer Data
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - $ref: '#/components/parameters/authorisationServerId'
        - $ref: '#/components/parameters/headerConsentId'
      description: 'Proxy method for retrieving records of relationships with the financial institution and of representatives of the legal entity held at the transmitting institution.'
      responses:
        '502':
          description: Error in Opus Open Client while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        default:
          description: Follows the response standard defined by BACEN
  /proxy/open-banking/credit-cards-accounts/v2/accounts:
    get:
      tags:
        - Credit Cards
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - $ref: '#/components/parameters/authorisationServerId'
        - $ref: '#/components/parameters/headerConsentId'
      description: 'Proxy method for retrieving the list of post-paid payment accounts held by the customer at the transmitting institution and for which consent has been granted'
      responses:
        '502':
          description: Error in Opus Open Client while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        default:
          description: Follows the response standard defined by BACEN
  /proxy/open-banking/credit-cards-accounts/v2/accounts/{creditCardAccountId}:
    get:
      tags:
        - Credit Cards
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - $ref: '#/components/parameters/authorisationServerId'
        - $ref: '#/components/parameters/headerConsentId'
        - $ref: '#/components/parameters/creditCardAccountId'
      description: 'Proxy method for retrieving the identification data of the post-paid payment account identified by creditCardAccountId held by the customer at the transmitting institution.'
      responses:
        '502':
          description: Error in Opus Open Client while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        default:
          description: Follows the response standard defined by BACEN
  /proxy/open-banking/credit-cards-accounts/v2/accounts/{creditCardAccountId}/limits:
    get:
      tags:
        - Credit Cards
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - $ref: '#/components/parameters/authorisationServerId'
        - $ref: '#/components/parameters/headerConsentId'
        - $ref: '#/components/parameters/creditCardAccountId'
      description: 'Proxy method for retrieving the limits of the post-paid payment account identified by creditCardAccountId held by the customer at the transmitting institution.'
      responses:
        '502':
          description: Error in Opus Open Client while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        default:
          description: Follows the response standard defined by BACEN
  /proxy/open-banking/credit-cards-accounts/v2/accounts/{creditCardAccountId}/transactions:
    get:
      tags:
        - Credit Cards
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - $ref: '#/components/parameters/authorisationServerId'
        - $ref: '#/components/parameters/headerConsentId'
        - $ref: '#/components/parameters/creditCardAccountId'
      description: |-
        Proxy method for retrieving the list of transactions of the post-paid payment account identified by creditCardAccountId held by the customer at the transmitting institution.
      responses:
        '502':
          description: Error in Opus Open Client while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded while communicating with the transmitting institution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        default:
          description: Follows the response standard defined by BACEN
  /proxy/open-banking/credit-cards-accounts/v2/accounts/{creditCardAccountId}/transactions-current:
    get:
      tags:
