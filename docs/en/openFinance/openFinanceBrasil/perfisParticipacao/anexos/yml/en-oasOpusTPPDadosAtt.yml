    LoggedUser:
      type: object
      description: User (natural person) who is logged in at the receiving institution and who will start the consent process for data sharing.
      additionalProperties: false
      required:
        - document
      properties:
        document:
          type: object
          additionalProperties: false
          required:
            - identification
            - rel
          properties:
            identification:
              type: string
              maxLength: 11
              description: Number of the user's official identification document.
              example: '11111111111'
              pattern: '^\d{11}$'
            rel:
              type: string
              maxLength: 3
              description: Type of the user's official identification document.
              example: CPF
              pattern: '^[A-Z]{3}$'
    BusinessEntity:
      type: object
      description: 'Data owner, the legal entity to which the data being shared refers.'
      additionalProperties: false
      required:
        - document
      properties:
        document:
          type: object
          additionalProperties: false
          required:
            - identification
            - rel
          properties:
            identification:
              type: string
              maxLength: 14
              description: Number of the official identification document of the legal entity data owner.
              example: '11111111111111'
              pattern: '^\d{14}$'
            rel:
              type: string
              maxLength: 4
              description: Type of the official identification document of the legal entity data owner.
              example: CNPJ
              pattern: '^[A-Z]{4}$'
