    patch:
      tags:
        - Device Enrollment
      operationId: deleteEnrollment
      description: |
        Method for revoking or rejecting an account enrollment. After the successful execution of this irreversible method, the account enrollment
        can no longer be used for authentication or for authorisation of payment initiations.
        The concepts of revocation and rejection are associated with the account enrollment state machine\:

        • Revocation: Cancellation of an account enrollment with status "AUTHORISED";

        • Rejection: Cancellation of the account enrollment with status "AWATING_RISK_SIGNALS", "AWATING_ENROLLMENT" and "AWAITING_ACCOUNT_HOLDER_VALIDATION"

        It is up to the client of this API to distinguish between the two scenarios in order to determine the appropriate reason.
      summary: Revoke or reject account enrollment.
      externalDocs:
        description: Open Finance - API Enrollments for Payment Initiation
        url: https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/141557761/SV+API+-+Pagamentos+sem+Redirecionamento
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchEnrollmentRequest'
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - $ref: '#/components/parameters/authorisationServerId'
        - $ref: '#/components/parameters/enrollmentId'
      responses:
        '502':
          description: Error in Opus Open Client while communicating with the account holder institution
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
                $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded while communicating with the account holder institution
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
                $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '204':
          description: Account enrollment successfully revoked.
          headers:
              x-selected-regulatory-v:
                $ref: '#/components/headers/xSelectedRegulatoryV'
        '400':
          description: Error returned by the account holder institution, following the standard defined by BACEN
          headers:
            x-origin-error:
