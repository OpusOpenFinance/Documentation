  /proxy/open-banking/enrollments/v2/consents/{consentId}/authorise:
    post:
      tags:
        - Consent
      operationId: authorizeConsent
      description: |
        Authorisation of a payment consent with status `AWAITING_AUTHORISATION` using the access_token issued by the journey without redirect and the submission of risk signals.
        For payments with a single approval level, the payment consent must transition to status `AUTHORISED` upon successful execution of this method.
        For payments with multiple approval levels, the payment consent will remain in `PARTIALLY_ACCEPTED` until all approvers have authorised it.
        In the event of a business failure (HTTP Status Code 422), the payment consent must transition to status `REJECTED` and follow the rejection reasons present in the payments API.
        If the account holder institution identifies that the debtor account informed by the initiator when creating the consent differs from the debtor account linked to the device, the holder must return HTTP error 422 with code `CONTA_DEBITO_DIVERGENTE_CONSENTIMENTO_VINCULO` and reject the consent with the reason `CONTA_NAO_PERMITE_PAGAMENTO`.
        If the initiator omits the debtor account when creating the consent, the holder must consider the debtor account associated with the enrollment when filling in the `/data/debtorAccount` object present in the consent, after its authorisation.
        The limits related to the enrollment must be validated only at the time of payment settlement, regardless of whether it is scheduled or immediate.
      summary: Authorisation of a payment consent in the journey without redirect
      externalDocs:
        description: Open Finance - API Enrollments for Payment Initiation
