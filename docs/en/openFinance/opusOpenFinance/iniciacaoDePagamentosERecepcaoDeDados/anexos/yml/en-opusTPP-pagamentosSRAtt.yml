  /proxy/open-banking/enrollments/v2/recurring-consents/{recurringConsentId}/authorise:

    post:
      tags:
        - Automatic Pix
      operationId: authorizeRecurringConsent
      description: |
        Authorisation of an Automatic Pix consent with status AWAITING_AUTHORISATION using the access_token issued by the journey without redirect and the submission of risk signals. Consents with a single approval level must transition to status AUTHORISED upon successful execution of this method. For consents with multiple approval levels, the consent must remain in PARTIALLY_ACCEPTED until all approvers have authorised it. In the event of a business failure (HTTP Status Code 422), the payment consent must transition to status REJECTED and follow the rejection reasons present in the Automatic payments API.
        If the account holder institution identifies that the debtor account informed by the initiator when creating the consent differs from the debtor account linked to the device, the holder must return HTTP error 422 in this method with code CONTA_DEBITO_DIVERGENTE_CONSENTIMENTO_VINCULO and reject the consent with the reason CONTA_NAO_PERMITE_PAGAMENTO.
        If the initiator omits the debtor account when creating the consent, the holder must consider the debtor account associated with the authorised enrollment when filling in the /data/debtorAccount object present in the consent.
        The limits related to the enrollment must not be validated during the authorisation process of this consent nor during its life cycle.
      summary: Authorisation of an Automatic Pix consent in the journey without redirect
      externalDocs:
        description: Open Finance - API Enrollments for Payment Initiation
        url: https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/141557761/SV+API+-+Pagamentos+sem+Redirecionamento
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentAuthorization'
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - $ref: '#/components/parameters/authorisationServerId'
        - $ref: '#/components/parameters/recurringConsentId'
        - $ref: '#/components/parameters/authorizationHeader'
        - $ref: '#/components/parameters/xFapiAuthDate'
        - $ref: '#/components/parameters/xFapiCustomerIpAddress'
        - $ref: '#/components/parameters/xFapiInteractionId'
        - $ref: '#/components/parameters/xCustomerUserAgent'
        - $ref: '#/components/parameters/xIdempotencyKey'
      responses:
        '502':
          description: Error in Opus Open Client while communicating with the account holder institution
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
                $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded while communicating with the account holder institution
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
                $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '204':
          description: Risk signals successfully received.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/xFapiInteractionIdResponse'
            x-v:
              $ref: '#/components/headers/xV'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
        '400':
          description: 'The request was malformed, omitting mandatory attributes, either in the payload or through attributes in the URL.'
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '422':
          description: 'The request was well-formed but could not be processed due to business logic specific to the request.'
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/422ResponseRecurringConsentsAuthorization'
        default:
          description: Follows the response standard defined by BACEN
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
