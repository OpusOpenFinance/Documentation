openapi: 3.0.0
info:
  title: OpusTPP - Payments without Redirect 
  description: |-
    OpusTPP - Core for managing devices linked to accounts

    # Payment Transaction Initiation without redirect

    API family enabling payment without redirect via Open Finance Brasil.
    It supports both the management of the devices linked to accounts and the authorisation of consents created through the flow without redirect.

  version: 1.0.0
tags:
  - name: Device Enrollment
    description: |-
      Management of the devices linked to accounts
  - name: Consent
    description: |-
      Authorisation of consents created through the flow without redirect.
  - name: Automatic Pix
    description: |-
      Authorisation of Automatic Pix consents created through the flow without redirect.
servers:
  - url: https://open-finance-core.instituicao.com.br
paths:
  /opus-open-finance/enrollments/v1/enrollments:
