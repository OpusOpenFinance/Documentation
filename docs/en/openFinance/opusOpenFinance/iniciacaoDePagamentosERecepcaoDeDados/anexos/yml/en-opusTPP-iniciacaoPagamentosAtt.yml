      required: false
    xErrorSourceUrl:
      description: URL of the call that originated the error, present only when `x-origin-error` = `participant`.
      schema:
        type: string
      required: false
    xRegulatoryV:
      description: Regulatory version desired for the call to the participant (available only in non-proxy routes).
      schema:
        $ref: '#/components/schemas/RegulatoryVersion'
      required: false
    xSelectedRegulatoryV:
      description: Regulatory version actually used in the request to the participant.
      schema:
        $ref: '#/components/schemas/SelectedRegulatoryVersion'
      required: true
    xFapiInteractionIdResponse:
      description: |
        A UUID [RFC4122](https://tools.ietf.org/html/rfc4122) used as a correlation ID between request and response. Field whose generation and submission is mandatory for the initiating institution (client) and whose value must be “mirrored” by the account holder institution (server) in the response header. If it is not submitted by the initiating institution, the account holder institution must generate an x-fapi-interaction-id and return it in the response with HTTP status code 400. If an invalid value is received, the account holder institution must generate an x-fapi-interaction-id and return it in the response with HTTP status code 400 or 422 (with the code PARAMETRO_INVALIDO). The initiating institution must accept the value generated by the holder and received in the response.
      schema:
        $ref: '#/components/schemas/XFapiInteractionId'
      required: true
    xV:
      description: 'Header indicating the version of the API implemented by the financial institution to fulfil the request. It must be filled in completely, for example: x-v : 1.0.2.'
      required: true
      schema:
        $ref: '#/components/schemas/XV'
  parameters:
    applicationId:
      name: x-application-id
      in: header
      required: true
      description: Identifier of the application making the request
      schema:
        $ref: '#/components/schemas/UUID'
    authorisationServerId:
      name: x-authorisation-server-id
      required: true
      description: Identifier of the Authorisation Server of the consent's transmitting institution, obtained by querying the participants list
      in: header
      schema:
        $ref: '#/components/schemas/UUID'
    headerConsentId:
      name: x-consent-id
      required: true
      in: header
      description: Identifier of the consent to be used in this operation, obtained in the response to its creation
      schema:
        type: string
        pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
        maxLength: 256
      example: 'urn:bancox:f865cd66-392a-420b-9ff0-1b6d7cc60ee0'
    consentId:
      name: consentId
      required: true
      in: path
      description: |
        The consentId is the unique identifier of the consent and must be a URN - Uniform Resource Name.
        A URN, as defined in [RFC8141](https://tools.ietf.org/html/rfc8141), is a Uniform Resource
        Identifier - URI - assigned under the "urn" URI scheme and a specific URN namespace, with the intention that the URN
        be a persistent, location-independent resource identifier.
        Taking the string urn:prudential:C1DD93123 as an example of a consentId, we have:
        - the namespace (urn)
        - the identifier associated with the namespace of the transmitting institution (bancox)
        - the specific identifier within the namespace (f865cd66-392a-420b-9ff0-1b6d7cc60ee0).
        More detailed information about the construction of namespaces should be consulted in [RFC8141](https://tools.ietf.org/html/rfc8141).
      schema:
        type: string
        pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
        maxLength: 256
      example: 'urn:bancox:f865cd66-392a-420b-9ff0-1b6d7cc60ee0'
    authorisationFlowIntent:
      name: x-authorisation-flow-intent
      required: false
      description: Indicator of which approval model will apply to the payment consent
      in: header
      schema:
        $ref: '#/components/schemas/EnumAuthorisationFlowIntent'
    regulatoryV:
        name: x-regulatory-v
        required: false
        description: Regulatory version desired for the call to the participant (available only in non-proxy routes).
        in: header
        schema:
          $ref: '#/components/schemas/RegulatoryVersion'
    authorizationHeader:
      name: Authorization
      in: header
      description: Standard HTTP header. It allows credentials to be provided depending on the type of resource requested
      required: true
      schema:
        type: string
        pattern: '[\w\W\s]*'
        minLength: 1
        maxLength: 2048
    xCustomerUserAgent:
      name: x-customer-user-agent
      in: header
      description: Indicates the user-agent used by the user.
      required: false
      schema:
        type: string
        pattern: '[\w\W\s]*'
        minLength: 1
        maxLength: 100
    xFapiAuthDate:
      name: x-fapi-auth-date
      in: header
      description: 'Date on which the user last logged in with the receiving institution. Represented in accordance with [RFC7231](https://tools.ietf.org/html/rfc7231). Example: Sun, 10 Sep 2017 19:43:31 UTC'
      required: false
      schema:
        type: string
        pattern: '^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), \d{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) \d{4} \d{2}:\d{2}:\d{2} (GMT|UTC)$'
        minLength: 29
        maxLength: 29
    xFapiCustomerIpAddress:
      name: x-fapi-customer-ip-address
      in: header
      description: The user's IP address if currently logged in with the receiving institution.
      required: false
      schema:
        type: string
        pattern: '[\w\W\s]*'
        minLength: 1
        maxLength: 100
    xFapiInteractionId:
      name: x-fapi-interaction-id
      in: header
      description: A UUID [RFC4122](https://tools.ietf.org/html/rfc4122) used as a correlation ID between request and response. Field whose generation and submission is mandatory for the initiating institution (client) and whose value must be “mirrored” by the account holder institution (server) in the response header. If it is not submitted by the initiating institution, the account holder institution must generate an x-fapi-interaction-id and return it in the response with HTTP status code 400. If an invalid value is received, the account holder institution must generate an x-fapi-interaction-id and return it in the response with HTTP status code 400 or 422 (with the code PARAMETRO_INVALIDO). The initiating institution must accept the value generated by the holder and received in the response.
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        minLength: 1
        maxLength: 36
        format: uuid
        example: d78fc4e5-37ca-4da3-adf2-9b082bf92280
    xIdempotencyKey:
      name: x-idempotency-key
      in: header
      description: Custom HTTP header. Unique request identifier to support idempotency.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 40
        pattern: ^(?!\s)(.*)(\S)$
    startDate:
      name: startDate
      in: query
      description: Initial cut-off date, including the day informed, for retrieving the payment linked to the consent.
      required: false
      schema:
        type: string
        format: date
        example: '2025-04-16'
        pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
        minLength: 10
        maxLength: 10
    endDate:
      name: endDate
      in: query
      description: Final cut-off date, including the day informed, of the occurrence of the payment linked to the consent.
      required: false
      schema:
        format: date
        type: string
        example: '2025-04-17'
        pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
        minLength: 10
        maxLength: 10
