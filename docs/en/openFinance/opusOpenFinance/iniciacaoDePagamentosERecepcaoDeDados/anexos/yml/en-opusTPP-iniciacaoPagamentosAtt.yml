    ResponseCreatePaymentConsentV4:
      description: Version 4.1.0 of the Payment Initiation regulatory API.
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: object
          description: Object containing the consent information for the payment initiation.
          required:
            - consentId
            - statusUpdateDateTime
            - creationDateTime
            - expirationDateTime
            - status
            - loggedUser
            - creditor
            - payment
          properties:
            consentId:
              type: string
              maxLength: 256
              pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
              example: 'urn:bancoex:C1DD33123'
              description: |
                Unique identifier of the consent created for the requested payment initiation. It must be a URN - Uniform Resource Name.
                A URN, as defined in [RFC8141](https://tools.ietf.org/html/rfc8141), is a Uniform Resource
                Identifier - URI - assigned under the "urn" URI scheme and a specific URN namespace, with the intention that the URN
                be a persistent, location-independent resource identifier.
                Taking the string urn:bancoex:C1DD33123 as an example of a consentId, we have:
                - the namespace (urn)
                - the identifier associated with the namespace of the transmitting institution (bancoex)
                - the specific identifier within the namespace (C1DD33123).
                More detailed information about the construction of namespaces should be consulted in [RFC8141](https://tools.ietf.org/html/rfc8141).
            creationDateTime:
              description: 'Date and time when the consent was created. A string with date and time in accordance with the RFC-3339 specification, always using the UTC timezone (UTC time format).'
              type: string
              format: date-time
              example: '2021-05-21T08:30:00Z'
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              maxLength: 20
            expirationDateTime:
              description: |
                Date and time when the payment initiation consent expires.
                For consents with status AWAITING_AUTHORISATION, it must always be “creationDateTime + 5 minutes”.
                After that time, if it has not been approved (whether a single approval or the first approver), the consent must move to REJECTED.
                For consents with status PARTIALLY_ACCEPTED, it must take the value of each institution's approval policy.
                For consents with status AUTHORISED, it must take the value of “statusUpdateDateTime + 60 minutes”, this being the maximum time allowed for the consumption of the consent.
                If it is not consumed, it must be moved to status REJECTED.
              type: string
              format: date-time
              example: '2021-05-21T08:30:00Z'
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              maxLength: 20
            statusUpdateDateTime:
              type: string
              format: date-time
              example: '2021-05-21T08:30:00Z'
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              maxLength: 20
              description: |
                Date and time when the resource was updated. A string with date and time in accordance with the RFC-3339 specification, always using the UTC timezone (UTC time format).
            status:
              $ref: '#/components/schemas/EnumAuthorisationStatusType'
            loggedUser:
              $ref: '#/components/schemas/LoggedUser'
            businessEntity:
              $ref: '#/components/schemas/BusinessEntityV4'
            creditor:
              $ref: '#/components/schemas/IdentificationV4'
            payment:
              $ref: '#/components/schemas/PaymentConsentPaymentV4'
            debtorAccount:
              $ref: '#/components/schemas/ConsentsDebtorAccountV4'
        links:
          $ref: '#/components/schemas/LinkSingle'
        meta:
          $ref: '#/components/schemas/RegulatoryMeta'
