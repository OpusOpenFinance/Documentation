        cancelledAt:
          type: string
          description: 'Date and time when the cancellation was carried out, in accordance with the RFC-3339 specification, UTC format.'
          format: date-time
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
