    RegulatoryMeta:
      type: object
      description: Meta information regarding the requested API.
      required:
        - requestDateTime
      properties:
        requestDateTime:
          description: 'Date and time of the query, in accordance with the RFC-3339 specification, UTC format.'
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
    LinkSingle:
      type: object
      description: References to other resources of the requested API.
      required:
        - self
      properties:
        self:
          type: string
          format: uri
          maxLength: 2000
          description: Full URI that generated the current response.
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
          pattern: '^(https:\/\/)?(www\.)?[-a-zA-Z0-9@:%._\+~#=]{2,256}\.[a-z]{2,6}\b([-a-zA-Z0-9@:%_\+.~#?&\/\/=]*)$'
    ResponsePaymentConsentV5:
      description: Version 5.0.0 of the Payment Initiation regulatory API.
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: object
          description: Object containing the consent information for the payment initiation.
          required:
            - consentId
            - statusUpdateDateTime
            - creationDateTime
            - expirationDateTime
            - status
            - loggedUser
            - creditor
            - payment
          properties:
            consentId:
              type: string
              maxLength: 256
              pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
              example: 'urn:bancoex:C1DD33123'
              description: |
                Unique identifier of the consent created for the requested payment initiation. It must be a URN - Uniform Resource Name.
                A URN, as defined in [RFC8141](https://tools.ietf.org/html/rfc8141), is a Uniform Resource
                Identifier - URI - assigned under the "urn" URI scheme and a specific URN namespace, with the intention that the URN
                be a persistent, location-independent resource identifier.
                Taking the string urn:bancoex:C1DD33123 as an example of a consentId, we have:
                - the namespace (urn)
                - the identifier associated with the namespace of the transmitting institution (bancoex)
                - the specific identifier within the namespace (C1DD33123).
                More detailed information about the construction of namespaces should be consulted in [RFC8141](https://tools.ietf.org/html/rfc8141).
            creationDateTime:
              description: 'Date and time when the consent was created. A string with date and time in accordance with the RFC-3339 specification, always using the UTC timezone (UTC time format).'
              type: string
              format: date-time
              example: '2021-05-21T08:30:00Z'
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              maxLength: 20
            expirationDateTime:
              description: |
                Date and time when the payment initiation consent expires.
                For consents with status AWAITING_AUTHORISATION, it must always be “creationDateTime + 5 minutes”.
                After that time, if it has not been approved (whether a single approval or the first approver), the consent must move to REJECTED.
                For consents with status PARTIALLY_ACCEPTED, it must take the value of each institution's approval policy.
                For consents with status AUTHORISED, it must take the value of “statusUpdateDateTime + 60 minutes”, this being the maximum time allowed for the consumption of the consent.
                If it is not consumed, it must be moved to status REJECTED.
              type: string
              format: date-time
              example: '2021-05-21T08:30:00Z'
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              maxLength: 20
            statusUpdateDateTime:
              type: string
              format: date-time
              example: '2021-05-21T08:30:00Z'
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              maxLength: 20
              description: |
                Date and time when the resource was updated. A string with date and time in accordance with the RFC-3339 specification, always using the UTC timezone (UTC time format).
            status:
              $ref: '#/components/schemas/EnumAuthorisationStatusType'
            loggedUser:
              $ref: '#/components/schemas/LoggedUser'
            businessEntity:
              $ref: '#/components/schemas/BusinessEntityV5'
            creditor:
              $ref: '#/components/schemas/IdentificationV5'
            payment:
              $ref: '#/components/schemas/PaymentConsentPaymentV5'
            debtorAccount:
              $ref: '#/components/schemas/ConsentsDebtorAccountV5'
            rejectionReason:
              $ref: '#/components/schemas/ConsentRejectionReasonV5'
        links:
          $ref: '#/components/schemas/LinkSingle'
        meta:
          $ref: '#/components/schemas/RegulatoryMeta'
    CreatePixPayment:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          minItems: 1
          items:
            type: object
            description: Object containing data of the payment and of the payee (creditor).
            required:
              - endToEndId
              - localInstrument
              - payment
              - creditorAccount
              - cnpjInitiator
            properties:
              endToEndId:
                $ref: '#/components/schemas/EndToEndIdWithoutRestriction'
              localInstrument:
                $ref: '#/components/schemas/EnumLocalInstrumentV5'
              payment:
                $ref: '#/components/schemas/PaymentPix'
              creditorAccount:
                $ref: '#/components/schemas/CreditorAccountV5'
              remittanceInformation:
                type: string
                maxLength: 140
                pattern: '[\w\W\s]*'
                example: Pagamento da nota XPTO035-002.
                description: |
                  It must be filled in whenever the paying user enters any additional information in a payment, to be sent to the payee.
              qrCode:
                type: string
                maxLength: 512
                pattern: '[\w\W\s]*'
                example: |
                  00020104141234567890123426660014BR.GOV.BCB.PIX014466756C616E6F32303139406578616D706C652E636F6D27300012
                  BR.COM.OUTRO011001234567895204000053039865406123.455802BR5915NOMEDORECEBEDOR6008BRASILIA61087007490062
                  530515RP12345678-201950300017BR.GOV.BCB.BRCODE01051.0.080450014BR.GOV.BCB.PIX0123PADRAO.URL.PIX/0123AB
                  CD81390012BR.COM.OUTRO01190123.ABCD.3456.WXYZ6304EB76
                description: |
                  Represents the sequence of characters corresponding to the QR Code made available to the payer, which may be obtained by the reader of the payer's device or by copy and paste. It must be in the UTF-8 format and enable the return of the payer's data after the query in the DICT. For cases where “/data/payment/details/localInstrument” is equal to QRDN or APDN, the charge data will be passed on by the ITP in the “/data/payment/details/payloadJWS” field, allowing the holder to validate the charge data without the need to query the payloadJWS of the QR Code in question through the URL. The holder is not prevented from carrying out the query; however, in cases where the value of the "txId" field changes, the account holder institution must trust the payloadJWS passed on by the ITP.
                  [Restriction] Field that must be filled in when the value of /data/payment/details/localInstrument is equal to QRDN, APDN, QRES or APES, observing the maximum size of 512 bytes.
              proxy:
                $ref: '#/components/schemas/ProxyV5'
              cnpjInitiator:
                type: string
                pattern: '^[0-9A-Z]{12}[0-9]{2}$'
                maxLength: 14
                example: '50685362000135'
                description: CNPJ of the Payment Initiator duly authorised to provide the Initiation Service in Pix.
              transactionIdentification:
                $ref: '#/components/schemas/TxId'
              authorisationFlow:
                type: string
                enum:
                  - HYBRID_FLOW
                  - CIBA_FLOW
                  - FIDO_FLOW
                example: HYBRID_FLOW
                description: |
                  Conditional field used to identify the authorisation flow in which the payment was requested.

                  [Restriction] If CIBA or FIDO, filling it in is mandatory. If the field is not present in the payload, it is understood that the authorisation flow used is the HYBRID_FLOW.
              consentId:
                type: string
                maxLength: 256
                pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
                example: 'urn:bancoex:C1DD33123'
                description: |
                  Unique identifier of the consent created for the requested payment initiation. It must be a URN - Uniform Resource Name.
                  A URN, as defined in [RFC8141](https://tools.ietf.org/html/rfc8141), is a Uniform Resource
                  Identifier - URI - assigned under the "urn" URI scheme and a specific URN namespace, with the intention that the URN
                  be a persistent, location-independent resource identifier.
                  Taking the string urn:bancoex:C1DD33123 as an example of a consentId, we have:
                  - the namespace (urn)
                  - the identifier associated with the namespace of the transmitting institution (bancoex)
                  - the specific identifier within the namespace (C1DD33123).
                  More detailed information about the construction of namespaces should be consulted in [RFC8141](https://tools.ietf.org/html/rfc8141).

                  [Restriction] This field is mandatory when the value of the authorisationFlow field is equal to FIDO_FLOW.
    EndToEndId:
      type: string
      minLength: 32
      maxLength: 32
      pattern: '^([E])([0-9A-Z]{8})([0-9]{4})(0[1-9]|1[0-2])(0[1-9]|[1-2][0-9]|3[0-1])(2[0-3]|[01][0-9])([0-5][0-9])([a-zA-Z0-9]{11})$'
      example: E9040088820210128000800123873170
      description: |
        This is a unique identifier, generated at the payment initiating institution and received at the account holder institution, permeating the entire journey of the Pix payment.

        [Restriction] The account holder institution must return the field with the same value received from the initiating institution.
    EndToEndIdWithoutRestriction:
      type: string
      minLength: 32
      maxLength: 32
      pattern: '^([E])([0-9A-Z]{8})([0-9]{4})(0[1-9]|1[0-2])(0[1-9]|[1-2][0-9]|3[0-1])(2[0-3]|[01][0-9])([0-5][0-9])([a-zA-Z0-9]{11})$'
      example: E9040088820210128000800123873170
      description: |
        It must be filled in in the standard format ExxxxxxxxyyyyMMddHHmmkkkkkkkkkkk (32 characters; “case sensitive”, that is, it distinguishes between upper and lower case letters), where:

        • “E” – fixed (1 character);

        • xxxxxxxx – identification of the agent that generated the ´EndToEndId´, which may be: the ISPB of the direct participant or the ISPB of the indirect participant (8 numeric characters [0-9]);

        • yyyyMMddHHmm – date, hour and minute (12 characters), following UTC time, of the submission of the payment order, if the settlement is priority, or expected for the submission of the order to the settlement system, if a scheduling is carried out. For priority and non-priority orders, the agent that generated the ´EndToEndId´ may fill it in with a maximum tolerance of 12 hours, into the future and into the past, in relation to the effective time at which the order is processed by the SPI;

        • kkkkkkkkkkk – sequential number created by the agent that generated the ´EndToEndId´ (11 alphanumeric characters [a-z/A-Z/0-9]). It must be unique within each “yyyyMMddHHmm”.

        The ´EndToEndId´ may be generated by the direct participant, by the indirect participant or by the payment initiator.

        It must be unique and may not be repeated in any other operation submitted to the SPI.

        In the case of a scheduled Pix, the initiating institution must, with regard to the composition of the endToEndId, use the date for which the Pix is being scheduled and the fixed time 15:00 UTC, which will give the account holder institution the settlement window of 00:00 to 23:59 Brasília time.
    PaymentPix:
      type: object
      description: Object containing payment data such as currency and amount.
      required:
        - amount
        - currency
      properties:
        amount:
          $ref: '#/components/schemas/AmountV5'
        currency:
          type: string
          maxLength: 3
          pattern: '^([A-Z]{3})$'
          example: BRL
          description: |
            Code of the national currency according to the ISO-4217 model, that is, 'BRL'.
            All the monetary values informed are represented in Brazil's current currency.
    TxId:
      type: string
      pattern: '^[a-zA-Z0-9]{1,35}$'
      maxLength: 35
      example: E00038166201907261559y6j6
      description: |
        This is a transaction identifier that must be retransmitted intact by the payer's PSP when generating the payment order. This information will allow the payee to identify and correlate the transfer, when received, with the presentation of the instructions to the payer.
        The characters allowed in the context of Pix for the txid field (EMV 62-05) are:
        - Lower case letters, from ‘a’ to ‘z’
        - Upper case letters, from ‘A’ to ‘z’
        - Decimal digits, from ‘0’ to ‘9’

        [Restriction] Conditional filling according to the content of the localInstument field:

        – MANU - The transactionIdentification field must not be filled in.
        – DICT - The transactionIdentification field must not be filled in.
        – INIC - The transactionIdentification field must be filled in as mandatory and must contain up to 25 alphanumeric characters ([a-z|A-Z|0-9]).
        – QRES - If the static QR Code has the TxId data filled in, the transactionIdentification field must be filled in with this value; if the QR Code does not have the TxId, the transactionIdentification field must not be filled in. The TxId must contain up to 25 alphanumeric characters ([a-z|A-Z|0-9]).
        – QRDN - Filling it in with the TxId of the JSON payload of the dynamic QR Code will be mandatory. The TxId must contain between 26 and 35 alphanumeric characters ([a-z|A-Z|0-9]).
        – APDN - Filling it in with the TxId of the JSON payload of the dynamic QR Code will be mandatory. The TxId must contain between 26 and 35 alphanumeric characters ([a-z|A-Z|0-9]).
        – APES - If the static QR Code has the TxId data filled in, the transactionIdentification field must be filled in with this value; if the QR Code does not have the TxId, the transactionIdentification field must not be filled in. The TxId must contain up to 25 alphanumeric characters ([a-z|A-Z|0-9]).

        The account holder institution must validate whether the conditionality and the format of the field were met by the payment initiating institution.
    ResponseCreatePixPayment:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            type: object
            description: Object containing data of the payment and of the payee's (creditor's) account.
            required:
              - paymentId
