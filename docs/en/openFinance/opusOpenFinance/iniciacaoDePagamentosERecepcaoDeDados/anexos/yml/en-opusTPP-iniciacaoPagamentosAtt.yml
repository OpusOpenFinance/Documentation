    RejectionReason:
      type: object
      description: |-
        Reason for the rejection of the payment. Complementary information about the reason for the status
        [Restriction] This reason must be submitted when the /data/status field is equal to RJCT (REJECTED).
      required:
        - code
        - detail
      properties:
        code:
          $ref: '#/components/schemas/EnumRejectionReasonType'
        detail:
          type: string
          pattern: '[\w\W\s]*'
          maxLength: 2048
          description: Contains additional information about the rejected payment
    RejectionReasonGetPix:
      type: object
      description: |-
        Reason for the rejection of the payment. Complementary information about the reason for the status
        [Restriction] This reason must be submitted when the /data/status field is equal to RJCT (REJECTED).
      required:
        - code
        - detail
      properties:
        code:
          $ref: '#/components/schemas/EnumRejectionReasonTypeGetPix'
        detail:
          type: string
          pattern: '[\w\W\s]*'
          maxLength: 2048
          description: Contains additional information about the rejected payment
    EnumRejectionReasonType:
      type: string
      enum:
        - SALDO_INSUFICIENTE
        - VALOR_ACIMA_LIMITE
        - VALOR_INVALIDO
        - COBRANCA_INVALIDA
        - NAO_INFORMADO
        - PAGAMENTO_DIVERGENTE_CONSENTIMENTO
        - DETALHE_PAGAMENTO_INVALIDO
        - PAGAMENTO_RECUSADO_DETENTORA
        - PAGAMENTO_RECUSADO_SPI
        - FALHA_INFRAESTRUTURA
        - FALHA_INFRAESTRUTURA_SPI
        - FALHA_INFRAESTRUTURA_DICT
        - FALHA_INFRAESTRUTURA_ICP
        - FALHA_INFRAESTRUTURA_PSP_RECEBEDOR
        - FALHA_INFRAESTRUTURA_DETENTORA
        - CHAVE_PIX_DIVERGENTE_AGENDAMENTO_LIQUIDACAO
        - CONTAS_ORIGEM_DESTINO_IGUAIS
        - CONTA_NAO_PERMITE_PAGAMENTO
        - QRCODE_INVALIDO
      example: SALDO_INSUFICIENTE
      description: |
        Defines the code of the reason why the payment was rejected

        - SALDO_INSUFICIENTE - The selected account does not have sufficient balance to make the payment.

        - VALOR_ACIMA_LIMITE - The amount exceeds the limit established [at the institution/in the arrangement/other] for allowing the customer to carry out transactions.

        - VALOR_INVALIDO - The amount submitted is not valid for the QR Code informed.

        - COBRANCA_INVALIDA - Expiration validation, due date validation or Valid Status.

        - NAO_INFORMADO - Not reported/identified by the account holder institution.

        - PAGAMENTO_DIVERGENTE_CONSENTIMENTO - Payment data differing from the consent data.

        - DETALHE_PAGAMENTO_INVALIDO - Parameter [nome_campo] does not comply with the business rules.

        - PAGAMENTO_RECUSADO_DETENTORA - [Description of the reason for refusal].

        - PAGAMENTO_RECUSADO_SPI - [Error code according to the PACS.002 reason domain table].

        - FALHA_INFRAESTRUTURA - [Description of which infrastructure failure made the processing unfeasible].

        - FALHA_INFRAESTRUTURA_SPI - Indicates a failure in the Instant Payment System (SPI).

        - FALHA_INFRAESTRUTURA_DICT - Indicates a failure in the Transactional Account Identifiers Directory (DICT).

        - FALHA_INFRAESTRUTURA_ICP - Indicates a failure in the Public Key Infrastructure (ICP).

        - FALHA_INFRAESTRUTURA_PSP_RECEBEDOR - Indicates a failure in the infrastructure of the Payment Service Provider (PSP) receiving the payment.

        - FALHA_INFRAESTRUTURA_DETENTORA - indicates a failure in the infrastructure of the institution holding the information or resources.

        - CHAVE_PIX_DIVERGENTE_AGENDAMENTO_LIQUIDACAO: Differences between the Pix key data at scheduling and at settlement

        - CONTAS_ORIGEM_DESTINO_IGUAIS - Indicates a payment attempt where the source account and the destination account are the same.

        - CONTA_NAO_PERMITE_PAGAMENTO – The selected account is of the type [salary/investment/settlement/other] and does not allow this payment to be made.

        - QRCODE_INVALIDO - The QR Code used for the payment initiation is not valid.

        The rejectionReasons FALHA_INFRAESTRUTURA and CONTAS_ORIGEM_DESTINO_IGUAIS will not be removed; they have merely ceased to be used, thus allowing backward compatibility and integrity with the previous versions of the API.
    EnumRejectionReasonTypeGetPix:
      type: string
      enum:
        - SALDO_INSUFICIENTE
        - VALOR_ACIMA_LIMITE
        - VALOR_INVALIDO
        - COBRANCA_INVALIDA
        - NAO_INFORMADO
        - PAGAMENTO_DIVERGENTE_CONSENTIMENTO
        - DETALHE_PAGAMENTO_INVALIDO
        - PAGAMENTO_RECUSADO_DETENTORA
        - PAGAMENTO_RECUSADO_SPI
        - FALHA_INFRAESTRUTURA
        - FALHA_INFRAESTRUTURA_SPI
        - FALHA_INFRAESTRUTURA_DICT
        - FALHA_INFRAESTRUTURA_ICP
        - FALHA_INFRAESTRUTURA_PSP_RECEBEDOR
        - FALHA_INFRAESTRUTURA_DETENTORA
        - CONTAS_ORIGEM_DESTINO_IGUAIS
        - FALHA_AGENDAMENTO_PAGAMENTOS
        - CHAVE_PIX_DIVERGENTE_AGENDAMENTO_LIQUIDACAO
        - CONTA_NAO_PERMITE_PAGAMENTO
        - QRCODE_INVALIDO
      example: SALDO_INSUFICIENTE
      description: |
        Defines the code of the reason why the payment was rejected

        - SALDO_INSUFICIENTE - The selected account does not have sufficient balance to make the payment.

        - VALOR_ACIMA_LIMITE - The amount exceeds the limit established [at the institution/in the arrangement/other] for allowing the customer to carry out transactions.

        - VALOR_INVALIDO - The amount submitted is not valid for the QR Code informed.

        - COBRANCA_INVALIDA - Expiration validation, due date validation or Valid Status.

        - NAO_INFORMADO - Not reported/identified by the account holder institution.

        - PAGAMENTO_DIVERGENTE_CONSENTIMENTO - Payment data differing from the consent data.

        - DETALHE_PAGAMENTO_INVALIDO - Parameter [nome_campo] does not comply with the business rules.

        - PAGAMENTO_RECUSADO_DETENTORA - [Description of the reason for refusal].

        - PAGAMENTO_RECUSADO_SPI - [Error code according to the PACS.002 reason domain table].

        - FALHA_INFRAESTRUTURA - [Description of which infrastructure failure made the processing unfeasible].

        - FALHA_INFRAESTRUTURA_SPI - Indicates a failure in the Instant Payment System (SPI).

        - FALHA_INFRAESTRUTURA_DICT - Indicates a failure in the Transactional Account Identifiers Directory (DICT).

        - FALHA_INFRAESTRUTURA_ICP - Indicates a failure in the Public Key Infrastructure (ICP).

        - FALHA_INFRAESTRUTURA_PSP_RECEBEDOR - Indicates a failure in the infrastructure of the Payment Service Provider (PSP) receiving the payment.

        - FALHA_INFRAESTRUTURA_DETENTORA - indicates a failure in the infrastructure of the institution holding the information or resources.

        - CONTAS_ORIGEM_DESTINO_IGUAIS - Indicates a payment attempt where the source account and the destination account are the same.

        - CHAVE_PIX_DIVERGENTE_AGENDAMENTO_LIQUIDACAO: Differences between the Pix key data at scheduling and at settlement

        - FALHA_AGENDAMENTO_PAGAMENTOS - Failure when scheduling payments.

        - CONTA_NAO_PERMITE_PAGAMENTO – The selected account is of the type [salary/investment/settlement/other] and does not allow this payment to be made.

        - QRCODE_INVALIDO - The QR Code used for the payment initiation is not valid.

        The rejectionReasons FALHA_INFRAESTRUTURA and CONTAS_ORIGEM_DESTINO_IGUAIS will not be removed; they have merely ceased to be used, thus allowing backward compatibility and integrity with the previous versions of the API.
    EnumPaymentStatusType:
      type: string
      enum:
        - RCVD
        - CANC
        - ACCP
        - ACPD
        - RJCT
        - ACSC
        - PDNG
        - SCHD
      example: PDNG
      description: |
        Current state of the payment initiation. The state evolves in the following order:

        1.  RCVD (Received) - Indicates that the payment request was successfully received by the account holder institution, but there are still validations to be carried out before it is submitted for settlement.

        2.  CANC (Cancelled) - Indicates that the pending Pix transaction was successfully cancelled by the user before it was confirmed (ACCP) or rejected (RJCT) by the account holder institution.

        3.  ACCP( Accepted Customer Profile) - Indicates that all the necessary checks have already been carried out by the account holder institution and that the transaction is ready to be submitted for settlement (in the SPI if it is a Pix to another institution, or internally if it is to another account at the same institution).

        4.  ACPD (Accepted Clearing Processed) - Indicates that the account holder institution has already submitted the transaction for settlement, but does not yet have confirmation of whether it was settled or rejected.

        5.  RJCT (Rejected) Indicates that the transaction was rejected by the account holder institution or by the SPI.

        6.  ACSC (Accepted Settlement Completed Debitor Account) - Indicates that the transaction was completed by the account holder institution or by the SPI.

        7.  PDNG (Pending) - Indicates that the account holder institution temporarily held the Pix transaction for analysis. It does not apply when the payee account and the payer account have the same ownership.

        8.  SCHD (Scheduled) - Indicates that the Pix transaction was successfully scheduled at the account holder institution.

        In the event of failure:

        RJCT (REJECTED) - Payment instruction rejected.
