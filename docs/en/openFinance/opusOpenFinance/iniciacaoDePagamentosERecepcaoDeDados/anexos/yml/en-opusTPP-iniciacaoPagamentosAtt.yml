    ResponsePaymentsGetConsentsConsentIdPayments:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          description: Object containing payment data
          items:
            type: object
            required:
              - paymentId
              - endToEndId
              - consentId
              - creationDateTime
              - statusUpdateDateTime
              - status
              - localInstrument
              - payment
              - creditorAccount
              - cnpjInitiator
              - debtorAccount
            properties:
              paymentId:
                type: string
                minLength: 1
                maxLength: 100
                pattern: '^[a-zA-Z0-9][a-zA-Z0-9\-]{0,99}$'
                example: TXpRMU9UQTROMWhZV2xSU1FUazJSMDl
                description: |
                  Code or unique identifier informed by the account holder institution to represent
                  the individual payment initiation. The `paymentId` must be different from the `endToEndId`.
