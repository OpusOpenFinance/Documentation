    EnumAccountPaymentsTypePix:
      type: string
      enum:
        - CACC
        - SVGS
        - TRAN
      example: CACC
      description: |
        Types of accounts used for payment.
        Traditional types provided for by Resolution 4,753, not covering linked accounts,
        accounts of persons domiciled abroad, accounts in foreign currencies and electronic money correspondent accounts.
        Below is the description of each ENUM value.

        - CACC - Current - Current account.
        - SVGS - Savings - Savings account.
        - TRAN - TransactingAccount - Prepaid payment account.
    ScheduleV4:
      description: |
        [Restriction] Mutually exclusive with the date field.
        This field is mandatory in the case of scheduling.
        In this case, the date field must not be informed.
        The maximum term for the consent must be two years, counted from the consent creation date returned upon its creation (field /data/creationDateTime).
        The scheduling of a single payment must use the "single" object exclusively.
      oneOf:
        - $ref: '#/components/schemas/ScheduleSingleV4'
        - $ref: '#/components/schemas/ScheduleDaily'
        - $ref: '#/components/schemas/ScheduleWeekly'
        - $ref: '#/components/schemas/ScheduleMonthly'
        - $ref: '#/components/schemas/ScheduleCustomV4'
    ScheduleV5:
      description: |
        [Restriction] Mutually exclusive with the date field.
        This field is mandatory in the case of scheduling.
        In this case, the date field must not be informed.
        The maximum term for the consent must be two years, counted from the consent creation date returned upon its creation (field /data/creationDateTime).
        The scheduling of a single payment must use the "single" object exclusively.
      oneOf:
        - $ref: '#/components/schemas/ScheduleSingleV5'
        - $ref: '#/components/schemas/ScheduleDaily'
        - $ref: '#/components/schemas/ScheduleWeekly'
        - $ref: '#/components/schemas/ScheduleMonthly'
        - $ref: '#/components/schemas/ScheduleCustomV5'
      type: object
      required:
        - additionalInformation
      properties:
        additionalInformation:
          type: string
          description: |
            Free text for the Initiator to describe, in a way that is understandable by the approving/paying user, the characteristics of the requested scheduling.
            The text may be used by the holder to display the summary of the transaction during the approval by the approving/paying user.
          pattern: '[\w\W\s]*'
          maxLength: 255
          example: Todas quintas e domingos por 6 meses
    ScheduleSingleV4:
      type: object
      required:
        - single
      properties:
        single:
          type: object
          description: Defines the single scheduling policy.
          required:
            - date
          properties:
            date:
              type: string
              format: date
              maxLength: 10
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
              example: '2023-08-23'
              description: |
                Defines the target date for the settlement of the payment.
                The Brasília time zone must be used for the creation of and reasoning about the data of this field.

                [Restriction] This field must always be at least D+1 calendar day, that is, the date immediately after
                the date of the consent considering the Brasília time zone, and must be at most D+730 calendar days
                from the date of the consent, also considering the Brasília time zone.
    ScheduleSingleV5:
      type: object
      required:
        - single
      properties:
        single:
          type: object
          description: Defines the single scheduling policy.
          required:
            - date
          properties:
            date:
              type: string
              format: date
              maxLength: 10
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
              example: '2023-08-23'
              description: |
                Defines the target date for the settlement of the payment. The Brasília time zone must be used for the creation of and reasoning about the data of this field.
                [Restriction] This field must always be at least D+1 calendar day, that is, the date immediately after the consent creation date. The maximum term allowed for scheduling is two years, counted from the consent creation date, limited to the corresponding day and month in the second subsequent year (e.g.: a consent created on 10/07/2026 allows scheduling up to 10/07/2028).
    ScheduleDaily:
      type: object
      required:
        - daily
      properties:
        daily:
          type: object
          required:
            - startDate
            - quantity
          properties:
            startDate:
              description: Defines the start of the recurrence period.
              type: string
              format: date
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
              maxLength: 10
              example: '2023-08-23'
            quantity:
              description: Defines the number of payments that will be submitted for settlement.
              type: integer
              format: int32
              minimum: 2
              maximum: 60
              example: 3
    ScheduleWeekly:
      type: object
      required:
        - weekly
      properties:
        weekly:
          type: object
          required:
            - dayOfWeek
            - startDate
            - quantity
          properties:
            dayOfWeek:
              description: Defines the day of the week planned for the occurrence of the settlements.
              type: string
              enum:
                - SEGUNDA_FEIRA
                - TERCA_FEIRA
                - QUARTA_FEIRA
                - QUINTA_FEIRA
                - SEXTA_FEIRA
                - SABADO
                - DOMINGO
              example: QUINTA_FEIRA
            startDate:
              description: Defines the start of the recurrence period.
              type: string
              format: date
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
              maxLength: 10
              example: '2023-08-23'
            quantity:
              description: Defines the number of payments that will be submitted for settlement.
              type: integer
              format: int32
              minimum: 2
              maximum: 60
              example: 10
    ScheduleMonthly:
      type: object
      required:
        - monthly
      properties:
        monthly:
          type: object
          required:
            - dayOfMonth
            - startDate
            - quantity
          properties:
            dayOfMonth:
              description: Defines the day of the month planned for the occurrence of the settlements.
              type: integer
              minimum: 1
              maximum: 31
              example: 10
            startDate:
              description: Defines the start of the recurrence period.
              type: string
              format: date
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
              maxLength: 10
              example: '2023-08-23'
            quantity:
              description: Defines the number of payments that will be submitted for settlement.
              type: integer
              format: int32
              minimum: 2
              maximum: 24
              example: 24
    ScheduleCustomV4:
      type: object
      required:
        - custom
      properties:
        custom:
          type: object
          description: |
            [Restriction] The dates submitted in the list of dates (array “dates”) may not be repeated.
            If repeated dates are submitted, the holder must reject the creation of the consent, reporting the error PARAMETRO_INVALIDO.
          required:
            - dates
            - additionalInformation
          properties:
            dates:
              description: Defines the days on which the occurrences of the settlements are planned.
              type: array
              maxItems: 60
              minItems: 2
              example: ['2023-08-23', '2023-09-26']
              items:
                type: string
                format: date
                pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
                maxLength: 10
                example: '2023-08-23'
            additionalInformation:
              type: string
              description: |
                Free text for the Initiator to fill in, in a way that is understandable by the approving/paying user.
                The text may be used by the holder to display the summary of the transaction during the approval by the approving/paying user.
              pattern: '[\w\W\s]*'
              maxLength: 255
              example: Todas quintas e domingos por 6 meses
    ScheduleCustomV5:
      type: object
      required:
        - custom
      properties:
        custom:
          type: object
          description: |
            [Restriction] The dates submitted in the list of dates (array “dates”) may not be repeated.
            If repeated dates are submitted, the holder must reject the creation of the consent, reporting the error PARAMETRO_INVALIDO.
          required:
            - dates
          properties:
            dates:
              description: Defines the days on which the occurrences of the settlements are planned.
              type: array
              maxItems: 60
              minItems: 2
              example: ['2023-08-23', '2023-09-26']
              items:
                type: string
                format: date
                pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
                maxLength: 10
                example: '2023-08-23'
    EnumPaymentType:
      type: string
      enum:
        - PIX
      example: PIX
      description: |
        This field defines the type of payment that will be initiated after the authorisation of the consent.
    EnumAuthorisationStatusType:
      type: string
      enum:
        - AWAITING_AUTHORISATION
        - AUTHORISED
        - REJECTED
        - CONSUMED
        - PARTIALLY_ACCEPTED
      example: AWAITING_AUTHORISATION
      description: |
        Returns the state of the consent, which at the moment of its creation will be AWAITING_AUTHORISATION. In the situation of multiple approval levels, PARTIALLY_ACCEPTED indicates that the consent needs confirmation from more authorisers. This state will be changed after the authorisation(s) of the consent(s) at the payer's (Debtor's) account holder institution to AUTHORISED or REJECTED. The consent remains in the CONSUMED state after the payment initiation related to the consent has occurred.

        In the case of an expired consent, the account holder institution must return the status REJECTED.


        Possible states:

        AWAITING_AUTHORISATION - Awaiting authorisation

        PARTIALLY_ACCEPTED – Awaiting multiple approval levels

        AUTHORISED - Authorised

        REJECTED - Rejected

        CONSUMED - Consumed
    EnumPaymentPersonType:
      type: string
      enum:
        - PESSOA_NATURAL
        - PESSOA_JURIDICA
      description: |
        Data owner, natural person or legal entity to whom the payee (creditor) data refers.
    ConsentRejectionReasonV4:
      type: object
      description: |
        Reason for the rejection of the consent. Complementary information about the reason for the status.

        [Restriction] This reason must be submitted when the /data/status field is equal to REJECTED.
      required:
        - code
        - detail
      properties:
        code:
          $ref: '#/components/schemas/EnumConsentRejectionReasonTypeV4'
        detail:
          type: string
          pattern: '[\w\W\s]*'
          maxLength: 2048
          description: |
            Contains additional information about the rejected consent.
            - AUTENTICACAO_DIVERGENTE : The user authenticated at the holder differs from the user authenticated at the initiator​
            - VALOR_INVALIDO: The amount submitted is not valid for the QR Code informed;
            - NAO_INFORMADO: Not informed by the account holder institution;
            - FALHA_INFRAESTRUTURA: [Description of which infrastructure failure made the processing unfeasible].
            - TEMPO_EXPIRADO_AUTORIZACAO: The consent expired before the user could confirm it.
            - TEMPO_EXPIRADO_CONSUMO: The user did not complete the payment flow and the consent expired;
            - REJEITADO_USUARIO: The user rejected the authorisation of the consent
            - CONTAS_ORIGEM_DESTINO_IGUAIS: The selected account is the same as the destination account and does not allow this payment to be made.
            - CONTA_NAO_PERMITE_PAGAMENTO: The selected account is of the type [salary/investment/settlement/other] and does not allow this payment to be made.
            - SALDO_INSUFICIENTE: The selected account does not have sufficient balance to make the payment.
            - VALOR_ACIMA_LIMITE: The amount exceeds the limit established [at the institution/in the arrangement/other] for allowing the customer to carry out transactions.
            - QRCODE_INVALIDO: The QR Code used for the payment initiation is not valid.

            [Restriction] In the case of a consent rejected in versions in which the rejectionReason field did not exist, return the following detail: Motivo de rejeição inexistente em versões anteriores.
          example: O usuário rejeitou a autorização do consentimento
    ConsentRejectionReasonV5:
      type: object
      description: |
        Reason for the rejection of the consent. Complementary information about the reason for the status.

        [Restriction] This reason must be submitted when the /data/status field is equal to REJECTED.
      required:
        - code
        - detail
      properties:
        code:
          $ref: '#/components/schemas/EnumConsentRejectionReasonTypeV5'
        detail:
          type: string
          pattern: '[\w\W\s]*'
          maxLength: 2048
          description: |
            Contains additional information about the rejected consent.
            - AUTENTICACAO_DIVERGENTE : The user authenticated at the holder differs from the user authenticated at the initiator​
            - VALOR_INVALIDO: The amount submitted is not valid for the QR Code informed;
            - NAO_INFORMADO: Not informed by the account holder institution;
            - FALHA_INFRAESTRUTURA: [Description of which infrastructure failure made the processing unfeasible].
            - TEMPO_EXPIRADO_AUTORIZACAO: The consent expired before the user could confirm it.
            - TEMPO_EXPIRADO_CONSUMO: The user did not complete the payment flow and the consent expired;
            - REJEITADO_USUARIO: The user rejected the authorisation of the consent
            - CONTAS_ORIGEM_DESTINO_IGUAIS: The selected account is the same as the destination account and does not allow this payment to be made.
            - CONTA_NAO_PERMITE_PAGAMENTO: The selected account is of the type [salary/investment/settlement/other] and does not allow this payment to be made.
            - SALDO_INSUFICIENTE: The selected account does not have sufficient balance to make the payment.
            - VALOR_ACIMA_LIMITE: The amount exceeds the limit established [at the institution/in the arrangement/other] for allowing the customer to carry out transactions.
            - QRCODE_INVALIDO: The QR Code used for the payment initiation is not valid.
            - PERMISSAO_INSUFICIENTE: The Pix Saque or Pix Troco request was made by a user without full approval powers.

            [Restriction] In the case of a consent rejected in versions in which the rejectionReason field did not exist, return the following detail: Motivo de rejeição inexistente em versões anteriores.
          example: O usuário rejeitou a autorização do consentimento
