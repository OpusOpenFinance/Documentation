              example: '11111111111111'
              pattern: '^[0-9A-Z]{12}[0-9]{2}$'
            rel:
              type: string
              maxLength: 4
              description: Type of the official identification document of the legal entity data owner.
              example: CNPJ
              pattern: '^[A-Z]{4}$'
    IdentificationV4:
      type: object
      description: Object containing the data of the payee (creditor).
      required:
        - personType
        - cpfCnpj
        - name
      properties:
        personType:
          $ref: '#/components/schemas/EnumPaymentPersonType'
        cpfCnpj:
          type: string
          minLength: 11
          maxLength: 14
          pattern: '^\d{11}$|^\d{14}$'
          example: '58764789000137'
          description: |
            Identification of the person involved in the transaction.
            Fill in with the CPF or CNPJ, according to the value chosen in the type field.
            The CPF will be used with 11 numbers and must be informed without dots or dashes.
            The CNPJ will be used with 14 numbers and must be informed without dots or dashes.
        name:
          type: string
          pattern: ^([A-Za-zÀ-ÖØ-öø-ÿ,.@:&*+_<>()!?/\\$%\d' -]+)$
          maxLength: 120
          example: Marco Antonio de Brito
          description: |
            In the case of a natural person, the full name of the payee's account holder must be informed.
            In the case of a legal entity, the corporate name or the trade name of the payee's account must be informed.
    IdentificationV5:
      type: object
      description: Object containing the data of the payee (creditor).
      required:
        - personType
        - cpfCnpj
        - name
      properties:
        personType:
          $ref: '#/components/schemas/EnumPaymentPersonType'
        cpfCnpj:
          type: string
          minLength: 11
          maxLength: 14
          pattern: '^([0-9]{11})$|^([0-9A-Z]{12}[0-9]{2})$'
          example: '58764789000137'
          description: |
            Identification of the person involved in the transaction.
            Fill in with the CPF or CNPJ, according to the value chosen in the type field.
            The CPF will be used with 11 numbers and must be informed without dots or dashes.
            The CNPJ will be used with 14 numbers and must be informed without dots or dashes.
        name:
          type: string
          pattern:  ^[ -~¡-ÿ]+$
          maxLength: 150
          example: Marco Antonio de Brito
          description: |
            In the case of a natural person, the full name of the payee's account holder must be informed.
            In the case of a legal entity, the corporate name or the trade name of the payee's account must be informed.
    PaymentConsentPaymentV4:
      type: object
      description: Object containing payment data for the consent.
      required:
        - type
        - currency
        - amount
        - details
      properties:
        type:
          $ref: '#/components/schemas/EnumPaymentType'
        schedule:
          $ref: '#/components/schemas/ScheduleV4'
        date:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-01-01'
          description: |
            [Restriction] Mutually exclusive with the schedule object.

            This field is mandatory in the case of a single payment.

            In this case, the schedule object must not be informed.
        currency:
          type: string
          maxLength: 3
          pattern: '^([A-Z]{3})$'
          example: BRL
          description: |
            Code of the national currency according to the ISO-4217 model, that is, 'BRL'.
            All the monetary values informed are represented in Brazil's current currency.
        amount:
          $ref: '#/components/schemas/AmountV4'
        ibgeTownCode:
          $ref: '#/components/schemas/IbgeTownCodeV4'
        details:
          $ref: '#/components/schemas/DetailsV4'
    PaymentConsentPaymentV5:
      type: object
      description: Object containing payment data for the consent.
      required:
        - type
        - currency
        - amount
        - details
      properties:
        type:
          $ref: '#/components/schemas/EnumPaymentType'
        purpose:
          $ref: '#/components/schemas/PurposeV5'
        schedule:
          $ref: '#/components/schemas/ScheduleV5'
        date:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-01-01'
          description: |
            [Restriction] Mutually exclusive with the schedule object.

            This field is mandatory in the case of a single payment.

            In this case, the schedule object must not be informed.
        currency:
          type: string
          maxLength: 3
          pattern: '^([A-Z]{3})$'
          example: BRL
          description: |
            Code of the national currency according to the ISO-4217 model, that is, 'BRL'.
            All the monetary values informed are represented in Brazil's current currency.
        amount:
          $ref: '#/components/schemas/AmountV5'
        ibgeTownCode:
          $ref: '#/components/schemas/IbgeTownCodeV5'
        details:
          $ref: '#/components/schemas/DetailsV5'
    PurposeV5:
      description: |
        Represents the purpose of the transaction received.
        - IMMEDIATE: Must be used when the payment generated by the consent is single and immediate and is not a Pix    Saque or Pix Troco;
        - SINGLE_SCHEDULED: Must be used when the payment generated by the consent is single and scheduled;
        - RECURRENT_SCHEDULED: Must be used when the payment generated by the consent is not single and is scheduled;
        - WITHDRAW: Must be used when the payment is single, immediate and represents a withdrawal operation;
        - CHANGE: Must be used when the payment is single, immediate and represents a change (troco) operation.

        [Restrictions]
        - Field whose submission is mandatory when the value of the /data/payment/type field is equal to PIX, and;
        - If the /data/payment/scheduled/single object is filled in, only the value SINGLE_SCHEDULED is allowed, or;
        - If one of the objects /data/payment/scheduled/daily, /data/payment/scheduled/weekly, /data/payment/scheduled/monthly or /data/payment/scheduled/custom is filled in, only the value RECURRENT_SCHEDULED is allowed.
      type: string
      enum:
        - IMMEDIATE
        - SINGLE_SCHEDULED
        - RECURRENT_SCHEDULED
        - WITHDRAW
        - CHANGE
    AmountV4:
      type: string
      minLength: 4
      maxLength: 19
      pattern: '^((\d{1,16}\.\d{2}))$'
      example: '100000.12'
      description: |
        Transaction amount with 2 decimal places. The amount must be the same one submitted in the consent.

        For a static QR Code with a pre-determined amount in the QR Code, or for a dynamic QR Code indicating that the amount cannot be changed: The amount field must be filled in with the amount established in the QR Code.
        If it is filled in with an amount differing from the QR Code, an HTTP Status 422 error must be returned.
    AmountV5:
      type: string
      minLength: 4
      maxLength: 19
      pattern: '^((\d{1,16}\.\d{2}))$'
      example: '100000.12'
      description: |
       Transaction amount with 2 decimal places. For QR Code payments, the composition of the amount follows the rules below, according to the type of QR Code and the product associated with it:
        ▪ Static QR Code: If the QR Code contains an amount, the amount field must be filled in with that amount. If the amount is not present, the amount must be filled in by the paying user, in the ITP's environment, before the creation of the consent.
        ▪ Dynamic QR Code for Immediate Charge (COB): The amount field must be filled in with the amount of the charge (valor.original). When valor.modalidadeAlteracao is equal to 1, the amount may be changed by the paying user, in the ITP's environment, before the creation of the consent.
        ▪ Dynamic QR Code for Charge with Due Date (COBV): The amount field must be filled in with the final amount of the charge, corresponding to the composition: original amount, less any reductions and discounts, plus any interest and fines. The modalidadeAlteracao field does not apply to COBV; the amount cannot be changed by the paying user.
        ▪ Dynamic QR Code for Pix Saque: The amount field must be filled in with the withdrawal amount (valor.retirada.saque.valor). When valor.retirada.saque.modalidadeAlteracao is equal to 1, the withdrawal amount may be changed by the paying user, in the ITP's environment, before the creation of the consent and respecting the limits defined by the withdrawal service facilitator.
        ▪ Dynamic QR Code for Pix Troco: The amount field must be filled in with the total amount of the transaction, corresponding to the sum of the purchase amount (valor.original) and the change amount (valor.retirada.troco.valor). The purchase amount (valor.original) cannot be changed. When valor.retirada.troco.modalidadeAlteracao is equal to 1, only the change amount may be altered by the paying user, in the ITP's environment, before the creation of the consent and respecting the limits defined by the withdrawal service facilitator.
        ▪ For all the scenarios in which the amount cannot be changed, the amount field must be filled in with the amount established in the QR Code. If the amount field is filled in with an amount differing from the expected one, the HTTP Status 422 error with code VALOR_INVALIDO must be returned.
    IbgeTownCodeV4:
      type: string
      minLength: 7
      maxLength: 7
      pattern: '^\d{7}$'
      example: '5300108'
      description: |
        The ibgetowncode field in the PIX arrangement has the same behaviour as the codMun field described in item 1.6.6 of the PIX manual, as follows:

        1. If the information regarding the municipality is not submitted, the payee's PSP will assume that there are no state or municipal holidays in the period in question;
    IbgeTownCodeV5:
      type: string
      minLength: 7
      maxLength: 7
      pattern: '^\d{7}$'
      example: '5300108'
      description: |
        The ibgetowncode field, in the PIX arrangement, has the same behaviour as the codMun field described in the PIX manual.
        If the information regarding the municipality is not submitted, the payee's PSP will assume that there are no state or municipal holidays in the period in question;
        In the case of a Dynamic QR Code with a due date, the municipality code of the paying user informed by the initiation service provider must prevail.
        [Restriction] For a Dynamic QR Code with a due date, the submission of this parameter by the ITP is mandatory so that the Holder can use it in its query. The Holder must use the value informed by the ITP in its query of the QR Code at the Payee's PSP
    DetailsV4:
      type: object
      description: |
        Object containing the details of the payment.
      required:
        - localInstrument
        - creditorAccount
      properties:
        localInstrument:
          $ref: '#/components/schemas/EnumLocalInstrumentV4'
        qrCode:
          type: string
          maxLength: 512
          pattern: '[\w\W\s]*'
          example: |
            00020104141234567890123426660014BR.GOV.BCB.PIX014466756C616E6F32303139406578616D706C652E636F6D27300012
            BR.COM.OUTRO011001234567895204000053039865406123.455802BR5915NOMEDORECEBEDOR6008BRASILIA61087007490062
            530515RP12345678-201950300017BR.GOV.BCB.BRCODE01051.0.080450014BR.GOV.BCB.PIX0123PADRAO.URL.PIX/0123AB
            CD81390012BR.COM.OUTRO01190123.ABCD.3456.WXYZ6304EB76
          description: |
            Sequence of characters corresponding to the QR Code made available to the payer.
            It is the sequence of characters that would be read by the QR Code reader, and it must enable the return of the payer's data after a query in the DICT.
            This functionality is possible both for a static QR Code and for a dynamic QR Code.
            In the Pix arrangement, this is the same sequence generated and/or read by the Pix Copia e Cola functionality.
            This field must be in the UTF-8 format.
            [Restriction] Mandatory for payments by QR Code, observing the maximum size of 512 bytes.
        proxy:
          $ref: '#/components/schemas/ProxyV4'
        creditorAccount:
          $ref: '#/components/schemas/CreditorAccountV4'
    DetailsV5:
      type: object
      description: |
        Object containing the details of the payment.
      required:
        - localInstrument
        - creditorAccount
      properties:
        payloadJWS:
          description: |
            Represents the payloadJWS obtained by the ITP when reading the dynamic QR. All the fragments captured from the JWT representing the QR generated by the Payee's PSP must be submitted, allowing the account holder institution to validate the charge data passed on by the ITP.
            [Restriction] Field whose submission is mandatory when the value present in ```/data/payment/details/localInstrument``` is equal to APDN or QRDN.
          type: string
          maxLength: 16384
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
        localInstrument:
          $ref: '#/components/schemas/EnumLocalInstrumentV5'
        qrCode:
          type: string
          maxLength: 512
          pattern: '[\w\W\s]*'
          example: |
            00020104141234567890123426660014BR.GOV.BCB.PIX014466756C616E6F32303139406578616D706C652E636F6D27300012
            BR.COM.OUTRO011001234567895204000053039865406123.455802BR5915NOMEDORECEBEDOR6008BRASILIA61087007490062
            530515RP12345678-201950300017BR.GOV.BCB.BRCODE01051.0.080450014BR.GOV.BCB.PIX0123PADRAO.URL.PIX/0123AB
            CD81390012BR.COM.OUTRO01190123.ABCD.3456.WXYZ6304EB76
          description: |
            Represents the sequence of characters corresponding to the QR Code made available to the payer, which may be obtained by the reader of the payer's device or by copy and paste. It must be in the UTF-8 format and enable the return of the payer's data after the query in the DICT. For cases where “/data/payment/details/localInstrument” is equal to QRDN or APDN, the charge data will be passed on by the ITP in the “/data/payment/details/payloadJWS” field, allowing the holder to validate the charge data without the need to query the payloadJWS of the QR Code in question through the URL. The holder is not prevented from carrying out the query; however, in cases where the value of the "txId" field changes, the account holder institution must trust the payloadJWS passed on by the ITP.
            [Restriction] Field that must be filled in when the value of /data/payment/details/localInstrument is equal to QRDN, APDN, QRES or APES, observing the maximum size of 512 bytes.
        proxy:
          $ref: '#/components/schemas/ProxyV5'
        creditorAccount:
          $ref: '#/components/schemas/CreditorAccountV5'
    EnumLocalInstrumentV4:
      type: string
      enum:
        - MANU
        - DICT
        - QRDN
        - QRES
        - INIC
      example: DICT
      description: |
        Specifies the form of payment initiation:
        - MANU - Manual entry of transactional account data
        - DICT - Manual entry of a Pix key
        - QRDN - Dynamic QR code
        - QRES - Static QR code
        - INIC - Indicates that the payee (creditor) engaged the Payment Initiator specifically to carry out payment initiations in which the beneficiary is previously known.

        [Restriction] If /data/payment/schedule is submitted with a value other than single during the creation of the consent, only the MANU, DICT or QRES methods are allowed.
    EnumLocalInstrumentV5:
      type: string
      enum:
        - MANU
        - DICT
        - QRDN
        - QRES
        - INIC
        - APES
        - APDN
      example: DICT
      description: |
        Specifies the form of payment initiation:
        - MANU - Manual entry of transactional account data
        - DICT - Manual entry of a Pix key
        - APDN - Reading of a dynamic QR code via NFC
        - QRDN - Reading of a dynamic QR code (except NFC)
        - APES - Reading of a static QR code via NFC
        - QRES - Reading of a static QR code (except NFC)
        - INIC - Indicates that the payee (creditor) engaged the Payment Initiator specifically to carry out payment initiations in which the beneficiary is previously known.

        [Restriction] If /data/payment/schedule is submitted with a value other than single during the creation of the consent, only the MANU, DICT or QRES methods are allowed.
    ProxyV4:
      type: string
      maxLength: 77
      pattern: '[\w\W\s]*'
      example: '12345678901'
      description: |
        Key registered in the DICT belonging to the payee. The types of keys may be: phone, e-mail, cpf/cnpj or random key.
        In the case of a mobile phone, it must be informed in the E.1641 standard.
        For e-mail, it must have the format xxxxxxxx@xxxxxxx.xxx(.xx) and a maximum of 77 characters.
        In the case of a CPF, it must be informed with 11 numbers, without dots or dashes.
        In the case of a CNPJ, it must be informed with 14 numbers, without dots or dashes.
        In the case of a random key, the UUID generated by the DICT must be informed, in accordance with the format specified in RFC41223.
        If informed, the account holder institution must validate the proxy in the DICT when localInstrument is equal to DICT, QRDN or QRES and validate the creditorAccount field.
        This validation is optional if localInstrument is equal to INIC.
        [Restriction] If localInstrument is equal to MANU, the proxy field must not be filled in. If localInstrument is equal to INIC, DICT, QRDN or QRES, the proxy field must always be filled in with the Pix key.
    ProxyV5:
      type: string
      maxLength: 77
      pattern: '[\w\W\s]*'
      example: '12345678901'
      description: |
        Key registered in the DICT belonging to the payee. The types of keys may be: phone, e-mail, cpf/cnpj or random key. In the case of a mobile phone, it must be informed in the E.1641 standard. For e-mail, it must have the format xxxxxxxx@xxxxxxx.xxx(.xx) and a maximum of 77 characters. In the case of a CPF, it must be informed with 11 numbers, without dots or dashes. In the case of a CNPJ, it must be informed with 14 characters, without dots or dashes. In the case of a random key, the UUID generated by the DICT must be informed, in accordance with the format specified in RFC4122. If informed, the account holder institution must validate the proxy in the DICT when localInstrument is equal to DICT, APDN, APES, QRDN or QRES and validate the creditorAccount field. This validation is optional if localInstrument is equal to INIC.
        [Restriction] If localInstrument is equal to MANU, the proxy field must not be filled in. If localInstrument is equal to INIC, DICT, APDN, APES, QRDN or QRES, the proxy field must always be filled in with the Pix key.
    CreditorAccountV4:
      type: object
      description: |
        Object containing the identification of the beneficiary's/payee's destination account.
      required:
        - ispb
        - number
        - accountType
      properties:
        ispb:
          type: string
          minLength: 8
          maxLength: 8
          pattern: '^[0-9]{8}$'
          example: '12345678'
          description: |
            Must be filled in with the ISPB (Brazilian Payment System Identifier) of the SPI (instant payment system) participant, using numbers only.
        issuer:
          type: string
          minLength: 1
          maxLength: 4
          pattern: '^[0-9]{1,4}$'
          example: '1774'
          description: |
            Code of the branch where the account was opened, without the check digit.
            (A branch is the unit intended for serving customers, the general public and credit union members,
            in the exercise of the institution's activities, and may not be mobile or temporary).

            [Restriction] Mandatory for the following account types: CACC (CONTA_DEPOSITO_A_VISTA) and SVGS (CONTA_POUPANCA).
        number:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[0-9]{1,20}$'
          example: '1234567890'
          description: |
            Must be filled in with the number of the payee user's account, including the check digit (if one exists);
            if there is an alphanumeric value, it must be converted to 0.
        accountType:
          $ref: '#/components/schemas/EnumAccountPaymentsTypePix'
