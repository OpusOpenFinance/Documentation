            consentId:
              description: |
                The consentId is the unique identifier of the consent and must be a URN - Uniform Resource Name.
                A URN, as defined in [RFC8141](https://tools.ietf.org/html/rfc8141), is a Uniform Resource
                Identifier - URI - assigned under the "urn" URI scheme and a specific URN namespace, with the intention that the URN
                be a persistent, location-independent resource identifier.
                Taking the string urn:bancoex:C1DD33123 as an example of a consentId, we have:
                - the namespace (urn)
                - the identifier associated with the namespace of the transmitting institution (bancoex)
                - the specific identifier within the namespace (C1DD33123).
                More detailed information about the construction of namespaces should be consulted in [RFC8141](https://tools.ietf.org/html/rfc8141).
              type: string
              pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
              maxLength: 256
              example: 'urn:bancoex:C1DD33123'
            consent:
              description: |
                Payment consent object returned by the account holder institution in accordance with the standard defined by BACEN - https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/17375943/API+-+Pagamentos. The schema corresponds to the regulatory version actually used, indicated in the `x-selected-regulatory-v` response header.
              oneOf:
                - $ref: '#/components/schemas/ResponseCreatePaymentConsentV4'
                - $ref: '#/components/schemas/ResponseCreatePaymentConsentV5'
    GetPaymentConsentResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - consentId
            - consent
          properties:
            consentId:
              description: |
                The consentId is the unique identifier of the consent and must be a URN - Uniform Resource Name.
                A URN, as defined in [RFC8141](https://tools.ietf.org/html/rfc8141), is a Uniform Resource
                Identifier - URI - assigned under the "urn" URI scheme and a specific URN namespace, with the intention that the URN
                be a persistent, location-independent resource identifier.
                Taking the string urn:bancoex:C1DD33123 as an example of a consentId, we have:
                - the namespace (urn)
                - the identifier associated with the namespace of the transmitting institution (bancoex)
                - the specific identifier within the namespace (C1DD33123).
