    XV:
      description: 'Header indicating the version of the API implemented by the financial institution to fulfil the request. It must be filled in completely, for example: x-v : 1.0.2.'
      type: string
      pattern: '^\d+\.\d+\.\d+$'
      example: 1.0.0
    XFapiInteractionId:
      type: string
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      minLength: 1
      maxLength: 36
      format: uuid
      example: d78fc4e5-37ca-4da3-adf2-9b082bf92280
      description: A UUID [RFC4122](https://tools.ietf.org/html/rfc4122) used as a correlation ID between request and response. Field whose generation and submission is mandatory for the initiating institution (client) and whose value must be “mirrored” by the account holder institution (server) in the response header. If it is not submitted by the initiating institution, the account holder institution must generate an x-fapi-interaction-id and return it in the response with HTTP status code 400. If an invalid value is received, the account holder institution must generate an x-fapi-interaction-id and return it in the response with HTTP status code 400 or 422 (with the code PARAMETRO_INVALIDO). The initiating institution must accept the value generated by the holder and received in the response.
  headers:
    xOriginError:
      description: Indicates the origin of the error.
      schema:
