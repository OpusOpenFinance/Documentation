                minLength: 1
                maxLength: 100
                pattern: '^[a-zA-Z0-9][a-zA-Z0-9\-]{0,99}$'
                example: TXpRMU9UQTROMWhZV2xSU1FUazJSMDl
                description: |
                  Code or unique identifier informed by the account holder institution to represent
                  the individual payment initiation. The `paymentId` must be different from the `endToEndId`.
                  This is the identifier that must be used when querying the status of the payment initiation carried out.
              endToEndId:
                $ref: '#/components/schemas/EndToEndId'
              consentId:
                type: string
                maxLength: 256
                pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
                example: 'urn:bancoex:C1DD33123'
                description: |
                  Unique identifier of the consent created for the requested payment initiation. It must be a URN - Uniform Resource Name.
                  A URN, as defined in [RFC8141](https://tools.ietf.org/html/rfc8141), is a Uniform Resource
                  Identifier - URI - assigned under the "urn" URI scheme and a specific URN namespace, with the intention that the URN
                  be a persistent, location-independent resource identifier.
                  Taking the string urn:bancoex:C1DD33123 as an example of a consentId, we have:
                  - the namespace (urn)
                  - the identifier associated with the namespace of the transmitting institution (bancoex)
                  - the specific identifier within the namespace (C1DD33123).
                  More detailed information about the construction of namespaces should be consulted in [RFC8141](https://tools.ietf.org/html/rfc8141).

                  [Restriction] This field is mandatory when the value of the authorisationFlow field is equal to FIDO_FLOW.
              creationDateTime:
                type: string
                format: date-time
                pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
                example: '2020-07-21T08:30:00Z'
                description: |
                  Date and time when the resource was created.
                  A string with date and time in accordance with the RFC-3339 specification,
                  always using the UTC timezone (UTC time format).
              statusUpdateDateTime:
                type: string
                format: date-time
                pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
                example: '2020-07-21T08:30:00Z'
                description: |
                  Date and time of the last update of the payment initiation.
                  A string with date and time in accordance with the RFC-3339 specification,
                  always using the UTC timezone (UTC time format).
              proxy:
                $ref: '#/components/schemas/ProxyV5'
              status:
                $ref: '#/components/schemas/EnumPaymentStatusType'
              rejectionReason:
                $ref: '#/components/schemas/RejectionReason'
              localInstrument:
                $ref: '#/components/schemas/EnumLocalInstrumentV5'
              cnpjInitiator:
                type: string
                pattern: '^[0-9A-Z]{12}[0-9]{2}$'
                maxLength: 14
                example: '50685362000135'
                description: CNPJ of the Payment Initiator duly authorised to provide the Initiation Service in Pix.
              payment:
                type: object
                description: Object containing payment data such as currency and amount.
                required:
                  - amount
                  - currency
                properties:
                  amount:
                    $ref: '#/components/schemas/AmountV5'
                  currency:
                    type: string
                    maxLength: 3
                    pattern: '^([A-Z]{3})$'
                    example: BRL
                    description: |
                      Code of the national currency according to the ISO-4217 model, that is, 'BRL'.
                      All the monetary values informed are represented in Brazil's current currency.
              transactionIdentification:
                $ref: '#/components/schemas/TxId'
              qrCode:
                type: string
                maxLength: 512
                pattern: '[\w\W\s]*'
                example: |
                  00020104141234567890123426660014BR.GOV.BCB.PIX014466756C616E6F32303139406578616D706C652E636F6D27300012
                  BR.COM.OUTRO011001234567895204000053039865406123.455802BR5915NOMEDORECEBEDOR6008BRASILIA61087007490062
                  530515RP12345678-201950300017BR.GOV.BCB.BRCODE01051.0.080450014BR.GOV.BCB.PIX0123PADRAO.URL.PIX/0123AB
                  CD81390012BR.COM.OUTRO01190123.ABCD.3456.WXYZ6304EB76
                description: |
                  Represents the sequence of characters corresponding to the QR Code made available to the payer, which may be obtained by the reader of the payer's device or by copy and paste. It must be in the UTF-8 format and enable the return of the payer's data after the query in the DICT. For cases where “/data/payment/details/localInstrument” is equal to QRDN or APDN, the charge data will be passed on by the ITP in the “/data/payment/details/payloadJWS” field, allowing the holder to validate the charge data without the need to query the payloadJWS of the QR Code in question through the URL. The holder is not prevented from carrying out the query; however, in cases where the value of the "txId" field changes, the account holder institution must trust the payloadJWS passed on by the ITP.
                  [Restriction] Field that must be filled in when the value of /data/payment/details/localInstrument is equal to QRDN, APDN, QRES or APES, observing the maximum size of 512 bytes.
              remittanceInformation:
                type: string
                maxLength: 140
                pattern: '[\w\W\s]*'
                example: Pagamento da nota RSTO035-002.
                description: |
                  It must be filled in whenever the paying user enters any additional information in a payment, to be sent to the payee.
              creditorAccount:
                $ref: '#/components/schemas/CreditorAccountV5'
              debtorAccount:
                $ref: '#/components/schemas/DebtorAccountV5'
              authorisationFlow:
                type: string
                enum:
                  - HYBRID_FLOW
                  - CIBA_FLOW
                  - FIDO_FLOW
                example: HYBRID_FLOW
                description: |
                  Conditional field used to identify the authorisation flow in which the payment was requested.

                  [Restriction] If CIBA or FIDO, filling it in is mandatory. If the field is not present in the payload, it is understood that the authorisation flow used is the HYBRID_FLOW.
        links:
          $ref: '#/components/schemas/LinkSinglePost'
        meta:
          $ref: '#/components/schemas/RegulatoryMeta'
    LinkSinglePost:
      type: object
      description: References to other resources of the requested API.
      required:
        - self
      properties:
        self:
          type: string
          format: uri
          maxLength: 2000
          description: Full URI for the first item present in the response.
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
          pattern: '^(https:\/\/)?(www\.)?[-a-zA-Z0-9@:%._\+~#=]{2,256}\.[a-z]{2,6}\b([-a-zA-Z0-9@:%_\+.~#?&\/\/=]*)$'
    PatchPixPayment:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/PatchPixPaymentData'
    PatchPixPaymentData:
      type: object
      required:
        - status
        - cancellation
      properties:
        status:
          $ref: '#/components/schemas/EnumPaymentCancellationStatusType'
        cancellation:
          type: object
          description: |
            Object grouping the information on which paying user requested the cancellation of the transaction.
            Note: this field is necessary because, in cases of multiple authorisation levels, it is possible for the payment to be requested by one paying user and cancelled by another.
          required:
            - cancelledBy
          properties:
            cancelledBy:
              type: object
              description: Information related to the paying user who requested the cancellation of the payment.
              required:
                - document
              properties:
                document:
                  type: object
                  description: Object consolidating the document data of the user who requested the cancellation.
                  required:
                    - identification
                    - rel
                  properties:
                    identification:
                      type: string
                      maxLength: 11
                      description: Document number of the paying user responsible for cancelling the payment.
                      example: '11111111111'
                      pattern: '^\d{11}$'
                    rel:
                      type: string
                      maxLength: 3
                      description: Document type of the paying user responsible for cancelling the payment.
                      example: CPF
                      pattern: '^[A-Z]{3}$'
    EnumPaymentCancellationStatusType:
      type: string
      enum:
        - CANC
      example: CANC
      description: |
        Used to inform which state the payment must move to.
        Currently the only possible value is CANC.
    PatchPixPaymentCancellation:
      type: object
      description: |
        Object containing the data regarding the paying user who requested the cancellation, the channel used by them and the reason.
      required:
        - cancelledAt
        - cancelledBy
        - reason
        - cancelledFrom
      properties:
        reason:
          $ref: '#/components/schemas/EnumPaymentCancellationReasonType'
        cancelledFrom:
          $ref: '#/components/schemas/EnumPaymentCancellationFromType'
        cancelledAt:
          type: string
          description: 'Date and time when the cancellation was carried out, in accordance with the RFC-3339 specification, UTC format.'
          format: date-time
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2021-05-21T08:30:00Z'
        cancelledBy:
          type: object
          description: Information related to the paying user who requested the cancellation of the payment.
          required:
            - document
          properties:
            document:
              type: object
              description: Object consolidating the document data of the user who requested the cancellation.
              required:
                - identification
                - rel
              properties:
                identification:
                  type: string
                  maxLength: 11
                  description: Document number of the paying user responsible for cancelling the payment.
                  example: '11111111111'
                  pattern: '^\d{11}$'
                rel:
                  type: string
                  maxLength: 3
                  description: Document type of the paying user responsible for cancelling the payment.
                  example: CPF
                  pattern: '^[A-Z]{3}$'
    EnumPaymentCancellationReasonType:
      type: string
      enum:
        - CANCELADO_PENDENCIA
        - CANCELADO_AGENDAMENTO
        - CANCELADO_MULTIPLAS_ALCADAS
      example: CANCELADO_PENDENCIA
      description: |
        This field must be filled in for the response by the account holder institution based on the status the payment is in at the moment the cancellation is requested (e.g. Payment status = PDNG, the field must be filled in with the enum CANCELADO_PENDENCIA)

        Possible values:

        CANCELADO_PENDENCIA - Payment cancelled while it was in the PDNG situation

        CANCELADO_AGENDAMENTO - Payment cancelled while it was in the SCHD situation

        CANCELADO_MULTIPLAS_ALCADAS - Payment cancelled while it was in the PATC situation
    EnumPaymentCancellationFromType:
      type: string
      enum:
        - INICIADORA
        - DETENTORA
      example: INICIADORA
      description: |
        Field used to inform the channel through which the cancellation was carried out.

        Possible values:

        INICIADORA - Payment cancelled by the paying user in the initiating institution's channels

        DETENTORA - Payment cancelled by the paying user in the account holder institution's channels
