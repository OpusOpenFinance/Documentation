      summary: Details of the participants registered in the directory, identifying their APIs
      externalDocs:
        description: Open Finance - Regulatory functions for OpenID and OAuth 2.0 mappings
        url: https://openbanking-brasil.github.io/specs-seguranca/open-banking-brasil-dynamic-client-registration-1_ID2-ptbr.html#section-7.2
      parameters:
       - in: query
         name: role
         schema:
           type: string
         description: Filters OrgDomainRoleClaims containing the role provided. Role types are subject to change; check the externalDocs described.
       - in: query
         name: familyType
         schema:
           type: string
         description: Filters ApiResources containing the familyType provided
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantsResponse'
        '502':
