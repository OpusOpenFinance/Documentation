          $ref: '#/components/schemas/PaymentPix'
        remittanceInformation:
          type: string
          maxLength: 140
          pattern: '[\w\W\s]*'
          example: Payment of invoice RSTO035-002.
          description: |
            Must be filled in whenever the payer user enters any additional information in a payment, to be sent to the creditor.
        creditorAccount:
          $ref: '#/components/schemas/CreditorAccountPostPixPaymentsResponse'
        debtorAccount:
            $ref: '#/components/schemas/DebtorAccount'
        authorisationFlow:
          type: string
          enum:
            - HYBRID_FLOW
            - CIBA_FLOW
            - FIDO_FLOW
          example: HYBRID_FLOW
          description: |
            Conditional field used to identify the authorisation flow in which the payment was requested.

            [Restriction] If CIBA or FIDO, filling it in is mandatory. If the field is not present in the payload, it is understood that the authorisation flow used is HYBRID_FLOW.
        localInstrument:
          $ref: '#/components/schemas/LocalInstrument'
        proxy:
          type: string
          description: |
            Key registered in DICT belonging to the creditor. The key types may be: phone, e-mail, cpf/cnpj or random key.
            In the case of a mobile phone, it must be provided in the E.1641 standard. For e-mail, it must have the format xxxxxxxx@xxxxxxx.xxx(.xx) and a maximum of 77 characters.
