        - $ref: '#/components/parameters/xFapiInteractionId'
        - $ref: '#/components/parameters/xCustomerUserAgent'
        - $ref: '#/components/parameters/xIdempotencyKey'
        - name: recurringPaymentId
          in: path
          description: Payment operation identifier
          schema:
            type: string
          required: true
          example: D730A10D6784379085391417F3EF657C1247B2B3645210DD97F739B33B349376
      description: |
        Proxy method for revoking a payment initiation. It follows the request/response standard defined in the official documentation ([Open Finance - API Payment Initiation](https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/198410569/SV+API+-+Pagamentos+Autom+ticos)), version 2.2.0.

        This endpoint must be used to cancel transactions that are in one of the following situations:
        Successfully scheduled (SCHD), held for analysis (PDNG). If the request is successful, the transaction moves to the CANC situation.

        If the payment status is other than SCHD/PDNG, or if some other business rule prevents the cancellation, the PATCH request returns
        HTTP Status 422 with the PAGAMENTO_NAO_PERMITE_CANCELAMENTO code.

        If a 422 is received, the initiator must make a GET request on the payment to check its current situation, as well as the associated details.

        [Restriction] For Automatic Pix (“recurringConfiguration” equal to “automatic”), both the creditor and the payer may perform the cancellation,
        with the creditor being allowed to request cancellation until 22:00 (Brasília time) and the payer until 23:59 (Brasília time) of the day before the payment settlement date,
        except for cases of new attempts on subsequent days, where only the creditor may cancel, also until 22:00h.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchPixPayment'
        description: Recurring Payment update.
        required: true
      responses:
        '502':
          description: Error in Opus Open Client when communicating with the account holder institution
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
