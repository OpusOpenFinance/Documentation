    EnumAuthorisationStatusType:
      type: string
      enum:
        - AWAITING_AUTHORISATION
        - PARTIALLY_ACCEPTED
        - AUTHORISED
        - REJECTED
        - REVOKED
        - CONSUMED
      example: AWAITING_AUTHORISATION
      description: |
        Current status of the recurring consent according to the state machine
        - AWAITING_AUTHORISATION - Awaiting authorisation
        - PARTIALLY_ACCEPTED - Partially accepted
        - AUTHORISED - Authorised
        - REJECTED - Rejected
        - REVOKED - Revoked
        - CONSUMED - Consumed
    EnumPaymentCancellationStatusType:
      type: string
      enum:
        - CANC
      example: CANC
      description: |
        State to which the payment must transition
    EnumPaymentPersonType:
      type: string
      enum:
        - PESSOA_NATURAL
        - PESSOA_JURIDICA
      example: PESSOA_NATURAL
      description: |
        Holder, natural person or legal entity to whom the creditor data refer.
    EnumPaymentStatusType:
      type: string
      enum:
        - RCVD
        - CANC
        - ACCP
        - ACPD
        - RJCT
        - ACSC
        - PDNG
        - SCHD
      example: PDNG
      description: |
        Current state of the payment. The state evolves in the following order:
        - RCVD (Received) - Indicates that the payment request was successfully received by the holder institution, but there are still validations to be performed before it is submitted for settlement.
        - CANC (Cancelled) - Indicates that the pending Pix transaction was successfully cancelled by the user before it was confirmed (ACCP) or rejected (RJCT) by the holder institution.
        - ACCP( Accepted Customer Profile) - Indicates that all the necessary checks have already been performed by the holder institution and that the transaction is ready to be sent for settlement (in the SPI, if it is a Pix to another institution, or internally, if it is to another account at the same institution).
        - ACPD (Accepted Clearing Processed) - Indicates that the holder institution has already submitted the transaction for settlement, but does not yet have confirmation of whether it was settled or rejected.
        - RJCT (Rejected) Indicates that the transaction was rejected by the holder institution or by the SPI.
        - ACSC (Accepted Settlement Completed Debitor Account) - Indicates that the transaction was completed by the holder institution or by the SPI.
        - PDNG (Pending) - Indicates that the holder institution has temporarily held the Pix transaction for analysis. It does not apply to Smart Transfers.
        - SCHD (Scheduled) - Indicates that the Pix transaction was successfully scheduled at the holder institution.
        In the case of failure:
        - RJCT (REJECTED) - Payment instruction rejected.
