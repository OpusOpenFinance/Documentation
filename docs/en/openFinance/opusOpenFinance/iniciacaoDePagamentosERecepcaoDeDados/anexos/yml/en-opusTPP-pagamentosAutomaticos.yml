      summary: Retrieves information about a consent.
      externalDocs:
        description: Open Finance - API Payment Initiation
        url: https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/198410569/SV+API+-+Pagamentos+Autom+ticos
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - $ref: '#/components/parameters/authorisationServerId'
        - $ref: '#/components/parameters/recurringConsentId'
        - $ref: '#/components/parameters/regulatoryV'
      responses:
        '502':
          description: Error in Opus Open Client when communicating with the account holder institution
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
                $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded when communicating with the account holder institution
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
                $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '200':
          description: Successful response
          headers:
              x-selected-regulatory-v:
                $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAutomaticPaymentRecurringConsentResponse'
        '400':
          description: Error sent by the account holder institution, following the standard defined by BACEN
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
                $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        default:
          description: Error sent by the account holder institution, following the standard defined by BACEN
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
                $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
    patch:
      operationId: oofcAutomaticPaymentsPatchRecurringConsentsConsentId
      description: |
        Method for rejecting, revoking or editing a long-lived consent:
        1 - Information about the revocation:
        - If successful, the consent moves to the “REVOKED” status;
        - Only consents with the “AUTHORISED” status can be revoked;
        - Automatic payments associated with the consent and scheduled to occur by 23:59h of the following day (from the day of
        the revocation request) must be maintained. Payments scheduled to occur after that period must be cancelled.
        - Further guidance regarding revocation can be found in the API header, topic “Validações”, item 3.

        2 - Information about the edit:
        - The fields that may be edited and their rules can be found through this [link](https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/628195665);
        - Editing is only possible in cases of consent for Automatic Pix (“automatic” chosen in the oneOf of the “recurringConfiguration” object) and that are authorised (`data.status == AUTHORISED`);
        - Sending the item "/data/creditors/name" will update the creditor's name in all the elements of the array.
        - If the consent is for a fixed amount (“/data/recurringConfiguration/automatic/fixedAmount” field filled in), editing the “/data/recurringConfiguration/automatic/maximumVariableAmount” field is not permitted.
        - If the creditor has defined a floor for the limit to be stipulated by the payer (“/data/recurringConfiguration/automatic/minimumVariableAmount” field filled in), the maximum limit amount per transaction defined by the payer user (“/data/recurringConfiguration/automatic/maximumVariableAmount” field) cannot be lower than the amount stipulated by the creditor.
        - If the consent expiration term is edited and payments are already scheduled for days after the new date defined, those payments must be cancelled.

        3 - Information about the rejection:
        - If there is a need to cancel a consent that has not yet been authorised, the initiator may call the endpoint to move the consent to REJECTED.
      tags:
        - Opus Open Finance
      summary: Rejects, revokes or edits a consent.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchRecurringConsentRequest'
      externalDocs:
        description: Open Finance - API Payment Initiation
        url: https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/198410569/SV+API+-+Pagamentos+Autom+ticos
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - $ref: '#/components/parameters/authorisationServerId'
        - $ref: '#/components/parameters/recurringConsentId'
      responses:
        '502':
          description: Error in Opus Open Client when communicating with the account holder institution
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
                $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded when communicating with the account holder institution
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
                $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
