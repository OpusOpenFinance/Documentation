      description: |
        Method for retrieving information about a set of payments associated with the same recurringConsentId.
        It is also possible to send a start date (startDate) and an end date (endDate), if the search is for transactions within a given time window.

        It follows the request/response standard defined in the official documentation ([Open Finance - API Payment Initiation](https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/198410569/SV+API+-+Pagamentos+Autom+ticos)), version 2.2.0.
      responses:
        '502':
          description: Error in Opus Open Client when communicating with the account holder institution
          headers:
            x-origin-error:
