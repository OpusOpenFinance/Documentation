    originalRecurringPaymentId:
      type: string
      description: |
        Field containing the code or the identifier of the original payment attempt that failed.
        The original payment attempt is the first attempt (Intraday – First Attempt, see documentation) made for the payment of a given recurrence.
        Code or unique identifier provided by the account holder institution to represent the payment initiation.
        The recurringPaymentId must be different from the endToEndId.
        This is the identifier that must be used when querying the status of the payment initiation performed.

        [Restriction] This field is mandatory for the Initiator to send when it is a new settlement attempt for a payment that previously failed.
      minLength: 1
      maxLength: 100
      pattern: ^[a-zA-Z0-9][a-zA-Z0-9\-]{0,99}$
      example: TXpRMU9UQTROMWhZV2xSU1FUazJSMDl
    EndToEndId:
      type: string
      minLength: 32
      maxLength: 32
      pattern: '^([E])([0-9A-Z]{8})([0-9]{4})(0[1-9]|1[0-2])(0[1-9]|[1-2][0-9]|3[0-1])(2[0-3]|[01][0-9])([0-5][0-9])([a-zA-Z0-9]{11})$'
      example: E9040088820241225150000123873170
      description: |
        This is a unique identifier, generated at the payment initiator institution and received at the account holder institution, permeating the entire journey of the Pix payment.

        [Restriction] The holder institution must return the field with the same value received from the initiator.

        In the case of Automatic Pix, with regard to the composition of the endToEndId, the initiator must use the date for which the Pix is being scheduled and the fixed time of 15:00 UTC, which will give the holder institution a settlement window from 00:00 to 23:59 Brasília time, even though that window, for the holder institution, runs until 21:00.
    EndToEndIdPost:
      type: string
      minLength: 32
      maxLength: 32
      pattern: '^([E])([0-9A-Z]{8})([0-9]{4})(0[1-9]|1[0-2])(0[1-9]|[1-2][0-9]|3[0-1])(2[0-3]|[01][0-9])([0-5][0-9])([a-zA-Z0-9]{11})$'
      example: E9040088820241225150000123873170
      description: |
        It must be filled in in the standard format ExxxxxxxxyyyyMMddHHmmkkkkkkkkkkk (32 characters; "case sensitive", that is, it distinguishes between upper and lower case letters), where:

        - "E" - fixed (1 character);
        - xxxxxxxx - identification of the agent that generated the EndToEndId, which may be: the ISPB of the direct participant or the ISPB of the indirect participant (8 numeric characters [0-9]);
        - yyyyMMddHHmm – date, hour and minute (12 characters), following UTC time, of the submission of the payment order, if the settlement is prioritised, or expected for the sending of the order to the settlement system, if scheduling is performed. For prioritised and non-prioritised orders, the agent that generated the EndToEndId may fill it in with a maximum tolerance of 12 hours, into the future and into the past, in relation to the effective time at which the order is processed by the SPI;
        - kkkkkkkkkkk – sequence created by the agent that generated the EndToEndId (11 alphanumeric characters [a-z/A-Z/0-9]). It must be unique within each “yyyyMMddHHmm”;

        The EndToEndId may be generated by the direct participant, by the indirect participant or by the payment initiator.

        It must be unique and may not be repeated in any other operation sent to the SPI.
    EnumAccountTypePayments:
      type: string
      enum:
        - CACC
        - SVGS
        - TRAN
      example: CACC
      description: |
        Types of accounts used for payment via Pix.
        Traditional modalities provided for by Resolution 4,753, not covering linked accounts,
        accounts of persons domiciled abroad, accounts in foreign currencies and the electronic money correspondent account.
        Below is the description of each ENUM value within the scope of Pix.

        - CACC - Current - Checking Account.
        - SVGS - Savings - Savings Account.
        - TRAN - TransactingAccount - Prepaid Payment Account.
    EnumAccountTypeConsents:
      type: string
      enum:
        - CACC
        - SVGS
        - TRAN
      example: CACC
      description: |
        Types of accounts used for payment.
        Traditional modalities provided for by Resolution 4,753, not covering linked accounts,
        accounts of persons domiciled abroad, accounts in foreign currencies and the electronic money correspondent account.
        Below is the description of each ENUM value.

