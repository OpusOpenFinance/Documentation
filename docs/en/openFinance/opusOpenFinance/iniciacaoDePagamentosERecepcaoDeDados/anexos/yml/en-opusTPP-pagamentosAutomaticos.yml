          $ref: '#/components/schemas/TransactionIdentification'
        document:
          type: object
          description: Information of the identification document of the transaction's creditor.
          required:
            - identification
            - rel
          properties:
            identification:
              type: string
              pattern: '^([0-9]{11})$|^([0-9A-Z]{12}[0-9]{2})$'
              minLength: 11
              maxLength: 14
              example: '11111111111111'
              description: |
                Official identification document number of the creditor, whether a natural person or a legal entity.
                The value provided must be equal to one of the values sent at the consent creation stage (within the “/data/creditors” array).
                When this rule is not observed, the holder institution must return, synchronously, the HTTP 422 error - PAGAMENTO_DIVERGENTE_CONSENTIMENTO
            rel:
              type: string
              enum:
                - CPF
                - CNPJ
              example: 'CNPJ'
              description: Official identification document type of the holder, whether a natural person or a legal entity.
        paymentReference:
          $ref: '#/components/schemas/PaymentReference'
    PaymentReference:
      type: string
      example: 'R/2025-09-23/P1M'
      description: |
        [Restriction] Mandatory field if it is an Automatic Pix payment, and it must be sent for ecosystem metric collection criteria. If this rule is not observed, the account holder institution must return an HTTP 422 error with the DETALHE_PAGAMENTO_INVALIDO code.
        Filling it in must follow this logic:
        - First Payment: If it is the initial payment specified in the /data/firstPayment field, fill the field in with the fixed string "zero".
        - Recurring (Subsequent) Payments: For all recurring payments after the initial one, the paymentReference field must be filled in with an ISO 8601 string in the format ```R/<start>/<duration>```, representing the exact cycle being paid.
          - ```R```, following the ISO8601 standard to represent the single recurrence of the cycle that started on the day provided in the ```<start>``` component.
          - The ```<start>``` component must be the start date of the specific cycle, in the format ```YYYY-MM-DD```, to which the payment being sent refers.
          - The ```<duration>``` component represents the cycle interval defined for the authorised consent (P1W for weekly, P1M for monthly, P3M for quarterly, P6M for half-yearly and P1Y for yearly).
            - Examples:
              - 1: Cycle start date defined in the consent: 23/07/25
                - Periodicity defined in the consent: Weekly
                - Filling in of the paymentReference:
                - First cycle: R/2025-07-23/P1W
                - Second cycle:  R/2025-07-30/P1W
                - Third cycle: R/2025-08-06/P1W
              - 2: Cycle start date defined in the consent: 23/07/25
                - Periodicity defined in the consent: Monthly
                - Filling in of the paymentReference:
                - First cycle: R/2025-07-23/P1M
                - Second cycle: R/2025-08-23/P1M
                - Third cycle: R/2025-09-23/P1M
