    CreateRecurringPixPayment:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/CreateRecurringPixPaymentData'
    CreateRecurringPixPaymentData:
      type: object
      description: Object containing the payment data and the creditor's data.
      required:
        - endToEndId
        - date
        - payment
        - creditorAccount
        - cnpjInitiator
        - localInstrument
        - document
      properties:
        recurringConsentId:
          type: string
          pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
          maxLength: 256
          description: |
            Unique identifier of the long-lived consent created for the requested payment initiation. It must be a URN - Uniform Resource Name.
            A URN, as defined in [RFC8141](https://tools.ietf.org/html/rfc8141), is a Uniform Resource
            Identifier - URI - assigned under the "urn" URI scheme and a specific URN namespace, with the intent that the URN
            is a persistent, location-independent resource identifier.
            Considering the string urn:bancoex:C1DD33123 as an example for `recurringConsentId`, we have:
            - the namespace (urn)
            - the identifier associated with the namespace of the transmitting institution (bancoex)
            - the specific identifier within the namespace (C1DD33123).
            More detailed information about the construction of namespaces should be found in [RFC8141](https://tools.ietf.org/html/rfc8141).

            [Restriction] This field is mandatory when the value of the authorisationFlow field is equal to FIDO_FLOW.
        endToEndId:
          $ref: '#/components/schemas/EndToEndIdPost'
        date:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-01-01'
          description: Date on which the payment will be made. A string using the UTC-3 timezone (UTC time format).
        payment:
          $ref: '#/components/schemas/PaymentPix'
        creditorAccount:
          type: object
          description: |
            Object containing the identification of the destination account of the beneficiary/creditor.

            [Restriction] - If /data/paymentReference = "zero", the credit account information sent (/data/creditorAccount) must be the same as that present in the credit account provided at the creation of the consent (`/data/recurringConfiguration/automatic/firstPayment/creditorAccount`)
          required:
            - ispb
            - number
            - accountType
          properties:
            ispb:
              type: string
              minLength: 8
              maxLength: 8
              pattern: '^[0-9A-Z]{8}$'
              example: '12345678'
              description: |
                Must be filled in with the ISPB (Brazilian Payment System Identifier) of the SPI (Instant Payment System) participant, using numbers only.
            issuer:
              type: string
              minLength: 1
              maxLength: 4
              pattern: '^[0-9]{1,4}$'
              example: '1774'
              description: |
                Code of the branch issuing the account, without the check digit.
                (A branch is the facility intended to serve customers, the general public and the members of credit unions,
                in the course of the institution's activities, and it may not be mobile or temporary).

                [Restriction] Mandatory for the following account types: CACC (CONTA_DEPOSITO_A_VISTA) and SVGS (CONTA_POUPANCA).
            number:
              type: string
              minLength: 1
              maxLength: 20
              pattern: '^[0-9]{1,20}$'
              example: '1234567890'
              description: |
                Must be filled in with the transactional account number of the creditor user, including the check digit (if one exists);
                if there is an alphanumeric value, it must be converted to 0.
            accountType:
              $ref: '#/components/schemas/EnumAccountTypePayments'
        remittanceInformation:
          type: string
          maxLength: 140
          pattern: '[\w\W\s]*'
          example: Payment of invoice XPTO035-002.
          description: |
            Must be filled in whenever the payer user enters any additional information in a payment, to be sent to the creditor.
        cnpjInitiator:
          type: string
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          maxLength: 14
          example: '50685362000135'
          description: CNPJ of the Payment Initiator duly authorised to provide Pix Initiation Services.
        ibgeTownCode:
          type: string
          minLength: 7
          maxLength: 7
          pattern: '^\d{7}$'
          example: '5300108'
          description: |
            The ibgeTownCode field in the Pix arrangement has the same behaviour as the codMun field described in item 1.6.6 of the Pix manual.

            If the information regarding the municipality is not sent, the creditor's PSP will assume that there are no state or municipal holidays in the period in question;
        authorisationFlow:
          type: string
          enum:
            - HYBRID_FLOW
            - CIBA_FLOW
            - FIDO_FLOW
          example: HYBRID_FLOW
          description: |
            Conditional field used to identify the authorisation flow in which the payment was requested.

            [Restriction] If CIBA or FIDO, filling it in is mandatory. If the field is not present in the payload, it is understood that the authorisation flow used is HYBRID_FLOW.
        riskSignals:
          $ref: '#/components/schemas/RiskSignalsPayments'
        localInstrument:
          $ref: '#/components/schemas/LocalInstrument'
        proxy:
          type: string
          description: |
            Key registered in DICT belonging to the creditor. The key types may be: phone, e-mail, cpf/cnpj or random key.
            In the case of a mobile phone, it must be provided in the E.1641 standard. For e-mail, it must have the format xxxxxxxx@xxxxxxx.xxx(.xx) and a maximum of 77 characters.
            In the case of a CPF, it must be provided with 11 digits, without dots or dashes. In the case of a CNPJ, it must be provided with 14 digits, without dots or dashes.
            In the case of a random key, the UUID generated by DICT must be provided, in the format specified in [RFC4122](https://tools.ietf.org/html/rfc4122).

            [Restriction] If localInstrument is equal to DICT or INIC, the proxy field must be filled in.

            [Restriction] If provided, the account holder institution must validate the proxy in DICT (when localInstrument is equal to DICT) and validate the creditorAccount object. This action is optional if localInstrument is equal to INIC

            [Restriction] If the “/data/localInstrument” field is sent as “MANU”, the “/data/proxy” field must not be provided
          pattern: '[\w\W\s]*'
          example: '11221131242'
