            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '422':
          description: The request was well formed, but could not be processed due to the specific business logic of the request.
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
