          type: string
          maxLength: 256
          pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
          example: 'urn:bancoex:C1DD33123'
          description: |
            Unique identifier of the consent created for the requested payment initiation. It must be a URN - Uniform Resource Name.
            A URN, as defined in [RFC8141](https://tools.ietf.org/html/rfc8141), is a Uniform Resource
            Identifier - URI - assigned under the "urn" URI scheme and a specific URN namespace, with the intent that the URN
            is a persistent, location-independent resource identifier.
            Considering the string urn:bancoex:C1DD33123 as an example for `recurringConsentId`, we have:
            - the namespace (urn)
            - the identifier associated with the namespace of the transmitting institution (bancoex)
            - the specific identifier within the namespace (C1DD33123).
            More detailed information about the construction of namespaces should be found in [RFC8141](https://tools.ietf.org/html/rfc8141).

            [Restriction] This field is mandatory when the value of the authorisationFlow field is equal to FIDO_FLOW.
        endToEndId:
          $ref: '#/components/schemas/EndToEndId'
        date:
          type: string
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2023-10-10'
          description: Date on which the payment will be made. A string using the UTC-3 timezone (UTC time format).
        creationDateTime:
          type: string
          format: date-time
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2020-07-21T08:30:00Z'
          description: |
            Date and time when the payment was created.
            A date and time string as per the [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339) specification,
            always using the UTC timezone (UTC time format).
        statusUpdateDateTime:
          type: string
          format: date-time
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2020-07-21T08:30:00Z'
          description: |
            Date and time when the payment had its status updated.
            A date and time string as per the [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339) specification,
            always using the UTC timezone (UTC time format).
