      properties:
        quantityLimit:
          type: integer
          minimum: 1
          example: 2
          description: Limit on the number of transactions permitted to occur during one day.
        transactionLimit:
          type: string
          pattern: '^((\d{1,16}\.\d{2}))$'
          minLength: 4
          maxLength: 19
          example: '100000.12'
          description: Maximum amount to be transacted daily.
    Week:
