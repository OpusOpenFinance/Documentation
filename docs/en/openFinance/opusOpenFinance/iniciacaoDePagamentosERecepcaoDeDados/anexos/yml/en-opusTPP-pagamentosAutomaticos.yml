            periodicLimits:
              $ref: "#/components/schemas/PeriodicLimits"
            startDateTime:
              type: string
              format: date-time
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              description: |
                Description: Date and time when the consent must become valid.
                A date and time string as per the [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339) specification, always using the UTC timezone (UTC time format).

                [Restriction] If this field is not sent by the initiator in the request, the holder institution must fill this field in with the same value assigned to the /data/creationDateTime field.
              example: '2023-05-21T08:30:00Z'
    Sweeping:
      type: object
