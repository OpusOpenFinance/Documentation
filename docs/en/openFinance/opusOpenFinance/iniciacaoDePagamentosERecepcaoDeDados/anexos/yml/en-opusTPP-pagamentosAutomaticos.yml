                  - ERRO_IDEMPOTENCIA
                  - CONSENTIMENTO_INVALIDO
                  - PARAMETRO_NAO_INFORMADO
                  - PARAMETRO_INVALIDO
                  - PAGAMENTO_RECUSADO_DETENTORA
                  - LIMITE_TENTATIVAS_EXCEDIDO
                  - FORA_PRAZO_PERMITIDO
                  - FALHA_INFRAESTRUTURA_DETENTORA
                  - DETALHE_TENTATIVA_INVALIDO
                  - NAO_PERMITIDO
                example: LIMITE_TENTATIVAS_EXCEDIDO
                description: |
                  Error codes foreseen in the creation of the payment initiation:
                  - ERRO_IDEMPOTENCIA: Idempotency error.
                  - CONSENTIMENTO_INVALIDO: Invalid consent (in a final status).
                  - PARAMETRO_NAO_INFORMADO: Parameter not provided.
                  - PARAMETRO_INVALIDO: Invalid parameter.
                  - PAGAMENTO_RECUSADO_DETENTORA: Payment refused by the account holder institution.
                  - FALHA_INFRAESTRUTURA_DETENTORA - An internal infrastructure failure occurred at the holder institution during the processing of the payment.
                  - LIMITE_TENTATIVAS_EXCEDIDO: The limit of settlement attempts for the payment permitted by the arrangement has been exceeded.
                  - FORA_PRAZO_PERMITIDO: The time or period of the request does not allow scheduling by the holder institution.
                  - DETALHE_TENTATIVA_INVALIDO: The parameter [field_name(s)] entered for the new payment attempt does not match the original payment that failed and is not permitted in the new payment attempt.
                  - NAO_PERMITIDO: Validates whether the value of originalRecurringPaymentId points to an Automatic Pix payment
              title:
                type: string
                maxLength: 255
                pattern: '[\w\W\s]*'
                example: Insufficient balance.
                description: |
                  Specific title of the reported error, according to the code sent:
                  - ERRO_IDEMPOTENCIA: Idempotency error.
                  - CONSENTIMENTO_INVALIDO: Invalid consent (in a final status).
                  - PARAMETRO_NAO_INFORMADO: Parameter not provided.
                  - PARAMETRO_INVALIDO: Invalid parameter.
                  - PAGAMENTO_RECUSADO_DETENTORA: Payment refused by the account holder institution.
                  - FALHA_INFRAESTRUTURA_DETENTORA - An internal infrastructure failure occurred at the holder institution during the processing of the payment.
                  - LIMITE_TENTATIVAS_EXCEDIDO: Attempt limit exceeded.
                  - FORA_PRAZO_PERMITIDO: Attempt outside the permitted term.
                  - DETALHE_TENTATIVA_INVALIDO: Invalid new attempt
                  - NAO_PERMITIDO: Validates whether the value of originalRecurringPaymentId points to an Automatic Pix payment
              detail:
                type: string
                maxLength: 2048
                pattern: '[\w\W\s]*'
                example: The selected account does not have sufficient balance to make the payment.
                description: |
                  Specific description of the error according to the code reported:
                  - ERRO_IDEMPOTENCIA: Idempotency error.
                  - CONSENTIMENTO_INVALIDO: Invalid consent (in a final status).
                  - PARAMETRO_NAO_INFORMADO: Parameter not provided.
                  - PARAMETRO_INVALIDO: Invalid parameter.
                  - PAGAMENTO_RECUSADO_DETENTORA: Payment refused by the account holder institution.
                  - FALHA_INFRAESTRUTURA_DETENTORA - An internal infrastructure failure occurred at the holder institution during the processing of the payment.
                  - LIMITE_TENTATIVAS_EXCEDIDO: The limit of settlement attempts for the payment permitted by the arrangement has been exceeded.
                  - FORA_PRAZO_PERMITIDO: The time or period of the request does not allow scheduling by the holder institution.
                  - DETALHE_TENTATIVA_INVALIDO: The parameter [field_name(s)] entered for the new payment attempt does not match the original payment that failed and is not permitted in the new payment attempt.
                  - NAO_PERMITIDO: Validates whether the value of originalRecurringPaymentId points to an Automatic Pix payment
        meta:
