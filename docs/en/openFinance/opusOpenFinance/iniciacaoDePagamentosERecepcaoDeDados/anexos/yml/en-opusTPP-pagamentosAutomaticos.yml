                    in the course of the institution's activities, and it may not be mobile or temporary).

                    [Restriction] Mandatory for the following account types: CACC (CONTA_DEPOSITO_A_VISTA) and SVGS (CONTA_POUPANCA).
                number:
                  type: string
                  minLength: 1
                  maxLength: 20
                  pattern: '^[0-9]{1,20}$'
                  example: '1234567890'
                  description: |
                    Must be filled in with the transactional account number of the payer user, including the check digit (if one exists);
                    if there is an alphanumeric value, it must be converted to 0.
                accountType:
                  $ref: '#/components/schemas/EnumAccountTypeConsents'
            rejection:
