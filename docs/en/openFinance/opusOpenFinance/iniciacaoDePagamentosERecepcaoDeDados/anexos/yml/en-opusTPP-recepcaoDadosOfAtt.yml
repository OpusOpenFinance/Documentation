            $ref: '#/components/schemas/AccountsAccountData'
        links:
          $ref: '#/components/schemas/AccountsLinks'
        meta:
          $ref: '#/components/schemas/AccountsMeta'
    AccountsResponseAccountBalances:
      type: object
      required:
        - data
