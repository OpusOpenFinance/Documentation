        operationCategoryCode:
          type: string
          maxLength: 5
          pattern: '^\d{5}$'
          description: Code of the nature-fact of the closing of the transaction. It must comply with the nature codes referenced in Resolution 277 or in Circular 3690, as applicable to the foreign exchange contract.
          example: '90302'
        foreignPartie:
          type: object
          required:
            - relationshipCode
            - foreignPartieName
            - foreignPartieCountryCode
          description: |
            List for the submission of information on the party involved.

            [Restriction] List that is optional for the participants to fill in when:
