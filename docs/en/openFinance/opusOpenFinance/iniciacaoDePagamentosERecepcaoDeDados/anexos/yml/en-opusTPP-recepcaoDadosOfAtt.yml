          $ref: '#/components/schemas/FundsEnumTransactionsTransactionType'
        transactionTypeAdditionalInfo:
          type: string
          description: |
            Additional information on the type of the reason, to be filled in in the case of movements not delimited in the domain.

            [Restriction] Field that must be filled in by the participants when the field 'transactionType' is filled in with the value 'OUTROS'.
          maxLength: 100
          pattern: '[\w\W\s]*'
