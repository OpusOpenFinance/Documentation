    VariableIncomesEnumTransactionsType:
      type: string
      description: |
        Type of movement from the investment perspective: inflow or outflow. In the cases of the payment of dividends, JCP and rentals, it is agreed that the movement type will be considered to be an outflow.
      enum:
        - ENTRADA
        - SAIDA
      example: SAIDA
    VariableIncomesEnumTransactionsTransactionType:
      type: string
      description: |
        The field must classify the movement into one of the types described: purchase, sale, dividends, JCP, rentals, custody transfer, ownership transfer and others.
        The transmitter must classify the available movements, associating each one with one of the Enum items listed in this field.
        The OUTROS option must only be used for cases in which the shared movement in fact cannot be classified as one of the items of this Enum.
        The expression "aluguéis" must be used only to report the interest/remuneration paid/received by the customer under share lending agreements, following the same understanding of ENTRADA/SAÍDA as the expression "dividendos".
      enum:
        - COMPRA
        - VENDA
        - DIVIDENDOS
        - JCP
        - ALUGUEIS
        - TRANSFERENCIA_CUSTODIA
        - TRANSFERENCIA_TITULARIDADE
        - OUTROS
      example: DIVIDENDOS
    VariableIncomesEnumTransactionsCurrentType:
      type: string
      description: |
        Type of movement from the investment perspective: inflow or outflow. In the cases of the payment of dividends, JCP and rentals, it is agreed that the movement type will be considered to be an outflow.
      enum:
        - ENTRADA
        - SAIDA
      example: SAIDA
    VariableIncomesEnumTransactionsCurrentTransactionType:
      type: string
      description: |
        The field must classify the movement into one of the types described: purchase, sale, dividends, JCP, rentals, custody transfer, ownership transfer and others.
        The transmitter must classify the available movements, associating each one with one of the Enum items listed in this field.
        The OUTROS option must only be used for cases in which the shared movement in fact cannot be classified as one of the items of this Enum.
        The expression "aluguéis" must be used only to report the interest/remuneration paid/received by the customer under share lending agreements, following the same understanding of ENTRADA/SAÍDA as the expression "dividendos".
      enum:
        - COMPRA
        - VENDA
        - DIVIDENDOS
        - JCP
        - ALUGUEIS
        - TRANSFERENCIA_CUSTODIA
        - TRANSFERENCIA_TITULARIDADE
        - OUTROS
      example: DIVIDENDOS
