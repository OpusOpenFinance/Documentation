    UnarrangedAccountsOverdraftContractListData:
      type: object
      description: Set of information on unarranged account overdraft contracts held by the customer at the transmitting institution and for which they have provided consent.
      required:
        - brandName
        - companyCnpj
        - productType
        - productSubType
        - ipocCode
        - contractId
      properties:
        contractId:
          type: string
          maxLength: 100
          minLength: 1
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          description: A unique and immutable identifier used to identify the contract of a credit operation. This identifier has no meaning to the credit borrower
          example: xcjklompowsa279212650822221989319aadrtjk
        brandName:
          type: string
          maxLength: 80
          pattern: '^[^\s](.*[^\s])?$'
          description: |
            Name of the Brand reported by the participant in Open Finance. It is recommended to use, whenever possible, the same brand name assigned in the directory field Customer Friendly Server Name (Authorisation Server).
          example: Organização A
        companyCnpj:
          type: string
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          description: |
            Complete record of the CNPJ of the institution responsible for the Registration - the CNPJ corresponds to the alphanumeric representation of the registration in the Cadastro de Pessoa Jurídica.
            Only the characters of the CNPJ must be provided, without a mask.
          example: '60500998000144'
        productType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftProductType'
        productSubType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftProductSubType'
        ipocCode:
          type: string
          maxLength: 67
          minLength: 22
          pattern: '^[\w\W]{22,67}$'
          description: |
            "Standardized contract number - IPOC (Identificação Padronizada da Operação de Crédito). According to DOC 3040, composed of:
            - **CNPJ of the institution:** 8 (eight) initial positions;
            - **Modality of the operation:** 4 (four) positions;
            - **Customer type:** 1 (one) position( 1 = natural person - CPF, 2= legal entity – CNPJ, 3 = natural person abroad, 4 = legal entity abroad, 5 = natural person without CPF and 6 = legal entity without CNPJ);
            - **Customer code:** The number of positions varies according to the customer type:
              1. For natural person customers with CPF (customer type = 1), report the 11 (eleven) positions of the CPF;
              2. For legal entity customers with CNPJ (customer type = 2), report the 8 (eight) initial positions of the CNPJ;
              3. For the other customers (customer types 3, 4, 5 and 6), report 14 (fourteen) positions with zero padding on the left if the identification is shorter;
            - **Contract code:** 1 (one) to 40 (forty) positions, without character padding."
          example: '92792126019929279212650822221989319252576'
    UnarrangedAccountsOverdraftEnumContractFeeCharge:
      type: string
      description: |
        "Form of charging relating to the fee agreed in the contract. (See Enum)
        - Minimum
        - Maximum
        - Fixed
        - Percentage"
      enum:
        - MINIMO
        - MAXIMO
        - FIXO
        - PERCENTUAL
      example: MINIMO
    UnarrangedAccountsOverdraftEnumContractFeeChargeType:
      type: string
      description: Type of charging for the fee agreed in the contract.
      enum:
        - UNICA
        - POR_PARCELA
      example: UNICA
    UnarrangedAccountsOverdraftEnumContractInstalmentPeriodicity:
      type: string
      description: |
        "Information regarding the regular periodicity of the installments. (See Enum)
        no regular periodicity, weekly, fortnightly, monthly, bimonthly, quarterly, half-yearly, annual"
      enum:
        - SEM_PERIODICIDADE_REGULAR
        - SEMANAL
        - QUINZENAL
        - MENSAL
        - BIMESTRAL
        - TRIMESTRAL
        - SEMESTRAL
        - ANUAL
        - OUTROS
      example: SEMANAL
    UnarrangedAccountsOverdraftEnumContractInterestRateType:
      type: string
      description: |
        "Interest Type  (see  Enum)
        - SIMPLES (always applied/charged on the initial capital, which is the amount lent/invested. There is no charging of interest on interest accumulated in the previous period(s). Example: on a loan of R$1,000, with a simple interest rate of 8% p.a., lasting 2 years, the total interest will be R$80 in the first year and R$ 80 in the second year. At the end of the contract, the borrower will return the principal and the simple interest of each year: R$1,000+R$80+R$80=R$1,160)
        - COMPOSTO (for each period of the contract (daily, monthly, annual etc.), there is a “new capital” for charging the contracted interest rate. This “new capital” is the sum of the capital and the interest charged in the previous period. Example: on a loan of R$1,000, with a compound interest rate of 8% p.a., lasting 2 years, the total interest will be R$80 in the first year. In the second year, the interest will be added to the capital (R$1,000 + R$ 80 = R$ 1,080), resulting in interest of R$ 86 (8% of R$ 1,080))"
      enum:
        - SIMPLES
        - COMPOSTO
      example: SIMPLES
    UnarrangedAccountsOverdraftEnumContractReferentialRateIndexerSubType:
      type: string
      description: |
        "Sub types of reference rates or indexers, in accordance with Annex 5: Reference rate or Indexer (Indx), of Document 3040"
      enum:
        - SEM_SUB_TIPO_INDEXADOR
        - PRE_FIXADO
        - TR_TBF
        - TJLP
        - LIBOR
        - TLP
        - OUTRAS_TAXAS_POS_FIXADAS
        - CDI
        - SELIC
        - OUTRAS_TAXAS_FLUTUANTES
        - IGPM
        - IPCA
        - IPCC
        - OUTROS_INDICES_PRECO
        - TCR_PRE
        - TCR_POS
        - TRFC_PRE
        - TRFC_POS
        - OUTROS_INDEXADORES
      example: TJLP
    UnarrangedAccountsOverdraftEnumContractReferentialRateIndexerType:
      type: string
      description: |
        "Types of reference rates or indexers, in accordance with Annex 5: Reference rate or Indexer (Indx), of Document 3040"
      enum:
        - SEM_TIPO_INDEXADOR
        - PRE_FIXADO
        - POS_FIXADO
        - FLUTUANTES
        - INDICES_PRECOS
        - CREDITO_RURAL
        - OUTROS_INDEXADORES
      example: PRE_FIXADO
    UnarrangedAccountsOverdraftEnumContractTaxPeriodicity:
      type: string
      description: |
        "Periodicity of the rate. (See  Enum)
        a.m - per month
        a.a. - per year"
      enum:
        - AM
        - AA
      example: AA
    UnarrangedAccountsOverdraftEnumContractTaxType:
      type: string
      description: |
        "Rate Type (see  Enum)
        - NOMINAL (a nominal rate is an interest rate in which the reference unit does not coincide with the compounding time unit. It is always provided in annual terms, and its compounding periods may be daily, monthly, quarterly or semi-annual. e.g. A rate of 12% per year with monthly compounding)
        - EFETIVA (It is the interest rate in which the reference unit coincides with the compounding time unit. As the units of time measurement of the interest rate and of the compounding periods are the same, simple examples such as 1% per month, 60% per year are used)"
      enum:
        - NOMINAL
        - EFETIVA
      example: EFETIVA
    UnarrangedAccountsOverdraftEnumWarrantySubType:
      type: string
      description: |
        Name/Identification of the sub type of the guarantee that secures the Modality of the Credit Operation contracted (Doc 3040, Annex 12).
      enum:
        - ACOES_DEBENTURES
        - ACORDOS_COMPENSACAO_LIQUIDACAO_OBRIGACOES
        - APLICACOES_FINANCEIRAS_RENDA_FIXA
        - APLICACOES_FINANCEIRAS_RENDA_VARIAVEL
        - APOLICES_CREDITO_EXPORTACAO
        - CCR_CONVENIO_CREDITOS_RECIPROCOS
        - CHEQUES
        - CIVIL
        - DIREITOS_SOBRE_ALUGUEIS
        - DEPOSITOS_A_VISTA_A_PRAZO_POUPANCA_OURO_TITULOS_PUBLICOS_FEDERAIS_ART_36
        - DEPOSITO_TITULOS_EMITIDOS_ENTIDADES_ART_23
        - DUPLICATAS
        - EMD_ENTIDADES_MULTILATERAIS_DESENVOLVIMENTO_ART_37
        - EQUIPAMENTOS
        - ESTADUAL_OU_DISTRITAL
        - FATURA_CARTAO_CREDITO
        - FEDERAL
        - FCVS_FUNDO_COMPENSACAO_VARIACOES_SALARIAIS
        - FGI_FUNDO_GARANTIDOR_INVESTIMENTOS
        - FGPC_FUNDO_GARANTIA_PROMOCAO_COMPETIT
        - FGTS_FUNDO_GARANTIA_TEMPO_SERVICO
        - FUNDO_GARANTIDOR_AVAL
        - GARANTIA_PRESTADA_FGPC_LEI_9531_ART_37
        - GARANTIA_PRESTADA_FUNDOS_QUAISQUER_OUTROS_MECANISMOS_COBERTURA_RISCO_CREDITO_ART_37
        - GARANTIA_PRESTADA_TESOURO_NACIONAL_OU_BACEN_ART_37_BENS_DIREITOS_INTEGRANTES_PATRIMONIO_AFETACAO
        - IMOVEIS
        - IMOVEIS_RESIDENCIAIS
        - MITIGADORAS
        - MUNICIPAL
        - NAO_MITIGADORAS
        - NOTAS_PROMISSORIAS_OUTROS_DIREITOS_CREDITO
        - OUTRAS
        - OUTROS
        - OUTROS_BENS
        - OUTROS_GRAUS
        - OUTROS_IMOVEIS
        - OUTROS_SEGUROS_ASSEMELHADOS
        - PESSOA_FISICA
        - PESSOA_FISICA_EXTERIOR
        - PESSOA_JURIDICA
        - PESSOA_JURIDICA_EXTERIOR
        - PRIMEIRO_GRAU_BENS_DIREITOS_INTEGRANTES_PATRIMONIO_AFETACAO
        - PRIMEIRO_GRAU_IMOVEIS_RESIDENCIAIS
        - PRIMEIRO_GRAU_OUTROS
        - PROAGRO
        - PRODUTOS_AGROPECUARIOS_COM_WARRANT
        - PRODUTOS_AGROPECUARIOS_SEM_WARRANT
        - SBCE_SOCIEDADE_BRASILEIRA_CREDITO_EXPORTAÇÃO
        - SEGURO_RURAL
        - SEM_SUB_TIPO_GARANTIA
        - TRIBUTOS_RECEITAS_ORCAMENTARIAS
        - VEICULOS
        - VEICULOS_AUTOMOTORES
      example: NOTAS_PROMISSORIAS_OUTROS_DIREITOS_CREDITO
    UnarrangedAccountsOverdraftEnumWarrantyType:
      type: string
      description: 'Name/Identification of the type of the guarantee that secures the Modality of the Credit Operation contracted  (Doc 3040, Annex 12)'
      enum:
        - CESSAO_DIREITOS_CREDITORIOS
        - CAUCAO
        - PENHOR
        - ALIENACAO_FIDUCIARIA
        - HIPOTECA
        - OPERACOES_GARANTIDAS_PELO_GOVERNO
        - OUTRAS_GARANTIAS_NAO_FIDEJUSSORIAS
        - SEGUROS_ASSEMELHADOS
        - GARANTIA_FIDEJUSSORIA
        - BENS_ARRENDADOS
        - GARANTIAS_INTERNACIONAIS
        - OPERACOES_GARANTIDAS_OUTRAS_ENTIDADES
        - ACORDOS_COMPENSACAO
      example: CESSAO_DIREITOS_CREDITORIOS
    UnarrangedAccountsOverdraftChargeType:
      type: string
      description: Type of charge agreed in the contract.
      enum:
        - JUROS_REMUNERATORIOS_POR_ATRASO
        - MULTA_ATRASO_PAGAMENTO
        - JUROS_MORA_ATRASO
        - IOF_CONTRATACAO
        - IOF_POR_ATRASO
        - SEM_ENCARGO
        - OUTROS
      example: JUROS_REMUNERATORIOS_POR_ATRASO
    UnarrangedAccountsOverdraftFeeOverParcel:
      type: object
      required:
        - feeName
        - feeCode
        - feeAmount
      properties:
        feeName:
          type: string
          description: |
            Name of the Fee agreed.
          maxLength: 140
          pattern: '^[^\s](.*[^\s])?$'
          example: Saque a descoberto
        feeCode:
          type: string
          description: |
            Identifying acronym of the fee agreed.
          maxLength: 140
          pattern: '^[^\s](.*[^\s])?$'
          example: Saque descoberto
        feeAmount:
          type: string
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '100000.0400'
          description: |
            Monetary value of the fee agreed in the contract.

            Expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.
    UnarrangedAccountsOverdraftFinanceCharge:
      type: object
      required:
        - chargeType
      properties:
        chargeType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftChargeType'
        chargeAdditionalInfo:
          type: string
          pattern: '^[^\s](.*[^\s])?$'
          example: Informações adicionais sobre encargos.
          description: |
            Field for additional information.

            [Restriction] Mandatory if the 'OUTROS' option is selected in Type of charge agreed in the contract.
        chargeRate:
          type: string
          format: double
          pattern: '^\d{1}\.\d{6}$'
          maxLength: 8
          minLength: 8
          description: |
            Represents the value of the charge as a percentage agreed in the contract.

            The entry must respect 6 decimal places, even if they are filled with zeros(percentage representation e.g.: 0.150000. This value represents 15%. The value 1 represents 100%).
          example: '0.071200'
    UnarrangedAccountsOverdraftInstalmentsData:
      type: object
      description: Set of information relating to the remaining term and to the installments of an unarranged account overdraft credit operation
      required:
        - dueInstalments
        - pastDueInstalments
        - typeContractRemaining
        - typeNumberOfInstalments
        - paidInstalments
      properties:
        typeNumberOfInstalments:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumTypeNumberOfInstalments'
        totalNumberOfInstalments:
          type: number
          maximum: 999999
          example: 130632
          description: |
            Total Term according to the type (day, week, month, year) relating to the Credit Modality reported.

            [Restriction] It must mandatorily be filled if typeNumberOfInstalments is other than SEM_PRAZO_TOTAL.
        typeContractRemaining:
          type: string
          enum:
            - DIA
            - SEMANA
            - MES
            - ANO
            - SEM_PRAZO_REMANESCENTE
          description: |
            Type of remaining term of the contract relating to the reported credit modality.
        contractRemainingNumber:
          type: number
          maximum: 999999
          description: |
            Remaining Term according to the type (day, week, month, year) relating to the reported Credit Modality.

            [Restriction] It must mandatorily be filled in if the typeContractRemaining is different from SEM_PRAZO_REMANESCENTE.
          example: 80
        paidInstalments:
          type: number
          description: 'Number of installments paid. (In the case of modalities that do not have installments, the number of installments is equal to zero)'
          maximum: 999999
          example: 73
        dueInstalments:
          type: number
          maximum: 999999
          description: 'Number of installments due in the future.(In the case of modalities that do not have installments, the number of installments is equal to zero)'
          example: 57
        pastDueInstalments:
          type: number
          maximum: 999999
          description: 'Number of overdue installments. (In the case of modalities that do not have installments, the number of installments is equal to zero)'
          example: 73
        balloonPayments:
          type: array
          items:
            $ref: '#/components/schemas/UnarrangedAccountsOverdraftBalloonPayment'
          minItems: 1
          description: List that provides the due dates and the amount of the non-regular installments of the contract of the queried credit modality
    UnarrangedAccountsOverdraftPaymentsData:
      type: object
      description: Set of information relating to the payments made on an unarranged account overdraft credit operation
      required:
        - contractOutstandingBalance
        - releases
      properties:
        paidInstalments:
          type: number
          maximum: 999
          example: 73
          description: Total number of installments paid on the contract relating to the Credit Modality reported.
        contractOutstandingBalance:
          type: string
          minLength: 4
          maxLength: 21
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          example: '100000.0400'
          description: Amount necessary for the customer to settle the debt, that is, this field must be filled with the updated outstanding balance described in the DDC (Documento Descritivo de Crédito).
        releases:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/UnarrangedAccountsOverdraftReleases'
          description: List of the payments made in the period
    UnarrangedAccountsOverdraftReleases:
      type: object
      description: List of the payments made in the period
      required:
        - paymentId
        - isOverParcelPayment
        - paidDate
        - currency
        - paidAmount
      properties:
        paymentId:
          type: string
          maxLength: 100
          minLength: 1
          example: XlthLXpBLVowLTldW2EtekEtWjAtOVwtXXswLDk5fSQ
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          description: Code or unique identifier provided by the institution to represent the individual payment.
        isOverParcelPayment:
          type: boolean
          example: true
          description: Identifies whether it is an agreed payment (false) or a one-off payment (true).
        instalmentId:
          type: string
          maxLength: 100
          minLength: 1
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: WGx0aExYcEJMVm93TFRsZFcyRXRla0V0V2pBdE9Wd3RYWH
          description: |
            Installment identifier, under the responsibility of each transmitting institution.

            [Restriction] Information mandatory when isOverParcelPayment has the value FALSE.
        paidDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: 'Effective date of the payment relating to the contract of the credit modality queried, in accordance with the [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339) specification. e.g. 2014-03-19'
        currency:
          type: string
          maxLength: 3
          pattern: '^(\w{3}){1}$'
          example: BRL
          description: |
            Currency of the monetary value reported, according to the ISO-4217 model. e.g. 'BRL'.
            All monetary values reported are represented in the currency currently in force in Brazil.
        paidAmount:
          type: string
          maxLength: 21
          minLength: 4
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          example: '100000.0400'
          description: |
            Amount of the payment relating to the  contract of the credit modality queried.
            Expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.
        overParcel:
          type: object
          description: |
            Object of the fees and charges that were paid outside the installment.

            [Restriction] The information must be sent if it exists.
          required:
            - fees
            - charges
          properties:
            fees:
              type: array
              minItems: 0
              items:
                $ref: '#/components/schemas/UnarrangedAccountsOverdraftFeeOverParcel'
              description: 'List of the fees that were paid outside the installment, only for one-off payments.'
            charges:
              type: array
              minItems: 0
              items:
                $ref: '#/components/schemas/UnarrangedAccountsOverdraftChargeOverParcel'
              description: List of the charges that were paid outside the installment.
    UnarrangedAccountsOverdraftContractedFee:
      type: object
      required:
        - feeName
        - feeCode
        - feeChargeType
        - feeCharge
      properties:
        feeName:
          type: string
          maxLength: 140
          pattern: '^[^\s](.*[^\s])?$'
          description: Name of the Fee agreed
          example: Excesso em Conta
        feeCode:
          type: string
          maxLength: 140
          pattern: '^[^\s](.*[^\s])?$'
          description: Identifying acronym of the fee agreed
          example: EXCESSO_CONTA
        feeChargeType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumContractFeeChargeType'
        feeCharge:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumContractFeeCharge'
        feeAmount:
          type: string
          format: double
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: |
            Monetary value of the fee agreed in the contract.

            [Restriction] Mandatory when the form of charging is other than Percentage.
        feeRate:
          type: string
          pattern: '^\d{1}\.\d{6}$'
          format: double
          maxLength: 8
          minLength: 8
          description: |
            It is the value of the fee as a percentage agreed in the contract.

            [Restriction] Mandatory when the form of charging is Percentage.
          example: '0.062000'
    UnarrangedAccountsOverdraftContractedWarranty:
      type: object
      description: Set of information relating to the guarantees that secure the credit operation contracted
      required:
        - currency
        - warrantyAmount
        - warrantyType
        - warrantySubType
      properties:
        currency:
          type: string
          pattern: '^(\w{3}){1}$'
          maxLength: 3
          description: 'Currency relating to the amount of the guarantee, according to the ISO-4217 model. e.g. ''BRL''. All the reported monetary values are represented in the currency in force in Brazil'
          example: BRL
        warrantyType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumWarrantyType'
        warrantySubType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumWarrantySubType'
        warrantyAmount:
          description: |
            Original value of the guarantee. Expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.

            [Restriction] For cases in which warrantyType is equal to "GARANTIA_FIDEJUSSORIA" the value of the guarantee corresponds to a percentage of the total secured.
            Thus, the cases of personal (fidejussory) guarantee for which it is not possible to determine a monetary value for the guarantee must be filled with 0.00.
          type: string
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '100000.0400'
    UnarrangedAccountsOverdraftBalloonPayment:
      type: object
      description: List providing the due dates and amount of the non-regular installments  of the contract of the credit modality queried.
      required:
        - dueDate
        - amount
      properties:
        dueDate:
          type: string
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          description: 'Due date of the non-regular installment  falling due of the contract of the credit modality queried, in accordance with the [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339) specification. e.g. 2014-03-19'
          maxLength: 10
          example: '2020-01-10'
        amount:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftBalloonPaymentAmount'
    UnarrangedAccountsOverdraftChargeOverParcel:
      type: object
      description: List of the charges that were paid outside the installment.
      required:
        - chargeType
        - chargeAmount
      properties:
        chargeType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftChargeType'
        chargeAdditionalInfo:
          type: string
          pattern: '^[^\s](.*[^\s])?$'
          maxLength: 140
          example: Informações adicionais
          description: |
            Free field for filling in the additional information relating to the charge.
            [Restriction] Mandatory when chargeType is equal to 'OUTROS'.
        chargeAmount:
          description: Amount of the payment of the charge paid outside the installment. Expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.
          type: string
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '100000.0400'
    UnarrangedAccountsOverdraftContractData:
      type: object
      description: Set of information relating to the identification of the unarranged account overdraft credit operation
      required:
        - contractNumber
        - ipocCode
        - productName
        - productType
        - productSubType
        - contractDate
        - contractAmount
        - instalmentPeriodicity
        - amortizationScheduled
        - interestRates
        - contractedFees
        - contractedFinanceCharges
      properties:
        contractNumber:
          type: string
          maxLength: 100
          minLength: 1
          pattern: '^[\w\W]{1,100}$'
          example: '1324926521496'
          description: Contract number given by the contracting institution.
        ipocCode:
          type: string
          maxLength: 67
          minLength: 22
          pattern: '^[\w\W]{22,67}$'
          example: '92792126019929279212650822221989319252576'
          description: |
            Standardized contract number - IPOC (Standardized Identification of the Credit Operation). According to DOC 3040, composed of:
            - **CNPJ of the institution:** 8 (eight) initial positions;
            - **Modality of the operation:** 4 (four) positions;
            - **Type of the customer:** 1 (one) position( 1 = natural person - CPF, 2= legal entity – CNPJ, 3 = natural person abroad, 4 = legal entity abroad, 5 = natural person without a CPF and 6 = legal entity without a CNPJ);
            - **Code of the customer:** The number of positions varies according to the type of the customer:
              1. For natural person customers with a CPF (customer type = 1), report the 11 (eleven) positions of the CPF;
              2. For legal entity customers with a CNPJ (customer type = 2), report the 8 (eight) initial positions of the CNPJ;
              3. For the other customers (customer types 3, 4, 5 and 6), report 14 (fourteen) positions with a complement of zeros on the left if the identification is of a smaller size;
            - **Code of the contract:** 1 (one) up to 40 (forty) positions, without a complement of characters.
        productName:
          type: string
          maxLength: 140
          pattern: '^[^\s](.*[^\s])?$'
          example: AD
          description: |
            Name/Identification of the name of the Credit Operation Modality disclosed to the customer
        productType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftProductType'
        productSubType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftProductSubType'
        contractDate:
          description: |
            Contracting date of the credit operation. [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339) specification.
            For operations in which the unarranged account overdraft is made available to the customer from the opening of the account, use the account opening date as the contracting date.
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-01-05'
        disbursementDates:
          type: array
          minItems: 1
          description: |
            List providing the Disbursement Dates of the contracted amount.
          items:
            type: string
            format: date
            maxLength: 10
            pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
            example: '2018-01-15'
            description: |
              Disbursement Date of the contracted amount. [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339) specification.
              In the case of a release of funds made on D0 but with retroactive reference on D -1, the accounting-correct date would be D -1.
        settlementDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-01-15'
          description: |
            Settlement date of the operation.
        contractAmount:
          description: Contracted amount of the operation. Expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places. In cases where this value is not explicit in the product contract, send it as 0.00.
          type: string
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '100000.0400'
        currency:
          type: string
          pattern: '^(\w{3}){1}$'
          maxLength: 3
          description: |
            Currency of the guarantee amount, according to the ISO-4217 model. e.g. 'BRL'
            All monetary values reported are represented in the currency currently in force in Brazil
          example: BRL
        dueDate:
          type: string
          format: date
          maxLength: 10
          minLength: 2
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2028-01-15'
          description: |
            Final due date of the operation. [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339) specification.
            Not applicable for active contracts / Report the cancellation date for cancelled contracts.
        instalmentPeriodicity:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumContractInstalmentPeriodicity'
        instalmentPeriodicityAdditionalInfo:
          type: string
          pattern: '[\w\W\s]*'
          maxLength: 50
          example: Informações adicionais sobre periodicidade
          description: |
            Field to complement the information regarding the regular payment periodicity.

            [Restriction] Mandatory when the `instalmentPeriodicity` field is equal to `OUTROS`.
        firstInstalmentDueDate:
          type: string
          format: date
          maxLength: 10
          minLength: 2
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
          description: |
            Due date of the first principal installment
        CET:
          type: string
          pattern: '^\d{1,6}\.\d{6}$'
          format: double
          description: |
            CET – Total Effective Cost must be expressed in the form of an annual percentage rate and incorporates all charges and expenses levied on credit operations (interest rate, but also fees, taxes, insurance and other expenses charged).

            The entry must respect 6 decimal places, even if they are filled with zeros (percentage representation e.g.: 0.150000. This value represents 15%. The value 1 represents 100%).
          maxLength: 13
          minLength: 8
          example: '0.290000'
        amortizationScheduled:
          type: string
          description: |
            Amortization system (See Enum):
            - SAC (Constant Amortization System) - This is the one in which the amortization amount remains the same until the end. The interest charged on the installment plan is not included in this calculation.
            - PRICE (French Amortization System) - The installments are fixed from the beginning to the end of the contract. That is, all installments will have the same value, from the first to the last. In the first payments, the greater part of the installment amount corresponds to interest. Over time, the interest rate decreases. As the installment amount is fixed, as the installments go by, the amortization amount increases.
            - SAM (Mixed Amortization System) - Each installment (payment) is the arithmetic mean of the respective installments in the Price System and in the Constant Amortization System (SAC).
            - NO AMORTIZATION SYSTEM
          enum:
            - SAC
            - PRICE
            - SAM
            - SEM_SISTEMA_AMORTIZACAO
            - OUTROS
          example: SAC
        amortizationScheduledAdditionalInfo:
          type: string
          pattern: '[\w\W\s]*'
          maxLength: 200
          example: Informações complementares relativa à amortização do tipo 'OUTROS'
          description: |
            Field to complement the information regarding amortization.

            [Restriction] Mandatory when the `amortizationScheduled` field is equal to `OUTROS`.
        interestRates:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/UnarrangedAccountsOverdraftContractInterestRate'
          description: |
            Object that provides the set of information necessary to demonstrate the composition of the remunerative interest rates of the credit Modality.
            If the contract does not have interest rates, an empty list must be shared. If the contract has an interest rate with value 0, an object with the value 0 must be shared explicitly.
        contractedFees:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/UnarrangedAccountsOverdraftContractedFee'
          description: List providing the information on the fees agreed in the contract.
        contractedFinanceCharges:
          type: array
          minItems: 0
          description: List providing the charges agreed in the contract
          items:
            $ref: '#/components/schemas/UnarrangedAccountsOverdraftFinanceCharge'
        hasInsuranceContracted:
          type: boolean
          description: Field that identifies whether there is insurance contracted for the Unarranged Account Overdraft, where insurance contracted is true and not contracted is false. Not sending the field means that the institution does not offer this product.
    UnarrangedAccountsOverdraftContractInterestRate:
      type: object
      description: Object that provides the set of information necessary to demonstrate the composition of the remunerative interest rates of the credit Modality
      required:
        - taxType
        - interestRateType
        - taxPeriodicity
        - calculation
        - referentialRateIndexerType
      properties:
        taxType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumContractTaxType'
        interestRateType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumContractInterestRateType'
        taxPeriodicity:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumContractTaxPeriodicity'
        calculation:
          type: string
          description: Calculation basis
          enum:
            - 21/252
            - 30/360
            - 30/365
          example: 21/252
        referentialRateIndexerType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumContractReferentialRateIndexerType'
        referentialRateIndexerSubType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumContractReferentialRateIndexerSubType'
        referentialRateIndexerAdditionalInfo:
          type: string
          maxLength: 140
          pattern: '^[^\s](.*[^\s])?$'
          example: Informações adicionais
          description: |
            Free field to complement the information relating to the Type of reference rate or indexer.
            [Restriction] Mandatory to complement the information relating to the Type of reference rate or indexer, when the type or subtype OUTRO is selected.
        preFixedRate:
          type: string
          format: double
          pattern: '^\d{1,2}\.\d{6}$'
          maxLength: 9
          minLength: 8
          description: |
            Fixed rate applied under the credit modality contract. e.g. 0.014500. The entry must respect 6 decimal places, even if they are filled with zeros(percentage representation e.g.: 0.150000. This value represents 15%. The value 1 represents 100%).

            [Restriction] This field is mandatory if the `postFixedRate` field is not sent.
          example: '0.600000'
        postFixedRate:
          type: string
          format: double
          pattern: '^\d{1,2}\.\d{6}$'
          maxLength: 9
          minLength: 8
          description: |
            Post-fixed rate applied under the credit modality contract. e.g. 0.0045. The value must be filled in respecting the 6 decimal places, even if they are filled with zeros (percentage representation e.g.: 0.1500. This value represents 15%. The value 1 represents 100%).

            [Restriction] This field is mandatory if the `preFixedRate` field is not sent.
          example: '0.550000'
        additionalInfo:
          type: string
          maxLength: 1200
          pattern: '^[^\s](.*[^\s])?$'
          example: Informações adicionais
          description: |
            Text with additional information about the composition of the agreed interest rates.

            [Restriction] If the institution has the information available for sharing, it must be provided.
    UnarrangedAccountsOverdraftBalloonPaymentAmount:
