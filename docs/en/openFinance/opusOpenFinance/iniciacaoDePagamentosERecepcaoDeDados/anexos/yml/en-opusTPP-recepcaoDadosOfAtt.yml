    ExchangesResponseOperationList:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/ExchangesProductList'
        links:
          $ref: '#/components/schemas/ExchangesLinks'
        meta:
          $ref: '#/components/schemas/ExchangesMeta'
      additionalProperties: false
    ExchangesProductList:
      type: object
      description: List of foreign exchange transactions
      required:
        - brandName
        - companyCnpj
        - operationId
      properties:
        brandName:
          type: string
          description: 'Name of the Brand reported by the participant in Open Finance. It is recommended to use, whenever possible, the same brand name assigned in the directory field Customer Friendly Server Name (Authorisation Server). Institution authorised to operate'
          pattern: '[\w\W\s]*'
          example: Organização A
          maxLength: 80
        companyCnpj:
          type: string
          description: 'Complete CNPJ record of the institution responsible for the Registry - the CNPJ corresponds to the alphanumeric representation of the registration in the Legal Entity Registry (Cadastro de Pessoa Jurídica). Only the CNPJ characters must be provided, without a mask.'
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '21128159000166'
        operationId:
          type: string
          description: 'Uniquely identifies  the customer''s relationship with the product, maintaining the immutability rules within the transmitting institution.'
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: '92792126019929240'
      additionalProperties: false
    ExchangesResponseOperationDetails:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          $ref: '#/components/schemas/ExchangesOperationDetails'
        links:
          $ref: '#/components/schemas/ExchangesLinksOperationId'
        meta:
          $ref: '#/components/schemas/ExchangesMetaOperationId'
    ExchangesOperationDetails:
      type: object
      description: Details of the foreign exchange transaction.
      required:
        - authorizedInstitutionCnpjNumber
        - authorizedInstitutionName
        - operationType
        - operationDate
        - dueDate
        - localCurrencyOperationTax
        - localCurrencyOperationValue
        - foreignOperationValue
        - deliveryForeignCurrency
        - operationCategoryCode
      properties:
        authorizedInstitutionCnpjNumber:
          type: string
          description: CNPJ of the institution authorised to operate in the foreign exchange market.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '11225860000140'
        authorizedInstitutionName:
          type: string
          description: Name of the Financial Institution in Brazil.
          maxLength: 250
          pattern: '[\w\W\s]*'
          example: AGENCIA CORRETORA
        intermediaryInstitutionCnpjNumber:
          type: string
          description: |
            CNPJ of the intermediary institution authorised to operate in the foreign exchange market.
            Field whose submission is mandatory in cases where there is an intermediary institution.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '11225860000140'
        intermediaryInstitutionName:
          type: string
          description: |
            Name of the intervening broker authorised to operate in the foreign exchange market.

            [Restriction] Field that must be filled in by the participants when the field 'intermediaryInstitutionCnpjNumber' is reported.
          maxLength: 250
          pattern: '[\w\W\s]*'
          example: AGENCIA CORRETORA
        operationNumber:
          type: string
          description: Registration number of the transaction at Bacen. It must be filled in when sharing, after registration in the Sistema de Câmbio and once the number is available at the transmitting/account holder institution.
          maxLength: 12
          pattern: '^\d{12}$'
          example: '393874649456'
        operationType:
          $ref: '#/components/schemas/ExchangesEnumOperationType'
        operationDate:
          type: string
          format: date-time
          description: Date of the closing of the foreign exchange contract.
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2023-03-07T08:30:00Z'
        dueDate:
          type: string
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          description: Date on which the transaction (purchase or sale) is expected to be settled.
          maxLength: 10
          example: '2018-02-15'
        localCurrencyOperationTax:
          type: object
          description: Value of the exchange rate applied to this contract, in national currency.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Amount related to the object.
              maxLength: 31
              pattern: '^\d{1,15}\.\d{1,15}$'
              example: '1.3'
            currency:
              type: string
              description: Currency of the monetary value, following the ISO-4217 model.
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        localCurrencyOperationValue:
          type: object
          description: Amount traded in national currency.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Amount related to the object.
              maxLength: 20
              pattern: '^\d{1,17}\.\d{2}$'
              example: '1000.04'
            currency:
              type: string
              description: Currency of the monetary value, following the ISO-4217 model.
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        foreignOperationValue:
          type: object
          description: Amount of the transaction in foreign currency.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Amount related to the object.
              maxLength: 20
              pattern: '^\d{1,17}\.\d{2}$'
              example: '1000.04'
            currency:
              type: string
              description: Currency of the monetary value, following the ISO-4217 model.
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: USD
        operationOutstandingBalance:
          type: object
          description: Amount of the balance of the transaction to be settled in foreign currency. Object whose submission is mandatory in the case of foreign exchange transactions with future settlement.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Amount related to the object.
              maxLength: 20
              pattern: '^\d{1,17}\.\d{2}$'
              example: '1000.04'
            currency:
              type: string
              description: Currency of the monetary value, following the ISO-4217 model.
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        vetAmount:
          type: object
          description: Represents the cost of a foreign exchange transaction in reais per unit of foreign currency, encompassing the exchange rate, the charges and the taxes levied on that transaction. Field whose submission is mandatory in spot foreign exchange transactions up to the limit of US$100,000 or the equivalent in other currencies.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Amount related to the object.
              maxLength: 31
              pattern: '\d{1,15}\.\d{1,15}$'
              example: '1000.000004'
            currency:
              type: string
              description: Currency of the monetary value, following the ISO-4217 model.
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        localCurrencyAdvancePercentage:
          type: string
          description: |
            Percentage of the foreign currency amount granted to the customer in advance. e.g. 0.014500.

            The filling in must respect the 6 decimal places, even if they come filled in with zeros(percentage representation e.g.: 0.150000. This value represents 15%. The value 1 represents 100%). Fields whose submission is mandatory in the case of foreign exchange transactions with future settlement.
          pattern: '^\d{1}\.\d{1,6}$'
          maxLength: 8
          minLength: 3
          example: '0.12'
        deliveryForeignCurrency:
          $ref: '#/components/schemas/ExchangesEnumDeliveryForeignCurrency'
        operationCategoryCode:
          type: string
          maxLength: 5
          pattern: '^\d{5}$'
          description: Code of the nature-fact of the closing of the transaction. It must comply with the nature codes referenced in Resolution 277 or in Circular 3690, as applicable to the foreign exchange contract.
          example: '90302'
      additionalProperties: false
    ExchangesResponseEvents:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/ExchangesEvents'
        links:
          $ref: '#/components/schemas/ExchangesLinks'
        meta:
