    CustomersPersonalIdentificationData:
      type: object
      description: Set of information relating to Identification, that is, the action and the effect of uniquely identifying the natural person through their customer registration data.
      required:
        - updateDateTime
        - personalId
        - brandName
        - civilName
        - birthDate
        - documents
        - hasBrazilianNationality
        - contacts
        - companiesCnpj
      properties:
        updateDateTime:
          type: string
          maxLength: 20
          format: date-time
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2021-05-21T08:30:00Z'
          description: |
            Date and time of the update of the \<_endpoint_\> fields, in accordance with the RFC-3339 specification, UTC format. When there is no date specifically linked to the block, assume the date and time of the update of the registration as a whole.
        personalId:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          maxLength: 100
          minLength: 1
          description: A unique and immutable identifier used to identify the natural person customer resource. This identifier has no meaning for the customer who gave the consent
          example: 578-psd-71md6971kjh-2d414
        brandName:
          type: string
          maxLength: 80
          pattern: '[\w\W\s]*'
          example: Organização A
          description: 'Name of the Brand reported by the participant in Open Finance. It is recommended to use, whenever possible, the same brand name assigned in the directory field Customer Friendly Server Name (Authorisation Server).'
        civilName:
          type: string
          maxLength: 70
          pattern: '^[\w\W]*$'
          example: Juan Kaique Cláudio Fernandes
          description: |
            Full civil name of the natural person (A fundamental right of the person, the civil name is the one assigned to the natural person from the registration of their birth, by which they will be identified throughout their life, as well as after their death).

            If the civil name informed exceeds the limit of 70 characters, the first and last names must be kept complete, carrying out progressive abbreviation of the middle names (reducing them to their respective initials, followed by a period), until the name fits the defined limit.
            If an excess persists after the abbreviation of all the middle names, apply simple truncation at the end of the field in order to respect the maximum limit. Do not use ellipsis.
        socialName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Jaqueline de Freitas
          description: 'Social name of the natural person, if any. (the name by which transvestites and transsexuals recognize themselves, as well as are identified by their community and in their social environment, in accordance with Local Decree)'
        birthDate:
          type: string
          maxLength: 10
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '1989-03-23'
          description: 'Date of birth, in accordance with the RFC-3339 specification'
        maritalStatusCode:
          $ref: '#/components/schemas/CustomersEnumMaritalStatusCode'
        maritalStatusAdditionalInfo:
          type: string
          pattern: '[\w\W\s]*'
          maxLength: 50
          example: Amasiado
          description: |
            Free field to supplement the information relating to marital status.

            [Restriction] Mandatory when the type 'OUTRO' is selected.
        sex:
          $ref: '#/components/schemas/CustomersEnumSex'
        companiesCnpj:
          type: array
          minItems: 1
          items:
            type: string
            pattern: '^[0-9A-Z]{12}[0-9]{2}$'
            maxLength: 14
          example:
            - '01773247000103'
            - '01773247000563'
          description: |
            Full alphanumeric representation of the CNPJ of the institution responsible for the Registration - the CNPJ corresponds to the alphanumeric representation of the enrollment in the Legal Entity Registry.
            Only the characters of the CNPJ must be present, without a mask.
        documents:
          $ref: '#/components/schemas/CustomersPersonalDocument'
        otherDocuments:
          type: array
          items:
            $ref: '#/components/schemas/CustomersPersonalOtherDocument'
          minItems: 1
          description: List of the other documents
        hasBrazilianNationality:
          type: boolean
          example: false
          description: Informs whether the Customer has Brazilian nationality.
        nationality:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CustomersNationality'
        filiation:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - type
              - civilName
            properties:
              type:
                $ref: '#/components/schemas/CustomersEnumFiliationType'
              civilName:
                type: string
                maxLength: 70
                pattern: '^[\w\W]*$'
                example: Marcelo Cláudio Fernandes
                description: |
                  Full civil name of the natural person (A fundamental right of the person, the civil name is the one assigned to the natural person from the registration of their birth, by which they will be identified throughout their life, as well as after their death).

                  If the civil name informed exceeds the limit of 70 characters, the first and last names must be kept complete, carrying out progressive abbreviation of the middle names (reducing them to their respective initials, followed by a period), until the name fits the defined limit.
                  If an excess persists after the abbreviation of all the middle names, apply simple truncation at the end of the field in order to respect the maximum limit. Do not use ellipsis.
              socialName:
                type: string
                maxLength: 70
                pattern: '^[\w\W]*$'
                description: |
                  Social name of the natural person, if any.
                  (the name by which transvestites and transsexuals recognize themselves,
                  as well as are identified by their community and in their social environment, in accordance with Local Decree).
        contacts:
          $ref: '#/components/schemas/CustomersPersonalContacts'
    CustomersPersonalDocument:
      type: object
      description: Object grouping information relating to Documents of the natural person
      properties:
        cpfNumber:
          type: string
          maxLength: 11
          pattern: '^\d{11}$'
          example: '25872252137'
          description: |
            Full CPF number.
            Attribute that corresponds to the minimum information required by the Regulation in force.
            The CPF is the Natural Person Registry. It is a document issued by the Receita Federal and serves to identify taxpayers. The CPF is a numbering with 11 digits, which only change by court decision. The document is issued by the receita federal.

            [Restriction] Mandatory when the passport is not informed.
        passport:
          $ref: '#/components/schemas/CustomersPersonalPassport'
    CustomersPersonalPassport:
      type: object
      description: |
        Document granted to travellers by a national administrative authority in order to certify their identity before foreign authorities.

        [Restriction] Applicable only to the Natural person resident abroad who is exempt from enrollment in the CPF.

        [Restriction] Mandatory when the cpfNumber is not informed.
      required:
        - number
        - country
      properties:
        number:
          type: string
          maxLength: 20
          pattern: '^[\w\W]*$'
          example: '75253468744594820620'
          description: |
            Passport number.
        country:
          type: string
          maxLength: 3
          pattern: '^(\w{3}){1}$'
          example: CAN
          description: |
            Country of issue of the passport. Country code in accordance with the 'alpha3' code of ISO-3166.
        expirationDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: |
            Passport validity date, in accordance with the RFC-3339 specification.
        issueDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: |
            Passport issue date, in accordance with the RFC-3339 specification.
    CustomersPersonalOtherDocument:
      type: object
      required:
        - type
        - number
      properties:
        type:
          $ref: '#/components/schemas/CustomersEnumPersonalOtherDocumentType'
        typeAdditionalInfo:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: CREA-RJ
          description: Free field, mandatory if the OUTROS option of document types is selected
        number:
          type: string
          maxLength: 40
          pattern: '[\w\W\s]*'
          example: '15291908'
          description: Identification/Number of the informed document
        checkDigit:
          type: string
          maxLength: 2
          pattern: '[\w\W\s]*'
          example: P
          description: Check digit of the informed document. Mandatory if the informed document has a check digit
        additionalInfo:
          type: string
          maxLength: 50
          pattern: '[\w\W\s]*'
          example: SSP/SP
          description: |
            For documents to which the use of the place of issue applies, it must be sent mandatorily, with the information of the issuing body and UF. Example: RG, place of issue: SSP/RS.
            [Restriction] Mandatory when the Place of Issue of the Document is relevant.
        expirationDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: 'Expiry date of the informed document, in accordance with the RFC-3339 specification.'
    CustomersEnumPersonalOtherDocumentType:
      type: string
      enum:
        - CNH
        - RG
        - NIF
        - RNE
        - OUTROS
      description: |
        List of the Codes of the other natural person documents.
    CustomersNationality:
      type: object
      description: Object that groups information relating to the nationality of the Natural Person
      required:
        - otherNationalitiesInfo
        - documents
      properties:
        otherNationalitiesInfo:
          type: string
          pattern: '^\S[\s\S]*$'
          maxLength: 40
          example: CAN
          description: |
            Mandatory field if the customer does not have Brazilian nationality. Fill in indicating all their other nationalities using the country code in accordance with the alpha3 code of ISO-3166.e.g.'CAN'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/CustomersNationalityOtherDocument'
          description: List that provides the relation of complementary documents of persons with a nationality other than Brazilian
    CustomersNationalityOtherDocument:
      type: object
      required:
        - type
        - number
      properties:
        type:
          type: string
          maxLength: 10
          pattern: '[\w\W\s]*'
          description: 'Document type. Free field, mandatory when the nationality is other than Brazilian. Inform the type and number of the document, in addition to the validity and other complementary information in order to identify the document of a foreign person'
          example: SOCIAL SEC
        number:
          type: string
          maxLength: 40
          pattern: '[\w\W\s]*'
          description: 'Identification number of the document. Free field, mandatory when the nationality is other than Brazilian. Inform the number of the document and other complementary information in order to identify the document of a foreign person'
          example: '423929299'
        expirationDate:
          description: 'Expiry date of the informed document, in accordance with the RFC-3339 specification.'
          type: string
          maxLength: 10
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
        issueDate:
          description: 'Issue date of the document, in accordance with the RFC-3339 specification.'
          type: string
          maxLength: 10
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
        country:
          type: string
          maxLength: 80
          pattern: '[\w\W\s]*'
          example: Brasil
          description: |
            Name of the country.
        additionalInfo:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          description: Free field to be filled in when necessary.
          example: Informações adicionais.
    CustomersEnumFiliationType:
      type: string
      enum:
        - MAE
        - PAI
      example: PAI
      description: Type of parentage.
    CustomersPersonalContacts:
      type: object
      description: |
        Set of information regarding the ways to contact the customer.
        The data of this field are mandatory to send. They must only not be sent if the institution does not have them.
      required:
        - postalAddresses
        - phones
        - emails
      properties:
        postalAddresses:
          type: array
          items:
            $ref: '#/components/schemas/CustomersPersonalPostalAddress'
          minItems: 0
          description: List of addresses of the natural person
        phones:
          type: array
          items:
            $ref: '#/components/schemas/CustomersCustomerPhone'
          minItems: 0
          description: List with contact telephone numbers of the natural person
        emails:
          type: array
          items:
            $ref: '#/components/schemas/CustomersCustomerEmail'
          minItems: 0
          description: List of contact e-mails
    CustomersPersonalPostalAddress:
      type: object
      required:
        - isMain
        - address
        - townName
        - postCode
        - country
      properties:
        isMain:
          type: boolean
          example: true
          description: Indicates whether the informed address is the main one.
        address:
          type: string
          maxLength: 150
          pattern: '[\w\W\s]*'
          example: 'Av Naburo Ykesaki, 1270'
          description: Corresponds to the residential address of the customer.
        additionalInfo:
          type: string
          maxLength: 30
          pattern: '[\w\W\s]*'
          example: Fundos
          description: Some street addresses still need to be specified by means of a complement.
        districtName:
          type: string
          maxLength: 50
          pattern: '[\w\W\s]*'
          example: Centro
          description: |
            A district is a community or region located in a city or municipality in accordance with its geographical subdivisions.
            [Restriction] Mandatory, if any.
        townName:
          type: string
          maxLength: 50
          pattern: '[\w\W\s]*'
          example: Marília
          description: |
            Locality: The name of the locality corresponds to the designation of the city or municipality in which the address is located.
        ibgeTownCode:
          type: string
          pattern: '\d{7}$'
          maxLength: 7
          example: '3550308'
          description: 'IBGE Municipality Code. The IBGE Table of Municipality Codes presents the list of Brazilian municipalities associated with a code composed of 7 digits, the first two referring to the code of the Federative Unit.'
        countrySubDivision:
          $ref: '#/components/schemas/CustomersEnumCountrySubDivision'
        postCode:
          type: string
          pattern: '^\d{8}$'
          maxLength: 8
          example: '17500001'
          description: |
            Postal Address Code: Composed of a numeric set of eight digits, the main objective of the CEP is to guide and speed up the forwarding, the handling and the delivery of items posted at the Correios, by means of its assignment to localities, street addresses, Correios units, services, public bodies, companies and buildings. e.g. '01311000'.
        country:
          type: string
          maxLength: 80
          pattern: '[\w\W\s]*'
          example: Brasil
          description: Name of the country
        countryCode:
          type: string
          pattern: '^([A-Z]{3})$'
          maxLength: 3
          example: BRA
          description: Country code in accordance with the ISO-3166 alpha3 code.
        geographicCoordinates:
          $ref: '#/components/schemas/CustomersGeographicCoordinates'
    CustomersEnumCountrySubDivision:
      type: string
      description: 'Enumeration referring to each federative unit abbreviation that identifies the state or the federal district in which the address is located. e.g. ''AC''. Only the abbreviations for Brazilian states are considered'
      enum:
        - AC
        - AL
        - AP
        - AM
        - BA
        - CE
        - DF
        - ES
        - GO
        - MA
        - MT
        - MS
        - MG
        - PA
        - PB
        - PR
        - PE
        - PI
        - RJ
        - RN
        - RS
        - RO
        - RR
        - SC
        - SP
        - SE
        - TO
      example: SP
    CustomersGeographicCoordinates:
      type: object
      description: 'Set of information corresponding to the values of the geographic coordinates in decimal degrees, in the WGS84 reference system'
      required:
        - latitude
        - longitude
      properties:
        latitude:
          description: |
            Latitude information for the geolocation provided. Between -90 and 90.e.g. '-23.5475000'. (2 digits before the comma, 11 positions)
          type: string
          pattern: '^-?\d{1,2}\.\d{1,9}$'
          maxLength: 13
          example: '-23.5475000'
        longitude:
          description: |
            Longitude information for the geolocation provided. Between -180 and 180. e.g '-46.6361100'. (3 digits before the comma, 11 positions)
          type: string
          pattern: '^-?\d{1,3}\.\d{1,8}$'
          maxLength: 13
          example: '-46.6361100'
    CustomersCustomerPhone:
      type: object
      required:
        - isMain
        - type
        - areaCode
        - number
      properties:
        isMain:
          type: boolean
          description: Indicates whether the phone number provided is the main one
          example: true
        type:
          $ref: '#/components/schemas/CustomersEnumCustomerPhoneType'
        additionalInfo:
          type: string
          description: 'Additional information regarding the selected phone type. [Restriction] Mandatory when the ''OUTRO'' type is selected.'
          pattern: '[\w\W\s]*'
          maxLength: 70
          example: Informações adicionais.
        countryCallingCode:
          type: string
          maxLength: 4
          pattern: '^\d{1,4}$'
          example: '55'
          description: |
            DDI (International Direct Dialing) number for the phone used to reach the Customer - if any

            [Restriction] Completion is mandatory when it is different from 55.
        areaCode:
          $ref: '#/components/schemas/CustomersAreaCode'
        number:
          type: string
          maxLength: 13
          pattern: '^([0-9]{6,13})$'
          example: '29875132'
          description: Customer phone number
        phoneExtension:
          type: string
          maxLength: 5
          pattern: '^\d{1,5}$'
          description: Extension number. Mandatory if it is part of the identification of the phone number provided
          example: '932'
    CustomersEnumCustomerPhoneType:
      type: string
      description: Identification of the Customer phone Type.
      enum:
        - FIXO
        - MOVEL
        - OUTRO
      example: FIXO
    CustomersAreaCode:
      type: string
      example: '19'
      description: DDD (Direct Distance Dialing) number of the customer's phone - if any
      maxLength: 3
      minLength: 2
      pattern: ^(\d{2,3})$
    CustomersCustomerEmail:
      type: object
      required:
        - isMain
        - email
      properties:
        isMain:
          type: boolean
          description: Indicates whether the email provided is the main one
          example: true
        email:
          type: string
          format: email
          description: Email address
          maxLength: 320
          example: karinafernandes-81@br.inter.net
    CustomersEnumMaritalStatusCode:
      type: string
      enum:
        - SOLTEIRO
        - CASADO
        - VIUVO
        - SEPARADO_JUDICIALMENTE
        - DIVORCIADO
        - UNIAO_ESTAVEL
        - OUTRO
      example: OUTRO
      description: |
        Marital status of the customer.
    CustomersEnumSex:
      type: string
      enum:
        - FEMININO
        - MASCULINO
        - OUTRO
      example: FEMININO
      description: |
        "Set of anatomophysiological characteristics that distinguish men and women: Male sex; female sex".
        Where it is neither female nor male it is classified as 'OUTRO'
    CustomersPersonalQualificationData:
      type: object
      description: 'Set of information regarding the qualification process. Qualification is understood as the information that allows institutions to appraise, assess, characterize and classify the customer in order to know their risk profile and their economic and financial capacity'
      required:
        - updateDateTime
        - companyCnpj
      properties:
        updateDateTime:
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
          description: |
            Date and time of the update of the \<_endpoint_\> fields, in accordance with the RFC-3339 specification, UTC format. When there is no date specifically linked to the block, assume the date and time of the update of the registration as a whole.
        companyCnpj:
          type: string
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          maxLength: 14
          example: '50685362000135'
          description: |
            Complete alphanumeric representation of the CNPJ of the institution responsible for the Registry - the CNPJ corresponds to the alphanumeric representation of the enrollment in the Legal Entity Registry. Only the characters of the CNPJ must be provided, without a mask.
        occupationCode:
          $ref: '#/components/schemas/CustomersEnumOccupationMainCodeType'
        occupationDescription:
          type: string
          maxLength: 100
          pattern: '[\w\W\s]*'
          example: '01'
          description: |
            Free-text field to provide the occupation code or a description of the occupation. When filling in the field, pay attention to the following points:
            - When the `occupationCode` option `RECEITA_FEDERAL` or `CBO` is selected, provide the code from that standardized list;
            - If `occupationCode` `OUTRO` is selected, provide the description of the occupation when the FI does not follow the standardized list of the Receita Federal nor that of the CBO;
            - When sending the standardized Receita Federal and CBO code, provide only the code as it appears in the corresponding lists.

            [Restriction] This field is mandatory when the `/data/occupationCode` field is sent.
        informedIncome:
          $ref: '#/components/schemas/CustomersInformedIncome'
        informedPatrimony:
          $ref: '#/components/schemas/CustomersPersonalInformedPatrimony'
        employers:
          type: array
          description: List of employers linked to the customer according to the records of the transmitting institution.
          minItems: 1
          items:
            type: object
            properties:
              cnpjCpf:
                type: string
                description: Enrollment number (CPF/CNPJ) of the employer with which the customer has an employment relationship.
                pattern: '^([0-9]{11}|[0-9A-Z]{12}[0-9]{2})$'
                example: '30386566000164'
              name:
                type: string
                description: Name of the employer or corporate name of the employer with which the customer has an employment relationship.
                pattern: '^[^\s](.*[^\s])?$'
                example: 'Organização A'
    CustomersEnumOccupationMainCodeType:
      type: string
      enum:
        - RECEITA_FEDERAL
        - CBO
        - OUTRO
      example: RECEITA_FEDERAL
      description: |
        Provides the list of codes relating to the occupation.
    CustomersInformedIncome:
      type: object
      required:
        - frequency
        - amount
        - date
      properties:
        frequency:
          $ref: '#/components/schemas/CustomersEnumInformedIncomeFrequency'
        amount:
          $ref: '#/components/schemas/CustomersInformedIncomeAmount'
        date:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: 'Income date, in accordance with the RFC-3339 specification.'
    CustomersEnumInformedIncomeFrequency:
      type: string
      enum:
        - DIARIA
        - SEMANAL
        - QUINZENAL
        - MENSAL
        - BIMESTRAL
        - TRIMESTRAL
        - SEMESTRAL
        - ANUAL
        - OUTROS
      description: Provides the frequency or period of the income provided.
    CustomersInformedIncomeAmount:
      type: object
      required:
        - amount
        - currency
      description: Total amount of the income provided
      properties:
        amount:
          description: |
            Total amount of the income provided. Expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.
            Primary income indicates the amounts payable or receivable in exchange for the temporary use of financial resources, labor or non-produced non-financial assets, namely, compensation of employees, investment income and other primary income.
            The first comprises the compensation of salaried work (wages and salaries); the second, direct investment income, portfolio investment income, income from other investments and income from reserve assets; and the third, taxes on production and imports, subsidies and rents.
            Source: Central Bank of Brazil – Economic Department
          type: string
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '100000.0400'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          description: 'Currency of the monetary value, following the ISO-4217 model.'
          example: BRL
    CustomersPersonalInformedPatrimony:
      type: object
      required:
        - amount
        - year
      properties:
        amount:
          $ref: '#/components/schemas/CustomersInformedPatrimonyAmount'
        year:
          type: number
          maximum: 9999
          example: 2010
          description: 'Reference year of the Income, in accordance with the RFC-3339 specification.'
    CustomersInformedPatrimonyAmount:
      type: object
      required:
        - amount
        - currency
      description: Amount of the net worth provided
      properties:
        amount:
          description: |
            Amount of the net worth provided. Expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.
            Net worth is the set of assets linked to a person or to an entity.
          type: string
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '100000.0400'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          description: 'Currency of the monetary value, following the ISO-4217 model.'
          example: BRL
    CustomersPersonalFinancialRelationData:
      type: object
      description: 'Object that gathers the information regarding the customer''s relationship with the Institution. Relationship is understood as the information that allows knowing since when the person queried has been a customer of the institution, as well as an indicator of the products and services they currently consume and their representatives'
      required:
        - updateDateTime
        - startDate
        - productsServicesType
        - accounts
        - procurators
      properties:
        updateDateTime:
          type: string
          format: date-time
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2021-05-21T08:30:00Z'
          description: |
            Date and time of the update of the \<_endpoint_\> fields, in accordance with the RFC-3339 specification, UTC format. When there is no date specifically linked to the block, assume the date and time of the update of the registration as a whole.
        startDate:
          type: string
          format: date-time
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2021-05-21T08:30:00Z'
          description: Start date of the relationship with the Financial Institution. It must provide the lowest value between the information reported to BACEN through DOC 3040 and CCS.
        productsServicesType:
          type: array
          items:
            $ref: '#/components/schemas/CustomersEnumProductServiceType'
          minItems: 1
          maxItems: 12
        productsServicesTypeAdditionalInfo:
          type: string
          pattern: '^[\w\W]*$'
          maxLength: 100
          example: Informações adicionais do tipo de serviço.
          description: |
            Additional information on the service type.
            [Restriction] Mandatory field when productsServicesType is 'OUTROS'.
        procurators:
          type: array
          items:
            $ref: '#/components/schemas/CustomersPersonalProcurator'
          minItems: 0
          description: |
            List of representatives.
            [Restriction] Mandatory if there is a representative.
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/CustomersPersonalAccount'
          minItems: 0
          description: |
            List of demand deposit, savings and prepaid payment accounts held by the customer at the transmitting institution.
        portabilitiesReceived:
          type: array
          items:
            $ref: '#/components/schemas/CustomersPortabilitiesReceived'
          minItems: 1
          description: |
            List of employer information received through salary portability requested by the customer of the transmitting institution from the institution(s) holding their salary account, active or that have already been active,. Each link is associated with a salary portability received by the transmitting institution.

            Note: portability is not explicitly terminated, that is, the FI to which the salary was ported is not notified when the salary account is closed or the salary is ported to another FI. It is not possible to guarantee that the data provided relates to an active portability, nor that the link with the payroll bank still exists. The transmitting institution will have such information only when the portability request has been made through its channels.
        paychecksBankLink:
          type: array
          items:
            $ref: '#/components/schemas/CustomersPaychecksBankLink'
          minItems: 1
          description: |
            List of salary account information related to employment relationships, existing or that have already existed, entered into between the natural person customer and one or more employers. Each link is associated with an open salary account held at the payroll bank (transmitting institution).

            Note: since former employers may not have requested the closing of the salary account, it is not possible to guarantee that the data provided relates to the current employer.
    CustomersEnumProductServiceType:
      type: string
      enum:
        - CONTA_DEPOSITO_A_VISTA
        - CONTA_POUPANCA
        - CONTA_PAGAMENTO_PRE_PAGA
        - CARTAO_CREDITO
        - OPERACAO_CREDITO
        - SEGURO
        - PREVIDENCIA
        - INVESTIMENTO
        - OPERACOES_CAMBIO
        - CONTA_SALARIO
        - CREDENCIAMENTO
        - OUTROS
      example: SEGURO
      description: List with the relation of products and services with a current contract.
    CustomersPersonalProcurator:
      type: object
      required:
        - type
        - cpfNumber
        - civilName
      properties:
        type:
          $ref: '#/components/schemas/CustomersEnumProcuratorsTypePersonal'
        cpfNumber:
          type: string
          maxLength: 11
          pattern: '^\d{11}$'
          example: '73677831148'
          description: 'Complete CPF number. The CPF is the Natural Person Registry. It is a document made by the Receita Federal and serves to identify taxpayers. The CPF is a numbering with 11 digits, which only change by court decision. The document is issued by the receita federal'
        civilName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Elza Milena Stefany Teixeira
          description: |
            Full civil name of the natural person (A fundamental right of the person, the civil name is the one assigned to the natural person from the registration of their birth, by which they will be identified throughout their life, as well as after their death).

            If the civil name informed exceeds the limit of 70 characters, the first and last names must be kept complete, carrying out progressive abbreviation of the middle names (reducing them to their respective initials, followed by a period), until the name fits the defined limit.
            If an excess persists after the abbreviation of all the middle names, apply simple truncation at the end of the field in order to respect the maximum limit. Do not use ellipsis.
        socialName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Carlos
          description: 'Social name of the natural person, if any. (the name by which transvestites and transsexuals recognize themselves, as well as are identified by their community and in their social environment, in accordance with Decree No. 51,180 of January 14, 2010)'
    CustomersEnumProcuratorsTypePersonal:
      type: string
      enum:
        - REPRESENTANTE_LEGAL
        - PROCURADOR
      example: PROCURADOR
      description: |
        Type of representative.
        Legal representative - Complete Civil Name of the Natural Person who represents an entity or a company and is appointed in its constitutive act, that is, in the articles of association or bylaws.
        Attorney-in-fact - is any person who represents the Natural Person in some business, through written authorization from them.
    CustomersPersonalAccount:
      type: object
      description: |
        List of demand deposit, savings and prepaid payment accounts held by the customer at the transmitting institution and for which they have provided consent
      required:
        - compeCode
        - number
        - checkDigit
        - type
        - subtype
      properties:
        compeCode:
          type: string
          maxLength: 3
          pattern: '^\d{3}$'
          description: 'Identifier code assigned by the Central Bank of Brazil to the institutions participating in the STR (Reserves Transfer System).The Compe (Clearing System for Checks and Other Papers) is a system that identifies and processes bank clearings. It is represented by a three-digit code that serves as a bank identifier, and thus each banking institution has a unique number'
          example: '001'
        branchCode:
          type: string
          maxLength: 4
          pattern: '^\d{4}$'
          description: |
            Code of the Branch holding the account. (A branch is the facility intended for serving customers, the general public and the members of credit unions, in the exercise of the institution's activities, and it may not be mobile or transitory)
            [Restriction] It must mandatorily be filled in when the "type" field is different from prepaid account.
          example: '6272'
        number:
          type: string
          maxLength: 20
          pattern: '^\d{8,20}$'
          description: |
            Account number
          example: '24550245'
        checkDigit:
          type: string
          maxLength: 1
          pattern: '[\w\W\s]*'
          description: |
            Account check digit
          example: '4'
        type:
          $ref: '#/components/schemas/CustomersEnumAccountTypeCustomers'
        subtype:
          type: string
          enum:
            - INDIVIDUAL
            - CONJUNTA_SIMPLES
            - CONJUNTA_SOLIDARIA
          description: |
            Account subtype (see Enum):
            Individual account - has a single holder
            Simple joint account - where financial movements can only be carried out with the authorization of ALL the account holders.
            Joint and several account - is the modality whose holders may carry out movements individually, that is, without the authorization of the other holders being necessary.
          example: INDIVIDUAL
    CustomersEnumAccountTypeCustomers:
      type: string
      enum:
        - CONTA_DEPOSITO_A_VISTA
        - CONTA_POUPANCA
        - CONTA_PAGAMENTO_PRE_PAGA
      description: |
        Account types. Traditional modalities provided for by Resolution 4,753, not covering linked accounts, accounts of persons domiciled abroad, accounts in foreign currencies and electronic money correspondent accounts. See Enum:

        Demand deposit account or Current account - is the most common type. In it, the money is at your disposal to be withdrawn at any time. This account does not generate earnings for the depositor.

        Savings account - was created to encourage people to save. Money that remains in the account for thirty days starts to generate earnings, with income tax exemption for those who file a return. That is, the money “grows” (yields) while it remains kept in the account. Each deposit will have earnings from month to month, always on the day of the month on which the money was deposited.

        Prepaid payment account - according to CIRCULAR No. 3,680, BCB of  2013, it is the one 'intended for the execution of payment transactions in electronic money carried out on the basis of funds denominated in reais previously contributed'.
      example: CONTA_DEPOSITO_A_VISTA
    CustomersPortabilitiesReceived:
      type: object
      required:
        - employerName
        - employerCnpjCpf
        - paycheckBankDetainerCnpj
        - paycheckBankDetainerIspb
        - portabilityApprovalDate
      properties:
        employerName:
          type: string
          pattern: '^[^\s](.*[^\s])?$'
          maxLength: 80
          description: |
            Name of the employer as received through the portability communication. The employer may be a natural person or a legal entity; when it is a legal entity, the corporate name must be sent.
        employerCnpjCpf:
          type: string
          pattern: '^([0-9]{11}|[0-9A-Z]{12}[0-9]{2})$'
          maxLength: 14
          description: |
            Enrollment record (CPF/CNPJ) of the employer (contracting party of the payment services), as received through the portability communication.
        paycheckBankDetainerCnpj:
          type: string
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          maxLength: 14
          description: |
            Enrollment record in the National Registry of Legal Entities (CNPJ) of the payroll bank (institution holding the salary account) as received through the portability communication.
        paycheckBankDetainerIspb:
          type: string
          pattern: '^[0-9A-Z]{8}$'
          maxLength: 8
          description: |
            ISPB record of the Payroll Bank (institution holding the salary account) as received through the portability communication.
        portabilityApprovalDate:
          type: string
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          maxLength: 10
          description: |
            Portability approval date, as received through the portability communication.

            Note: only approved requests must be shared, even if approved on a compulsory basis.
    CustomersPaychecksBankLink:
      type: object
      required:
        - employerName
        - employerCnpjCpf
        - paycheckBankCnpj
        - paycheckBankIspb
        - accountOpeningDate
      properties:
        employerName:
          type: string
          pattern: '^[^\s](.*[^\s])?$'
          maxLength: 80
          description: |
            Name of the employer as recorded at the opening of the salary account. The employer may be a natural person or a legal entity; when it is a legal entity, the corporate name must be sent.
        employerCnpjCpf:
          type: string
          pattern: '^([0-9]{11}|[0-9A-Z]{12}[0-9]{2})$'
          maxLength: 14
          description: |
            Employer document (CNPJ/CPF), as recorded at the opening of the salary account.
        paycheckBankCnpj:
          type: string
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          maxLength: 14
          description: |
            CNPJ of the financial institution contracted to provide the salary payment service (payroll bank).
        paycheckBankIspb:
          type: string
          pattern: '^[0-9A-Z]{8}$'
          maxLength: 8
          description: |
            ISPB (Brazilian Payment System Identifier) record of the institution contracted to provide the salary payment service (payroll bank).
        accountOpeningDate:
          type: string
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          maxLength: 10
          description: |
            Salary account opening date.
    CustomersBusinessIdentificationData:
      type: object
      description: Set of information regarding Identification, that is, the action and the effect of uniquely identifying the legal entity through its customer registration data
      required:
        - businessId
        - updateDateTime
        - brandName
        - cnpjNumber
        - companiesCnpj
        - companyName
        - incorporationDate
        - parties
        - contacts
      properties:
        updateDateTime:
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
          description: |
            Date and time of the update of the \<_endpoint_\> fields, in accordance with the RFC-3339 specification, UTC format. When there is no date specifically linked to the block, assume the date and time of the update of the registration as a whole.
        businessId:
          type: string
          maxLength: 100
          minLength: 1
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: 578-psd-71md6971kjh-2d414
          description: A unique and immutable identifier used to identify the legal entity customer resource. This identifier has no meaning to the customer who gave the consent
        brandName:
          type: string
          maxLength: 80
          pattern: '[\w\W\s]*'
          example: Organização A
          description: |
            Name of the Brand reported by the participant in Open Finance. It is recommended to use, whenever possible, the same brand name assigned in the directory field Customer Friendly Server Name (Authorisation Server).
        companyName:
          type: string
          maxLength: 144
          pattern: '[\w\W\s]*'
          example: Luiza e Benjamin Assessoria Jurídica Ltda
          description: The corporate name of the company queried is the registered term under which a legal entity (PJ) individualizes itself and carries out its activities. It may also be called corporate denomination or business firm
        tradeName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Mundo da Eletronica
          description: 'Trade name of the legal entity, if any. (It is the popular name of the company, used for promoting the company and better recognition by the public). Mandatory if any'
        incorporationDate:
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
          description: 'Incorporation date of the company, in accordance with the RFC-3339 specification.'
        cnpjNumber:
          type: string
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '50685362006773'
          description: |
            Complete CNPJ number of the Company queried - the CNPJ corresponds to the alphanumeric representation of the enrollment in the Legal Entity Registry.
            Only characters of the CNPJ must be provided, without a mask
        companiesCnpj:
          minItems: 1
          type: array
          example:
            - '50685362000135'
            - '50685362006555'
          description: |
            Full alphanumeric representation of the CNPJ of the institution responsible for the Registration - the CNPJ corresponds to the alphanumeric representation of the enrollment in the Legal Entity Registry.
            Only the characters of the CNPJ must be present, without a mask.
          items:
            type: string
            maxLength: 14
            pattern: '^[0-9A-Z]{12}[0-9]{2}$'
            example: '50685362000135'
        otherDocuments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CustomersBusinessOtherDocument'
          description: List of the other documents
        parties:
          type: array
          items:
            $ref: '#/components/schemas/CustomersPartiesParticipation'
          minItems: 0
          description: |
            List regarding the information of the parties involved, such as: partner and/or administrator. Object that is mandatory for all CNPJs that have partners and/or administrators in the QSA (Board of Partners and Administrators) registry
        contacts:
          $ref: '#/components/schemas/CustomersBusinessContacts'
    CustomersBusinessOtherDocument:
      type: object
      required:
        - type
        - number
        - country
      properties:
        type:
          type: string
          maxLength: 20
          pattern: '[\w\W\s]*'
          example: EIN
          description: 'Number of the document Type provided. Mandatory for the Legal entity domiciled or headquartered abroad, exempt from enrollment in the CNPJ'
        number:
          type: string
          maxLength: 20
          pattern: '[\w\W\s]*'
          example: '128328453'
          description: 'Number of the other document. Mandatory for the Legal entity domiciled or headquartered abroad, exempt from enrollment in the CNPJ'
        country:
          type: string
          maxLength: 3
          pattern: '^(\w{3}){1}$'
          example: CAN
          description: Country of issuance of the document type provided. Country code in accordance with the ISO-3166 alpha3 code
        expirationDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: 'Validity date of the  document type provided, in accordance with the RFC-3339 specification.'
    CustomersPartiesParticipation:
      type: object
      description: |
        List regarding the information of the parties involved, such as: partner and /or administrator
      required:
        - type
        - personType
        - documentType
        - documentNumber
      properties:
        personType:
          type: string
          enum:
            - PESSOA_NATURAL
            - PESSOA_JURIDICA
          description: Indicates whether the person of the party involved is a natural person or a legal entity
        type:
          type: string
          description: |
            Indicates the profile of activity in the company. See Enum
            The administrator is the one responsible for performing all the administrative functions of the company. It is the administrator who conducts the day-to-day of the business, signing documents, legally answering for the company, taking out loans and other managerial actions. Despite being at the forefront of the company, the administrator is called a partner for also holding a share of participation in the Share Capital.
            A partner has no involvement whatsoever in the administrative activities of the company.
          enum:
            - SOCIO
            - ADMINISTRADOR
        civilName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Juan Kaique Cláudio Fernandes
          description: |
            Complete civil name of the natural person (A fundamental right of the person, the civil name is the one assigned to the natural person from the registration of their birth, by which they will be identified throughout their life, as well as after their death).

            If the civil name provided exceeds the limit of 70 characters, the first and the last names must be kept complete, progressively abbreviating the middle names (reducing them to their respective initials, followed by a period), until the name fits the defined limit.
            If an excess persists after the abbreviation of all the middle names, apply simple truncation at the end of the field in order to respect the maximum limit. Do not use ellipses.

            [Restriction] The civilName field must mandatorily be filled in when personType is PESSOA_NATURAL.
        socialName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Karina
          description: |
            Social name of the natural person, if any. (the name by which transvestites and transsexuals recognize themselves, as well as are identified by their community and in their social environment, in accordance with Local Decree).
        companyName:
          type: string
          maxLength: 144
          pattern: '[\w\W\s]*'
          example: Luiza e Benjamin Assessoria Jurídica Ltda
          description: |
            The corporate name of the company queried is the registered term under which a legal entity (PJ) individualizes itself and carries out its activities. It may also be called corporate denomination or business firm

            [Restriction] the companyName field must mandatorily be filled in when personType is PESSOA_JURIDICA.
        tradeName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Mundo da Eletronica
          description: 'Trade name of the legal entity, if any. (It is the popular name of the company, used for promoting the company and better recognition by the public). Mandatory if any'
        startDate:
          type: string
          maxLength: 20
          format: date-time
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2021-05-21T08:30:00Z'
          description: 'Start date of the participation, in accordance with the RFC-3339 specification.'
        shareholding:
          type: string
          format: double
          maxLength: 8
          minLength: 8
          pattern: '^[01]\.\d{6}$'
          example: '0.510000'
          description: |
            Percentage of equity participation (provide with 6 decimal places). The Partner must only be reported if their equity participation is equal to or greater than 25%. e.g: 0.250000 (This value  represents 25%. The value '1 'represents 100%).

            [Restriction]: Mandatory field if type is equal to SOCIO and the latter has equity participation greater than 25%.
        documentType:
          $ref: '#/components/schemas/CustomersEnumPartiesParticipationDocumentType'
        documentNumber:
          type: string
          maxLength: 20
          pattern: '[\w\W\s]*'
          example: '73677831148'
          description: Number of the document provided. Free Text field to fill in the number and check digit of the document, if any
        documentAdditionalInfo:
          type: string
          maxLength: 100
          pattern: '[\w\W\s]*'
          example: CNH
          description: 'Free field, mandatory when the document provided has additional information relevant to its identification'
        documentCountry:
          type: string
          maxLength: 3
          pattern: '[\w\W\s]*'
          example: CAN
          description: |
            Country of issuance of the document. Country code in accordance with the ISO-3166 alpha3 code.
        documentExpirationDate:
          type: string
          format: date
          maxLength: 10
          example: '2021-05-21'
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          description: 'Expiry date of the informed document, in accordance with the RFC-3339 specification.'
        documentIssueDate:
          type: string
          maxLength: 10
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: 'Issue date of the document, in accordance with the RFC-3339 specification.'
    CustomersEnumPartiesParticipationDocumentType:
      type: string
      enum:
        - CPF
        - PASSAPORTE
        - OUTRO_DOCUMENTO_VIAGEM
        - CNPJ
      description: |
        Type of the document provided.
    CustomersBusinessContacts:
      type: object
      description: Set of information regarding the ways to contact the customer.
      required:
        - postalAddresses
        - phones
        - emails
      properties:
        postalAddresses:
          type: array
          items:
            $ref: '#/components/schemas/CustomersBusinessPostalAddress'
          minItems: 0
          description: List of addresses of the legal entity
        phones:
          type: array
          items:
            $ref: '#/components/schemas/CustomersCustomerPhone'
          minItems: 0
          description: List with contact phone numbers of the legal entity
        emails:
          type: array
          items:
            $ref: '#/components/schemas/CustomersCustomerEmail'
          minItems: 0
          description: List of contact e-mails
    CustomersBusinessPostalAddress:
      type: object
      required:
        - isMain
        - townName
        - country
        - countryCode
      properties:
        isMain:
          type: boolean
          example: true
          description: Indicates whether the address provided is the main one
        address:
          type: string
          maxLength: 150
          minLength: 2
          pattern: '^[\w\W\s]*$'
          example: 'Av Naburo Ykesaki, 1270'
          description: |
            Corresponds to the business address of the customer.
        additionalInfo:
          type: string
          maxLength: 30
          pattern: '[\w\W\s]*'
          example: Fundos
          description: Some street addresses still need to be specified by means of an additional address detail
        districtName:
          type: string
          maxLength: 50
          pattern: '[\w\W\s]*'
          example: Centro
          description: |
            A district is a community or region located in a city or municipality according to its geographic subdivisions. Mandatory, if any.
        townName:
          type: string
          maxLength: 50
          pattern: '^[\w\W\s]*$'
          minLength: 2
          example: Marília
          description: |
            Locality: The name of the locality corresponds to the designation of the city or municipality in which the address is located.
        ibgeTownCode:
          type: string
          pattern: '\d{7}$'
          maxLength: 7
          example: '3550308'
          description: 'IBGE Municipality Code. The IBGE Table of Municipality Codes presents the list of Brazilian municipalities associated with a code composed of 7 digits, the first two referring to the code of the Federative Unit.'
        countrySubDivision:
          $ref: '#/components/schemas/CustomersEnumCountrySubDivision'
        postCode:
          type: string
          pattern: '^\d{8}$'
          maxLength: 8
          example: '17500001'
          description: |
            Postal Address Code: Composed of a numeric set of eight digits, the main purpose of the CEP is to guide and speed up the routing, the handling and the delivery of items posted at the Correios, by means of its assignment to localities, street addresses, Correios units, services, public bodies, companies and buildings. e.g. '01311000'
        country:
          type: string
          maxLength: 80
          pattern: '[\w\W\s]*'
          example: Brasil
          description: Name of the country
        countryCode:
          type: string
          maxLength: 3
          pattern: '^([A-Z]{3})$'
          example: BRA
          description: Country code in accordance with the ISO-3166 alpha3 code
        geographicCoordinates:
          $ref: '#/components/schemas/CustomersGeographicCoordinates'
    CustomersBusinessQualificationData:
      type: object
      description: 'Object that gathers the information regarding the qualification process. Qualification is understood as the information that allows institutions to appraise, assess, characterize and classify the customer in order to know their risk profile and their economic and financial capacity'
      required:
        - updateDateTime
      properties:
        updateDateTime:
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
          description: |
            Date and time of the update of the \<_endpoint_\> fields, in accordance with the RFC-3339 specification, UTC format. When there is no date specifically linked to the block, assume the date and time of the update of the registration as a whole.
        economicActivities:
          type: array
          items:
            $ref: '#/components/schemas/CustomersEconomicActivity'
          minItems: 0
          description: 'List of the other codes relating to the other economic activities of the company, according to the CNAE (National Classification of Economic Activities) standard. Mandatory, if any'
        informedRevenue:
          $ref: '#/components/schemas/CustomersInformedRevenue'
        informedPatrimony:
          $ref: '#/components/schemas/CustomersBusinessInformedPatrimony'
    CustomersEconomicActivity:
      type: object
      required:
        - code
        - isMain
      properties:
        code:
          type: string
          pattern: '^\d{7}$'
          description: |
            Provides the code of the branch of the main activity of the company queried, according to the CNAE (National Classification of Economic Activities) standard

            [Note] The field must always be sent with 7 characters, following the “CNAE-Subclasse 2.3” classification. In cases in which the value starts with zeros, it must contain all the characters, including the zeros.
          example: '0600001'
        isMain:
          type: boolean
          description: 'Indicates whether it is the main branch of activity of the company when true and whether it is the secondary branch when false. [Restriction] Only one occurrence relating to the main economic activity code must provide the value true.'
          example: true
    CustomersInformedRevenue:
      type: object
      required:
        - amount
      properties:
        frequency:
          $ref: '#/components/schemas/CustomersEnumInformedRevenueFrequency'
        frequencyAdditionalInfo:
          type: string
          maxLength: 100
          pattern: '[\w\W\s]*'
          example: Informações adicionais
          description: |
            Free text to complement information relating to the net worth.

            [Restriction] Fill in when frequency is equal to OUTROS.
        amount:
          $ref: '#/components/schemas/CustomersInformedRevenueAmount'
        year:
          type: number
          maximum: 9999
          example: 2010
          description: 'Reference year of the Income, in accordance with the RFC-3339 specification.'
    CustomersEnumInformedRevenueFrequency:
      type: string
      description: |
        Provides the frequency or period of the revenue provided.
        "Revenue is calculated based on all the benefits that the company obtained with its economic activity in a given period. These benefits are the earnings or gains of the organization through its sales or services rendered".
      enum:
        - DIARIA
        - SEMANAL
        - QUINZENAL
        - MENSAL
        - BIMESTRAL
        - TRIMESTRAL
        - SEMESTRAL
        - ANUAL
        - OUTROS
      example: DIARIA
    CustomersInformedRevenueAmount:
      type: object
      required:
        - amount
        - currency
      description: Amount of the net worth provided
      properties:
        amount:
          description: |
            Amount of the net worth provided. Expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.
            Net worth is the set of assets linked to a person or to an entity.
          type: string
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '100000.0400'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          description: 'Currency of the monetary value, following the ISO-4217 model.'
          example: BRL
    CustomersBusinessInformedPatrimony:
      type: object
      required:
        - amount
        - date
      properties:
        amount:
          $ref: '#/components/schemas/CustomersInformedPatrimonyAmount'
        date:
          type: string
          format: date
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: 'Reference date of the Net worth, in accordance with the RFC-3339 specification.'
    CustomersBusinessFinancialRelationData:
      type: object
      description: 'Object that gathers the information regarding the customer''s relationship with the Institution. Relationship is understood as the information that allows knowing since when the person queried has been a customer of the institution, as well as an indicator of the products and services they currently consume and their representatives'
      required:
        - updateDateTime
        - startDate
        - productsServicesType
        - procurators
        - accounts
      properties:
        updateDateTime:
          type: string
          format: date-time
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2020-07-21T08:30:00Z'
          description: |
            Date and time of the update of the \<_endpoint_\> fields, in accordance with the RFC-3339 specification, UTC format. When there is no date specifically linked to the block, assume the date and time of the update of the registration as a whole.
        startDate:
          type: string
          format: date-time
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2020-07-21T08:30:00Z'
          description: Start date of the relationship with the Financial Institution. It must provide the lowest value between the information reported to BACEN through DOC 3040 and CCS.
        productsServicesType:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: '#/components/schemas/CustomersEnumProductServiceType'
        procurators:
          type: array
          items:
            $ref: '#/components/schemas/CustomersBusinessProcurator'
          minItems: 0
          description: List of representatives. Mandatory if there is a representative.
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/CustomersBusinessAccount'
          minItems: 0
          description: |
            List of demand deposit, savings and prepaid payment accounts held by the customer at the transmitting institution.
    CustomersBusinessProcurator:
      type: object
      required:
        - type
        - cnpjCpfNumber
        - civilName
      properties:
        type:
          type: string
          enum:
            - REPRESENTANTE_LEGAL
            - PROCURADOR
          description: |
            Type of representative.
            Legal representative - Complete Civil Name of the Natural Person who represents an entity or a company and is appointed in its constitutive act, that is, in the articles of association or bylaws.
            Attorney-in-fact - is any person who represents the Natural Person in some business, through written authorization from them.
          example: PROCURADOR
        cnpjCpfNumber:
          type: string
          maxLength: 14
          pattern: '^([0-9]{11}|[0-9A-Z]{12}[0-9]{2})$'
          example: '73677831148'
          description: Identification of the Legal Representative or Attorney-in-fact. Registry record at the Receita Federal (Fill in with CPF or CNPJ without formatting).
        civilName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Elza Milena Stefany Teixeira
          description: |
            Full civil name of the natural person (A fundamental right of the person, the civil name is the one assigned to the natural person from the registration of their birth, by which they will be identified throughout their life, as well as after their death).

            If the civil name informed exceeds the limit of 70 characters, the first and last names must be kept complete, carrying out progressive abbreviation of the middle names (reducing them to their respective initials, followed by a period), until the name fits the defined limit.
            If an excess persists after the abbreviation of all the middle names, apply simple truncation at the end of the field in order to respect the maximum limit. Do not use ellipsis.
        socialName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Stefany Teixeirass
          description: |
            Social name of the natural person, if any.
            as well as are identified by their community and in their social environment, in accordance with Local Decree.
    CustomersBusinessAccount:
      type: object
      required:
        - compeCode
        - number
        - checkDigit
        - type
      properties:
        compeCode:
          type: string
          maxLength: 3
          pattern: '^\d{3}$'
          description: 'Identifier code assigned by the Central Bank of Brazil to the institutions participating in the STR (Reserves Transfer System).The Compe (Clearing System for Checks and Other Papers) is a system that identifies and processes bank clearings. It is represented by a three-digit code that serves as a bank identifier, and thus each banking institution has a unique number'
          example: '001'
        branchCode:
          type: string
          maxLength: 4
          pattern: '^\d{4}$'
          description: |
            Code of the Branch holding the account. (A branch is the facility intended for serving customers, the general public and the members of credit unions, in the exercise of the institution's activities, and it may not be mobile or transitory)
            [Restriction] It must mandatorily be filled in when the "type" field is different from prepaid account.
          example: '6272'
        number:
          type: string
          maxLength: 20
          pattern: '^\d{8,20}$'
          description: |
            Account number
          example: '24550245'
        checkDigit:
          type: string
          maxLength: 1
          pattern: '[\w\W\s]*'
          description: |
            Account check digit
          example: '4'
        type:
          $ref: '#/components/schemas/CustomersEnumAccountTypeCustomers'
    CreditCardsAccountsAccountPaymentMethod:
      description: Set of information regarding the Payment Methods of the Post-paid payment account
      properties:
        identificationNumber:
          description: "Card identification number: corresponds to the last 4 digits of the card for a natural person, or else fill in with an identifier for a legal entity, with the characteristics defined for the IDs in Open Finance.\n"
          example: '4453'
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        isMultipleCreditCard:
          description: "Indicates whether the Credit card associated with the post-paid payment account is multiple or not. Cards called multiple have both the credit function and the debit function, and the owner of the card must, at the time of its use, state whether the payment is in the credit function (which leads to a future payment, by means of a credit card bill) or in the debit function.\n"
          example: true
          type: boolean
      required:
      - identificationNumber
      - isMultipleCreditCard
      type: object
    CreditCardsAccountsAvailableAmount:
      description: "Available amount of the limit provided   \n"
      properties:
        amount:
          description: "Available amount of the limit provided expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.\n\n[Restriction] The field is mandatory if isLimitFlexible is equal to false.\n"
          example: '1000.0400'
          format: double
          maxLength: 21
          minLength: 4
          pattern: ^-?\d{1,15}\.\d{2,4}$
          type: string
        currency:
          description: "Currency of the limit provided, according to the ISO-4217 model. e.g. 'BRL.'\nAll balances provided are represented in the currency in force in Brazil.  \n\n[Restriction] The field is mandatory if isLimitFlexible is equal to false.\n"
          example: BRL
          maxLength: 3
          pattern: ^[A-Z]{3}$
          type: string
      type: object
    CreditCardsAccountsBillMinimumAmount:
      description: "Amount of the minimum payment of the bill\n"
      properties:
        amount:
          description: Amount of the minimum payment of the bill
          example: '1000.0400'
          format: double
          maxLength: 20
          minLength: 4
          pattern: ^\d{1,15}\.\d{2,4}$
          type: string
        currency:
          description: Currency of the monetary value, following the ISO-4217 model.
          example: BRL
          maxLength: 3
          pattern: ^[A-Z]{3}$
          type: string
      required:
      - amount
      - currency
      type: object
    CreditCardsAccountsBillTotalAmount:
      description: "Total amount of the bills.\nThe field must take a positive value for a debit balance and a negative value for a credit balance.\n"
      properties:
        amount:
          description: Total amount of the bills. Expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.
          example: '1000.0400'
          format: double
          maxLength: 21
          minLength: 4
          pattern: ^-?\d{1,15}\.\d{2,4}$
          type: string
        currency:
          description: Currency of the monetary value, following the ISO-4217 model.
          example: BRL
          maxLength: 3
          pattern: ^[A-Z]{3}$
          type: string
      required:
      - amount
      - currency
      type: object
    CreditCardsAccountsBillsData:
      description: Set of the information regarding the list of bills associated with the post-paid payment account
      properties:
        billClosingDate:
          description: closing date of the Bill
          example: '2021-05-21'
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          type: string
        billId:
          description: Unique and immutable code that identifies the bill.
          example: 3459087XXZTR
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        billMinimumAmount:
          $ref: '#/components/schemas/CreditCardsAccountsBillMinimumAmount'
        billTotalAmount:
          $ref: '#/components/schemas/CreditCardsAccountsBillTotalAmount'
        dueDate:
          description: Due date of the Bill, which appears for payment by the customer
          example: '2021-05-21'
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          type: string
        financeCharges:
          description: List of the charges levied on the bill
          items:
            $ref: '#/components/schemas/CreditCardsAccountsBillsFinanceCharge'
          minItems: 1
          type: array
        isInstalment:
          description: Indicates whether the bill allows payment in installments (true) or not (false).
          example: false
          type: boolean
        payments:
          description: "List that provides the amounts relating to the payments of the Bill of the post-paid payment account.\nPayments made from the moment a new bill is closed and exposed must be listed in the closed bill, until there is a new closing.\n"
          items:
            $ref: '#/components/schemas/CreditCardsAccountsBillsPayment'
          minItems: 0
          type: array
      required:
      - billId
      - dueDate
      - billClosingDate
      - billTotalAmount
      - billMinimumAmount
      - isInstalment
      - payments
      type: object
    CreditCardsAccountsBillsFinanceCharge:
      properties:
        additionalInfo:
          description: Free field, mandatory if the charge type 'OUTROS' is selected
          example: Informações Adicionais
          maxLength: 140
          pattern: '[\w\W\s]*'
          type: string
        amount:
          description: Amount charged for the charge. Expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.
          example: '100000.0400'
          format: double
          maxLength: 20
          minLength: 4
          pattern: ^\d{1,15}\.\d{2,4}$
          type: string
        currency:
          description: "Currency of the amount charged for the charge, according to the ISO-4217 model. e.g. 'BRL' \nAll balances provided are represented in the currency in force in Brazil.\n"
          example: BRL
          maxLength: 3
          pattern: ^(\w{3}){1}$
          type: string
        type:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsFinanceChargeType'
      required:
      - type
      - amount
      - currency
      type: object
    CreditCardsAccountsBillsPayment:
      properties:
        amount:
          description: "Payment amount according to the valueType.  \nExpressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.   \nThe field cannot take a negative value since it is a payment.\n"
          example: '1000.0400'
          format: double
          maxLength: 20
          minLength: 4
          pattern: ^\d{1,15}\.\d{2,4}$
          type: string
        currency:
          description: "Currency of the bill payment amount, according to the ISO-4217 model. e.g. 'BRL' All amounts provided are represented in the currency in force in Brazil\n"
          example: BRL
          maxLength: 3
          pattern: ^(\w{3}){1}$
          type: string
        paymentDate:
          description: Effective date of when the Payment of the bill was made
          example: '2021-05-21'
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          type: string
        paymentMode:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsPaymentMode'
        valueType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsBillingValueType'
      required:
      - valueType
      - paymentDate
      - paymentMode
      - amount
      - currency
      type: object
    CreditCardsAccountsBillsTransactions:
      description: List that provides the amounts relating to the balances of the total credit Limit of the post-paid payment account
      properties:
        amount:
          $ref: '#/components/schemas/CreditCardsAccountsTransactionAmountBills'
        billId:
          description: Unique and immutable code that identifies the bill in which the reported transaction appears.
          example: MTU0OTU1NjI2NTk4OTRmc2ZhZDRmc2Q1NmZkM
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        billPostDate:
          description: "Date on which the transaction was inserted into the bill.\n"
          example: '2021-05-21'
          format: date
          maxLength: 20
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          type: string
        brazilianAmount:
          $ref: '#/components/schemas/CreditCardsAccountsTransactionBrazilianAmountBills'
        chargeIdentificator:
          description: "Number of the installment being reported.\n\n[Restriction] Mandatory if the selected Payment Type (paymentType) is 'A_PRAZO'.\n"
          example: 12
          format: integer
          maximum: 999
          minimum: 1
          type: number
        chargeNumber:
          description: "Number of installments.   \n[Restriction] The field must be filled in when there are installments related to the transaction.\n"
          example: 12
          format: integer
          maximum: 999
          type: number
        creditDebitType:
          $ref: '#/components/schemas/EnumCreditDebitIndicator'
        feeType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountFee'
        feeTypeAdditionalInfo:
          description: Free text field, mandatory when the fee type "OUTRA" is selected
          maxLength: 140
          pattern: ^\S[\s\S]*$
          type: string
        identificationNumber:
          description: "Card identification number: corresponds to the last 4 digits of the card for a natural person (PF), or otherwise fill it in with an identifier for a legal entity (PJ), with the characteristics defined for IDs in Open Finance.\n"
          example: '4453'
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        otherCreditsAdditionalInfo:
          description: "Free text field for filling in additional data on other types of credit contracted on the card.\n\n[Restriction] Mandatory when \"OUTROS\" is selected in the other types of credit field.\n"
          maxLength: 50
          pattern: ^\S[\s\S]*$
          type: string
        otherCreditsType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsOtherCreditType'
        payeeMCC:
          description: "The MCC or the merchant category code. MCCs are grouped according to their similarities. The MCC is used to classify the business by the type of goods or services provided. MCCs are assigned by merchant type (for example, one for hotels, one for office supply stores, etc.) or by merchant name (for example, 3000 for United Airlines).\n\n[Restriction] Mandatory to send when the value of the transactionType field is equal to PAGAMENTO.\n"
          example: 5137
          format: integer
          maximum: 2147483647
          type: number
        paymentType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsPaymentType'
        transactionDateTime:
          description: "Date and time of the transaction.   \n\nFor installment purchases, the `transactionDateTime` must be identical in all installments. The field must necessarily reflect the information displayed to the customer in the institution's digital channels, with date, hour and minute precision — even if the institution does not display that level of granularity in its channels. In those cases, the seconds and milliseconds may be filled in with zero (0). Example: 2024-01-29T11:15:00.000Z.\n"
          example: '2016-01-29T12:29:03.374Z'
          format: date-time
          maxLength: 24
          pattern: (^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)\.(?:[0-9]){3}Z$)
          type: string
        transactionId:
          description: "Unique code or identifier provided by the institution that maintains the account to represent the individual transaction. \nThe `transactionId` is expected to be unique, immutable and stable.\n"
          example: TXpRMU9UQTROMWhZV2xSU1FUazJSMDl
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        transactionName:
          description: Literal used at the financial institution to identify the transaction. The information presented must be the same as that used in the institution's electronic channels (statement and bill).
          example: PGTO
          maxLength: 200
          pattern: '[\w\W\s]*'
          type: string
        transactionType:
          $ref: '#/components/schemas/EnumCreditCardTransactionType'
        transactionalAdditionalInfo:
          description: Free text field, mandatory when the transaction type "OUTROS" is selected
          maxLength: 140
          pattern: ^\S[\s\S]*$
          type: string
      required:
      - transactionId
      - identificationNumber
      - transactionName
      - creditDebitType
      - transactionType
      - brazilianAmount
      - amount
      - transactionDateTime
      - billPostDate
      type: object
    CreditCardsAccountsData:
      description: Set of information on Post-paid payment accounts
      properties:
        brandName:
          description: Name of the Brand reported by the participant in Open Finance. It is recommended to use, whenever possible, the same brand name assigned in the directory field Customer Friendly Server Name (Authorisation Server).
          example: Organização A
          maxLength: 80
          pattern: '[\w\W\s]*'
          type: string
        companyCnpj:
          description: Complete CNPJ record of the institution responsible for the Registry – the CNPJ corresponds to the alphanumeric representation of the registration in the Legal Entity Registry (Cadastro de Pessoa Jurídica). Only the CNPJ characters must be provided, without a mask.
          example: '21128159000166'
          maxLength: 14
          pattern: ^[0-9A-Z]{12}[0-9]{2}$
          type: string
        creditCardAccountId:
          description: Uniquely identifies the customer's post-paid payment account, maintaining the immutability rules within the transmitting institution.
          example: XXZTR3459087
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        creditCardNetwork:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountNetwork'
        name:
          description: 'Name/Identification of the name of the post-paid payment account (card). In accordance with CIRCULAR No. 3,680,BCB, 2013: ''post-paid payment account: intended for carrying out payment transactions that do not depend on the prior contribution of funds'
          example: Cartão Universitário
          maxLength: 50
          pattern: '[\w\W\s]*'
          type: string
        networkAdditionalInfo:
          description: Free text to specify the card brand category marked as 'OUTRAS'
          example: AURA CARD
          maxLength: 50
          pattern: '[\w\W\s]*'
          type: string
        productAdditionalInfo:
          description: Additional information if the Card type is 'OUTROS'
          maxLength: 50
          pattern: '[\w\W\s]*'
          type: string
        productType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsProductType'
      required:
      - brandName
      - companyCnpj
      - name
      - productType
      - creditCardNetwork
      - creditCardAccountId
      type: object
    CreditCardsAccountsEnumCreditCardAccountFee:
      description: "Provides the Fee types: (See Enum) Annual fee, Card withdrawal in Brazil, Card withdrawal abroad, Emergency credit assessment, Issuance of a duplicate, Bill payment fee, SMS, OUTRA.\n\n[Restriction] Mandatory if the selected Transaction Type is 'TARIFA'.\n"
      enum:
      - ANUIDADE
      - SAQUE_CARTAO_BRASIL
      - SAQUE_CARTAO_EXTERIOR
      - AVALIACAO_EMERGENCIAL_CREDITO
      - EMISSAO_SEGUNDA_VIA
      - TARIFA_PAGAMENTO_CONTAS
      - SMS
      - OUTRA
      example: ANUIDADE
      type: string
    CreditCardsAccountsEnumCreditCardAccountNetwork:
      description: "Category of Credit Card Brands (Institutor of the payment scheme).\nThe card brand is the holder of all rights and duties regarding the use of the brand printed on the card, including the brands belonging to the issuers.\n"
      enum:
      - VISA
      - MASTERCARD
      - AMERICAN_EXPRESS
      - DINERS_CLUB
      - HIPERCARD
      - BANDEIRA_PROPRIA
      - CHEQUE_ELETRONICO
      - ELO
      - OUTRAS
      example: VISA
      type: string
    CreditCardsAccountsEnumCreditCardAccountsBillingValueType:
      description: "Provides the types of amounts relating to the payments of the post-paid payment account bill: (See Enum)\n - Amount of the bill payment with installments\n - Amount of the bill payment made\n - Other Amount paid on the bill\n\n VALOR_PAGAMENTO_FATURA_PARCELADO: When the payment corresponds to the triggering event for opening the bill installment plan\n\n VALOR_PAGAMENTO_FATURA_REALIZADO: When the payment corresponds to the total amount of the bill\n\n OUTRO_VALOR_PAGO_FATURA: Other cases\n"
      enum:
      - VALOR_PAGAMENTO_FATURA_PARCELADO
      - VALOR_PAGAMENTO_FATURA_REALIZADO
      - OUTRO_VALOR_PAGO_FATURA
      type: string
    CreditCardsAccountsEnumCreditCardAccountsConsolidationType:
      description: "Indicator that allows reporting whether the limit amount is consolidated or individual.\n\nCONSOLIDADO: used when the card account limit is shared among all the payment methods (paymentMethod) linked to the account.\n\nINDIVIDUAL: Used when each payment method (paymentMethod) has its own segregated limit.\n"
      enum:
      - CONSOLIDADO
      - INDIVIDUAL
      example: CONSOLIDADO
      type: string
    CreditCardsAccountsEnumCreditCardAccountsFinanceChargeType:
      description: "Provides the name of the Charges that\napply to the post-paid payment account bill. (See Enum)\n- Remuneratory interest for late payment of the bill\n- Penalty for late payment of the bill\n- Default interest for late payment of the bill\n- IOF\n- Others\n"
      enum:
      - JUROS_REMUNERATORIOS_ATRASO_PAGAMENTO_FATURA
      - MULTA_ATRASO_PAGAMENTO_FATURA
      - JUROS_MORA_ATRASO_PAGAMENTO_FATURA
      - IOF
      - OUTROS
      type: string
    CreditCardsAccountsEnumCreditCardAccountsLineLimitType:
      description: "Limit type indicator\n\nLIMITE_CREDITO_TOTAL: Total credit limit applied to the card account.\n\nLIMITE_CREDITO_MODALIDADE_OPERACAO: Credit limit by modality of this card account (observe lineName and list those applicable to the institution).\n"
      enum:
      - LIMITE_CREDITO_TOTAL
      - LIMITE_CREDITO_MODALIDADE_OPERACAO
      example: LIMITE_CREDITO_TOTAL
      type: string
    CreditCardsAccountsEnumCreditCardAccountsOtherCreditType:
      description: "Provides other types of credit contracted on the card.\n\n[Restriction] Mandatory if the selected transaction type is 'OPERACOES_CREDITO_CONTRATADAS_CARTAO'.\n"
      enum:
      - CREDITO_ROTATIVO
      - PARCELAMENTO_FATURA
      - EMPRESTIMO
      - OUTROS
      example: CREDITO_ROTATIVO
      type: string
    CreditCardsAccountsEnumCreditCardAccountsPaymentMode:
      description: "Provides the methods of settlement of the payment made: (See Enum)\n- Debit to a current account\n- Bank slip (boleto)\n- Payroll deduction\n- PIX\n"
      enum:
      - DEBITO_CONTA_CORRENTE
      - BOLETO_BANCARIO
      - AVERBACAO_FOLHA
      - PIX
      type: string
    CreditCardsAccountsEnumCreditCardAccountsPaymentType:
      description: "Provides the payment types.\n\n[Restriction] Mandatory if the selected Transaction Type is 'PAGAMENTO'.\n"
      enum:
      - A_VISTA
      - A_PRAZO
      example: A_VISTA
      type: string
    CreditCardsAccountsEnumCreditCardAccountsProductType:
      description: Category assigned to a payment card, under a certain name, which adds to it a set of advantages, differentiating it according to the cardholder's profile.
      enum:
      - CLASSIC_NACIONAL
      - CLASSIC_INTERNACIONAL
      - GOLD
      - PLATINUM
      - INFINITE
      - ELECTRON
      - STANDARD_NACIONAL
      - STANDARD_INTERNACIONAL
      - ELETRONIC
      - BLACK
      - REDESHOP
      - MAESTRO_MASTERCARD_MAESTRO
      - GREEN
      - BLUE
      - BLUEBOX
      - PROFISSIONAL_LIBERAL
      - CHEQUE_ELETRONICO
      - CORPORATIVO
      - EMPRESARIAL
      - COMPRAS
      - BASICO_NACIONAL
      - BASICO_INTERNACIONAL
      - NANQUIM
      - GRAFITE
      - MAIS
      - OUTROS
      example: OUTROS
      type: string
    CreditCardsAccountsIdentificationData:
      description: Set of information regarding the identification of the post-paid payment account.
      properties:
        creditCardNetwork:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountNetwork'
        name:
          description: "Name/Identification of the name of the post-paid payment account (card). In accordance with CIRCULAR No. 3,680,BCB, 2013: 'post-paid payment account: intended for carrying out payment transactions that do not depend on the prior contribution of funds'.\n"
          example: Cartão Universitário
          maxLength: 50
          pattern: '[\w\W\s]*'
          type: string
        networkAdditionalInfo:
          description: Free text to specify the card brand category marked as 'OUTRAS'.
          example: AURA CARD
          maxLength: 50
          pattern: '[\w\W\s]*'
          type: string
        paymentMethod:
          description: "List of the cards (e.g.: virtual/additional/primary) associated with the consented card account, as available to the user in the proprietary channels.\n\nSending an empty paymentMethod list must only occur in the following scenarios:\n- Account with active payment, but with all the payment methods cancelled;\n- New account with no payment methods issued;\n- Account with a no-name card: delivery of an emergency card to the customer without the customer's data on the plastic;\n- Account blocked due to theft, robbery or loss: the card is inactive and awaiting the embossing of a new card;\n- Suspended account: account suspended for non-payment, judicial suspension, among others, however the card remains in the customer's possession;\n- Inactive account: no card use for more than X days, however the card is still linked to the customer;\n- Account awaiting / under review of the customer analysis: the customer has already requested a card, embossing in progress, but there are still additional analyses (e.g.: fraud) to be completed.\n"
          items:
            $ref: '#/components/schemas/CreditCardsAccountsAccountPaymentMethod'
          minItems: 0
          type: array
        productAdditionalInfo:
          description: Additional information if the Card type is 'OUTROS'
          example: OURO_INTERNACIONAL
          maxLength: 50
          pattern: '[\w\W\s]*'
          type: string
        productType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsProductType'
      required:
      - name
      - productType
      - creditCardNetwork
      - paymentMethod
      type: object
    CreditCardsAccountsLimitAmount:
      description: "Total amount of the limit granted.\n"
      properties:
        amount:
          description: "Total amount of the reported limit expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.\n\n[Restriction] The field is mandatory if isLimitFlexible is equal to false.\n"
          example: '1000.0400'
          format: double
          maxLength: 20
          minLength: 4
          pattern: ^\d{1,15}\.\d{2,4}$
          type: string
        currency:
          description: "Currency relating to the reported limit, according to the ISO-4217 model. e.g. 'BRL.'\nAll the reported limits are represented in the currency in force in Brazil.\n\n[Restriction] The field is mandatory if isLimitFlexible is equal to false.\n"
          example: BRL
          maxLength: 3
          pattern: ^[A-Z]{3}$
          type: string
        limitAmountReason:
          description: "Reason why the total amount of the reported limit is equal to zero.\n\n[Restriction] Mandatory field when limitAmount is equal to 0.00.\n"
          example: O perfil do cliente passou por uma análise e o limite precisou ser zerado
          maxLength: 200
          pattern: '[\w\W\s]*'
          type: string
      required:
      - amount
      - currency
      type: object
    CreditCardsAccountsLimitsData:
      description: Set of information regarding the limits of the post-paid payment account.
      properties:
        availableAmount:
          $ref: '#/components/schemas/CreditCardsAccountsAvailableAmount'
        consolidationType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsConsolidationType'
        creditLineLimitType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsLineLimitType'
        customizedLimitAmount:
          description: "Total amount of the limit customized by the customer in the institution's electronic channels. This object is mandatory to send in the cases in which the institution allows the customer to change their limit.\n"
          properties:
            amount:
              description: "Total amount of the reported limit expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.\n"
              example: '1000.0400'
              format: double
              maxLength: 20
              minLength: 4
              pattern: ^\d{1,15}\.\d{2,4}$
              type: string
            currency:
              description: "Currency relating to the reported limit, according to the ISO-4217 model. e.g. 'BRL.' All the reported limits are represented in the currency in force in Brazil.\n"
              example: BRL
              maxLength: 3
              pattern: ^[A-Z]{3}$
              type: string
          required:
          - amount
          - currency
          type: object
        identificationNumber:
          description: "Card identification number: corresponds to the last 4 digits of the card for a natural person (PF), or otherwise fill it in with an identifier for a legal entity (PJ), with the characteristics defined for IDs in Open Finance.\n"
          example: '4453'
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        isLimitFlexible:
          description: True= Indicates that the card account has a flexible total limit or “no limit”. False = Indicates that the card account has a predetermined limit displayed in the channel to the customer.
          example: true
          type: boolean
        limitAmount:
          $ref: '#/components/schemas/CreditCardsAccountsLimitAmount'
        lineName:
          enum:
          - CREDITO_A_VISTA
          - CREDITO_PARCELADO
          - SAQUE_CREDITO_BRASIL
          - SAQUE_CREDITO_EXTERIOR
          - EMPRESTIMO_CARTAO_CONSIGNADO
          - OUTROS
          example: CREDITO_A_VISTA
          type: string
        lineNameAdditionalInfo:
          description: Mandatory field if the option 'OUTRAS' is selected in lineName.
          example: Informações adicionais e complementares.
          maxLength: 50
          pattern: '[\w\W\s]*'
          type: string
        usedAmount:
          $ref: '#/components/schemas/CreditCardsAccountsUsedAmount'
      required:
      - creditLineLimitType
      - consolidationType
      - identificationNumber
      - isLimitFlexible
      - usedAmount
      type: object
    CreditCardsAccountsLinks:
      description: References to other resources of the requested API.
      properties:
        first:
          description: URI of the first page that originated this list of results. Restriction - Mandatory when it is not the first page of the response
          example: https://api.banco.com.br/open-banking/api/v2/resource
          format: url
          maxLength: 4048
          type: string
        last:
          description: URI of the last page of this list of results. Restriction - Mandatory when it is not the last page of the response
          example: https://api.banco.com.br/open-banking/api/v2/resource
          format: url
          maxLength: 4048
          type: string
        next:
          description: URI of the next page of this list of results. Restriction - Mandatory when it is not the last page of the response
          example: https://api.banco.com.br/open-banking/api/v2/resource
          format: url
          maxLength: 4048
          type: string
        prev:
          description: "URI of the previous page of this list of results. Restriction - \tMandatory when it is not the first page of the response"
          example: https://api.banco.com.br/open-banking/api/v2/resource
          format: url
          maxLength: 4048
          type: string
        self:
          description: Full URI that generated the current response.
          example: https://api.banco.com.br/open-banking/api/v2/resource
          format: url
          maxLength: 4048
          type: string
      required:
      - self
      type: object
    CreditCardsAccountsMeta:
      description: Meta information regarding the requested API.
      properties:
        requestDateTime:
          description: Date and time of the query, in accordance with the RFC-3339 specification, UTC format.
          example: '2021-05-21T08:30:00Z'
          format: date-time
          maxLength: 20
          type: string
        totalPages:
          description: Total number of pages in the result
          example: 1
          format: int32
          type: integer
        totalRecords:
          description: Total number of records in the result
          example: 1
          format: int32
          type: integer
      required:
      - totalRecords
      - totalPages
      - requestDateTime
      type: object
    CreditCardsAccountsMetaOnlyRequestDateTime:
      description: Meta information regarding the requested API.
      properties:
        requestDateTime:
          description: Date and time of the query, in accordance with the RFC-3339 specification, UTC format.
          example: '2021-05-21T08:30:00Z'
          format: date-time
          maxLength: 20
          type: string
      required:
      - requestDateTime
      type: object
    CreditCardsAccountsResponseCreditCardAccountsBills:
      properties:
        data:
          items:
            $ref: '#/components/schemas/CreditCardsAccountsBillsData'
          minItems: 0
          type: array
        links:
          $ref: '#/components/schemas/CreditCardsAccountsLinks'
        meta:
          $ref: '#/components/schemas/CreditCardsAccountsMeta'
      required:
      - data
      - links
      - meta
      type: object
    CreditCardsAccountsResponseCreditCardAccountsIdentification:
      properties:
        data:
          $ref: '#/components/schemas/CreditCardsAccountsIdentificationData'
        links:
          $ref: '#/components/schemas/CreditCardsAccountsLinks'
        meta:
          $ref: '#/components/schemas/CreditCardsAccountsMeta'
      required:
      - data
      - links
      - meta
      type: object
    CreditCardsAccountsResponseCreditCardAccountsLimits:
      properties:
        data:
          description: "[Restriction] The submission of limit data must follow the guidelines below:\n- An empty list must be interpreted as the absence of the information;\n- A scenario of a limit with a zero amount must have an explicit record reporting the amount as zero;\n- A scenario of a \"card without a limit\", that is, cards in which the use of the limit is flexible, must be reported in an explicit record with isLimitFlexible as true;\n- Global limits must be shared in the list of limits, defined by the enum CONSOLIDADO, in the consolidationType field. Limits already included in the global limit must not be shared, so that redundancy of information does not occur;\n- Segregated limits, which are not part of the global limit, must be shared through the enum INDIVIDUAL, in the consolidationType field.\n- Virtual cards must only have their limit listed if that limit is segregated from the global one; thus, they must be shared through the enum INDIVIDUAL, in the consolidationType field.\n- Only limits of active cards must be shared. Exclusively in the case of cancelled card accounts, send an empty list.\n"
          items:
            $ref: '#/components/schemas/CreditCardsAccountsLimitsData'
          minItems: 0
          type: array
        links:
          $ref: '#/components/schemas/CreditCardsAccountsLinks'
        meta:
          $ref: '#/components/schemas/CreditCardsAccountsMeta'
      required:
      - data
      - links
      - meta
      type: object
    CreditCardsAccountsResponseCreditCardAccountsList:
      properties:
        data:
          description: Set of post-paid payment account information
          items:
            $ref: '#/components/schemas/CreditCardsAccountsData'
          minItems: 0
          type: array
        links:
          $ref: '#/components/schemas/CreditCardsAccountsLinks'
        meta:
          $ref: '#/components/schemas/CreditCardsAccountsMeta'
      required:
      - data
      - links
      - meta
      type: object
    CreditCardsAccountsResponseCreditCardAccountsTransactions:
      properties:
        data:
          items:
            $ref: '#/components/schemas/CreditCardsAccountsTransaction'
          minItems: 0
          type: array
        links:
          $ref: '#/components/schemas/CreditCardsAccountsTransactionsLinks'
        meta:
          $ref: '#/components/schemas/CreditCardsAccountsMetaOnlyRequestDateTime'
      required:
      - data
      - links
      - meta
      type: object
    CreditCardsAccountsTransaction:
      description: List that provides the amounts relating to the balances of the total credit Limit of the post-paid payment account
      properties:
        amount:
          $ref: '#/components/schemas/CreditCardsAccountsTransactionAmount'
        billForecastDate:
          description: "Month and year in which the transaction/installment will be billed, which may be an open, future or closed bill.\n\n- If it is a future transaction, this date may be adjusted as the customer changes the cycles of their bill. Regardless of that, the month and the year must correspond exactly to the expected charge date of that installment.\n\n- All the transactions must be reflected identically to the digital channels, and, if they are not in the channels, they must be presented in accordance with the institution's own expected charge date.\n"
          example: 2021-05
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])$
          type: string
        billId:
          description: "Unique and immutable code that identifies the bill in which the reported transaction appears. \nFill it in only for cases of a transaction on a closed bill, that is, this field is not expected in cases of a transaction on an open bill.\n"
          example: MTU0OTU1NjI2NTk4OTRmc2ZhZDRmc2Q1NmZkM
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        billPostDate:
          description: "Date on which the transaction was inserted into the bill. \nFill in the field with the dummy date: 0001-01-01, only for the cases in which there is not yet a date of insertion into the bill.\n"
          example: '2021-05-21'
          format: date
          maxLength: 20
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          type: string
        brazilianAmount:
          $ref: '#/components/schemas/CreditCardsAccountsTransactionBrazilianAmount'
        chargeIdentificator:
          description: "Number of the installment being reported.\n\n[Restriction] Mandatory if the selected Payment Type (paymentType) is 'A_PRAZO'.\n"
          example: 12
          format: integer
          maximum: 999
          minimum: 1
          type: number
        chargeNumber:
          description: "Number of installments.   \n[Restriction] The field must be filled in when there are installments related to the transaction.\n"
          example: 12
          format: integer
          maximum: 999
          type: number
        creditDebitType:
          $ref: '#/components/schemas/EnumCreditDebitIndicator'
        feeType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountFee'
        feeTypeAdditionalInfo:
          description: Free text field, mandatory when the fee type "OUTRA" is selected
          maxLength: 140
          pattern: ^\S[\s\S]*$
          type: string
        identificationNumber:
          description: "Card identification number: corresponds to the last 4 digits of the card for a natural person (PF), or otherwise fill it in with an identifier for a legal entity (PJ), with the characteristics defined for IDs in Open Finance.\n"
          example: '4453'
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        otherCreditsAdditionalInfo:
          description: "Free text field for filling in additional data on other types of credit contracted on the card.\n\n[Restriction] Mandatory when \"OUTROS\" is selected in the other types of credit field.\n"
          maxLength: 50
          pattern: ^\S[\s\S]*$
          type: string
        otherCreditsType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsOtherCreditType'
        payeeMCC:
          description: "The MCC or the merchant category code. MCCs are grouped according to their similarities. The MCC is used to classify the business by the type of goods or services provided. MCCs are assigned by merchant type (for example, one for hotels, one for office supply stores, etc.) or by merchant name (for example, 3000 for United Airlines).\n\n[Restriction] Mandatory to send when the value of the transactionType field is equal to PAGAMENTO.\n"
          example: 5137
          format: integer
          maximum: 2147483647
          type: number
        paymentType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsPaymentType'
        transactionDateTime:
          description: "Date and time of the transaction.   \n\nFor installment purchases, the `transactionDateTime` must be identical in all installments. The field must necessarily reflect the information displayed to the customer in the institution's digital channels, with date, hour and minute precision — even if the institution does not display that level of granularity in its channels. In those cases, the seconds and milliseconds may be filled in with zero (0). Example: 2024-01-29T11:15:00.000Z.\n"
          example: '2016-01-29T12:29:03.374Z'
          format: date-time
          maxLength: 24
          pattern: (^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)\.(?:[0-9]){3}Z$)
          type: string
        transactionId:
          description: "Unique and immutable code or identifier provided by the institution that maintains the account to represent the individual transaction. \nOnly transactions after reconciliation must be shared, making the `transactionId` immutable.\n"
          example: TXpRMU9UQTROMWhZV2xSU1FUazJSMDl
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        transactionName:
          description: Literal used at the financial institution to identify the transaction. The information presented must be the same as that used in the institution's electronic channels (statement and bill).
          example: PGTO
          maxLength: 200
          pattern: '[\w\W\s]*'
          type: string
        transactionType:
          $ref: '#/components/schemas/EnumCreditCardTransactionType'
        transactionalAdditionalInfo:
          description: Free text field, mandatory when the transaction type "OUTROS" is selected
          maxLength: 140
          pattern: ^\S[\s\S]*$
          type: string
      required:
      - transactionId
      - identificationNumber
      - transactionName
      - creditDebitType
      - transactionType
      - brazilianAmount
      - amount
      - transactionDateTime
      - billPostDate
      - billForecastDate
      type: object
    CreditCardsAccountsTransactionAmount:
      description: "Original amount of the transaction. Expressed as a monetary value with a minimum of 2 decimal places and a maximum of 4 decimal places. \nIt must always be filled in with the original amount of the transaction regardless of the nationality, without converting it. \nFor installment purchases the value of the field must correspond to the amount of the installment.   \n"
      properties:
        amount:
          description: Amount related to the object.
          example: '1000.0400'
          format: double
          maxLength: 20
          minLength: 4
          pattern: ^\d{1,15}\.\d{2,4}$
          type: string
        currency:
          description: Currency of the monetary value, following the ISO-4217 model.
          example: BRL
          maxLength: 3
          pattern: ^[A-Z]{3}$
          type: string
      required:
      - amount
      - currency
      type: object
    CreditCardsAccountsTransactionAmountBills:
      description: "Original amount of the transaction. Expressed as a monetary value with a minimum of 2 decimal places and a maximum of 4 decimal places. It must always be filled in with the original amount of the transaction regardless of the nationality, without converting it.\n"
      properties:
        amount:
          description: Amount related to the object.
          example: '1000.0400'
          format: double
          maxLength: 20
          minLength: 4
          pattern: ^\d{1,15}\.\d{2,4}$
          type: string
        currency:
          description: Currency of the monetary value, following the ISO-4217 model.
          example: BRL
          maxLength: 3
          pattern: ^[A-Z]{3}$
          type: string
      required:
      - amount
      - currency
      type: object
    CreditCardsAccountsTransactionBrazilianAmount:
      description: "Transaction amount expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places, in the current currency of Brazil. \nIt must be the amount value converted to BRL (in the case of an international purchase) or the same amount value (in the case of a domestic purchase). \nFor installment purchases the value of the field must correspond to the amount of the installment.\n"
      properties:
        amount:
          description: Amount related to the object.
          example: '1000.0400'
          format: double
          maxLength: 20
          minLength: 4
          pattern: ^\d{1,15}\.\d{2,4}$
          type: string
        currency:
          description: Currency of the monetary value, following the ISO-4217 model.
          example: BRL
          maxLength: 3
          pattern: ^[A-Z]{3}$
          type: string
      required:
      - amount
      - currency
      type: object
    CreditCardsAccountsTransactionBrazilianAmountBills:
      description: "Transaction amount expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places, in the current currency of Brazil. It must be the amount value converted to BRL (in the case of an international purchase) or the same amount value (in the case of a domestic purchase).\n"
      properties:
        amount:
          description: Amount related to the object.
          example: '1000.0400'
          format: double
          maxLength: 20
          minLength: 4
          pattern: ^\d{1,15}\.\d{2,4}$
          type: string
        currency:
          description: Currency of the monetary value, following the ISO-4217 model.
          example: BRL
          maxLength: 3
          pattern: ^[A-Z]{3}$
          type: string
      required:
      - amount
      - currency
      type: object
    CreditCardsAccountsTransactionsLinks:
      description: References to other resources of the requested API.
      properties:
        first:
          description: URI of the first page that originated this list of results. Restriction - Mandatory when it is not the first page of the response
          example: https://api.banco.com.br/open-banking/api/v2/resource
          format: url
          maxLength: 4048
          type: string
        next:
          description: URI of the next page of this list of results. Restriction - Mandatory when it is not the last page of the response
          example: https://api.banco.com.br/open-banking/api/v2/resource
          format: url
          maxLength: 4048
          type: string
        prev:
          description: "URI of the previous page of this list of results. Restriction - \tMandatory when it is not the first page of the response"
          example: https://api.banco.com.br/open-banking/api/v2/resource
          format: url
          maxLength: 4048
          type: string
        self:
          description: Full URI that generated the current response.
          example: https://api.banco.com.br/open-banking/api/v2/resource
          format: url
          maxLength: 4048
          type: string
      required:
      - self
      type: object
    CreditCardsAccountsUsedAmount:
      description: "Used amount of the reported limit. \nExtra limits provided or contracted and used by the customer must be added into this field. \nThus, if the value of this field is greater than the customer's limit, it means the use and contracting of extra limits on the card.\n"
      properties:
        amount:
          description: Used amount of the reported limit expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.
          example: '1000.0400'
          format: double
          maxLength: 21
          minLength: 4
          pattern: ^-?\d{1,15}\.\d{2,4}$
          type: string
        currency:
          description: "Currency relating to the reported limit, according to the ISO-4217 model. e.g. 'BRL.'\nAll the reported balances are represented in the currency in force in Brazil. \n"
          example: BRL
          maxLength: 3
          pattern: ^[A-Z]{3}$
          type: string
      required:
      - amount
      - currency
      type: object
    CreditCardsAccountsResponseBillsTransactions:
      type: object
      required:
      - data
      - links
      - meta
      properties:
        data:
          type: array
          minItems: 0
