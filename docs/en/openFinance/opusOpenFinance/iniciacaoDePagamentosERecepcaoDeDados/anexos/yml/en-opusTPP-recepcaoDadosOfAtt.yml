              pattern: '^\d{1,15}\.\d{2,4}$'
              example: '1000.04'
            currency:
              type: string
              description: 'Currency of the monetary value, following the ISO-4217 model.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        transactionNetValue:
          type: object
          description: |
            Net amount of the movement after the deduction of taxes (IOF and IR) and the exit fee.
            [Restriction] Field that must be filled in by the participants when the field 'type' is filled in with the value 'SAIDA'.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Amount related to the object.
              maxLength: 21
              pattern: '^-?\d{1,15}\.\d{2,4}$'
