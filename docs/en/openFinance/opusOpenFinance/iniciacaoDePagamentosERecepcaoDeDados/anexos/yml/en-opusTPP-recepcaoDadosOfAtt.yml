        feeCode:
          type: string
          maxLength: 140
          pattern: ^[^\s](.*[^\s])?$
          example: aval_bem
          description: "Identifying acronym of the fee agreed.  \n"
        feeAmount:
          type: string
          format: double
          pattern: ^-?\d{1,15}\.\d{2,4}$
          maxLength: 21
          minLength: 4
          example: '1000.0400'
          description: "Monetary value of the fee agreed in the contract.\n\nExpressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.\n"
    FinancingsResponseFinancingsPayments:
      type: object
      required:
