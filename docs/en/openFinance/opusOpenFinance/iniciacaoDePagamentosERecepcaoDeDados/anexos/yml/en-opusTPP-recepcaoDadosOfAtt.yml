      properties:
        amount:
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: Monetary amount of the non-regular installment due in the future. Expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          maxLength: 3
          description: Currency of the monetary value, following the ISO-4217 model.
          example: BRL
    FinancingsInstalments:
      type: object
      description: Set of information relating to the installments / payments of the financings credit operation contracted
      required:
      - typeContractRemaining
      - typeNumberOfInstalments
      - paidInstalments
      properties:
        typeNumberOfInstalments:
          type: string
          description: Type of total term of the contract relating to the reported credit modality.
          enum:
          - DIA
          - SEMANA
          - MES
          - ANO
          - SEM_PRAZO_TOTAL
          example: MES
        totalNumberOfInstalments:
          type: number
          example: 130632
          maximum: 999999
          description: "Total Term according to the type (day, week, month, year) relating to the Credit Modality reported.\n\n[Restriction] It must mandatorily be filled if typeNumberOfInstalments is other than SEM_PRAZO_TOTAL.\n"
        typeContractRemaining:
          type: string
          enum:
          - DIA
          - SEMANA
          - MES
          - ANO
          - SEM_PRAZO_REMANESCENTE
          description: "Type of remaining term of the contract relating to the reported credit modality.\n"
        contractRemainingNumber:
          type: number
          maximum: 999999
          description: "Remaining Term according to the type (day, week, month, year) relating to the reported Credit Modality.\n\n[Restriction] It must mandatorily be filled in if the typeContractRemaining is different from SEM_PRAZO_REMANESCENTE.\n"
          example: 14600
        paidInstalments:
          type: number
          description: Number of installments paid. (In the case of modalities that do not have installments, the number of installments is equal to zero)
          maximum: 999999
          example: 73
        dueInstalments:
          type: number
          maximum: 999999
          description: "Number of payments falling due.\n\n[Restriction] Mandatory for modalities that have installments.\n"
          example: 57
        pastDueInstalments:
          type: number
          maximum: 999999
          description: "Number of overdue payments.\n\n[Restriction] Mandatory for modalities that have installments.\n"
          example: 73
        balloonPayments:
          type: array
          items:
            $ref: '#/components/schemas/FinancingsBalloonPayment'
          minItems: 1
          description: List that provides the due dates and the amount of the non-regular installments of the contract of the queried credit modality
    FinancingsResponseFinancingsInstalments:
      type: object
      required:
      - data
      - links
      - meta
      properties:
        data:
          $ref: '#/components/schemas/FinancingsInstalments'
        links:
          $ref: '#/components/schemas/FinancingsLinksSingle'
        meta:
          $ref: '#/components/schemas/FinancingsMetaSingle'
    FinancingsListContract:
      type: object
      description: Set of information  on financing contracts held by the customer at the transmitting institution and for which they have provided consent
      required:
      - contractId
      - brandName
      - companyCnpj
      - productType
      - productSubType
      - ipocCode
      properties:
        contractId:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          maxLength: 100
          example: '92792126019929279212650822221989319252576'
          description: Uniquely identifies the contract of the customer's credit operation, maintaining the immutability rules within the transmitting institution.
        brandName:
          type: string
          pattern: ^[^\s](.*[^\s])?$
          maxLength: 80
          example: Organização A
          description: Name of the Brand reported by the participant in Open Finance. It is recommended to use, whenever possible, the same brand name assigned in the directory field Customer Friendly Server Name (Authorisation Server).
        companyCnpj:
          type: string
          pattern: ^[0-9A-Z]{12}[0-9]{2}$
          description: "Complete record of the CNPJ of the institution responsible for the Registration - the CNPJ corresponds to the alphanumeric representation of the registration in the Cadastro de Pessoa Jurídica. \nOnly the characters of the CNPJ must be provided, without a mask.\n"
          maxLength: 14
          example: '21128159000166'
        productType:
          $ref: '#/components/schemas/FinancingsEnumProductType'
        productSubType:
          $ref: '#/components/schemas/FinancingsEnumProductSubType'
        ipocCode:
          type: string
          maxLength: 67
          minLength: 22
          pattern: ^[\w\W]{22,67}$
          example: '92792126019929279212650822221989319252576'
          description: "Standardized contract number - IPOC (Standardized Identification of the Credit Operation). According to DOC 3040, composed of:\n- **CNPJ of the institution:** 8 (eight) initial positions;\n- **Modality of the operation:** 4 (four) positions;\n- **Type of the customer:** 1 (one) position( 1 = natural person - CPF, 2= legal entity – CNPJ, 3 = natural person abroad, 4 = legal entity abroad, 5 = natural person without a CPF and 6 = legal entity without a CNPJ);\n- **Code of the customer:** The number of positions varies according to the type of the customer:\n  1. For natural person customers with a CPF (customer type = 1), report the 11 (eleven) positions of the CPF;\n  2. For legal entity customers with a CNPJ (customer type = 2), report the 8 (eight) initial positions of the CNPJ;\n  3. For the other customers (customer types 3, 4, 5 and 6), report 14 (fourteen) positions with a complement of zeros on the left if the identification is of a smaller size;\n- **Code of the contract:** 1 (one) up to 40 (forty) positions, without a complement of characters.\n"
