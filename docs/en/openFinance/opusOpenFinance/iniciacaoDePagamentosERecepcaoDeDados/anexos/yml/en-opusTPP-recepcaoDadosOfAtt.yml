          format: date-time
          example: '2021-05-21T08:30:00Z'
    FinancingsResponseFinancingsContractList:
      type: object
      required:
      - data
      - links
      - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/FinancingsListContract'
        links:
          $ref: '#/components/schemas/FinancingsLinks'
        meta:
          $ref: '#/components/schemas/FinancingsMeta'
    FinancingsContract:
      type: object
      description: Set of information relating to the identification of the financings credit operation
      required:
      - contractNumber
      - ipocCode
      - productName
      - productType
      - productSubType
      - contractDate
      - contractAmount
      - instalmentPeriodicity
      - CET
      - amortizationScheduled
      - interestRates
      - contractedFees
      - contractedFinanceCharges
      properties:
        contractNumber:
          type: string
          maxLength: 100
          pattern: ^[\w\W]{1,100}$
          example: '1324926521496'
          description: Contract number given by the contracting institution.
        ipocCode:
          type: string
          maxLength: 67
          minLength: 22
          pattern: ^[\w\W]{22,67}$
          description: "\"Standardized contract number - IPOC (Identificação Padronizada da Operação de Crédito). According to DOC 3040, composed of:\n- **CNPJ of the institution:** 8 (eight) initial positions;\n- **Modality of the operation:** 4 (four) positions;\n- **Customer type:** 1 (one) position( 1 = natural person - CPF, 2= legal entity – CNPJ, 3 = natural person abroad, 4 = legal entity abroad, 5 = natural person without CPF and 6 = legal entity without CNPJ);\n- **Customer code:** The number of positions varies according to the customer type:\n  1. For natural person customers with CPF (customer type = 1), report the 11 (eleven) positions of the CPF;\n  2. For legal entity customers with CNPJ (customer type = 2), report the 8 (eight) initial positions of the CNPJ;\n  3. For the other customers (customer types 3, 4, 5 and 6), report 14 (fourteen) positions with zero padding on the left if the identification is shorter;\n- **Contract code:** 1 (one) to 40 (forty) positions, without character padding.\"\n"
          example: '92792126019929279212650822221989319252576'
        productName:
          type: string
          maxLength: 140
          pattern: ^[^\s](.*[^\s])?$
          example: Crédito Pessoal Consignado
          description: "Name/Identification of the name of the Credit Operation Modality disclosed to the customer\n"
        productType:
          $ref: '#/components/schemas/FinancingsEnumProductType'
        productSubType:
          $ref: '#/components/schemas/FinancingsEnumProductSubType'
        contractDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2018-01-05'
          description: Contracting date of the credit operation. RFC-3339 specification
        disbursementDates:
          type: array
          minItems: 1
          description: "List providing the Disbursement Dates of the contracted amount.\n"
          items:
            type: string
            format: date
            maxLength: 10
            pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
            example: '2018-01-15'
            description: "Disbursement Date of the contracted amount. RFC-3339 specification.\nIn the case of a release of funds made on D0 but with retroactive reference on D -1, the accounting-correct date would be D -1.\n"
        settlementDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2018-01-15'
          description: "Settlement date of the operation.\n"
        contractAmount:
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: Contracted amount of the operation. Expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places. In cases where this value is not explicit in the product contract, send it as 0.00.
        currency:
          type: string
          pattern: ^(\w{3}){1}$
          maxLength: 3
          description: "Currency of the guarantee amount, according to the ISO-4217 model. e.g. 'BRL'\nAll monetary values reported are represented in the currency currently in force in Brazil\n"
          example: BRL
        dueDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2028-01-15'
          description: "Final due date of the operation. RFC-3339 specification.   \n"
        instalmentPeriodicity:
          type: string
          description: "\"Information regarding the regular periodicity of the installments. (See Enum)\nno regular periodicity, weekly, fortnightly, monthly, bimonthly, quarterly, half-yearly, annual\"\n"
          enum:
          - SEM_PERIODICIDADE_REGULAR
          - SEMANAL
          - QUINZENAL
          - MENSAL
          - BIMESTRAL
          - TRIMESTRAL
          - SEMESTRAL
          - ANUAL
          - OUTROS
          example: SEMANAL
        instalmentPeriodicityAdditionalInfo:
          type: string
          pattern: ^[^\s](.*[^\s])?$
          maxLength: 50
          example: Informações adicionais sobre periodicidade
          description: "Field to complement the information regarding the regular payment periodicity. \n\n[Restriction] Mandatory when the instalmentPeriodicity field is equal to OUTROS.\n"
        firstInstalmentDueDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2018-02-15'
          description: "Due date of the first principal installment.\n"
        CET:
          type: string
          format: double
          maxLength: 13
          minLength: 8
          pattern: ^\d{1,6}\.\d{6}$
          example: '0.290000'
          description: "CET – Total Effective Cost must be expressed in the form of an annual percentage rate and incorporates all charges and expenses levied on credit operations (interest rate, but also fees, taxes, insurance and other expenses charged).\n\nThe entry must respect 6 decimal places, even if they are filled with zeros (percentage representation e.g.: 0.150000.\nThis value represents 15%. The value 1 represents 100%).  \n\nFor the PF (natural person) public the field is mandatory for contracts signed from 2008 onwards, in accordance with CMN Resolution 3,517. For the PJ (legal entity) public the field is mandatory for contracts signed from 2011 onwards, in accordance with CMN Resolution 3,909. Exceptionally, in the cases of rural credit operations, sending the CET field will be mandatory from 2019 onwards, in accordance with CMN Resolution 4,699. The field may be filled with 0.00 in scenarios in which the institution does not have the CET (Total effective cost) information, only for the exceptions listed below:\n- In contracts prior to 2008 (for the PF public);\n- In contracts prior to 2011 (for the PJ public);\n- In contracts prior to 2019 for the cases of rural credit operations (both the PF and PJ publics);\n- Medium or large-sized PJ public.\n\nWhen the CET is dynamically indexed to an indicator not yet published, report the value recalculated with the last official index available on the query date. As soon as the new index is published, the CET must be updated in the next exposure.\n"
        amortizationScheduled:
          type: string
          description: "Amortization system (See Enum):\n- SAC (Constant Amortization System) - This is the one in which the amortization amount remains the same until the end. The interest charged on the installment plan is not included in this calculation.\n- PRICE (French Amortization System) - The installments are fixed from the beginning to the end of the contract. That is, all installments will have the same value, from the first to the last. In the first payments, the greater part of the installment amount corresponds to interest. Over time, the interest rate decreases. As the installment amount is fixed, as the installments go by, the amortization amount increases.\n- SAM (Mixed Amortization System) - Each installment (payment) is the arithmetic mean of the respective installments in the Price System and in the Constant Amortization System (SAC).\n- NO AMORTIZATION SYSTEM\n"
          enum:
          - SAC
          - PRICE
          - SAM
          - SEM_SISTEMA_AMORTIZACAO
          - OUTROS
          example: SAC
        amortizationScheduledAdditionalInfo:
          type: string
          pattern: ^[^\s](.*[^\s])?$
          maxLength: 200
          example: Informações complementares relativa à amortização do tipo 'OUTROS'
          description: "Field to complement the information regarding amortization.\n\n[Restriction] Mandatory when the amortizationScheduled field is equal to OUTROS.\n"
        interestRates:
          type: array
          minItems: 0
          description: "Object that provides the set of information necessary to demonstrate the composition of the remunerative interest rates of the credit Modality.  \nIf the contract does not have interest rates, an empty list must be shared. If the contract has an interest rate with value 0, an object with the value 0 must be shared explicitly.\n"
          items:
            $ref: '#/components/schemas/FinancingsContractInterestRate'
        contractedFees:
          type: array
          minItems: 0
          description: "List providing the information on the fees agreed in the contract.\n"
          items:
            $ref: '#/components/schemas/FinancingsContractFee'
        contractedFinanceCharges:
          type: array
          minItems: 0
          description: List providing the charges agreed in the contract
          items:
            $ref: '#/components/schemas/FinancingsFinanceCharge'
        hasInsuranceContracted:
          type: boolean
          description: Field that identifies whether there is insurance contracted for the Financing, where insurance contracted is true and not contracted is false. Not sending the field means that the institution does not offer this product.
    FinancingsResponseFinancingsWarranties:
      type: object
      required:
      - data
      - links
      - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/FinancingsWarranties'
        links:
          $ref: '#/components/schemas/FinancingsLinks'
        meta:
          $ref: '#/components/schemas/FinancingsMeta'
    FinancingsPayments:
      type: object
      description: Set of information relating to the payments made on an unarranged account overdraft credit operation
      required:
      - contractOutstandingBalance
      - releases
      properties:
        paidInstalments:
          type: number
          maximum: 2147483647
          example: 73
          description: "Total number of installments paid on the contract relating to the Credit Modality reported.\n\n[Restriction] Mandatory for modalities that have installments.\n"
        contractOutstandingBalance:
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: Amount necessary for the customer to settle the debt, that is, this field must be filled with the updated outstanding balance described in the DDC (Documento Descritivo de Crédito).
        releases:
          type: array
          minItems: 0
          description: List of the payments made in the period
          items:
            $ref: '#/components/schemas/FinancingsReleases'
    FinancingsReleases:
      type: object
      description: List of the payments made in the period
      required:
      - paymentId
      - isOverParcelPayment
      - paidDate
      - currency
      - paidAmount
      properties:
        paymentId:
          type: string
          maxLength: 100
          minLength: 1
          example: XlthLXpBLVowLTldW2EtekEtWjAtOVwtXXswLDk5fSQ
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          description: Code or unique identifier provided by the institution to represent the individual payment.
        isOverParcelPayment:
          type: boolean
          example: true
          description: Identifies whether it is an agreed payment (false) or a one-off payment (true).
        instalmentId:
          type: string
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          example: WGx0aExYcEJMVm93TFRsZFcyRXRla0V0V2pBdE9Wd3RYWH
          description: "Installment identifier, under the responsibility of each transmitting institution.  \n[Restriction] Information mandatory when isOverParcelPayment has the value FALSE.\n"
        paidDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2021-05-21'
          description: Effective date of the payment relating to the contract of the credit modality queried, in accordance with the RFC-3339 specification. e.g. 2014-03-19
        currency:
          type: string
          maxLength: 3
          pattern: ^(\w{3}){1}$
          example: BRL
          description: "Currency of the monetary value reported, according to the ISO-4217 model. e.g. 'BRL'.\nAll monetary values reported are represented in the currency currently in force in Brazil.\n"
        paidAmount:
          type: string
          format: double
          pattern: ^-?\d{1,15}\.\d{2,4}$
          maxLength: 21
          minLength: 4
          example: '1000.0400'
          description: "Amount of the payment relating to the  contract of the credit modality queried.\nExpressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.\n"
        overParcel:
          $ref: '#/components/schemas/FinancingsOverParcel'
    FinancingsOverParcel:
      type: object
      description: "Object of the fees and charges that were paid outside the installment.\n\n[Restriction] The information must be sent if it exists.\n"
      required:
      - fees
      - charges
      properties:
        fees:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/FinancingsFeeOverParcel'
          description: List of the fees that were paid outside the installment, only for one-off payments.
        charges:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/FinancingsChargeOverParcel'
          description: List of the charges that were paid outside the installment.
    FinancingsResponseFinancingsContract:
      type: object
      required:
      - data
      - links
      - meta
      properties:
        data:
          $ref: '#/components/schemas/FinancingsContract'
        links:
          $ref: '#/components/schemas/FinancingsLinksSingle'
        meta:
          $ref: '#/components/schemas/FinancingsMetaSingle'
    FinancingsBalloonPayment:
      type: object
      description: List providing the due dates and amount of the non-regular installments  of the contract of the credit modality queried.
      required:
      - dueDate
      - amount
      properties:
        dueDate:
          type: string
          format: date
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          description: Due date of the non-regular installment  falling due of the contract of the credit modality queried, in accordance with the RFC-3339 specification. e.g. 2014-03-19
          maxLength: 10
          example: '2020-01-10'
        amount:
          $ref: '#/components/schemas/FinancingsBalloonPaymentAmount'
    FinancingsFinanceCharge:
      type: object
      description: Set of information relating to the identification of the credit operation
      required:
      - chargeType
      properties:
        chargeType:
          $ref: '#/components/schemas/FinancingsEnumContractFinanceChargeType'
        chargeAdditionalInfo:
          type: string
          maxLength: 50
          description: "Field for additional information.\n\n[Restriction] Mandatory if the 'OUTROS' option is selected in Type of charge agreed in the contract.\n"
          pattern: ^[^\s](.*[^\s])?$
          example: Informações adicionais sobre encargos.
        chargeRate:
          type: string
          format: double
          pattern: ^\d{1}\.\d{6}$
          maxLength: 8
          minLength: 8
          description: "Represents the value of the charge as a percentage agreed in the contract.   \nThe entry must respect 6 decimal places, even if they are filled with zeros(percentage representation e.g.: 0.150000. \nThis value represents 15%. The value 1 represents 100%).\n"
          example: '0.071200'
    FinancingsChargeOverParcel:
      type: object
      required:
      - chargeType
      - chargeAmount
      properties:
        chargeType:
          $ref: '#/components/schemas/FinancingsEnumContractFinanceChargeType'
        chargeAmount:
          type: string
          format: double
          pattern: ^-?\d{1,15}\.\d{2,4}$
          maxLength: 21
          minLength: 4
          example: '1000.0400'
          description: Amount of the payment of the charge paid outside the installment. Expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.
        chargeAdditionalInfo:
          type: string
          pattern: ^[^\s](.*[^\s])?$
          maxLength: 140
          example: Informações adicionais
          description: "Free text field for filling in the additional information regarding the charge.\n\n[Restriction] Mandatory when chargeType is equal to 'OUTROS'.\n"
    FinancingsEnumProductType:
      type: string
      description: "\"Type of the credit modality contracted, in accordance with  circular 4,015 and the description of DOC3040 of the SCR). (See Enum)\nFinancings, Rural financings  and Real estate financings\"\n"
      enum:
      - FINANCIAMENTOS
      - FINANCIAMENTOS_RURAIS
      - FINANCIAMENTOS_IMOBILIARIOS
      example: FINANCIAMENTOS
    FinancingsEnumContractFinanceChargeType:
      type: string
      description: Type of charge agreed in the contract.
      enum:
      - JUROS_REMUNERATORIOS_POR_ATRASO
      - MULTA_ATRASO_PAGAMENTO
      - JUROS_MORA_ATRASO
      - IOF_CONTRATACAO
      - IOF_POR_ATRASO
      - SEM_ENCARGO
      - OUTROS
      example: JUROS_REMUNERATORIOS_POR_ATRASO
    FinancingsContractInterestRate:
      type: object
      description: Object that provides the set of information necessary to demonstrate the composition of the remunerative interest rates of the credit Modality
      required:
      - taxType
      - interestRateType
      - taxPeriodicity
      - calculation
      - referentialRateIndexerType
      properties:
        taxType:
          type: string
          description: "\"Rate Type (see  Enum)\n- NOMINAL (a nominal rate is an interest rate in which the reference unit does not coincide with the compounding time unit. It is always provided in annual terms, and its compounding periods may be daily, monthly, quarterly or semi-annual. e.g. A rate of 12% per year with monthly compounding)\n- EFETIVA (It is the interest rate in which the reference unit coincides with the compounding time unit. As the units of time measurement of the interest rate and of the compounding periods are the same, simple examples such as 1% per month, 60% per year are used)\"\n"
          enum:
          - NOMINAL
          - EFETIVA
          example: EFETIVA
        interestRateType:
          type: string
          description: "\"Interest Type  (see  Enum)\n- SIMPLES (always applied/charged on the initial capital, which is the amount lent/invested. There is no charging of interest on interest accumulated in the previous period(s). Example: on a loan of R$1,000, with a simple interest rate of 8% p.a., lasting 2 years, the total interest will be R$80 in the first year and R$ 80 in the second year. At the end of the contract, the borrower will return the principal and the simple interest of each year: R$1,000+R$80+R$80=R$1,160)\n- COMPOSTO (for each period of the contract (daily, monthly, annual etc.), there is a “new capital” for charging the contracted interest rate. This “new capital” is the sum of the capital and the interest charged in the previous period. Example: on a loan of R$1,000, with a compound interest rate of 8% p.a., lasting 2 years, the total interest will be R$80 in the first year. In the second year, the interest will be added to the capital (R$1,000 + R$ 80 = R$ 1,080), resulting in interest of R$ 86 (8% of R$ 1,080))\"\n"
          enum:
          - SIMPLES
          - COMPOSTO
          example: SIMPLES
        taxPeriodicity:
          type: string
          description: "\"Periodicity of the rate . (See  Enum)\na.m - per month\na.a. - per year\"\n"
          enum:
          - AM
          - AA
          example: AA
        calculation:
          type: string
          description: Calculation basis
          enum:
          - 21/252
          - 30/360
          - 30/365
          example: 21/252
        referentialRateIndexerType:
          type: string
          description: "\"Types of reference rates or indexers, in accordance with Annex 5: Reference rate or Indexer (Indx), of Document 3040\"\n"
          enum:
          - SEM_TIPO_INDEXADOR
          - PRE_FIXADO
          - POS_FIXADO
          - FLUTUANTES
          - INDICES_PRECOS
          - CREDITO_RURAL
          - OUTROS_INDEXADORES
          example: PRE_FIXADO
        referentialRateIndexerSubType:
          type: string
          description: "\"Sub types of reference rates or indexers, in accordance with Annex 5: Reference rate or Indexer (Indx), of Document 3040\"\n"
          enum:
          - SEM_SUB_TIPO_INDEXADOR
          - PRE_FIXADO
          - TR_TBF
          - TJLP
          - LIBOR
          - TLP
          - OUTRAS_TAXAS_POS_FIXADAS
          - CDI
          - SELIC
          - OUTRAS_TAXAS_FLUTUANTES
          - IGPM
          - IPCA
          - IPCC
          - OUTROS_INDICES_PRECO
          - TCR_PRE
          - TCR_POS
          - TRFC_PRE
          - TRFC_POS
          - OUTROS_INDEXADORES
          example: TJLP
        referentialRateIndexerAdditionalInfo:
          type: string
          maxLength: 140
          pattern: ^[^\s](.*[^\s])?$
          example: Informações adicionais
          description: "Free field to complement the information relating to the Type of reference rate or indexer.\n\n[Restriction] Mandatory to complement the information relating to the Type of reference rate or indexer, when the type or subtype OUTRO is selected.\n"
        preFixedRate:
          type: string
          format: double
          maxLength: 9
          minLength: 8
          pattern: ^\d{1,2}\.\d{6}$
          example: '0.600000'
          description: "Fixed rate applied under the credit modality contract. e.g. 0.014500.   \nThe entry must respect 6 decimal places, even if they are filled with zeros(percentage representation e.g.: 0.150000. This value represents 15%. The value 1 represents 100%).\n"
        postFixedRate:
          type: string
          format: double
          maxLength: 9
          minLength: 8
          pattern: ^\d{1,2}\.\d{6}$
          example: '0.550000'
          description: "Post-fixed rate applied under the credit modality contract. e.g. 0.014500.   \nThe entry must respect 6 decimal places, even if they are filled with zeros (percentage representation e.g.: 0.150000. This value represents 15%. The value 1 represents 100%).\n"
        additionalInfo:
          type: string
          maxLength: 1200
          pattern: ^[^\s](.*[^\s])?$
          example: Informações adicionais
          description: "Text with additional information about the composition of the interest rates agreed. \n\n[Restriction] If the institution has the information for sharing, it must be reported.\n"
    FinancingsMetaSingle:
      type: object
      description: Meta information regarding the requested API.
      required:
      - requestDateTime
      properties:
        requestDateTime:
          description: Date and time of the query, in accordance with the RFC-3339 specification, UTC format.
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
    FinancingsContractFee:
      type: object
      description: Object that provides the set of information necessary to demonstrate the composition of the remunerative interest rates of the credit Modality
      required:
      - feeName
      - feeCode
      - feeChargeType
      - feeCharge
      properties:
        feeName:
          type: string
          maxLength: 140
          pattern: ^[^\s](.*[^\s])?$
          description: Name of the Fee agreed
          example: Excesso em Conta
        feeCode:
          type: string
          maxLength: 140
          pattern: ^[^\s](.*[^\s])?$
          description: Identifying acronym of the fee agreed
          example: EXCESSO_CONTA
        feeChargeType:
          type: string
          description: Type of charging for the fee agreed in the contract.
          enum:
          - UNICA
          - POR_PARCELA
          example: UNICA
        feeCharge:
          type: string
          description: "\"Form of charging relating to the fee agreed in the contract. (See Enum)\n- Minimum\n- Maximum\n- Fixed\n- Percentage\"\n"
          enum:
          - MINIMO
          - MAXIMO
          - FIXO
          - PERCENTUAL
          example: MINIMO
        feeAmount:
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: "Monetary value of the fee agreed in the contract. \n\n[Restriction] Mandatory when the form of charging is other than Percentage.\n"
        feeRate:
          type: string
          format: double
          maxLength: 8
          minLength: 8
          pattern: ^\d{1}\.\d{6}$
          description: "It is the value of the fee as a percentage agreed in the contract.\n\n[Restriction] Mandatory when the form of charging is Percentage.\n"
          example: '0.200000'
    FinancingsWarranties:
