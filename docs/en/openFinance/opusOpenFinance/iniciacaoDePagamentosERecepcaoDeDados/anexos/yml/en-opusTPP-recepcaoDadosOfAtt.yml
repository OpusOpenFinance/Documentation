                pattern: '^[^\s](.*[^\s])?$'
                maxLength: 80
                example: Organização A
              companyCnpj:
                type: string
                description: 'Complete record of the CNPJ of the institution responsible for the Registration - the CNPJ corresponds to the alphanumeric representation of the enrollment in the Cadastro de Pessoa Jurídica. Only the characters of the CNPJ must be provided, without a mask'
                maxLength: 14
                pattern: '^[0-9A-Z]{12}[0-9]{2}$'
                example: '21128159000166'
              investmentType:
                $ref: '#/components/schemas/CreditFixedIncomesEnumInvestmentType'
              investmentId:
                type: string
                description: 'Uniquely identifies  the customer''s relationship with the product, maintaining the immutability rules within the transmitting institution.'
                maxLength: 100
                pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
                example: '92792126019929200000000000000000000000000'
            additionalProperties: false
        links:
          $ref: '#/components/schemas/CreditFixedIncomesProductListLinks'
        meta:
          $ref: '#/components/schemas/CreditFixedIncomesMeta'
      additionalProperties: false
    CreditFixedIncomesResponseProductIdentification:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          $ref: '#/components/schemas/CreditFixedIncomesIdentification'
        links:
          $ref: '#/components/schemas/CreditFixedIncomesLinks'
        meta:
          $ref: '#/components/schemas/CreditFixedIncomesMeta'
      additionalProperties: false
    CreditFixedIncomesIdentification:
      type: object
      required:
        - investmentType
        - remuneration
        - issueUnitPrice
        - issueDate
        - dueDate
        - voucherPaymentIndicator
        - purchaseDate
        - taxExemptProduct
      properties:
        issuerInstitutionCnpjNumber:
          type: string
          description: |
            CNPJ of the issuing institution.

            If the institution has the information, sending it will be mandatory.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '11225860000140'
        isinCode:
          type: string
          description: |
            The ISIN code is a universal code that identifies each security or financial instrument, in accordance with ISO Standard 6166. If the transmitting institution has the information, sending this field is mandatory.

            [Restriction] It must be filled in in the cases in which the 'clearingCode' is not filled in.
          maxLength: 12
          pattern: '^[A-Z]{2}([A-Z0-9]){9}\d{1}$'
          example: BRCST4CTF001
        investmentType:
          $ref: '#/components/schemas/CreditFixedIncomesEnumInvestmentType'
        debtorCnpjNumber:
          type: string
          description: |
            CNPJ of the debtor. If the transmitting institution has the information for the CRI and CRA products, sending this field is mandatory.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '11225860000140'
        debtorName:
          type: string
          description: |
            Name of the debtor. If the transmitting institution has the information for the CRI and CRA products, sending this field is mandatory.
          pattern: '[\w\W\s]*'
          maxLength: 70
          example: Roberto Marino
        taxExemptProduct:
          $ref: '#/components/schemas/CreditFixedIncomesEnumTaxExemptProduct'
        remuneration:
          $ref: '#/components/schemas/CreditFixedIncomesRemuneration'
        issueUnitPrice:
          type: object
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              description: Amount related to the object.
              maxLength: 24
              pattern: '^\d{1,15}\.\d{2,8}$'
              example: '1000.000004'
            currency:
              $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
        issueDate:
          type: string
          format: date
          description: Issue date of the security
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-16'
        dueDate:
          type: string
          format: date
          description: Maturity date of the security
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
        voucherPaymentIndicator:
          $ref: '#/components/schemas/CreditFixedIncomesEnumVoucherPaymentIndicator'
        voucherPaymentPeriodicity:
          $ref: '#/components/schemas/CreditFixedIncomesEnumVoucherPaymentPeriodicity'
        voucherPaymentPeriodicityAdditionalInfo:
          type: string
          description: |
            Additional information on the coupon payment periodicity
            [Restriction] Mandatory field for participants when there is 'Outros' in the 'voucherPaymentPeriodicity' field.
          maxLength: 50
          pattern: '[\w\W\s]*'
          example: Diária
        clearingCode:
          type: string
          description: |
            Registration code of the asset at the Clearing house. If the transmitting institution has the information, sending this field is mandatory.

            [Restriction] It must be filled in in the cases in which the 'isinCode' is not filled in.
          maxLength: 30
          pattern: '[\w\W-]*'
          example: CDB421GPXXX
        purchaseDate:
          type: string
          format: date
          description: Customer's acquisition date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
        gracePeriodDate:
          type: string
          format: date
          description: |
            Date until which the customer will not be able to redeem their investment early.

            If the institution has the information, sending it will be mandatory.
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-16'
      additionalProperties: false
    CreditFixedIncomesEnumInvestmentType:
      type: string
      description: 'Specification of the asset in question (Debentures, CRI or CRA).'
      enum:
        - DEBENTURES
        - CRI
        - CRA
      example: CRI
    CreditFixedIncomesEnumTaxExemptProduct:
      type: string
      description: Indicator of a tax-incentivized product
      enum:
        - SIM
        - NAO
      example: SIM
    CreditFixedIncomesEnumVoucherPaymentIndicator:
      type: string
      description: |
        Indication of whether there is coupon payment
          1. Yes
          2. No
      enum:
        - SIM
        - NAO
      example: SIM
    CreditFixedIncomesEnumVoucherPaymentPeriodicity:
      type: string
      description: |
        If there is coupon payment, describe the periodicity (monthly, quarterly, semiannual, annual, irregular and others)
      enum:
        - MENSAL
        - TRIMESTRAL
        - SEMESTRAL
        - ANUAL
        - IRREGULAR
        - OUTROS
      example: MENSAL
    CreditFixedIncomesRemuneration:
      type: object
      required:
        - indexer
      properties:
        preFixedRate:
          type: string
          description: |
            Value of the issue rate of the contract.
            [Restriction] Mandatory field for participants when there is 'PRE_FIXADO' in the 'indexer' field or when it concerns a product with hybrid remuneration.
          maxLength: 9
          pattern: '^-?\d{1}\.\d{6}$'
          example: '0.300000'
        postFixedIndexerPercentage:
          type: string
          description: |
            Percentage of the issue indexer of the contract.
            [Restriction] Mandatory field for participants when the 'indexer' field is filled in with a value other than 'PRE_FIXADO' or when it concerns a product with hybrid remuneration.
          maxLength: 9
          pattern: '^-?\d{1}\.\d{6}$'
          example: '1.100000'
        rateType:
          $ref: '#/components/schemas/CreditFixedIncomesEnumRateType'
        ratePeriodicity:
          $ref: '#/components/schemas/CreditFixedIncomesEnumRatePeriodicity'
        calculation:
          $ref: '#/components/schemas/CreditFixedIncomesEnumCalculation'
        indexer:
          $ref: '#/components/schemas/CreditFixedIncomesEnumIndexer'
        indexerAdditionalInfo:
          type: string
          description: |
            Additional information on the indexer
            [Restriction] Mandatory field for participants when there is 'Outros' in the 'indexer' field.
          pattern: '[\w\W\s]*'
          maxLength: 50
          example: Dólar
    CreditFixedIncomesEnumRateType:
      type: string
      description: |
        Type of the remuneration rate (linear or exponential).

        If the institution has the information, sending it will be mandatory.
      enum:
        - LINEAR
        - EXPONENCIAL
      example: LINEAR
    CreditFixedIncomesEnumRatePeriodicity:
      type: string
      description: |
        Periodicity of the remuneration rate (monthly, annual, daily, semiannual).

        If the institution has the information, sending it will be mandatory.
      enum:
        - MENSAL
        - ANUAL
        - DIARIO
        - SEMESTRAL
      example: MENSAL
    CreditFixedIncomesEnumCalculation:
      type: string
      description: |
        Calculation basis (business days or calendar days).

        If the institution has the information, sending it will be mandatory.
      enum:
        - DIAS_UTEIS
        - DIAS_CORRIDOS
      example: DIAS_CORRIDOS
    CreditFixedIncomesEnumIndexer:
      type: string
      description: 'Index used as a reference for the adjustment of the profitability and/or earnings of the asset (CDI, DI, TR, IPCA, IGP_M, IGP_DI, INPC, BCP, TLC, SELIC, PRE_FIXADO and OUTROS)'
      enum:
        - CDI
        - DI
        - TR
        - IPCA
        - IGP_M
        - IGP_DI
        - INPC
        - BCP
        - TLC
        - SELIC
        - PRE_FIXADO
        - OUTROS
      example: CDI
    CreditFixedIncomesCurrencyCode:
      type: string
      description: 'Currency of the monetary value, following the ISO-4217 model.'
      maxLength: 3
      pattern: '^[A-Z]{3}$'
      example: BRL
