    InvoiceFinancingsContract:
      type: object
      required:
        - contractNumber
        - ipocCode
        - productName
        - productType
        - productSubType
        - contractDate
        - contractAmount
        - instalmentPeriodicity
        - CET
        - amortizationScheduled
        - interestRates
        - contractedFees
        - contractedFinanceCharges
      properties:
        contractNumber:
          type: string
          maxLength: 100
          pattern: '^[\w\W]{1,100}$'
          example: '1324926521496'
          description: Contract number given by the contracting institution.
        ipocCode:
          type: string
          maxLength: 67
          minLength: 22
          pattern: '^[\w\W]{22,67}$'
          description: |
            Standardized contract number - IPOC (Standardized Identification of the Credit Operation). According to DOC 3040, composed of:
            - **CNPJ of the institution:** 8 (eight) initial positions;
            - **Modality of the operation:** 4 (four) positions;
            - **Type of the customer:** 1 (one) position( 1 = natural person - CPF, 2= legal entity – CNPJ, 3 = natural person abroad, 4 = legal entity abroad, 5 = natural person without a CPF and 6 = legal entity without a CNPJ);
            - **Code of the customer:** The number of positions varies according to the type of the customer:
              1. For natural person customers with a CPF (customer type = 1), report the 11 (eleven) positions of the CPF;
              2. For legal entity customers with a CNPJ (customer type = 2), report the 8 (eight) initial positions of the CNPJ;
              3. For the other customers (customer types 3, 4, 5 and 6), report 14 (fourteen) positions with a complement of zeros on the left if the identification is of a smaller size;
            - **Code of the contract:** 1 (one) up to 40 (forty) positions, without a complement of characters.
          example: '92792126019929279212650822221989319252576'
        productName:
          type: string
          maxLength: 140
          pattern: '^[^\s](.*[^\s])?$'
          example: AD
          description: |
            Name/Identification of the name of the Credit Operation Modality disclosed to the customer
        productType:
          $ref: '#/components/schemas/EnumContractProductTypeInvoiceFinancings'
        productSubType:
          $ref: '#/components/schemas/EnumContractProductSubTypeInvoiceFinancings'
        contractDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-01-05'
          description: Contracting date of the credit operation. RFC-3339 specification
        disbursementDates:
          type: array
          minItems: 1
          description: |
            List providing the Disbursement Dates of the contracted amount.
          items:
            type: string
            format: date
            maxLength: 10
            pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
            example: '2018-01-15'
            description: |
              Disbursement Date of the contracted amount. RFC-3339 specification.
              In the case of a release of funds made on D0 but with retroactive reference on D -1, the accounting-correct date would be D -1.
        settlementDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-01-15'
          description: |
            Settlement date of the operation.
        contractAmount:
          type: string
          format: double
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: Contracted amount of the operation. Expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places. In cases where this value is not explicit in the product contract, send it as 0.00.
        currency:
          type: string
          maxLength: 3
          pattern: '^(\w{3}){1}$'
          example: BRL
          description: |
            Currency of the guarantee amount, according to the ISO-4217 model. e.g. 'BRL'
            All monetary values reported are represented in the currency currently in force in Brazil
        dueDate:
          type: string
          format: date
          maxLength: 10
          minLength: 2
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2028-01-15'
          description: Final due date of the operation. RFC-3339 specification
        instalmentPeriodicity:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractInstalmentPeriodicity'
        instalmentPeriodicityAdditionalInfo:
          type: string
          pattern: '^[^\s](.*[^\s])?$'
          maxLength: 50
          example: Informações adicionais sobre periodicidade
          description: |
            Mandatory field to complement the information regarding the regular payment periodicity when it has the OUTROS option.
        firstInstalmentDueDate:
          type: string
          format: date
          maxLength: 10
          minLength: 2
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
          description: |
            Due date of the first principal installment.
        CET:
          type: string
          format: double
          maxLength: 13
          minLength: 8
          example: '0.290000'
          pattern: '^\d{1,6}\.\d{6}$'
          description: |
            CET – Total Effective Cost must be expressed as an annual percentage rate and incorporates all charges and expenses levied on credit operations (interest rate, but also fees, taxes, insurance and other charges levied).

            The value must be filled in respecting the 6 decimal places, even if they are filled with zeros (percentage representation e.g.: 0.150000. This value represents 15%. The value 1 represents 100%).

            For the PF (natural person) audience the field is mandatory for contracts signed from 2008 onwards, in accordance with CMN Resolution 3,517. For the PJ (legal entity) audience the field is mandatory for contracts signed from 2011 onwards, in accordance with CMN Resolution 3,909. The field may be filled in with 0.00 in scenarios in which the institution does not have the CET (Total effective cost) information, only for the exceptions listed below:
            - For contracts prior to 2008 (for the PF audience);
            - For contracts prior to 2011 (for the PJ audience);
            - Medium-sized or large PJ audience.
        amortizationScheduled:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractAmortizationScheduled'
        amortizationScheduledAdditionalInfo:
          type: string
          pattern: '^[^\s](.*[^\s])?$'
          maxLength: 200
          example: Informações complementares relativa à amortização do tipo 'OUTROS'
          description: |
            Mandatory field to complement the information regarding amortization when the OUTROS option is selected.
        interestRates:
          type: array
          minItems: 0
          description: |
            Object that provides the set of information necessary to demonstrate the composition of the remunerative interest rates of the credit Modality.
            If the contract does not have interest rates, an empty list must be shared. If the contract has an interest rate with value 0, an object with the value 0 must be shared explicitly.
          items:
            $ref: '#/components/schemas/InvoiceFinancingsContractInterestRate'
        contractedFees:
          type: array
          description: List providing the information on the fees agreed in the contract.
          items:
            $ref: '#/components/schemas/InvoiceFinancingsContractedFee'
          minItems: 0
        contractedFinanceCharges:
          type: array
          description: List providing the charges agreed in the contract
          items:
            $ref: '#/components/schemas/InvoiceFinancingsFinanceCharge'
          minItems: 0
        hasInsuranceContracted:
          type: boolean
          description: Field that identifies whether there is insurance contracted for the Discounted Credit Right, where contracted insurance is true and not contracted is false. Not sending the field means that the institution does not offer this product.
    InvoiceFinancingsContractedWarranty:
      type: object
      description: Set of information relating to the guarantees that secure the credit operation contracted
      required:
        - currency
        - warrantyType
        - warrantySubType
        - warrantyAmount
      properties:
        currency:
          type: string
          pattern: '^(\w{3}){1}$'
          maxLength: 3
          description: 'Currency relating to the amount of the guarantee, according to the ISO-4217 model. e.g. ''BRL''. All the reported monetary values are represented in the currency in force in Brazil'
          example: BRL
        warrantyType:
          $ref: '#/components/schemas/InvoiceFinancingsEnumWarrantyType'
        warrantySubType:
          $ref: '#/components/schemas/InvoiceFinancingsEnumWarrantySubType'
        warrantyAmount:
          type: string
          format: double
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: |
            Original value of the guarantee. Expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.

            [Restriction]  For cases in which warrantyType is equal to "GARANTIA_FIDEJUSSORIA" the value of the guarantee corresponds to a percentage of the total guaranteed amount.
            Therefore, the cases of personal guarantee for which it is not possible to determine a monetary value for the guarantee must be filled in with 0.00.
    InvoiceFinancingsContractInterestRate:
      type: object
      description: Object that provides the set of information necessary to demonstrate the composition of the remunerative interest rates of the credit Modality
      required:
        - taxType
        - interestRateType
        - taxPeriodicity
        - calculation
        - referentialRateIndexerType
      properties:
        taxType:
          type: string
          description: |
            "Rate Type (see  Enum)
            - NOMINAL (a nominal rate is an interest rate in which the reference unit does not coincide with the compounding time unit. It is always provided in annual terms, and its compounding periods may be daily, monthly, quarterly or semi-annual. e.g. A rate of 12% per year with monthly compounding)
            - EFETIVA (It is the interest rate in which the reference unit coincides with the compounding time unit. As the units of time measurement of the interest rate and of the compounding periods are the same, simple examples such as 1% per month, 60% per year are used)"
          enum:
            - NOMINAL
            - EFETIVA
          example: EFETIVA
        interestRateType:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractInterestRateType'
        taxPeriodicity:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractTaxPeriodicity'
        calculation:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractCalculation'
        referentialRateIndexerType:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractReferentialRateIndexerType'
        referentialRateIndexerSubType:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractReferentialRateIndexerSubType'
        referentialRateIndexerAdditionalInfo:
          type: string
          description: |
            Free field to complement the information relating to the Type of reference rate or indexer.
            [Restriction] Mandatory to complement the information relating to the Type of reference rate or indexer, when the type or subtype OUTRO is selected.
          maxLength: 140
          pattern: '^[^\s](.*[^\s])?$'
          example: Informações adicionais de Indexador ou tipo de taxa referencial
        preFixedRate:
          type: string
          format: double
          description: |
            Pre-fixed rate applied under the credit modality contract.
            e.g. 0.014500. The value must be filled in respecting the 6 decimal places, even if they are filled with zeros(percentage representation e.g.: 0.150000.
            This value represents 15%. The value 1 represents 100%).
          maxLength: 9
          minLength: 8
          example: '0.600000'
          pattern: '^\d{1,2}\.\d{6}$'
        postFixedRate:
          type: string
          format: double
          description: |
            Post-fixed rate applied under the credit modality contract.
            e.g. 0.014500. The value must be filled in respecting the 6 decimal places, even if they are filled with zeros (percentage representation e.g.: 0.150000.
            This value represents 15%. The value 1 represents 100%).
          maxLength: 9
          minLength: 8
          example: '0.550000'
          pattern: '^\d{1,2}\.\d{6}$'
        additionalInfo:
          type: string
          maxLength: 1200
          description: |
            Text with additional information about the composition of the agreed interest rates.

            [Restriction] If the institution has the information available for sharing, it must be provided.
          pattern: '^[^\s](.*[^\s])?$'
          example: Informações adicionais
    InvoiceFinancingsFinanceCharge:
      type: object
      description: Set of information relating to the identification of the credit operation
      required:
        - chargeType
      properties:
        chargeType:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractFinanceChargeType'
        chargeAdditionalInfo:
          type: string
          maxLength: 50
          description: |
            Field for additional information.

            [Restriction] Mandatory if the 'OUTROS' option is selected in Type of charge agreed in the contract.
          pattern: '^[^\s](.*[^\s])?$'
          example: Informações adicionais sobre encargos
        chargeRate:
          type: string
          format: double
          pattern: '^\d{1}\.\d{6}$'
          maxLength: 8
          minLength: 8
          description: |
            Represents the value of the charge as a percentage agreed in the contract.
            The value must be filled in respecting the 6 decimal places, even if they are filled with zeros
            (percentage representation e.g.: 0.150000. This value represents 15%. The value 1 represents 100%).
          example: '0.071200'
    InvoiceFinancingsBalloonPayment:
      type: object
      description: Set of information relating to the non-regular installments of the queried credit modality contract
      required:
        - dueDate
        - amount
      properties:
        dueDate:
          description: 'Due date of the non-regular installment  falling due of the contract of the credit modality queried, in accordance with the RFC-3339 specification. e.g. 2014-03-19'
          type: string
          maxLength: 10
          minLength: 2
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
        amount:
          $ref: '#/components/schemas/InvoiceFinancingsBallonPaymentAmount'
    InvoiceFinancingsInstalments:
      type: object
      description: Set of information regarding the installments / payments of the contracted credit operation
      required:
        - dueInstalments
        - pastDueInstalments
        - typeContractRemaining
        - typeNumberOfInstalments
        - paidInstalments
      properties:
        typeNumberOfInstalments:
          type: string
          description: Type of total term of the contract relating to the reported credit modality.
          enum:
            - DIA
            - SEMANA
            - MES
            - ANO
            - SEM_PRAZO_TOTAL
          example: MES
        totalNumberOfInstalments:
          type: number
          maximum: 999999
          example: 130632
          description: |
            Total Term according to the type (day, week, month, year) relating to the Credit Modality reported.

            [Restriction] It must mandatorily be filled if typeNumberOfInstalments is other than SEM_PRAZO_TOTAL.
        typeContractRemaining:
          type: string
          enum:
            - DIA
            - SEMANA
            - MES
            - ANO
            - SEM_PRAZO_REMANESCENTE
          description: |
            Type of remaining term of the contract relating to the reported credit modality.
        contractRemainingNumber:
          type: number
          maximum: 999999
          description: |
            Remaining Term according to the type (day, week, month, year) relating to the reported Credit Modality.

            [Restriction] It must mandatorily be filled in if the typeContractRemaining is different from SEM_PRAZO_REMANESCENTE.
          example: 14600
        paidInstalments:
          type: number
          description: 'Number of installments paid. (In the case of modalities that do not have installments, the number of installments is equal to zero)'
          maximum: 999999
          example: 73
        dueInstalments:
          type: number
          maximum: 999999
          description: 'Number of installments due in the future.(In the case of modalities that do not have installments, the number of installments is equal to zero)'
          example: 57
        pastDueInstalments:
          type: number
          maximum: 999999
          description: 'Number of overdue installments. (In the case of modalities that do not have installments, the number of installments is equal to zero)'
          example: 73
        balloonPayments:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceFinancingsBalloonPayment'
          minItems: 1
          description: List that provides the due dates and the amount of the non-regular installments of the contract of the queried credit modality
    InvoiceFinancingsContractData:
      type: object
      description: Set of information on invoice financing held by the customer at the transmitting institution and for which they have granted consent
      required:
        - contractId
        - brandName
        - companyCnpj
        - productType
        - productSubType
        - ipocCode
      properties:
        contractId:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          maxLength: 100
          minLength: 1
          example: '92792126019929279212650822221989319252576'
          description: 'Uniquely identifies the contract of the customer''s credit operation, maintaining the immutability rules within the transmitting institution.'
        brandName:
          type: string
          description: 'Name of the Brand reported by the participant in Open Finance. It is recommended to use, whenever possible, the same brand name assigned in the directory field Customer Friendly Server Name (Authorisation Server).'
          pattern: '^[^\s](.*[^\s])?$'
          maxLength: 80
          example: Organização A
        companyCnpj:
          type: string
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          description: 'Complete CNPJ record of the institution responsible for the Registry - the CNPJ corresponds to the alphanumeric representation of the registration in the Legal Entity Registry (Cadastro de Pessoa Jurídica). Only the CNPJ characters must be provided, without a mask.'
          maxLength: 14
          example: '21128159000166'
        productType:
          $ref: '#/components/schemas/EnumContractProductTypeInvoiceFinancings'
        productSubType:
          $ref: '#/components/schemas/EnumContractProductSubTypeInvoiceFinancings'
        ipocCode:
          type: string
          maxLength: 67
          minLength: 22
          pattern: '^[\w\W]{22,67}$'
          description: |
            Standardized contract number - IPOC (Standardized Identification of the Credit Operation). According to DOC 3040, composed of:
            - **CNPJ of the institution:** 8 (eight) initial positions;
            - **Modality of the operation:** 4 (four) positions;
            - **Type of the customer:** 1 (one) position( 1 = natural person - CPF, 2= legal entity – CNPJ, 3 = natural person abroad, 4 = legal entity abroad, 5 = natural person without a CPF and 6 = legal entity without a CNPJ);
            - **Code of the customer:** The number of positions varies according to the type of the customer:
              1. For natural person customers with a CPF (customer type = 1), report the 11 (eleven) positions of the CPF;
              2. For legal entity customers with a CNPJ (customer type = 2), report the 8 (eight) initial positions of the CNPJ;
              3. For the other customers (customer types 3, 4, 5 and 6), report 14 (fourteen) positions with a complement of zeros on the left if the identification is of a smaller size;
            - **Code of the contract:** 1 (one) up to 40 (forty) positions, without a complement of characters.
          example: '92792126019929279212650822221989319252576'
    InvoiceFinancingsPayments:
      type: object
      description: Set of information on the payments relating to the contracted discounted credit rights operations
      required:
        - contractOutstandingBalance
        - releases
      properties:
        paidInstalments:
          type: number
          maximum: 999
          example: 73
          description: Total number of installments paid on the contract relating to the Credit Modality reported.
        contractOutstandingBalance:
          type: string
          format: double
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: Amount necessary for the customer to settle the debt, that is, this field must be filled with the updated outstanding balance described in the DDC (Documento Descritivo de Crédito).
        releases:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/InvoiceFinancingsReleases'
          description: List of the payments made in the period.
    InvoiceFinancingsReleases:
      type: object
      description: List of the payments made in the period
      required:
        - isOverParcelPayment
        - paidDate
        - currency
        - paidAmount
      properties:
        paymentId:
          type: string
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: XlthLXpBLVowLTldW2EtekEtWjAtOVwtXXswLDk5fSQ
          description: Payment identifier under the responsibility of each transmitting institution.
        isOverParcelPayment:
          type: boolean
          example: true
          description: Identifies whether it is an agreed payment (false) or a one-off payment (true).
        instalmentId:
          type: string
          maxLength: 100
          pattern: '^[^\s](.*[^\s])?$'
          example: '15'
          description: |
            Installment identifier, under the responsibility of each transmitting institution.
            [Restriction] Information is mandatory when isOverParcelPayment has the value FALSE.
        paidDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: 'Effective date of the payment relating to the contract of the credit modality queried, in accordance with the RFC-3339 specification. e.g. 2014-03-19'
        currency:
          type: string
          maxLength: 3
          pattern: '^(\w{3}){1}$'
          example: BRL
          description: |
            Currency relating to the monetary value provided, according to the ISO-4217 model. e.g. ''BRL'''.
            All monetary values provided are represented in the currency in force in Brazil.
        paidAmount:
          type: string
          format: double
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '1000.0400'
          description: |
            Amount of the payment relating to the  contract of the credit modality queried.
            Expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.
        overParcel:
          type: object
          description: |
            Object of the fees and charges that were paid outside the installment.

            [Restriction] The information must be sent if it exists.
          required:
            - fees
            - charges
          properties:
            fees:
              type: array
              minItems: 0
              items:
                $ref: '#/components/schemas/InvoiceFinancingsFeeOverParcel'
              description: 'List of the fees that were paid outside the installment, only for one-off payments.'
            charges:
              type: array
              minItems: 0
              items:
                $ref: '#/components/schemas/InvoiceFinancingsChargeOverParcel'
              description: List of the charges that were paid outside the installment.
    InvoiceFinancingsFeeOverParcel:
      type: object
      required:
        - feeName
        - feeCode
        - feeAmount
      properties:
        feeName:
          type: string
          maxLength: 140
          minLength: 2
          pattern: '[\w\W\s]+'
          description: |
            Name of the Fee agreed.
          example: Excesso em Conta
        feeCode:
          type: string
          maxLength: 140
          minLength: 2
          pattern: '[\w\W\s]+'
          description: |
            Identifying acronym of the fee agreed.
          example: EXCESSO_CONTA
        feeAmount:
          type: string
          format: double
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '1000.0400'
          description: |
            Monetary value of the fee agreed in the contract.

            Expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.
    InvoiceFinancingsChargeOverParcel:
      type: object
      required:
        - chargeType
        - chargeAmount
      properties:
        chargeType:
          type: string
          description: Type of charge agreed in the contract.
          enum:
            - JUROS_REMUNERATORIOS_POR_ATRASO
            - MULTA_ATRASO_PAGAMENTO
            - JUROS_MORA_ATRASO
            - IOF_CONTRATACAO
            - IOF_POR_ATRASO
            - SEM_ENCARGO
            - OUTROS
          example: JUROS_REMUNERATORIOS_POR_ATRASO
        chargeAdditionalInfo:
          type: string
          description: |
            Free text field for filling in the additional information regarding the charge.

            [Restriction] Mandatory when chargeType is equal to 'OUTROS'.
          pattern: '^[^\s](.*[^\s])?$'
          example: Informações adicionais
          maxLength: 140
        chargeAmount:
          type: string
          format: double
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '1000.0400'
          description: Amount of the payment of the charge paid outside the installment. Expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.
    InvoiceFinancingsLinks:
      type: object
      description: References to other resources of the requested API.
      required:
        - self
      properties:
        self:
          type: string
          format: url
          maxLength: 4048
          description: Full URI that generated the current response.
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        first:
          type: string
          format: url
          maxLength: 4048
          description: URI of the first page that originated this list of results. Restriction - Mandatory when it is not the first page of the response
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        prev:
          type: string
          format: url
          maxLength: 4048
          description: "URI of the previous page of this list of results. Restriction - Mandatory when it is not the first page of the response"
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        next:
          type: string
          format: url
          maxLength: 4048
          description: URI of the next page of this list of results. Restriction - Mandatory when it is not the last page of the response
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        last:
          type: string
          format: url
          maxLength: 4048
          description: URI of the last page of this list of results. Restriction - Mandatory when it is not the last page of the response
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
    InvoiceFinancingsLinksSingle:
      type: object
      description: References to other resources of the requested API.
      required:
        - self
      properties:
        self:
          type: string
          format: url
          maxLength: 4048
          description: Full URI that generated the current response.
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
    InvoiceFinancingsMeta:
      type: object
      description: Meta information regarding the requested API.
      required:
        - totalRecords
        - totalPages
        - requestDateTime
      properties:
        totalRecords:
          type: integer
          format: int32
          description: Total number of records in the result
          example: 1
        totalPages:
          type: integer
          format: int32
          description: Total number of pages in the result
          example: 1
        requestDateTime:
          description: 'Date and time of the query, in accordance with the RFC-3339 specification, UTC format.'
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
    InvoiceFinancingsMetaSingle:
      type: object
      description: Meta information regarding the requested API.
      required:
        - requestDateTime
      properties:
        requestDateTime:
          description: 'Date and time of the query, in accordance with the RFC-3339 specification, UTC format.'
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
    BankFixedIncomesResponseInvestmentList:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            type: object
            description: List of Bank Fixed Income securities held by the customer at the transmitting institution and for which they have granted consent
            required:
              - brandName
              - companyCnpj
              - investmentType
              - investmentId
            properties:
              brandName:
                type: string
                description: 'Name of the Brand reported by the participant in Open Finance. It is recommended to use, whenever possible, the same brand name assigned in the directory field Customer Friendly Server Name (Authorisation Server).'
                pattern: '^[^\s](.*[^\s])?$'
                example: Organização A
                maxLength: 80
              companyCnpj:
                type: string
                description: 'Complete CNPJ record of the institution responsible for the Registry - the CNPJ corresponds to the alphanumeric representation of the registration in the Legal Entity Registry (Cadastro de Pessoa Jurídica). Only the CNPJ characters must be provided, without a mask.'
                maxLength: 14
                pattern: '^[0-9A-Z]{12}[0-9]{2}$'
                example: '21281590001660'
              investmentType:
                $ref: '#/components/schemas/BankFixedIncomesEnumInvestmentType'
              investmentId:
                type: string
                description: 'Uniquely identifies  the customer''s relationship with the product, maintaining the immutability rules within the transmitting institution.'
                maxLength: 100
                pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
                example: '92792126019929200000000000000000000000000'
            additionalProperties: false
        links:
          $ref: '#/components/schemas/BankFixedIncomesLinks'
        meta:
          $ref: '#/components/schemas/BankFixedIncomesMeta'
      additionalProperties: false
    BankFixedIncomesResponseProductIdentification:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          $ref: '#/components/schemas/BankFixedIncomesIdentifyProduct'
        links:
          $ref: '#/components/schemas/BankFixedIncomesLinks'
        meta:
          $ref: '#/components/schemas/BankFixedIncomesMeta'
      additionalProperties: false
    BankFixedIncomesIdentifyProduct:
      type: object
      required:
        - issuerInstitutionCnpjNumber
        - investmentType
        - remuneration
        - issueUnitPrice
        - dueDate
        - issueDate
        - purchaseDate
        - gracePeriodDate
      properties:
        issuerInstitutionCnpjNumber:
          type: string
          description: CNPJ of the issuing institution.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '11225860000140'
        isinCode:
          type: string
          description: |
            ISIN code of the issue, ISIN code of the product, code of the issuer (optional field): universal code that identifies each security or financial instrument, in accordance with ISO Standard 6166
          maxLength: 12
          minLength: 12
          pattern: '^[A-Z]{2}([A-Z0-9]){9}\d{1}$'
          example: BRCST4CTF001
        investmentType:
          $ref: '#/components/schemas/BankFixedIncomesEnumInvestmentType'
        remuneration:
          $ref: '#/components/schemas/BankFixedIncomesRemuneration'
        issueUnitPrice:
          type: object
          description: Unit issue price of the security.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              maxLength: 24
              pattern: '^\d{1,15}\.\d{2,8}$'
              example: '1000.000004'
              description: Amount related to the object.
            currency:
              $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
        dueDate:
          type: string
          format: date
          maxLength: 10
          minLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
          description: Maturity date of the security.
        issueDate:
          type: string
          format: date
          maxLength: 10
          minLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-16'
          description: Issue date of the security.
        clearingCode:
          type: string
          maxLength: 30
          pattern: '[\w\W-]*'
          example: CDB421GPXXX
          description: Registration code of the asset at the clearing house.
        purchaseDate:
          type: string
          format: date
          maxLength: 10
          minLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
          description: Customer's acquisition date.
        gracePeriodDate:
          type: string
          format: date
          maxLength: 10
          minLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-16'
          description: Date until which the customer will not be able to redeem their investment early.
      additionalProperties: false
    BankFixedIncomesEnumInvestmentType:
      type: string
      description: 'Specification of the asset in question (CDB, RDB, LCI or LCA)'
      enum:
        - CDB
        - RDB
        - LCI
        - LCA
      example: CDB
    BankFixedIncomesRemuneration:
      type: object
      description: Object for detailing the remuneration of the security.
      required:
        - rateType
        - ratePeriodicity
        - calculation
        - indexer
      properties:
        preFixedRate:
          type: string
          format: double
          pattern: '^-?\d{1}\.\d{6}$'
          maxLength: 9
          minLength: 8
          example: '0.300000'
          description: |
            Pre-fixed remuneration rate of the security issue. e.g. 0.014500.

            [Restriction] Mandatory field for participants when there is 'PRE_FIXADO' in the 'indexer' field or when it concerns a product with hybrid remuneration.
        postFixedIndexerPercentage:
          type: string
          format: double
          pattern: '^-?\d{1}\.\d{6}$'
          maxLength: 9
          minLength: 8
          example: '1.100000'
          description: |
            Percentage of the post-fixed indexer of the security issue. e.g. 0.014500.

            [Restriction] Mandatory field for participants when the 'indexer' field is filled in with a value other than 'PRE_FIXADO' or when it concerns a product with hybrid remuneration.
        rateType:
          $ref: '#/components/schemas/BankFixedIncomesEnumRateType'
        ratePeriodicity:
          $ref: '#/components/schemas/BankFixedIncomesEnumRatePeriodicity'
        calculation:
          $ref: '#/components/schemas/BankFixedIncomesEnumCalculation'
        indexer:
          $ref: '#/components/schemas/BankFixedIncomesEnumIndexer'
        indexerAdditionalInfo:
          type: string
          description: |
            Additional information on the indexer

            [Restriction] Mandatory field for participants when there is 'Outros' in the 'indexer' field.
          maxLength: 50
          example: Dólar
          pattern: '[\w\W\s]*'
      additionalProperties: false
    BankFixedIncomesEnumRateType:
      type: string
      description: 'Type of the remuneration rate (linear or exponential)'
      enum:
        - LINEAR
        - EXPONENCIAL
      example: LINEAR
    BankFixedIncomesEnumRatePeriodicity:
      type: string
      description: 'Frequency of the remuneration rate (monthly, annual, daily, semi-annual)'
      enum:
        - MENSAL
        - ANUAL
        - DIARIO
        - SEMESTRAL
      example: MENSAL
    BankFixedIncomesEnumCalculation:
      type: string
      description: 'Calculation basis (business days or calendar days)'
      enum:
        - DIAS_UTEIS
        - DIAS_CORRIDOS
      example: DIAS_CORRIDOS
    BankFixedIncomesEnumIndexer:
      type: string
      description: 'Index used as a reference for the adjustment of the profitability and/or earnings of the asset (CDI, DI , TR, IPCA, IGP_M, IGP_DI, INPC, BCP, TLC, SELIC, PRE_FIXADO and OUTROS)'
      enum:
        - CDI
        - DI
        - TR
        - IPCA
        - IGP_M
        - IGP_DI
        - INPC
        - BCP
        - TLC
        - SELIC
        - PRE_FIXADO
        - OUTROS
      example: CDI
    BankFixedIncomesCurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      maxLength: 3
      description: 'Currency of the monetary value, following the ISO-4217 model.'
      example: BRL
    BankFixedIncomesLinks:
      type: object
      description: References to other resources of the requested API.
      required:
        - self
      properties:
        self:
          type: string
          format: url
          maxLength: 4048
          description: Full URI that generated the current response.
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        first:
          type: string
          format: url
          maxLength: 4048
          description: URI of the first page that originated this list of results. Restriction - Mandatory when it is not the first page of the response
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        prev:
          type: string
          format: url
          maxLength: 4048
          description: "URI of the previous page of this list of results. Restriction - Mandatory when it is not the first page of the response"
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        next:
          type: string
          format: url
          maxLength: 4048
          description: URI of the next page of this list of results. Restriction - Mandatory when it is not the last page of the response
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        last:
          type: string
          format: url
          maxLength: 4048
          description: URI of the last page of this list of results. Restriction - Mandatory when it is not the last page of the response.
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
    BankFixedIncomesTransactionsLinks:
      type: object
      description: References to other resources of the requested API.
      required:
        - self
      properties:
        self:
          type: string
          format: url
          maxLength: 4048
          description: Full URI that generated the current response.
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        first:
          type: string
          format: url
          maxLength: 4048
          description: URI of the first page that originated this list of results. Restriction - Mandatory when it is not the first page of the response
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        prev:
          type: string
          format: url
          maxLength: 4048
          description: "URI of the previous page of this list of results. Restriction - Mandatory when it is not the first page of the response"
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        next:
          type: string
          format: url
          maxLength: 4048
          description: URI of the next page of this list of results. Restriction - Mandatory when it is not the last page of the response
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
    BankFixedIncomesMeta:
      type: object
      description: Meta information regarding the requested API.
      required:
        - totalRecords
        - totalPages
        - requestDateTime
      properties:
        totalRecords:
          type: integer
          format: int32
          description: Total number of records in the result
          example: 1
        totalPages:
          type: integer
          format: int32
          description: Total number of pages in the result
          example: 1
        requestDateTime:
          description: 'Date and time of the query, in accordance with the RFC-3339 specification, UTC format.'
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
      additionalProperties: false
    BankFixedIncomesTransactionsMeta:
      type: object
      description: Meta information regarding the requested API.
      required:
        - requestDateTime
      properties:
        requestDateTime:
          description: 'Date and time of the query, in accordance with the RFC-3339 specification, UTC format.'
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
      additionalProperties: false
    BankFixedIncomesResponseBalances:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: object
          required:
            - referenceDateTime
            - quantity
            - updatedUnitPrice
            - grossAmount
            - netAmount
            - incomeTax
            - financialTransactionTax
            - blockedBalance
            - purchaseUnitPrice
          properties:
            referenceDateTime:
              type: string
              format: date-time
              description: |
                Date and time of the last consolidated position to which the customer's transactional data available in the electronic channels refer.
                In the date representation, the minutes and seconds must be considered as zero (00:00:00Z).
              pattern: '(^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$)'
              example: '2022-07-21T17:32:00Z'
              maxLength: 20
            quantity:
              type: string
              format: double
              description: Quantity of securities held on the date of the customer's position
              maxLength: 26
              pattern: '^\d{1,15}\.\d{2,10}$'
              example: '1000.0004'
            updatedUnitPrice:
              type: object
              required:
                - amount
                - currency
              description: Updated gross unit value on the reference date.
              properties:
                amount:
                  description: Amount related to the object.
                  type: string
                  format: double
                  maxLength: 26
                  pattern: '^\d{1,15}\.\d{2,10}$'
                  example: '1000.000004'
                currency:
                  $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
            grossAmount:
              description: Value of the investment, which refers to the quantity multiplied by the PU updated on the reference date;
              type: object
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  maxLength: 20
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  example: '1000.0004'
                  description: Amount related to the object.
                currency:
                  $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
            netAmount:
              description: 'Value of the investment updated on the reference date, after the deduction of taxes (IOF and IR).'
              type: object
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  maxLength: 20
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  example: '1000.0004'
                  description: Amount related to the object.
                currency:
                  $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
            incomeTax:
              type: object
              required:
                - amount
                - currency
              description: Amount of income tax provisioned considering the rate in force on the reference date.
              properties:
                amount:
                  type: string
                  format: double
                  maxLength: 20
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  example: '1000.0004'
                  description: Amount related to the object.
                currency:
                  $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
            financialTransactionTax:
              type: object
              required:
                - amount
                - currency
              description: Amount of the tax (IOF) provisioned considering the rate in force on the reference date.
              properties:
                amount:
                  type: string
                  format: double
                  maxLength: 20
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  example: '1000.0004'
                  description: Amount related to the object.
                currency:
                  $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
            blockedBalance:
              type: object
              required:
                - amount
                - currency
              description: Amount not available for movement at that moment for any reason (judicial block, block as guarantee, among others). A grace period is not considered a block.
              properties:
                amount:
                  type: string
                  format: double
                  maxLength: 20
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  example: '1000.0004'
                  description: Amount related to the object.
                currency:
                  $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
            purchaseUnitPrice:
              type: object
              required:
                - amount
                - currency
              description: Unit value negotiated with the customer on the acquisition date
              properties:
                amount:
                  type: string
                  format: double
                  maxLength: 24
                  pattern: '^\d{1,15}\.\d{2,8}$'
                  example: '1000.000004'
                  description: Amount related to the object.
                currency:
                  $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
            preFixedRate:
              type: string
              format: double
              description: |
                Remuneration rate agreed with the customer at contracting. In the case of progressive products, consider the maximum contracted rate.
              pattern: '^-?\d{1}\.\d{6}$'
              maxLength: 9
              minLength: 8
              example: '0.300000'
            postFixedIndexerPercentage:
              type: string
              format: double
              description: |
                Percentage of the indexer agreed with the customer at contracting. In the case of progressive products, consider the maximum contracted rate.
              pattern: '^-?\d{1}\.\d{6}$'
              maxLength: 9
              minLength: 8
              example: '1.000000'
        links:
          $ref: '#/components/schemas/BankFixedIncomesLinks'
        meta:
          $ref: '#/components/schemas/BankFixedIncomesMeta'
      additionalProperties: false
    BankFixedIncomesResponseTransactions:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/BankFixedIncomesProductMovement'
        links:
          $ref: '#/components/schemas/BankFixedIncomesTransactionsLinks'
        meta:
          $ref: '#/components/schemas/BankFixedIncomesTransactionsMeta'
      additionalProperties: false
    BankFixedIncomesProductMovement:
      type: object
      required:
        - type
        - transactionType
        - transactionDate
        - transactionUnitPrice
        - transactionQuantity
        - transactionGrossValue
        - transactionNetValue
        - transactionId
      properties:
        type:
          $ref: '#/components/schemas/BankFixedIncomesEnumMovementType'
        transactionType:
          $ref: '#/components/schemas/BankFixedIncomesEnumTransactionType'
        transactionTypeAdditionalInfo:
          type: string
          maxLength: 100
          pattern: '[\w\W\s]*'
          description: |
            Additional information on the type of movement, to be filled in for movements not delimited in the domain.

            [Restriction] Mandatory field for participants when there is 'Outros' in the Reason for the movement field.
        transactionDate:
          type: string
          format: date
          maxLength: 10
          minLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
          description: Date of the movement.
        transactionUnitPrice:
          type: object
          description: Gross unit price negotiated in the transaction.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              maxLength: 24
              pattern: '^\d{1,15}\.\d{2,8}$'
              example: '1000.04'
            currency:
              $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
        transactionQuantity:
          type: string
          format: double
          maxLength: 24
          pattern: '^\d{1,15}\.\d{2,8}$'
          example: '42.25'
          description: Quantity of securities involved in the movement.
        transactionGrossValue:
          type: object
          description: Gross value of the transaction (Unit price of the movement x Quantity).
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              maxLength: 20
              pattern: '^\d{1,15}\.\d{2,4}$'
              example: '1000.04'
            currency:
              $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
        incomeTax:
          type: object
          description: |
            Amount of income tax collected in the transaction.

            [Restriction] Mandatory field for the products to which this tax applies when the `type` field is filled in with the value `SAIDA`.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              maxLength: 20
              pattern: '^\d{1,15}\.\d{2,4}$'
              example: '1000.04'
            currency:
              $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
        financialTransactionTax:
          type: object
          description: |
            Amount of IOF collected in the transaction.

            [Restriction] Mandatory field for the products to which this tax applies when the `type` field is filled in with the value `SAIDA`.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              maxLength: 20
              pattern: '^\d{1,15}\.\d{2,4}$'
              example: '1000.04'
              description: Amount related to the object.
            currency:
              $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
        transactionNetValue:
          type: object
          description: Net value of the transaction.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              maxLength: 20
              pattern: '^\d{1,15}\.\d{2,4}$'
              example: '1000.04'
              description: Amount related to the object.
            currency:
              $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
        remunerationTransactionRate:
          type: string
          format: double
          maxLength: 9
          minLength: 8
          pattern: '^-?\d{1}\.\d{6}$'
          example: '0.300000'
          description: |
            Remuneration rate of the transaction.

            [Restriction] Mandatory field for participants when the 'type' field is filled in with the value 'ENTRADA' and it concerns a pre-fixed or hybrid product.
        indexerPercentage:
          type: string
          format: double
          maxLength: 8
          minLength: 8
          pattern: '^\d{1}\.\d{6}$'
          example: '1.100000'
          description: |
            Maximum percentage of the indexer agreed with the customer at contracting.

            [Restriction] Mandatory field for participants when the 'type' field is filled in with the value 'ENTRADA' and it concerns a post-fixed or hybrid product.
        transactionId:
          type: string
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: ABCD2126019929279212650822221989319253344
          description: Code or unique identifier provided by the institution that maintains the individual representation of the movement.
      additionalProperties: false
    BankFixedIncomesEnumMovementType:
      type: string
      description: |
        Type of movement from the investment perspective

        - ENTRADA: APLICACAO, CANCELAMENTO, TRANSFERENCIA_TITULARIDADE, TRANSFERENCIA_CUSTODIA, OUTROS.

        - SAIDA: RESGATE, CANCELAMENTO, VENCIMENTO, PAGAMENTO_JUROS, AMORTIZACAO, TRANSFERENCIA_TITULARIDADE, TRANSFERENCIA_CUSTODIA, OUTROS.
      enum:
        - ENTRADA
        - SAIDA
      example: ENTRADA
    BankFixedIncomesEnumTransactionType:
      type: string
      description: Investment, redemption, cancellation, maturity, interest payment, amortization, transfer of ownership, transfer of custody and others.
      enum:
        - APLICACAO
        - RESGATE
        - CANCELAMENTO
        - VENCIMENTO
        - PAGAMENTO_JUROS
        - AMORTIZACAO
        - TRANSFERENCIA_TITULARIDADE
        - TRANSFERENCIA_CUSTODIA
        - OUTROS
      example: APLICACAO
    CreditFixedIncomesResponseInvestmentList:
