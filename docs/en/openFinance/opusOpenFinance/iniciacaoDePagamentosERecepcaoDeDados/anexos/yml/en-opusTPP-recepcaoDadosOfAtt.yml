    VariableIncomesBrokerData:
      type: object
      required:
        - brokerNoteNumber
        - grossValue
        - brokerageFee
        - clearingSettlementFee
        - clearingRegistrationFee
        - stockExchangeAssetTradeNoticeFee
        - stockExchangeFee
        - clearingCustodyFee
        - taxes
        - incomeTax
        - netValue
      properties:
        brokerNoteNumber:
          type: string
          description: Broker note identifier. It must not be used as a key in the API.
          maxLength: 16
          pattern: '^\d{1,16}$'
          example: '1854009930314350'
        grossValue:
          type: object
          description: the amount of the broker note is the sum of the transactions carried out. Total purchases and sales for the day.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Amount related to the object.
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              maxLength: 21
              example: '5000.0024'
            currency:
              type: string
              description: 'Currency of the monetary value, following the ISO-4217 model.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        brokerageFee:
          type: object
          description: |
            the brokerage fee is levied on the gross amount of the broker note and is freely agreed between the investor and their intermediary.
            It may be charged as a fixed amount per transaction, or as a percentage of the amount traded, or even in a mixed form, in accordance with the CVM investor guide.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Amount related to the object.
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              maxLength: 21
              example: '13.8751'
            currency:
              type: string
              description: 'Currency of the monetary value, following the ISO-4217 model.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        clearingSettlementFee:
          type: object
          description: Amount charged for settlement in custody.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Amount related to the object.
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              maxLength: 21
              example: '13.8751'
            currency:
              type: string
              description: 'Currency of the monetary value, following the ISO-4217 model.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        clearingRegistrationFee:
          type: object
