      properties:
        totalRecords:
          type: integer
          format: int32
          description: Total number of records in the result
          example: 1
        totalPages:
          type: integer
          format: int32
          description: Total number of pages in the result
          example: 1
        requestDateTime:
          description: 'Date and time of the query, in accordance with the RFC-3339 specification, UTC format.'
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
    CreditFixedIncomesMetaTransactions:
      type: object
      description: Meta information regarding the requested API.
      required:
        - requestDateTime
      properties:
        requestDateTime:
          description: 'Date and time of the query, in accordance with the RFC-3339 specification, UTC format.'
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
    CreditFixedIncomesResponseBalances:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: object
          required:
            - referenceDateTime
            - updatedUnitPrice
            - quantity
            - grossAmount
            - netAmount
            - incomeTax
            - financialTransactionTax
            - blockedBalance
            - purchaseUnitPrice
          properties:
            referenceDateTime:
              type: string
              format: date-time
              description: 'date and time of the last consolidated position available to which the customer''s transactional data available in the electronic channels refer; In the date representation, the minutes and seconds must be considered as zero (00:00:00Z)'
              maxLength: 20
              pattern: '(^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$)'
              example: '2022-07-21T17:32:00Z'
            updatedUnitPrice:
              type: object
              description: updated gross unit value on the reference date;
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,8}$'
                  maxLength: 24
                  minLength: 4
                  example: '1000.0400'
                  description: Amount related to the object.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
            quantity:
              type: string
              format: double
              description: quantity of securities held on the date of the customer's position
              maxLength: 24
              minLength: 4
              pattern: '^\d{1,15}\.\d{2,8}$'
              example: '15.00'
            grossAmount:
              type: object
              description: value of the investment, which refers to the quantity x PU updated on the reference date
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  maxLength: 20
                  minLength: 4
                  example: '1000.04'
                  description: Amount related to the object.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
            netAmount:
              type: object
              description: 'value of the investment updated on the reference date, after the deduction of taxes (IOF and IR)'
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  maxLength: 20
                  minLength: 4
                  example: '1000.04'
                  description: Amount related to the object.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
            incomeTax:
              type: object
              description: Amount of income tax provisioned considering the rate in force on the reference date.
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  maxLength: 20
                  minLength: 4
                  example: '1000.04'
                  description: Amount related to the object.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
            financialTransactionTax:
              type: object
              description: Amount of the tax (IOF) provisioned considering the rate in force on the reference date.
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  maxLength: 20
                  minLength: 4
                  example: '1000.04'
                  description: Amount related to the object.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
            blockedBalance:
              type: object
              description: Amount not available for movement at that moment for any reason (judicial block, block as guarantee, among others). A grace period is not considered a block.
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  maxLength: 20
                  minLength: 4
                  example: '1000.04'
                  description: Amount related to the object.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
            purchaseUnitPrice:
              type: object
              description: unit value negotiated with the customer on the acquisition date
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,8}$'
                  maxLength: 24
                  minLength: 4
                  example: '1000.000004'
                  description: Amount related to the object.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
            preFixedRate:
              type: string
              description: |
                Remuneration rate agreed with the customer at contracting. In the case of progressive products, consider the maximum contracted rate.
              maxLength: 9
              minLength: 8
              pattern: '^-?\d{1}\.\d{6}$'
              example: '0.300000'
            postFixedIndexerPercentage:
              type: string
              description: |
                Percentage of the indexer agreed with the customer at contracting. In the case of progressive products, consider the maximum contracted rate.
              maxLength: 9
              minLength: 8
              pattern: '^-?\d{1}\.\d{6}$'
              example: '1.100000'
            fine:
              type: object
              description: |
                Amount of the penalty due to the delay of the payment agreed in the contract.
                If the transmitting institution has the information, sending this field is mandatory.
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  maxLength: 20
                  minLength: 4
                  example: '1000.04'
                  description: Amount related to the object.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
            latePayment:
              type: object
              description: |
                Amount of default interest due to the delay of the payment agreed in the contract.
                If the transmitting institution has the information, sending this field is mandatory.
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  maxLength: 20
                  minLength: 4
                  example: '1000.04'
                  description: Amount related to the object.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
        links:
          $ref: '#/components/schemas/CreditFixedIncomesLinks'
        meta:
          $ref: '#/components/schemas/CreditFixedIncomesMeta'
      additionalProperties: false
    CreditFixedIncomesResponseTransactions:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/CreditFixedIncomesTransaction'
        links:
          $ref: '#/components/schemas/CreditFixedIncomesTransactionsLinks'
        meta:
          $ref: '#/components/schemas/CreditFixedIncomesMetaTransactions'
      additionalProperties: false
    CreditFixedIncomesTransaction:
      type: object
      required:
        - type
        - transactionType
        - transactionDate
        - transactionGrossValue
        - transactionNetValue
        - transactionId
      properties:
        type:
          $ref: '#/components/schemas/CreditFixedIncomesEnumType'
        transactionType:
          $ref: '#/components/schemas/CreditFixedIncomesEnumTransactionType'
        transactionTypeAdditionalInfo:
          type: string
          description: |
            Additional information on the type of movement, to be filled in for movements not delimited in the domain.
            [Restriction] Mandatory field for participants when there is 'OUTROS' in the 'transactionType' field.
          maxLength: 100
          pattern: '[\w\W\s]*'
        transactionDate:
          type: string
          format: date
          description: Date of the movement
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
        transactionUnitPrice:
          type: object
          description: |
            Unit value negotiated with the customer on the acquisition date. In transfers of custody, when the original PU (of the originating institution) is not available to the transmitting institution, the PU marked by the institution on the transfer date must be provided.

            [Restriction] Mandatory field for participants when the `transactionType` field is filled in with the values `COMPRA`, `VENDA` or `VENCIMENTO`.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              pattern: '^\d{1,15}\.\d{2,8}$'
              maxLength: 24
              minLength: 4
              example: '1000.000004'
              description: Amount related to the object.
            currency:
              $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
        transactionQuantity:
          type: string
          description: |
            Quantity of securities involved in the movement

            [Restriction] Mandatory field for participants when the 'transactionType' field is filled in with the values 'COMPRA', 'VENDA', 'VENCIMENTO', 'TRANSFERENCIA_TITULARIDADE' or 'TRANSFERENCIA_CUSTODIA'.
          maxLength: 24
          pattern: '^\d{1,15}\.\d{2,8}$'
          example: '42.25'
        transactionGrossValue:
          type: object
          description: 'Gross value of the transaction (Unit price of the movement x Quantity)'
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              pattern: '^\d{1,15}\.\d{2,4}$'
              maxLength: 20
              minLength: 4
              example: '1000.04'
              description: Amount related to the object.
            currency:
              $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
        incomeTax:
          type: object
          description: |
            Amount of income tax collected in the transaction.
            [Restriction] Mandatory field for participants when the 'type' field is filled in with the value 'SAIDA'.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              pattern: '^\d{1,15}\.\d{2,4}$'
              maxLength: 20
              minLength: 4
              example: '1000.04'
              description: Amount related to the object.
            currency:
              $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
        financialTransactionTax:
          type: object
          description: |
            Amount of IOF collected in the transaction.
            [Restriction] Mandatory field for participants when the 'type' field is filled in with the value 'SAIDA'.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              pattern: '^\d{1,15}\.\d{2,4}$'
              maxLength: 20
              minLength: 4
              example: '1000.04'
              description: Amount related to the object.
            currency:
              $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
        transactionNetValue:
          type: object
          description: Net value of the transaction
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              pattern: '^\d{1,15}\.\d{2,4}$'
              maxLength: 20
              minLength: 4
              example: '1000.04'
              description: Amount related to the object.
            currency:
              $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
        remunerationTransactionRate:
          type: string
          description: |
            Remuneration rate agreed with the customer at contracting.

            [Restriction] Mandatory field for participants when the 'type' field is filled in with the value 'ENTRADA' and it concerns a pre-fixed or hybrid product.
          maxLength: 9
          minLength: 8
          pattern: '^-?\d{1}\.\d{6}$'
          example: '0.300000'
        indexerPercentage:
          type: string
          description: |
            Maximum percentage of the indexer in the transaction agreed with the customer at contracting.

            [Restriction] Mandatory field for participants when the 'type' field is filled in with the value 'ENTRADA' and it concerns a post-fixed or hybrid product.
          maxLength: 8
          minLength: 8
          pattern: '^\d{1}\.\d{6}$'
          example: '1.100000'
        transactionId:
          type: string
          description: |
            Code or unique identifier provided by the institution to individualize the movement.
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: ABCD2126019929279212650822221989319253344
    CreditFixedIncomesEnumType:
      type: string
      description: |
