    LoansEnumContractTaxType:
      type: string
      description: "\"Rate Type (see  Enum)\n- NOMINAL (a nominal rate is an interest rate in which the reference unit does not coincide with the compounding time unit. It is always provided in annual terms, and its compounding periods may be daily, monthly, quarterly or semi-annual. e.g. A rate of 12% per year with monthly compounding)\n- EFETIVA (It is the interest rate in which the reference unit coincides with the compounding time unit. As the units of time measurement of the interest rate and of the compounding periods are the same, simple examples such as 1% per month, 60% per year are used)\"\n"
      enum:
      - NOMINAL
      - EFETIVA
      example: EFETIVA
    LoansBalloonPaymentAmount:
      type: object
      required:
      - amount
      - currency
      description: Monetary amount of the non-regular installment due in the future.
      properties:
        amount:
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: Monetary amount of the non-regular installment due in the future. Expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          maxLength: 3
          description: Currency of the monetary value, following the ISO-4217 model.
          example: BRL
    LoansContract:
      type: object
      description: Set of information regarding the identification of the loan credit operation
      required:
      - contractNumber
      - ipocCode
      - productName
      - productType
      - productSubType
      - contractDate
      - contractAmount
      - instalmentPeriodicity
      - CET
      - amortizationScheduled
      - interestRates
      - contractedFees
      - contractedFinanceCharges
      - productSubTypeCategory
      properties:
        contractNumber:
          type: string
          maxLength: 100
          minLength: 1
          pattern: ^[\w\W]{1,100}$
          example: '1324926521496'
          description: Contract number given by the contracting institution.
        ipocCode:
          type: string
          maxLength: 67
          minLength: 22
          pattern: ^[\w\W]{22,67}$
          example: '92792126019929279212650822221989319252576'
          description: "Standardized contract number - IPOC (Standardized Identification of the Credit Operation). According to DOC 3040, composed of:\n- **CNPJ of the institution:** 8 (eight) initial positions;\n- **Modality of the operation:** 4 (four) positions;\n- **Type of the customer:** 1 (one) position( 1 = natural person - CPF, 2= legal entity – CNPJ, 3 = natural person abroad, 4 = legal entity abroad, 5 = natural person without a CPF and 6 = legal entity without a CNPJ);\n- **Code of the customer:** The number of positions varies according to the type of the customer:\n  1. For natural person customers with a CPF (customer type = 1), report the 11 (eleven) positions of the CPF;\n  2. For legal entity customers with a CNPJ (customer type = 2), report the 8 (eight) initial positions of the CNPJ;\n  3. For the other customers (customer types 3, 4, 5 and 6), report 14 (fourteen) positions with a complement of zeros on the left if the identification is of a smaller size;\n- **Code of the contract:** 1 (one) up to 40 (forty) positions, without a complement of characters.\n"
        productName:
          type: string
          maxLength: 140
          pattern: ^[^\s](.*[^\s])?$
          example: Crédito Pessoal Consignado
          description: "Name/Identification of the name of the Credit Operation Modality disclosed to the customer\n"
        productType:
          $ref: '#/components/schemas/LoansEnumContractProductTypeLoans'
        productSubType:
          $ref: '#/components/schemas/LoansEnumContractProductSubTypeLoans'
        productSubTypeCategory:
          $ref: '#/components/schemas/LoansEnumContractProductSubTypeCategory'
        contractDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2018-01-05'
          description: "Contracting date of the credit operation. RFC-3339 specification. For revolving products, productSubType `CHEQUE_ESPECIAL` and `CONTA_GARANTIDA`, if there are multiple contractings of the same product, the latest available date must be sent.\n"
        disbursementDates:
          type: array
          minItems: 1
          description: "List providing the Disbursement Dates of the contracted amount.\n"
          items:
            type: string
            format: date
            maxLength: 10
            pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
            example: '2018-01-15'
            description: "Disbursement Date of the contracted amount. RFC-3339 specification.\nIn the case of a release of funds made on D0 but with retroactive reference on D -1, the accounting-correct date would be D -1.\n"
        settlementDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2018-01-15'
          description: "Settlement date of the operation. Contract cancellation date for cases in which there is no remaining outstanding balance. In the case of cancellation with an outstanding balance, the date must only be filled in when it is settled.\n"
        contractAmount:
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: "Contracted amount of the operation. Do not include amounts of rates, fees, charges and insurance. \nExpressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places. \nIn cases where this value is not explicit in the product contract, send it as 0.00\n"
        currency:
          type: string
          maxLength: 3
          pattern: ^(\w{3}){1}$
          example: BRL
          description: "Currency of the guarantee amount, according to the ISO-4217 model. e.g. 'BRL'\nAll monetary values reported are represented in the currency currently in force in Brazil\n"
        dueDate:
          type: string
          format: date
          maxLength: 10
          minLength: 2
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2028-01-15'
          description: "Date of the last maturity of the operation, following the RFC-3339 specification. The information must be sent if it exists. Especially for renegotiated contracts, the date must be changed to that of the last maturity. For revolving products, productSubType `CHEQUE_ESPECIAL` and `CONTA_GARANTIDA`, the field represents the end date of the renewal for active contracts or the cancellation date for cancelled or overdue contracts.\n"
        instalmentPeriodicity:
          $ref: '#/components/schemas/LoansEnumContractInstalmentPeriodicity'
        instalmentPeriodicityAdditionalInfo:
          type: string
          pattern: ^[^\s](.*[^\s])?$
          maxLength: 50
          example: Informações adicionais sobre periodicidade
          description: "Mandatory field to complement the information regarding the regular payment periodicity when it has the OUTROS option.\n"
        firstInstalmentDueDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2018-02-15'
          description: "Due date of the first principal installment.\nThe information must be sent if it exists.\n"
        CET:
          type: string
          pattern: ^\d{1,6}\.\d{6}$
          format: double
          maxLength: 13
          minLength: 8
          example: '0.290000'
          description: "CET – Total Effective Cost must be expressed in the form of an annual percentage rate and incorporates all charges and expenses levied on credit operations (interest rate, but also fees, taxes, insurance and other expenses charged).\n\nThe entry must respect 6 decimal places, even if they are filled with zeros (percentage representation e.g.: 0.150000. This value represents 15%. The value 1 represents 100%).\n\nFor the PF (natural person) public the field is mandatory for contracts signed from 2008 onwards, in accordance with CMN Resolution 3,517. For the PJ (legal entity) public the field is mandatory for contracts signed from 2011 onwards, in accordance with CMN Resolution 3,909. The field may be filled with 0.00 in scenarios in which the institution does not have the CET (Total effective cost) information, only for the exceptions listed below: \n\n- In contracts prior to 2008 (for the PF public); \n- In contracts prior to 2011 (for the PJ public); \n- Medium or large-sized PJ public. \n"
        hasInsuranceContracted:
          type: boolean
          description: "Field that identifies whether there is insurance contracted for the Loan, where insurance contracted is `true` and not contracted is `false`.  \n\n[Restriction] This field is mandatory if the productSubTypeCategory field is filled with `CREDITO_PESSOAL_CLEAN` or `CONSIGNADO_SIAPE`.  \n"
          example: true
        amortizationScheduled:
          $ref: '#/components/schemas/LoansEnumContractAmortizationScheduled'
        amortizationScheduledAdditionalInfo:
          type: string
          pattern: ^[^\s](.*[^\s])?$
          maxLength: 200
          example: Informações complementares relativa à amortização do tipo 'OUTROS'
          description: "Mandatory field to complement the information regarding amortization when the OUTROS option is selected.\n"
        cnpjConsignor:
          type: string
          maxLength: 14
          pattern: ^[0-9A-Z]{12}[0-9]{2}$
          example: '60500998000135'
          description: "CNPJ of the payroll-deduction consignor (the CNPJ corresponds to the alphanumeric registration number in the Cadastro de Pessoa Jurídica). \n\nOnly the alphanumeric representation of the CNPJ must be provided, without a mask.\n\n[Restriction] Additional information specific to when the `productSubType` is equal to `CREDITO_PESSOAL_COM_CONSIGNACAO`. \nThis field is mandatory only while the link exists (active payroll deduction). \nIn cases of removal of the payroll deduction, the field may be omitted.\n"
        interestRates:
          type: array
          description: "Object that provides the set of information necessary to demonstrate the composition of the remunerative interest rates of the credit Modality. If the contract does not have interest rates, an empty list must be shared. If the contract has an interest rate with value 0, an object with the value 0 must be shared explicitly. For contracts under renegotiation, the shared loan rate must remain the rate of the current contract, being changed to the renegotiated one at the end of the renegotiation process. For CPC products (field `productSubTypeCategory` filled with `CREDITO_PESSOAL_CLEAN`) or Federal Payroll-Deducted Credit (field `productSubTypeCategory` filled with `CONSIGNADO_SIAPE`) the nominal rate and the effective rate (field taxPeriodicity) with a.a. (per year) periodicity must mandatorily be included, and it may additionally include, in addition to the nominal and effective annual rates, others with a different periodicity.  \n"
          items:
            $ref: '#/components/schemas/LoansContractInterestRate'
          minItems: 0
        contractedFees:
          type: array
          description: List providing the information on the fees agreed in the contract.
          items:
            $ref: '#/components/schemas/LoansContractedFee'
          minItems: 0
        contractedFinanceCharges:
          type: array
          description: List providing the charges agreed in the contract
          items:
            $ref: '#/components/schemas/LoansFinanceCharge'
          minItems: 0
        nextInstalmentAmount:
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: "Reports the face value (corresponds to the value of the installment at maturity). For settled contracts, return zero, following the pattern. \n[Restriction] This field is mandatory if the `productSubTypeCategory` field is filled with `CREDITO_PESSOAL_CLEAN` or `CONSIGNADO_SIAPE` in the /contracts/{contractId} endpoint.  \n"
    LoansBalloonPayment:
      type: object
      description: List providing the due dates and amount of the non-regular installments  of the contract of the credit modality queried.
      required:
      - dueDate
      - amount
      properties:
        dueDate:
          type: string
          maxLength: 10
          minLength: 2
          format: date
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2021-05-21'
          description: "'Due date of the non-regular installment  falling due of the contract of the credit modality queried, in accordance with the RFC-3339 specification. e.g. 2014-03-19'\n"
        amount:
          $ref: '#/components/schemas/LoansBalloonPaymentAmount'
    LoansEnumContractCalculation:
      type: string
      description: Calculation basis
      enum:
      - 21/252
      - 30/360
      - 30/365
      example: 21/252
    LoansEnumContractProductTypeLoans:
      type: string
      description: Type of the credit modality contracted, in accordance with  circular 4,015 and the description of DOC3040 of the SCR).
      enum:
      - EMPRESTIMOS
      example: EMPRESTIMOS
    LoansEnumContractProductSubTypeLoans:
      type: string
      description: Sub type of the Loans credit modalities contracted, in accordance with  circular 4,015 and the description of DOC3040 of the SCR).
      enum:
      - HOME_EQUITY
      - CHEQUE_ESPECIAL
      - CONTA_GARANTIDA
      - CAPITAL_GIRO_TETO_ROTATIVO
      - CREDITO_PESSOAL_SEM_CONSIGNACAO
      - CREDITO_PESSOAL_COM_CONSIGNACAO
      - MICROCREDITO_PRODUTIVO_ORIENTADO
      - CAPITAL_GIRO_PRAZO_VENCIMENTO_ATE_365_DIAS
      - CAPITAL_GIRO_PRAZO_VENCIMENTO_SUPERIOR_365_DIAS
      example: CREDITO_PESSOAL_COM_CONSIGNACAO
    LoansEnumContractProductSubTypeCategory:
      type: string
      description: "Category intended for the specific classification related to the sub-modality of the product.\nThe following guidelines must be observed for the correct completion of this field:\n* Completion with the enum `CREDITO_PESSOAL_CLEAN` will be mandatory, from the publication of version 2.5.0 of the Loans API, **for open contracts**, when applicable;\n* The enum `CONSIGNADO_SIAPE`, **which encompasses all payroll-deducted contracts under the regulation of the Integrated Human Resources Administration System (Siape), presenting information on statutory, temporary and CLT (labour-law) employees, among others**, will be mandatory, from the start of the pilot for payroll-deducted credit;\n* Contracts settled up to the entry into production (go live) of version 2.5.0 may be filled with the OUTRO option;\n* The remaining sub-modalities must be classified under the `OUTRO` option.\n"
      enum:
      - CREDITO_PESSOAL_CLEAN
      - CONSIGNADO_SIAPE
      - OUTRO
      example: CREDITO_PESSOAL_CLEAN
    LoansEnumWarrantySubType:
      type: string
      description: "Name/Identification of the sub type of the guarantee that secures the Modality of the Credit Operation contracted (Doc 3040, Annex 12).\n"
      enum:
      - ACOES_DEBENTURES
      - ACORDOS_COMPENSACAO_LIQUIDACAO_OBRIGACOES
      - APLICACOES_FINANCEIRAS_RENDA_FIXA
      - APLICACOES_FINANCEIRAS_RENDA_VARIAVEL
      - APOLICES_CREDITO_EXPORTACAO
      - CCR_CONVENIO_CREDITOS_RECIPROCOS
      - CHEQUES
      - CIVIL
      - DIREITOS_SOBRE_ALUGUEIS
      - DEPOSITOS_A_VISTA_A_PRAZO_POUPANCA_OURO_TITULOS_PUBLICOS_FEDERAIS_ART_36
      - DEPOSITO_TITULOS_EMITIDOS_ENTIDADES_ART_23
      - DUPLICATAS
      - EMD_ENTIDADES_MULTILATERAIS_DESENVOLVIMENTO_ART_37
      - EQUIPAMENTOS
      - ESTADUAL_OU_DISTRITAL
      - FATURA_CARTAO_CREDITO
      - FEDERAL
      - FCVS_FUNDO_COMPENSACAO_VARIACOES_SALARIAIS
      - FGI_FUNDO_GARANTIDOR_INVESTIMENTOS
      - FGPC_FUNDO_GARANTIA_PROMOCAO_COMPETIT
      - FGTS_FUNDO_GARANTIA_TEMPO_SERVICO
      - FUNDO_GARANTIDOR_AVAL
      - GARANTIA_PRESTADA_FGPC_LEI_9531_ART_37
      - GARANTIA_PRESTADA_FUNDOS_QUAISQUER_OUTROS_MECANISMOS_COBERTURA_RISCO_CREDITO_ART_37
      - GARANTIA_PRESTADA_TESOURO_NACIONAL_OU_BACEN_ART_37_BENS_DIREITOS_INTEGRANTES_PATRIMONIO_AFETACAO
      - IMOVEIS
      - IMOVEIS_RESIDENCIAIS
      - MITIGADORAS
      - MUNICIPAL
      - NAO_MITIGADORAS
      - NOTAS_PROMISSORIAS_OUTROS_DIREITOS_CREDITO
      - OUTRAS
      - OUTROS
      - OUTROS_BENS
      - OUTROS_GRAUS
      - OUTROS_IMOVEIS
      - OUTROS_SEGUROS_ASSEMELHADOS
      - PESSOA_FISICA
      - PESSOA_FISICA_EXTERIOR
      - PESSOA_JURIDICA
      - PESSOA_JURIDICA_EXTERIOR
      - PRIMEIRO_GRAU_BENS_DIREITOS_INTEGRANTES_PATRIMONIO_AFETACAO
      - PRIMEIRO_GRAU_IMOVEIS_RESIDENCIAIS
      - PRIMEIRO_GRAU_OUTROS
      - PROAGRO
      - PRODUTOS_AGROPECUARIOS_COM_WARRANT
      - PRODUTOS_AGROPECUARIOS_SEM_WARRANT
      - SBCE_SOCIEDADE_BRASILEIRA_CREDITO_EXPORTAÇÃO
      - SEGURO_RURAL
      - SEM_SUB_TIPO_GARANTIA
      - TRIBUTOS_RECEITAS_ORCAMENTARIAS
      - VEICULOS
      - VEICULOS_AUTOMOTORES
      example: NOTAS_PROMISSORIAS_OUTROS_DIREITOS_CREDITO
    LoansEnumContractAmortizationScheduled:
      type: string
      description: "Amortization system (See Enum):\n- SAC (Constant Amortization System) - This is the one in which the amortization amount remains the same until the end. The interest charged on the installment plan is not included in this calculation.\n- PRICE (French Amortization System) - The installments are fixed from the beginning to the end of the contract. That is, all installments will have the same value, from the first to the last. In the first payments, the greater part of the installment amount corresponds to interest. Over time, the interest rate decreases. As the installment amount is fixed, as the installments go by, the amortization amount increases.\n- SAM (Mixed Amortization System) - Each installment (payment) is the arithmetic mean of the respective installments in the Price System and in the Constant Amortization System (SAC).\n- NO AMORTIZATION SYSTEM\n"
      enum:
      - SAC
      - PRICE
      - SAM
      - SEM_SISTEMA_AMORTIZACAO
      - OUTROS
      example: SAC
    LoansResponseLoansWarranties:
      type: object
      required:
      - data
      - links
      - meta
      properties:
        data:
          type: array
          minItems: 0
          description: Set of information regarding the identification of the loan credit operation
          items:
            $ref: '#/components/schemas/LoansWarranties'
        links:
          $ref: '#/components/schemas/LoansLinks'
        meta:
          $ref: '#/components/schemas/LoansMeta'
    LoansEnumContractReferentialRateIndexerType:
      type: string
      description: "\"Types of reference rates or indexers, in accordance with Annex 5: Reference rate or Indexer (Indx), of Document 3040\"\n"
      enum:
      - SEM_TIPO_INDEXADOR
      - PRE_FIXADO
      - POS_FIXADO
      - FLUTUANTES
      - INDICES_PRECOS
      - CREDITO_RURAL
      - OUTROS_INDEXADORES
      example: PRE_FIXADO
    LoansEnumContractInterestRateType:
      type: string
      description: "\"Interest Type  (see  Enum)\n- SIMPLES (always applied/charged on the initial capital, which is the amount lent/invested. There is no charging of interest on interest accumulated in the previous period(s). Example: on a loan of R$1,000, with a simple interest rate of 8% p.a., lasting 2 years, the total interest will be R$80 in the first year and R$ 80 in the second year. At the end of the contract, the borrower will return the principal and the simple interest of each year: R$1,000+R$80+R$80=R$1,160)\n- COMPOSTO (for each period of the contract (daily, monthly, annual etc.), there is a “new capital” for charging the contracted interest rate. This “new capital” is the sum of the capital and the interest charged in the previous period. Example: on a loan of R$1,000, with a compound interest rate of 8% p.a., lasting 2 years, the total interest will be R$80 in the first year. In the second year, the interest will be added to the capital (R$1,000 + R$ 80 = R$ 1,080), resulting in interest of R$ 86 (8% of R$ 1,080))\"\n"
      enum:
      - SIMPLES
      - COMPOSTO
      example: SIMPLES
    LoansReleases:
      type: object
      description: List of the payments made in the period
      required:
      - paymentId
      - isOverParcelPayment
      - paidDate
      - currency
      - paidAmount
      properties:
        paymentId:
          type: string
          maxLength: 100
          minLength: 1
          example: XlthLXpBLVowLTldW2EtekEtWjAtOVwtXXswLDk5fSQ
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          description: Code or unique identifier provided by the institution to represent the individual payment.
        isOverParcelPayment:
          type: boolean
          example: true
          description: Identifies whether it is an agreed payment (false) or a one-off payment (true).
        instalmentId:
          type: string
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          example: WGx0aExYcEJMVm93TFRsZFcyRXRla0V0V2pBdE9Wd3RYWH
          description: "Installment identifier, under the responsibility of each transmitting institution.  \n[Restriction] Information mandatory when isOverParcelPayment has the value FALSE.\n"
        paidDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2021-05-21'
          description: Effective date of the payment relating to the contract of the credit modality queried, in accordance with the RFC-3339 specification. e.g. 2014-03-19
        currency:
          type: string
          maxLength: 3
          pattern: ^(\w{3}){1}$
          example: BRL
          description: "Currency of the monetary value reported, according to the ISO-4217 model. e.g. 'BRL'.\nAll monetary values reported are represented in the currency currently in force in Brazil.\n"
        paidAmount:
          type: string
          format: double
          pattern: ^-?\d{1,15}\.\d{2,4}$
          maxLength: 21
          minLength: 4
          example: '1000.0400'
          description: "Amount of the payment relating to the contract of the credit modality queried. Expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places. If charges and fees were paid together with the installment, the total sum must be added to the installment amount in this field. If the payment of fees and charges was made separately, they must be listed in the ovelParcel field.\n"
        overParcel:
          type: object
          description: "Object of the fees and charges that were paid outside the installment.\n\n[Restriction] The information must be sent if it exists.\n"
          required:
          - fees
          - charges
          properties:
            fees:
              type: array
              minItems: 0
              items:
                $ref: '#/components/schemas/LoansFeeOverParcel'
              description: List of the fees that were paid outside the installment, only for one-off payments.
            charges:
              type: array
              minItems: 0
              items:
                $ref: '#/components/schemas/LoansChargeOverParcel'
              description: List of the charges that were paid outside the installment.
    LoansEnumContractFeeCharge:
      type: string
      description: "\"Form of charging relating to the fee agreed in the contract. (See Enum)\n- Minimum\n- Maximum\n- Fixed\n- Percentage\"\n"
      enum:
      - MINIMO
      - MAXIMO
      - FIXO
      - PERCENTUAL
      example: MINIMO
    LoansEnumContractFinanceChargeType:
      type: string
      description: Type of charge agreed in the contract.
      enum:
      - JUROS_REMUNERATORIOS_POR_ATRASO
      - MULTA_ATRASO_PAGAMENTO
      - JUROS_MORA_ATRASO
      - IOF_CONTRATACAO
      - IOF_POR_ATRASO
      - SEM_ENCARGO
      - OUTROS
      example: JUROS_REMUNERATORIOS_POR_ATRASO
    LoansEnumContractInstalmentPeriodicity:
      type: string
      description: "\"Information regarding the regular periodicity of the installments. (See Enum)\nno regular periodicity, weekly, fortnightly, monthly, bimonthly, quarterly, half-yearly, annual\"\n"
      enum:
      - SEM_PERIODICIDADE_REGULAR
      - SEMANAL
      - QUINZENAL
      - MENSAL
      - BIMESTRAL
      - TRIMESTRAL
      - SEMESTRAL
      - ANUAL
      - OUTROS
      example: SEMANAL
    LoansListContract:
      type: object
      description: Set of information on loan contracts held by the customer at the transmitting institution and for which they have provided consent
      required:
      - contractId
      - brandName
      - companyCnpj
      - productType
      - productSubType
      - ipocCode
      - productSubTypeCategory
      properties:
        contractId:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          maxLength: 100
          minLength: 1
          example: '92792126019929279212650822221989319252576'
          description: Uniquely identifies the contract of the customer's credit operation, maintaining the immutability rules within the transmitting institution.
        brandName:
          type: string
          pattern: ^[^\s](.*[^\s])?$
          maxLength: 80
          example: Organização A
          description: Name of the Brand reported by the participant in Open Finance. It is recommended to use, whenever possible, the same brand name assigned in the directory field Customer Friendly Server Name (Authorisation Server).
        companyCnpj:
          type: string
          pattern: ^[0-9A-Z]{12}[0-9]{2}$
          maxLength: 14
          example: '21128159000166'
          description: Complete alphanumeric representation of the CNPJ of the institution responsible for the loan contract in order to identify the creditor institution in cases of credit portability - the CNPJ corresponds to the alphanumeric registration number in the Cadastro de Pessoa Jurídica. Only the alphanumeric representation of the CNPJ must be provided, without a mask.
        productType:
          $ref: '#/components/schemas/LoansEnumContractProductTypeLoans'
        productSubType:
          $ref: '#/components/schemas/LoansEnumContractProductSubTypeLoans'
        productSubTypeCategory:
          $ref: '#/components/schemas/LoansEnumContractProductSubTypeCategory'
        ipocCode:
          type: string
          maxLength: 67
          minLength: 22
          pattern: ^[\w\W]{22,67}$
          example: '92792126019929279212650822221989319252576'
          description: "Standardized contract number - IPOC (Identificação Padronizada da Operação de Crédito). According to DOC 3040, composed of:\n- **CNPJ of the institution:** 8 (eight) initial positions;\n- **Modality of the operation:** 4 (four) positions;\n- **Customer type:** 1 (one) position( 1 = natural person - CPF, 2= legal entity – CNPJ, 3 = natural person abroad, 4 = legal entity abroad, 5 = natural person without CPF and 6 = legal entity without CNPJ);\n- **Customer code:** The number of positions varies according to the customer type:\n  1. For natural person customers with CPF (customer type = 1), report the 11 (eleven) positions of the CPF;\n  2. For legal entity customers with CNPJ (customer type = 2), report the 8 (eight) initial positions of the CNPJ;\n  3. For the other customers (customer types 3, 4, 5 and 6), report 14 (fourteen) positions with zero padding on the left if the identification is shorter;\n- **Contract code:** 1 (one) to 40 (forty) positions, without character padding.          \n"
    LoansEnumContractTaxPeriodicity:
      type: string
      description: "\"Periodicity of the rate. (See  Enum)\na.m - per month\na.a. - per year\"\n"
      enum:
      - AM
      - AA
      example: AA
    LoansFinanceCharge:
      type: object
      description: Set of information relating to the identification of the credit operation
      required:
      - chargeType
      properties:
        chargeType:
          $ref: '#/components/schemas/LoansEnumContractFinanceChargeType'
        chargeAdditionalInfo:
          type: string
          maxLength: 140
          description: "Field for additional information.\n\n[Restriction] Mandatory if the 'OUTROS' option is selected in Type of charge agreed in the contract.\n"
          pattern: ^[^\s](.*[^\s])?$
          example: Informações adicionais sobre encargos.
        chargeRate:
          type: string
          pattern: ^\d{1}\.\d{6}$
          format: double
          maxLength: 8
          minLength: 8
          description: "Represents the value of the charge as a percentage agreed in the contract.\n\nThe entry must respect 6 decimal places, even if they are filled with zeros(percentage representation e.g.: 0.150000. This value represents 15%. The value 1 represents 100%).\n"
          example: '0.070000'
    LoansEnumContractReferentialRateIndexerSubType:
      type: string
      description: "\"Sub types of reference rates or indexers, in accordance with Annex 5: Reference rate or Indexer (Indx), of Document 3040.\n\n[Restriction] If a value applicable to the contract is reported in the postFixedRate field, sending this field will be mandatory.\"\n"
      enum:
      - SEM_SUB_TIPO_INDEXADOR
      - PRE_FIXADO
      - TR_TBF
      - TJLP
      - LIBOR
      - TLP
      - OUTRAS_TAXAS_POS_FIXADAS
      - CDI
      - SELIC
      - OUTRAS_TAXAS_FLUTUANTES
      - IGPM
      - IPCA
      - IPCC
      - OUTROS_INDICES_PRECO
      - TCR_PRE
      - TCR_POS
      - TRFC_PRE
      - TRFC_POS
      - OUTROS_INDEXADORES
      example: TJLP
    LoansContractInterestRate:
      type: object
      description: Object that provides the set of information necessary to demonstrate the composition of the remunerative interest rates of the credit Modality
      required:
      - taxType
      - interestRateType
      - taxPeriodicity
      - calculation
      - referentialRateIndexerType
      properties:
        taxType:
          $ref: '#/components/schemas/LoansEnumContractTaxType'
        interestRateType:
          $ref: '#/components/schemas/LoansEnumContractInterestRateType'
        taxPeriodicity:
          $ref: '#/components/schemas/LoansEnumContractTaxPeriodicity'
        calculation:
          $ref: '#/components/schemas/LoansEnumContractCalculation'
        referentialRateIndexerType:
          $ref: '#/components/schemas/LoansEnumContractReferentialRateIndexerType'
        referentialRateIndexerSubType:
          $ref: '#/components/schemas/LoansEnumContractReferentialRateIndexerSubType'
        referentialRateIndexerAdditionalInfo:
          type: string
          description: "Free field to complement the information relating to the Type of reference rate or indexer.\n[Restriction] Mandatory to complement the information relating to the Type of reference rate or indexer, when the type or subtype OUTRO is selected.\n"
          maxLength: 140
          pattern: ^[^\s](.*[^\s])?$
          example: Informações adicionais
        preFixedRate:
          type: string
          pattern: ^\d{1,2}\.\d{6}$
          format: double
          maxLength: 9
          minLength: 8
          example: '0.600000'
          description: "Fixed rate applied under the credit modality contract. e.g. 0.014500. The entry must respect 6 decimal places, even if they are filled with zeros(percentage representation e.g.: 0.150000. This value represents 15%. The value 1 represents 100%).\n\n[Restriction] This field is mandatory if the postFixedRate field is not sent.\n"
        postFixedRate:
          type: string
          pattern: ^\d{1,2}\.\d{6}$
          format: double
          maxLength: 9
          minLength: 8
          description: "Post-fixed rate applied under the credit modality contract. e.g. 0.0045.The entry must respect 6 decimal places, even if they are filled with zeros (percentage representation e.g.: 0.1500. This value represents 15%. The value 1 represents 100%). For post-fixed rates it is necessary to report the indexer (field referentialRateIndexerSubType).\n\n[Restriction] This field is mandatory if the preFixedRate field is not sent.\n"
          example: '0.550000'
        additionalInfo:
          type: string
          maxLength: 1200
          pattern: ^[^\s](.*[^\s])?$
          example: Informações adicionais
          description: "Text with additional information about the composition of the interest rates agreed. \n\n[Restriction] If the institution has the information for sharing, it must be reported.\n"
    LoansLinksNonPaginated:
      type: object
      description: References to other resources of the requested API.
      required:
      - self
      properties:
        self:
          type: string
          format: url
          maxLength: 4048
          description: Full URI that generated the current response.
          example: https://api.banco.com.br/open-banking/api/v1/resource
    LoansPayments:
      type: object
      description: Set of information relating to the payments made on a loans credit operation.
      required:
      - contractOutstandingBalance
      - releases
      properties:
        paidInstalments:
          type: number
          maximum: 2147483647
          example: 73
          description: Total number of installments paid on the contract relating to the Credit Modality reported.
        contractOutstandingBalance:
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: "Amount necessary for the customer to settle the debt, that is, this field must be filled with the updated outstanding balance described in the DDC (Documento Descritivo de Crédito). The updated amount to be settled for the day must be adjusted for sharing by the Transmitting institution by 10:00 of the same day, especially for the products covered in the scope of Credit Portability via OFB, since this amount is used by the Receiving institution in the role of Proposer for payment to the Transmitting institution in the role of Creditor.  \n"
        lastUpdatedContractOutstandingBalance:
          type: string
          format: date-time
          description: "Date and time of the last update of the value of the contractOutstandingBalance field, in accordance with the RFC-3339 specification, UTC format.\n\n[Restriction] This field is mandatory if the `productSubTypeCategory` field is filled with `CREDITO_PESSOAL_CLEAN` or `CONSIGNADO_SIAPE` in the /contracts/{contractId} endpoint.  \n"
          minLength: 24
          maxLength: 24
          example: '2021-05-21T08:30:03.374Z'
        totalRemainingAmount:
          description: "Total amount remaining for the customer to settle the contract, considering the total sum of all installments falling due and overdue, as well as all the rates, fees and charges of the installments. In cases of contracts with post-fixed rates, consider only pre-fixed values, since the post-fixed calculation occurs only at a future moment, and the value is subject to the variations of its indexer.\n\n[Restriction] This field is mandatory if the `productSubTypeCategory` field is filled with `CREDITO_PESSOAL_CLEAN` or `CONSIGNADO_SIAPE` in the /contracts/{contractId} endpoint.  \n"
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
        releases:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/LoansReleases'
          description: List of the payments made in the period
    LoansFeeOverParcel:
      type: object
