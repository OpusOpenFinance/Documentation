    AccountsEnumAccountSubType:
      type: string
      enum:
        - INDIVIDUAL
        - CONJUNTA_SIMPLES
        - CONJUNTA_SOLIDARIA
      description: |
        Account subtype (see Enum):
        Individual account - has a single holder
        Simple joint account - where financial movements may only be carried out upon the authorization of ALL the account holders.
        Joint and several account - is the modality whose holders may carry out movements on their own, that is, without the authorization of the other holders being necessary
      example: INDIVIDUAL
    AccountsEnumCompletedAuthorisedPaymentIndicator:
      type: string
      description: |
        Transaction indicator:
          - Settled transaction: the transaction reaches this status when the `transactionId` becomes immutable;
          - Future entry: the transaction will be settled at a future moment, that is, the `transactionId` may change;
          - Transaction processing: the transaction is being processed, that is, the `transactionId` may change.
      enum:
        - TRANSACAO_EFETIVADA
        - LANCAMENTO_FUTURO
        - TRANSACAO_PROCESSANDO
      example: TRANSACAO_EFETIVADA
    AccountsEnumTransactionTypes:
      type: string
      description: |
        The field must classify the transaction into one of the described types.
        The transmitting institution must classify the available transactions by associating them with one of the items of the Enum listed in this field.
        The OUTROS option must only be used for the cases in which the shared transaction in fact cannot be classified as one of the items of this Enum.
        For example in the case of the receipt of alimony.
      enum:
        - TED
        - DOC
        - PIX
        - TRANSFERENCIA_MESMA_INSTITUICAO
        - BOLETO
        - CONVENIO_ARRECADACAO
        - PACOTE_TARIFA_SERVICOS
        - TARIFA_SERVICOS_AVULSOS
        - FOLHA_PAGAMENTO
        - DEPOSITO
        - SAQUE
        - CARTAO
        - ENCARGOS_JUROS_CHEQUE_ESPECIAL
        - RENDIMENTO_APLIC_FINANCEIRA
        - PORTABILIDADE_SALARIO
        - APLICACAO_FINANCEIRA
        - RESGATE_APLIC_FINANCEIRA
        - OPERACAO_CREDITO
        - TRANSFERENCIA_SALDO_RESERVADO
        - OUTROS
      example: PIX
