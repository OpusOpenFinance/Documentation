    ExchangesEnumEventType:
      type: string
      description: |
        For the domain field:

        1 - Contracting in the Primary Market.
        2 - Amendment of a Foreign Exchange Transaction in the Primary Market.
        3 - Cancellation of a Foreign Exchange Transaction in the Primary Market.
        4 - Settlement of a Foreign Exchange Transaction in the Primary Market.
        5 - Write-off of the Amount to be Settled of a Foreign Exchange Transaction in the Primary Market.
        6 - Reinstatement of the Write-off of the Amount to be Settled of a Foreign Exchange Transaction in the Primary Market.
        9 - Annulment of a Foreign Exchange Transaction in the Primary Market (used, for example, in the annulment of a settlement/cancellation event).
        Note: The codes follow the layout of the messaging sent by the institutions to the Central Bank.

        The event is related to the type of contracting.
      enum:
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
        - '6'
        - '9'
      example: '2'
