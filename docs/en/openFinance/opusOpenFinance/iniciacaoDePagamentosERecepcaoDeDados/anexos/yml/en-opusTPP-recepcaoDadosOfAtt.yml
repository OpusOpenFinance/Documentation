        data:
          $ref: '#/components/schemas/AccountsAccountBalancesData'
        links:
          $ref: '#/components/schemas/AccountsLinks'
        meta:
          $ref: '#/components/schemas/AccountsMeta'
    AccountsResponseReservedBalances:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          $ref: '#/components/schemas/AccountsAccountReservedBalancesData'
        links:
          $ref: '#/components/schemas/AccountsLinks'
        meta:
          $ref: '#/components/schemas/AccountsMeta'
    AccountsResponseAccountIdentification:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          $ref: '#/components/schemas/AccountsAccountIdentificationData'
        links:
          $ref: '#/components/schemas/AccountsLinksAccountId'
        meta:
          $ref: '#/components/schemas/AccountsMeta'
    AccountsResponseAccountOverdraftLimits:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          $ref: '#/components/schemas/AccountsAccountOverdraftLimitsData'
        links:
          $ref: '#/components/schemas/AccountsLinks'
        meta:
          $ref: '#/components/schemas/AccountsMeta'
    AccountsResponseAccountTransactions:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          description: |
            List of the entries relating to the transactions carried out and of future entries for the following accounts: demand deposit, savings and prepaid payment
          minItems: 0
          items:
            $ref: '#/components/schemas/AccountsAccountTransactionsData'
        links:
          $ref: '#/components/schemas/AccountsTransactionsLinks'
        meta:
          $ref: '#/components/schemas/AccountsMetaOnlyRequestDateTime'
    AccountsAccountData:
      type: object
      required:
        - brandName
        - companyCnpj
        - type
        - compeCode
        - number
        - accountId
      properties:
        brandName:
          type: string
          description: 'Name of the Brand reported by the participant in Open Finance. It is recommended to use, whenever possible, the same brand name assigned in the directory field Customer Friendly Server Name (Authorisation Server).'
          maxLength: 80
          pattern: '[\w\W\s]*'
          example: Organização A
        companyCnpj:
          type: string
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          description: 'Complete CNPJ record of the institution responsible for the Registry - the CNPJ corresponds to the alphanumeric representation of the registration in the Legal Entity Registry (Cadastro de Pessoa Jurídica). Only the CNPJ characters must be provided, without a mask.'
          example: '21128159000166'
        type:
          $ref: '#/components/schemas/EnumAccountType'
        compeCode:
          type: string
          description: 'Identifier code assigned by the Central Bank of Brazil to the institutions participating in the STR (Reserves Transfer System).The Compe (Clearing System for Checks and Other Papers) is a system that identifies and processes bank clearings. It is represented by a three-digit code that serves as a bank identifier, and thus each banking institution has a unique number'
          pattern: '^\d{3}$'
          maxLength: 3
          example: '001'
        branchCode:
          type: string
          description: |
            Code of the Branch holding the account. (A branch is the facility intended for serving customers, the general public and the members of credit unions, in the exercise of the institution's activities, and it may not be mobile or transitory)

            [Restriction] It must mandatorily be filled in when the "type" field is different from CONTA_PAGAMENTO_PRE_PAGA.
          pattern: '^\d{4}$'
          maxLength: 4
          example: '6272'
        number:
          type: string
          description: Account number
          pattern: '^\d{8,20}$'
          maxLength: 20
          example: '94088392'
        checkDigit:
          type: string
          description: |
            Account check digit

            [Restriction] It must mandatorily be filled in when the `type` field is different from a prepaid account. In the cases in which the prepaid account has a check digit, sending it is mandatory.
          pattern: '[\w\W\s]*'
          maxLength: 1
          example: '4'
        accountId:
          type: string
          description: 'Uniquely identifies  the customer''s account, maintaining the immutability rules within the transmitting institution.'
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          maxLength: 100
          minLength: 1
          example: '92792126019929279212650822221989319252576'
    AccountsAccountIdentificationData:
      type: object
      description: |
        Set of the attributes that characterize the following Accounts: demand deposit, savings and prepaid payment
      required:
        - compeCode
        - number
        - type
        - subtype
        - currency
      properties:
        compeCode:
          type: string
          maxLength: 3
          pattern: '^\d{3}$'
          description: 'Identifier code assigned by the Banco Central do Brasil to the institutions participating in the STR (Reserve Transfer System). The code number replaced the former COMPE code. All the STR participants, except the Financial Market Infrastructures (IMF) and the National Treasury Secretariat, have a code number regardless of whether they participate in the Check Clearing House (Compe).'
          example: '001'
        branchCode:
          type: string
          maxLength: 4
          pattern: '^\d{4}$'
          description: |
            Code of the Branch holding the account. (A branch is the facility intended for serving customers, the general public and the members of credit unions, in the exercise of the institution's activities, and it may not be mobile or transitory)

            [Restriction] It must mandatorily be filled in when the "type" field is different from a prepaid account.
          example: '6272'
        number:
          type: string
          maxLength: 20
          pattern: '^\d{8,20}$'
          description: |
            Account number
          example: '24550245'
        checkDigit:
          type: string
          maxLength: 1
          pattern: '[\w\W\s]*'
          description: |
            Account check digit.

            [Restriction] It must mandatorily be filled in when the "type" field is different from a prepaid account. In the cases in which the prepaid account has a check digit, sending it is mandatory
          example: '4'
        type:
          $ref: '#/components/schemas/EnumAccountType'
        subtype:
          $ref: '#/components/schemas/AccountsEnumAccountSubType'
        currency:
          type: string
          pattern: '^(\w{3}){1}$'
          maxLength: 3
          description: |
            Currency relating to the transaction amount, according to the ISO-4217 model. e.g. 'BRL'
            All the reported balances are represented in the currency in force in Brazil
          example: BRL
    AccountsAccountBalancesData:
      type: object
      description: |
        Set of information on the following Accounts: demand deposit, savings and prepaid payment
      required:
        - availableAmount
        - blockedAmount
        - automaticallyInvestedAmount
        - updateDateTime
      properties:
        availableAmount:
          $ref: '#/components/schemas/AccountsAccountBalancesDataAvailableAmount'
        blockedAmount:
          $ref: '#/components/schemas/AccountsAccountBalancesDataBlockedAmount'
        automaticallyInvestedAmount:
          $ref: '#/components/schemas/AccountsAccountBalancesDataAutomaticallyInvestedAmount'
        updateDateTime:
          type: string
          format: date-time
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2021-05-21T08:30:00Z'
          description: |
            Date and time of the last update of the balance. The institution is expected to report the last time it captured the balance for sharing in Open Finance. Thus, it is possible that:
            - If the institution captures data synchronously, this information is from a few moments ago;
            - If the institution captures data asynchronously, this information is from hours or days in the past;
            - When there is no date specifically linked to the block, the date and time of the update of the registration data as a whole is assumed.

            In any case, the maximum timeliness deadline of the Accounts API must continue to be respected.
        hasReservedBalance:
          type: boolean
          description: |
            Reports whether the customer has a reserved balance. If the customer has active balance reserves, including in the cases of a zero balance, the value sent must be `TRUE`.
            If the customer does not have the product, it must be `FALSE`. If the field returns `TRUE`, the reserved balance data is found at the endpoint `GET /accounts/{accountId}/reserved-balances`

            [Restriction] Field mandatory to be sent by the transmitting institution that offers balance reserve products linked to the account.
            This field refers exclusively to reserve balances that are not associated with investments.
            Investment products must be reported in the Investments APIs.
          example: true
    AccountsAccountReservedBalancesData:
      type: array
      description: List of pockets/reserves
      minItems: 0
      items:
        type: object
        required:
          - reservedIdentification
          - availableAmount
        properties:
          reservedName:
            type: string
            description: Name given by the user to the reserve
            pattern: '^[^\s][\w\W\s]*[^\s]$'
            maxLength: 248
            minLength: 5
            example: Caixinha Paras Férias
          reservedIdentification:
            type: string
            description: Unique identifier of the reserve
            format: uuid
            pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
            maxLength: 36
            minLength: 1
            example: d78fc4e5-37ca-4da3-adf2-9b082bf92280
          availableAmount:
            type: array
            description: Balance that is available in the reserve
            minLength: 1
            items:
              type: object
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  description: Amount related to the object.
                  format: double
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  maxLength: 20
                  minLength: 4
                  example: '1000.0400'
                currency:
                  type: string
                  description: 'Currency of the monetary value, following the ISO-4217 model.'
                  pattern: '^[A-Z]{3}$'
                  maxLength: 3
                  example: BRL
                remuneration:
                  type: object
                  description: Remuneration applied to the reserve
                  required:
                    - rateType
                    - indexer
                    - calculation
                    - ratePeriodicity
                  properties:
                    preFixedRate:
                      type: string
                      description: |
                        Pre-fixed remuneration rate for the balance reserve. e.g. 0.014500. The filling in must respect the 6 decimal places, even if they come filled in with zeros(percentage representation e.g.: 0.150000. This value represents 15%. The value 1 represents 100%).

                        [Restriction] Field mandatory to be filled in by the participants when the field `postFixedIndexerPercentage` is not filled in
                      format: double
                      pattern: '^\d{1}\.\d{6}$'
                      minLength: 8
                      maxLength: 8
                      example: '0.300000'
                    postFixedIndexerPercentage:
                      type: string
                      description: |
                        Percentage of the post-fixed indexer for the balance reserve. e.g. 0.014500. The filling in must respect the 6 decimal places, even if they come filled in with zeros(percentage representation e.g.: 0.150000. This value represents 15%. The value 1 represents 100%).

                        [Restriction] Field mandatory to be filled in by the participants when the field `preFixedRate` is not filled in
                      format: double
                      pattern: '^\d{1}\.\d{6}$'
                      minLength: 8
                      maxLength: 8
                      example: '0.300000'
                    rateType:
                      type: string
                      description: Type of the remuneration rate (linear or exponential)
                      enum:
                        - LINEAR
                        - EXPONENCIAL
                      example: LINEAR
                    indexer:
                      type: string
                      description: Index used as a reference for the remuneration of the reserve
                      enum:
                        - CDI
                        - DI
                        - TR
                        - IPCA
                        - IGP_M
                        - IGP_DI
                        - INPC
                        - BCP
                        - TLC
                        - SELIC
                        - PRE_FIXADO
                        - OUTROS
                      example: CDI
                    calculation:
                      type: string
                      description: Calculation basis (business days or calendar days)
                      enum:
                        - DIAS_UTEIS
                        - DIAS_CORRIDOS
                      example: DIAS_UTEIS
                    ratePeriodicity:
                      type: string
                      description: Frequency of the remuneration rate (monthly, annual, daily, semi-annual)
                      enum:
                        - MENSAL
                        - ANUAL
                        - DIARIO
                        - SEMESTRAL
                      example: MENSAL
                    indexerAdditionalInfo:
                      type: string
                      description: |
                        Additional information on the indexer

                        [Restriction] Field mandatory to be filled in by the participants when there is `Outros` in the `indexer` field
                      pattern: '[\w\W\s]*'
                      maxLength: 50
                      example: Dólar
    AccountsAccountOverdraftLimitsData:
      type: object
      description: |
        Set of information on the Account of: demand deposit
      properties:
        overdraftContractedLimit:
          $ref: '#/components/schemas/AccountsAccountOverdraftLimitsDataOverdraftContractedLimit'
        overdraftUsedLimit:
          $ref: '#/components/schemas/AccountsAccountOverdraftLimitsDataOverdraftUsedLimit'
        unarrangedOverdraftAmount:
          $ref: '#/components/schemas/AccountsAccountOverdraftLimitsDataUnarrangedOverdraftAmount'
    AccountsAccountTransactionsData:
      type: object
      required:
        - transactionId
        - completedAuthorisedPaymentType
        - creditDebitType
        - transactionName
        - type
        - transactionAmount
        - transactionDateTime
      properties:
        transactionId:
          type: string
          description: |
            Unique code or identifier provided by the institution that maintains the account to represent the individual transaction.
            Ideally, the `transactionId` should be immutable.
            However, the `transactionId` must comply, at a minimum, with the immutability rules proposed in accordance with the table “Immutability date by transaction type” present in the guidelines of this API.
          maxLength: 100
          minLength: 1
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: TXpRMU9UQTROMWhZV2xSU1FUazJSMDl
        completedAuthorisedPaymentType:
          $ref: '#/components/schemas/AccountsEnumCompletedAuthorisedPaymentIndicator'
        creditDebitType:
          $ref: '#/components/schemas/EnumCreditDebitIndicator'
        transactionName:
          type: string
          maxLength: 200
          pattern: '[\w\W\s]*'
          description: |
            Literal used at the financial institution to identify the transaction.
            The information presented must be the same as that used in the institution's digital channels (as well as the transaction history presented on the application or browser screen).
            If the institution has more than one digital channel, the information shared must be that of the channel that presents the most complete description possible of the transaction.
            In cases where the description of the transaction is presented with multiple lines, all the lines must be sent (concatenated) in this attribute, and the concatenation of the information already sent in other attributes (e.g.: amount, date) of the same endpoint is not mandatory.
            Additionally, the Banco Central may determine the sharing format to be adopted by a specific participating institution.
          example: Transferencia Enviada Lima Santos
        type:
          $ref: '#/components/schemas/AccountsEnumTransactionTypes'
        typeAdditionalInfo:
          type: string
          maxLength: 144
          pattern: '[\w\W\s]*'
          description: |
            Additional information for the transaction type.

            [Restriction] This field is mandatory to send if the `type` field is defined as `OUTROS`.
          example: 'APLIC_FINANCEIRA'
        transactionAmount:
          $ref: '#/components/schemas/AccountsAccountTransactionsDataAmount'
        transactionDateTime:
          type: string
          maxLength: 24
          pattern: '(^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)\.(?:[0-9]){3}Z$)'
          description: |
            Original date and time of the transaction that is reported in the digital channels. For Future entries the date reported must be the expected settlement date reported in the digital channels. If the institution does not know the exact time of the settlement, the hour, minute, second and millisecond values may be filled in with zero. After the settlement of the transaction, the field must be filled in with the date and the time of the settlement of the transaction.
          example: '2016-01-29T12:29:03.374Z'
        partieCnpjCpf:
          type: string
          maxLength: 14
          pattern: '^([0-9]{11}|[0-9A-Z]{12}[0-9]{2})$'
          description: |
            Identification of the person involved in the transaction: payer or payee (Fill it in with the CPF or CNPJ, without formatting). With IN BCB No. 371, as of 02/05/23, the submission of counterparty identification information became mandatory for payment transactions. For further details, please consult the page `Orientações - Contas`.

            [Restriction] When the "type“ is filled in with the value FOLHA_PAGAMENTO and the transmitting institution is the one responsible for the salary payment (payroll bank), the partieCnpjCpf reported must be that of the related employer.
          example: '43908445778'
        partiePersonType:
          $ref: '#/components/schemas/EnumPartiePersonType'
        partieCompeCode:
          type: string
          maxLength: 3
          pattern: '^\d{3}$'
          description: |
            Identifier code assigned by the Banco Central do Brasil to the institutions participating in the STR (Reserve Transfer System) relating to the person involved in the transaction. The code number replaced the former COMPE code. All the STR participants, except the Financial Market Infrastructures (IMF) and the National Treasury Secretariat, have a code number regardless of whether they participate in the Check Clearing House (Compe).

            [RESTRICTION] It is mandatory when the institution has the code number.
          example: '001'
        partieBranchCode:
          type: string
          maxLength: 4
          pattern: '^\d{4}$'
          description: 'Code of the Branch holding the account of the person involved in the transaction. (A branch is the facility intended for serving customers, the general public and the members of credit unions, in the exercise of the institution''s activities, and it may not be mobile or transitory)'
          example: '6272'
        partieNumber:
          type: string
          maxLength: 20
          pattern: '^\d{8,20}$'
          description: Account number of the person involved in the transaction
          example: '67890854360'
        partieCheckDigit:
          type: string
          maxLength: 1
          pattern: '[\w\W\s]*'
          description: Check digit of the account of the person involved in the transaction
          example: '4'
        codeISPB:
          type: string
          pattern: '^[0-9A-Z]{8}$'
          description: |
            Unique code assigned by the Banco Central do Brasil to each institution participating in the Payment System.

            This field identifies the ISPB of the counterparty institution of the transaction and must be filled in according to the attribute that indicates the financial direction of the transaction, according to the `creditDebitType` field:
             - For `CREDITO` transactions (inflow of funds into the account): report the ISPB of the institution of origin of the funds.
             - For `DEBITO` transactions (outflow of funds from the account): report the ISPB of the institution of destination of the funds. [RESTRICTION] It is   mandatory when counterparty information exists.
          example: '00300300'
    AccountsAccountTransactionsDataAmount:
      type: object
      description: Transaction amount. Expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          format: double
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: Amount related to the object.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          description: 'Currency of the monetary value, following the ISO-4217 model.'
          example: BRL
    AccountsAccountBalancesDataAvailableAmount:
      type: object
      description: |
        Balance available for immediate use. It does not consider the overdraft facility, automatic investments linked to the account, nor a balance reserve.
        Expressed as a monetary value with a minimum of 2 and a maximum of 4 decimal places.
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          format: double
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
