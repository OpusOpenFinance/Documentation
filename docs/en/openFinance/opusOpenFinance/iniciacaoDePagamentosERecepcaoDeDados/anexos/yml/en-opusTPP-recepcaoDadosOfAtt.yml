        currency:
          $ref: '#/components/schemas/TreasureTitlesCurrency'
    TreasureTitlesVoucherPaymentIndicator:
      description: Indication of whether there is a coupon payment (Yes or no).
      example: SIM
      enum:
        - SIM
        - NAO
      type: string
    TreasureTitlesVoucherPaymentPeriodicity:
      description: |
        If there is a coupon payment, describe the frequency
        (monthly, quarterly, half-yearly, annual, irregular and others)

        [Restriction] Field that must be filled in by the participants when the field 'voucherPaymentIndicator' is filled in with the value 'SIM'.
      example: MENSAL
      enum:
        - MENSAL
        - TRIMESTRAL
        - SEMESTRAL
        - ANUAL
        - IRREGULAR
        - OUTROS
      type: string
    TreasureTitlesVoucherPaymentPeriodicityAdditionalInfo:
      description: |
        Additional information on the coupon payment frequency.

        [Restriction] Field that must be filled in by the participants when the field 'voucherPaymentPeriodicity' is filled in with the value 'OUTROS'.
      maxLength: 50
      pattern: '[\w\W\s]*'
      example: Diária
      type: string
    FundsResponseInvestmentList:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/FundsInvestmentListItem'
        links:
          $ref: '#/components/schemas/FundsLinks'
        meta:
          $ref: '#/components/schemas/FundsMeta'
      additionalProperties: false
    FundsInvestmentListItem:
      type: object
      description: List of investment funds held by the customer at the transmitting institution and for which they have provided consent.
      required:
        - brandName
        - companyCnpj
        - investmentId
      properties:
        brandName:
          type: string
          description: 'Name of the Brand reported by the participant in Open Finance. It is recommended to use, whenever possible, the same brand name assigned in the directory field Customer Friendly Server Name (Authorisation Server).'
          pattern: '^[^\s](.*[^\s])?$'
          example: Organização A
          maxLength: 80
        companyCnpj:
          type: string
          description: Complete CNPJ record of the institution responsible for the Registry - the CNPJ corresponds to the alphanumeric representation of the registration in the Legal Entity Registry (Cadastro de Pessoa Jurídica). Only the CNPJ characters must be provided, without a mask.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '21128159000166'
        anbimaCategory:
          type: string
          description: |
            In accordance with the ANBIMA classification, which follows ANBIMA resolution 77.

            – Fixed Income

            – Equities

            – Multimarket

            – Foreign Exchange

            https://www.anbima.com.br/data/files/5A/44/2C/B7/8411B510CD3B4DA568A80AC2/DeliberacaoN77-Diretriz-de-Classificacao-de-Fundos.pdf
          enum:
            - RENDA_FIXA
            - ACOES
            - MULTIMERCADO
            - CAMBIAL
          example: RENDA_FIXA
        anbimaClass:
          type: string
          description: Field required for adherence to Resolution CVM175. Awaiting market definitions. It must be a field of the enum type.
          maxLength: 70
          pattern: '[\w\W\s]*'
        anbimaSubclass:
          type: string
          description: Field required for adherence to Resolution CVM175. Awaiting market definitions. It must be a field of the enum type.
          maxLength: 70
          pattern: '[\w\W\s]*'
        investmentId:
          type: string
          description: Uniquely identifies the customer's relationship with the product, maintaining the immutability rules within the transmitting institution. In the cases in which the customer, after completing 12 months from the last movement and with a zeroed asset quantity (the customer no longer holds the product under the custody of the transmitting institution), buys again the asset in which they had already invested in past periods, maintain the same investmentId previously used.
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: '92792126019929200000000000000000000000000'
      additionalProperties: false
    FundsResponseInvestmentIdentification:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          $ref: '#/components/schemas/FundsInvestmentIdentificationData'
        links:
          $ref: '#/components/schemas/FundsLinks'
        meta:
          $ref: '#/components/schemas/FundsMeta'
      additionalProperties: false
    FundsInvestmentIdentificationData:
      type: object
      description: Information on the investment fund product to which investmentId refers.
      required:
        - name
        - cnpjNumber
      properties:
        name:
          type: string
          description: Official name of the investment fund as displayed to customers in the electronic channels.
          maxLength: 250
          example: CONSTELLATION MASTER FIA
        cnpjNumber:
          type: string
          description: CNPJ of the investment fund.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '11225860000140'
        isinCode:
          type: string
          description: |
            Universal code that identifies each security or financial instrument, in accordance with ISO Standard 6166.

            DEFINITION: The ISIN (International Securities Identification Number) is a code that identifies a security, in accordance with the ISO 6166 standard.

            STRUCTURE: The ISIN is an alphanumeric code that has 12 characters with the following structure:
            - A prefix, made up of 2 alpha characters, which identifies the country code (ISO Standard 3166);
            - The basic number, made up of 9 alphabetic or numeric characters in its length;
            - A numeric check digit.
          maxLength: 12
          minLength: 12
          pattern: '^[A-Z]{2}([A-Z0-9]){9}\d{1}$'
          example: BRCST4CTF001
        anbimaCategory:
          type: string
          description: |
            In accordance with the ANBIMA classification, which follows ANBIMA resolution 77.

            – Fixed Income

            – Equities

            – Multimarket

            – Foreign Exchange

            https://www.anbima.com.br/data/files/5A/44/2C/B7/8411B510CD3B4DA568A80AC2/DeliberacaoN77-Diretriz-de-Classificacao-de-Fundos.pdf
          enum:
            - RENDA_FIXA
            - ACOES
            - MULTIMERCADO
            - CAMBIAL
          example: RENDA_FIXA
        anbimaClass:
          type: string
          description: Field required for adherence to Resolution CVM175. Awaiting market definitions. It must be a field of the enum type.
          maxLength: 70
          pattern: '[\w\W\s]*'
        anbimaSubclass:
          type: string
          description: Field required for adherence to Resolution CVM175. Awaiting market definitions. It must be a field of the enum type.
          maxLength: 70
          pattern: '[\w\W\s]*'
      additionalProperties: false
    FundsResponseBalances:
