    VariableIncomesProductListData:
      type: object
      description: List of Variable Income assets held by the customer at the transmitting institution and for which they have granted consent.
      required:
        - brandName
        - companyCnpj
        - investmentId
      properties:
        brandName:
          type: string
          description: 'Name of the Brand reported by the participant in Open Finance. It is recommended to use, whenever possible, the same brand name assigned in the directory field Customer Friendly Server Name (Authorisation Server).'
          pattern: '^[^\s](.*[^\s])?$'
          example: Organização A
          maxLength: 80
        companyCnpj:
          type: string
          description: Complete CNPJ record of the institution responsible for the Registry - the CNPJ corresponds to the alphanumeric representation of the registration in the Legal Entity Registry (Cadastro de Pessoa Jurídica). Only the CNPJ characters must be provided, without a mask.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '21281590001660'
        investmentId:
          type: string
          description: Uniquely identifies the customer's relationship with the product, maintaining the immutability rules within the transmitting institution. In the cases in which the customer, after completing 12 months from the last movement and with a zeroed asset quantity (the customer no longer holds the product under the custody of the transmitting institution), buys again the asset in which they had already invested in past periods, maintain the same investmentId previously used.
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: '92792126019929200000000000000000000000000'
      additionalProperties: false
    VariableIncomesProductIdentificationData:
      type: object
      required:
        - isinCode
        - ticker
      properties:
        issuerInstitutionCnpjNumber:
          type: string
          description: CNPJ of the issuing institution. If the transmitting institution has the information, sending this field is mandatory.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '11225860000140'
        isinCode:
          type: string
          description: |
            ISIN code of the issue, ISIN code of the product, code of the issuer: universal code that identifies each security or financial instrument, in accordance with ISO Standard 6166.
          maxLength: 12
          pattern: '^[A-Z]{2}([A-Z0-9]){9}\d{1}$'
          example: BRCST4CTF001
        ticker:
          type: string
          description: Trading code for the identification of assets traded on the stock exchange.
          maxLength: 35
          pattern: '[\w\W\s]*'
          example: PETR4
      additionalProperties: false
    VariableIncomesBalanceData:
      type: object
      required:
        - referenceDate
        - priceFactor
        - grossAmount
        - blockedBalance
        - quantity
        - closingPrice
      properties:
        referenceDate:
          type: string
          format: date
          description: Closed position for the asset as of the previous day's date.
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2023-01-07'
          maxLength: 10
        priceFactor:
          type: string
          format: double
          description: |
            Factor that indicates the number of shares used for the formation of the price. The value provided must be greater than zero.
          pattern: '^\d{1,15}\.\d{2,8}$'
          maxLength: 24
          example: '100.0005'
        grossAmount:
          $ref: '#/components/schemas/VariableIncomesBalancesGrossAmount'
        blockedBalance:
          $ref: '#/components/schemas/VariableIncomesBalancesBlockedBalance'
        quantity:
          type: string
          format: double
          description: Total quantity of the asset on the reference date.
          pattern: '^-?\d{1,15}\.\d{2,8}$'
          maxLength: 25
          example: '1000.00000004'
        closingPrice:
          $ref: '#/components/schemas/VariableIncomesBalancesClosingPrice'
    VariableIncomesTransactionsData:
      type: object
      required:
        - type
        - transactionType
        - transactionDate
        - transactionValue
        - transactionId
      properties:
        type:
          $ref: '#/components/schemas/VariableIncomesEnumTransactionsType'
        transactionType:
          $ref: '#/components/schemas/VariableIncomesEnumTransactionsTransactionType'
        transactionTypeAdditionalInfo:
          type: string
          description: |
            Additional information on the type of movement, to be filled in for movements not delimited in the domain.

            [Restriction] Mandatory field for participants when the 'transactionType' field is filled in with the value 'OUTROS'.
          maxLength: 100
          pattern: '[\w\W\s]*'
        transactionDate:
          type: string
          format: date
          description: |
            Movement date according to the date displayed to the customer in the institution's channels. Trading session date: share movements up to the position date.
          maxLength: 10
          minLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
        priceFactor:
          type: string
          format: double
          description: |
            Factor that indicates the number of shares used for the formation of the price. The value provided must be greater than zero.
          pattern: '^\d{1,15}\.\d{2,8}$'
          maxLength: 24
          example: '100.0005'
        transactionUnitPrice:
          type: object
          description: |
            Unit price of the movement: value of the product unit in the investment movement. In custody transfers, when the original PU (from the institution of origin) is not available to the transmitting institution, the PU marked by the institution on the transfer date must be reported.

            [Restriction] Field that must be filled in by the participants when the field `transactionType` is filled in with the values `COMPRA` or `VENDA`.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Amount related to the object.
              maxLength: 21
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              example: '1000.0004'
            currency:
              type: string
              description: 'Currency of the monetary value, following the ISO-4217 model.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        transactionQuantity:
          type: string
          format: double
          description: |
            Quantity of assets moved.

            [Restriction] Field that must be filled in by the participants when the field 'transactionType' is filled in with the values 'COMPRA' or 'VENDA'.
          maxLength: 24
          pattern: '^\d{1,15}\.\d{2,8}$'
          example: '42.00000025'
        transactionValue:
          type: object
          description: Amount of the transaction carried out by the customer.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Amount related to the object.
              maxLength: 20
              pattern: '^\d{1,15}\.\d{2,4}$'
              example: '1000.04'
            currency:
              type: string
              description: 'Currency of the monetary value, following the ISO-4217 model.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        transactionId:
          type: string
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: ABCD2126019929279212650822221989319253344
          description: Code or unique identifier provided by the institution that maintains the individual representation of the movement.
        brokerNoteId:
          type: string
          description: |
            Uniquely identifies the customer's relationship with the product for each broker note number (`brokerNoteNumber`), maintaining the immutability rules within the transmitting institution.
            The content of this field must be used as a parameter in the call to the `GET /broker-notes/{brokerNoteId}` endpoint.

            The relationship between `investmentId` and `brokerNoteId` is N to N, reflecting that one broker note may cover multiple investments and, at the same time, one investment may be associated with different broker notes.

            The relationship between `brokerNoteId` and `brokerNoteNumber` is 1 to 1, ensuring that each natural broker note corresponds to a unique and immutable identifier in the ecosystem.

            [Restriction] Information whose submission is mandatory if the reason for the movement is a purchase or a sale.
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: XWYZ555019929279212650822221989319252233
      additionalProperties: false
