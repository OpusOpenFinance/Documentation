    LoansInstalments:
      type: object
      description: Set of information regarding the remaining term and the installments of a loan credit operation
      required:
      - dueInstalments
      - pastDueInstalments
      - typeContractRemaining
      - typeNumberOfInstalments
      - paidInstalments
      properties:
        typeNumberOfInstalments:
          type: string
          description: Type of total term of the contract relating to the reported credit modality.
          enum:
          - DIA
          - SEMANA
          - MES
          - ANO
          - SEM_PRAZO_TOTAL
          example: MES
        totalNumberOfInstalments:
          type: number
          maximum: 999999999
          example: 130632
          description: "Total Term according to the type (day, week, month, year) relating to the reported Credit Modality. It must correspond to the sum of `paidInstalments` + `pastDueInstalments` + `dueInstalments`.\n\n[Restriction] It must mandatorily be filled in if the `typeNumberOfInstalments` is different from `SEM_PRAZO_TOTAL`.\n"
        typeContractRemaining:
          type: string
          enum:
          - DIA
          - SEMANA
          - MES
          - ANO
          - SEM_PRAZO_REMANESCENTE
          description: "Type of remaining term of the contract relating to the reported credit modality.\n"
        contractRemainingNumber:
          type: number
          maximum: 999999999
          example: 14600
          description: "Remaining Term according to the type (day, week, month, year) relating to the reported Credit Modality.\n\n[Restriction] It must mandatorily be filled in if the typeContractRemaining is different from SEM_PRAZO_REMANESCENTE.\n"
        paidInstalments:
          type: number
          description: Number of installments paid. (In the case of modalities that do not have installments, the number of installments is equal to zero)
          maximum: 999999
          example: 73
        dueInstalments:
          type: number
          description: Number of installments due in the future.(In the case of modalities that do not have installments, the number of installments is equal to zero)
          maximum: 999999
          example: 57
        pastDueInstalments:
          type: number
          description: Number of overdue installments. (In the case of modalities that do not have installments, the number of installments is equal to zero)
          maximum: 999999
          example: 73
        balloonPayments:
          type: array
          items:
            $ref: '#/components/schemas/LoansBalloonPayment'
          minItems: 1
          description: List that provides the due dates and the amount of the non-regular installments of the contract of the queried credit modality
    LoansMeta:
      type: object
      description: Meta information regarding the requested API.
      required:
