          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Amount related to the object.
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              maxLength: 21
              example: '13.8751'
            currency:
              type: string
              description: 'Currency of the monetary value, following the ISO-4217 model.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        stockExchangeAssetTradeNoticeFee:
          type: object
          description: Amount charged by the exchange for the asset trading notice.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Amount related to the object.
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              maxLength: 21
              example: '13.8751'
            currency:
              type: string
              description: 'Currency of the monetary value, following the ISO-4217 model.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        stockExchangeFee:
          type: object
          description: Amount charged by the exchange to remunerate the registration services provided.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Amount related to the object.
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              maxLength: 21
              example: '13.8751'
            currency:
              type: string
              description: 'Currency of the monetary value, following the ISO-4217 model.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        clearingCustodyFee:
          type: object
          description: Fee charged by the financial institutions for custody.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Amount related to the object.
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              maxLength: 21
              example: '13.8751'
            currency:
              type: string
              description: 'Currency of the monetary value, following the ISO-4217 model.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        taxes:
          type: object
          description: 'Taxes charged on the transaction, including day-trade income tax, except income tax withheld at source.'
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Amount related to the object.
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              maxLength: 21
              example: '13.8751'
            currency:
              type: string
              description: 'Currency of the monetary value, following the ISO-4217 model.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        incomeTax:
          type: object
          description: Income tax withheld at source.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Amount related to the object.
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              maxLength: 21
              example: '13.8751'
            currency:
              type: string
              description: 'Currency of the monetary value, following the ISO-4217 model.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        netValue:
          type: object
          description: Net amount of the broker note after expenses relating to the brokerage fee, settlement fee, registration fee, A.N.A fee, exchange fees, custody fee, taxes and IRRF.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Amount related to the object.
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              maxLength: 21
              example: '4889.0012'
            currency:
              type: string
              description: 'Currency of the monetary value, following the ISO-4217 model.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
      additionalProperties: false
    TreasureTitlesResponseListProduct:
      type: object
      required:
