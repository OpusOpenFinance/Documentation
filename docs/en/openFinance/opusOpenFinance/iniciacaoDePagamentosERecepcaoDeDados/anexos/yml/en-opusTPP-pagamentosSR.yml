    patch:
      tags:
      - Device enrollment
      operationId: deleteEnrollment
      description: 'method for revoke or reject a enrollment of account. Após a execução with sucesso deste method irreversível,
        o enrollment of account

        not poderá more be used for authentication nem authorization of initiation of payments.

        Os conceitos of revocation and rejection estão associated to the máquina of estados of the enrollment of account\:


        • revocation: cancellation of a enrollment of account in the status "AUTHORISED";


        • rejection: cancellation of the enrollment of account in the status "AWATING_RISK_SIGNALS", "AWATING_ENROLLMENT"
        and "AWAITING_ACCOUNT_HOLDER_VALIDATION"


        Cabe to the customer desta API distinguir between os dois scenarios for determinar o reason adequado.

        '
      summary: Revoke or reject account enrollment.
      externalDocs:
        description: Open Finance - API Enrollments for Payment Initiation
        url: https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/141557761/SV+API+-+Pagamentos+sem+Redirecionamento
      requestBody:
