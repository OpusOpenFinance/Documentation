  headers:
    xOriginError:
      description: Indicates the origin of the error.
      schema:
        $ref: '#/components/schemas/EnumOriginError'
      required: false
    xErrorSourceUrl:
      description: URL of the call that originated the error, present only when `x-origin-error` = `participant`.
      schema:
        type: string
      required: false
    xRegulatoryV:
      description: Regulatory version desired for the call to the participant (available only on non-proxy routes).
      schema:
        $ref: '#/components/schemas/RegulatoryVersion'
      required: false
    xSelectedRegulatoryV:
      description: Regulatory version actually used in the request to the participant.
      schema:
        $ref: '#/components/schemas/SelectedRegulatoryVersion'
      required: true
    xFapiInteractionIdResponse:
      description: 'a UUID [RFC4122](https://tools.ietf.org/html/rfc4122) usado as a ID of correlation between request and
        response. field of generation and submission required by the payment initiator (client) and o seu value must be "mirrored"
        by the account-holding institution (server) in the header of response.

        '
      schema:
        $ref: '#/components/schemas/XFapiInteractionId'
      required: true
    xV:
      description: 'header that indicates a version implementada of the API by the institution financeira for atender to the
        request. must be filled of forma completa, by exemplo: x-v : 1.0.2.'
      required: true
      schema:
        $ref: '#/components/schemas/XV'
  parameters:
    applicationId:
      name: x-application-id
      in: header
      required: true
      description: Identifier of the application making the request
      schema:
        $ref: '#/components/schemas/UUID'
    authorisationServerId:
      name: x-authorisation-server-id
      required: true
      description: identifier of the Authorisation Server of the trasmissora of the consent, retrieved through of the consula
        of the lista of participants
      in: header
      schema:
        $ref: '#/components/schemas/UUID'
    enrollmentId:
      name: enrollmentId
      in: path
      required: true
      description: 'identifier unique of the enrollment of account created for a initiation of payment requested. must be
        a URN - Uniform Resource Name.

        a URN, according to defined in the [RFC8141](https://tools.ietf.org/html/rfc8141) is a Uniform Resource

        Identifier - URI - that is assigned sob o URI scheme "urn" and a namespace URN specific, with a intenção of that o
        URN

        seja a identifier of resource persistent and independent of the location.

        considering a string urn:bancoex:C1DD33123 as exemplo for enrollmentId temos:

        - o namespace(urn)

        - o identifier associated to the namespace of the institution account-holding institution (bancoex)

        - o identifier specific dentro of the namespace (C1DD33123).

        information more detailed about a construction of namespaces must be consultadas in the [RFC8141](https://tools.ietf.org/html/rfc8141).

        '
      schema:
        $ref: '#/components/schemas/enrollmentId'
    consentId:
      name: consentId
      in: path
      description: 'O consentId is o identifier unique of the consent and must be a URN - Uniform Resource Name.

        a URN, according to defined in the [RFC8141](https://tools.ietf.org/html/rfc8141) is a Uniform Resource

        Identifier - URI - that is assigned sob o URI scheme "urn" and a namespace URN specific, with a intenção of that o
        URN

        seja a identifier of resource persistent and independent of the location.

        considering a string urn:bancoex:C1DD33123 as exemplo for consentId temos:

        - o namespace(urn)

        - o identifier associated to the namespace of the institution account-holding institution (bancoex)

        - o identifier specific dentro of the namespace (C1DD33123).

        information more detailed about a construction of namespaces must be consultadas in the [RFC8141](https://tools.ietf.org/html/rfc8141).

        '
      required: true
      schema:
        type: string
        pattern: ^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*'%\/?#]+$
        maxLength: 256
    recurringConsentId:
      name: recurringConsentId
      in: path
      description: 'O `recurringConsentId` is o identifier unique of the consent of longa duração and must be a URN - Uniform
        Resource Name.

        a URN, according to defined in the [RFC8141](https://tools.ietf.org/html/rfc8141) is a Uniform Resource

        Identifier - URI - that is assigned sob o URI scheme "urn" and a namespace URN specific, with a intenção of that o
        URN

        seja a identifier of resource persistent and independe of the location.

        considering a string urn:bancoex:C1DD33123 as exemplo for `recurringConsentId` temos:

        - o namespace(urn)

        - o identifier associated to the namespace of the institution account-holding institution (bancoex).

        - o identifier specific dentro of the namespace (C1DD33123).

        information more detailed about a construction of namespaces must be consultadas in the [RFC8141](https://tools.ietf.org/html/rfc8141).

        '
      required: true
      schema:
        type: string
        pattern: ^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*'%\/?#]+$
        maxLength: 256
    regulatoryV:
      name: x-regulatory-v
      required: false
      description: Regulatory version desired for the call to the participant (available only on non-proxy routes).
      in: header
      schema:
        $ref: '#/components/schemas/RegulatoryVersion'
    authorizationHeader:
      name: Authorization
      in: header
      description: Standard HTTP header. Allows credentials to be provided depending on the type of requested resource
      required: true
      schema:
        type: string
        pattern: '[\w\W\s]*'
        maxLength: 2048
    xCustomerUserAgent:
      name: x-customer-user-agent
      in: header
      description: Indicates the user-agent used by the user.
      required: false
      schema:
        type: string
        pattern: '[\w\W\s]*'
        minLength: 1
        maxLength: 100
    xFapiAuthDate:
      name: x-fapi-auth-date
      in: header
      description: 'Date when the user last logged in with the payment initiator. Representada of acordo with a [RFC7231](https://tools.ietf.org/html/rfc7231).Exemplo:
        Sun, 10 Sep 2017 19:43:31 UTC'
      required: false
      schema:
        type: string
        pattern: ^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), \d{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) \d{4} \d{2}:\d{2}:\d{2}
          (GMT|UTC)$
        minLength: 29
        maxLength: 29
    xFapiCustomerIpAddress:
      name: x-fapi-customer-ip-address
      in: header
      description: The user's IP address if currently logged in with the payment initiator.
      required: false
      schema:
        type: string
        pattern: '[\w\W\s]*'
        minLength: 1
        maxLength: 100
    xFapiInteractionId:
      name: x-fapi-interaction-id
      in: header
      description: a UUID [RFC4122](https://tools.ietf.org/html/rfc4122) usado as a ID of correlation between request and
        response. field of generation and submission required by the payment initiator (client) and o seu value must be "mirrored"
        by the account-holding institution (server) in the header of response. if not seja received or if for received a value
        invalid, a account-holding institution must gerar a x-fapi-interaction-id and retorná-lo in the response with o HTTP
        status code 400. A payment initiator must acatar o value received of the account-holding institution.
      required: true
      schema:
        type: string
        format: uuid
        minLength: 1
        maxLength: 36
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        example: d78fc4e5-37ca-4da3-adf2-9b082bf92280
    xIdempotencyKey:
      name: x-idempotency-key
      in: header
      description: Custom HTTP header. Unique request identifier to support idempotency.
      required: true
      schema:
        type: string
        maxLength: 40
        pattern: ^(?!\s)(.*)(\S)$
    xBcbNfc:
      name: x-bcb-nfc
      in: header
      description: O field representa a transaction iniciada via NFC. O submission desse field is required nesse cenário.
        As detentoras must store a information and correlacioná-la with o consent and o payment originado.
      required: false
      schema:
        type: boolean
