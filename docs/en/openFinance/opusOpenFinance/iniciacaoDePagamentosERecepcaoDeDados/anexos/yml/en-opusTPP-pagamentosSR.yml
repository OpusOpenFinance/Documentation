openapi: 3.0.0
info:
  title: OpusTPP - Payments without Redirect
  description: 'OpusTPP - Account-linked device management core


    # Payment Transaction Initiation without Redirect


    family of API for allow o payment without redirect via Open Finance Brasil.

    allows both o management of the devices linked as accounts regarding a authorization of consents created via flow without
    redirect.'
  version: 1.0.0
tags:
- name: Device enrollment
  description: Management of account-linked devices
- name: Consent
  description: Authorization of consents created through the without-redirect flow.
- name: Automatic Pix
  description: authorization of consents of Pix automatic created via flow without redirect.
servers:
- url: https://open-finance-core.instituicao.com.br
paths:
  /opus-open-finance/enrollments/v1/enrollments:
    post:
      tags:
      - Device enrollment
      operationId: postEnrollments
      description: Method to create a new account enrollment. Returns an enrollment in status AWAITING_RISK_SIGNALS.
      summary: Create account enrollment.
      externalDocs:
        description: Open Finance - API Enrollments for Payment Initiation
        url: https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/141557761/SV+API+-+Pagamentos+sem+Redirecionamento
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentRequest'
      parameters:
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/authorisationServerId'
      - $ref: '#/components/parameters/regulatoryV'
      responses:
        '502':
          description: Error in Opus Open Client when communicating with the account-holding institution
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded when communicating with the account-holding institution
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '201':
          description: Account enrollment data retrieved successfully.
          headers:
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEnrollmentResponse'
        '400':
          description: Error sent by the account-holding institution, following the standard defined by BACEN
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        default:
          description: Error sent by the account-holding institution, following the standard defined by BACEN
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
              $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
