    originalRecurringPaymentId:
      type: string
      description: |
        Field containing the code or the identifier of the original payment attempt that failed.
        The original payment attempt is the first attempt (Intraday – First Attempt, see documentation) made for the payment of a given recurrence.
        Code or unique identifier informed by the account holder institution to represent the payment initiation.
        The recurringPaymentId must be different from the endToEndId.
        This is the identifier that must be used when querying the status of the payment initiation carried out.

        [Restriction] Submitting this field is mandatory for the Initiating institution when it is a new settlement attempt of a payment that previously failed.
      minLength: 1
      maxLength: 100
      pattern: ^[a-zA-Z0-9][a-zA-Z0-9\-]{0,99}$
      example: TXpRMU9UQTROMWhZV2xSU1FUazJSMDl
    EndToEndId:
      type: string
      minLength: 32
      maxLength: 32
      pattern: '^([E])([0-9A-Z]{8})([0-9]{4})(0[1-9]|1[0-2])(0[1-9]|[1-2][0-9]|3[0-1])(2[0-3]|[01][0-9])([0-5][0-9])([a-zA-Z0-9]{11})$'
      example: E9040088820241225150000123873170
      description: |
        This is a unique identifier, generated at the payment initiating institution and received at the account holder institution, permeating the entire journey of the Pix payment.

        [Restriction] The account holder institution must return the field with the same value received from the initiating institution.

        In the case of Automatic Pix, the initiating institution must, with regard to the composition of the endToEndId, use the date for which the Pix is being scheduled and the fixed time 15:00 UTC, which will give the account holder institution the settlement window of 00:00 to 23:59 Brasília time, even though the window is, for the holder, until 21:00.
    EndToEndIdPost:
      type: string
      minLength: 32
      maxLength: 32
      pattern: '^([E])([0-9A-Z]{8})([0-9]{4})(0[1-9]|1[0-2])(0[1-9]|[1-2][0-9]|3[0-1])(2[0-3]|[01][0-9])([0-5][0-9])([a-zA-Z0-9]{11})$'
      example: E9040088820241225150000123873170
      description: |
        It must be filled in in the standard format ExxxxxxxxyyyyMMddHHmmkkkkkkkkkkk (32 characters; "case sensitive", that is, it distinguishes between upper and lower case letters), where:

        - "E" - fixed (1 character);
        - xxxxxxxx - identification of the agent that generated the EndToEndId, which may be: the ISPB of the direct participant or the ISPB of the indirect participant (8 numeric characters [0-9]);
        - yyyyMMddHHmm – date, hour and minute (12 characters), following UTC time, of the submission of the payment order, if the settlement is priority, or expected for the submission of the order to the settlement system, if a scheduling is carried out. For priority and non-priority orders, the agent that generated the EndToEndId may fill it in with a maximum tolerance of 12 hours, into the future and into the past, in relation to the effective time at which the order is processed by the SPI;
        - kkkkkkkkkkk – sequence created by the agent that generated the EndToEndId (11 alphanumeric characters [a-z/A-Z/0-9]). It must be unique within each “yyyyMMddHHmm”;

        The EndToEndId may be generated by the direct participant, by the indirect participant or by the payment initiator.

        It must be unique and may not be repeated in any other operation submitted to the SPI.
    EnumAccountTypePayments:
      type: string
      enum:
        - CACC
        - SVGS
        - TRAN
      example: CACC
      description: |
        Types of accounts used for payment via Pix.
        Traditional types provided for by Resolution 4,753, not covering linked accounts,
        accounts of persons domiciled abroad, accounts in foreign currencies and electronic money correspondent accounts.
        Below is the description of each ENUM value within the scope of Pix.

        - CACC - Current - Current account.
        - SVGS - Savings - Savings account.
        - TRAN - TransactingAccount - Prepaid payment account.
    EnumAccountTypeConsents:
      type: string
      enum:
        - CACC
        - SVGS
        - TRAN
      example: CACC
      description: |
        Types of accounts used for payment.
        Traditional types provided for by Resolution 4,753, not covering linked accounts,
        accounts of persons domiciled abroad, accounts in foreign currencies and electronic money correspondent accounts.
        Below is the description of each ENUM value.

        - CACC - Current - Current account.
        - SVGS - Savings - Savings account.
        - TRAN - TransactingAccount - Prepaid payment account.
    EnumAuthorisationStatusType:
      type: string
      enum:
        - AWAITING_AUTHORISATION
        - PARTIALLY_ACCEPTED
        - AUTHORISED
        - REJECTED
        - REVOKED
        - CONSUMED
      example: AWAITING_AUTHORISATION
      description: |
        Current status of the recurring consent according to the state machine
        - AWAITING_AUTHORISATION - Awaiting authorisation
        - PARTIALLY_ACCEPTED - Partially accepted
        - AUTHORISED - Authorised
        - REJECTED - Rejected
        - REVOKED - Revoked
        - CONSUMED - Consumed
    EnumPaymentCancellationStatusType:
      type: string
      enum:
        - CANC
      example: CANC
      description: |
        State to which the payment must move
    EnumPaymentPersonType:
      type: string
      enum:
        - PESSOA_NATURAL
        - PESSOA_JURIDICA
      example: PESSOA_NATURAL
      description: |
        Data owner, natural person or legal entity to whom the payee (creditor) data refers.
    EnumPaymentStatusType:
      type: string
      enum:
        - RCVD
        - CANC
        - ACCP
        - ACPD
        - RJCT
        - ACSC
        - PDNG
        - SCHD
      example: PDNG
      description: |
        Current state of the payment. The state evolves in the following order:
        - RCVD (Received) - Indicates that the payment request was successfully received by the account holder institution, but there are still validations to be carried out before it is submitted for settlement.
        - CANC (Cancelled) - Indicates that the pending Pix transaction was successfully cancelled by the user before it was confirmed (ACCP) or rejected (RJCT) by the account holder institution.
        - ACCP( Accepted Customer Profile) - Indicates that all the necessary checks have already been carried out by the account holder institution and that the transaction is ready to be submitted for settlement (in the SPI if it is a Pix to another institution, or internally if it is to another account at the same institution).
        - ACPD (Accepted Clearing Processed) - Indicates that the account holder institution has already submitted the transaction for settlement, but does not yet have confirmation of whether it was settled or rejected.
        - RJCT (Rejected) Indicates that the transaction was rejected by the account holder institution or by the SPI.
        - ACSC (Accepted Settlement Completed Debitor Account) - Indicates that the transaction was completed by the account holder institution or by the SPI.
        - PDNG (Pending) - Indicates that the account holder institution temporarily held the Pix transaction for analysis. It does not apply to Smart Transfers.
        - SCHD (Scheduled) - Indicates that the Pix transaction was successfully scheduled at the account holder institution.
        In the event of failure:
        - RJCT (REJECTED) - Payment instruction rejected.
    EnumPaymentType:
      type: string
      enum:
