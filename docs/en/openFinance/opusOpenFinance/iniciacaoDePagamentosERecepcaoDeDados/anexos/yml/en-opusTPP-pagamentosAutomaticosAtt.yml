            In the case of a random key, the UUID generated by the DICT must be informed, in accordance with the format specified in [RFC4122](https://tools.ietf.org/html/rfc4122).

            [Restriction] If localInstrument is equal to DICT or INIC, the proxy field must be filled in.

            [Restriction] If informed, the account holder institution must validate the proxy in the DICT (when localInstrument is equal to DICT) and validate the creditorAccount object. This action is optional if localInstrument is equal to INIC

            [Restriction] If the field “/data/localInstrument” is submitted as “MANU”, the field “/data/proxy” must not be informed
