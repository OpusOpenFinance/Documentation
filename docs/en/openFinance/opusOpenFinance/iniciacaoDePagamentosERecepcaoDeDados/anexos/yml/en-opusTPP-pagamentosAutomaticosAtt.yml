        - $ref: '#/components/parameters/xCustomerUserAgent'
        - $ref: '#/components/parameters/xIdempotencyKey'
        - name: recurringPaymentId
          in: path
          description: Identifier of the payment operation
          schema:
            type: string
          required: true
          example: D730A10D6784379085391417F3EF657C1247B2B3645210DD97F739B33B349376
      description: |
        Proxy method for revoking a payment initiation. It follows the request/response standard defined in the official documentation ([Open Finance - API Payment Initiation](https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/198410569/SV+API+-+Pagamentos+Autom+ticos)), version 2.2.0.

        This endpoint must be used to cancel transactions that are in one of the following situations:
        successfully scheduled (SCHD), held for analysis (PDNG). If the request is successful, the transaction moves to the CANC situation.

        If the payment status is other than SCHD/PDNG, or some other business rule prevents the cancellation, the PATCH request returns
        HTTP Status 422 with the code PAGAMENTO_NAO_PERMITE_CANCELAMENTO.

        If a 422 is received, the initiating institution must make a GET request on the payment to check its current situation, as well as the associated details.

        [Restriction] For Automatic Pix (“recurringConfiguration” equal to “automatic”), both the payee and the payer may carry out the cancellation,
        the payee being allowed to request the cancellation until 22:00 (Brasília time) and the payer until 23:59 (Brasília time) of the day before the payment's effective date,
        except in the cases of new attempts on subsequent days, where only the payee may cancel, also until 22:00.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchPixPayment'
        description: Update of the Recurring Payment.
        required: true
      responses:
        '502':
          description: Error in Opus Open Client while communicating with the account-holding institution
