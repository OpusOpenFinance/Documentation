            If informed, the account holder institution must validate the proxy in the DICT when localInstrument is equal to DICT and validate the creditorAccount field.
            This validation is optional if localInstrument is equal to INIC.

            [Restriction] If localInstrument is equal to DICT, the proxy field must be filled in.

            [Restriction] If the field “/data/localInstrument” is submitted as “MANU”, the field “/data/proxy” must not be informed
          pattern: '[\w\W\s]*'
          example: '11221131242'
        localInstrument:
          $ref: "#/components/schemas/LocalInstrument"
        originalRecurringPaymentId:
          $ref: '#/components/schemas/originalRecurringPaymentId'
        paymentReference:
          $ref: '#/components/schemas/PaymentReference'
    ResponseRecurringPixPayment:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          $ref: '#/components/schemas/ResponseRecurringPixData'
        links:
          $ref: '#/components/schemas/LinkSingle'
        meta:
          $ref: '#/components/schemas/RegulatoryMeta'
    ResponseRecurringPixData:
      type: array
      items:
        type: object
        required:
          - recurringPaymentId
          - endToEndId
          - date
          - creationDateTime
          - statusUpdateDateTime
          - status
          - payment
          - document
        properties:
          recurringPaymentId:
            type: string
            minLength: 1
            maxLength: 100
            pattern: '^[a-zA-Z0-9][a-zA-Z0-9\-]{0,99}$'
            example: TXpRMU9UQTROMWhZV2xSU1FUazJSMDl
            description: |
              Code or unique identifier informed by the account holder institution to represent the payment initiation. The `recurringPaymentId` must be different from the `endToEndId`.
              This is the identifier that must be used when querying the status of the payment initiation carried out.
          recurringConsentId:
            type: string
            maxLength: 256
            pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
            example: 'urn:bancoex:C1DD33123'
            description: |
              Unique identifier of the consent created for the requested payment initiation. It must be a URN - Uniform Resource Name.
              A URN, as defined in [RFC8141](https://tools.ietf.org/html/rfc8141), is a Uniform Resource
              Identifier - URI - assigned under the "urn" URI scheme and a specific URN namespace, with the intention that the URN
              be a persistent, location-independent resource identifier.
              Taking the string urn:bancoex:C1DD33123 as an example of a `recurringConsentId`, we have:
              - the namespace (urn)
              - the identifier associated with the namespace of the transmitting institution (bancoex)
              - the specific identifier within the namespace (C1DD33123).
              More detailed information about the construction of namespaces should be consulted in [RFC8141](https://tools.ietf.org/html/rfc8141).

              [Restriction] This field is mandatory when the value of the authorisationFlow field is equal to FIDO_FLOW.
          endToEndId:
            $ref: '#/components/schemas/EndToEndId'
          date:
            type: string
            maxLength: 10
            pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
            example: '2023-10-10'
            description: Date on which the payment will be made. A string using the UTC-3 timezone (UTC time format).
          creationDateTime:
            type: string
            format: date-time
            maxLength: 20
            pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
            example: '2020-07-21T08:30:00Z'
            description: |
              Date and time when the payment was created.
              A string with date and time in accordance with the [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339) specification,
              always using the UTC timezone (UTC time format).
          statusUpdateDateTime:
            type: string
            format: date-time
            maxLength: 20
            pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
            example: '2020-07-21T08:30:00Z'
            description: |
              Date and time when the payment had its status updated.
              A string with date and time in accordance with the [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339) specification,
              always using the UTC timezone (UTC time format).
          status:
            $ref: '#/components/schemas/EnumPaymentStatusType'
          rejectionReason:
            $ref: '#/components/schemas/RejectionReasonGet'
          payment:
            $ref: '#/components/schemas/PaymentPix'
          remittanceInformation:
            type: string
            maxLength: 140
            pattern: '[\w\W\s]*'
            example: Pagamento da nota RSTO035-002.
            description: |
              It must be filled in whenever the paying user enters any additional information in a payment, to be sent to the payee.
          transactionIdentification:
            $ref: '#/components/schemas/TransactionIdentification'
          document:
            type: object
            description: Document information.
            required:
              - identification
              - rel
            properties:
              identification:
                type: string
                pattern: '^([0-9]{11})$|^([0-9A-Z]{12}[0-9]{2})$'
                minLength: 11
                maxLength: 14
                example: '11111111111111'
                description: Number of the official identification document of the holder, natural person or legal entity.
              rel:
                type: string
                enum:
                  - CPF
                  - CNPJ
                example: 'CNPJ'
                description: Type of the official identification document of the holder, natural person or legal entity.
          originalRecurringPaymentId:
            $ref: '#/components/schemas/originalRecurringPaymentId'
          paymentReference:
            $ref: '#/components/schemas/PaymentReference'
