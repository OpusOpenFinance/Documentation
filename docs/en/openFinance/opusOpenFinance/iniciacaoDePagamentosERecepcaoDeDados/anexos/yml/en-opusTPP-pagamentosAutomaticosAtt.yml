          $ref: '#/components/schemas/TransactionIdentification'
        document:
          type: object
          description: Information of the identification document of the payee of the transaction.
          required:
            - identification
            - rel
          properties:
            identification:
              type: string
              pattern: '^([0-9]{11})$|^([0-9A-Z]{12}[0-9]{2})$'
              minLength: 11
              maxLength: 14
              example: '11111111111111'
              description: |
                Number of the official identification document of the payee, natural person or legal entity.
                The value informed must be equal to one of the values submitted at the consent creation stage (within the array “/data/creditors”).
                When this rule is not observed, the holder must return, synchronously, the HTTP 422 error - PAGAMENTO_DIVERGENTE_CONSENTIMENTO
            rel:
              type: string
              enum:
                - CPF
                - CNPJ
              example: 'CNPJ'
              description: Type of the official identification document of the holder, natural person or legal entity.
        paymentReference:
          $ref: '#/components/schemas/PaymentReference'
    PaymentReference:
      type: string
      example: 'R/2025-09-23/P1M'
      description: |
        [Restriction] Field that must be filled in if it is an Automatic Pix payment, and it must be submitted for the purposes of collecting ecosystem metrics. If this rule is not observed, the account holder institution must return an HTTP 422 error with the code DETALHE_PAGAMENTO_INVALIDO.
        The filling must follow the logic below:
        - First Payment: If it is the initial payment specified in the field /data/firstPayment, fill in the field with the fixed string "zero".
        - Recurring (Subsequent) Payments: For all the recurring payments after the initial one, the paymentReference field must be filled in with an ISO 8601 string in the format ```R/<start>/<duration>```, representing the exact cycle being paid.
          - ```R```, following the ISO8601 standard to represent the single recurrence of the cycle that started on the day informed in the ```<start>``` component.
          - The ```<start>``` component must be the start date of the specific cycle, in the format ```YYYY-MM-DD```, to which the payment being submitted refers.
          - The ```<duration>``` component represents the cycle interval defined for the authorised consent (P1W for weekly, P1M for monthly, P3M for quarterly, P6M for half-yearly and P1Y for yearly).
            - Examples:
              - 1: Start date of the cycle defined in the consent: 23/07/25
                - Periodicity defined in the consent: Weekly
                - Filling in of the paymentReference:
                - First cycle: R/2025-07-23/P1W
                - Second cycle:  R/2025-07-30/P1W
                - Third cycle: R/2025-08-06/P1W
              - 2: Start date of the cycle defined in the consent: 23/07/25
                - Periodicity defined in the consent: Monthly
                - Filling in of the paymentReference:
                - First cycle: R/2025-07-23/P1M
                - Second cycle: R/2025-08-23/P1M
                - Third cycle: R/2025-09-23/P1M
