        data:
          $ref: '#/components/schemas/CreateRecurringPixPaymentData'
    CreateRecurringPixPaymentData:
      type: object
      description: Object containing data of the payment and of the payee (creditor).
      required:
        - endToEndId
        - date
        - payment
        - creditorAccount
        - cnpjInitiator
        - localInstrument
        - document
      properties:
        recurringConsentId:
          type: string
          pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
          maxLength: 256
          description: |
            Unique identifier of the long-lived consent created for the requested payment initiation. It must be a URN - Uniform Resource Name.
            A URN, as defined in [RFC8141](https://tools.ietf.org/html/rfc8141), is a Uniform Resource
            Identifier - URI - assigned under the "urn" URI scheme and a specific URN namespace, with the intention that the URN
            be a persistent, location-independent resource identifier.
            Taking the string urn:bancoex:C1DD33123 as an example of a `recurringConsentId`, we have:
            - the namespace (urn)
            - the identifier associated with the namespace of the transmitting institution (bancoex)
            - the specific identifier within the namespace (C1DD33123).
            More detailed information about the construction of namespaces should be consulted in [RFC8141](https://tools.ietf.org/html/rfc8141).

            [Restriction] This field is mandatory when the value of the authorisationFlow field is equal to FIDO_FLOW.
        endToEndId:
          $ref: '#/components/schemas/EndToEndIdPost'
        date:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-01-01'
          description: Date on which the payment will be made. A string using the UTC-3 timezone (UTC time format).
        payment:
          $ref: '#/components/schemas/PaymentPix'
        creditorAccount:
          type: object
          description: |
            Object containing the identification of the beneficiary's/payee's destination account.

            [Restriction] - If /data/paymentReference = "zero", the credit account information submitted (/data/creditorAccount) must be the same as that present in the credit account informed when the consent was created (`/data/recurringConfiguration/automatic/firstPayment/creditorAccount`)
          required:
            - ispb
            - number
            - accountType
          properties:
            ispb:
              type: string
              minLength: 8
              maxLength: 8
              pattern: '^[0-9A-Z]{8}$'
              example: '12345678'
              description: |
                Must be filled in with the ISPB (Brazilian Payment System Identifier) of the SPI (instant payment system) participant, using numbers only.
            issuer:
              type: string
              minLength: 1
              maxLength: 4
              pattern: '^[0-9]{1,4}$'
              example: '1774'
              description: |
                Code of the branch where the account was opened, without the check digit.
                (A branch is the unit intended for serving customers, the general public and credit union members,
                in the exercise of the institution's activities, and may not be mobile or temporary).

                [Restriction] Mandatory for the following account types: CACC (CONTA_DEPOSITO_A_VISTA) and SVGS (CONTA_POUPANCA).
            number:
              type: string
              minLength: 1
              maxLength: 20
              pattern: '^[0-9]{1,20}$'
              example: '1234567890'
              description: |
                Must be filled in with the number of the payee user's transactional account, including the check digit (if one exists);
                if there is an alphanumeric value, it must be converted to 0.
            accountType:
              $ref: '#/components/schemas/EnumAccountTypePayments'
        remittanceInformation:
          type: string
          maxLength: 140
          pattern: '[\w\W\s]*'
          example: Pagamento da nota XPTO035-002.
          description: |
            It must be filled in whenever the paying user enters any additional information in a payment, to be sent to the payee.
        cnpjInitiator:
          type: string
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          maxLength: 14
          example: '50685362000135'
          description: CNPJ of the Payment Initiator duly authorised to provide the Initiation Service in Pix.
        ibgeTownCode:
          type: string
          minLength: 7
          maxLength: 7
          pattern: '^\d{7}$'
          example: '5300108'
          description: |
            The ibgeTownCode field in the Pix arrangement has the same behaviour as the codMun field described in item 1.6.6 of the Pix manual.

            If the information regarding the municipality is not submitted, the payee's PSP will assume that there are no state or municipal holidays in the period in question;
        authorisationFlow:
          type: string
          enum:
            - HYBRID_FLOW
            - CIBA_FLOW
            - FIDO_FLOW
          example: HYBRID_FLOW
          description: |
            Conditional field used to identify the authorisation flow in which the payment was requested.

            [Restriction] If CIBA or FIDO, filling it in is mandatory. If the field is not present in the payload, it is understood that the authorisation flow used is the HYBRID_FLOW.
        riskSignals:
          $ref: '#/components/schemas/RiskSignalsPayments'
        localInstrument:
          $ref: '#/components/schemas/LocalInstrument'
        proxy:
          type: string
          description: |
            Key registered in the DICT belonging to the payee. The types of keys may be: phone, e-mail, cpf/cnpj or random key.
