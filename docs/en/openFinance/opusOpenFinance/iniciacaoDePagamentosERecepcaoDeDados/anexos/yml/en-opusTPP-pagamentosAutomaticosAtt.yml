        debtorAccount:
            $ref: '#/components/schemas/DebtorAccount'
        authorisationFlow:
          type: string
          enum:
            - HYBRID_FLOW
            - CIBA_FLOW
            - FIDO_FLOW
          example: HYBRID_FLOW
          description: |
            Conditional field used to identify the authorisation flow in which the payment was requested.

            [Restriction] If CIBA or FIDO, filling it in is mandatory. If the field is not present in the payload, it is understood that the authorisation flow used is the HYBRID_FLOW.
        localInstrument:
          $ref: '#/components/schemas/LocalInstrument'
        proxy:
          type: string
