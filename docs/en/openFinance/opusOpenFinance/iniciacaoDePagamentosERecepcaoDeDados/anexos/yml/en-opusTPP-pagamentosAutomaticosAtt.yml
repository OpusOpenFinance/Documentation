    patch:
      operationId: oofcAutomaticPaymentsPatchRecurringConsentsConsentId
      description: |
        Method for rejecting, revoking or editing a long-lived consent:
        1 - Information about the revocation:
        - If successful, the consent moves to status “REVOKED”;
        - Only consents with status “AUTHORISED” may be revoked;
        - Automatic payments associated with the consent and scheduled to occur until 23:59 of the following day (as from the day on which
        the revocation is requested) must be kept. Payments scheduled to occur after that period must be cancelled.
        - Further guidance regarding the revocation can be found in the API header, topic “Validações”, item 3.

        2 - Information about the edition:
        - The fields that may be edited and their rules can be found through this [link](https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/628195665);
        - Editing is possible only in the case of a consent for Automatic Pix (“automatic” chosen in the oneOf of the “recurringConfiguration” object) that is authorised (`data.status == AUTHORISED`);
        - Submitting the item "/data/creditors/name" will update the payee's name in all the elements of the array.
        - If the consent is of a fixed amount (field “/data/recurringConfiguration/automatic/fixedAmount” filled in), editing the field “/data/recurringConfiguration/automatic/maximumVariableAmount” is not allowed.
        - If the payee has defined a floor for the limit to be stipulated by the payer (field “/data/recurringConfiguration/automatic/minimumVariableAmount” filled in), the maximum limit amount per transaction defined by the paying user (field “/data/recurringConfiguration/automatic/maximumVariableAmount”) may not be lower than the amount stipulated by the payee.
        - If the consent's expiration term is edited and there are already payments scheduled for days after the newly defined date, those payments must be cancelled.

        3 - Information about the rejection:
        - If it is necessary to cancel a consent that has not yet been authorised, the initiator may call the endpoint to move the consent to REJECTED.
      tags:
        - Opus Open Finance
      summary:  Rejects, revokes or edits a consent.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchRecurringConsentRequest'
      externalDocs:
        description: Open Finance - API Payment Initiation
        url: https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/198410569/SV+API+-+Pagamentos+Autom+ticos
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - $ref: '#/components/parameters/authorisationServerId'
        - $ref: '#/components/parameters/recurringConsentId'
      responses:
        '502':
          description: Error in Opus Open Client while communicating with the account-holding institution
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
                $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded while communicating with the account holder institution
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
                $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
