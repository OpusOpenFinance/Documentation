    authorisationFlowIntent:
      name: x-authorisation-flow-intent
      required: false
      description: Indicator of which approval model will apply to the payment consent
      in: header
      schema:
        $ref: '#/components/schemas/EnumAuthorisationFlowIntent'
    regulatoryV:
        name: x-regulatory-v
        required: false
        description: Regulatory version desired for the call to the participant (available only in non-proxy routes).
        in: header
        schema:
          $ref: '#/components/schemas/RegulatoryVersion'
    authorizationHeader:
      name: Authorization
      in: header
      description: Standard HTTP header. It allows credentials to be provided depending on the type of resource requested
      required: true
      schema:
        type: string
        pattern: '[\w\W\s]*'
        minLength: 1
        maxLength: 2048
    xCustomerUserAgent:
      name: x-customer-user-agent
      in: header
      description: Indicates the user-agent used by the user.
      required: false
      schema:
        type: string
        pattern: '[\w\W\s]*'
        minLength: 1
        maxLength: 100
    xFapiAuthDate:
      name: x-fapi-auth-date
      in: header
      description: 'Date on which the user last logged in with the initiator. Represented in accordance with [RFC7231](https://tools.ietf.org/html/rfc7231). Example: Sun, 10 Sep 2017 19:43:31 UTC'
      required: false
      schema:
        type: string
        pattern: '^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), \d{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) \d{4} \d{2}:\d{2}:\d{2} (GMT|UTC)$'
        minLength: 29
        maxLength: 29
    xFapiCustomerIpAddress:
      name: x-fapi-customer-ip-address
      in: header
      description: The user's IP address if currently logged in with the initiator.
      required: false
      schema:
        type: string
        pattern: '[\w\W\s]*'
        minLength: 1
        maxLength: 100
    xFapiInteractionId:
      name: x-fapi-interaction-id
      in: header
      description: A UUID [RFC4122](https://tools.ietf.org/html/rfc4122) used as a correlation ID between request and response. Field whose generation and submission is mandatory for the initiating institution (client) and whose value must be “mirrored” by the account holder institution (server) in the response header. If it is not received, or if an invalid value is received, the account holder institution must generate an x-fapi-interaction-id and return it in the response with HTTP status code 400. The initiating institution must accept the value received from the account holder institution.
      required: true
      schema:
        type: string
        format: uuid
        minLength: 1
        maxLength: 36
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        example: d78fc4e5-37ca-4da3-adf2-9b082bf92280
    xIdempotencyKey:
      name: x-idempotency-key
      in: header
      description: Custom HTTP header. Unique request identifier to support idempotency.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 40
        pattern: ^(?!\s)(.*)(\S)$
    startDate:
      name: startDate
      in: query
      description: Initial cut-off date of the occurrence of the payment linked to the long-lived consent.
      required: false
      schema:
        type: string
        pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
        minLength: 10
        maxLength: 10
    endDate:
      name: endDate
      in: query
      description: Final cut-off date for retrieving the occurrence of the payment linked to the long-lived consent.
      required: false
      schema:
        type: string
        pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
        minLength: 10
        maxLength: 10
    originalRecurringPaymentIdQuery:
      name: originalRecurringPaymentId
      in: query
      description: |
        Field containing the code or the identifier of the original payment attempt that failed.
        Code or unique identifier created by the account holder institution to represent the payment initiation.
        If informed, all the payments associated with the identifier informed must be returned, these being the original payment (owner of the identifier) and the new attempts that submitted the identifier in their request, indicating that they represent a new attempt.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9\-]{0,99}$
        example: TXpRMU9UQTROMWhZV2xSU1FUazJSMDl
