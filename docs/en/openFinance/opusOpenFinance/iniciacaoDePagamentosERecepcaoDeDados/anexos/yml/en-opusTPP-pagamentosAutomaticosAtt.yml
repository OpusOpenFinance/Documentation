  /proxy/open-banking/automatic-payments/v2/pix/recurring-payments/{originalRecurringPaymentId}/retry:
    post:
      tags:
        - Automatic Payment
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - $ref: '#/components/parameters/authorisationServerId'
        - $ref: '#/components/parameters/headerRecurringConsentId'
        - $ref: '#/components/parameters/authorizationHeader'
        - $ref: '#/components/parameters/xFapiAuthDate'
        - $ref: '#/components/parameters/xFapiCustomerIpAddress'
        - $ref: '#/components/parameters/xFapiInteractionId'
        - $ref: '#/components/parameters/xCustomerUserAgent'
        - $ref: '#/components/parameters/xIdempotencyKey'
        - name: originalRecurringPaymentId
          in: path
          description: |
            Field containing the identifier of the original payment attempt that failed. Code or unique identifier created by the account holder institution to represent the payment initiation.
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
            pattern: ^[a-zA-Z0-9][a-zA-Z0-9\-]{0,99}$
            example: TXpRMU9UQTROMWhZV2xSU1FUazJSMDl
      description: |
        Method for creating new payment attempts associated with an original attempt that failed. Exclusive to Automatic Pix.
        The created resource representing the new attempt must be queried through the current payment query endpoint (GET /pix/recurring-payments/{recurringPaymentId}).
        When querying the resource created by this method, which represents this new attempt, the account holder institution will be responsible for returning the fields that were not changed between the attempts.
        The rules for new attempts can be found in the most recent version of the API documentation, available in the developer area.

        It follows the request/response standard defined in the official documentation ([Open Finance - API Payment Initiation](https://openfinancebrasil.atlassian.net/wiki/spaces/OF/pages/198410569/SV+API+-+Pagamentos+Autom+ticos)), version 2.2.0.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecurringRetryPixPayment'
        description: Payload for a new settlement attempt of the automatic payment.
        required: true
      responses:
        '502':
          description: Error in Opus Open Client while communicating with the account-holding institution
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
                $ref: '#/components/headers/xSelectedRegulatoryV'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '504':
          description: Connection timeout exceeded while communicating with the account holder institution
          headers:
            x-origin-error:
              $ref: '#/components/headers/xOriginError'
            x-error-source-url:
              $ref: '#/components/headers/xErrorSourceUrl'
            x-selected-regulatory-v:
                $ref: '#/components/headers/xSelectedRegulatoryV'
