          type: object
          description: Definition of the recurrence configuration for automatic transfers of funds.
          properties:
            totalAllowedAmount:
              type: string
              minLength: 4
              maxLength: 19
              pattern: '^((\d{1,16}\.\d{2}))$'
              example: '100000.12'
              description: Maximum amount to be reached by the sum of all the transactions that use the consent authorised by the customer. If the amount is exceeded, the account holder institution must deny the transaction requested by the initiating institution.
            transactionLimit:
              type: string
              pattern: '^((\d{1,16}\.\d{2}))$'
              minLength: 4
              maxLength: 19
              example: '1000000.12'
              description: Maximum amount for each payment transaction associated with this consent. If the payment amount is higher than this limit, the account holder institution must reject the payment transaction.
            periodicLimits:
              $ref: "#/components/schemas/PeriodicLimits"
            startDateTime:
              type: string
              format: date-time
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              description: |
                Description: Date and time when the consent must become valid.
                A string with date and time in accordance with the [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339) specification, always using the UTC timezone (UTC time format).

                [Restriction] If this field is not submitted by the initiator in the request, the holder must fill in this field with the same value assigned to the field /data/creationDateTime.
              example: '2023-05-21T08:30:00Z'
    Sweeping:
      type: object
