        - LIMITE_PERIODO_VALOR_EXCEDIDO
        - LIMITE_PERIODO_QUANTIDADE_EXCEDIDO
        - LIMITE_VALOR_TOTAL_CONSENTIMENTO_EXCEDIDO
        - LIMITE_VALOR_TRANSACAO_CONSENTIMENTO_EXCEDIDO: The transaction amount exceeds the amount limit per transaction.
        - LIMITE_TENTATIVAS_EXCEDIDO: The maximum number of settlement attempts allowed by the arrangement has been reached.
        - FORA_PRAZO_PERMITIDO
        - DETALHE_TENTATIVA_INVALIDO
        - DETALHE_PAGAMENTO_INVALIDO

        [Restriction] This reason must be submitted when the field `/data/status` is equal to RJCT (REJECTED).
    EnumPaymentCancellationReasonType:
      type: string
      enum:
        - CANCELADO_PENDENCIA
        - CANCELADO_AGENDAMENTO
      example: CANCELADO_PENDENCIA
      description: |
        This field must be filled in for the response by the account holder institution based on the status the payment is in at the moment the cancellation is requested (e.g. Payment status = PDNG, the field must be filled in with the enum CANCELADO_PENDENCIA)

        Possible values:

        CANCELADO_PENDENCIA - Payment cancelled while it was in the PDNG situation

        CANCELADO_AGENDAMENTO - Payment cancelled while it was in the SCHD situation
    EnumPaymentCancellationFromType:
      type: string
      enum:
        - INICIADORA
        - DETENTORA
      example: INICIADORA
      description: |
        Field used to inform the channel through which the cancellation was carried out.

        Possible values:

        INICIADORA - Payment cancelled by the paying user in the initiating institution's channels

        DETENTORA - Payment cancelled by the paying user in the account holder institution's channels
    Rejection:
      type: object
      description: |
        Object containing the rejection information of the consents.

        [Restriction] Field that must be filled in if the consent status is equal to "REJECTED".
      required:
        - rejectedBy
        - rejectedFrom
        - rejectedAt
      properties:
        rejectedBy:
          type: string
          enum:
            - INICIADORA
            - USUARIO
            - DETENTORA
          example: INICIADORA
          description: |
            Who initiated the rejection request
            - INICIADORA
            - USUARIO
            - DETENTORA
        rejectedFrom:
          type: string
          enum:
            - INICIADORA
            - DETENTORA
          example: DETENTORA
          description: |
            Channel where the rejection process was initiated
            - INICIADORA
            - DETENTORA
        rejectedAt:
          type: string
          format: date-time
          example: '2021-05-21T08:30:00Z'
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          maxLength: 20
          description: Date and time when the consent was rejected
        reason:
          $ref: '#/components/schemas/ConsentRejectionReason'
    ConsentRejection:
      type: object
      properties:
        status:
          type: string
          enum:
            - REJECTED
          example: REJECTED
          description: |
            Current state of the long-lived consent
        rejection:
          type: object
          description: |
            Object containing the rejection information of the consents.
          required:
            - rejectedBy
            - rejectedFrom
            - reason
          properties:
            rejectedBy:
              type: string
              enum:
                - INICIADORA
                - USUARIO
                - DETENTORA
              example: INICIADORA
              description: |
                Actor responsible for the rejection request
            rejectedFrom:
              type: string
              enum:
                - INICIADORA
                - DETENTORA
              example: DETENTORA
              description: |
                Channel where the rejection process was initiated
                - INICIADORA
                - DETENTORA
            reason:
              $ref: '#/components/schemas/ConsentRejectionReason'
    ConsentRejectionReason:
      type: object
      description: |
        Information about the reason for the rejection
      required:
        - code
        - detail
      properties:
        code:
          type: string
          enum:
            - NAO_INFORMADO
            - FALHA_INFRAESTRUTURA
            - TEMPO_EXPIRADO_AUTORIZACAO
            - REJEITADO_USUARIO
            - CONTAS_ORIGEM_DESTINO_IGUAIS
            - CONTA_NAO_PERMITE_PAGAMENTO
            - AUTENTICACAO_DIVERGENTE
            - FLUXO_NAO_SUPORTADO_PRODUTO
          example: AUTENTICACAO_DIVERGENTE
          description: |
            Indicator code of the rejection reason.
            - NAO_INFORMADO
            - FALHA_INFRAESTRUTURA
            - TEMPO_EXPIRADO_AUTORIZACAO
            - REJEITADO_USUARIO
            - CONTAS_ORIGEM_DESTINO_IGUAIS
            - CONTA_NAO_PERMITE_PAGAMENTO
            - AUTENTICACAO_DIVERGENTE
            - FLUXO_NAO_SUPORTADO_PRODUTO
        detail:
          type: string
          pattern: '[\w\W\s]*'
          maxLength: 2048
          description: |
            Detail about the rejection reason indicated in the field `/data/rejection/reason/code`
            - NAO_INFORMADO: Not informed by the account holder institution;
            - FALHA_INFRAESTRUTURA: [Description of which infrastructure failure made the processing unfeasible];
            - TEMPO_EXPIRADO_AUTORIZACAO: The consent expired before the user could confirm it;
            - REJEITADO_USUARIO: The user rejected the authorisation of the consent;
            - CONTAS_ORIGEM_DESTINO_IGUAIS: The selected account is the same as the destination account and does not allow this payment to be made;
            - CONTA_NAO_PERMITE_PAGAMENTO: The selected account is of the type [salary/investment/settlement/other] and does not allow this payment to be made;
            - AUTENTICACAO_DIVERGENTE : The user authenticated at the holder differs from the user authenticated at the initiator;
            - FLUXO_NAO_SUPORTADO_PRODUTO: The consent is configured for a product that is not yet supported by the flow that initiated the request.
          example: O usuário rejeitou a autorização do consentimento
    RejectionReasonGet:
      type: object
      description: |
        Object containing the asynchronous rejection reason
      required:
        - code
        - detail
      properties:
        code:
          $ref: '#/components/schemas/EnumRejectionReasonCodeGet'
        detail:
          type: string
          pattern: '[\w\W\s]*'
          maxLength: 2048
          description: |
            Detail about the identifier code of the rejection reason.

            - SALDO_INSUFICIENTE: The selected account does not have sufficient balance to make the payment;
            - VALOR_ACIMA_LIMITE: Validates whether the amount exceeds the limit established [at the institution (account or channel)/in the arrangement] for allowing the customer to carry out transactions;
            - VALOR_INVALIDO: The amount submitted is not valid for the consent associated with the payment;
            - NAO_INFORMADO: Not reported/identified by the account holder institution;
            - PAGAMENTO_DIVERGENTE_CONSENTIMENTO: Payment data differing from the consent data;
            - PAGAMENTO_RECUSADO_DETENTORA: [description of the reason for refusal];
            - PAGAMENTO_RECUSADO_SPI: [error code according to the PACS.002 reason domain table];
            - CONSENTIMENTO_INVALIDO: Invalid consent (in a final status);
            - FALHA_INFRAESTRUTURA_SPI: Indicates a failure in the Instant Payment System (SPI);
            - FALHA_INFRAESTRUTURA_ICP: Indicates a failure in the Public Key Infrastructure (ICP);
            - FALHA_INFRAESTRUTURA_PSP_RECEBEDOR: Indicates a failure in the infrastructure of the Payment Service Provider (PSP) receiving the payment;
            - FALHA_INFRAESTRUTURA_DETENTORA: indicates a failure in the infrastructure of the institution holding the information or resources;
            - LIMITE_PERIODO_VALOR_EXCEDIDO – The transaction cannot be carried out because the amount configured in the consent has been exceeded.
            - LIMITE_PERIODO_QUANTIDADE_EXCEDIDO – The transaction cannot be carried out because the quantity configured in the consent has been exceeded.
            - TITULARIDADE_INCONSISTENTE: Account not currently associated with the CPF/CNPJ of the long-lived consent.
            - LIMITE_VALOR_TOTAL_CONSENTIMENTO_EXCEDIDO: The transaction amount exceeds the global limit of the consent.
            - LIMITE_VALOR_TRANSACAO_CONSENTIMENTO_EXCEDIDO: The transaction amount exceeds the amount limit per transaction.
            - LIMITE_TENTATIVAS_EXCEDIDO: The maximum number of settlement attempts allowed by the arrangement has been reached
            - FORA_PRAZO_PERMITIDO: The time or period of the request does not allow scheduling by the holder.
            - DETALHE_TENTATIVA_INVALIDO: The parameter [nome_do(s)_campo(s)] entered for the new payment attempt does not match the original payment that failed and is not allowed in the new payment attempt.
            - DETALHE_PAGAMENTO_INVALIDO: Validates whether a given parameter informed complies with the business rules
    RejectionReason:
      type: object
      description: |
        Object containing the asynchronous rejection reason
      required:
        - code
        - detail
      properties:
        code:
          $ref: '#/components/schemas/EnumRejectionReasonCode'
        detail:
          type: string
          pattern: '[\w\W\s]*'
          maxLength: 2048
          description: |
            Detail about the identifier code of the rejection reason.

            - SALDO_INSUFICIENTE: The selected account does not have sufficient balance to make the payment;
            - VALOR_ACIMA_LIMITE: Validates whether the amount exceeds the limit established [at the institution (account or channel)/in the arrangement] for allowing the customer to carry out transactions;
            - VALOR_INVALIDO: The amount submitted is not valid for the consent associated with the payment;
            - NAO_INFORMADO: Not reported/identified by the account holder institution;
            - PAGAMENTO_DIVERGENTE_CONSENTIMENTO: Payment data differing from the consent data;
            - PAGAMENTO_RECUSADO_DETENTORA: [description of the reason for refusal];
            - PAGAMENTO_RECUSADO_SPI: [error code according to the PACS.002 reason domain table];
            - CONSENTIMENTO_INVALIDO: Invalid consent (in a final status);
            - FALHA_INFRAESTRUTURA_SPI: Indicates a failure in the Instant Payment System (SPI);
            - FALHA_INFRAESTRUTURA_ICP: Indicates a failure in the Public Key Infrastructure (ICP);
            - FALHA_INFRAESTRUTURA_PSP_RECEBEDOR: Indicates a failure in the infrastructure of the Payment Service Provider (PSP) receiving the payment;
            - FALHA_INFRAESTRUTURA_DETENTORA: indicates a failure in the infrastructure of the institution holding the information or resources;
            - TITULARIDADE_INCONSISTENTE: Account not currently associated with the CPF/CNPJ of the long-lived consent
            - LIMITE_PERIODO_VALOR_EXCEDIDO: The transaction cannot be carried out because the amount configured in the consent has been exceeded.
            - LIMITE_PERIODO_QUANTIDADE_EXCEDIDO: The transaction cannot be carried out because the quantity configured in the consent has been exceeded.
            - LIMITE_VALOR_TOTAL_CONSENTIMENTO_EXCEDIDO: The transaction amount exceeds the global limit of the consent.
            - LIMITE_VALOR_TRANSACAO_CONSENTIMENTO_EXCEDIDO: The transaction amount exceeds the amount limit per transaction.
            - LIMITE_TENTATIVAS_EXCEDIDO: The maximum number of settlement attempts allowed by the arrangement has been reached.
            - FORA_PRAZO_PERMITIDO: The time or period of the request does not allow scheduling by the holder.
            - DETALHE_TENTATIVA_INVALIDO: The parameter [nome_do(s)_campo(s)] entered for the new payment attempt does not match the original payment that failed and is not allowed in the new payment attempt.
            - DETALHE_PAGAMENTO_INVALIDO: Validates whether a given parameter informed complies with the business rules.
    ConsentEdition:
      type: object
      required:
        - creditors
      properties:
        riskSignals:
          $ref: '#/components/schemas/RiskSignalsConsentEdition'
        creditors:
          type: array
          minItems: 1
          items:
            type: object
            description: |
             Object containing the data of the payee (creditor).

              **Rules for Smart Transfers:**

              1. For individual/natural person customers:
              - It must accept only one item in the array; and;
              - The CPF informed must be the same as the one in `/data/loggedUser/document/identification`.

              2. For legal entity customers:
              - There is no limit to the number of items in the array; and;
              - The CNPJ(s) informed must have the same root as the CNPJ submitted in the field `/data/businessEntity/document/identification`.

              **Rules for Automatic Pix:**

              - Only one item is allowed in the array; and;
              - The document informed must be that of a legal entity payee.

              **Informing only this item must not change any other parameter of the consent**
            properties:
              name:
                type: string
                pattern: ^([A-Za-zÀ-ÖØ-öø-ÿ,.@:&*+_<>()!?/\\$%\d' -]+)$
                maxLength: 120
                example: Marco Antonio de Brito
                description: |
                  In the case of a natural person, the full name of the payee's account holder must be informed.
                  In the case of a legal entity, the corporate name or the trade name of the payee's account must be informed.
        expirationDateTime:
          description: |
            Date and time when the consent must cease to be valid. A string with date and time in accordance with the [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339) specification, always using the UTC timezone (UTC time format).

            [Restriction] If this field is not submitted, the account holder institution must consider the term extended for an indefinite period, except in cases of the exclusive edition of the field “/data/creditors/name; or;

            If submitted, this field must be at least D, D being the day of the request, and the time must be 23:59:59 (UTC).
          type: string
          format: date-time
          example: '2021-05-21T08:30:00Z'
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          maxLength: 20
        recurringConfiguration:
          type: object
          description: Field intended for the configuration of the different recurring payment products.
          properties:
            automatic:
              type: object
              description: Definition of the recurrence configuration for automatic payments
              properties:
                maximumVariableAmount:
                  type: string
                  pattern: '^((\d{1,16}\.\d{2}))$'
                  minLength: 4
                  maxLength: 19
                  example: '1000000.12'
                  description: |
                    Maximum amount allowed per charge; if filled in, it represents a consent for payments of variable amounts.

                    [Restriction]
                    If this field is not submitted, the account holder institution must consider the maximum amount of the variable payment as undefined, except in cases of the exclusive edition of the field “/data/creditors/name”;

                    If informed, the value of this field must not be lower than the value defined in the field "/data/recurringConfiguration/automatic/minimumVariableAmount".
        loggedUser:
          type: object
          description: |
            User (natural person) who is logged in at the Payment Initiator institution.

            [Restriction] Object whose submission is mandatory for the edition of the consent's parameters, except in the case of the exclusive edition of the field “/data/creditors/name”.
          required:
            - document
          properties:
            document:
              type: object
              required:
                - identification
                - rel
              properties:
                identification:
                  type: string
                  maxLength: 11
                  description: Number of the official identification document of the user logged in at the initiating institution.
                  example: '11111111111'
                  pattern: '^\d{11}$'
                rel:
                  type: string
                  description: Type of the official identification document of the user logged in at the initiating institution.
                  enum:
                    - CPF
        businessEntity:
          type: object
          description: |
            User (legal entity) who is logged in at the Payment Initiator institution.

            [Restriction] Mandatory if the user logged in at the Payment Initiator institution is a CNPJ (legal entity).
          required:
            - document
          properties:
            document:
              type: object
              required:
                - identification
                - rel
              properties:
                identification:
                  type: string
                  maxLength: 14
                  description: Number of the official identification document of the legal entity data owner.
                  example: '11111111111111'
                  pattern: '^[0-9A-Z]{12}[0-9]{2}$'
                rel:
                  type: string
                  maxLength: 4
                  description: Type of the official identification document of the legal entity data owner.
                  example: CNPJ
                  pattern: '^[A-Z]{4}$'
    ConsentRevocation:
      type: object
      properties:
        status:
          type: string
          enum:
            - REVOKED
          example: REVOKED
          description: |
            Current state of the long-lived consent
        revocation:
          type: object
          description: Object containing the revocation information of the long-lived consents.
          required:
            - revokedBy
            - revokedFrom
            - reason
          properties:
            revokedBy:
                type: string
                enum:
                  - INICIADORA
                  - USUARIO
                  - DETENTORA
                example: INICIADORA
                description: |
                  Who initiated the revocation request
                  - INICIADORA
                  - USUARIO
                  - DETENTORA
            revokedFrom:
              type: string
              enum:
                - INICIADORA
                - DETENTORA
              example: DETENTORA
              description: |
                Channel where the revocation process was initiated
                - INICIADORA
                - DETENTORA
            reason:
              $ref: '#/components/schemas/ConsentRevokedReason'
    ConsentRevokedReason:
      type: object
      description: |
        Information about the reason for the revocation
      required:
        - code
        - detail
      properties:
        code:
          type: string
          enum:
            - REVOGADO_RECEBEDOR
            - REVOGADO_USUARIO
            - NAO_INFORMADO
          example: REVOGADO_RECEBEDOR
          description: |
            Indicator code of the revocation reason.
            - REVOGADO_RECEBEDOR
            - REVOGADO_USUARIO
            - NAO_INFORMADO
        detail:
          type: string
          pattern: '[\w\W\s]*'
          maxLength: 2048
          description: |
            Detail about the revocation reason indicated in the field `/data/revocation/reason/code`.
            - NAO_INFORMADO: Not informed by the account holder institution;
            - REVOGADO_USUARIO: The paying user revoked the recurrence of the consent;
            - REVOGADO_RECEBEDOR: The payee user revoked the recurrence of the consent.
    RiskSignalsPayments:
      type: object
      description: |
        Risk signals for the initiation of automatic payments

        [Restriction] It must be submitted when the consent is for the Sweeping Accounts product (the object "/data/recurringConfiguration/sweeping" used in the oneOf)
      properties:
        manual:
          type: object
          required:
            - deviceId
            - osVersion
            - userTimeZoneOffset
            - language
            - screenDimensions
            - accountTenure
          description: |
            Represents the collection of risk signals with the user present

            [Restriction] Mandatory to be submitted when the transaction occurs in the user's presence
          properties:
            deviceId:
              type: string
              description: |
                Unique ID of the device generated by the platform.  The system property that identifies the combination of logged-in user, application signing key and device is used.
                [Android] Information obtained through this [link](https://developer.android.com/reference/android/provider/Settings.Secure#ANDROID_ID).
                [iOS] Information obtained through this [link](https://developer.apple.com/documentation/uikit/uidevice/1620059-identifierforvendor/).
              example: 00aa11bb22cc33dd
            isRootedDevice:
              type: boolean
              description: |
                Indicates whether the device currently has “root” permission.
                [Restriction] Field whose submission is mandatory when the user uses a native application for Android or iOS.
              example: false
            screenBrightness:
              type: number
              format: double
              description: |
                Indicates the brightness level of the device screen.
                [Android] The value is an integer, typically between 0 and 255, and the range of values may vary depending on the mobile phone manufacturer. Reference at this [link](https://developer.android.com/reference/android/provider/Settings.System#SCREEN_BRIGHTNESS).
                [iOS] The value is a floating point between “0.0” and “1.0”. Reference at this [link](https://developer.apple.com/documentation/uikit/uiscreen/).
                [Restriction] Field whose submission is mandatory when the user uses a native application for Android or iOS.
            elapsedTimeSinceBoot:
              type: integer
              format: int64
              description: |
                Indicates for how long (in milliseconds) the device has been switched on.
                [Android] Information obtained through this [link](https://developer.android.com/reference/android/os/SystemClock#elapsedRealtime%28%29).
                [iOS] Information obtained through this [link](https://developer.apple.com/documentation/kernel/kern/).
                [Restriction] Field whose submission is mandatory when the user uses a native application for Android or iOS.
              example: 6356027
            osVersion:
              type: string
              description: |
                Operating system version.
                [Android] Information obtained through this [link](https://developer.android.com/reference/android/os/Build.VERSION#RELEASE).
                [iOS] - Information obtained through this [link](https://developer.apple.com/documentation/uikit/uidevice/1620043-systemversion/).
              example: "14"
            userTimeZoneOffset:
              type: string
              example: "-03"
              description: |
                Indicates the time zone setting of the user's device, in the UTC offset format: ±hh[:mm]. The specified format allows the omission of the minutes part when its value is zero. Thus, both the values '-03:00' and '-03' are valid and represent the same time zone.
                [Android] Information obtained through this [link](https://developer.android.com/reference/java/time/ZonedDateTime#getOffset()) or, for versions earlier than 8.0, this [link](https://developer.android.com/reference/java/util/TimeZone#getOffset(long)).
                [iOS] Information obtained through this [link](https://developer.apple.com/documentation/foundation/timezone/).
            language:
              type: string
              example: "pt"
              description: |
                Indicates the language of the device in the ISO 639-1 format.
                [Android] Information obtained through this [link](https://developer.android.com/reference/java/util/Locale#getLanguage()).
                [iOS] - Information obtained through this [link](https://developer.apple.com/documentation/foundation/locale/languagecode/)
            screenDimensions:
              type: object
              description: |
                Dimensions that the application occupies on the device screen.
                [Android] Information obtained through this [link](https://developer.android.com/reference/android/view/WindowMetrics#getBounds()), or, for versions earlier than 11, this [link](https://developer.android.com/reference/android/util/DisplayMetrics).
                [iOS] - Information obtained through this [link](https://developer.apple.com/documentation/metal/mtlrasterizationratemap/3088873-screensize/).
              required:
                - height
                - width
              properties:
                height:
                  type: integer
                  format: int64
                  example: 2340
                  description: Screen height, in pixels.
                width:
                  type: integer
                  format: int64
                  example: 1080
                  description: Screen width, in pixels.
            accountTenure:
              type: string
              format: date
              example: "2020-05-21"
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
              description: Date on which the customer was registered at the initiating institution.
            geolocation:
              type: object
              description: |
                User's location, obtained with their consent.
                [Android] Information obtained through this [link](https://developers.google.com/android/reference/com/google/android/gms/location/FusedLocationProviderClient#public-abstract-tasklocation-getlastlocation) considering the required permissions.
                [iOS] Information obtained through this [link](https://developer.apple.com/documentation/corelocation/).
                [Restriction] The ITP must ask the user for permission to share their location. This field may be omitted if the GPS is unavailable, that is, without a signal, or on devices without the necessary hardware; or if the user denies consent.
              properties:
                latitude:
                  type: number
                  example: -15.738602
                  format: double
                  description: Latitude coordinate of the customer while logged in at the initiating institution
                longitude:
                  type: number
                  example: -47.926498
                  format: double
                  description: Longitude coordinate of the customer while logged in at the initiating institution
                type:
                  type: string
                  example: FINE
                  description: |
                    Type of mechanism used in generating the geolocation
                  enum:
                    - COARSE
                    - FINE
                    - INFERRED
            isCallInProgress:
              type: boolean
              example: false
              description: |
                Indicates an active call at the time of the enrollment or of the payment.
                [Android] Information obtained through this [link](https://developer.android.com/reference/android/media/AudioManager#getMode()).
                [iOS] Information obtained through this [link](https://developer.apple.com/documentation/callkit/).
                [Restriction] If the risk signal is available (the customer allowed it to be collected), it must be submitted.
            isDevModeEnabled:
              type: boolean
              example: false
              description: Indicates whether the device is in developer mode.
            isMockGPS:
              type: boolean
              example: false
              description: |
                Indicates whether the device is using a fake GPS. It must be submitted whenever the geolocation field with type `COARSE` or `FINE` is present.
                [Android] Information obtained through this [link](https://developer.android.com/reference/android/location/Location.html#isMock()) or, for versions earlier than 12, this [link](https://developer.android.com/reference/android/location/Location.html#isFromMockProvider()).
                [iOS] Information obtained through the links: sourceInformation, [link](https://developer.apple.com/documentation/corelocation/cllocation/3861803-sourceinformation). isSimulatedBySoftware, [link](https://developer.apple.com/documentation/corelocation/cllocationsourceinformation/3861807-issimulatedbysoftware).
            isEmulated:
              type: boolean
              description: Indicates whether the device is emulated or real.
              example: false
            isMonkeyRunner:
              type: boolean
              example: false
              description: Indicates the use of MonkeyRunner.
            isCharging:
              type: boolean
              example: true
              description: |
                Indicates whether the device battery is charging.
                [Android] Information obtained through this [link](https://developer.android.com/reference/android/os/BatteryManager).
                [iOS] Information obtained through this [link](https://developer.apple.com/documentation/uikit/uidevice/1620045-batterymonitoringenabled/).
            antennaInformation:
              type: string
              example: |
                CellIdentityLte:{mCi=2******60 mPci=274 mTac=5***1 mEarfcn=9510 mBands=[28] mBandwidth=2147483647 mMcc=724 mMnc=10 mAlphaLong=VIVO mAlphaShort=VIVO mAdditionalPlmns={} mCsgInfo=null}
              description: Indicates which antenna the device is connected to.
            isUsbConnected:
              type: boolean
              description: Indicates whether the device is connected to another device via USB.
            integrity:
              type: object
              description: |
                Reports the integrity of the device and the app.
                [Android] In accordance with the Play API Integrity documentation, [link](https://developer.android.com/google/play/integrity/overview?hl=pt-br).
                [iOS] In accordance with the App Attest documentation, [link](https://developer.apple.com/documentation/devicecheck/establishing_your_app_s_integrity).
              properties:
                appRecognitionVerdict:
                  type: string
                  description: Reports the integrity of the app
                  example: PLAY_RECOGNIZED
                deviceRecognitionVerdict:
                  type: string
                  description: Reports the integrity of the device
                  example: '[\"MEETS_DEVICE_INTEGRITY\"]'
        automatic:
          type: object
          required:
            - lastLoginDateTime
          description: |
            Represents the collection of risk signals without the user present

            [Restriction] Mandatory to be submitted when the transaction does not occur in the user's presence
          properties:
            lastLoginDateTime:
              type: string
              format: date-time
              description: |
                If the paying user has access to the payment initiating institution's environment, use the date and time of the customer's last interaction with its application/system.
                For cases where the payment initiating institution provides services to a third party, the time at which the payer logged in to the third party's application must be submitted.
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
            pixKeyRegistrationDateTime:
              type: string
              format: date-time
              description: |
                Date and time of the registration of the payee's Pix key at the initiating institution

                [Restriction] Mandatory field to be submitted if the value of the field `/data/localInstrument` is equal to `DICT` or `INIC`.
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
    RiskSignalsConsentEdition:
      type: object
      required:
        - deviceId
        - osVersion
        - userTimeZoneOffset
        - language
        - screenDimensions
        - accountTenure
      description: |
        Risk signals for the initiation of automatic payments

        [Restriction] It must be submitted when the consent is for the Automatic Pix product (the object "/data/recurringConfiguration/automatic" used in the oneOf).
        It will only be present after the first edition of the long-lived consent.
        Object whose submission is mandatory for the edition of the consent's parameters, except in the case of the exclusive edition of the field “/data/creditors/name”.
      properties:
        deviceId:
          type: string
          description: |
            Unique ID of the device generated by the platform.  The system property that identifies the combination of logged-in user, application signing key and device is used.
            [Android] Information obtained through this [link](https://developer.android.com/reference/android/provider/Settings.Secure#ANDROID_ID).
            [iOS] Information obtained through this [link](https://developer.apple.com/documentation/uikit/uidevice/1620059-identifierforvendor/).
          example: 00aa11bb22cc33dd
        isRootedDevice:
          type: boolean
          description: |
            Indicates whether the device currently has “root” permission.
            [Restriction] Field whose submission is mandatory when the user uses a native application for Android or iOS.
          example: false
        screenBrightness:
          type: number
          format: double
          description: |
            Indicates the brightness level of the device screen.
            [Android] The value is an integer, typically between 0 and 255, and the range of values may vary depending on the mobile phone manufacturer. Reference at this [link](https://developer.android.com/reference/android/provider/Settings.System#SCREEN_BRIGHTNESS).
            [iOS] The value is a floating point between “0.0” and “1.0”. Reference at this [link](https://developer.apple.com/documentation/uikit/uiscreen/).
            [Restriction] Field whose submission is mandatory when the user uses a native application for Android or iOS.
        elapsedTimeSinceBoot:
          type: integer
          format: int64
          description: |
            Indicates for how long (in milliseconds) the device has been switched on.
            [Android] Information obtained through this [link](https://developer.android.com/reference/android/os/SystemClock#elapsedRealtime%28%29).
            [iOS] Information obtained through this [link](https://developer.apple.com/documentation/kernel/kern/).
            [Restriction] Field whose submission is mandatory when the user uses a native application for Android or iOS.
          example: 6356027
        osVersion:
          type: string
          description: |
            Operating system version.
            [Android] Information obtained through this [link](https://developer.android.com/reference/android/os/Build.VERSION#RELEASE).
            [iOS] - Information obtained through this [link](https://developer.apple.com/documentation/uikit/uidevice/1620043-systemversion/).
          example: "14"
        userTimeZoneOffset:
          type: string
          example: "-03"
          description: |
            Indicates the time zone setting of the user's device, in the UTC offset format: ±hh[:mm]. The specified format allows the omission of the minutes part when its value is zero. Thus, both the values '-03:00' and '-03' are valid and represent the same time zone.
            [Android] Information obtained through this [link](https://developer.android.com/reference/java/time/ZonedDateTime#getOffset()) or, for versions earlier than 8.0, this [link](https://developer.android.com/reference/java/util/TimeZone#getOffset(long)).
            [iOS] Information obtained through this [link](https://developer.apple.com/documentation/foundation/timezone/).
        language:
          type: string
          example: "pt"
          description: |
            Indicates the language of the device in the ISO 639-1 format.
            [Android] Information obtained through this [link](https://developer.android.com/reference/java/util/Locale#getLanguage()).
            [iOS] - Information obtained through this [link](https://developer.apple.com/documentation/foundation/locale/languagecode/)
        screenDimensions:
          type: object
          description: |
            Dimensions that the application occupies on the device screen.
            [Android] Information obtained through this [link](https://developer.android.com/reference/android/view/WindowMetrics#getBounds()), or, for versions earlier than 11, this [link](https://developer.android.com/reference/android/util/DisplayMetrics).
            [iOS] - Information obtained through this [link](https://developer.apple.com/documentation/metal/mtlrasterizationratemap/3088873-screensize/).
          required:
            - height
            - width
          properties:
            height:
              type: integer
              format: int64
              example: 2340
              description: Screen height, in pixels.
            width:
              type: integer
              format: int64
              example: 1080
              description: Screen width, in pixels.
        accountTenure:
          type: string
          format: date
          example: "2020-05-21"
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          description: Date on which the customer was registered at the initiating institution.
        geolocation:
          type: object
          description: |
            User's location, obtained with their consent.
            [Android] Information obtained through this [link](https://developers.google.com/android/reference/com/google/android/gms/location/FusedLocationProviderClient#public-abstract-tasklocation-getlastlocation) considering the required permissions.
            [iOS] Information obtained through this [link](https://developer.apple.com/documentation/corelocation/).
            [Restriction] The ITP must ask the user for permission to share their location. This field may be omitted if the GPS is unavailable, that is, without a signal, or on devices without the necessary hardware; or if the user denies consent.
          properties:
            latitude:
              type: number
              example: -15.738602
              format: double
              description: Latitude coordinate of the customer while logged in at the initiating institution
            longitude:
              type: number
              example: -47.926498
              format: double
              description: Longitude coordinate of the customer while logged in at the initiating institution
            type:
              type: string
              example: FINE
              description: |
                Type of mechanism used in generating the geolocation
              enum:
                - COARSE
                - FINE
                - INFERRED
        isCallInProgress:
          type: boolean
          example: false
          description: |
            Indicates an active call at the time of the enrollment or of the payment.
            [Android] Information obtained through this [link](https://developer.android.com/reference/android/media/AudioManager#getMode()).
            [iOS] Information obtained through this [link](https://developer.apple.com/documentation/callkit/).
            [Restriction] If the risk signal is available (the customer allowed it to be collected), it must be submitted.
        isDevModeEnabled:
          type: boolean
          example: false
          description: Indicates whether the device is in developer mode.
        isMockGPS:
          type: boolean
          example: false
          description: |
            Indicates whether the device is using a fake GPS. It must be submitted whenever the geolocation field with type `COARSE` or `FINE` is present.
            [Android] Information obtained through this [link](https://developer.android.com/reference/android/location/Location.html#isMock()) or, for versions earlier than 12, this [link](https://developer.android.com/reference/android/location/Location.html#isFromMockProvider()).
            [iOS] Information obtained through the links: sourceInformation, [link](https://developer.apple.com/documentation/corelocation/cllocation/3861803-sourceinformation). isSimulatedBySoftware, [link](https://developer.apple.com/documentation/corelocation/cllocationsourceinformation/3861807-issimulatedbysoftware).
        isEmulated:
          type: boolean
          description: Indicates whether the device is emulated or real.
          example: false
        isMonkeyRunner:
          type: boolean
          example: false
          description: Indicates the use of MonkeyRunner.
        isCharging:
          type: boolean
          example: true
          description: |
            Indicates whether the device battery is charging.
            [Android] Information obtained through this [link](https://developer.android.com/reference/android/os/BatteryManager).
            [iOS] Information obtained through this [link](https://developer.apple.com/documentation/uikit/uidevice/1620045-batterymonitoringenabled/).
        antennaInformation:
          type: string
          example: |
            CellIdentityLte:{mCi=2******60 mPci=274 mTac=5***1 mEarfcn=9510 mBands=[28] mBandwidth=2147483647 mMcc=724 mMnc=10 mAlphaLong=VIVO mAlphaShort=VIVO mAdditionalPlmns={} mCsgInfo=null}
          description: Indicates which antenna the device is connected to.
        isUsbConnected:
          type: boolean
          description: Indicates whether the device is connected to another device via USB.
        integrity:
          type: object
          description: |
            Reports the integrity of the device and the app.
            [Android] In accordance with the Play API Integrity documentation, [link](https://developer.android.com/google/play/integrity/overview?hl=pt-br).
            [iOS] In accordance with the App Attest documentation, [link](https://developer.apple.com/documentation/devicecheck/establishing_your_app_s_integrity).
          properties:
            appRecognitionVerdict:
              type: string
              description: Reports the integrity of the app
              example: PLAY_RECOGNIZED
            deviceRecognitionVerdict:
              type: string
              description: Reports the integrity of the device
              example: '[\"MEETS_DEVICE_INTEGRITY\"]'
    RegulatoryMeta:
      type: object
      description: Meta information regarding the requested API.
      required:
        - requestDateTime
      properties:
        requestDateTime:
          description: 'Date and time of the query, in accordance with the [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339) specification, UTC format.'
          type: string
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
    LinkSingle:
      type: object
      description: References to other resources of the requested API.
      required:
        - self
      properties:
        self:
          type: string
          format: url
          maxLength: 2000
          description: Full URI that generated the current response.
          example: 'https://api.banco.com.br/open-banking/api/v2/resource'
    PaymentPix:
      type: object
      description: Object containing the payment information.
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          minLength: 4
          maxLength: 19
          pattern: '^((\d{1,16}\.\d{2}))$'
          example: '100000.12'
          description: |
            Transaction amount with 2 decimal places.
        currency:
          type: string
          maxLength: 3
          pattern: '^([A-Z]{3})$'
          example: BRL
          description: |
            Code of the national currency according to the ISO-4217 model, that is, 'BRL'. All the monetary values informed are represented in Brazil's current currency.
    PatchPixPayment:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/PatchPixPaymentData'
    PatchPixPaymentData:
      type: object
      required:
        - status
        - cancellation
      properties:
        status:
          $ref: '#/components/schemas/EnumPaymentCancellationStatusType'
        cancellation:
          type: object
          description: |
           General information about the cancellation.
          required:
            - cancelledBy
          properties:
            cancelledBy:
              type: object
              description: General information about the user who requested the cancellation.
              required:
                - document
              properties:
                document:
                  type: object
                  description: Object consolidating the document data of the user who requested the cancellation.
                  required:
                    - identification
                    - rel
                  properties:
                    identification:
                      type: string
                      maxLength: 14
                      description: Number of the official identification document of the payer or payee, natural person or legal entity
                      example: '11111111111'
                      pattern: '^([0-9]{11})$|^([0-9A-Z]{12}[0-9]{2})$'
                    rel:
                      type: string
                      description: Type of official identification document of the payer or payee, natural person or legal entity.
                      enum:
                        - CPF
                        - CNPJ
    PixPaymentCancellation:
      type: object
      description: |
        Object containing the data regarding the paying user who requested the cancellation, the channel used by them and the reason.

        [Restriction] The cancellation object will be mandatory only when the value of the status field is equal to CANC.
      required:
        - cancelledAt
        - cancelledBy
        - reason
        - cancelledFrom
      properties:
        reason:
          $ref: '#/components/schemas/EnumPaymentCancellationReasonType'
        cancelledFrom:
          $ref: '#/components/schemas/EnumPaymentCancellationFromType'
        cancelledAt:
          type: string
          description: 'Date and time when the cancellation was carried out, in accordance with the [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339) specification, UTC format.'
          format: date-time
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2021-05-21T08:30:00Z'
        cancelledBy:
          type: object
          description: Information related to the paying user who requested the cancellation of the payment.
          required:
            - document
          properties:
            document:
              type: object
              description: Object consolidating the document data of the user who requested the cancellation.
              required:
                - identification
                - rel
              properties:
                identification:
                  type: string
                  maxLength: 14
                  description: Number of the official identification document of the payer or payee, natural person or legal entity.
                  example: '11111111111'
                  pattern: '^([0-9]{11})$|^([0-9A-Z]{12}[0-9]{2})$'
                rel:
                  type: string
                  description: Type of official identification document of the payer or payee, natural person or legal entity.
                  enum:
                    - CPF
                    - CNPJ
    ResponsePostRecurringConsent:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: object
          description: Object containing the consent information for the individual payment initiation.
          required:
            - recurringConsentId
            - statusUpdateDateTime
            - loggedUser
            - status
            - creditors
            - creationDateTime
            - recurringConfiguration
          properties:
            recurringConsentId:
              type: string
              pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
              maxLength: 256
              description: |
                Unique identifier of the long-lived consent created for the requested payment initiation. It must be a URN - Uniform Resource Name. A URN, as defined in [RFC8141](https://datatracker.ietf.org/doc/html/rfc8141), is a Uniform Resource Identifier - URI - assigned under the "urn" URI scheme and a specific URN namespace, with the intention that the URN be a persistent, location-independent resource identifier.
                Taking the string urn:bancoex:C1DD33123 as an example of a `recurringConsentId`, we have:
                - the namespace (urn)
                - the identifier associated with the namespace of the transmitting institution (bancoex)
                - the specific identifier within the namespace (C1DD33123). More detailed information about the construction of namespaces should be consulted in [RFC8141](https://datatracker.ietf.org/doc/html/rfc8141).
            statusUpdateDateTime:
              type: string
              format: date-time
              example: '2021-05-21T08:30:00Z'
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              maxLength: 20
              description: |
                Date and time when the consent had its status updated. A string with date and time in accordance with the [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339) specification, always using the UTC timezone (UTC time format).
            loggedUser:
              $ref: '#/components/schemas/LoggedUser'
            businessEntity:
              $ref: '#/components/schemas/BusinessEntity'
            status:
              $ref: '#/components/schemas/EnumAuthorisationStatusType'
            creditors:
              $ref: '#/components/schemas/Creditors'
            creationDateTime:
              description: Date and time when the consent was created. A string with date and time in accordance with the [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339) specification, always using the UTC timezone (UTC time format).
              type: string
              format: date-time
              example: '2021-05-21T08:30:00Z'
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              maxLength: 20
            expirationDateTime:
              description: |
                Date and time when the consent must cease to be valid. A string with date and time in accordance with the [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339) specification, always using the UTC timezone (UTC time format).

                [Restriction] If the consent is for Automatic Pix ("automatic" selected in the oneOf "/data/recurringConfiguration/"), the consent's expiration time must be 23:59:59 (UTC).
              type: string
              format: date-time
              example: '2021-05-21T08:30:00Z'
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              maxLength: 20
            additionalInformation:
              description: It must be filled in whenever the paying user enters any additional information in the consent
              type: string
              example: 'Minha recorrência'
              pattern: '[\w\W\s]*'
              maxLength: 140
            debtorAccount:
              type: object
              description: |
                Object containing the identification of the payer's source account.
                - If the ITP has collected the paying user's account information, it may be submitted in the consent to the account holder institution in this object, or;
                - If it was not collected by the ITP, the paying user will need to define it during the authorisation of the consent.
                - Even if it is submitted by the ITP, the paying user may change it during the authorisation of the consent.

                [Restrictions]
                - Mandatory object that must be returned when the consent is in or passes through the AUTHORISED status;
              required:
                - ispb
                - number
                - accountType
              properties:
                ispb:
                  type: string
                  minLength: 8
                  maxLength: 8
                  pattern: '^[0-9A-Z]{8}$'
                  example: '12345678'
                  description: |
                    Must be filled in with the ISPB (Brazilian Payment System Identifier) of the SPI (instant payment system) participant, using numbers only.
                issuer:
                  type: string
                  minLength: 1
                  maxLength: 4
                  pattern: '^[0-9]{1,4}$'
                  example: '1774'
                  description: |
                    Code of the branch where the account was opened, without the check digit.
                    (A branch is the unit intended for serving customers, the general public and credit union members,
                    in the exercise of the institution's activities, and may not be mobile or temporary).

                    [Restriction] Mandatory for the following account types: CACC (CONTA_DEPOSITO_A_VISTA) and SVGS (CONTA_POUPANCA).
                number:
                  type: string
                  minLength: 1
                  maxLength: 20
                  pattern: '^[0-9]{1,20}$'
                  example: '1234567890'
                  description: |
                    Must be filled in with the number of the paying user's transactional account, including the check digit (if one exists); if there is an alphanumeric value, it must be converted to 0.
                accountType:
                  $ref: '#/components/schemas/EnumAccountTypeConsents'
            rejection:
              $ref: '#/components/schemas/Rejection'
            revocation:
              type: object
              description: |
                Object containing the revocation information of the consents.

                [Restriction] Field that must be filled in if the consent status is equal to "REVOKED".
              required:
                - revokedBy
                - revokedFrom
                - revokedAt
              properties:
                revokedBy:
                    type: string
                    enum:
                      - INICIADORA
                      - USUARIO
                      - DETENTORA
                    example: INICIADORA
                    description: |
                      Who initiated the revocation request
                      - INICIADORA
                      - USUARIO
                      - DETENTORA
                revokedFrom:
                  type: string
                  enum:
                    - INICIADORA
                    - DETENTORA
                  example: DETENTORA
                  description: |
                    Channel where the revocation process was initiated
                    - INICIADORA
                    - DETENTORA
                revokedAt:
                  type: string
                  format: date-time
                  example: '2021-05-21T08:30:00Z'
                  pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
                  maxLength: 20
                  description: Date and time when the consent was revoked
                reason:
                  type: object
                  description: |
                    Information about the reason for the revocation
                  required:
                    - code
                    - detail
                  properties:
                    code:
                      type: string
                      enum:
                        - NAO_INFORMADO
                        - REVOGADO_USUARIO
                        - REVOGADO_RECEBEDOR
                      example: REVOGADO_RECEBEDOR
                      description: |
                        Indicator code of the revocation reason
                    detail:
                      type: string
                      pattern: '[\w\W\s]*'
                      maxLength: 2048
                      description: |
                        Detail about the revocation reason indicated in the field `/data/revocation/reason/code`.
                        - NAO_INFORMADO: Not informed by the account holder institution;
                        - REVOGADO_USUARIO: The paying user revoked the recurrence of the consent;
                        - REVOGADO_RECEBEDOR: The payee user revoked the recurrence of the consent.
                      example: O usuário rejeitou a autorização do consentimento
            recurringConfiguration:
              $ref: '#/components/schemas/RecurringConfiguration'
            authorisedAtDateTime:
              type: string
              format: date-time
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              minLength: 20
              maxLength: 20
              example: '2021-05-21T08:30:00Z'
              description: |
                Date and time when the consent was authorised.

                [Restriction] Field whose submission is mandatory when the consent moves to AUTHORISED.
            updatedAtDateTime:
              type: string
              format: date-time
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              minLength: 20
              maxLength: 20
              example: '2021-05-21T08:30:00Z'
              description: |
                Date and time when the consent was updated by the paying user.
                The field must be updated by the holder whenever the consent is edited.
                If the edition is carried out from the initiator, the holder must fill it in with the date and time (UTC) at which it received the edition request.
                Editing is only allowed for the Automatic Pix product.
            journey:
              $ref: '#/components/schemas/Journey'
        links:
          $ref: '#/components/schemas/LinkSingle'
        meta:
          $ref: '#/components/schemas/RegulatoryMeta'
    ResponseRecurringConsent:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: object
          description: Object containing the consent information for the individual payment initiation.
          required:
            - recurringConsentId
            - statusUpdateDateTime
            - loggedUser
            - status
            - creditors
            - creationDateTime
            - recurringConfiguration
          properties:
            recurringConsentId:
              type: string
              pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
              maxLength: 256
              description: |
                Unique identifier of the long-lived consent created for the requested payment initiation. It must be a URN - Uniform Resource Name. A URN, as defined in [RFC8141](https://datatracker.ietf.org/doc/html/rfc8141), is a Uniform Resource Identifier - URI - assigned under the "urn" URI scheme and a specific URN namespace, with the intention that the URN be a persistent, location-independent resource identifier.
                Taking the string urn:bancoex:C1DD33123 as an example of a `recurringConsentId`, we have:
                - the namespace (urn)
                - the identifier associated with the namespace of the transmitting institution (bancoex)
                - the specific identifier within the namespace (C1DD33123). More detailed information about the construction of namespaces should be consulted in [RFC8141](https://datatracker.ietf.org/doc/html/rfc8141).
            statusUpdateDateTime:
              type: string
              format: date-time
              example: '2021-05-21T08:30:00Z'
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              maxLength: 20
              description: |
                Date and time when the consent had its status updated. A string with date and time in accordance with the [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339) specification, always using the UTC timezone (UTC time format).
            loggedUser:
              $ref: '#/components/schemas/LoggedUser'
            businessEntity:
              $ref: '#/components/schemas/BusinessEntity'
            status:
              $ref: '#/components/schemas/EnumAuthorisationStatusType'
            creditors:
              $ref: '#/components/schemas/Creditors'
            creationDateTime:
              description: Date and time when the consent was created. A string with date and time in accordance with the [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339) specification, always using the UTC timezone (UTC time format).
              type: string
              format: date-time
              example: '2021-05-21T08:30:00Z'
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              maxLength: 20
            expirationDateTime:
              description: |
                Date and time when the consent must cease to be valid. A string with date and time in accordance with the [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339) specification, always using the UTC timezone (UTC time format).

                [Restriction] If the consent is for Automatic Pix ("automatic" selected in the oneOf "/data/recurringConfiguration/"), the consent's expiration time must be 23:59:59 (UTC).
              type: string
              format: date-time
              example: '2021-05-21T08:30:00Z'
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              maxLength: 20
            additionalInformation:
              description: It must be filled in whenever the paying user enters any additional information in the consent
              type: string
              example: 'Minha recorrência'
              pattern: '[\w\W\s]*'
              maxLength: 140
            debtorAccount:
              type: object
              description: |
                Object containing the identification of the payer's source account.
                - If the ITP has collected the paying user's account information, it may be submitted in the consent to the account holder institution in this object, or;
                - If it was not collected by the ITP, the paying user will need to define it during the authorisation of the consent.
                - Even if it is submitted by the ITP, the paying user may change it during the authorisation of the consent.

                [Restrictions]
                - Mandatory object that must be returned when the consent is in or passes through the AUTHORISED status;
              required:
                - ispb
                - number
                - accountType
              properties:
                ispb:
                  type: string
                  minLength: 8
                  maxLength: 8
                  pattern: '^[0-9A-Z]{8}$'
                  example: '12345678'
                  description: |
                    Must be filled in with the ISPB (Brazilian Payment System Identifier) of the SPI (instant payment system) participant, using numbers only.
                issuer:
                  type: string
                  minLength: 1
                  maxLength: 4
                  pattern: '^[0-9]{1,4}$'
                  example: '1774'
                  description: |
                    Code of the branch where the account was opened, without the check digit.
                    (A branch is the unit intended for serving customers, the general public and credit union members,
                    in the exercise of the institution's activities, and may not be mobile or temporary).

                    [Restriction] Mandatory for the following account types: CACC (CONTA_DEPOSITO_A_VISTA) and SVGS (CONTA_POUPANCA).
                number:
                  type: string
                  minLength: 1
                  maxLength: 20
                  pattern: '^[0-9]{1,20}$'
                  example: '1234567890'
                  description: |
                    Must be filled in with the number of the paying user's transactional account, including the check digit (if one exists); if there is an alphanumeric value, it must be converted to 0.
                accountType:
                  $ref: '#/components/schemas/EnumAccountTypeConsents'
                ibgeTownCode:
                  type: string
                  minLength: 7
                  maxLength: 7
                  pattern: '^\d{7}$'
                  example: '5300108'
                  description: |
                    Field used by the initiating institution to calculate the business day for the settlement of the payment (see the endToEndId specification) based on the municipality where the paying user is registered at the holder.

                    [Restrictions]
                    Field that must be filled in when the oneOf used for recurringConfiguration is “automatic”, and the consent passes through the AUTHORISED state.
            rejection:
              $ref: '#/components/schemas/Rejection'
            revocation:
              type: object
              description: |
                Object containing the revocation information of the consents.

                [Restriction] Field that must be filled in if the consent status is equal to "REVOKED".
              required:
                - revokedBy
                - revokedFrom
                - revokedAt
              properties:
                revokedBy:
                    type: string
                    enum:
                      - INICIADORA
                      - USUARIO
                      - DETENTORA
                    example: INICIADORA
                    description: |
                      Who initiated the revocation request
                      - INICIADORA
                      - USUARIO
                      - DETENTORA
                revokedFrom:
                  type: string
                  enum:
                    - INICIADORA
                    - DETENTORA
                  example: DETENTORA
                  description: |
                    Channel where the revocation process was initiated
                    - INICIADORA
                    - DETENTORA
                revokedAt:
                  type: string
                  format: date-time
                  example: '2021-05-21T08:30:00Z'
                  pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
                  maxLength: 20
                  description: Date and time when the consent was revoked
                reason:
                  type: object
                  description: |
                    Information about the reason for the revocation
                  required:
                    - code
                    - detail
                  properties:
                    code:
                      type: string
                      enum:
                        - NAO_INFORMADO
                        - REVOGADO_USUARIO
                        - REVOGADO_RECEBEDOR
                      example: REVOGADO_RECEBEDOR
                      description: |
                        Indicator code of the revocation reason
                    detail:
                      type: string
                      pattern: '[\w\W\s]*'
                      maxLength: 2048
                      description: |
                        Detail about the revocation reason indicated in the field `/data/revocation/reason/code`.
                        - NAO_INFORMADO: Not informed by the account holder institution;
                        - REVOGADO_USUARIO: The paying user revoked the recurrence of the consent;
                        - REVOGADO_RECEBEDOR: The payee user revoked the recurrence of the consent.
                      example: O usuário rejeitou a autorização do consentimento
            recurringConfiguration:
              $ref: '#/components/schemas/RecurringConfiguration'
            authorisedAtDateTime:
              type: string
              format: date-time
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              minLength: 20
              maxLength: 20
              example: '2021-05-21T08:30:00Z'
              description: |
                Date and time when the consent was authorised.

                [Restriction] Field whose submission is mandatory when the consent moves to AUTHORISED.
            updatedAtDateTime:
              type: string
              format: date-time
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
              minLength: 20
              maxLength: 20
              example: '2021-05-21T08:30:00Z'
              description: |
                Date and time when the consent was updated by the paying user.
                The field must be updated by the holder whenever the consent is edited.
                If the edition is carried out from the initiator, the holder must fill it in with the date and time (UTC) at which it received the edition request.
                Editing is only allowed for the Automatic Pix product.
            approvalDueDate:
              description: |
                Represents the maximum date for the approval of a consent that is in (or has passed through) the PARTIALLY_ACCEPTED state. The approval must occur by 23:59 of the day informed; otherwise, the consent must be rejected.

                [Restriction]
                It must be filled in by the account holder institution whenever a consent is in (or has passed through) the PARTIALLY_ACCEPTED state
              type: string
              format: date
              pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
              example: '2024-12-25'
            journey:
              $ref: '#/components/schemas/Journey'
        links:
          $ref: '#/components/schemas/LinkSingle'
        meta:
          $ref: '#/components/schemas/RegulatoryMeta'
