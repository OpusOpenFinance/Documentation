          description: Representa o custo de uma operation de foreign exchange em reais por currency estrangeira, englobando a rate de foreign exchange, as tarifas e tributos incidentes sobre essa operation. Campo de submission required nas operations de foreign exchange pronto que atingirem up to o limit de US$100.000 ou equivalente em other currencys.
