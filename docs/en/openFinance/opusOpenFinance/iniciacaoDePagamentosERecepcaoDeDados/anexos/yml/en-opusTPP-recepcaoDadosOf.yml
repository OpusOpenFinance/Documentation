        - TCR_PRE
        - TCR_POS
        - TRFC_PRE
        - TRFC_POS
        - OUTROS_INDEXADORES
      example: TJLP
    InvoiceFinancingsEnumContractReferentialRateIndexerType:
      type: string
      description: |
        "Tipos de rates referenciais ou indexadores, according to Anexo 5: Taxa referencial ou Indexador (Indx), do Documento 3040"
      enum:
