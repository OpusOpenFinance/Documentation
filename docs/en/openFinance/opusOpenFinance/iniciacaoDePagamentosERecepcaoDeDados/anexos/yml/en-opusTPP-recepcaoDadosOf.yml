    LoansEnumContractTaxType:
      type: string
      description: '"Tipo de Taxa (vide  Enum)

        - NOMINAL (taxa nominal é uma taxa de juros em que a unidade referencial não coincide com a unidade de tempo da capitalização. Ela é sempre fornecida em termos anuais, e seus períodos de capitalização podem ser diários, mensais, trimestrais ou semestrais. p.ex. Uma taxa de 12% ao ano com capitalização mensal)

        - EFETIVA (É a taxa de juros em que a unidade referencial coincide com a unidade de tempo da capitalização. Como as unidades de medida de tempo da taxa de juros e dos períodos de capitalização são iguais, usa-se exemplos simples como 1% ao mês, 60% ao ano)"

        '
      enum:
      - NOMINAL
      - EFETIVA
      example: EFETIVA
    LoansBalloonPaymentAmount:
      type: object
      required:
      - amount
      - currency
      description: Valor monetary da installment not regular a vencer.
      properties:
        amount:
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: Valor monetary da installment not regular a vencer. Expresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          maxLength: 3
          description: Moeda related to ao value monetary, seguindo o modelo ISO-4217.
          example: BRL
    LoansContract:
      type: object
      description: Conjunto de informtion related tos à identifiestion da operation de credit de loan
      required:
      - contractNumber
      - ipocCode
      - productName
      - productType
      - productSubType
      - contractDate
      - contractAmount
      - instalmentPeriodicity
      - CET
      - amortizationScheduled
      - interestRates
      - contractedFees
      - contractedFinanceCharges
      - productSubTypeCategory
      properties:
        contractNumber:
          type: string
          maxLength: 100
          minLength: 1
          pattern: ^[\w\W]{1,100}$
          example: '1324926521496'
          description: Número do contract dado pela institution contratante.
        ipocCode:
          type: string
          maxLength: 67
          minLength: 22
          pattern: ^[\w\W]{22,67}$
          example: '92792126019929279212650822221989319252576'
          description: "Número padronizado do contract - IPOC (Identificação Padronizada da Operação de Crédito). Segundo DOC 3040, composed por:\n- **CNPJ da institution:** 8 (oito) positions iniciais;\n- **Modalidade da operation:** 4 (quatro) positions;\n- **Tipo do customer:** 1 (uma) position( 1 = natural person - CPF, 2= legal entity – CNPJ, 3 = individual no exterior, 4 = legal entity no exterior, 5 = natural person sem CPF e 6 = legal entity sem CNPJ);\n- **Código do customer:** O number de positions varia according to o type do customer:\n  1. Para customers individual com CPF (type de customer = 1), provide as 11 (onze) positions do CPF;\n  2. Para customers legal entity com CNPJ (type de customer = 2), provide as 8 (oito) positions iniciais do CNPJ;\n  3. Para os demais customers (types de customer 3, 4, 5 e 6), provide 14 (catorze) positions com complement de zeros à esquerda se a identifiestion tiver tamanho inferior;\n- **Código do contract:** 1 (uma) up to 40 (quarenta) positions, sem complement de caracteres.\n"
        productName:
          type: string
          maxLength: 140
          pattern: ^[^\s](.*[^\s])?$
          example: Crédito Pessoal Consignado
          description: 'Denominação/Identificação do name da Modalidade da Operação de Crédito divulgado ao customer

            '
        productType:
          $ref: '#/components/schemas/LoansEnumContractProductTypeLoans'
        productSubType:
          $ref: '#/components/schemas/LoansEnumContractProductSubTypeLoans'
        productSubTypeCategory:
          $ref: '#/components/schemas/LoansEnumContractProductSubTypeCategory'
        contractDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2018-01-05'
          description: 'Data de contracting da operation de credit. Especificação RFC-3339. Para products rotativos, productSubType `CHEQUE_ESPECIAL` e `CONTA_GARANTIDA`, if has-se múltiplas contratações do same product, must-se enviar à last date available.

            '
        disbursementDates:
          type: array
          minItems: 1
          description: 'Lista que traz as Datas de Desembolso do value contratado.

            '
          items:
            type: string
            format: date
            maxLength: 10
            pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
            example: '2018-01-15'
            description: 'Data do Desembolso do value contratado. Especificação RFC-3339.

              No caso de uma liberação de recursos feita em D0 mas com referência retroativa feita em D -1, contabilmente a data correta seria D -1.

              '
        settlementDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2018-01-15'
          description: 'Data de settlement da operation. Data do cancelamento do contract para ifs em que not há balance mustdor restante. No if de cancelamento com balance mustdor, a date só must be filled when o same for liquidado.

            '
        contractAmount:
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: "Valor contratado da operation. Não includesr values de rates, tarifas, encargos e seguros. \nExpresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places. \nNos ifs em que not houver este value explícito no contract do product, enviar como 0.00\n"
        currency:
          type: string
          maxLength: 3
          pattern: ^(\w{3}){1}$
          example: BRL
          description: 'Moeda related to ao value da garantia, according to modelo ISO-4217. p.ex. ''BRL''

            Todos os valores monetários informados estão representados com a moeda vigente do Brasil

            '
        dueDate:
          type: string
          format: date
          maxLength: 10
          minLength: 2
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2028-01-15'
          description: 'Data do último due date da operation, seguindo a specification RFC-3339. Informção must be enviada if ela exista. Especialmente para contracts repactuados, must-se alterar a date para a do último due date. Para products rotativos, productSubType `CHEQUE_ESPECIAL` e `CONTA_GARANTIDA`, o field represents a date fim da renewal para contracts ativos ou date do cancelamento para contracts cancelados ou overdues.

            '
        instalmentPeriodicity:
          $ref: '#/components/schemas/LoansEnumContractInstalmentPeriodicity'
        instalmentPeriodicityAdditionalInfo:
          type: string
          pattern: ^[^\s](.*[^\s])?$
          maxLength: 50
          example: Informações adicionais sobre periodicidade
          description: 'Campo required para complementar a informtion relativa à periodicity de payment regular when tiver a option OUTROS.

            '
        firstInstalmentDueDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2018-02-15'
          description: 'Data de due date primeira installment do principal.

            Informação deve ser enviada caso ela exista.

            '
        CET:
          type: string
          pattern: ^\d{1,6}\.\d{6}$
          format: double
          maxLength: 13
          minLength: 8
          example: '0.290000'
          description: "CET – Custo Efetivo Total must be expresso na form de rate percentage annual e incorpora all os encargos e despesas incidentes nas operations de credit (rate de juro, mas also tarifas, tributos, seguros e other despesas cobradas).\n\nO completion must respeitar as 6 decimal places decimal places, same que venham filled com zeros (representstion de porcentagem p.ex: 0.150000. Este value represents 15%. O value 1 represents 100%).\n\nPara o public PF (individual) o field é de submission required para contracts firmados a partir de 2008, according to Resolução CMN 3.517. Para o public PJ (legal entity) o field é de submission required para contracts firmados a partir de 2011, according to Resolução CMN 3.909. O field may be filled com 0.00 em cenários nos quais a casa not has a informtion de CET (Custo efetivo total) only para as exceções listdas abaixo: \n\n- Em contracts anteriores a 2008 (para o public PF); \n- Em contracts anteriores a 2011 (para o public PJ); \n- Público PJ de médio ou grande porte. \n"
        hasInsuranceContracted:
          type: boolean
          description: "Campo que identifies se existe seguro contratado para o Empréstimo, onde seguro contratado é `true` e not contratado é `false`.  \n\n[Restrição] Este field é de submission required if o field productSubTypeCategory be filled `CREDITO_PESSOAL_CLEAN` ou `CONSIGNADO_SIAPE`.  \n"
          example: true
        amortizationScheduled:
          $ref: '#/components/schemas/LoansEnumContractAmortizationScheduled'
        amortizationScheduledAdditionalInfo:
          type: string
          pattern: ^[^\s](.*[^\s])?$
          maxLength: 200
          example: Informações complementares relativa à amortização do tipo 'OUTROS'
          description: 'Campo required para complementar a informtion relativa à amortization when selecionada a option OUTROS.

            '
        cnpjConsignor:
          type: string
          maxLength: 14
          pattern: ^[0-9A-Z]{12}[0-9]{2}$
          example: '60500998000135'
          description: "CNPJ do consignante (CNPJ corresponds ao registro alfanumérico de registration no Cadastro de Pessoa Jurídica). \n\nDeve-se ter only a representstion alphanumeric do CNPJ, sem mask.\n\n[Restrição] Informção adicional specific para when o `productSubType` for igual a `CREDITO_PESSOAL_COM_CONSIGNACAO`. \nEste field é de submission required somente enquanto houver relationship (consignação ativa). \nNos ifs de desconsignação, o field pode be omitido.\n"
        interestRates:
          type: array
          description: "Objeto que traz o set de informtion necessárias para demonstrar a composition das rates de interest remuneratórios da Modalidade de credit. Caso o contract not possua rates de interest, must be compartilhada uma list empty. Caso o contract possua uma rate de interest com value 0, must be compartilhado um objeto com o value 0 de form explícita. Para contracts em retrading, a rate de loan compartilhada must se manter a rate do contract vigente, sendo alterada para a renegociada ao fim do process de retrading. Para os products CPC (field `productSubTypeCategory` filled com `CREDITO_PESSOAL_CLEAN`) ou Consignado Federal (field `productSubTypeCategory` filled com `CONSIGNADO_SIAPE`) must-se necessarily conter a rate nominal e a rate efetiva (field taxPeriodicity) com periodicity a.a. (ao ano), podendo adicionalmente conter, além das rates nominal e efetiva ao ano, other com outra periodicity.  \n"
          items:
            $ref: '#/components/schemas/LoansContractInterestRate'
          minItems: 0
        contractedFees:
          type: array
          description: Lista que traz as informtion das tarifas pactuadas no contract.
          items:
            $ref: '#/components/schemas/LoansContractedFee'
          minItems: 0
        contractedFinanceCharges:
          type: array
          description: Lista que traz os encargos pactuados no contract
          items:
            $ref: '#/components/schemas/LoansFinanceCharge'
          minItems: 0
        nextInstalmentAmount:
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: "Inform o value de face (corresponds ao value da installment no due date). Para contracts liquidate, retornar zero, seguindo o pattern. \n[Restrição] Este field é de submission required if o field `productSubTypeCategory` be filled `CREDITO_PESSOAL_CLEAN` ou `CONSIGNADO_SIAPE` no endpoint /contracts/{contractId}.  \n"
    LoansBalloonPayment:
      type: object
      description: Lista que traz as dates de due date e value das installments not regulares  do contract da modality de credit queryda.
      required:
      - dueDate
      - amount
