    ExchangesEnumOperationType:
      type: string
      description: Compra ou venda de currency estrangeira.
      enum:
        - COMPRA
        - VENDA
      example: COMPRA
    ExchangesEnumEventType:
      type: string
      description: |
        Para o field domain:

        1 - Contratação no Mercado Primário.
        2 - Alteração de Operação Cambial no Mercado Primário.
        3 - Cancelamento de Operação Cambial no Mercado Primário.
        4 - Liquidação de Operação Cambial no Mercado Primário.
        5 - Baixa de Valor a Liquidar de Operação Cambial no Mercado Primário.
        6 - Restabelecimento de Baixa de Valor a Liquidar de Operação Cambial no Mercado Primário.
        9 - Anullção de Operação Cambial no Mercado Primário (utilizado, por exemplo, na anullção de um evento de settlement/cancelamento).
        Obs.: Códigos seguem o layout de mensageria enviada pelas institutions ao Banco Central.

        O evento is related ao type de contracting.
      enum:
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
        - '6'
        - '9'
      example: '2'
    ExchangesEnumDeliveryForeignCurrency:
      type: string
      description: |
        Forma de entrega da currency estrangeira.

        ```
        |--------|-------------------------------------------------------------|
        | Código | ENUM                                                        |
        |--------|-------------------------------------------------------------|
        |   10   | CARTA_CREDITO_A_VISTA                                       |
        |   15   | CARTA_CREDITO_A_PRAZO                                       |
        |   20   | CONTA_DEPOSITO                                              |
        |   21   | CONTA_DEPOSITO_MOEDA_ESTRANGEIRA_PAIS                       |
        |   22   | CONTA_DEPOSITO_EXPORTADOR_MANTIDA_NO_EXTERIOR               |
        |   23   | CONTA_DEPOSITO_OU_PAGAMENTO_EXPORTADOR_INSTITUICAO_EXTERIOR |
        |   25   | CONVENIO_PAGAMENTOS_E_CREDITOS_RECIPROCOS                   |
        |   30   | CHEQUE                                                      |
        |   50   | ESPECIE_CHEQUES_VIAGEM                                      |
        |   55   | CARTAO_PREPAGO                                              |
        |   65   | TELETRANSMISSAO                                             |
        |   75   | TITULOS_VALORES                                             |
        |   90   | SIMBOLICA                                                   |
        |   91   | SEM_MOVIMENTACAO_VALORES                                    |
        |   99   | DEMAIS                                                      |
        |   N/A  | OUTRO_NAO_MAPEADO_OFB                                       |
        |--------|-------------------------------------------------------------|
        ```
      enum:
        - CONTA_DEPOSITO_MOEDA_ESTRANGEIRA_PAIS
        - CONTA_DEPOSITO_OU_PAGAMENTO_EXPORTADOR_INSTITUICAO_EXTERIOR
        - ESPECIE_CHEQUES_VIAGEM
        - CARTAO_PREPAGO
        - TELETRANSMISSAO
        - SEM_MOVIMENTACAO_VALORES
        - DEMAIS
        - CARTA_CREDITO_A_VISTA
        - CARTA_CREDITO_A_PRAZO
        - CONTA_DEPOSITO
        - CHEQUE
        - TITULOS_VALORES
        - SIMBOLICA
        - CONTA_DEPOSITO_EXPORTADOR_MANTIDA_NO_EXTERIOR
        - CONVENIO_PAGAMENTOS_E_CREDITOS_RECIPROCOS
        - OUTRO_NAO_MAPEADO_OFB
      example: CARTA_CREDITO_A_PRAZO
    ExchangesLinks:
      type: object
      description: Referências para other recusos da API requisitada.
      required:
        - self
      properties:
        self:
          type: string
          format: url
          maxLength: 4048
          description: URL completo que gerou a response atual.
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        first:
          type: string
          format: url
          maxLength: 4048
          description: URL da primeira page que originou essa list de resultados. Restrição - Obrigatório when not for a primeira page da response
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        prev:
          type: string
          format: url
          maxLength: 4048
          description: "URL da page anterior dessa list de resultados. Restrição - \tObrigatório when not for a primeira page da response"
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        next:
          type: string
          format: url
          maxLength: 4048
          description: URL da próxima page dessa list de resultados. Restrição - Obrigatório when not for a last page da response
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        last:
          type: string
          format: url
          maxLength: 4048
          description: URL da last page dessa list de resultados. Restrição - Obrigatório when not for a last page da response
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
    ExchangesLinksOperationId:
      type: object
      description: Referências para other recusos da API requisitada.
      required:
        - self
      properties:
        self:
          type: string
          format: url
          maxLength: 4048
          description: URL completo que gerou a response atual.
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
    ExchangesMeta:
      type: object
      description: Meta informtion related to à API requisitada.
      required:
        - totalRecords
        - totalPages
        - requestDateTime
      properties:
        totalRecords:
          type: integer
          format: int32
          description: Número total de registros no resultado
          example: 1
        totalPages:
          type: integer
          format: int32
          description: Número total de pages no resultado
          example: 1
        requestDateTime:
          description: 'Data e time da query, according to specification RFC-3339, formt UTC.'
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
      additionalProperties: false
    ExchangesMetaOperationId:
      type: object
      description: Meta informtion related to à API requisitada.
      required:
        - requestDateTime
      properties:
        requestDateTime:
          description: 'Data e time da query, according to specification RFC-3339, formt UTC.'
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
      additionalProperties: false
  headers:
    xOriginError:
      description: Indica a origin do error.
      schema:
        $ref: '#/components/schemas/EnumOriginError'
      required: false
    xErrorSourceUrl:
      description: URL da chamada que originou o error, present only when `x-origin-error` = `participant`.
      schema:
        type: string
      required: false
    xRegulatoryV:
      description: Verare regulatória debeda para a chamada ao participant (available only em rotas not-proxy).
      schema:
        $ref: '#/components/schemas/RegulatoryVersion'
      required: false
    xSelectedRegulatoryV:
      description: Verare regulatória efetivamente utilizada na request ao participant.
      schema:
        $ref: '#/components/schemas/SelectedRegulatoryVersion'
      required: true
    xFapiInteractionIdResponse:
      description: |
        Um UUID [RFC4122](https://tools.ietf.org/html/rfc4122) usado como um ID de correlationship entre request e response. Campo de geração e submission required pela receptora (client) e o seu value must be "espelhado" pela transmissora (bever) no cabeçalho de response.
      schema:
        $ref: '#/components/schemas/XFapiInteractionId'
      required: true
    xV:
      description: 'Cabeçalho que indica a version implementada da API pela institution financeira para atender à solicitação. Deve be filled de form completa, por exemplo: x-v : 1.0.2.'
      required: true
      schema:
        $ref: '#/components/schemas/XV'
  parameters:
    applicationId:
      name: x-application-id
      in: header
      required: true
      description: Identificador do application que realiza a request
      schema:
        $ref: '#/components/schemas/UUID'
    customerUserAgent:
      name: x-customer-ube-agent
      in: header
      required: true
      description: Indica o ube-agent que o ube utiliza.
      schema:
        type: string
        pattern: '[\w\W\s]*'
        minLength: 1
        maxLength: 100
    fapiCustomerIpAddress:
      name: x-fapi-customer-ip-address
      in: header
      required: true
      description: O address IP do ube se estiver atualmente logado com o receptor.
      schema:
        type: string
        pattern: '[\w\W\s]*'
    authorisationServerId:
      name: x-authorisation-bever-id
      required: true
      description: Identificador do Authorisation Server da trasmissora do consent, obtained through da consula da list de participants
      in: header
      schema:
        $ref: '#/components/schemas/UUID'
    regulatoryV:
      name: x-regulatory-v
      required: false
      description: Verare regulatória debeda para a chamada ao participant (available only em rotas not-proxy).
      in: header
      schema:
        $ref: '#/components/schemas/RegulatoryVersion'
    headerConsentId:
      name: x-consent-id
      required: true
      in: header
      description: Identificador do consent a be utilizado nesta operation, obtained na response de sua creation
      schema:
        type: string
        pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
        maxLength: 256
      example: 'urn:bancox:f865cd66-392a-420b-9ff0-1b6d7cc60ee0'
    consentId:
      name: consentId
      required: true
      in: path
      description: |
        O consentId é o identifier single do consent e mustrá be um URN - Uniform Resource Name.
        Um URN, according to defined na [RFC8141](https://tools.ietf.org/html/rfc8141) é um Uniform Resource
        Identifier - URI - que é assigned sob o URI scheme "urn" e um namespace URN specific, com a intenção de que o URN
        be um identifier de recurso persistente e independente da localização.
        Considerando a string urn:prudential:C1DD93123 como exemplo para consentId temos:
        - o namespace(urn)
        - o identifier associado ao namespace da institution transnmissora (bancox)
        - o identifier specific dentro do namespace (f865cd66-392a-420b-9ff0-1b6d7cc60ee0).
        Informções mais detalhadas sobre a construção de namespaces must be querydas na [RFC8141](https://tools.ietf.org/html/rfc8141).
      schema:
        type: string
        pattern: '^urn:[a-zA-Z0-9][a-zA-Z0-9-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$'
        maxLength: 256
      example: 'urn:bancox:f865cd66-392a-420b-9ff0-1b6d7cc60ee0'
    creditCardAccountId:
      name: creditCardAccountId
      description: 'Identifica de form single a account payment postpaid do customer, mantendo as regras de imutabilidade detro da date-transmitting institution'
      in: path
      schema:
        type: string
      required: true
    accountId:
      name: accountId
      description: 'Identificador da account de deposit à vista, de savings ou de payment prepaid.'
      in: path
      schema:
        type: string
      required: true
    contractId:
      name: contractId
      description: 'Identificador do contract para all os types de operation de credit.'
      in: path
      schema:
        type: string
      required: true
    investmentId:
      name: investmentId
      description: 'Identifica de form single o relacionamento do customer com o product, mantendo as regras de imutabilidade dentro da date-transmitting institution'
      in: path
      schema:
        type: string
      required: true
    brokerNoteId:
      name: brokerNoteId
      description: 'Identifica de form single o relacionamento do customer com o product, mantendo as regras de imutabilidade dentro da date-transmitting institution'
      in: path
      schema:
        type: string
      required: true
    operationId:
      name: operationId
      description: 'Identifica de form single o relacionamento do customer com o product, mantendo as regras de imutabilidade dentro da date-transmitting institution'
      in: path
      schema:
        type: string
      required: true
    page:
      name: page
      in: query
      description: Número da page que is sendo requisitada (o value da primeira page é 1).
      schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 2147483647
        format: int32
    pageSize:
      name: page-size
      in: query
      description: Quantidade total de registros por pages. A transmissora must considerar entrada como 25, if be provided algum value menor pela receptora. Enquanto houver mais que 25 registros a enviar, a transmissora must considerar o minimum por page como 25. Somente a last page retornada (ou primeira, no if de page single) pode conter menos de 25 registros. Mais informtion, acesse Especificações de APIs > Padrões > Paginação.
      schema:
        type: integer
        default: 25
        minimum: 25
        format: int32
        maximum: 1000
    creditCardPayeeMCC:
      name: payeeMCC
      description: 'MCC é o Merchant Category Code, ou o code da category do estabelecimento commercial. Os MCCs are agrupados according to suas similaridades'
      required: false
      in: query
      schema:
        type: number
        maximum: 9999
        example: 8299
        format: int32
    fromDueDate:
      name: fromDueDate
      description: Data inicial de filtragem.
      required: false
      in: query
      schema:
        type: string
        maxLength: 10
        format: date
        example: '2021-05-21'
    fromTransactionDate:
      name: fromTransactionDate
      description: |
        Data inicial de filtragem.

        [Restrição] Deve necessarily be sent if o field toTransactionDate be provided. Caso not be provided, must be assumido o dia atual.
      required: false
      in: query
      schema:
        type: string
        maxLength: 10
        format: date
        example: '2021-05-21'
    fromTransactionDateMaxLimited:
      name: fromTransactionDate
      description: |
        Data inicial de filtragem. O period maximum utilizado no filtro é de 7 days inclusive (D-6).

        [Restrição] Deve necessarily be sent if o field toTransactionDate be provided. Caso not be provided, must be assumido o dia atual.
      required: false
      in: query
      schema:
        type: string
        maxLength: 10
        format: date
        example: '2021-05-21'
    toDueDate:
      name: toDueDate
      description: Data final de filtragem.
