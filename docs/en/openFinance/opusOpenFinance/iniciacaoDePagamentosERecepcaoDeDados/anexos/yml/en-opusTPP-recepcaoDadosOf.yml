    FinancingsResponseFinancingsContractList:
      type: object
      required:
      - data
      - links
      - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/FinancingsListContract'
        links:
          $ref: '#/components/schemas/FinancingsLinks'
        meta:
          $ref: '#/components/schemas/FinancingsMeta'
    FinancingsContract:
      type: object
      description: Conjunto de informtion related tos à identifiestion da operation de credit de financiamentos
      required:
      - contractNumber
      - ipocCode
      - productName
      - productType
      - productSubType
      - contractDate
      - contractAmount
      - instalmentPeriodicity
      - CET
      - amortizationScheduled
      - interestRates
      - contractedFees
      - contractedFinanceCharges
      properties:
        contractNumber:
          type: string
          maxLength: 100
          pattern: ^[\w\W]{1,100}$
          example: '1324926521496'
          description: Número do contract dado pela institution contratante.
        ipocCode:
          type: string
          maxLength: 67
          minLength: 22
          pattern: ^[\w\W]{22,67}$
          description: "\"Número padronizado do contract - IPOC (Identificação Padronizada da Operação de Crédito). Segundo DOC 3040, composed por:\n- **CNPJ da institution:** 8 (oito) positions iniciais;\n- **Modalidade da operation:** 4 (quatro) positions;\n- **Tipo do customer:** 1 (uma) position( 1 = natural person - CPF, 2= legal entity – CNPJ, 3 = individual no exterior, 4 = legal entity no exterior, 5 = natural person sem CPF e 6 = legal entity sem CNPJ);\n- **Código do customer:** O number de positions varia according to o type do customer:\n  1. Para customers individual com CPF (type de customer = 1), provide as 11 (onze) positions do CPF;\n  2. Para customers legal entity com CNPJ (type de customer = 2), provide as 8 (oito) positions iniciais do CNPJ;\n  3. Para os demais customers (types de customer 3, 4, 5 e 6), provide 14 (catorze) positions com complement de zeros à esquerda se a identifiestion tiver tamanho inferior;\n- **Código do contract:** 1 (uma) up to 40 (quarenta) positions, sem complement de caracteres.\"\n"
          example: '92792126019929279212650822221989319252576'
        productName:
          type: string
          maxLength: 140
          pattern: ^[^\s](.*[^\s])?$
          example: Crédito Pessoal Consignado
          description: 'Denominação/Identificação do name da Modalidade da Operação de Crédito divulgado ao customer

            '
        productType:
          $ref: '#/components/schemas/FinancingsEnumProductType'
        productSubType:
          $ref: '#/components/schemas/FinancingsEnumProductSubType'
        contractDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2018-01-05'
          description: Data de contracting da operation de credit. Especificação RFC-3339
        disbursementDates:
          type: array
          minItems: 1
          description: 'Lista que traz as Datas de Desembolso do value contratado.

            '
          items:
            type: string
            format: date
            maxLength: 10
            pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
            example: '2018-01-15'
            description: 'Data do Desembolso do value contratado. Especificação RFC-3339.

              No caso de uma liberação de recursos feita em D0 mas com referência retroativa feita em D -1, contabilmente a data correta seria D -1.

              '
        settlementDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2018-01-15'
          description: 'Data de settlement da operation.

            '
        contractAmount:
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: Valor contratado da operation. Expresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places. Nos ifs em que not houver este value explícito no contract do product, enviar como 0.00.
        currency:
          type: string
          pattern: ^(\w{3}){1}$
          maxLength: 3
          description: 'Moeda related to ao value da garantia, according to modelo ISO-4217. p.ex. ''BRL''

            Todos os valores monetários informados estão representados com a moeda vigente do Brasil

            '
          example: BRL
        dueDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2028-01-15'
          description: "Data de due date Final da operation. Especificação RFC-3339.   \n"
        instalmentPeriodicity:
          type: string
          description: '"Informção relativa à periodicity regular das installments. (Vide Enum)

            sem periodicidade regular, semanal, quinzenal, mensal, bimestral, trimestral, semestral, anual"

            '
          enum:
          - SEM_PERIODICIDADE_REGULAR
          - SEMANAL
          - QUINZENAL
          - MENSAL
          - BIMESTRAL
          - TRIMESTRAL
          - SEMESTRAL
          - ANUAL
          - OUTROS
          example: SEMANAL
        instalmentPeriodicityAdditionalInfo:
          type: string
          pattern: ^[^\s](.*[^\s])?$
          maxLength: 50
          example: Informações adicionais sobre periodicidade
          description: "Campo para complementar a informtion relativa à periodicity de payment regular. \n\n[Restrição] Obrigatório when o field instalmentPeriodicity for igual a OUTROS.\n"
        firstInstalmentDueDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2018-02-15'
          description: 'Data de due date primeira installment do principal.

            '
        CET:
          type: string
          format: double
          maxLength: 13
          minLength: 8
          pattern: ^\d{1,6}\.\d{6}$
          example: '0.290000'
          description: "CET – Custo Efetivo Total must be expresso na form de rate percentage annual e incorpora all os encargos e despesas incidentes nas operations de credit (rate de juro, mas also tarifas, tributos, seguros e other despesas cobradas).\n\nO completion must respeitar as 6 decimal places decimal places, same que venham filled com zeros (representstion de porcentagem p.ex: 0.150000.\nEste value represents 15%. O value 1 represents 100%).  \n\nPara o public PF (individual) o field é de submission required para contracts firmados a partir de 2008, according to Resolução CMN 3.517. Para o public PJ (legal entity) o field é de submission required para contracts firmados a partir de 2011, according to Resolução CMN 3.909. Excepcionalmente nos ifs de operations de credit rural, o submission do field CET beá required a partir de 2019, according to Resolução CMN 4.699. O field may be filled com 0.00 em cenários nos quais a casa not has a informtion de CET (Custo efetivo total) only para as exceções listdas abaixo:\n- Em contracts anteriores a 2008 (para o public PF);\n- Em contracts anteriores a 2011 (para o public PJ);\n- Em contracts anteriores a 2019 para os ifs de operations de credit rural (ambos os publics PF e PJ);\n- Público PJ de médio ou grande porte.\n\nQuando o CET for indexado dinamicamente a um indicador ainda not divulgado, provide o value recalculado com o último index oficial available na date da query. Assim que o novo index for publicado, o CET must be atualizado na próxima exposition.\n"
        amortizationScheduled:
          type: string
          description: 'Sistema de amortization (Vide Enum):

            - SAC (Sistema de Amortização Constante) - É aquele em que o valor da amortização permanece igual até o final. Os juros cobrados sobre o parcelamento não entram nesta conta.

            - PRICE (Sistema Francês de Amortização) - As parcelas são fixas do início ao fim do contrato. Ou seja, todas as parcelas terão o mesmo valor, desde a primeira até a última. Nos primeiros pagamentos, a maior parte do valor da prestação corresponde aos juros. Ao longo do tempo, a taxa de juros vai decrescendo. Como o valor da prestação é fixo, com o passar das parcelas, o valor de amortização vai aumentando.

            - SAM (Sistema de Amortização Misto) - Cada prestação (pagamento) é a média aritmética das prestações respectivas no Sistemas Price e no Sistema de Amortização Constante (SAC).

            - SEM SISTEMA DE AMORTIZAÇÃO

            '
          enum:
          - SAC
          - PRICE
          - SAM
          - SEM_SISTEMA_AMORTIZACAO
          - OUTROS
          example: SAC
        amortizationScheduledAdditionalInfo:
          type: string
          pattern: ^[^\s](.*[^\s])?$
          maxLength: 200
          example: Informações complementares relativa à amortização do tipo 'OUTROS'
          description: 'Campo para complementar a informtion relativa à amortization.


            [Restrição] Obrigatório quando o campo amortizationScheduled for igual a OUTROS.

            '
        interestRates:
          type: array
          minItems: 0
          description: "Objeto que traz o set de informtion necessárias para demonstrar a composition das rates de interest remuneratórios da Modalidade de credit.  \nCaso o contract not possua rates de interest, must be compartilhada uma list empty. Caso o contract possua uma rate de interest com value 0, must be compartilhado um objeto com o value 0 de form explícita.\n"
          items:
            $ref: '#/components/schemas/FinancingsContractInterestRate'
        contractedFees:
          type: array
          minItems: 0
          description: 'Lista que traz as informtion das tarifas pactuadas no contract.

            '
          items:
            $ref: '#/components/schemas/FinancingsContractFee'
        contractedFinanceCharges:
          type: array
          minItems: 0
          description: Lista que traz os encargos pactuados no contract
          items:
            $ref: '#/components/schemas/FinancingsFinanceCharge'
        hasInsuranceContracted:
          type: boolean
          description: Campo que identifies se existe seguro contratado para o Financiamento, onde seguro contratado é true e not contratado é false. O not submission do field significa que a institution not oferece este product.
    FinancingsResponseFinancingsWarranties:
      type: object
      required:
      - data
      - links
      - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/FinancingsWarranties'
        links:
          $ref: '#/components/schemas/FinancingsLinks'
        meta:
          $ref: '#/components/schemas/FinancingsMeta'
    FinancingsPayments:
