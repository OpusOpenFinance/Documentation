          description: Valor related ao objeto.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
          example: BRL
    AccountsAccountBalancesDataBlockedAmount:
      type: object
      description: 'Saldo blocked, not available para use imediata, por reason de block apresentado para o customer nos canais electronic. Expresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places.'
      required:
        - amount
