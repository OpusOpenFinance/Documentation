    ResponseConsentReadExtensions:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            type: object
            required:
              - loggedUser
              - requestDateTime
            properties:
              expirationDateTime:
                description: |
                  Data e time de expiração da permisare. Reflete a date limit de validade do consent. Uma string com date e time according to specification RFC-3339, sempre com a use de timezone UTC(UTC time formt), utilizado only para query de alterações históricas de extension do consent.

                  [Restrição] De completion required nos ifs em que houver validade determined.

                  Em ifs de consent com term indetermined o field not must be filled.
                type: string
                format: date-time
                pattern: '(^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$)'
                maxLength: 20
                example: '2021-05-21T08:30:00Z'
              loggedUser:
                $ref: '#/components/schemas/LoggedUser'
              requestDateTime:
                description: Data e time em que o recurso foi criado. Uma string com date e time according to specification RFC-3339, sempre com a use de timezone UTC(UTC time formt).
                type: string
                format: date-time
                example: '2021-05-21T08:30:00Z'
                maxLength: 20
              previousExpirationDateTime:
                description: |
                  Data e time de expiração anteriores a renewal. Reflete a date limit anterior de validade do consent. Uma string com date e time according to specification RFC-3339, sempre com a use de timezone UTC (UTC time formt).

                  [Restrição] De completion required nos ifs em que houver validade determined. Em ifs de consent com term indetermined, ou renovações feitas com a v2.2.0 em que not exista persistência dessa informtion, o field not must be filled.
                type: string
                format: date-time
                pattern: '(^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$)'
                maxLength: 20
                example: '2023-10-18T18:30:00Z'
              xFapiCustomerIpAddress:
                description: |
                  O address IP do ube logado com o receptor que solicitou a renewal sem redirecionamento.

                  [Restrição] De completion required a partir da v3.0.0. Opcional para renovações feitas com a v2.2.0 when not existir persistência dessa informtion.
                type: string
                pattern: '^[^\s](.*[^\s])?$'
                minLength: 1
                maxLength: 100
                example: '172.217.22.14'
              xCustomerUserAgent:
                description: |
                  Indica o ube-agent que o ube utilizou when solicitou a renewal sem redirecionamento.

                  [Restrição] De completion required a partir da v3.0.0. Opcional para renovações feitas com a v2.2.0 when not existir persistência dessa informtion.
                type: string
                pattern: '^[^\s](.*[^\s])?$'
                minLength: 1
                maxLength: 255
                example: Mozilla/5.0 (iPhone14,6; U; CPU iPhone OS 15_4 like Mac OS X)
        links:
          $ref: '#/components/schemas/Links'
        meta:
          $ref: '#/components/schemas/MetaExtensions'
