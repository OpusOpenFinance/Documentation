    CustomersPersonalIdentificationData:
      type: object
      description: Conjunto de informtion relativas a Identificação ou be a ação e o efeito de identify de form single a natural person through de seus date cadastrais.
      required:
        - updateDateTime
        - personalId
        - brandName
        - civilName
        - birthDate
        - documents
        - hasBrazilianNationality
        - contacts
        - companiesCnpj
      properties:
        updateDateTime:
          type: string
          maxLength: 20
          format: date-time
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2021-05-21T08:30:00Z'
          description: |
            Data e time da update dos fields \<_endpoint_\>, according to specification RFC-3339, formt UTC. Quando not existente uma date vinculada especificamente ao bloco, assumir a date e time de update do registration como um todo.
        personalId:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          maxLength: 100
          minLength: 1
          description: Um identifier single e immutable usado para identify o recurso customer natural person. Este identifier not tem significado para o customer que deu o consent
          example: 578-psd-71md6971kjh-2d414
        brandName:
          type: string
          maxLength: 80
          pattern: '[\w\W\s]*'
          example: Organização A
          description: 'Nome da Marca reportada pelo participant no Open Finance. Recomenda-se utilizar, sempre que possible, o same name de marca assigned no field do directory Customer Friendly Server Name (Authorisation Server).'
        civilName:
          type: string
          maxLength: 70
          pattern: '^[\w\W]*$'
          example: Juan Kaique Cláudio Fernandes
          description: |
            Nome civil completo da natural person (Direito fundamental da pessoa, o name civil é aquele assigned à natural person desde o registro de seu birth, com o qual beá identified por toda a sua vida, bem como after a sua morte).

            Caso o name civil provided exceda o limit de 70 caracteres, must be held o primeiro e o último name completos, realizando abreviação progressiva dos names intermediários (reduzindo-os às respectivas iniciais, seguidas de ponto), up to que o name se ajuste ao limit defined.
            Persistindo excesso after a abreviação de all os intermediários, aplicar truncamento simples ao final do field para respeitar o limit maximum. Não utilizar reticências.
        socialName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Jaqueline de Freitas
          description: 'Nome social da natural person, se houver. (aquele pelo qual travestis e transexuais se reconhecem, bem como are identifieds por sua comunit e em seu meio social, according to Decreto Local)'
        birthDate:
          type: string
          maxLength: 10
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '1989-03-23'
          description: 'Data de birth, according to specification RFC-3339'
        maritalStatusCode:
          $ref: '#/components/schemas/CustomersEnumMaritalStatusCode'
        maritalStatusAdditionalInfo:
          type: string
          pattern: '[\w\W\s]*'
          maxLength: 50
          example: Amasiado
          description: |
            Campo livre para complementar a informtion relativa ao state marital.

            [Restrição] Preenchimento required when selecionado o type 'OUTRO'.
        sex:
          $ref: '#/components/schemas/CustomersEnumSex'
        companiesCnpj:
          type: array
          minItems: 1
          items:
            type: string
            pattern: '^[0-9A-Z]{12}[0-9]{2}$'
            maxLength: 14
          example:
            - '01773247000103'
            - '01773247000563'
          description: |
            Representação alphanumeric completa do CNPJ da institution responsible pelo Cadastro - o CNPJ corresponds a representstion alphanumeric de registration no Cadastro de Pessoa Jurídica.
            Deve-se ter only os caracteres do CNPJ, sem mask.
        documents:
          $ref: '#/components/schemas/CustomersPersonalDocument'
        otherDocuments:
          type: array
          items:
            $ref: '#/components/schemas/CustomersPersonalOtherDocument'
          minItems: 1
          description: Relação dos demais documents
        hasBrazilianNationality:
          type: boolean
          example: false
          description: Inform se o Cliente tem nationality brasileira.
        nationality:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CustomersNationality'
        filiation:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - type
              - civilName
            properties:
              type:
                $ref: '#/components/schemas/CustomersEnumFiliationType'
              civilName:
                type: string
                maxLength: 70
                pattern: '^[\w\W]*$'
                example: Marcelo Cláudio Fernandes
                description: |
                  Nome civil completo da natural person (Direito fundamental da pessoa, o name civil é aquele assigned à natural person desde o registro de seu birth, com o qual beá identified por toda a sua vida, bem como after a sua morte).

                  Caso o name civil provided exceda o limit de 70 caracteres, must be held o primeiro e o último name completos, realizando abreviação progressiva dos names intermediários (reduzindo-os às respectivas iniciais, seguidas de ponto), up to que o name se ajuste ao limit defined.
                  Persistindo excesso after a abreviação de all os intermediários, aplicar truncamento simples ao final do field para respeitar o limit maximum. Não utilizar reticências.
              socialName:
                type: string
                maxLength: 70
                pattern: '^[\w\W]*$'
                description: |
                  Nome social da natural person, se houver.
                  (aquele pelo qual travestis e transexuais se reconhecem,
                  bem como are identifieds por sua comunit e em seu meio social, according to Decreto Local).
        contacts:
          $ref: '#/components/schemas/CustomersPersonalContacts'
    CustomersPersonalDocument:
      type: object
      description: Objeto agrupador de informtion relativas a Documentos da natural person
      properties:
        cpfNumber:
          type: string
          maxLength: 11
          pattern: '^\d{11}$'
          example: '25872252137'
          description: |
            Número completo do CPF.
            Atributo que corresponds às informtion mínimas exigidas pela Regulamentação em vigor.
            O CPF é o Cadastro de Pessoa natural. Ele é um document feito pela Receita Federal e beve para identify os contribuintes. O CPF é uma numeração com 11 digits, que só mudam por deciare judicial. O document é emitido pela receita federal.

            [Restrição] Preenchimento required when not for provided o passport.
        passport:
          $ref: '#/components/schemas/CustomersPersonalPassport'
    CustomersPersonalPassport:
      type: object
      description: |
        Documento concedido aos viajantes por uma autoridade administrativa nacional a fim de certificar sua identidade perante autoridades estrangeiras.

        [Restrição] Aplicável somente à Pessoa natural residente no exterior desobrigada de registration no CPF.

        [Restrição] Preenchimento required when not for provided o cpfNumber.
      required:
        - number
        - country
      properties:
        number:
          type: string
          maxLength: 20
          pattern: '^[\w\W]*$'
          example: '75253468744594820620'
          description: |
            Número do Passaporte.
        country:
          type: string
          maxLength: 3
          pattern: '^(\w{3}){1}$'
          example: CAN
          description: |
            Pais de issuance do passaporte. Código do pais de agreement com o code 'alpha3' do ISO-3166.
        expirationDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: |
            Data vigência do Passaporte, according to specification RFC-3339.
        issueDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: |
            Data de issuance do passaporte, according to specification RFC-3339.
    CustomersPersonalOtherDocument:
      type: object
      required:
        - type
        - number
      properties:
        type:
          $ref: '#/components/schemas/CustomersEnumPersonalOtherDocumentType'
        typeAdditionalInfo:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: CREA-RJ
          description: Campo livre de completion required se selecionada a option OUTROS types de documents
        number:
          type: string
          maxLength: 40
          pattern: '[\w\W\s]*'
          example: '15291908'
          description: Identificação/Número do document provided
        checkDigit:
          type: string
          maxLength: 2
          pattern: '[\w\W\s]*'
          example: P
          description: Dígito verificador do document provided. De completion required se o document provided tiver digit verificador
        additionalInfo:
          type: string
          maxLength: 50
          pattern: '[\w\W\s]*'
          example: SSP/SP
          description: |
            Para documents em que se aplique o uso do local de issuance o same must be sent mandatoriamente, com a informtion de órgão e UF. Exemplo: RG, local de issuance: SSP/RS.
            [Restrição] Obrigatório when o Local de Emisare do Documento for relevante.
        expirationDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: 'Data de validade do document provided, according to specification RFC-3339.'
    CustomersEnumPersonalOtherDocumentType:
      type: string
      enum:
        - CNH
        - RG
        - NIF
        - RNE
        - OUTROS
      description: |
        Relação dos Códigos dos demais documents natural person.
    CustomersNationality:
      type: object
      description: Objeto que agrupa informtion relativas à nationality da Pessoa Natural
      required:
        - otherNationalitiesInfo
        - documents
      properties:
        otherNationalitiesInfo:
          type: string
          pattern: '^\S[\s\S]*$'
          maxLength: 40
          example: CAN
          description: |
            Campo de completion required if o customer not possua nationality brasileira. Preencher indicando all suas demais nationalitys utilizando o code de pais de agreement com o code alpha3 do ISO-3166.p.ex.'CAN'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/CustomersNationalityOtherDocument'
          description: Lista que traz relationship de documents complementares de pessoas com nationality diferente de brasileira
    CustomersNationalityOtherDocument:
      type: object
      required:
        - type
        - number
      properties:
        type:
          type: string
          maxLength: 10
          pattern: '[\w\W\s]*'
          description: 'Tipo de document. Campo livre, de completion required when a nationality for diferente de brasileira. Informr type e number do document, além da, vigência e demais informtion complementares para se identify o document de pessoa estrangeira'
          example: SOCIAL SEC
        number:
          type: string
          maxLength: 40
          pattern: '[\w\W\s]*'
          description: 'Número de identifiestion do document. Campo livre, de completion required when a nationality for diferente de brasileira. Informr o number do document e demais informtion complementares para se identify o document de pessoa estrangeira'
          example: '423929299'
        expirationDate:
          description: 'Data de validade do document provided, according to specification RFC-3339.'
          type: string
          maxLength: 10
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
        issueDate:
          description: 'Data de issuance do document, according to specification RFC-3339.'
          type: string
          maxLength: 10
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
        country:
          type: string
          maxLength: 80
          pattern: '[\w\W\s]*'
          example: Brasil
          description: |
            Nome do country.
        additionalInfo:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          description: Campo livre de completion when required.
          example: Informações adicionais.
    CustomersEnumFiliationType:
      type: string
      enum:
        - MAE
        - PAI
      example: PAI
      description: Tipo de filiação.
    CustomersPersonalContacts:
      type: object
      description: |
        Conjunto de informtion related tos às forms para accounttar o customer.
        Os date deste field are de submission required. Só not must be sents if a institution not os possua.
      required:
        - postalAddresses
        - phones
        - emails
      properties:
        postalAddresses:
          type: array
          items:
            $ref: '#/components/schemas/CustomersPersonalPostalAddress'
          minItems: 0
          description: Lista de addresss da natural person
        phones:
          type: array
          items:
            $ref: '#/components/schemas/CustomersCustomerPhone'
          minItems: 0
          description: Lista com phones de accountto da natural person
        emails:
          type: array
          items:
            $ref: '#/components/schemas/CustomersCustomerEmail'
          minItems: 0
          description: Lista e-mails de accountto
    CustomersPersonalPostalAddress:
      type: object
      required:
        - isMain
        - address
        - townName
        - postCode
        - country
      properties:
        isMain:
          type: boolean
          example: true
          description: Indica se o address provided é o principal.
        address:
          type: string
          maxLength: 150
          pattern: '[\w\W\s]*'
          example: 'Av Naburo Ykesaki, 1270'
          description: Corresponde ao address residential do customer.
        additionalInfo:
          type: string
          maxLength: 30
          pattern: '[\w\W\s]*'
          example: Fundos
          description: Alguns logradouros ainda necessitam be especificados por meio de complement.
        districtName:
          type: string
          maxLength: 50
          pattern: '[\w\W\s]*'
          example: Centro
          description: |
            Bairro é uma comunit ou região localizada em uma city ou municipality de agreement com as suas subdivisões geográficas.
            [Restrição] De completion required, se houver.
        townName:
          type: string
          maxLength: 50
          pattern: '[\w\W\s]*'
          example: Marília
          description: |
            Localidade: O name da localidade corresponds à designação da city ou municipality no qual o address is localizado.
        ibgeTownCode:
          type: string
          pattern: '\d{7}$'
          maxLength: 7
          example: '3550308'
          description: 'Código IBGE de Município. A Tabela de Códigos de Municípios do IBGE apresenta a list dos municipalitys brasileiros associados a um code composed de 7 digits, sendo os dois primeiros related tos ao code da Unidade da Federação.'
        countrySubDivision:
          $ref: '#/components/schemas/CustomersEnumCountrySubDivision'
        postCode:
          type: string
          pattern: '^\d{8}$'
          maxLength: 8
          example: '17500001'
          description: |
            Código de Endereçamento Postal: Composto por um set numérico de oito digits, o objetivo principal do CEP é orientar e acelerar o encaminhamento, o tratamento e a entrega de objetos postados nos Correios, por meio da sua atribuição a localidades, logradouros, units dos Correios, beviços, órgãos publics, empresas e edifícios. p.ex. '01311000'.
        country:
          type: string
          maxLength: 80
          pattern: '[\w\W\s]*'
          example: Brasil
          description: Nome do country
        countryCode:
          type: string
          pattern: '^([A-Z]{3})$'
          maxLength: 3
          example: BRA
          description: Código do country de agreement com o code alpha3 do ISO-3166.
        geographicCoordinates:
          $ref: '#/components/schemas/CustomersGeographicCoordinates'
    CustomersEnumCountrySubDivision:
      type: string
      description: 'Enumeração related to a cada sigla da unit da federação que identifies o state ou o distrito federal, no qual o address is localizado. p.ex. ''AC''. São consideradas only as siglas para os states brasileiros'
      enum:
        - AC
        - AL
        - AP
        - AM
        - BA
        - CE
        - DF
        - ES
        - GO
        - MA
        - MT
        - MS
        - MG
        - PA
        - PB
        - PR
        - PE
        - PI
        - RJ
        - RN
        - RS
        - RO
        - RR
        - SC
        - SP
        - SE
        - TO
      example: SP
    CustomersGeographicCoordinates:
      type: object
      description: 'Conjunto de informtion, que correspondsm aos values das coordenadas geográficas em graus decimal places, no Sistema de reference WGS84'
      required:
        - latitude
        - longitude
      properties:
        latitude:
          description: |
            Informção da Latitude related to a geolocalização informda. Entre -90 e 90.p.ex. '-23.5475000'. (2 decimal places antes da vírgula, 11 positions)
          type: string
          pattern: '^-?\d{1,2}\.\d{1,9}$'
          maxLength: 13
          example: '-23.5475000'
        longitude:
          description: |
            Informção da Longitude related to a geolocalização informda. Entre -180 e 180. p.ex '-46.6361100'. (3 decimal places antes da vírgula, 11 positions)
          type: string
          pattern: '^-?\d{1,3}\.\d{1,8}$'
          maxLength: 13
          example: '-46.6361100'
    CustomersCustomerPhone:
      type: object
      required:
        - isMain
        - type
        - areaCode
        - number
      properties:
        isMain:
          type: boolean
          description: Indica se o phone provided é o principal
          example: true
        type:
          $ref: '#/components/schemas/CustomersEnumCustomerPhoneType'
        additionalInfo:
          type: string
          description: 'Informção complementar relativa ao type de phone selecionado. [Restrição] De completion required when selecionado o type ''OUTRO''.'
          pattern: '[\w\W\s]*'
          maxLength: 70
          example: Informações adicionais.
        countryCallingCode:
          type: string
          maxLength: 4
          pattern: '^\d{1,4}$'
          example: '55'
          description: |
            Número de DDI (Discagem Direta Internacional) para phone de acesso ao Cliente - se houver

            [Restrição] O completion é required when for diferente de 55.
        areaCode:
          $ref: '#/components/schemas/CustomersAreaCode'
        number:
          type: string
          maxLength: 13
          pattern: '^([0-9]{6,13})$'
          example: '29875132'
          description: Número de phone do customer
        phoneExtension:
          type: string
          maxLength: 5
          pattern: '^\d{1,5}$'
          description: Número do ramal. De completion required se fizer parte da identifiestion do number do phone provided
          example: '932'
    CustomersEnumCustomerPhoneType:
      type: string
      description: Identificação do Tipo de phone do customer.
      enum:
        - FIXO
        - MOVEL
        - OUTRO
      example: FIXO
    CustomersAreaCode:
      type: string
      example: '19'
      description: Número de DDD (Discagem Direta à Distância) do phone do customer - se houver
      maxLength: 3
      minLength: 2
      pattern: ^(\d{2,3})$
    CustomersCustomerEmail:
      type: object
      required:
        - isMain
        - email
      properties:
        isMain:
          type: boolean
          description: Indica se o email provided é o principal
          example: true
        email:
          type: string
          format: email
          description: Endereço de email
          maxLength: 320
          example: karinafernandes-81@br.inter.net
    CustomersEnumMaritalStatusCode:
      type: string
      enum:
        - SOLTEIRO
        - CASADO
        - VIUVO
        - SEPARADO_JUDICIALMENTE
        - DIVORCIADO
        - UNIAO_ESTAVEL
        - OUTRO
      example: OUTRO
      description: |
        Estado marital do customer.
    CustomersEnumSex:
      type: string
      enum:
        - FEMININO
        - MASCULINO
        - OUTRO
      example: FEMININO
      description: |
        "Conjunto de características anatomofisiológicas que distinguem o homem e a mulher: Sexo masculino; sex feminino".
        No if de not be feminino nem masculino é classificado como 'OUTRO'
    CustomersPersonalQualificationData:
      type: object
      description: 'Conjunto de informtion relativas ao process de qualification. Considera-se qualification as informtion que permitam as institutions apreciar, avaliar, caracterizar e classificar o customer com a purpose de conhecer o seu perfil de risco e sua capacity econômico-financeira'
      required:
        - updateDateTime
        - companyCnpj
      properties:
        updateDateTime:
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
          description: |
            Data e time da update dos fields \<_endpoint_\>, according to specification RFC-3339, formt UTC. Quando not existente uma date vinculada especificamente ao bloco, assumir a date e time de update do registration como um todo.
        companyCnpj:
          type: string
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          maxLength: 14
          example: '50685362000135'
          description: |
            Representação alphanumeric completa do CNPJ da institution responsible pelo Cadastro - o CNPJ corresponds a representstion alphanumeric de registration no Cadastro de Pessoa Jurídica. Deve-se ter only os caracteres do CNPJ, sem mask.
        occupationCode:
          $ref: '#/components/schemas/CustomersEnumOccupationMainCodeType'
        occupationDescription:
          type: string
          maxLength: 100
          pattern: '[\w\W\s]*'
          example: '01'
          description: |
            Campo de livre completion para provide o code da occupation ou um descritivo da occupation. Ao fill o field atentar para o seguintes pontos:
            - Quando selecionada a option `occupationCode` `RECEITA_FEDERAL` ou `CBO`, provide o code desta list padronizada;
            - Se selecionada `occupationCode` `OUTRO`, provide o descritivo da occupation when a IF not segue a list padronizada da Receita Federal e nem da CBO;
            - No submission do code padronizado da Receita Federal e CBO, provide somente o code according to consta nas lists corresponding.

            [Restrição] Este field é de submission required when o field `/data/occupationCode` for sent.
        informedIncome:
          $ref: '#/components/schemas/CustomersInformedIncome'
        informedPatrimony:
          $ref: '#/components/schemas/CustomersPersonalInformedPatrimony'
        employers:
          type: array
          description: Lista de empregadores vinculados ao customer according to registros da date-transmitting institution.
          minItems: 1
          items:
            type: object
            properties:
              cnpjCpf:
                type: string
                description: Número de registration (CPF/CNPJ) do empregador com o qual o customer possua relationship empregatício.
                pattern: '^([0-9]{11}|[0-9A-Z]{12}[0-9]{2})$'
                example: '30386566000164'
              name:
                type: string
                description: Nome do empregador ou Razão social do empregador com o qual o customer possua relationship empregatício.
                pattern: '^[^\s](.*[^\s])?$'
                example: 'Organização A'
    CustomersEnumOccupationMainCodeType:
      type: string
      enum:
        - RECEITA_FEDERAL
        - CBO
        - OUTRO
      example: RECEITA_FEDERAL
      description: |
        Traz a relationship dos codes relativos à occupation.
    CustomersInformedIncome:
      type: object
      required:
        - frequency
        - amount
        - date
      properties:
        frequency:
          $ref: '#/components/schemas/CustomersEnumInformedIncomeFrequency'
        amount:
          $ref: '#/components/schemas/CustomersInformedIncomeAmount'
        date:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: 'Data da income, according to specification RFC-3339.'
    CustomersEnumInformedIncomeFrequency:
      type: string
      enum:
        - DIARIA
        - SEMANAL
        - QUINZENAL
        - MENSAL
        - BIMESTRAL
        - TRIMESTRAL
        - SEMESTRAL
        - ANUAL
        - OUTROS
      description: Traz a frequência ou period da income informda.
    CustomersInformedIncomeAmount:
      type: object
      required:
        - amount
        - currency
      description: Valor total da income informda
      properties:
        amount:
          description: |
            Valor total da income informda. Expresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places.
            Renda primária indica os montantes a pagar ou a receber em troca do uso temporário de recursos financeiros, trabalho ou ativos not financeiros not produzidos, a saber, compensation de trabalhadores, income de investments e demais incomes primárias.
            Fazem parte da primeira a compensation do trabalho assalariado (salarys e ordenados); da segunda, income de investment direct, income de investment em carteira, income de other investments e income de ativos de rebeva; e da terceira, tributos sobre a produção e importação, subsídios e aluguéis.
            Fonte: Banco Central do Brasil – Departamento Econômico
          type: string
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '100000.0400'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
          example: BRL
    CustomersPersonalInformedPatrimony:
      type: object
      required:
        - amount
        - year
      properties:
        amount:
          $ref: '#/components/schemas/CustomersInformedPatrimonyAmount'
        year:
          type: number
          maximum: 9999
          example: 2010
          description: 'Ano de reference da Renda, according to specification RFC-3339.'
    CustomersInformedPatrimonyAmount:
      type: object
      required:
        - amount
        - currency
      description: Valor do assets provided
      properties:
        amount:
          description: |
            Valor do assets provided. Expresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places.
            Patrimônio é o set de bens vinculado a uma pessoa ou a uma entidade.
          type: string
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '100000.0400'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
          example: BRL
    CustomersPersonalFinancialRelationData:
      type: object
      description: 'Objeto que reúne as informtion relativas ao relacionamento do customer junto à Instituição. Considera-se relacionamento as informtion que permitam conhecer desde when a pessoa queryda é customer da institution, bem como um indicador dos products e beviços que ela consome atualmente e seus representsntes'
      required:
        - updateDateTime
        - startDate
        - productsServicesType
        - accounts
        - procurators
      properties:
        updateDateTime:
          type: string
          format: date-time
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2021-05-21T08:30:00Z'
          description: |
            Data e time da update dos fields \<_endpoint_\>, according to specification RFC-3339, formt UTC. Quando not existente uma date vinculada especificamente ao bloco, assumir a date e time de update do registration como um todo.
        startDate:
          type: string
          format: date-time
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2021-05-21T08:30:00Z'
          description: Data de início de relacionamento com a Instituição Financeira. Deve trazer o menor value entre a informtion reportada ao BACEN pelo DOC 3040 e CCS.
        productsServicesType:
          type: array
          items:
            $ref: '#/components/schemas/CustomersEnumProductServiceType'
          minItems: 1
          maxItems: 12
        productsServicesTypeAdditionalInfo:
          type: string
          pattern: '^[\w\W]*$'
          maxLength: 100
          example: Informações adicionais do tipo de serviço.
          description: |
            Informções adicionais do type de beviço.
            [Restrição] Campo required when productsServicesType for 'OUTROS'.
        procurators:
          type: array
          items:
            $ref: '#/components/schemas/CustomersPersonalProcurator'
          minItems: 0
          description: |
            Lista dos representsntes.
            [Restrição] De completion required se houver representsnte.
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/CustomersPersonalAccount'
          minItems: 0
          description: |
            Lista de accounts deposit à vista, savings e payment prepaids held pelo customer na date-transmitting institution.
        portabilitiesReceived:
          type: array
          items:
            $ref: '#/components/schemas/CustomersPortabilitiesReceived'
          minItems: 1
          description: |
            Lista de informtion de empregador receiveds through de portabilidade de salary solicitada pelo customer da transmissora à institution detentora(s) de sua account salary, ativos ou que já estiveram ativos,. Cada relationship é associado a uma portabilidade de salary recebida pela transmissora.

            Obs.: a portabilidade not é explicitamente encerrada, ou be, a IF para a qual o salary foi portado not é avisado when a account salary se encerra ou o salary é portado para outra IF. Não é possible garantir que os date provideds bem de uma portabilidade ativa, nem que o relationship com o banco folha ainda exista. A transmissora terá tais informtion only when o pedido da portabilidade tiver sido solicitado em seus canais.
        paychecksBankLink:
          type: array
          items:
            $ref: '#/components/schemas/CustomersPaychecksBankLink'
          minItems: 1
          description: |
            Lista de informtion de accounts salary related com relationships empregatícios, existentes ou que já existiram, firmados entre o customer natural person e um ou mais empregadores. Cada relationship é associado a uma account salary aberta mantida no banco-folha (date-transmitting institution).

            Obs: como empregadores antigos podem not ter solicitado o fechamento da account salary, not é possible garantir que os date provideds bem do empregador atual.
    CustomersEnumProductServiceType:
      type: string
      enum:
        - CONTA_DEPOSITO_A_VISTA
        - CONTA_POUPANCA
        - CONTA_PAGAMENTO_PRE_PAGA
        - CARTAO_CREDITO
        - OPERACAO_CREDITO
        - SEGURO
        - PREVIDENCIA
        - INVESTIMENTO
        - OPERACOES_CAMBIO
        - CONTA_SALARIO
        - CREDENCIAMENTO
        - OUTROS
      example: SEGURO
      description: Lista com a relationship dos products e beviços com contract vigente.
    CustomersPersonalProcurator:
      type: object
      required:
        - type
        - cpfNumber
        - civilName
      properties:
        type:
          $ref: '#/components/schemas/CustomersEnumProcuratorsTypePersonal'
        cpfNumber:
          type: string
          maxLength: 11
          pattern: '^\d{11}$'
          example: '73677831148'
          description: 'Número completo do CPF. O CPF é o Cadastro de Pessoa natural. Ele é um document feito pela Receita Federal e beve para identify os contribuintes. O CPF é uma numeração com 11 digits, que só mudam por deciare judicial. O document é emitido pela receita federal'
        civilName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Elza Milena Stefany Teixeira
          description: |
            Nome civil completo da natural person (Direito fundamental da pessoa, o name civil é aquele assigned à natural person desde o registro de seu birth, com o qual beá identified por toda a sua vida, bem como after a sua morte).

            Caso o name civil provided exceda o limit de 70 caracteres, must be held o primeiro e o último name completos, realizando abreviação progressiva dos names intermediários (reduzindo-os às respectivas iniciais, seguidas de ponto), up to que o name se ajuste ao limit defined.
            Persistindo excesso after a abreviação de all os intermediários, aplicar truncamento simples ao final do field para respeitar o limit maximum. Não utilizar reticências.
        socialName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Carlos
          description: 'Nome social da natural person, se houver. (aquele pelo qual travestis e transexuais se reconhecem, bem como are identifieds por sua comunit e em seu meio social, according to Decreto Nº 51.180, de 14 de janeiro de 2010)'
    CustomersEnumProcuratorsTypePersonal:
      type: string
      enum:
        - REPRESENTANTE_LEGAL
        - PROCURADOR
      example: PROCURADOR
      description: |
        Tipo de representsnte.
        Representante legal - Nome Civil completo da Pessoa Natural que represent uma entidade ou uma empresa e é nameado em seu ato constitutivo, ou be, no contract social ou estatuto social.
        Procurador - é qualquer pessoa que represent a Pessoa Natural em algum negócio, mediante authorization escrita do same.
    CustomersPersonalAccount:
      type: object
      description: |
        Lista de accounts deposit à vista, savings e payment prepaids held pelo customer na date-transmitting institution e for which ele has provided consent
      required:
        - compeCode
        - number
        - checkDigit
        - type
        - subtype
      properties:
        compeCode:
          type: string
          maxLength: 3
          pattern: '^\d{3}$'
          description: 'Código identifier assigned pelo Banco Central do Brasil às institutions participants do STR (Sistema de Transferência de rebevas).O Compe (Sistema de Compensação de Cheques e Outros Papéis) é um sistema que identifies e processa as compensações banks. Ele é representsdo por um code de três digits que beve como identifier de bancos, sendo assim, cada institution bank has um number exclusive'
          example: '001'
        branchCode:
          type: string
          maxLength: 4
          pattern: '^\d{4}$'
          description: |
            Código da Agência detentora da account. (Agência é a dependência destinada ao atendimento aos customers, ao public em geral e aos associados de cooperativas de credit, no exercício de atividades da institution, not podendo be móvel ou transitória)
            [Restrição] Obrigatoriamente must be filled when o field "type" for diferente de account prepaid.
          example: '6272'
        number:
          type: string
          maxLength: 20
          pattern: '^\d{8,20}$'
          description: |
            Número da account
          example: '24550245'
        checkDigit:
          type: string
          maxLength: 1
          pattern: '[\w\W\s]*'
          description: |
            Dígito da account
          example: '4'
        type:
          $ref: '#/components/schemas/CustomersEnumAccountTypeCustomers'
        subtype:
          type: string
          enum:
            - INDIVIDUAL
            - CONJUNTA_SIMPLES
            - CONJUNTA_SOLIDARIA
          description: |
            Subtype de account (vide Enum):
            Account individual - has um single titular
            Account conjunta simples - onde as movements financeiras só podem beem realizadas mediante authorization de TODOS os correntistas da account.
            Account conjunta solidária - é a modality cujos titulares podem realizar movements de form isolada, isto é, sem que be necessária a authorization dos demais titulares.
          example: INDIVIDUAL
    CustomersEnumAccountTypeCustomers:
      type: string
      enum:
        - CONTA_DEPOSITO_A_VISTA
        - CONTA_POUPANCA
        - CONTA_PAGAMENTO_PRE_PAGA
      description: |
        Tipos de accounts. Modalidades tradicionais previstas pela Resolução 4.753, not contemplando accounts vinculadas, account de domiciliados no exterior, accounts em currencys estrangeiras e account corresponding currency electronic. Vide Enum:

        Account de deposit à vista ou Account current - é o type mais comum. Nela, o dinheiro fica à sua disposition para be sacado a qualquer momento. Essa account not gera rendimentos para o depositante.

        Account savings - foi criada para estimular as pessoas a pouparem. O dinheiro que ficar na account por trinta days passa a gerar rendimentos, com isenção de imposto de income para quem declara. Ou be, o dinheiro “cresce” (rende) enquanto ficar guardado na account. Cada deposit terá rendimentos de month em month, sempre no dia do month em que o dinheiro tiver sido depositado.

        Account de payment prepaid - according to CIRCULAR Nº 3.680, BCB de  2013, é a 'destinada à execução de transactions de payment em currency electronic realizadas com base em fundos denominados em reais previamente aportados'.
      example: CONTA_DEPOSITO_A_VISTA
    CustomersPortabilitiesReceived:
      type: object
      required:
        - employerName
        - employerCnpjCpf
        - paycheckBankDetainerCnpj
        - paycheckBankDetainerIspb
        - portabilityApprovalDate
      properties:
        employerName:
          type: string
          pattern: '^[^\s](.*[^\s])?$'
          maxLength: 80
          description: |
            Nome do empregador according to received pela comunicação de portabilidade. O empregador pode be natural person ou legal entity, when se tratar de legal entity, must haver o submission da reason social.
        employerCnpjCpf:
          type: string
          pattern: '^([0-9]{11}|[0-9A-Z]{12}[0-9]{2})$'
          maxLength: 14
          description: |
            Registro de registration (CPF/CNPJ) do empregador (contratante dos beviços de payment), according to received pela comunicação de portabilidade.
        paycheckBankDetainerCnpj:
          type: string
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          maxLength: 14
          description: |
            Registro de registration no Cadastro Nacional da Pessoa Jurídica (CNPJ) do banco folha (institution detentora da account salary) according to received pela comunicação de portabilidade.
        paycheckBankDetainerIspb:
          type: string
          pattern: '^[0-9A-Z]{8}$'
          maxLength: 8
          description: |
            Registro do ISPB do Banco Folha (institution detentora da account salary) according to received pela comunicação de portabilidade.
        portabilityApprovalDate:
          type: string
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          maxLength: 10
          description: |
            Data de aprovação da portabilidade, according to received pela comunicação de portabilidade.

            Obs.: somente must be compartilhadas solicitações aprovadas, same que de form compulsória.
    CustomersPaychecksBankLink:
      type: object
      required:
        - employerName
        - employerCnpjCpf
        - paycheckBankCnpj
        - paycheckBankIspb
        - accountOpeningDate
      properties:
        employerName:
          type: string
          pattern: '^[^\s](.*[^\s])?$'
          maxLength: 80
          description: |
            Nome do empregador according to registrado na abertura da account salary. O empregador pode be natural person ou legal entity, when se tratar de legal entity, must haver o submission da reason social.
        employerCnpjCpf:
          type: string
          pattern: '^([0-9]{11}|[0-9A-Z]{12}[0-9]{2})$'
          maxLength: 14
          description: |
            Documento do empregador (CNPJ/CPF), according to registrado na abertura da account salary.
        paycheckBankCnpj:
          type: string
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          maxLength: 14
          description: |
            CNPJ da institution financeira contratada para prestar beviço de payment de salary (banco-folha).
        paycheckBankIspb:
          type: string
          pattern: '^[0-9A-Z]{8}$'
          maxLength: 8
          description: |
            Registro ISPB (Identificador do Sistema de Pagamentos Brasileiros) da institution contratada para prestar beviço de payment de salary (banco-folha).
        accountOpeningDate:
          type: string
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          maxLength: 10
          description: |
            Data de abertura da account salary.
    CustomersBusinessIdentificationData:
      type: object
      description: Conjunto de informtion relativas a Identificação ou be a ação e o efeito de identify de form single a legal entity through de seus date cadastrais
      required:
        - businessId
        - updateDateTime
        - brandName
        - cnpjNumber
        - companiesCnpj
        - companyName
        - incorporationDate
        - parties
        - contacts
      properties:
        updateDateTime:
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
          description: |
            Data e time da update dos fields \<_endpoint_\>, according to specification RFC-3339, formt UTC. Quando not existente uma date vinculada especificamente ao bloco, assumir a date e time de update do registration como um todo.
        businessId:
          type: string
          maxLength: 100
          minLength: 1
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: 578-psd-71md6971kjh-2d414
          description: Um identifier single e immutable usado para identify o recurso customer legal entity. Este identifier not tem significado para o customer que deu o consent
        brandName:
          type: string
          maxLength: 80
          pattern: '[\w\W\s]*'
          example: Organização A
          description: |
            Nome da Marca reportada pelo participant no Open Finance. Recomenda-se utilizar, sempre que possible, o same name de marca assigned no field do directory Customer Friendly Server Name (Authorisation Server).
        companyName:
          type: string
          maxLength: 144
          pattern: '[\w\W\s]*'
          example: Luiza e Benjamin Assessoria Jurídica Ltda
          description: Razão social da empresa queryda é o termo registrado sob o qual uma legal entity (PJ) se individualiza e exerce suas atividades. Também pode be chamada por denomination social ou firma empresarial
        tradeName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Mundo da Eletronica
          description: 'Nome fantasia da legal entity, se houver. (É o name popular da empresa, utilizado para divulgação da empresa e melhor fixedção com o public). De completion required se houver'
        incorporationDate:
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
          description: 'Data de constituição da empresa, according to specification RFC-3339.'
        cnpjNumber:
          type: string
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '50685362006773'
          description: |
            Número completo do CNPJ da Empresa queryda - o CNPJ corresponds a representstion alphanumeric da registration no Cadastro de Pessoa Jurídica.
            Deve-se ter only caracteres do CNPJ, sem mask
        companiesCnpj:
          minItems: 1
          type: array
          example:
            - '50685362000135'
            - '50685362006555'
          description: |
            Representação alphanumeric completa do CNPJ da institution responsible pelo Cadastro - o CNPJ corresponds a representstion alphanumeric de registration no Cadastro de Pessoa Jurídica.
            Deve-se ter only os caracteres do CNPJ, sem mask.
          items:
            type: string
            maxLength: 14
            pattern: '^[0-9A-Z]{12}[0-9]{2}$'
            example: '50685362000135'
        otherDocuments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CustomersBusinessOtherDocument'
          description: Relação dos demais documents
        parties:
          type: array
          items:
            $ref: '#/components/schemas/CustomersPartiesParticipation'
          minItems: 0
          description: |
            Lista relativa às informtion das partes envolvidas, como: sócio e/ou administrador. Objeto de submission required para all os CNPJs que possuam sócios e/ou administradores no registration do QSA (Quadro de Sócios e Administradores)
        contacts:
          $ref: '#/components/schemas/CustomersBusinessContacts'
    CustomersBusinessOtherDocument:
      type: object
      required:
        - type
        - number
        - country
      properties:
        type:
          type: string
          maxLength: 20
          pattern: '[\w\W\s]*'
          example: EIN
          description: 'Número do Tipo de document provided. De completion required, para a Pessoa legal com domicílio ou sede no exterior, desobrigada de registration no CNPJ'
        number:
          type: string
          maxLength: 20
          pattern: '[\w\W\s]*'
          example: '128328453'
          description: 'Número do outro document. De completion required, para a Pessoa legal com domicílio ou sede no exterior, desobrigada de registration no CNPJ'
        country:
          type: string
          maxLength: 3
          pattern: '^(\w{3}){1}$'
          example: CAN
          description: Pais de issuance do type de document provided. Código do pais de agreement com o code alpha3 do ISO-3166
        expirationDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: 'Data vigência do type de  document provided, according to specification RFC-3339.'
    CustomersPartiesParticipation:
      type: object
      description: |
        Lista relativa às informtion das partes envolvidas, como: sócio e /ou administrador
      required:
        - type
        - personType
        - documentType
        - documentNumber
      properties:
        personType:
          type: string
          enum:
            - PESSOA_NATURAL
            - PESSOA_JURIDICA
          description: Indica se a pessoa da parte envolvida é uma natural person ou juridica
        type:
          type: string
          description: |
            Indica o perfil de atuação na empresa. Vide Enum
            O administrador é o responsible por desempenhar all as functions administrativas da empresa. É ele quem conduz o dia a dia do negócio, assinando documents, respondendo legalmente pela sociedade, realizando loans e other ações gerenciais. Apesar de estar na linha de frente da empresa, ele é denominado sócio por also have sua installment de participação no Capital Social.
            Sócio not tem qualquer envolvimento nas atividades administrativas da sociedade.
          enum:
            - SOCIO
            - ADMINISTRADOR
        civilName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Juan Kaique Cláudio Fernandes
          description: |
            Nome civil completo da natural person (Direito fundamental da pessoa, o name civil é aquele assigned à natural person desde o registro de seu birth, com o qual beá identified por toda a sua vida, bem como after a sua morte).

            Caso o name civil provided exceda o limit de 70 caracteres, must be held o primeiro e o último name completos, realizando abreviação progressiva dos names intermediários (reduzindo-os às respectivas iniciais, seguidas de ponto), up to que o name se ajuste ao limit defined.
            Persistindo excesso after a abreviação de all os intermediários, aplicar truncamento simples ao final do field para respeitar o limit maximum. Não utilizar reticências.

            [Restrição] O field civilName must be necessarily filled when personType for PESSOA_NATURAL.
        socialName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Karina
          description: |
            Nome social da natural person, se houver. (aquele pelo qual travestis e transexuais se reconhecem, bem como are identifieds por sua comunit e em seu meio social, according to Decreto Local).
        companyName:
          type: string
          maxLength: 144
          pattern: '[\w\W\s]*'
          example: Luiza e Benjamin Assessoria Jurídica Ltda
          description: |
            Razão social da empresa queryda é o termo registrado sob o qual uma legal entity (PJ) se individualiza e exerce suas atividades. Também pode be chamada por denomination social ou firma empresarial

            [Restrição] o field companyName must be necessarily filled when personType for PESSOA_JURIDICA.
        tradeName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Mundo da Eletronica
          description: 'Nome fantasia da legal entity, se houver. (É o name popular da empresa, utilizado para divulgação da empresa e melhor fixedção com o public). De completion required se houver'
        startDate:
          type: string
          maxLength: 20
          format: date-time
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2021-05-21T08:30:00Z'
          description: 'Data de início da participação, according to specification RFC-3339.'
        shareholding:
          type: string
          format: double
          maxLength: 8
          minLength: 8
          pattern: '^[01]\.\d{6}$'
          example: '0.510000'
          description: |
            Percentual de participação societária (provide com 6 decimal places decimal places). O Sócio só must be provided se sua participação societária for igual ou superior a 25%. p.ex: 0.250000 (Este value  represents 25%. O value '1 'represents 100%).

            [Restrição]: Campo required if o type for igual a SOCIO e este tiver participação societária maior que 25%.
        documentType:
          $ref: '#/components/schemas/CustomersEnumPartiesParticipationDocumentType'
        documentNumber:
          type: string
          maxLength: 20
          pattern: '[\w\W\s]*'
          example: '73677831148'
          description: Número do document provided. Campo Texto Livre para fill number e digit do document se houver
        documentAdditionalInfo:
          type: string
          maxLength: 100
          pattern: '[\w\W\s]*'
          example: CNH
          description: 'Campo livre, de completion required when o document provided tiver informtion complementares relevantes para a sua identifiestion'
        documentCountry:
          type: string
          maxLength: 3
          pattern: '[\w\W\s]*'
          example: CAN
          description: |
            País de issuance do document. Código do pais de agreement com o code alpha3 do ISO-3166.
        documentExpirationDate:
          type: string
          format: date
          maxLength: 10
          example: '2021-05-21'
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          description: 'Data de validade do document provided, according to specification RFC-3339.'
        documentIssueDate:
          type: string
          maxLength: 10
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: 'Data de issuance do document, according to specification RFC-3339.'
    CustomersEnumPartiesParticipationDocumentType:
      type: string
      enum:
        - CPF
        - PASSAPORTE
        - OUTRO_DOCUMENTO_VIAGEM
        - CNPJ
      description: |
        Tipo do document provided.
    CustomersBusinessContacts:
      type: object
      description: Conjunto de informtion related tos às forms para accounttar o customer.
      required:
        - postalAddresses
        - phones
        - emails
      properties:
        postalAddresses:
          type: array
          items:
            $ref: '#/components/schemas/CustomersBusinessPostalAddress'
          minItems: 0
          description: Lista de addresss da legal entity
        phones:
          type: array
          items:
            $ref: '#/components/schemas/CustomersCustomerPhone'
          minItems: 0
          description: Lista com phones de accountto da legal entity
        emails:
          type: array
          items:
            $ref: '#/components/schemas/CustomersCustomerEmail'
          minItems: 0
          description: Lista e-mails de accountto
    CustomersBusinessPostalAddress:
      type: object
      required:
        - isMain
        - townName
        - country
        - countryCode
      properties:
        isMain:
          type: boolean
          example: true
          description: Indica se o address provided é o principal
        address:
          type: string
          maxLength: 150
          minLength: 2
          pattern: '^[\w\W\s]*$'
          example: 'Av Naburo Ykesaki, 1270'
          description: |
            Corresponde ao address commercial do customer.
        additionalInfo:
          type: string
          maxLength: 30
          pattern: '[\w\W\s]*'
          example: Fundos
          description: Alguns logradouros ainda necessitam be especificados por meio de complement
        districtName:
          type: string
          maxLength: 50
          pattern: '[\w\W\s]*'
          example: Centro
          description: |
            Bairro é uma comunit ou região localizada em uma city ou municipality de agreement com as suas subdivisões geográficas. Preenchimento required, se houver.
        townName:
          type: string
          maxLength: 50
          pattern: '^[\w\W\s]*$'
          minLength: 2
          example: Marília
          description: |
            Localidade: O name da localidade corresponds à designação da city ou municipality no qual o address is localizado.
        ibgeTownCode:
          type: string
          pattern: '\d{7}$'
          maxLength: 7
          example: '3550308'
          description: 'Código IBGE de Município. A Tabela de Códigos de Municípios do IBGE apresenta a list dos municipalitys brasileiros associados a um code composed de 7 digits, sendo os dois primeiros related tos ao code da Unidade da Federação.'
        countrySubDivision:
          $ref: '#/components/schemas/CustomersEnumCountrySubDivision'
        postCode:
          type: string
          pattern: '^\d{8}$'
          maxLength: 8
          example: '17500001'
          description: |
            Código de Endereçamento Postal: Composto por um set numérico de oito digits, o objetivo principal do CEP é orientar e acelerar o encaminhamento, o tratamento e a entrega de objetos postados nos Correios, por meio da sua atribuição a localidades, logradouros, units dos Correios, beviços, órgãos publics, empresas e edifícios. p.ex. '01311000'
        country:
          type: string
          maxLength: 80
          pattern: '[\w\W\s]*'
          example: Brasil
          description: Nome do country
        countryCode:
          type: string
          maxLength: 3
          pattern: '^([A-Z]{3})$'
          example: BRA
          description: Código do pais de agreement com o code alpha3 do ISO-3166
        geographicCoordinates:
          $ref: '#/components/schemas/CustomersGeographicCoordinates'
    CustomersBusinessQualificationData:
      type: object
      description: 'Objeto que reúne as informtion relativas ao process de qualification. Considera-se qualification as informtion que permitam as institutions apreciar, avaliar, caracterizar e classificar o customer com a purpose de conhecer o seu perfil de risco e sua capacity econômico-financeira'
      required:
        - updateDateTime
      properties:
        updateDateTime:
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
          description: |
            Data e time da update dos fields \<_endpoint_\>, according to specification RFC-3339, formt UTC. Quando not existente uma date vinculada especificamente ao bloco, assumir a date e time de update do registration como um todo.
        economicActivities:
          type: array
          items:
            $ref: '#/components/schemas/CustomersEconomicActivity'
          minItems: 0
          description: 'Lista dos demais codes relativos às demais atividades econômicas da empresa, according to standard CNAE (Classificação Nacional de Atividades Econômicas). De completion required, se houver'
        informedRevenue:
          $ref: '#/components/schemas/CustomersInformedRevenue'
        informedPatrimony:
          $ref: '#/components/schemas/CustomersBusinessInformedPatrimony'
    CustomersEconomicActivity:
      type: object
      required:
        - code
        - isMain
      properties:
        code:
          type: string
          pattern: '^\d{7}$'
          description: |
            Traz o code do ramo da atividade principal da empresa queryda, according to standard CNAE (Classificação Nacional de Atividades Econômicas)

            [Obbevação] O field sempre must be sent com 7 caracteres, seguindo a classification “CNAE-Subclasse 2.3”. Em ifs em que o value inicie com zeros, ele must conter all os caracteres, includesndo os zeros.
          example: '0600001'
        isMain:
          type: boolean
          description: 'Indica se é o ramo principal de atividade da empresa when true e se é o ramo secundário when false. [Restrição] Somente uma ocorrência relativa ao code da atividade econômica principal must trazer o value true.'
          example: true
    CustomersInformedRevenue:
      type: object
      required:
        - amount
      properties:
        frequency:
          $ref: '#/components/schemas/CustomersEnumInformedRevenueFrequency'
        frequencyAdditionalInfo:
          type: string
          maxLength: 100
          pattern: '[\w\W\s]*'
          example: Informações adicionais
          description: |
            Texto livre para complementar informtion relativa ao patrimonio.

            [Restrição] Preencher when frequency for igual OUTROS.
        amount:
          $ref: '#/components/schemas/CustomersInformedRevenueAmount'
        year:
          type: number
          maximum: 9999
          example: 2010
          description: 'Ano de reference da Renda, according to specification RFC-3339.'
    CustomersEnumInformedRevenueFrequency:
      type: string
      description: |
        Traz a frequência ou period do billmento provided.
        "O billmento é calculado a partir de all os benefícios que a empresa conseguiu com sua atividade econômica em um determined period. Esses benefícios are os rendimentos ou ganhos da organização through de suas vendas ou beviços prstates".
      enum:
        - DIARIA
        - SEMANAL
        - QUINZENAL
        - MENSAL
        - BIMESTRAL
        - TRIMESTRAL
        - SEMESTRAL
        - ANUAL
        - OUTROS
      example: DIARIA
    CustomersInformedRevenueAmount:
      type: object
      required:
        - amount
        - currency
      description: Valor do assets provided
      properties:
        amount:
          description: |
            Valor do assets provided. Expresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places.
            Patrimônio é o set de bens vinculado a uma pessoa ou a uma entidade.
          type: string
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '100000.0400'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
          example: BRL
    CustomersBusinessInformedPatrimony:
      type: object
      required:
        - amount
        - date
      properties:
        amount:
          $ref: '#/components/schemas/CustomersInformedPatrimonyAmount'
        date:
          type: string
          format: date
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: 'Data de reference do Patrimônio, according to specification RFC-3339.'
    CustomersBusinessFinancialRelationData:
      type: object
      description: 'Objeto que reúne as informtion relativas ao relacionamento do customer junto à Instituição. Considera-se relacionamento as informtion que permitam conhecer desde when a pessoa queryda é customer da institution, bem como um indicador dos products e beviços que ela consome atualmente e seus representsntes'
      required:
        - updateDateTime
        - startDate
        - productsServicesType
        - procurators
        - accounts
      properties:
        updateDateTime:
          type: string
          format: date-time
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2020-07-21T08:30:00Z'
          description: |
            Data e time da update dos fields \<_endpoint_\>, according to specification RFC-3339, formt UTC. Quando not existente uma date vinculada especificamente ao bloco, assumir a date e time de update do registration como um todo.
        startDate:
          type: string
          format: date-time
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2020-07-21T08:30:00Z'
          description: Data de início de relacionamento com a Instituição Financeira. Deve trazer o menor value entre a informtion reportada ao BACEN pelo DOC 3040 e CCS.
        productsServicesType:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: '#/components/schemas/CustomersEnumProductServiceType'
        procurators:
          type: array
          items:
            $ref: '#/components/schemas/CustomersBusinessProcurator'
          minItems: 0
          description: Lista dos representsntes. De completion required se houver representsnte.
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/CustomersBusinessAccount'
          minItems: 0
          description: |
            Lista de accounts deposit à vista, savings e payment prepaids held pelo customer na date-transmitting institution.
    CustomersBusinessProcurator:
      type: object
      required:
        - type
        - cnpjCpfNumber
        - civilName
      properties:
        type:
          type: string
          enum:
            - REPRESENTANTE_LEGAL
            - PROCURADOR
          description: |
            Tipo de representsnte.
            Representante legal - Nome Civil completo da Pessoa Natural que represent uma entidade ou uma empresa e é nameado em seu ato constitutivo, ou be, no contract social ou estatuto social.
            Procurador - é qualquer pessoa que represent a Pessoa Natural em algum negócio, mediante authorization escrita do same.
          example: PROCURADOR
        cnpjCpfNumber:
          type: string
          maxLength: 14
          pattern: '^([0-9]{11}|[0-9A-Z]{12}[0-9]{2})$'
          example: '73677831148'
          description: Identificação do Representante Legal ou Procurador. Registro do registration na Receita Federal (Preencher com CPF ou CNPJ sem formtting).
        civilName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Elza Milena Stefany Teixeira
          description: |
            Nome civil completo da natural person (Direito fundamental da pessoa, o name civil é aquele assigned à natural person desde o registro de seu birth, com o qual beá identified por toda a sua vida, bem como after a sua morte).

            Caso o name civil provided exceda o limit de 70 caracteres, must be held o primeiro e o último name completos, realizando abreviação progressiva dos names intermediários (reduzindo-os às respectivas iniciais, seguidas de ponto), up to que o name se ajuste ao limit defined.
            Persistindo excesso after a abreviação de all os intermediários, aplicar truncamento simples ao final do field para respeitar o limit maximum. Não utilizar reticências.
        socialName:
          type: string
          maxLength: 70
          pattern: '[\w\W\s]*'
          example: Stefany Teixeirass
          description: |
            Nome social da natural person, se houver.
            bem como are identifieds por sua comunit e em seu meio social, according to Decreto Local.
    CustomersBusinessAccount:
      type: object
      required:
        - compeCode
        - number
        - checkDigit
        - type
      properties:
        compeCode:
          type: string
          maxLength: 3
          pattern: '^\d{3}$'
          description: 'Código identifier assigned pelo Banco Central do Brasil às institutions participants do STR (Sistema de Transferência de rebevas).O Compe (Sistema de Compensação de Cheques e Outros Papéis) é um sistema que identifies e processa as compensações banks. Ele é representsdo por um code de três digits que beve como identifier de bancos, sendo assim, cada institution bank has um number exclusive'
          example: '001'
        branchCode:
          type: string
          maxLength: 4
          pattern: '^\d{4}$'
          description: |
            Código da Agência detentora da account. (Agência é a dependência destinada ao atendimento aos customers, ao public em geral e aos associados de cooperativas de credit, no exercício de atividades da institution, not podendo be móvel ou transitória)
            [Restrição] Obrigatoriamente must be filled when o field "type" for diferente de account prepaid.
          example: '6272'
        number:
          type: string
          maxLength: 20
          pattern: '^\d{8,20}$'
          description: |
            Número da account
          example: '24550245'
        checkDigit:
          type: string
          maxLength: 1
          pattern: '[\w\W\s]*'
          description: |
            Dígito da account
          example: '4'
        type:
          $ref: '#/components/schemas/CustomersEnumAccountTypeCustomers'
    CreditCardsAccountsAccountPaymentMethod:
      description: Conjunto de informtion relativas aos Meios de Pagamento da Account de payment postpaid
      properties:
        identificationNumber:
          description: 'Número de identifiestion do card: corresponds aos 4 last digits do card para natural person, ou então, fill com um identifier para legal entity, com as características defined para os IDs no Open Finance.

            '
          example: '4453'
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        isMultipleCreditCard:
          description: 'Indica se o Cartão de credit associado à account payment postpaid é múltiplo ou not. Cartões denominados múltiplos possuem tanto a function credit quanto a function débito, mustndo o proprietário do card, no momento de sua use, provide se o payment é na function credit (que leva a um payment futuro, por meio de uma bill do card de credit) ou na function débito.

            '
          example: true
          type: boolean
      required:
      - identificationNumber
      - isMultipleCreditCard
      type: object
    CreditCardsAccountsAvailableAmount:
      description: "Valor available do limit provided   \n"
      properties:
        amount:
          description: 'Valor available do limit provided expresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places.


            [Restrição] O campo é obrigatório caso isLimitFlexible for igual a false.

            '
          example: '1000.0400'
          format: double
          maxLength: 21
          minLength: 4
          pattern: ^-?\d{1,15}\.\d{2,4}$
          type: string
        currency:
          description: "Moeda related to ao limit provided, according to modelo ISO-4217. p.ex. 'BRL.'\nTodos os balances provideds are representsdos com a currency vigente do Brasil.  \n\n[Restrição] O field é required if isLimitFlexible for igual a false.\n"
          example: BRL
          maxLength: 3
          pattern: ^[A-Z]{3}$
          type: string
      type: object
    CreditCardsAccountsBillMinimumAmount:
      description: 'Valor do payment minimo da bill

        '
      properties:
        amount:
          description: Valor do payment minimo da bill
          example: '1000.0400'
          format: double
          maxLength: 20
          minLength: 4
          pattern: ^\d{1,15}\.\d{2,4}$
          type: string
        currency:
          description: Moeda related to ao value monetary, seguindo o modelo ISO-4217.
          example: BRL
          maxLength: 3
          pattern: ^[A-Z]{3}$
          type: string
      required:
      - amount
      - currency
      type: object
    CreditCardsAccountsBillTotalAmount:
      description: 'Valor total da bills.

        O campo deve assumir valor positivo para saldo devedor e negativo para saldo credor.

        '
      properties:
        amount:
          description: Valor total da bills. Expresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places.
          example: '1000.0400'
          format: double
          maxLength: 21
          minLength: 4
          pattern: ^-?\d{1,15}\.\d{2,4}$
          type: string
        currency:
          description: Moeda related to ao value monetary, seguindo o modelo ISO-4217.
          example: BRL
          maxLength: 3
          pattern: ^[A-Z]{3}$
          type: string
      required:
      - amount
      - currency
      type: object
    CreditCardsAccountsBillsData:
      description: Conjunto das informtion related tos a list de bills associadas à account de payment postpaid
      properties:
        billClosingDate:
          description: date de fechamento da Fatura
          example: '2021-05-21'
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          type: string
        billId:
          description: Código single e immutable que identifies a bill.
          example: 3459087XXZTR
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        billMinimumAmount:
          $ref: '#/components/schemas/CreditCardsAccountsBillMinimumAmount'
        billTotalAmount:
          $ref: '#/components/schemas/CreditCardsAccountsBillTotalAmount'
        dueDate:
          description: Data de due date da Fatura, que aparece para payment pelo customer
          example: '2021-05-21'
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          type: string
        financeCharges:
          description: Lista dos encargos cobrados na bill
          items:
            $ref: '#/components/schemas/CreditCardsAccountsBillsFinanceCharge'
          minItems: 1
          type: array
        isInstalment:
          description: Indica se a bill allows installmentmento (true) ou not (false).
          example: false
          type: boolean
        payments:
          description: 'Lista que traz os values relativos aos payments da Fatura da account de payment postpaid.

            Pagamentos efetuados a partir do momento que uma nova fatura é fechada e exposta, devem estar listados na fatura fechada, até que haja um novo fechamento.

            '
          items:
            $ref: '#/components/schemas/CreditCardsAccountsBillsPayment'
          minItems: 0
          type: array
      required:
      - billId
      - dueDate
      - billClosingDate
      - billTotalAmount
      - billMinimumAmount
      - isInstalment
      - payments
      type: object
    CreditCardsAccountsBillsFinanceCharge:
      properties:
        additionalInfo:
          description: Campo livre, de completion required se selecionado type de encargo 'OUTROS'
          example: Informações Adicionais
          maxLength: 140
          pattern: '[\w\W\s]*'
          type: string
        amount:
          description: Valor cobrado pelo encargo. Expresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places.
          example: '100000.0400'
          format: double
          maxLength: 20
          minLength: 4
          pattern: ^\d{1,15}\.\d{2,4}$
          type: string
        currency:
          description: "Moeda related to ao value cobrado pelo encargo, according to modelo ISO-4217. p.ex. 'BRL' \nTodos os balances provideds are representsdos com a currency vigente do Brasil.\n"
          example: BRL
          maxLength: 3
          pattern: ^(\w{3}){1}$
          type: string
        type:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsFinanceChargeType'
      required:
      - type
      - amount
      - currency
      type: object
    CreditCardsAccountsBillsPayment:
      properties:
        amount:
          description: "Valor payment according to o valueType.  \nExpresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places.   \nO field not pode assumir value negativo por se tratar de um payment.\n"
          example: '1000.0400'
          format: double
          maxLength: 20
          minLength: 4
          pattern: ^\d{1,15}\.\d{2,4}$
          type: string
        currency:
          description: 'Moeda related to ao value de payment da bill, according to modelo ISO-4217. p.ex. ''BRL'' Todos os values provideds are representsdos com a currency vigente do Brasil

            '
          example: BRL
          maxLength: 3
          pattern: ^(\w{3}){1}$
          type: string
        paymentDate:
          description: Data efetiva de when o Pagamento da bill foi realizado
          example: '2021-05-21'
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          type: string
        paymentMode:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsPaymentMode'
        valueType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsBillingValueType'
      required:
      - valueType
      - paymentDate
      - paymentMode
      - amount
      - currency
      type: object
    CreditCardsAccountsBillsTransactions:
      description: Lista que traz os values relativos aos balances do Limite de credit total da account de payment postpaid
      properties:
        amount:
          $ref: '#/components/schemas/CreditCardsAccountsTransactionAmountBills'
        billId:
          description: Código single e immutable que identifies a bill onde consta a transaction informda.
          example: MTU0OTU1NjI2NTk4OTRmc2ZhZDRmc2Q1NmZkM
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        billPostDate:
          description: 'Data em que a transaction foi inbeida na bill.

            '
          example: '2021-05-21'
          format: date
          maxLength: 20
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          type: string
        brazilianAmount:
          $ref: '#/components/schemas/CreditCardsAccountsTransactionBrazilianAmountBills'
        chargeIdentificator:
          description: 'Número da installment que is sendo informda.


            [Restrição] Preenchimento obrigatório se Tipo de Pagamento (paymentType) selecionada for ''A_PRAZO''.

            '
          example: 12
          format: integer
          maximum: 999
          minimum: 1
          type: number
        chargeNumber:
          description: "Quantidade de installments.   \n[Restrição] O field must be filled when houverem installments related a transaction.\n"
          example: 12
          format: integer
          maximum: 999
          type: number
        creditDebitType:
          $ref: '#/components/schemas/EnumCreditDebitIndicator'
        feeType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountFee'
        feeTypeAdditionalInfo:
          description: Campo livre, de completion required when selecionada type de tarifa "OUTRA"
          maxLength: 140
          pattern: ^\S[\s\S]*$
          type: string
        identificationNumber:
          description: 'Número de identifiestion do card: corresponds aos 4 last digits do card para PF, ou então, fill com um identifier para PJ, com as caracteristicas defined para os IDs no Open Finance.

            '
          example: '4453'
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        otherCreditsAdditionalInfo:
          description: 'Campo livre para completion de date adicionais de other types de credit contratados no card.


            [Restrição] Preenchimento obrigatório quando selecionado no campo outros tipos de crédito "OUTROS".

            '
          maxLength: 50
          pattern: ^\S[\s\S]*$
          type: string
        otherCreditsType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsOtherCreditType'
        payeeMCC:
          description: 'O MCC ou o code da category do estabelecimento commercial. Os MCCs are agrupados according to suas similaridades. O MCC é usado para classificar o negócio pelo type provided de bens ou beviços. Os MCCs are assigneds por type de comerciante (por exemplo, um para hotéis, um para lojas de materiais de escritório, etc.) ou por name de comerciante (por exemplo, 3000 para a United Airlines).


            [Restrição] Informação de envio obrigatório quando o valor do campo transactionType for igual a PAGAMENTO.

            '
          example: 5137
          format: integer
          maximum: 2147483647
          type: number
        paymentType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsPaymentType'
        transactionDateTime:
          description: "Data e time da transaction.   \n\nNas compras installmentdas, o `transactionDateTime` must be idêntico em all as installments. O field must necessarily refletir a informtion exibida ao customer nos canais digitais da institution, com preciare de date, time e minuto — same que a institution not exiba esse nível de granullridade em seus canais. Nesses ifs, os according tos e milisaccording tos podem be filleds com zero (0). Exemplo: 2024-01-29T11:15:00.000Z.\n"
          example: '2016-01-29T12:29:03.374Z'
          format: date-time
          maxLength: 24
          pattern: (^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)\.(?:[0-9]){3}Z$)
          type: string
        transactionId:
          description: "Código ou identifier single prstate pela institution que maintains a account para representsr a transaction individual. \nÉ esperado que o `transactionId` be single, immutable e isvel.\n"
          example: TXpRMU9UQTROMWhZV2xSU1FUazJSMDl
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        transactionName:
          description: Literal usada na institution financeira para identify a transaction. A informtion apresentada precisa be a mesma utilizada nos canais electronic da institution (extrato e bill).
          example: PGTO
          maxLength: 200
          pattern: '[\w\W\s]*'
          type: string
        transactionType:
          $ref: '#/components/schemas/EnumCreditCardTransactionType'
        transactionalAdditionalInfo:
          description: Campo livre, de completion required when selecionado type de transaction "OUTROS"
          maxLength: 140
          pattern: ^\S[\s\S]*$
          type: string
      required:
      - transactionId
      - identificationNumber
      - transactionName
      - creditDebitType
      - transactionType
      - brazilianAmount
      - amount
      - transactionDateTime
      - billPostDate
      type: object
    CreditCardsAccountsData:
