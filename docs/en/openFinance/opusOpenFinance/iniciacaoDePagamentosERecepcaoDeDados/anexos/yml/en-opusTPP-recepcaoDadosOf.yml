    FundsTransactionsData:
      type: object
      description: Informções da position do fundo de investment a que se refere investmentId.
      required:
        - transactionId
        - type
        - transactionType
        - transactionConversionDate
        - transactionQuotaPrice
        - transactionQuotaQuantity
        - transactionValue
        - transactionGrossValue
      properties:
        transactionId:
          type: string
          description: Código ou identifier single prstate pela institution que maintains a representstion individual do movimento na position do fundo.
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: ABCD2126019929279212650822221989319253344
        type:
          $ref: '#/components/schemas/FundsEnumTransactionsType'
        transactionType:
          $ref: '#/components/schemas/FundsEnumTransactionsTransactionType'
        transactionTypeAdditionalInfo:
          type: string
          description: |
            Informção adicional do type do reason, para completion no if de movements not delimitadas no domain.

            [Restrição] Campo de completion required pelas participants when o field 'transactionType' for filled com o value 'OUTROS'.
          maxLength: 100
          pattern: '[\w\W\s]*'
        transactionConversionDate:
          type: string
          format: date
          description: Data da conversion da transaction de movement do fundo de investment.
          maxLength: 10
          minLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2023-01-07'
        transactionQuotaPrice:
          type: object
          description: 'É o value da cota utilizada na conversion para a realização da movement do customer no fundo, according to a regra prevista em regulamento - value pode be negativo.'
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor related ao objeto.
              maxLength: 25
              pattern: '^-?\d{1,15}\.\d{2,8}$'
              example: '1000.04'
            currency:
              type: string
              description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        transactionQuotaQuantity:
          type: string
          format: double
          description: |
            Número de cotas convertidas na date da movement.
          maxLength: 24
          pattern: '^\d{1,15}\.\d{2,8}$'
          example: '42.25'
        transactionValue:
          type: object
          description: Valor solicitado pelo customer.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor related ao objeto.
              maxLength: 21
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              example: '1000.04'
            currency:
              type: string
              description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        transactionGrossValue:
          type: object
          description: |
