    BankFixedIncomesResponseInvestmentList:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            type: object
            description: Lista de securities de income fixed bank held pelo customer na date-transmitting institution e for which ele has provided consent
            required:
              - brandName
              - companyCnpj
              - investmentType
              - investmentId
            properties:
              brandName:
                type: string
                description: 'Nome da Marca reportada pelo participant no Open Finance. Recomenda-se utilizar, sempre que possible, o same name de marca assigned no field do directory Customer Friendly Server Name (Authorisation Server).'
                pattern: '^[^\s](.*[^\s])?$'
                example: Organização A
                maxLength: 80
              companyCnpj:
                type: string
                description: 'Registro completo do CNPJ da institution responsible pelo Cadastro - o CNPJ corresponds a representstion alphanumeric da registration no Cadastro de Pessoa Jurídica. Deve-se ter only os caracteres do CNPJ, sem mask.'
                maxLength: 14
                pattern: '^[0-9A-Z]{12}[0-9]{2}$'
                example: '21281590001660'
              investmentType:
                $ref: '#/components/schemas/BankFixedIncomesEnumInvestmentType'
              investmentId:
                type: string
                description: 'Identifica de form single  o relacionamento do customer com o product, mantendo as regras de imutabilidade dentro da date-transmitting institution.'
                maxLength: 100
                pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
                example: '92792126019929200000000000000000000000000'
            additionalProperties: false
        links:
          $ref: '#/components/schemas/BankFixedIncomesLinks'
        meta:
          $ref: '#/components/schemas/BankFixedIncomesMeta'
      additionalProperties: false
    BankFixedIncomesResponseProductIdentification:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          $ref: '#/components/schemas/BankFixedIncomesIdentifyProduct'
        links:
          $ref: '#/components/schemas/BankFixedIncomesLinks'
        meta:
          $ref: '#/components/schemas/BankFixedIncomesMeta'
      additionalProperties: false
    BankFixedIncomesIdentifyProduct:
      type: object
      required:
        - issuerInstitutionCnpjNumber
        - investmentType
        - remuneration
        - issueUnitPrice
        - dueDate
        - issueDate
        - purchaseDate
        - gracePeriodDate
      properties:
        issuerInstitutionCnpjNumber:
          type: string
          description: CNPJ da institution emissora.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '11225860000140'
        isinCode:
          type: string
          description: |
            Código ISIN da issuance, Código ISIN do product, Código da emissora (field optional): code universal que identifies cada value securities ou instrumento financeiro, according to Norma ISO 6166
          maxLength: 12
          minLength: 12
          pattern: '^[A-Z]{2}([A-Z0-9]){9}\d{1}$'
          example: BRCST4CTF001
        investmentType:
          $ref: '#/components/schemas/BankFixedIncomesEnumInvestmentType'
        remuneration:
          $ref: '#/components/schemas/BankFixedIncomesRemuneration'
        issueUnitPrice:
          type: object
          description: Preço unit de issuance do title.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              maxLength: 24
              pattern: '^\d{1,15}\.\d{2,8}$'
              example: '1000.000004'
              description: Valor related ao objeto.
            currency:
              $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
        dueDate:
          type: string
          format: date
          maxLength: 10
          minLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
          description: Data de due date do title.
        issueDate:
          type: string
          format: date
          maxLength: 10
          minLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-16'
          description: Data de issuance do title.
        clearingCode:
          type: string
          maxLength: 30
          pattern: '[\w\W-]*'
          example: CDB421GPXXX
          description: Código de registro do ativo na clearing.
        purchaseDate:
          type: string
          format: date
          maxLength: 10
          minLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
          description: Data de acquisition do customer.
        gracePeriodDate:
          type: string
          format: date
          maxLength: 10
          minLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-16'
          description: Data up to a qual o customer not may resgatar antecipadamente seu investment.
      additionalProperties: false
    BankFixedIncomesEnumInvestmentType:
      type: string
      description: 'Especificação do ativo em quare (CDB, RDB, LCI ou LCA)'
      enum:
        - CDB
        - RDB
        - LCI
        - LCA
      example: CDB
    BankFixedIncomesRemuneration:
      type: object
      description: Objeto para details de compensation do titulo.
      required:
        - rateType
        - ratePeriodicity
        - calculation
        - indexer
      properties:
        preFixedRate:
          type: string
          format: double
          pattern: '^-?\d{1}\.\d{6}$'
          maxLength: 9
          minLength: 8
          example: '0.300000'
          description: |
            Taxa de compensation pré fixedda de issuance do title. p.ex. 0.014500.

            [Restrição] Campo de completion required pelas participants when houver 'PRE_FIXADO' no field 'indexer' ou when se tratar de product com compensation híbrida.
        postFixedIndexerPercentage:
          type: string
          format: double
          pattern: '^-?\d{1}\.\d{6}$'
          maxLength: 9
          minLength: 8
          example: '1.100000'
          description: |
            Percentual do indexador post fixeddo de issuance do title. p.ex. 0.014500.

            [Restrição] Campo de completion required pelas participants when o field 'indexer' for filled de form diferente de 'PRE_FIXADO' ou when se tratar de product com compensation híbrida.
        rateType:
          $ref: '#/components/schemas/BankFixedIncomesEnumRateType'
        ratePeriodicity:
          $ref: '#/components/schemas/BankFixedIncomesEnumRatePeriodicity'
        calculation:
          $ref: '#/components/schemas/BankFixedIncomesEnumCalculation'
        indexer:
          $ref: '#/components/schemas/BankFixedIncomesEnumIndexer'
        indexerAdditionalInfo:
          type: string
          description: |
            Informções adicionais do indexador

            [Restrição] Campo de completion required pelas participants when houver 'Outros' no field 'indexer'.
          maxLength: 50
          example: Dólar
          pattern: '[\w\W\s]*'
      additionalProperties: false
    BankFixedIncomesEnumRateType:
      type: string
      description: 'Tipo da rate de compensation (linear ou exponencial)'
      enum:
        - LINEAR
        - EXPONENCIAL
      example: LINEAR
    BankFixedIncomesEnumRatePeriodicity:
      type: string
      description: 'Periodicity da rate de compensation (monthly, annual, diário, semestral)'
      enum:
        - MENSAL
        - ANUAL
        - DIARIO
        - SEMESTRAL
      example: MENSAL
    BankFixedIncomesEnumCalculation:
      type: string
      description: 'Base de calculation (days úteis ou days corridos)'
      enum:
        - DIAS_UTEIS
        - DIAS_CORRIDOS
      example: DIAS_CORRIDOS
    BankFixedIncomesEnumIndexer:
      type: string
      description: 'Índice utilizado como reference para a correção da rentabilidade e/ou rendimentos do ativo (CDI, DI , TR, IPCA, IGP_M, IGP_DI, INPC, BCP, TLC, SELIC, PRE_FIXADO e OUTROS)'
      enum:
        - CDI
        - DI
        - TR
        - IPCA
        - IGP_M
        - IGP_DI
        - INPC
        - BCP
        - TLC
        - SELIC
        - PRE_FIXADO
        - OUTROS
      example: CDI
    BankFixedIncomesCurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      maxLength: 3
      description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
      example: BRL
    BankFixedIncomesLinks:
      type: object
      description: Referências para other recusos da API requisitada.
