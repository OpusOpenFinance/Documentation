      description: Valor do investment atualizado na date de reference, posterior a deduction de impostos (IOF e IR) e rate de output, if a institution considere este value na composition do balance net. Este value considera o value blocked (blockedAmount).
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          format: double
          description: Valor related ao objeto.
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          example: '1000.04'
        currency:
          type: string
          description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          example: BRL
    FundsBalancesQuotaGrossPriceValue:
      type: object
      description: Valor bruto da cota atualizado na date de reference.
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          format: double
          description: Valor related ao objeto.
          pattern: '^-?\d{1,15}\.\d{2,8}$'
          maxLength: 25
          example: '1000.04'
        currency:
          type: string
          description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          example: BRL
