          $ref: '#/components/schemas/AccountsMetaOnlyRequestDateTime'
    AccountsAccountData:
      type: object
      required:
        - brandName
        - companyCnpj
        - type
        - compeCode
        - number
        - accountId
      properties:
        brandName:
          type: string
          description: 'Nome da Marca reportada pelo participant no Open Finance. Recomenda-se utilizar, sempre que possible, o same name de marca assigned no field do directory Customer Friendly Server Name (Authorisation Server).'
          maxLength: 80
          pattern: '[\w\W\s]*'
          example: Organização A
        companyCnpj:
          type: string
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          description: 'Registro completo do CNPJ da institution responsible pelo Cadastro - o CNPJ corresponds a representstion alphanumeric da registration no Cadastro de Pessoa Jurídica. Deve-se ter only os caracteres do CNPJ, sem mask.'
          example: '21128159000166'
        type:
          $ref: '#/components/schemas/EnumAccountType'
        compeCode:
          type: string
          description: 'Código identifier assigned pelo Banco Central do Brasil às institutions participants do STR (Sistema de Transferência de rebevas).O Compe (Sistema de Compensação de Cheques e Outros Papéis) é um sistema que identifies e processa as compensações banks. Ele é representsdo por um code de três digits que beve como identifier de bancos, sendo assim, cada institution bank has um number exclusive'
          pattern: '^\d{3}$'
          maxLength: 3
          example: '001'
        branchCode:
          type: string
          description: |
            Código da Agência detentora da account. (Agência é a dependência destinada ao atendimento aos customers, ao public em geral e aos associados de cooperativas de credit, no exercício de atividades da institution, not podendo be móvel ou transitória)

            [Restrição] Obrigatoriamente must be filled when o field "type" for diferente de CONTA_PAGAMENTO_PRE_PAGA.
          pattern: '^\d{4}$'
          maxLength: 4
          example: '6272'
        number:
          type: string
          description: Número da account
          pattern: '^\d{8,20}$'
          maxLength: 20
          example: '94088392'
        checkDigit:
          type: string
          description: |
            Dígito da account

            [Restrição] Obrigatoriamente must be filled when o field `type` for diferente de account prepaid. Nos ifs em que a account prepaid possua digit, o submission é required.
          pattern: '[\w\W\s]*'
          maxLength: 1
          example: '4'
        accountId:
          type: string
          description: 'Identifica de form single  a account do customer, mantendo as regras de imutabilidade dentro da date-transmitting institution.'
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          maxLength: 100
          minLength: 1
          example: '92792126019929279212650822221989319252576'
    AccountsAccountIdentificationData:
      type: object
      description: |
        Conjunto dos atributos que caracterizam as Accounts de: deposit à vista, savings e de payment prepaid
      required:
        - compeCode
        - number
        - type
        - subtype
        - currency
      properties:
        compeCode:
          type: string
          maxLength: 3
          pattern: '^\d{3}$'
          description: 'Código identifier assigned pelo Banco Central do Brasil às institutions participants do STR (Sistema de Transferência de rebevas). O number-code substituiu o antigo code COMPE. Todos os participants do STR, exceto as Infrastructures do Mercado Financeiro (IMF) e a Secretaria do Tesouro Nacional, possuem um number-code independentemente de participarem da Centralizadora da Compensação de Cheques (Compe).'
          example: '001'
        branchCode:
          type: string
          maxLength: 4
          pattern: '^\d{4}$'
          description: |
            Código da Agência detentora da account. (Agência é a dependência destinada ao atendimento aos customers, ao public em geral e aos associados de cooperativas de credit, no exercício de atividades da institution, not podendo be móvel ou transitória)

            [Restrição] Obrigatoriamente must be filled when o field "type" for diferente de account prepaid.
          example: '6272'
        number:
          type: string
          maxLength: 20
          pattern: '^\d{8,20}$'
          description: |
            Número da account
          example: '24550245'
        checkDigit:
          type: string
          maxLength: 1
          pattern: '[\w\W\s]*'
          description: |
            Dígito da account.

            [Restrição] Obrigatoriamente must be filled when o field "type" for diferente de account prepaid. Nos ifs em que a account prepaid possua digit, o submission é required
          example: '4'
        type:
          $ref: '#/components/schemas/EnumAccountType'
        subtype:
          $ref: '#/components/schemas/AccountsEnumAccountSubType'
        currency:
          type: string
          pattern: '^(\w{3}){1}$'
          maxLength: 3
          description: |
            Moeda related to ao value da transaction, according to modelo ISO-4217. p.ex. 'BRL'
            Todos os balances provideds are representsdos com a currency vigente do Brasil
          example: BRL
    AccountsAccountBalancesData:
      type: object
      description: |
        Conjunto de informtion das Accounts de: deposit à vista, savings e de payment prepaid
      required:
        - availableAmount
        - blockedAmount
        - automaticallyInvestedAmount
        - updateDateTime
      properties:
        availableAmount:
          $ref: '#/components/schemas/AccountsAccountBalancesDataAvailableAmount'
        blockedAmount:
          $ref: '#/components/schemas/AccountsAccountBalancesDataBlockedAmount'
        automaticallyInvestedAmount:
          $ref: '#/components/schemas/AccountsAccountBalancesDataAutomaticallyInvestedAmount'
        updateDateTime:
          type: string
          format: date-time
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2021-05-21T08:30:00Z'
          description: |
            Data e time da last update do balance. É esperado que a institution informe a last vez que capturou o balance para compartilhamento no Open Finance. Dessa form, é possible que:
            - Caso a institution capture date de form síncrona essa informtion be de poucos momentos;
            - Caso a institution capture date de form assíncrona essa informtion be de times ou days no passado;
            - Quando not existente uma date vinculada especificamente ao bloco, se assume a date e time de update do registration como um todo.

            De toda form, é preciso continuar respeitando o term maximum de tempestividade da API de Accounts.
        hasReservedBalance:
          type: boolean
          description: |
            Inform se o customer has um balance rebevado. Caso o customer possua rebevas de balance ativas, inclusive nos ifs de balance zerado, o value sent must be `TRUE`.
            Caso o customer not possua o product, must be `FALSE`. Se o field retornar `TRUE`, os date do balance rebevado se encontram no endpoint `GET /accounts/{accountId}/reserved-balances`

            [Restrição] Campo de submission required pela transmissora que oferta products de rebevas de balance atrelados à account.
            Este field refere-se exclusively a balances de rebeva que not are associados a investments.
            Produtos de investments must be reportados nas APIs de Investimentos.
          example: true
    AccountsAccountReservedBalancesData:
      type: array
      description: Lista de caixinhas/rebevas
      minItems: 0
      items:
        type: object
        required:
          - reservedIdentification
          - availableAmount
        properties:
          reservedName:
            type: string
            description: Nome dado pelo ube para a rebeva
            pattern: '^[^\s][\w\W\s]*[^\s]$'
            maxLength: 248
            minLength: 5
            example: Caixinha Paras Férias
          reservedIdentification:
            type: string
            description: Identificador single da rebeva
            format: uuid
            pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
            maxLength: 36
            minLength: 1
            example: d78fc4e5-37ca-4da3-adf2-9b082bf92280
          availableAmount:
            type: array
            description: Saldo que se encontra available na rebeva
            minLength: 1
            items:
              type: object
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  description: Valor related ao objeto.
                  format: double
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  maxLength: 20
                  minLength: 4
                  example: '1000.0400'
                currency:
                  type: string
                  description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
                  pattern: '^[A-Z]{3}$'
                  maxLength: 3
                  example: BRL
                remuneration:
                  type: object
                  description: Remuneração aplicada a rebeva
                  required:
                    - rateType
                    - indexer
                    - calculation
                    - ratePeriodicity
                  properties:
                    preFixedRate:
                      type: string
                      description: |
                        Taxa de compensation pré fixedda para a rebeva de balance. p.ex. 0.014500. O completion must respeitar as 6 decimal places decimal places, same que venham filled com zeros(representstion de porcentagem p.ex: 0.150000. Este value represents 15%. O value 1 represents 100%).

                        [Restrição] Campo de completion required pelas participants when field `postFixedIndexerPercentage` not for filled
                      format: double
                      pattern: '^\d{1}\.\d{6}$'
                      minLength: 8
                      maxLength: 8
                      example: '0.300000'
                    postFixedIndexerPercentage:
                      type: string
                      description: |
                        Percentual do indexador post fixeddo para a rebeva de balance. p.ex. 0.014500. O completion must respeitar as 6 decimal places decimal places, same que venham filled com zeros(representstion de porcentagem p.ex: 0.150000. Este value represents 15%. O value 1 represents 100%).

                        [Restrição] Campo de completion required pelas participants when field `preFixedRate` not for filled
                      format: double
                      pattern: '^\d{1}\.\d{6}$'
                      minLength: 8
                      maxLength: 8
                      example: '0.300000'
                    rateType:
                      type: string
                      description: Tipo da rate de compensation (linear ou exponencial)
                      enum:
                        - LINEAR
                        - EXPONENCIAL
                      example: LINEAR
                    indexer:
                      type: string
                      description: Índice utilizado como reference para compensation da rebeva
                      enum:
                        - CDI
                        - DI
                        - TR
                        - IPCA
                        - IGP_M
                        - IGP_DI
                        - INPC
                        - BCP
                        - TLC
                        - SELIC
                        - PRE_FIXADO
                        - OUTROS
                      example: CDI
                    calculation:
                      type: string
                      description: Base de calculation (days úteis ou days corridos)
                      enum:
                        - DIAS_UTEIS
                        - DIAS_CORRIDOS
                      example: DIAS_UTEIS
                    ratePeriodicity:
                      type: string
                      description: Periodicity da rate de compensation (monthly, annual, diário, semestral)
                      enum:
                        - MENSAL
                        - ANUAL
                        - DIARIO
                        - SEMESTRAL
                      example: MENSAL
                    indexerAdditionalInfo:
                      type: string
                      description: |
                        Informções adicionais do indexador

                        [Restrição] Campo de completion required pelas participants when houver `Outros` no field `indexer`
                      pattern: '[\w\W\s]*'
                      maxLength: 50
                      example: Dólar
    AccountsAccountOverdraftLimitsData:
      type: object
      description: |
        Conjunto de informtion da Account de: deposit à vista
      properties:
        overdraftContractedLimit:
          $ref: '#/components/schemas/AccountsAccountOverdraftLimitsDataOverdraftContractedLimit'
        overdraftUsedLimit:
          $ref: '#/components/schemas/AccountsAccountOverdraftLimitsDataOverdraftUsedLimit'
        unarrangedOverdraftAmount:
          $ref: '#/components/schemas/AccountsAccountOverdraftLimitsDataUnarrangedOverdraftAmount'
    AccountsAccountTransactionsData:
      type: object
      required:
        - transactionId
        - completedAuthorisedPaymentType
        - creditDebitType
        - transactionName
        - type
        - transactionAmount
        - transactionDateTime
      properties:
        transactionId:
          type: string
          description: |
            Código ou identifier single prstate pela institution que maintains a account para representsr a transaction individual.
            O ideal é que o `transactionId` be immutable.
            No entanto, o `transactionId` must obedecer, no minimum, as regras de imutabilidade propostas according to tabela “Data de imutabilidade por type de transaction” present nas orientações desta API.
          maxLength: 100
          minLength: 1
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: TXpRMU9UQTROMWhZV2xSU1FUazJSMDl
        completedAuthorisedPaymentType:
          $ref: '#/components/schemas/AccountsEnumCompletedAuthorisedPaymentIndicator'
        creditDebitType:
          $ref: '#/components/schemas/EnumCreditDebitIndicator'
        transactionName:
          type: string
          maxLength: 200
          pattern: '[\w\W\s]*'
          description: |
            Literal usada na institution financeira para identify a transaction.
            A informtion apresentada precisa be a mesma utilizada nos canais digitais da institution (assim como o histórico de transactions apresentado na tela do application ou do navegador).
            Caso a institution possua mais de um canal digital, a informtion compartilhada must be a do canal que apresenta a description mais completa possible da transaction.
            Em ifs onde a description da transaction é apresentada com múltiplas linhas, all as linhas must be enviadas (concatenadas) neste atributo, not sendo required a concatenação das informtion já enviadas em other atributos (ex: value, date) do same endpoint.
            Adicionalmente, o Banco Central pode determinar o formt de compartilhamento a be adotado por uma institution participant specific.
          example: Transferencia Enviada Lima Santos
        type:
          $ref: '#/components/schemas/AccountsEnumTransactionTypes'
        typeAdditionalInfo:
          type: string
          maxLength: 144
          pattern: '[\w\W\s]*'
          description: |
            Informções complementares para type de transaction.

            [Restrição] Este field é de submission required if o field `type` be defined como `OUTROS`.
          example: 'APLIC_FINANCEIRA'
        transactionAmount:
          $ref: '#/components/schemas/AccountsAccountTransactionsDataAmount'
        transactionDateTime:
          type: string
          maxLength: 24
          pattern: '(^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)\.(?:[0-9]){3}Z$)'
          description: |
            Data e time original da transaction que é informda nos canais digitais. Para lançamentos Futuros a date informda must be a date prevista de efetivação informda nos canais digitais. Caso a institution not saiba o horário certo da efetivação, os values time, minuto, according to e milisaccording to, podem be filleds com zero. Apost a efetivação da transaction, o field must be filled com a date e a time da efetivação da transaction.
          example: '2016-01-29T12:29:03.374Z'
        partieCnpjCpf:
          type: string
          maxLength: 14
          pattern: '^([0-9]{11}|[0-9A-Z]{12}[0-9]{2})$'
          description: |
            Identificação da pessoa envolvida na transaction: pagador ou recebedor (Preencher com o CPF ou CNPJ, sem formtting). Com a IN BCB nº 371, a partir de 02/05/23, o submission das informtion de identifiestion de contraparte tornou-se required para transactions de payment. Para maiores details, favor query a page `Orientações - Contas`.

            [Restrição] Quando o "type“ for filled com value FOLHA_PAGAMENTO e a transmissora for a responsible pelo payment de salary (banco-folha), o partieCnpjCpf provided must be do empregador related.
          example: '43908445778'
        partiePersonType:
          $ref: '#/components/schemas/EnumPartiePersonType'
        partieCompeCode:
          type: string
          maxLength: 3
          pattern: '^\d{3}$'
          description: |
            Código identifier assigned pelo Banco Central do Brasil às institutions participants do STR (Sistema de Transferência de rebevas) related to à pessoa envolvida na transaction. O number-code substituiu o antigo code COMPE. Todos os participants do STR, exceto as Infrastructures do Mercado Financeiro (IMF) e a Secretaria do Tesouro Nacional, possuem um number-code independentemente de participarem da Centralizadora da Compensação de Cheques (Compe).

            [RESTRIÇÃO] É de completion required when a institution have o number-code.
          example: '001'
        partieBranchCode:
          type: string
          maxLength: 4
          pattern: '^\d{4}$'
          description: 'Código da Agência detentora da account da pessoa envolvida na transaction. (Agência é a dependência destinada ao atendimento aos customers, ao public em geral e aos associados de cooperativas de credit, no exercício de atividades da institution, not podendo be móvel ou transitória)'
          example: '6272'
        partieNumber:
          type: string
          maxLength: 20
          pattern: '^\d{8,20}$'
          description: Número da account da pessoa envolvida na transaction
          example: '67890854360'
        partieCheckDigit:
          type: string
          maxLength: 1
          pattern: '[\w\W\s]*'
          description: Dígito da account da pessoa envolvida na transaction
          example: '4'
        codeISPB:
          type: string
          pattern: '^[0-9A-Z]{8}$'
          description: |
            Código single assigned pelo Banco Central do Brasil a cada institution participant do Sistema de Pagamentos.

            Este field identifies o ISPB da institution contraparte da transaction e must be filled de agreement com o atributo que indica o sentido financeiro da transaction, de agreement com o field `creditDebitType`:
             - Para transactions de `CREDITO` (entrada de recursos na account): provide o ISPB da institution de origin dos recursos.
             - Para transactions de `DEBITO` (output de recursos na account): provide o ISPB da institution de destination dos recursos. [RESTRIÇÃO] É de completion   required when existir informtion de contraparte.
          example: '00300300'
    AccountsAccountTransactionsDataAmount:
      type: object
      description: Valor da transaction. Expresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places.
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          format: double
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: Valor related ao objeto.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
          example: BRL
    AccountsAccountBalancesDataAvailableAmount:
      type: object
