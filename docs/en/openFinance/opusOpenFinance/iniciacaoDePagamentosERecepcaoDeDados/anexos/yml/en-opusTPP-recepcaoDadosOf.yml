              maxLength: 9
              minLength: 8
              pattern: '^-?\d{1}\.\d{6}$'
              example: '1.100000'
            fine:
              type: object
              description: |
                Valor de multa devido ao atraso do payment acordado em contract.
                Caso a transmissora possua a informtion, o submission deste field é required.
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  maxLength: 20
                  minLength: 4
                  example: '1000.04'
                  description: Valor related ao objeto.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
            latePayment:
              type: object
              description: |
                Valor de mora devido ao atraso do payment acordado em contract.
                Caso a transmissora possua a informtion, o submission deste field é required.
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  maxLength: 20
                  minLength: 4
                  example: '1000.04'
                  description: Valor related ao objeto.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
        links:
          $ref: '#/components/schemas/CreditFixedIncomesLinks'
        meta:
          $ref: '#/components/schemas/CreditFixedIncomesMeta'
