      type: object
      description: Referências para other recusos da API requisitada.
      required:
        - self
      properties:
        self:
          type: string
          format: url
          maxLength: 4048
          description: URI completo que gerou a response atual.
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        first:
          type: string
          format: url
          maxLength: 4048
          description: URI da primeira page que originou essa list de resultados. Restrição - Obrigatório when not for a primeira page da response
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        prev:
          type: string
          format: url
          maxLength: 4048
          description: "URI da page anterior dessa list de resultados. Restrição - \tObrigatório when not for a primeira page da response"
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        next:
