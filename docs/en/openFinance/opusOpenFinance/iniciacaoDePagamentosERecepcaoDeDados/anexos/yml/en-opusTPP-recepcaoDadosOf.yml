    VariableIncomesEnumTransactionsType:
      type: string
      description: |
        Tipo de movement na viare de investment: entrada ou output. Nos ifs de payment de dividendos, JCP e aluguéis, fica convencionado que beá considerado que o type de movimento beá output.
      enum:
        - ENTRADA
        - SAIDA
      example: SAIDA
    VariableIncomesEnumTransactionsTransactionType:
      type: string
      description: |
        O field must classificar a movement em um dos types described: compra, venda, dividendos, JCP, aluguéis, transfer de custody, transfer de titularidade e other.
        O transmissor must classificar as movements available associando-a a um dos itens do Enum listdo neste field.
        A option OUTROS só must be utilizada para os ifs em que de fato a movement compartilhada not possa be classificada como um dos itens deste Enum.
        A expresare "aluguéis" mustrá be utilizada only para provide os interest/compensation pagos/receiveds pelo customer dos contracts de ações alugadas, seguindo o same entendimento de ENTRADA/SAÍDA da expresare "dividendos".
      enum:
        - COMPRA
        - VENDA
        - DIVIDENDOS
        - JCP
        - ALUGUEIS
        - TRANSFERENCIA_CUSTODIA
        - TRANSFERENCIA_TITULARIDADE
        - OUTROS
      example: DIVIDENDOS
    VariableIncomesEnumTransactionsCurrentType:
      type: string
      description: |
        Tipo de movement na viare de investment: entrada ou output. Nos ifs de payment de dividendos, JCP e aluguéis, fica convencionado que beá considerado que o type de movimento beá output.
      enum:
        - ENTRADA
        - SAIDA
      example: SAIDA
    VariableIncomesEnumTransactionsCurrentTransactionType:
      type: string
      description: |
        O field must classificar a movement em um dos types described: compra, venda, dividendos, JCP, aluguéis, transfer de custody, transfer de titularidade e other.
        O transmissor must classificar as movements available associando-a a um dos itens do Enum listdo neste field.
        A option OUTROS só must be utilizada para os ifs em que de fato a movement compartilhada not possa be classificada como um dos itens deste Enum.
        A expresare "aluguéis" mustrá be utilizada only para provide os interest/compensation pagos/receiveds pelo customer dos contracts de ações alugadas, seguindo o same entendimento de ENTRADA/SAÍDA da expresare "dividendos".
      enum:
        - COMPRA
        - VENDA
        - DIVIDENDOS
        - JCP
        - ALUGUEIS
        - TRANSFERENCIA_CUSTODIA
        - TRANSFERENCIA_TITULARIDADE
        - OUTROS
      example: DIVIDENDOS
    VariableIncomesResponseBroker:
      type: object
      required:
        - data
