        first:
          type: string
          format: url
          maxLength: 4048
          description: URI da primeira page que originou essa list de resultados. Restrição - Obrigatório when not for a primeira page da response
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        prev:
          type: string
          format: url
          maxLength: 4048
          description: "URI da page anterior dessa list de resultados. Restrição - Obrigatório when not for a primeira page da response"
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        next:
          type: string
          format: url
          maxLength: 4048
          description: URI da próxima page dessa list de resultados. Restrição - Obrigatório when not for a last page da response
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
        last:
          type: string
          format: url
          maxLength: 4048
          description: URI da last page dessa list de resultados. Restrição - Obrigatório when not for a last page da response.
          example: 'https://api.banco.com.br/open-banking/api/v1/resource'
