          example: XlthLXpBLVowLTldW2EtekEtWjAtOVwtXXswLDk5fSQ
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          description: Código ou identifier single prstate pela institution para representsr o payment individual.
        isOverParcelPayment:
          type: boolean
