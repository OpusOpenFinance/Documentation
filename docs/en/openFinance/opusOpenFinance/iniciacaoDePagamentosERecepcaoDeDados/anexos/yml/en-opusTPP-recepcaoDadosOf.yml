              example: '2021-05-21T08:30:00Z'
              maxLength: 20
            rejection:
              type: object
              description: Objeto a be retornado if o consent be rejeitado.
              required:
                - rejectedBy
                - reason
              properties:
                rejectedBy:
                  $ref: '#/components/schemas/EnumRejectedBy'
                reason:
                  type: object
                  description: Define a reason pela qual o consent foi rejeitado.
                  required:
                    - code
                  properties:
                    code:
                      type: string
                      description: |
                        Define o code da reason pela qual o consent foi rejeitado.

                        - CONSENT_EXPIRED – consent que ultrapassou o tempo limit para authorization.
                        - CUSTOMER_MANUALLY_REJECTED – customer efetuou a rejeição do consent mannually through de interação nas institutions participants.
                        - CUSTOMER_MANUALLY_REVOKED – customer efetuou a revocation after a authorization do consent.
                        - CONSENT_MAX_DATE_REACHED – consent que ultrapassou o tempo limit de compartilhamento.
                        - CONSENT_TECHNICAL_ISSUE – consent que foi rejeitado devido a um problema técnico que impossibilita seu uso pela receiving institution, por exemplo: falha associada a troca do AuthCode pelo AccessToken, durante o process de Hybrid Flow.
