        foreignPartie:
          type: object
          required:
            - relationshipCode
            - foreignPartieName
            - foreignPartieCountryCode
          description: |
            Lista para submission de informtion de parte envolvida.

            [Restrição] Lista de completion optional pelas participants when:
            - O field `deliveryForeignCurrency` for igual a ESPECIE_CHEQUES_VIAGEM ou CARTAO_PREPAGO.
            - O field `eventType` for diferente de "4 - Liquidação de Operação Cambial no Mercado Primário."

            Caso a institution possua a informtion, ela é de submission required. Caso a informtion be atualizada
            posteriormente à contracting, ela must be enviada through de eventos.
