            relationshipCode:
              type: string
              maxLength: 2
              pattern: '^\d{2}$'
              description: |
                Código de Relação de relationship entre o Cliente e o Pagador/Recebedor no Exterior. Deve respeitar os codes de relationship referenced na resolution 277 ou na Circular 3690, according to se aplicar ao contract de foreign exchange.
              example: '50'
            foreignPartieName:
              type: string
              description: |
                Nome do pagador ou recebedor no exterior.
              maxLength: 120
              pattern: '[\w\W\s]*'
              example: José da Silva
            foreignPartieCountryCode:
              type: string
              description: |
