    CreditCardsAccountsEnumCreditCardAccountsBillingValueType:
      description: "Traz os types dos values relativos aos payments da bill da account de payment postpaid: (Vide Enum)\n - Valor de payment da bill com installmentmento\n - Valor payment da bill realizado\n - Outro Valor pago na bill\n\n VALOR_PAGAMENTO_FATURA_PARCELADO: Quando o payment corresponds ao fato gerador para abertura do plano de installmentmento da bill\n\n VALOR_PAGAMENTO_FATURA_REALIZADO: Quando o payment corresponds ao value total da bill\n\n OUTRO_VALOR_PAGO_FATURA: Demais ifs\n"
