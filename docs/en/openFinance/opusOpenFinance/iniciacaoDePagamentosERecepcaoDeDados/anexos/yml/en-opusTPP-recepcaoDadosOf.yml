    CreditFixedIncomesTransaction:
      type: object
      required:
        - type
        - transactionType
        - transactionDate
        - transactionGrossValue
        - transactionNetValue
        - transactionId
      properties:
        type:
          $ref: '#/components/schemas/CreditFixedIncomesEnumType'
        transactionType:
          $ref: '#/components/schemas/CreditFixedIncomesEnumTransactionType'
        transactionTypeAdditionalInfo:
          type: string
          description: |
            Informção adicional do type de movement, para completion no if de movements not delimitadas no domain.
            [Restrição] Campo de completion required pelas participants when houver 'OUTROS' no field 'transactionType'.
          maxLength: 100
          pattern: '[\w\W\s]*'
        transactionDate:
          type: string
          format: date
          description: Data da movement
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
        transactionUnitPrice:
          type: object
          description: |
            Valor unit negociado com o customer na date de acquisition. Em transfers de custody, when o PU original (da institution de origin) not estiver available para a transmissora, must be provided o PU marcado pela institution na date de transfer.

            [Restrição] Campo de completion required pelas participants when o field `transactionType` for filled com os values `COMPRA`, `VENDA` ou `VENCIMENTO`.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              pattern: '^\d{1,15}\.\d{2,8}$'
              maxLength: 24
              minLength: 4
              example: '1000.000004'
              description: Valor related ao objeto.
            currency:
              $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
        transactionQuantity:
          type: string
          description: |
            Quantidade de securities envolvidos na movement

            [Restrição] Campo de completion required pelas participants when o field 'transactionType' for filled com os values 'COMPRA', 'VENDA', 'VENCIMENTO', 'TRANSFERENCIA_TITULARIDADE' ou 'TRANSFERENCIA_CUSTODIA'.
          maxLength: 24
          pattern: '^\d{1,15}\.\d{2,8}$'
          example: '42.25'
        transactionGrossValue:
          type: object
          description: 'Valor bruto da transaction (Preço unit da movement x Quantidade)'
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              pattern: '^\d{1,15}\.\d{2,4}$'
              maxLength: 20
              minLength: 4
              example: '1000.04'
              description: Valor related ao objeto.
            currency:
              $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
        incomeTax:
          type: object
          description: |
            Valor do imposto de income recolhido na transaction.
            [Restrição] Campo de completion required pelas participants when o field 'type' for filled com o value 'SAIDA'.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              pattern: '^\d{1,15}\.\d{2,4}$'
              maxLength: 20
              minLength: 4
              example: '1000.04'
              description: Valor related ao objeto.
            currency:
              $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
        financialTransactionTax:
          type: object
          description: |
            Valor do IOF recolhido na transaction.
            [Restrição] Campo de completion required pelas participants when o field 'type' for filled com o value 'SAIDA'.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              pattern: '^\d{1,15}\.\d{2,4}$'
              maxLength: 20
              minLength: 4
              example: '1000.04'
              description: Valor related ao objeto.
            currency:
              $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
        transactionNetValue:
          type: object
          description: Valor net da transaction
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              pattern: '^\d{1,15}\.\d{2,4}$'
              maxLength: 20
              minLength: 4
              example: '1000.04'
              description: Valor related ao objeto.
            currency:
              $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
        remunerationTransactionRate:
          type: string
          description: |
            Taxa de compensation acordada com o customer na contracting.

            [Restrição] Campo de completion required pelas participants when o field 'type' for filled com o value 'ENTRADA' e se tratar de product prefixeddo ou híbrido.
          maxLength: 9
          minLength: 8
          pattern: '^-?\d{1}\.\d{6}$'
          example: '0.300000'
        indexerPercentage:
          type: string
          description: |
            Percentual maximum do indexador na transaction acordado com o customer na contracting.

            [Restrição] Campo de completion required pelas participants when o field 'type' for filled com o value 'ENTRADA' e se tratar de product post-fixeddo ou híbrido.
          maxLength: 8
          minLength: 8
          pattern: '^\d{1}\.\d{6}$'
          example: '1.100000'
        transactionId:
          type: string
          description: |
            Código ou identifier single prstate pela institution para individualizar o movimento.
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: ABCD2126019929279212650822221989319253344
    CreditFixedIncomesEnumType:
      type: string
      description: |
        Tipo de movement na viare de investment:

        ENTRADA: COMPRA, CANCELAMENTO, TRANSFERENCIA_TITULARIDADE, TRANSFERENCIA_CUSTODIA, OUTROS.

        SAIDA: VENDA, CANCELAMENTO, VENCIMENTO, PAGAMENTO_JUROS, AMORTIZACAO, PREMIO, TRANSFERENCIA_TITULARIDADE, TRANSFERENCIA_CUSTODIA, MULTA, MORA, OUTROS.
      enum:
        - ENTRADA
        - SAIDA
      example: ENTRADA
    CreditFixedIncomesEnumTransactionType:
      type: string
      description: Compra, venda, cancelamento, due date, payment de interest, amortization, prêmio, transfer de titularidade, transfer de custody, multa, mora e other.
      enum:
        - COMPRA
        - VENDA
        - CANCELAMENTO
        - VENCIMENTO
        - PAGAMENTO_JUROS
        - AMORTIZACAO
        - PREMIO
        - TRANSFERENCIA_TITULARIDADE
        - TRANSFERENCIA_CUSTODIA
        - MULTA
        - MORA
        - OUTROS
      example: COMPRA
