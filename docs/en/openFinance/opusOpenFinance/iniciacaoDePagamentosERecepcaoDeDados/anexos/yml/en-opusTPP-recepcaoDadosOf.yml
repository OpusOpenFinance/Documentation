          maxLength: 100
          pattern: '[\w\W\s]*'
        transactionDate:
          type: string
          format: date
          description: |
            Data da movement de agreement com a date visualizada pelo customer nos canais da institution. Data do pregão: compartilhar movimentos up to a date da position.
          maxLength: 10
          minLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
        priceFactor:
          type: string
          format: double
          description: |
            Fator que indica o number de ações utilizadas para a formção do price. Valor provided must be maior que zero.
          pattern: '^\d{1,15}\.\d{2,8}$'
          maxLength: 24
          example: '100.0005'
        transactionUnitPrice:
          type: object
          description: |
            Preço unit da movement: value da unit do product na movement do investment. Em transfers de custody, when o PU original (da institution de origin) not estiver available para a transmissora, must be provided o PU marcado pela institution na date de transfer.

            [Restrição] Campo de completion required pelas participants when o field `transactionType` for filled com os values `COMPRA` ou `VENDA`.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor related ao objeto.
              maxLength: 21
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              example: '1000.0004'
            currency:
              type: string
              description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        transactionQuantity:
          type: string
          format: double
          description: |
            Quantidade de ativos movimentados.

            [Restrição] Campo de completion required pelas participants when o field 'transactionType' for filled com os values 'COMPRA' ou 'VENDA'.
          maxLength: 24
          pattern: '^\d{1,15}\.\d{2,8}$'
          example: '42.00000025'
        transactionValue:
          type: object
          description: Valor da operation realizada pelo customer.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor related ao objeto.
              maxLength: 20
              pattern: '^\d{1,15}\.\d{2,4}$'
              example: '1000.04'
            currency:
              type: string
              description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        transactionId:
          type: string
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: ABCD2126019929279212650822221989319253344
          description: Código ou identifier single prstate pela institution que maintains a representstion individual do movimento.
        brokerNoteId:
          type: string
          description: |
            Identifica de form single o relacionamento do customer com o product para cada number de nota de trading (`brokerNoteNumber`), mantendo as regras de imutabilidade dentro da date-transmitting institution.
            O conteúdo desse field must be utilizado como parâmetro na chamada do endpoint `GET /broker-notes/{brokerNoteId}`.

            A relationship entre `investmentId` e `brokerNoteId` é de N para N, refletindo que uma nota de trading pode contemplar múltiplos investments e, ao same tempo, um investment pode estar associado a diferentes notas de trading.

            A relationship entre `brokerNoteId` e `brokerNoteNumber` é de 1 para 1, garantindo que cada nota de trading natural corresponda a um identifier single e immutable no ecossistema.

