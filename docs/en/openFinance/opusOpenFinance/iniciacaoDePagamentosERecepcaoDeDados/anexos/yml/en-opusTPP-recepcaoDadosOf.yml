      additionalProperties: false
    FundsInvestmentListItem:
      type: object
      description: Lista de fundos de investment held pelo customer na date-transmitting institution e for which ele has provided consent.
      required:
        - brandName
        - companyCnpj
        - investmentId
      properties:
        brandName:
          type: string
          description: 'Nome da Marca reportada pelo participant no Open Finance. Recomenda-se utilizar, sempre que possible, o same name de marca assigned no field do directory Customer Friendly Server Name (Authorisation Server).'
          pattern: '^[^\s](.*[^\s])?$'
          example: Organização A
          maxLength: 80
        companyCnpj:
          type: string
          description: Registro completo do CNPJ da institution responsible pelo Cadastro - o CNPJ corresponds a representstion alphanumeric da registration no Cadastro de Pessoa Jurídica. Deve-se ter only os caracteres do CNPJ, sem mask.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '21128159000166'
        anbimaCategory:
          type: string
          description: |
            Conforme classification ANBIMA, que segue a deliberação 77 da ANBIMA.

            – Renda Fixa

            – Ações

            – Multimercado

            – Cambial

            https://www.anbima.com.br/data/files/5A/44/2C/B7/8411B510CD3B4DA568A80AC2/DeliberacaoN77-Diretriz-de-Classificacao-de-Fundos.pdf
          enum:
            - RENDA_FIXA
            - ACOES
            - MULTIMERCADO
            - CAMBIAL
          example: RENDA_FIXA
        anbimaClass:
          type: string
          description: Campo required para aderência a Resolução CVM175. Aguardando definições de mercado. Deve se tratar de field do type enum.
          maxLength: 70
          pattern: '[\w\W\s]*'
        anbimaSubclass:
          type: string
          description: Campo required para aderência a Resolução CVM175. Aguardando definições de mercado. Deve se tratar de field do type enum.
          maxLength: 70
          pattern: '[\w\W\s]*'
        investmentId:
          type: string
          description: Identifica de form single o relacionamento do customer com o product, mantendo as regras de imutabilidade dentro da date-transmitting institution. Nos ifs em que o customer, after completar 12 meses da last movement e com quantity de ativos zerada (customer not tem mais posse do product sob custody da transmissora), compre novamente o ativo que já investiu em periods passados, manter o same investmentId anteriormente utilizado.
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: '92792126019929200000000000000000000000000'
      additionalProperties: false
    FundsResponseInvestmentIdentification:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          $ref: '#/components/schemas/FundsInvestmentIdentificationData'
        links:
          $ref: '#/components/schemas/FundsLinks'
        meta:
          $ref: '#/components/schemas/FundsMeta'
      additionalProperties: false
    FundsInvestmentIdentificationData:
      type: object
      description: Informções do product de fundo de investment a que se refere investmentId.
      required:
        - name
        - cnpjNumber
      properties:
        name:
          type: string
          description: Nome oficial do fundo de investment according to exibido para os customers nos canais electronic.
          maxLength: 250
          example: CONSTELLATION MASTER FIA
        cnpjNumber:
          type: string
          description: CNPJ do fundo de investment.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '11225860000140'
        isinCode:
          type: string
          description: |
            Código universal que identifies cada value securities ou instrumento financeiro, according to Norma ISO 6166.

            DEFINIÇÃO: O ISIN (International Securities Identification Number) é um code que identifies um value securities, according to a norma ISO 6166.

            ESTRUTURA: O ISIN é um code alfanumérico que has 12 caracteres com a seguinte structure:
            - Um prefixo, composed de 2 caracteres alfa, que identifies o code do country (Norma ISO 3166);
            - O number básico, composed de 9 caracteres alfabéticos ou numéricos em sua extension;
            - Um digit numérico de controle.
          maxLength: 12
          minLength: 12
          pattern: '^[A-Z]{2}([A-Z0-9]){9}\d{1}$'
          example: BRCST4CTF001
        anbimaCategory:
          type: string
          description: |
            Conforme classification ANBIMA, que segue a deliberação 77 da ANBIMA.

            – Renda Fixa

            – Ações

            – Multimercado

            – Cambial

            https://www.anbima.com.br/data/files/5A/44/2C/B7/8411B510CD3B4DA568A80AC2/DeliberacaoN77-Diretriz-de-Classificacao-de-Fundos.pdf
          enum:
            - RENDA_FIXA
            - ACOES
            - MULTIMERCADO
            - CAMBIAL
          example: RENDA_FIXA
        anbimaClass:
          type: string
          description: Campo required para aderência a Resolução CVM175. Aguardando definições de mercado. Deve se tratar de field do type enum.
          maxLength: 70
          pattern: '[\w\W\s]*'
        anbimaSubclass:
          type: string
          description: Campo required para aderência a Resolução CVM175. Aguardando definições de mercado. Deve se tratar de field do type enum.
          maxLength: 70
          pattern: '[\w\W\s]*'
      additionalProperties: false
