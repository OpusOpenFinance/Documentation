          maxLength: 50
          pattern: '[\w\W\s]*'
          type: string
        productAdditionalInfo:
          description: Informções complementares se type de Cartão 'OUTROS'
          maxLength: 50
          pattern: '[\w\W\s]*'
          type: string
        productType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsProductType'
