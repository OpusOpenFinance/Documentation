    VariableIncomesProductListData:
      type: object
      description: Lista de ativos de income variable held pelo customer na date-transmitting institution e for which ele has provided consent.
      required:
        - brandName
        - companyCnpj
        - investmentId
      properties:
        brandName:
          type: string
          description: 'Nome da Marca reportada pelo participant no Open Finance. Recomenda-se utilizar, sempre que possible, o same name de marca assigned no field do directory Customer Friendly Server Name (Authorisation Server).'
          pattern: '^[^\s](.*[^\s])?$'
          example: Organização A
          maxLength: 80
        companyCnpj:
          type: string
          description: Registro completo do CNPJ da institution responsible pelo Cadastro - o CNPJ corresponds a representstion alphanumeric da registration no Cadastro de Pessoa Jurídica. Deve-se ter only os caracteres do CNPJ, sem mask.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '21281590001660'
        investmentId:
          type: string
          description: Identifica de form single o relacionamento do customer com o product, mantendo as regras de imutabilidade dentro da date-transmitting institution. Nos ifs em que o customer, after completar 12 meses da last movement e com quantity de ativos zerada (customer not tem mais posse do product sob custody da transmissora), compre novamente o ativo que já investiu em periods passados, manter o same investmentId anteriormente utilizado.
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: '92792126019929200000000000000000000000000'
      additionalProperties: false
    VariableIncomesProductIdentificationData:
      type: object
      required:
        - isinCode
        - ticker
      properties:
        issuerInstitutionCnpjNumber:
          type: string
          description: CNPJ da institution emissora. Caso a transmissora possua a informtion o submission deste field é required.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '11225860000140'
        isinCode:
          type: string
          description: |
            Código ISIN da issuance, Código ISIN do product, Código da emissora: code universal que identifies cada value securities ou instrumento financeiro, according to Norma ISO 6166.
          maxLength: 12
          pattern: '^[A-Z]{2}([A-Z0-9]){9}\d{1}$'
          example: BRCST4CTF001
        ticker:
          type: string
          description: Código de trading para identifiestion de ativos negociados em bolsa.
          maxLength: 35
          pattern: '[\w\W\s]*'
          example: PETR4
      additionalProperties: false
    VariableIncomesBalanceData:
      type: object
      required:
        - referenceDate
        - priceFactor
        - grossAmount
        - blockedBalance
        - quantity
        - closingPrice
      properties:
        referenceDate:
          type: string
          format: date
          description: Posição fechada para o ativo da date do dia anterior.
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2023-01-07'
          maxLength: 10
        priceFactor:
          type: string
          format: double
          description: |
            Fator que indica o number de ações utilizadas para a formção do price. Valor provided must be maior que zero.
          pattern: '^\d{1,15}\.\d{2,8}$'
          maxLength: 24
          example: '100.0005'
        grossAmount:
          $ref: '#/components/schemas/VariableIncomesBalancesGrossAmount'
        blockedBalance:
          $ref: '#/components/schemas/VariableIncomesBalancesBlockedBalance'
        quantity:
          type: string
          format: double
          description: Quatidade total do ativo na date de reference.
          pattern: '^-?\d{1,15}\.\d{2,8}$'
          maxLength: 25
          example: '1000.00000004'
        closingPrice:
          $ref: '#/components/schemas/VariableIncomesBalancesClosingPrice'
    VariableIncomesTransactionsData:
      type: object
      required:
        - type
        - transactionType
        - transactionDate
        - transactionValue
        - transactionId
      properties:
        type:
          $ref: '#/components/schemas/VariableIncomesEnumTransactionsType'
        transactionType:
          $ref: '#/components/schemas/VariableIncomesEnumTransactionsTransactionType'
        transactionTypeAdditionalInfo:
          type: string
          description: |
