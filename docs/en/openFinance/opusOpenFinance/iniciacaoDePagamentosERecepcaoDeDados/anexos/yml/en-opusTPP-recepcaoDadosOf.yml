    FundsEnumTransactionsType:
      type: string
      description: |
        Tipo de movement (Entrada ou Saída).

        ENTRADA: APLICACAO, TRANSFERENCIA_COTAS,  OUTROS.

        SAIDA: RESGATE, COME_COTAS, TRANSFERENCIA_COTAS, AMORTIZACAO, OUTROS.
      enum:
        - ENTRADA
        - SAIDA
      example: ENTRADA
    FundsEnumTransactionsTransactionType:
      type: string
      description: |
        O field must classificar a transaction de movement de investment em um dos types described (amortization, transfer de cotas, application, resgate ou come-cotas).
        A option OUTROS só must be utilizada para os ifs em que de fato a transaction compartilhada not possa be classificada como um dos itens deste Enum, e nesse if must-se fill informtion adicionais.
      enum:
        - AMORTIZACAO
        - TRANSFERENCIA_COTAS
        - APLICACAO
        - RESGATE
        - COME_COTAS
        - OUTROS
      example: AMORTIZACAO
    FundsEnumTransactionsCurrentType:
      type: string
      description: |
        Tipo de movement (Entrada ou Saída).

        ENTRADA: APLICACAO, TRANSFERENCIA_COTAS,  OUTROS.

        SAIDA: RESGATE, COME_COTAS, TRANSFERENCIA_COTAS, AMORTIZACAO, OUTROS.
      enum:
        - ENTRADA
        - SAIDA
      example: ENTRADA
    FundsEnumTransactionsCurrentTransactionType:
      type: string
      description: |
        O field must classificar a transaction de movement de investment em um dos types described (amortization, transfer de cotas, application, resgate ou come-cotas).
        A option OUTROS só must be utilizada para os ifs em que de fato a transaction compartilhada not possa be classificada como um dos itens deste Enum, e nesse if must-se fill informtion adicionais.
      enum:
        - AMORTIZACAO
        - TRANSFERENCIA_COTAS
        - APLICACAO
        - RESGATE
        - COME_COTAS
        - OUTROS
      example: AMORTIZACAO
    FundsMeta:
      type: object
      description: Meta informtion related to a API requisitada.
      required:
        - totalRecords
        - totalPages
        - requestDateTime
      properties:
        totalRecords:
          type: integer
          format: int32
          description: Número total de registros no resultado
          example: 1
        totalPages:
          type: integer
          format: int32
          description: Número total de pages no resultado
          example: 1
        requestDateTime:
          description: 'Data e time da query, according to specification RFC-3339, formt UTC.'
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
      additionalProperties: false
    FundsMetaSingle:
      type: object
      description: Meta informtion related to a API requisitada.
      required:
        - requestDateTime
      properties:
        requestDateTime:
          description: 'Data e time da query, according to specification RFC-3339, formt UTC.'
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
