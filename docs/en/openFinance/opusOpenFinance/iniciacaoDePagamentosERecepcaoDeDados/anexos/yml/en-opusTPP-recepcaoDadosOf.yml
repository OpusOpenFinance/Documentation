          example: WGx0aExYcEJMVm93TFRsZFcyRXRla0V0V2pBdE9Wd3RYWH
          description: "Identificador de installment, de responsabilidade de cada Instituição transmissora.  \n[Restrição] Informção de submission required when isOverParcelPayment tiver o value FALSE.\n"
        paidDate:
          type: string
          format: date
          maxLength: 10
          pattern: ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$
          example: '2021-05-21'
          description: Data efetiva do payment related to ao contract da modality de credit queryda, according to specification RFC-3339. p.ex. 2014-03-19
        currency:
          type: string
          maxLength: 3
          pattern: ^(\w{3}){1}$
          example: BRL
          description: 'Moeda related to ao value monetary provided, according to modelo ISO-4217. p.ex. ''BRL''.

            Todos os valores monetários informados estão representados com a moeda vigente do Brasil.

            '
        paidAmount:
          type: string
          format: double
          pattern: ^-?\d{1,15}\.\d{2,4}$
          maxLength: 21
          minLength: 4
          example: '1000.0400'
          description: 'Valor do payment related to ao  contract da modality de credit queryda.

            Expresso em valor monetário com no mínimo 2 casas e no máximo 4 casas decimais.

            '
        overParcel:
          $ref: '#/components/schemas/FinancingsOverParcel'
    FinancingsOverParcel:
      type: object
      description: 'Objeto das tarifas e encargos que foram pagos fora da installment.


