        - MITIGADORAS
        - MUNICIPAL
        - NAO_MITIGADORAS
        - NOTAS_PROMISSORIAS_OUTROS_DIREITOS_CREDITO
        - OUTRAS
        - OUTROS
        - OUTROS_BENS
        - OUTROS_GRAUS
        - OUTROS_IMOVEIS
        - OUTROS_SEGUROS_ASSEMELHADOS
        - PESSOA_FISICA
        - PESSOA_FISICA_EXTERIOR
        - PESSOA_JURIDICA
        - PESSOA_JURIDICA_EXTERIOR
        - PRIMEIRO_GRAU_BENS_DIREITOS_INTEGRANTES_PATRIMONIO_AFETACAO
        - PRIMEIRO_GRAU_IMOVEIS_RESIDENCIAIS
        - PRIMEIRO_GRAU_OUTROS
        - PROAGRO
        - PRODUTOS_AGROPECUARIOS_COM_WARRANT
        - PRODUTOS_AGROPECUARIOS_SEM_WARRANT
        - SBCE_SOCIEDADE_BRASILEIRA_CREDITO_EXPORTAÇÃO
        - SEGURO_RURAL
        - SEM_SUB_TIPO_GARANTIA
        - TRIBUTOS_RECEITAS_ORCAMENTARIAS
        - VEICULOS
        - VEICULOS_AUTOMOTORES
      example: NOTAS_PROMISSORIAS_OUTROS_DIREITOS_CREDITO
    InvoiceFinancingsEnumWarrantyType:
      type: string
      description: 'Denominação/Identificação do type da garantia que avaliza a Modalidade da Operação de Crédito contratada  (Doc 3040, Anexo 12)'
      enum:
        - CESSAO_DIREITOS_CREDITORIOS
        - CAUCAO
        - PENHOR
        - ALIENACAO_FIDUCIARIA
        - HIPOTECA
        - OPERACOES_GARANTIDAS_PELO_GOVERNO
        - OUTRAS_GARANTIAS_NAO_FIDEJUSSORIAS
        - SEGUROS_ASSEMELHADOS
        - GARANTIA_FIDEJUSSORIA
        - BENS_ARRENDADOS
        - GARANTIAS_INTERNACIONAIS
        - OPERACOES_GARANTIDAS_OUTRAS_ENTIDADES
        - ACORDOS_COMPENSACAO
      example: CESSAO_DIREITOS_CREDITORIOS
    EnumContractProductSubTypeInvoiceFinancings:
      type: string
      description: |
        Sub type da modalitys de credit contratadas, according to  circular 4.015 e description do DOC3040 do SCR). (Vide Enum)
        Desconto de duplicatas, Desconto de cheques,  Antecipação da bill do card de credit, Outros rights credit rights desaccountdos, Outros securities desaccountdos
      enum:
        - DESCONTO_DUPLICATAS
        - DESCONTO_CHEQUES
        - ANTECIPACAO_FATURA_CARTAO_CREDITO
        - OUTROS_DIREITOS_CREDITORIOS_DESCONTADOS
        - OUTROS_TITULOS_DESCONTADOS
      example: DESCONTO_CHEQUES
    EnumContractProductTypeInvoiceFinancings:
      type: string
      description: |
        Tipo da modality de credit contratada, according to  circular 4.015 e description do DOC3040 do SCR). (Vide Enum)
        Direitos credit rights desaccountdos
      enum:
        - DIREITOS_CREDITORIOS_DESCONTADOS
      example: DIREITOS_CREDITORIOS_DESCONTADOS
    InvoiceFinancingsBallonPaymentAmount:
      type: object
      required:
        - amount
        - currency
      description: Valor monetary da installment not regular a vencer. Expresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places.
      properties:
        amount:
          type: string
          format: double
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '1000.0400'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
          example: BRL
    InvoiceFinancingsContract:
      type: object
      required:
        - contractNumber
        - ipocCode
        - productName
        - productType
        - productSubType
        - contractDate
        - contractAmount
        - instalmentPeriodicity
        - CET
        - amortizationScheduled
        - interestRates
        - contractedFees
        - contractedFinanceCharges
      properties:
        contractNumber:
          type: string
          maxLength: 100
          pattern: '^[\w\W]{1,100}$'
          example: '1324926521496'
          description: Número do contract dado pela institution contratante.
        ipocCode:
          type: string
          maxLength: 67
          minLength: 22
          pattern: '^[\w\W]{22,67}$'
          description: |
            Número padronizado do contract - IPOC (Identificação Padronizada da Operação de Crédito). Segundo DOC 3040, composed por:
            - **CNPJ da institution:** 8 (oito) positions iniciais;
            - **Modalidade da operation:** 4 (quatro) positions;
            - **Tipo do customer:** 1 (uma) position( 1 = natural person - CPF, 2= legal entity – CNPJ, 3 = individual no exterior, 4 = legal entity no exterior, 5 = natural person sem CPF e 6 = legal entity sem CNPJ);
            - **Código do customer:** O number de positions varia according to o type do customer:
              1. Para customers individual com CPF (type de customer = 1), provide as 11 (onze) positions do CPF;
              2. Para customers legal entity com CNPJ (type de customer = 2), provide as 8 (oito) positions iniciais do CNPJ;
              3. Para os demais customers (types de customer 3, 4, 5 e 6), provide 14 (catorze) positions com complement de zeros à esquerda se a identifiestion tiver tamanho inferior;
            - **Código do contract:** 1 (uma) up to 40 (quarenta) positions, sem complement de caracteres.
          example: '92792126019929279212650822221989319252576'
        productName:
          type: string
          maxLength: 140
          pattern: '^[^\s](.*[^\s])?$'
          example: AD
          description: |
            Denominação/Identificação do name da Modalidade da Operação de Crédito divulgado ao customer
        productType:
          $ref: '#/components/schemas/EnumContractProductTypeInvoiceFinancings'
        productSubType:
          $ref: '#/components/schemas/EnumContractProductSubTypeInvoiceFinancings'
        contractDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-01-05'
          description: Data de contracting da operation de credit. Especificação RFC-3339
        disbursementDates:
          type: array
          minItems: 1
          description: |
            Lista que traz as Datas de Desembolso do value contratado.
          items:
            type: string
            format: date
            maxLength: 10
            pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
            example: '2018-01-15'
            description: |
              Data do Desembolso do value contratado. Especificação RFC-3339.
              No if de uma liberação de recursos feita em D0 mas com reference retroativa feita em D -1, accountbilmente a date correta beia D -1.
        settlementDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-01-15'
          description: |
            Data de settlement da operation.
        contractAmount:
          type: string
          format: double
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: Valor contratado da operation. Expresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places. Nos ifs em que not houver este value explícito no contract do product, enviar como 0.00.
        currency:
          type: string
          maxLength: 3
          pattern: '^(\w{3}){1}$'
          example: BRL
          description: |
            Moeda related to ao value da garantia, according to modelo ISO-4217. p.ex. 'BRL'
            Todos os values monetarys provideds are representsdos com a currency vigente do Brasil
        dueDate:
          type: string
          format: date
          maxLength: 10
          minLength: 2
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2028-01-15'
          description: Data de due date Final da operation. Especificação RFC-3339
        instalmentPeriodicity:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractInstalmentPeriodicity'
        instalmentPeriodicityAdditionalInfo:
          type: string
          pattern: '^[^\s](.*[^\s])?$'
          maxLength: 50
          example: Informações adicionais sobre periodicidade
          description: |
            Campo required para complementar a informtion relativa à periodicity de payment regular when tiver a option OUTROS.
        firstInstalmentDueDate:
          type: string
          format: date
          maxLength: 10
          minLength: 2
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
          description: |
            Data de due date primeira installment do principal.
        CET:
          type: string
          format: double
          maxLength: 13
          minLength: 8
          example: '0.290000'
          pattern: '^\d{1,6}\.\d{6}$'
          description: |
            CET – Custo Efetivo Total must be expresso na form de rate percentage annual e incorpora all os encargos e despesas incidentes nas operations de credit (rate de juro, mas also tarifas, tributos, seguros e other despesas cobradas).

            O completion must respeitar as 6 decimal places decimal places, same que venham filled com zeros (representstion de porcentagem p.ex: 0.150000. Este value represents 15%. O value 1 represents 100%).

            Para o public PF (individual) o field é de submission required para contracts firmados a partir de 2008, according to Resolução CMN 3.517. Para o public PJ (legal entity) o field é de submission required para contracts firmados a partir de 2011, according to Resolução CMN 3.909. O field may be filled com 0.00 em cenários nos quais a casa not has a informtion de CET (Custo efetivo total) only para as exceções listdas abaixo:
            - Em contracts anteriores a 2008 (para o public PF);
            - Em contracts anteriores a 2011 (para o public PJ);
            - Público PJ de médio ou grande porte.
        amortizationScheduled:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractAmortizationScheduled'
        amortizationScheduledAdditionalInfo:
          type: string
          pattern: '^[^\s](.*[^\s])?$'
          maxLength: 200
          example: Informações complementares relativa à amortização do tipo 'OUTROS'
          description: |
            Campo required para complementar a informtion relativa à amortization when selecionada a option OUTROS.
        interestRates:
          type: array
          minItems: 0
          description: |
            Objeto que traz o set de informtion necessárias para demonstrar a composition das rates de interest remuneratórios da Modalidade de credit.
            Caso o contract not possua rates de interest, must be compartilhada uma list empty. Caso o contract possua uma rate de interest com value 0, must be compartilhado um objeto com o value 0 de form explícita.
          items:
            $ref: '#/components/schemas/InvoiceFinancingsContractInterestRate'
        contractedFees:
          type: array
          description: Lista que traz as informtion das tarifas pactuadas no contract.
          items:
            $ref: '#/components/schemas/InvoiceFinancingsContractedFee'
          minItems: 0
        contractedFinanceCharges:
          type: array
          description: Lista que traz os encargos pactuados no contract
          items:
            $ref: '#/components/schemas/InvoiceFinancingsFinanceCharge'
          minItems: 0
        hasInsuranceContracted:
          type: boolean
          description: Campo que identifies se existe seguro contratado para o Direito Creditório Desaccountdo, onde seguro contratado é true e not contratado é false. O not submission do field significa que a institution not oferece este product.
    InvoiceFinancingsContractedWarranty:
      type: object
      description: Conjunto de informtion related tos às garantias que avalizam a operation de credit contratada
      required:
        - currency
        - warrantyType
        - warrantySubType
        - warrantyAmount
      properties:
        currency:
          type: string
          pattern: '^(\w{3}){1}$'
          maxLength: 3
          description: 'Moeda related to ao value da garantia, according to modelo ISO-4217. p.ex. ''BRL''. Todos os values monetarys provideds are representsdos com a currency vigente do Brasil'
          example: BRL
        warrantyType:
          $ref: '#/components/schemas/InvoiceFinancingsEnumWarrantyType'
        warrantySubType:
          $ref: '#/components/schemas/InvoiceFinancingsEnumWarrantySubType'
        warrantyAmount:
          type: string
          format: double
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: |
            Valor original da garantia. Expresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places.

            [Restrição]  Para ifs em que warrantyType for igual a "GARANTIA_FIDEJUSSORIA" o value da garantia corresponds a uma porcentagem do total garantido.
            Dessa form, os ifs de garantia fidejussória para os quais not é possible determinar um value monetary para a garantia must be filleds com 0.00.
    InvoiceFinancingsContractInterestRate:
      type: object
      description: Objeto que traz o set de informtion necessárias para demonstrar a composition das rates de interest remuneratórios da Modalidade de credit
      required:
        - taxType
        - interestRateType
        - taxPeriodicity
        - calculation
        - referentialRateIndexerType
      properties:
        taxType:
          type: string
          description: |
            "Tipo de Taxa (vide  Enum)
            - NOMINAL (rate nominal é uma rate de interest em que a unit referencial not coincide com a unit de tempo da capitalização. Ela é sempre fornecida em termos anuais, e seus periods de capitalização podem be diários, mensais, trimestrais ou semestrais. p.ex. Uma rate de 12% ao ano com capitalização monthly)
            - EFETIVA (É a rate de interest em que a unit referencial coincide com a unit de tempo da capitalização. Como as units de medida de tempo da rate de interest e dos periods de capitalização are iguais, usa-se exemplos simples como 1% ao month, 60% ao ano)"
          enum:
            - NOMINAL
            - EFETIVA
          example: EFETIVA
        interestRateType:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractInterestRateType'
        taxPeriodicity:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractTaxPeriodicity'
        calculation:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractCalculation'
        referentialRateIndexerType:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractReferentialRateIndexerType'
        referentialRateIndexerSubType:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractReferentialRateIndexerSubType'
        referentialRateIndexerAdditionalInfo:
          type: string
          description: |
            Campo livre para complementar a informtion relativa ao Tipo de rate referencial ou indexador.
            [Restrição] Obrigatório para complementar a informtion relativa ao Tipo de rate referencial ou indexador, when selecionada o type ou subtype OUTRO.
          maxLength: 140
          pattern: '^[^\s](.*[^\s])?$'
          example: Informações adicionais de Indexador ou tipo de taxa referencial
        preFixedRate:
          type: string
          format: double
          description: |
            Taxa pré fixedda aplicada sob o contract da modality credit.
            p.ex. 0.014500. O completion must respeitar as 6 decimal places decimal places, same que venham filled com zeros(representstion de porcentagem p.ex: 0.150000.
            Este value represents 15%. O value 1 represents 100%).
          maxLength: 9
          minLength: 8
          example: '0.600000'
          pattern: '^\d{1,2}\.\d{6}$'
        postFixedRate:
          type: string
          format: double
          description: |
            Taxa post fixedda aplicada sob o contract da modality credit.
            p.ex. 0.014500. O completion must respeitar as 6 decimal places decimal places, same que venham filled com zeros (representstion de porcentagem p.ex: 0.150000.
            Este value represents 15%. O value 1 represents 100%).
          maxLength: 9
          minLength: 8
          example: '0.550000'
          pattern: '^\d{1,2}\.\d{6}$'
        additionalInfo:
          type: string
          maxLength: 1200
          description: |
            Texto com informtion adicionais sobre a composition das rates de interest pactuadas.

            [Restrição] Caso a institution possua a informtion para compartilhamento, esta mustrá be informda.
          pattern: '^[^\s](.*[^\s])?$'
          example: Informações adicionais
    InvoiceFinancingsFinanceCharge:
      type: object
      description: Conjunto de informtion related tos à identifiestion da operation de credit
      required:
        - chargeType
      properties:
        chargeType:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractFinanceChargeType'
        chargeAdditionalInfo:
          type: string
          maxLength: 50
          description: |
            Campo para informtion adicionais.

            [Restrição] Obrigatório se selecionada a option 'OUTROS' em Tipo de encargo pactuado no contract.
          pattern: '^[^\s](.*[^\s])?$'
          example: Informações adicionais sobre encargos
        chargeRate:
          type: string
          format: double
          pattern: '^\d{1}\.\d{6}$'
          maxLength: 8
          minLength: 8
          description: |
            Representa o value do encargo em percentage pactuado no contract.
            O completion must respeitar as 6 decimal places decimal places, same que venham filled com zeros
            (representstion de porcentagem p.ex: 0.150000. Este value represents 15%. O value 1 represents 100%).
          example: '0.071200'
    InvoiceFinancingsBalloonPayment:
      type: object
      description: Conjunto de informtion relativas às installments not regulares do contract da modality de credit queryda
      required:
        - dueDate
        - amount
      properties:
        dueDate:
          description: 'Data de due date da installment not regular  a vencer do contract da modality de credit queryda, according to specification RFC-3339. p.ex. 2014-03-19'
          type: string
          maxLength: 10
          minLength: 2
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
        amount:
          $ref: '#/components/schemas/InvoiceFinancingsBallonPaymentAmount'
    InvoiceFinancingsInstalments:
      type: object
      description: Conjunto de informtion related tos às installments / installments da operation de credit contratada
      required:
        - dueInstalments
        - pastDueInstalments
        - typeContractRemaining
        - typeNumberOfInstalments
        - paidInstalments
      properties:
        typeNumberOfInstalments:
          type: string
          description: Tipo de term total do contract related to à modality de credit informda.
          enum:
            - DIA
            - SEMANA
            - MES
            - ANO
            - SEM_PRAZO_TOTAL
          example: MES
        totalNumberOfInstalments:
          type: number
          maximum: 999999
          example: 130632
          description: |
            Prazo Total according to o type (dia, semana, month, ano) related to à Modalidade de Crédito informda.

            [Restrição] Obrigatoriamente must be filled if o typeNumberOfInstalments be diferente de SEM_PRAZO_TOTAL.
        typeContractRemaining:
          type: string
          enum:
            - DIA
            - SEMANA
            - MES
            - ANO
            - SEM_PRAZO_REMANESCENTE
          description: |
            Tipo de term remanescente do contract related to à modality de credit informda.
        contractRemainingNumber:
          type: number
          maximum: 999999
          description: |
            Prazo Remanescente according to o type (dia, semana, month, ano) related to à Modalidade de Crédito informda.

            [Restrição] Obrigatoriamente must be filled if o typeContractRemaining be diferente de SEM_PRAZO_REMANESCENTE.
          example: 14600
        paidInstalments:
          type: number
          description: 'Quantidade de installments pagas. (No if de modalitys que not possuam installments, o number de installments é igual a zero)'
          maximum: 999999
          example: 73
        dueInstalments:
          type: number
          maximum: 999999
          description: 'Quantidade de installments a vencer.(No if de modalitys que not possuam installments, o number de installments é igual a zero)'
          example: 57
        pastDueInstalments:
          type: number
          maximum: 999999
          description: 'Quantidade de installments overdues. (No if de modalitys que not possuam installments, o number de installments é igual a zero)'
          example: 73
        balloonPayments:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceFinancingsBalloonPayment'
          minItems: 1
          description: Lista que traz as dates de due date e value das installments not regulares do contract da modality de credit queryda
    InvoiceFinancingsContractData:
      type: object
      description: Conjunto de informtion de advance de receivables held pelo customer na date-transmitting institution e para os quais ele has provided consent
      required:
        - contractId
        - brandName
        - companyCnpj
        - productType
        - productSubType
        - ipocCode
      properties:
        contractId:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          maxLength: 100
          minLength: 1
          example: '92792126019929279212650822221989319252576'
          description: 'Identifica de form single o contract da operation de credit do customer, mantendo as regras de imutabilidade dentro da date-transmitting institution.'
        brandName:
          type: string
          description: 'Nome da Marca reportada pelo participant no Open Finance. Recomenda-se utilizar, sempre que possible, o same name de marca assigned no field do directory Customer Friendly Server Name (Authorisation Server).'
          pattern: '^[^\s](.*[^\s])?$'
          maxLength: 80
          example: Organização A
        companyCnpj:
          type: string
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          description: 'Registro completo do CNPJ da institution responsible pelo Cadastro - o CNPJ corresponds a representstion alphanumeric da registration no Cadastro de Pessoa Jurídica. Deve-se ter only os caracteres do CNPJ, sem mask.'
          maxLength: 14
          example: '21128159000166'
        productType:
          $ref: '#/components/schemas/EnumContractProductTypeInvoiceFinancings'
        productSubType:
          $ref: '#/components/schemas/EnumContractProductSubTypeInvoiceFinancings'
        ipocCode:
          type: string
          maxLength: 67
          minLength: 22
          pattern: '^[\w\W]{22,67}$'
          description: |
            Número padronizado do contract - IPOC (Identificação Padronizada da Operação de Crédito). Segundo DOC 3040, composed por:
            - **CNPJ da institution:** 8 (oito) positions iniciais;
            - **Modalidade da operation:** 4 (quatro) positions;
            - **Tipo do customer:** 1 (uma) position( 1 = natural person - CPF, 2= legal entity – CNPJ, 3 = individual no exterior, 4 = legal entity no exterior, 5 = natural person sem CPF e 6 = legal entity sem CNPJ);
            - **Código do customer:** O number de positions varia according to o type do customer:
              1. Para customers individual com CPF (type de customer = 1), provide as 11 (onze) positions do CPF;
              2. Para customers legal entity com CNPJ (type de customer = 2), provide as 8 (oito) positions iniciais do CNPJ;
              3. Para os demais customers (types de customer 3, 4, 5 e 6), provide 14 (catorze) positions com complement de zeros à esquerda se a identifiestion tiver tamanho inferior;
            - **Código do contract:** 1 (uma) up to 40 (quarenta) positions, sem complement de caracteres.
          example: '92792126019929279212650822221989319252576'
    InvoiceFinancingsPayments:
      type: object
      description: Conjunto de informtion dos payments related tos às operations de rights credit rights desaccountdos  contratadas
      required:
        - contractOutstandingBalance
        - releases
      properties:
        paidInstalments:
          type: number
          maximum: 999
          example: 73
          description: Quantidade total de installments pagas do contract related to à Modalidade de Crédito informda.
        contractOutstandingBalance:
          type: string
          format: double
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: Valor required para o customer liquidar a dívida, ou be, este field must be filled com o balance mustdor atualizado descrito no DDC (Documento Descritivo de Crédito).
        releases:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/InvoiceFinancingsReleases'
          description: Lista dos payments realizados no period.
    InvoiceFinancingsReleases:
      type: object
      description: Lista dos payments realizados no period
      required:
        - isOverParcelPayment
        - paidDate
        - currency
        - paidAmount
      properties:
        paymentId:
          type: string
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: XlthLXpBLVowLTldW2EtekEtWjAtOVwtXXswLDk5fSQ
          description: Identificador de payment de responsabilidade de cada Instituição transmissora.
        isOverParcelPayment:
          type: boolean
          example: true
          description: Identifica se é um payment pactuado (false) ou avulso (true).
        instalmentId:
          type: string
          maxLength: 100
          pattern: '^[^\s](.*[^\s])?$'
          example: '15'
          description: |
            Identificador de installment, de responsabilidade de cada Instituição transmissora.
            [Restrição] Informção de submission required when isOverParcelPayment tiver o value FALSE.
        paidDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: 'Data efetiva do payment related to ao contract da modality de credit queryda, according to specification RFC-3339. p.ex. 2014-03-19'
        currency:
          type: string
          maxLength: 3
          pattern: '^(\w{3}){1}$'
          example: BRL
          description: |
            Moeda related to ao value monetary provided, according to modelo ISO-4217. p.ex. ''BRL'''.
            Todos os values monetarys provideds are representsdos com a currency vigente do Brasil.
        paidAmount:
          type: string
          format: double
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '1000.0400'
          description: |
            Valor do payment related to ao  contract da modality de credit queryda.
            Expresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places.
        overParcel:
          type: object
          description: |
            Objeto das tarifas e encargos que foram pagos fora da installment.

            [Restrição] Informção must be enviada if ela exista.
          required:
            - fees
            - charges
          properties:
            fees:
              type: array
              minItems: 0
              items:
                $ref: '#/components/schemas/InvoiceFinancingsFeeOverParcel'
              description: 'Lista das tarifas que foram pagas fora da installment, só para payment avulso.'
            charges:
              type: array
              minItems: 0
              items:
                $ref: '#/components/schemas/InvoiceFinancingsChargeOverParcel'
              description: Lista dos encargos que foram pagos fora da installment.
    InvoiceFinancingsFeeOverParcel:
      type: object
      required:
        - feeName
        - feeCode
        - feeAmount
      properties:
        feeName:
          type: string
          maxLength: 140
          minLength: 2
          pattern: '[\w\W\s]+'
          description: |
            Denominação da Tarifa pactuada.
          example: Excesso em Conta
        feeCode:
          type: string
          maxLength: 140
          minLength: 2
          pattern: '[\w\W\s]+'
          description: |
            Sigla identifiera da tarifa pactuada.
          example: EXCESSO_CONTA
        feeAmount:
          type: string
          format: double
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '1000.0400'
          description: |
            Valor monetary da tarifa pactuada no contract.

            Expresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places.
    InvoiceFinancingsChargeOverParcel:
      type: object
      required:
        - chargeType
        - chargeAmount
      properties:
        chargeType:
          type: string
          description: Tipo de encargo pactuado no contract.
          enum:
            - JUROS_REMUNERATORIOS_POR_ATRASO
            - MULTA_ATRASO_PAGAMENTO
            - JUROS_MORA_ATRASO
            - IOF_CONTRATACAO
            - IOF_POR_ATRASO
            - SEM_ENCARGO
            - OUTROS
          example: JUROS_REMUNERATORIOS_POR_ATRASO
        chargeAdditionalInfo:
          type: string
          description: |
            Campo livre para completion das informtion adicionais related to ao encargo.

            [Restrição] Obrigatório when chargeType for igual 'OUTROS'.
          pattern: '^[^\s](.*[^\s])?$'
          example: Informações adicionais
          maxLength: 140
        chargeAmount:
          type: string
          format: double
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '1000.0400'
          description: Valor do payment do encargo pago fora da installment. Expresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places.
