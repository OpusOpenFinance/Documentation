    LoansInstalments:
      type: object
      description: Conjunto de informtion related tos ao term remanescente e às installments de uma operation de credit de loans
      required:
      - dueInstalments
      - pastDueInstalments
      - typeContractRemaining
      - typeNumberOfInstalments
      - paidInstalments
      properties:
        typeNumberOfInstalments:
          type: string
          description: Tipo de term total do contract related to à modality de credit informda.
          enum:
          - DIA
          - SEMANA
          - MES
          - ANO
          - SEM_PRAZO_TOTAL
          example: MES
        totalNumberOfInstalments:
          type: number
          maximum: 999999999
          example: 130632
          description: 'Prazo Total according to o type (dia, semana, month, ano) related to à Modalidade de Crédito informda. Deve correspondsr à soma de `paidInstalments` + `pastDueInstalments` + `dueInstalments`.


            [Restrição] Obrigatoriamente deve ser preenchido caso o `typeNumberOfInstalments` seja diferente de `SEM_PRAZO_TOTAL`.

            '
        typeContractRemaining:
          type: string
          enum:
          - DIA
          - SEMANA
          - MES
          - ANO
          - SEM_PRAZO_REMANESCENTE
          description: 'Tipo de term remanescente do contract related to à modality de credit informda.

            '
        contractRemainingNumber:
          type: number
          maximum: 999999999
          example: 14600
          description: 'Prazo Remanescente according to o type (dia, semana, month, ano) related to à Modalidade de Crédito informda.


            [Restrição] Obrigatoriamente deve ser preenchido caso o typeContractRemaining seja diferente de SEM_PRAZO_REMANESCENTE.

            '
        paidInstalments:
          type: number
          description: Quantidade de installments pagas. (No if de modalitys que not possuam installments, o number de installments é igual a zero)
          maximum: 999999
          example: 73
        dueInstalments:
          type: number
          description: Quantidade de installments a vencer.(No if de modalitys que not possuam installments, o number de installments é igual a zero)
          maximum: 999999
          example: 57
        pastDueInstalments:
          type: number
          description: Quantidade de installments overdues. (No if de modalitys que not possuam installments, o number de installments é igual a zero)
          maximum: 999999
          example: 73
        balloonPayments:
          type: array
          items:
            $ref: '#/components/schemas/LoansBalloonPayment'
          minItems: 1
          description: Lista que traz as dates de due date e value das installments not regulares do contract da modality de credit queryda
    LoansMeta:
      type: object
      description: Meta informtion related to à API requisitada.
      required:
