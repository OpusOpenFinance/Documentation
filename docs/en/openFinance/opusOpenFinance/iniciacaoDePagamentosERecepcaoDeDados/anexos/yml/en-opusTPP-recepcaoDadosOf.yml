        example: '2021-05-21'
    toTransactionDate:
      name: toTransactionDate
      description: |
        Data final de filtragem.

        [Restrição] Deve necessarily be sent if o field fromTransactionDate be provided. Caso not be provided, must be assumido o dia atual.
