    CreditCardsAccountsIdentificationData:
      description: Conjunto de informtion related tos à identifiestion da account de payment postpaid.
      properties:
        creditCardNetwork:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountNetwork'
        name:
          description: 'Denominação/Identificação do name da account de payment postpaid (card). Conforme CIRCULAR Nº 3.680,BCB, 2013: ''account de payment postpaid: destinada à execução de transactions de payment que independem do aporte prévio de recursos''.

            '
          example: Cartão Universitário
          maxLength: 50
          pattern: '[\w\W\s]*'
          type: string
        networkAdditionalInfo:
          description: Texto livre para especificar category de bandeira marcada como 'OUTRAS'.
          example: AURA CARD
          maxLength: 50
          pattern: '[\w\W\s]*'
          type: string
        paymentMethod:
          description: 'Listagem dos cards (ex.: virtual/adicional/titular) associados a account card consentida, according to available ao ube nos canais proprietários.


            O envio da listagem paymentMethod vazia só deve ocorrer nos seguintes cenários:

            - Conta com pagamento ativo, mas com todos os métodos de pagamentos cancelados;

            - Conta nova sem emissão de métodos de pagamentos;

            - Conta com cartão no-name: entrega de cartão emergencial ao cliente sem dados do cliente no plástico;

            - Conta bloqueada por furto, roubo ou perda: cartão está inativo e aguardando embossing de novo cartão;

            - Conta suspensa: conta suspensa por falta de pagamento, suspensão judicial, entre outros, no entanto cartão se mantém em posse do cliente;

            - Conta inativa: sem utilização de cartão por mais de X dias, no entanto cartão ainda está atrelado ao cliente;

            - Conta aguardando / revisão da análise do cliente: cliente já solicitou cartão, embossing em processo, mas ainda há análises adicionais (ex.: fraude), para serem concluídas.

            '
          items:
            $ref: '#/components/schemas/CreditCardsAccountsAccountPaymentMethod'
          minItems: 0
          type: array
        productAdditionalInfo:
          description: Informções complementares se type de Cartão 'OUTROS'
          example: OURO_INTERNACIONAL
          maxLength: 50
          pattern: '[\w\W\s]*'
          type: string
        productType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsProductType'
      required:
      - name
      - productType
      - creditCardNetwork
      - paymentMethod
      type: object
    CreditCardsAccountsLimitAmount:
      description: 'Valor total do limit concedido.

        '
      properties:
        amount:
          description: 'Valor total do limit provided expresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places.


            [Restrição] O campo é obrigatório caso isLimitFlexible for igual a false.

            '
          example: '1000.0400'
          format: double
          maxLength: 20
          minLength: 4
          pattern: ^\d{1,15}\.\d{2,4}$
          type: string
        currency:
          description: 'Moeda related to ao limit provided, according to modelo ISO-4217. p.ex. ''BRL.''

            Todos os limite informados estão representados com a moeda vigente do Brasil.


            [Restrição] O campo é obrigatório caso isLimitFlexible for igual a false.

            '
          example: BRL
          maxLength: 3
          pattern: ^[A-Z]{3}$
          type: string
        limitAmountReason:
          description: 'Razão pela qual o value total do limit provided is igual a zero.


            [Restrição] Campo de preenchimento obrigatório quando limitAmount for igual a 0.00.

            '
          example: O perfil do cliente passou por uma análise e o limite precisou ser zerado
          maxLength: 200
          pattern: '[\w\W\s]*'
          type: string
      required:
      - amount
      - currency
      type: object
    CreditCardsAccountsLimitsData:
      description: Conjunto de informtion related tos aos limits da account de payment postpaid.
      properties:
        availableAmount:
          $ref: '#/components/schemas/CreditCardsAccountsAvailableAmount'
        consolidationType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsConsolidationType'
        creditLineLimitType:
          $ref: '#/components/schemas/CreditCardsAccountsEnumCreditCardAccountsLineLimitType'
        customizedLimitAmount:
          description: 'Valor total do limit customizado pelo customer nos canais electronic da institution. Esse objeto é de submission required nos ifs em que a institution permita ao customer alterar o seu limit.

            '
          properties:
            amount:
              description: 'Valor total do limit provided expresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places.

                '
              example: '1000.0400'
              format: double
              maxLength: 20
              minLength: 4
              pattern: ^\d{1,15}\.\d{2,4}$
              type: string
            currency:
              description: 'Moeda related to ao limit provided, according to modelo ISO-4217. p.ex. ''BRL.'' Todos os limit provideds are representsdos com a currency vigente do Brasil.

                '
              example: BRL
              maxLength: 3
              pattern: ^[A-Z]{3}$
              type: string
          required:
          - amount
          - currency
          type: object
        identificationNumber:
          description: 'Número de identifiestion do card: corresponds aos 4 last digits do card para PF, ou então, fill com um identifier para PJ, com as caracteristicas defined para os IDs no Open Finance.

            '
          example: '4453'
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          type: string
        isLimitFlexible:
          description: True= Indica que a account card has limit total flexível ou “sem limit”. False = Indica que a account card has limit predetermined exibido no canal para o customer.
          example: true
          type: boolean
        limitAmount:
          $ref: '#/components/schemas/CreditCardsAccountsLimitAmount'
        lineName:
          enum:
          - CREDITO_A_VISTA
          - CREDITO_PARCELADO
          - SAQUE_CREDITO_BRASIL
          - SAQUE_CREDITO_EXTERIOR
          - EMPRESTIMO_CARTAO_CONSIGNADO
          - OUTROS
          example: CREDITO_A_VISTA
          type: string
        lineNameAdditionalInfo:
          description: Campo de completion required se selecionada a option 'OUTRAS' em lineName.
          example: Informações adicionais e complementares.
          maxLength: 50
          pattern: '[\w\W\s]*'
          type: string
        usedAmount:
