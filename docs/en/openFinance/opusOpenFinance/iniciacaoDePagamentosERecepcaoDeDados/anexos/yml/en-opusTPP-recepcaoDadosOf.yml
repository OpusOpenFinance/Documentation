      additionalProperties: false
    BankFixedIncomesResponseBalances:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: object
          required:
            - referenceDateTime
            - quantity
            - updatedUnitPrice
            - grossAmount
            - netAmount
            - incomeTax
            - financialTransactionTax
            - blockedBalance
            - purchaseUnitPrice
          properties:
            referenceDateTime:
              type: string
              format: date-time
              description: |
                Data e time da last position consolidada a que se referem os date transacionais do customer available nos canais electronic.
                Na representstion date must se considerar os minutos e according tos como zero (00:00:00Z).
              pattern: '(^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$)'
              example: '2022-07-21T17:32:00Z'
              maxLength: 20
            quantity:
              type: string
              format: double
              description: Quantidade de securities detidos na date da position do customer
              maxLength: 26
              pattern: '^\d{1,15}\.\d{2,10}$'
              example: '1000.0004'
            updatedUnitPrice:
              type: object
              required:
                - amount
                - currency
              description: Valor bruto unit atualizado na date de reference.
              properties:
                amount:
                  description: Valor related ao objeto.
                  type: string
                  format: double
                  maxLength: 26
                  pattern: '^\d{1,15}\.\d{2,10}$'
                  example: '1000.000004'
                currency:
                  $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
            grossAmount:
              description: Valor do investment que se refere a quantity multiplicado pelo PU atualizado na date de reference;
              type: object
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  maxLength: 20
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  example: '1000.0004'
                  description: Valor related ao objeto.
                currency:
                  $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
            netAmount:
              description: 'Valor do investment atualizado na date de reference, posterior a deduction de impostos (IOF e IR).'
              type: object
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  maxLength: 20
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  example: '1000.0004'
                  description: Valor related ao objeto.
                currency:
                  $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
            incomeTax:
              type: object
              required:
                - amount
                - currency
              description: Valor do imposto de income provisionado considerando a tax rate vigente na date de reference.
              properties:
                amount:
                  type: string
                  format: double
                  maxLength: 20
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  example: '1000.0004'
                  description: Valor related ao objeto.
                currency:
                  $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
            financialTransactionTax:
              type: object
              required:
                - amount
                - currency
              description: Valor do imposto (IOF) provisionado considerando a tax rate vigente na date de reference.
              properties:
                amount:
                  type: string
                  format: double
                  maxLength: 20
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  example: '1000.0004'
                  description: Valor related ao objeto.
                currency:
                  $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
            blockedBalance:
              type: object
              required:
                - amount
                - currency
              description: Valor not available para movement naquele momento por qualquer reason (block judicial, block em garantia, entre other). Prazo de carência not é considerado como block.
              properties:
                amount:
                  type: string
                  format: double
                  maxLength: 20
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  example: '1000.0004'
                  description: Valor related ao objeto.
                currency:
                  $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
            purchaseUnitPrice:
              type: object
              required:
                - amount
                - currency
              description: Valor unit negociado com o customer na date de acquisition
              properties:
                amount:
                  type: string
                  format: double
                  maxLength: 24
                  pattern: '^\d{1,15}\.\d{2,8}$'
                  example: '1000.000004'
                  description: Valor related ao objeto.
                currency:
                  $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
            preFixedRate:
              type: string
              format: double
              description: |
                Taxa de compensation acordada com o customer na contracting. Em ifs de products progressivos, considerar a rate máxima contratada.
              pattern: '^-?\d{1}\.\d{6}$'
              maxLength: 9
              minLength: 8
              example: '0.300000'
            postFixedIndexerPercentage:
              type: string
              format: double
              description: |
                Percentual do indexador acordado com o customer na contracting. Em ifs de products progressivos, considerar a rate máxima contratada.
              pattern: '^-?\d{1}\.\d{6}$'
              maxLength: 9
              minLength: 8
              example: '1.000000'
        links:
          $ref: '#/components/schemas/BankFixedIncomesLinks'
        meta:
          $ref: '#/components/schemas/BankFixedIncomesMeta'
      additionalProperties: false
    BankFixedIncomesResponseTransactions:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/BankFixedIncomesProductMovement'
        links:
          $ref: '#/components/schemas/BankFixedIncomesTransactionsLinks'
        meta:
          $ref: '#/components/schemas/BankFixedIncomesTransactionsMeta'
      additionalProperties: false
    BankFixedIncomesProductMovement:
      type: object
      required:
        - type
        - transactionType
        - transactionDate
        - transactionUnitPrice
        - transactionQuantity
        - transactionGrossValue
        - transactionNetValue
        - transactionId
      properties:
        type:
          $ref: '#/components/schemas/BankFixedIncomesEnumMovementType'
        transactionType:
          $ref: '#/components/schemas/BankFixedIncomesEnumTransactionType'
        transactionTypeAdditionalInfo:
          type: string
          maxLength: 100
          pattern: '[\w\W\s]*'
          description: |
            Informção adicional do type de movement, para completion no if de movements not delimitadas no domain.

            [Restrição] Campo de completion required pelas participants when houver 'Outros' no field Motivo da movement.
        transactionDate:
          type: string
          format: date
          maxLength: 10
          minLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
          description: Data da movement.
        transactionUnitPrice:
          type: object
          description: Preço unit bruto negociado na transaction.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              maxLength: 24
              pattern: '^\d{1,15}\.\d{2,8}$'
              example: '1000.04'
            currency:
              $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
        transactionQuantity:
          type: string
          format: double
          maxLength: 24
          pattern: '^\d{1,15}\.\d{2,8}$'
          example: '42.25'
          description: Quantidade de securities envolvidos na movement.
        transactionGrossValue:
          type: object
          description: Valor bruto da transaction (Preço unit da movement x Quantidade).
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              maxLength: 20
              pattern: '^\d{1,15}\.\d{2,4}$'
              example: '1000.04'
            currency:
              $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
        incomeTax:
          type: object
          description: |
            Valor do imposto de income recolhido na transaction.

            [Restrição] Campo de completion required para os products aos quais essa rate se aplica when o field `type` for filled com o value `SAIDA`.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              maxLength: 20
              pattern: '^\d{1,15}\.\d{2,4}$'
              example: '1000.04'
            currency:
              $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
        financialTransactionTax:
          type: object
          description: |
            Valor do IOF recolhido na transaction.

            [Restrição] Campo de completion required para os products aos quais essa rate se aplica when o field `type` for filled com o value `SAIDA`.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              maxLength: 20
              pattern: '^\d{1,15}\.\d{2,4}$'
              example: '1000.04'
              description: Valor related ao objeto.
            currency:
              $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
        transactionNetValue:
          type: object
          description: Valor net da transaction.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              maxLength: 20
              pattern: '^\d{1,15}\.\d{2,4}$'
              example: '1000.04'
              description: Valor related ao objeto.
            currency:
              $ref: '#/components/schemas/BankFixedIncomesCurrencyCode'
        remunerationTransactionRate:
          type: string
          format: double
          maxLength: 9
          minLength: 8
          pattern: '^-?\d{1}\.\d{6}$'
          example: '0.300000'
          description: |
            Taxa de compensation da transaction.

            [Restrição] Campo de completion required pelas participants when o field 'type' for filled com o value 'ENTRADA' e se tratar de product prefixeddo ou híbrido.
        indexerPercentage:
          type: string
          format: double
          maxLength: 8
          minLength: 8
          pattern: '^\d{1}\.\d{6}$'
          example: '1.100000'
          description: |
            Percentual maximum do indexador acordado com o customer na contracting.

            [Restrição] Campo de completion required pelas participants when o field 'type' for filled com o value 'ENTRADA' e se tratar de product post-fixeddo ou híbrido.
        transactionId:
          type: string
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: ABCD2126019929279212650822221989319253344
          description: Código ou identifier single prstate pela institution que maintains a representstion individual do movimento.
      additionalProperties: false
    BankFixedIncomesEnumMovementType:
      type: string
      description: |
        Tipo de movement na viare de investment

        - ENTRADA: APLICACAO, CANCELAMENTO, TRANSFERENCIA_TITULARIDADE, TRANSFERENCIA_CUSTODIA, OUTROS.

        - SAIDA: RESGATE, CANCELAMENTO, VENCIMENTO, PAGAMENTO_JUROS, AMORTIZACAO, TRANSFERENCIA_TITULARIDADE, TRANSFERENCIA_CUSTODIA, OUTROS.
      enum:
        - ENTRADA
        - SAIDA
      example: ENTRADA
    BankFixedIncomesEnumTransactionType:
      type: string
      description: Aplicação, resgate, cancelamento, due date, payment de interest, amortization, transfer de titularidade, transfer de custody e other.
      enum:
        - APLICACAO
        - RESGATE
        - CANCELAMENTO
        - VENCIMENTO
        - PAGAMENTO_JUROS
        - AMORTIZACAO
        - TRANSFERENCIA_TITULARIDADE
        - TRANSFERENCIA_CUSTODIA
        - OUTROS
      example: APLICACAO
    CreditFixedIncomesResponseInvestmentList:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            type: object
            description: Lista de securities de income fixed credit held pelo customer na date-transmitting institution e for which ele has provided consent
            required:
              - brandName
              - companyCnpj
              - investmentType
              - investmentId
            properties:
              brandName:
                type: string
                description: 'Nome da Marca reportada pelo participant no Open Finance. Recomenda-se utilizar, sempre que possible, o same name de marca assigned no field do directory Customer Friendly Server Name (Authorisation Server).'
                pattern: '^[^\s](.*[^\s])?$'
                maxLength: 80
                example: Organização A
              companyCnpj:
                type: string
                description: 'Registro completo do CNPJ da institution responsible pelo Cadastro - o CNPJ corresponds a representstion alphanumeric da registration no Cadastro de Pessoa Jurídica. Deve-se ter only os caracteres do CNPJ, sem mask'
                maxLength: 14
                pattern: '^[0-9A-Z]{12}[0-9]{2}$'
                example: '21128159000166'
              investmentType:
                $ref: '#/components/schemas/CreditFixedIncomesEnumInvestmentType'
              investmentId:
                type: string
                description: 'Identifica de form single  o relacionamento do customer com o product, mantendo as regras de imutabilidade dentro da date-transmitting institution.'
                maxLength: 100
                pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
                example: '92792126019929200000000000000000000000000'
            additionalProperties: false
        links:
          $ref: '#/components/schemas/CreditFixedIncomesProductListLinks'
        meta:
          $ref: '#/components/schemas/CreditFixedIncomesMeta'
      additionalProperties: false
    CreditFixedIncomesResponseProductIdentification:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          $ref: '#/components/schemas/CreditFixedIncomesIdentification'
        links:
          $ref: '#/components/schemas/CreditFixedIncomesLinks'
        meta:
          $ref: '#/components/schemas/CreditFixedIncomesMeta'
      additionalProperties: false
    CreditFixedIncomesIdentification:
      type: object
      required:
        - investmentType
        - remuneration
        - issueUnitPrice
        - issueDate
        - dueDate
        - voucherPaymentIndicator
        - purchaseDate
        - taxExemptProduct
      properties:
        issuerInstitutionCnpjNumber:
          type: string
          description: |
            CNPJ da institution emissora.

            Caso a institution has a informtion, o submission beá required.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '11225860000140'
        isinCode:
          type: string
          description: |
            Código ISIN é um code universal que identifies cada value securities ou instrumento financeiro, according to Norma ISO 6166. Caso a transmissora possua a informtion o submission deste field é required.

            [Restrição] Deve be filled nos ifs em que o 'clearingCode' not be filled.
          maxLength: 12
          pattern: '^[A-Z]{2}([A-Z0-9]){9}\d{1}$'
          example: BRCST4CTF001
        investmentType:
          $ref: '#/components/schemas/CreditFixedIncomesEnumInvestmentType'
        debtorCnpjNumber:
          type: string
          description: |
            CNPJ do mustdor. Caso a transmissora possua a informtion para os products CRI e CRA, o submission deste field é required.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '11225860000140'
        debtorName:
          type: string
          description: |
            Nome do mustdor. Caso a transmissora possua a informtion para os products CRI e CRA, o submission deste field é required.
          pattern: '[\w\W\s]*'
          maxLength: 70
          example: Roberto Marino
        taxExemptProduct:
          $ref: '#/components/schemas/CreditFixedIncomesEnumTaxExemptProduct'
        remuneration:
          $ref: '#/components/schemas/CreditFixedIncomesRemuneration'
        issueUnitPrice:
          type: object
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              description: Valor related ao objeto.
              maxLength: 24
              pattern: '^\d{1,15}\.\d{2,8}$'
              example: '1000.000004'
            currency:
              $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
        issueDate:
          type: string
          format: date
          description: Data de issuance do title
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-16'
        dueDate:
          type: string
          format: date
          description: Data de due date do title
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
        voucherPaymentIndicator:
          $ref: '#/components/schemas/CreditFixedIncomesEnumVoucherPaymentIndicator'
        voucherPaymentPeriodicity:
          $ref: '#/components/schemas/CreditFixedIncomesEnumVoucherPaymentPeriodicity'
        voucherPaymentPeriodicityAdditionalInfo:
          type: string
          description: |
            Informções adicionais da periodicity de payment de cupom
            [Restrição] Campo de completion required pelas participants when houver 'Outros' no field 'voucherPaymentPeriodicity'.
          maxLength: 50
          pattern: '[\w\W\s]*'
          example: Diária
        clearingCode:
          type: string
          description: |
            Código de registro do ativo na Clearing. Caso a transmissora possua a informtion o submission deste field é required.

            [Restrição] Deve be filled nos ifs em que o 'isinCode' not be filled.
          maxLength: 30
          pattern: '[\w\W-]*'
          example: CDB421GPXXX
        purchaseDate:
          type: string
          format: date
          description: Data de acquisition do customer
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
        gracePeriodDate:
          type: string
          format: date
          description: |
            Data up to a qual o customer not may resgatar antecipadamente seu investment.

            Caso a institution has a informtion, o submission beá required.
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-16'
      additionalProperties: false
    CreditFixedIncomesEnumInvestmentType:
      type: string
      description: 'Especificação do ativo em quare (Debêntures, CRI ou CRA).'
      enum:
        - DEBENTURES
        - CRI
        - CRA
      example: CRI
    CreditFixedIncomesEnumTaxExemptProduct:
      type: string
      description: Indicador de um product incentivado
      enum:
        - SIM
        - NAO
      example: SIM
    CreditFixedIncomesEnumVoucherPaymentIndicator:
      type: string
      description: |
        Indicativo se há payment de cupom
          1. Sim
          2. Nao
      enum:
        - SIM
        - NAO
      example: SIM
    CreditFixedIncomesEnumVoucherPaymentPeriodicity:
      type: string
      description: |
        Em if de haver payment de cupom, descrever a periodicity (monthly, trimestral, semestral, annual, irregular e other)
      enum:
        - MENSAL
        - TRIMESTRAL
        - SEMESTRAL
        - ANUAL
        - IRREGULAR
        - OUTROS
      example: MENSAL
    CreditFixedIncomesRemuneration:
      type: object
      required:
        - indexer
      properties:
        preFixedRate:
          type: string
          description: |
            Valor da rate de issuance do contract.
            [Restrição] Campo de completion required pelas participants when houver 'PRE_FIXADO' no field 'indexer' ou when se tratar de product com compensation híbrida.
          maxLength: 9
          pattern: '^-?\d{1}\.\d{6}$'
          example: '0.300000'
        postFixedIndexerPercentage:
          type: string
          description: |
            Percentual do indexador de issuance do contract.
            [Restrição] Campo de completion required pelas participants when o field 'indexer' for filled de form diferente de 'PRE_FIXADO' ou when se tratar de product com compensation híbrida.
          maxLength: 9
          pattern: '^-?\d{1}\.\d{6}$'
          example: '1.100000'
        rateType:
          $ref: '#/components/schemas/CreditFixedIncomesEnumRateType'
        ratePeriodicity:
          $ref: '#/components/schemas/CreditFixedIncomesEnumRatePeriodicity'
        calculation:
          $ref: '#/components/schemas/CreditFixedIncomesEnumCalculation'
        indexer:
          $ref: '#/components/schemas/CreditFixedIncomesEnumIndexer'
        indexerAdditionalInfo:
          type: string
          description: |
            Informções adicionais do indexador
            [Restrição] Campo de completion required pelas participants when houver 'Outros' no field 'indexer'.
          pattern: '[\w\W\s]*'
          maxLength: 50
          example: Dólar
    CreditFixedIncomesEnumRateType:
      type: string
      description: |
        Tipo da rate de compensation (linear ou exponencial).

        Caso a institution has a informtion, o submission beá required.
      enum:
        - LINEAR
        - EXPONENCIAL
      example: LINEAR
    CreditFixedIncomesEnumRatePeriodicity:
      type: string
      description: |
        Periodicity da rate de compensation (monthly, annual, diário, semestral).

        Caso a institution has a informtion, o submission beá required.
      enum:
        - MENSAL
        - ANUAL
        - DIARIO
        - SEMESTRAL
      example: MENSAL
    CreditFixedIncomesEnumCalculation:
      type: string
      description: |
        Base de calculation (days úteis ou days corridos).

        Caso a institution has a informtion, o submission beá required.
      enum:
        - DIAS_UTEIS
        - DIAS_CORRIDOS
      example: DIAS_CORRIDOS
    CreditFixedIncomesEnumIndexer:
      type: string
      description: 'Índice utilizado como reference para a correção da rentabilidade e/ou rendimentos do ativo (CDI, DI, TR, IPCA, IGP_M, IGP_DI, INPC, BCP, TLC, SELIC, PRE_FIXADO e OUTROS)'
      enum:
        - CDI
        - DI
        - TR
        - IPCA
        - IGP_M
        - IGP_DI
        - INPC
        - BCP
        - TLC
        - SELIC
        - PRE_FIXADO
        - OUTROS
      example: CDI
    CreditFixedIncomesCurrencyCode:
      type: string
      description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
      maxLength: 3
      pattern: '^[A-Z]{3}$'
      example: BRL
