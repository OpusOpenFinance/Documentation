    UnarrangedAccountsOverdraftChargeType:
      type: string
      description: Tipo de encargo pactuado no contract.
      enum:
        - JUROS_REMUNERATORIOS_POR_ATRASO
        - MULTA_ATRASO_PAGAMENTO
        - JUROS_MORA_ATRASO
        - IOF_CONTRATACAO
        - IOF_POR_ATRASO
        - SEM_ENCARGO
        - OUTROS
      example: JUROS_REMUNERATORIOS_POR_ATRASO
    UnarrangedAccountsOverdraftFeeOverParcel:
      type: object
      required:
        - feeName
        - feeCode
        - feeAmount
      properties:
        feeName:
          type: string
          description: |
            Denominação da Tarifa pactuada.
          maxLength: 140
          pattern: '^[^\s](.*[^\s])?$'
          example: Saque a descoberto
        feeCode:
          type: string
          description: |
            Sigla identifiera da tarifa pactuada.
          maxLength: 140
          pattern: '^[^\s](.*[^\s])?$'
          example: Saque descoberto
        feeAmount:
          type: string
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '100000.0400'
          description: |
            Valor monetary da tarifa pactuada no contract.

            Expresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places.
    UnarrangedAccountsOverdraftFinanceCharge:
      type: object
      required:
        - chargeType
      properties:
        chargeType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftChargeType'
        chargeAdditionalInfo:
          type: string
          pattern: '^[^\s](.*[^\s])?$'
          example: Informações adicionais sobre encargos.
          description: |
            Campo para informtion adicionais.

            [Restrição] Obrigatório se selecionada a option 'OUTROS' em Tipo de encargo pactuado no contract.
        chargeRate:
          type: string
          format: double
          pattern: '^\d{1}\.\d{6}$'
          maxLength: 8
          minLength: 8
          description: |
            Representa o value do encargo em percentage pactuado no contract.

            O completion must respeitar as 6 decimal places decimal places, same que venham filled com zeros(representstion de porcentagem p.ex: 0.150000. Este value represents 15%. O value 1 represents 100%).
          example: '0.071200'
    UnarrangedAccountsOverdraftInstalmentsData:
      type: object
      description: Conjunto de informtion related tos ao term remanescente e às installments de uma operation de credit de adiantamento a depositante
      required:
        - dueInstalments
        - pastDueInstalments
        - typeContractRemaining
        - typeNumberOfInstalments
        - paidInstalments
      properties:
        typeNumberOfInstalments:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumTypeNumberOfInstalments'
        totalNumberOfInstalments:
          type: number
          maximum: 999999
          example: 130632
          description: |
            Prazo Total according to o type (dia, semana, month, ano) related to à Modalidade de Crédito informda.

            [Restrição] Obrigatoriamente must be filled if o typeNumberOfInstalments be diferente de SEM_PRAZO_TOTAL.
        typeContractRemaining:
          type: string
          enum:
            - DIA
            - SEMANA
            - MES
            - ANO
            - SEM_PRAZO_REMANESCENTE
          description: |
            Tipo de term remanescente do contract related to à modality de credit informda.
        contractRemainingNumber:
          type: number
          maximum: 999999
          description: |
            Prazo Remanescente according to o type (dia, semana, month, ano) related to à Modalidade de Crédito informda.

            [Restrição] Obrigatoriamente must be filled if o typeContractRemaining be diferente de SEM_PRAZO_REMANESCENTE.
          example: 80
        paidInstalments:
          type: number
          description: 'Quantidade de installments pagas. (No if de modalitys que not possuam installments, o number de installments é igual a zero)'
          maximum: 999999
          example: 73
        dueInstalments:
          type: number
          maximum: 999999
          description: 'Quantidade de installments a vencer.(No if de modalitys que not possuam installments, o number de installments é igual a zero)'
          example: 57
        pastDueInstalments:
          type: number
          maximum: 999999
          description: 'Quantidade de installments overdues. (No if de modalitys que not possuam installments, o number de installments é igual a zero)'
          example: 73
        balloonPayments:
          type: array
          items:
            $ref: '#/components/schemas/UnarrangedAccountsOverdraftBalloonPayment'
          minItems: 1
          description: Lista que traz as dates de due date e value das installments not regulares do contract da modality de credit queryda
    UnarrangedAccountsOverdraftPaymentsData:
      type: object
      description: Conjunto de informtion related tos aos payments realizados de uma operation de credit de adiantamento a depositantes
      required:
        - contractOutstandingBalance
        - releases
      properties:
        paidInstalments:
          type: number
          maximum: 999
          example: 73
          description: Quantidade total de installments pagas do contract related to à Modalidade de Crédito informda.
        contractOutstandingBalance:
          type: string
          minLength: 4
          maxLength: 21
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          example: '100000.0400'
          description: Valor required para o customer liquidar a dívida, ou be, este field must be filled com o balance mustdor atualizado descrito no DDC (Documento Descritivo de Crédito).
        releases:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/UnarrangedAccountsOverdraftReleases'
          description: Lista dos payments realizados no period
    UnarrangedAccountsOverdraftReleases:
      type: object
      description: Lista dos payments realizados no period
      required:
        - paymentId
        - isOverParcelPayment
        - paidDate
        - currency
        - paidAmount
      properties:
        paymentId:
          type: string
          maxLength: 100
          minLength: 1
          example: XlthLXpBLVowLTldW2EtekEtWjAtOVwtXXswLDk5fSQ
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          description: Código ou identifier single prstate pela institution para representsr o payment individual.
        isOverParcelPayment:
          type: boolean
          example: true
          description: Identifica se é um payment pactuado (false) ou avulso (true).
        instalmentId:
          type: string
          maxLength: 100
          minLength: 1
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: WGx0aExYcEJMVm93TFRsZFcyRXRla0V0V2pBdE9Wd3RYWH
          description: |
            Identificador de installment, de responsabilidade de cada Instituição transmissora.

            [Restrição] Informção de submission required when isOverParcelPayment tiver o value FALSE.
        paidDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2021-05-21'
          description: 'Data efetiva do payment related to ao contract da modality de credit queryda, according to specification [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339). p.ex. 2014-03-19'
        currency:
          type: string
          maxLength: 3
          pattern: '^(\w{3}){1}$'
          example: BRL
          description: |
            Moeda related to ao value monetary provided, according to modelo ISO-4217. p.ex. 'BRL'.
            Todos os values monetarys provideds are representsdos com a currency vigente do Brasil.
        paidAmount:
          type: string
          maxLength: 21
          minLength: 4
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          example: '100000.0400'
          description: |
            Valor do payment related to ao  contract da modality de credit queryda.
            Expresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places.
        overParcel:
          type: object
          description: |
            Objeto das tarifas e encargos que foram pagos fora da installment.

            [Restrição] Informção must be enviada if ela exista.
          required:
            - fees
            - charges
          properties:
            fees:
              type: array
              minItems: 0
              items:
                $ref: '#/components/schemas/UnarrangedAccountsOverdraftFeeOverParcel'
              description: 'Lista das tarifas que foram pagas fora da installment, só para payment avulso.'
            charges:
              type: array
              minItems: 0
              items:
                $ref: '#/components/schemas/UnarrangedAccountsOverdraftChargeOverParcel'
              description: Lista dos encargos que foram pagos fora da installment.
    UnarrangedAccountsOverdraftContractedFee:
      type: object
      required:
        - feeName
        - feeCode
        - feeChargeType
        - feeCharge
      properties:
        feeName:
          type: string
          maxLength: 140
          pattern: '^[^\s](.*[^\s])?$'
          description: Denominação da Tarifa pactuada
          example: Excesso em Conta
        feeCode:
          type: string
          maxLength: 140
          pattern: '^[^\s](.*[^\s])?$'
          description: Sigla identifiera da tarifa pactuada
          example: EXCESSO_CONTA
        feeChargeType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumContractFeeChargeType'
        feeCharge:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumContractFeeCharge'
        feeAmount:
          type: string
          format: double
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: |
            Valor monetary da tarifa pactuada no contract.

            [Restrição] Preenchimento required when a form de charge for diferente de Percentual.
        feeRate:
          type: string
          pattern: '^\d{1}\.\d{6}$'
          format: double
          maxLength: 8
          minLength: 8
          description: |
            É o value da tarifa em percentage pactuada no contract.

            [Restrição] Preenchimento required when a form de charge for Percentual.
          example: '0.062000'
    UnarrangedAccountsOverdraftContractedWarranty:
      type: object
      description: Conjunto de informtion related tos às garantias que avalizam a operation de credit contratada
      required:
        - currency
        - warrantyAmount
        - warrantyType
        - warrantySubType
      properties:
        currency:
          type: string
          pattern: '^(\w{3}){1}$'
          maxLength: 3
          description: 'Moeda related to ao value da garantia, according to modelo ISO-4217. p.ex. ''BRL''. Todos os values monetarys provideds are representsdos com a currency vigente do Brasil'
          example: BRL
        warrantyType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumWarrantyType'
        warrantySubType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumWarrantySubType'
        warrantyAmount:
          description: |
            Valor original da garantia. Expresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places.

            [Restrição] Para ifs em que warrantyType for igual a "GARANTIA_FIDEJUSSORIA" o value da garantia corresponds a uma porcentagem do total garantido.
            Dessa form, os ifs de garantia fidejussória para os quais not é possible determinar um value monetary para a garantia must be filleds com 0.00.
          type: string
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '100000.0400'
    UnarrangedAccountsOverdraftBalloonPayment:
      type: object
      description: Lista que traz as dates de due date e value das installments not regulares  do contract da modality de credit queryda.
      required:
        - dueDate
        - amount
      properties:
        dueDate:
          type: string
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          description: 'Data de due date da installment not regular  a vencer do contract da modality de credit queryda, according to specification [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339). p.ex. 2014-03-19'
          maxLength: 10
          example: '2020-01-10'
        amount:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftBalloonPaymentAmount'
    UnarrangedAccountsOverdraftChargeOverParcel:
      type: object
      description: Lista dos encargos que foram pagos fora da installment.
      required:
        - chargeType
        - chargeAmount
      properties:
        chargeType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftChargeType'
        chargeAdditionalInfo:
          type: string
          pattern: '^[^\s](.*[^\s])?$'
          maxLength: 140
          example: Informações adicionais
          description: |
            Campo livre para completion das informtion adicionais related to ao encargo.
            [Restrição] Obrigatório when chargeType for igual 'OUTROS'.
        chargeAmount:
          description: Valor do payment do encargo pago fora da installment. Expresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places.
          type: string
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '100000.0400'
    UnarrangedAccountsOverdraftContractData:
      type: object
      description: Conjunto de informtion related tos à identifiestion da operation de credit de adiantamento a depositantes
      required:
        - contractNumber
        - ipocCode
        - productName
        - productType
        - productSubType
        - contractDate
        - contractAmount
        - instalmentPeriodicity
        - amortizationScheduled
        - interestRates
        - contractedFees
        - contractedFinanceCharges
      properties:
        contractNumber:
          type: string
          maxLength: 100
          minLength: 1
          pattern: '^[\w\W]{1,100}$'
          example: '1324926521496'
          description: Número do contract dado pela institution contratante.
        ipocCode:
          type: string
          maxLength: 67
          minLength: 22
          pattern: '^[\w\W]{22,67}$'
          example: '92792126019929279212650822221989319252576'
          description: |
            Número padronizado do contract - IPOC (Identificação Padronizada da Operação de Crédito). Segundo DOC 3040, composed por:
            - **CNPJ da institution:** 8 (oito) positions iniciais;
            - **Modalidade da operation:** 4 (quatro) positions;
            - **Tipo do customer:** 1 (uma) position( 1 = natural person - CPF, 2= legal entity – CNPJ, 3 = individual no exterior, 4 = legal entity no exterior, 5 = natural person sem CPF e 6 = legal entity sem CNPJ);
            - **Código do customer:** O number de positions varia according to o type do customer:
              1. Para customers individual com CPF (type de customer = 1), provide as 11 (onze) positions do CPF;
              2. Para customers legal entity com CNPJ (type de customer = 2), provide as 8 (oito) positions iniciais do CNPJ;
              3. Para os demais customers (types de customer 3, 4, 5 e 6), provide 14 (catorze) positions com complement de zeros à esquerda se a identifiestion tiver tamanho inferior;
            - **Código do contract:** 1 (uma) up to 40 (quarenta) positions, sem complement de caracteres.
        productName:
          type: string
          maxLength: 140
          pattern: '^[^\s](.*[^\s])?$'
          example: AD
          description: |
            Denominação/Identificação do name da Modalidade da Operação de Crédito divulgado ao customer
        productType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftProductType'
        productSubType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftProductSubType'
        contractDate:
          description: |
            Data de contracting da operation de credit. Especificação [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339).
            Para operations em que o adiantamento a depositantes é disponibilizado ao customer desde a abertura da account, utilizar a date de abertura da account como date de contracting.
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-01-05'
        disbursementDates:
          type: array
          minItems: 1
          description: |
            Lista que traz as Datas de Desembolso do value contratado.
          items:
            type: string
            format: date
            maxLength: 10
            pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
            example: '2018-01-15'
            description: |
              Data do Desembolso do value contratado. Especificação [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339).
              No if de uma liberação de recursos feita em D0 mas com reference retroativa feita em D -1, accountbilmente a date correta beia D -1.
        settlementDate:
          type: string
          format: date
          maxLength: 10
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-01-15'
          description: |
            Data de settlement da operation.
        contractAmount:
          description: Valor contratado da operation. Expresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places. Nos ifs em que not houver este value explícito no contract do product, enviar como 0.00.
          type: string
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '100000.0400'
        currency:
          type: string
          pattern: '^(\w{3}){1}$'
          maxLength: 3
          description: |
            Moeda related to ao value da garantia, according to modelo ISO-4217. p.ex. 'BRL'
            Todos os values monetarys provideds are representsdos com a currency vigente do Brasil
          example: BRL
        dueDate:
          type: string
          format: date
          maxLength: 10
          minLength: 2
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2028-01-15'
          description: |
            Data de due date Final da operation. Especificação [RFC-3339](https://datatracker.ietf.org/doc/html/rfc3339).
            Não aplicável para contracts ativos / Informr date do cancelamento para contracts cancelados.
        instalmentPeriodicity:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumContractInstalmentPeriodicity'
        instalmentPeriodicityAdditionalInfo:
          type: string
          pattern: '[\w\W\s]*'
          maxLength: 50
          example: Informações adicionais sobre periodicidade
          description: |
            Campo para complementar a informtion relativa à periodicity de payment regular.

            [Restrição] Obrigatório when o field `instalmentPeriodicity` for igual a `OUTROS`.
        firstInstalmentDueDate:
          type: string
          format: date
          maxLength: 10
          minLength: 2
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          example: '2018-02-15'
          description: |
            Data de due date primeira installment do principal
        CET:
          type: string
          pattern: '^\d{1,6}\.\d{6}$'
          format: double
          description: |
            CET – Custo Efetivo Total must be expresso na form de rate percentage annual e incorpora all os encargos e despesas incidentes nas operations de credit (rate de juro, mas also tarifas, tributos, seguros e other despesas cobradas).

            O completion must respeitar as 6 decimal places decimal places, same que venham filled com zeros (representstion de porcentagem p.ex: 0.150000. sEste value represents 15%. O value 1 represents 100%).
          maxLength: 13
          minLength: 8
          example: '0.290000'
        amortizationScheduled:
          type: string
          description: |
            Sistema de amortization (Vide Enum):
            - SAC (Sistema de Amortização Constante) - É aquele em que o value da amortization permanece igual up to o final. Os interest cobrados sobre o installmentmento not entram nesta account.
            - PRICE (Sistema Francês de Amortização) - As installments are fixeds do início ao fim do contract. Ou be, all as installments terão o same value, desde a primeira up to a last. Nos primeiros payments, a maior parte do value da prestação corresponds aos interest. Ao longo do tempo, a rate de interest vai decrescendo. Como o value da prestação é fixo, com o passar das installments, o value de amortization vai aumentando.
            - SAM (Sistema de Amortização Misto) - Cada prestação (payment) é a média aritmética das installments respectivas no Sistemas Price e no Sistema de Amortização Constante (SAC).
            - SEM SISTEMA DE AMORTIZAÇÃO
          enum:
            - SAC
            - PRICE
            - SAM
            - SEM_SISTEMA_AMORTIZACAO
            - OUTROS
          example: SAC
        amortizationScheduledAdditionalInfo:
          type: string
          pattern: '[\w\W\s]*'
          maxLength: 200
          example: Informações complementares relativa à amortização do tipo 'OUTROS'
          description: |
            Campo para complementar a informtion relativa à amortization.

            [Restrição] Obrigatório when o field `amortizationScheduled` for igual a `OUTROS`.
        interestRates:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/UnarrangedAccountsOverdraftContractInterestRate'
          description: |
            Objeto que traz o set de informtion necessárias para demonstrar a composition das rates de interest remuneratórios da Modalidade de credit.
            Caso o contract not possua rates de interest, must be compartilhada uma list empty. Caso o contract possua uma rate de interest com value 0, must be compartilhado um objeto com o value 0 de form explícita.
        contractedFees:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/UnarrangedAccountsOverdraftContractedFee'
          description: Lista que traz as informtion das tarifas pactuadas no contract.
        contractedFinanceCharges:
          type: array
          minItems: 0
          description: Lista que traz os encargos pactuados no contract
          items:
            $ref: '#/components/schemas/UnarrangedAccountsOverdraftFinanceCharge'
        hasInsuranceContracted:
          type: boolean
          description: Campo que identifies se existe seguro contratado para o Adiantamento a Depositante, onde seguro contratado é true e not contratado é false. O not submission do field significa que a institution not oferece este product.
    UnarrangedAccountsOverdraftContractInterestRate:
      type: object
      description: Objeto que traz o set de informtion necessárias para demonstrar a composition das rates de interest remuneratórios da Modalidade de credit
      required:
        - taxType
        - interestRateType
        - taxPeriodicity
        - calculation
        - referentialRateIndexerType
      properties:
        taxType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumContractTaxType'
        interestRateType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumContractInterestRateType'
        taxPeriodicity:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumContractTaxPeriodicity'
        calculation:
          type: string
          description: Base de calculation
          enum:
            - 21/252
            - 30/360
            - 30/365
          example: 21/252
        referentialRateIndexerType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumContractReferentialRateIndexerType'
        referentialRateIndexerSubType:
          $ref: '#/components/schemas/UnarrangedAccountsOverdraftEnumContractReferentialRateIndexerSubType'
        referentialRateIndexerAdditionalInfo:
          type: string
          maxLength: 140
          pattern: '^[^\s](.*[^\s])?$'
          example: Informações adicionais
          description: |
            Campo livre para complementar a informtion relativa ao Tipo de rate referencial ou indexador.
            [Restrição] Obrigatório para complementar a informtion relativa ao Tipo de rate referencial ou indexador, when selecionada o type ou subtype OUTRO.
        preFixedRate:
          type: string
          format: double
          pattern: '^\d{1,2}\.\d{6}$'
          maxLength: 9
          minLength: 8
          description: |
            Taxa pré-fixedda aplicada sob o contract da modality credit. p.ex. 0.014500. O completion must respeitar as 6 decimal places decimal places, same que venham filled com zeros(representstion de porcentagem p.ex: 0.150000. Este value represents 15%. O value 1 represents 100%).

            [Restrição] Este field é de submission required if not be sent o field `postFixedRate`.
          example: '0.600000'
        postFixedRate:
          type: string
          format: double
          pattern: '^\d{1,2}\.\d{6}$'
          maxLength: 9
          minLength: 8
          description: |
            Taxa post-fixedda aplicada sob o contract da modality credit. p.ex. 0.0045. O completion must respeitar as 6 decimal places decimal places, same que venham filled com zeros (representstion de porcentagem p.ex: 0.1500. Este value represents 15%. O value 1 represents 100%).

            [Restrição] Este field é de submission required if not be sent o field `preFixedRate`.
          example: '0.550000'
        additionalInfo:
          type: string
          maxLength: 1200
          pattern: '^[^\s](.*[^\s])?$'
          example: Informações adicionais
          description: |
            Texto com informtion adicionais sobre a composition das rates de interest pactuadas.

            [Restrição] Caso a institution possua a informtion para compartilhamento, esta mustrá be informda.
    UnarrangedAccountsOverdraftBalloonPaymentAmount:
      type: object
      required:
        - amount
        - currency
      description: Valor monetary da installment not regular a vencer. Expresso em value monetary com no minimum 2 decimal places e no maximum 4 decimal places decimal places.
      properties:
        amount:
          type: string
          pattern: '^-?\d{1,15}\.\d{2,4}$'
          maxLength: 21
          minLength: 4
          example: '100000.0400'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          maxLength: 3
          description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
          example: BRL
    UnarrangedAccountsOverdraftProductType:
      type: string
      description: |
        "Tipo da modality de credit contratada, according to circular 4.015 e description do DOC3040 do SCR). (Vide Enum)
        Adiantamento a depositantes, Direitos credit rights desaccountdos Loans,  Financings, Financings rurais  e Financings isecuritiess"
      enum:
        - ADIANTAMENTO_A_DEPOSITANTES
      example: ADIANTAMENTO_A_DEPOSITANTES
    UnarrangedAccountsOverdraftProductSubType:
      type: string
      description: |
        "Sub type da modalitys de credit contratadas, according to  circular 4.015 e description do DOC3040 do SCR). (Vide Enum)
        Adiantamento a depositantes
      enum:
        - ADIANTAMENTO_A_DEPOSITANTES
      example: ADIANTAMENTO_A_DEPOSITANTES
    UnarrangedAccountsOverdraftEnumTypeNumberOfInstalments:
      type: string
      description: Tipo de term total do contract related to à modality de credit informda.
      enum:
        - DIA
        - SEMANA
        - MES
        - ANO
        - SEM_PRAZO_TOTAL
      example: MES
