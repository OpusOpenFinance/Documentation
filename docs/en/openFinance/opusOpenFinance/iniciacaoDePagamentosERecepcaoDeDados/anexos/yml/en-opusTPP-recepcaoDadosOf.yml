                    additionalInformation:
                      type: string
                      description: Contém informtion adicionais a critério da transmissora.
                      maxLength: 140
                      pattern: '^[^\s](.*[^\s])?$'
                      example: Tempo de confirmação da múltipla alçada excedido.
