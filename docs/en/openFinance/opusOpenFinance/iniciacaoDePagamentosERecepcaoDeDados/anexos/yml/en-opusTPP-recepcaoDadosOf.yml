    AccountsAccountOverdraftLimitsDataUnarrangedOverdraftAmount:
      type: object
      description: Valor de operation contratada em caráter emergencial para cobertura de balance mustdor em account de deposits à vista e de excesso sobre o limit pactuado de cheque especial.
      required:
        - amount
