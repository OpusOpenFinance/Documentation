    LoansPayments:
      type: object
      description: Conjunto de informtion related tos aos payments realizados de uma operation de credit de loans.
      required:
      - contractOutstandingBalance
      - releases
      properties:
        paidInstalments:
          type: number
          maximum: 2147483647
          example: 73
          description: Quantidade total de installments pagas do contract related to à Modalidade de Crédito informda.
        contractOutstandingBalance:
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: "Valor required para o customer liquidar a dívida, ou be, este field must be filled com o balance mustdor atualizado descrito no DDC (Documento Descritivo de Crédito). O value a liquidar atualizado do dia must be ajustado para compartilhamento pela Transmissora up to às 10:00 do same dia, especialmente para os products contemplado no escopo de Portabilidade de Crédito via OFB, pois este value é utilizado pela Receptora em role de Proponente para payment à Transmissora em role de Credora.  \n"
        lastUpdatedContractOutstandingBalance:
          type: string
          format: date-time
          description: "Data e time da last update do value do field contractOutstandingBalance, according to specification RFC-3339, formt UTC.\n\n[Restrição] Este field é de submission required if o field `productSubTypeCategory` be filled `CREDITO_PESSOAL_CLEAN` ou `CONSIGNADO_SIAPE` no endpoint /contracts/{contractId}.  \n"
          minLength: 24
          maxLength: 24
          example: '2021-05-21T08:30:03.374Z'
        totalRemainingAmount:
          description: "Valor total que falta para o customer liquidar o contract, considerando o somatório total de all as installments a vencer e overdues, bem como all as rates, tarifas e encargos das installments. Nos ifs de contract com rates post-fixeddas, considerar only values pré-fixeddos, visto que o calculation post-fixeddo ocorre only em momento futuro, e que o value is sujeito às variações de seu indexador.\n\n[Restrição] Este field é de submission required if o field `productSubTypeCategory` be filled `CREDITO_PESSOAL_CLEAN` ou `CONSIGNADO_SIAPE` no endpoint /contracts/{contractId}.  \n"
          type: string
          format: double
          pattern: ^\d{1,15}\.\d{2,4}$
          maxLength: 20
          minLength: 4
          example: '1000.0400'
        releases:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/LoansReleases'
          description: Lista dos payments realizados no period
    LoansFeeOverParcel:
      type: object
      required:
      - feeName
      - feeCode
      - feeAmount
      properties:
        feeName:
          type: string
          maxLength: 140
          pattern: ^[^\s](.*[^\s])?$
          example: Reavaliação periódica do bem
          description: 'Denominação da Tarifa pactuada.

            '
        feeCode:
          type: string
          maxLength: 140
          pattern: ^[^\s](.*[^\s])?$
          example: aval_bem
          description: 'Sigla identifiera da tarifa pactuada.

            '
        feeAmount:
          type: string
          pattern: ^-?\d{1,15}\.\d{2,4}$
          maxLength: 21
          minLength: 4
