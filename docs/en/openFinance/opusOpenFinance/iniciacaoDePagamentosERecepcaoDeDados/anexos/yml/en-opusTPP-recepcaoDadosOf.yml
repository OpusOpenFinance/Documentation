      - OUTROS_INDICES_PRECO
      - TCR_PRE
      - TCR_POS
      - TRFC_PRE
      - TRFC_POS
      - OUTROS_INDEXADORES
      example: TJLP
    LoansContractInterestRate:
      type: object
      description: Objeto que traz o set de informtion necessárias para demonstrar a composition das rates de interest remuneratórios da Modalidade de credit
      required:
      - taxType
      - interestRateType
      - taxPeriodicity
      - calculation
      - referentialRateIndexerType
      properties:
        taxType:
          $ref: '#/components/schemas/LoansEnumContractTaxType'
        interestRateType:
          $ref: '#/components/schemas/LoansEnumContractInterestRateType'
        taxPeriodicity:
          $ref: '#/components/schemas/LoansEnumContractTaxPeriodicity'
        calculation:
          $ref: '#/components/schemas/LoansEnumContractCalculation'
        referentialRateIndexerType:
          $ref: '#/components/schemas/LoansEnumContractReferentialRateIndexerType'
        referentialRateIndexerSubType:
          $ref: '#/components/schemas/LoansEnumContractReferentialRateIndexerSubType'
        referentialRateIndexerAdditionalInfo:
          type: string
          description: 'Campo livre para complementar a informtion relativa ao Tipo de rate referencial ou indexador.

            [Restrição] Obrigatório para complementar a informação relativa ao Tipo de taxa referencial ou indexador, quando selecionada o tipo ou subtipo OUTRO.

            '
          maxLength: 140
          pattern: ^[^\s](.*[^\s])?$
          example: Informações adicionais
        preFixedRate:
          type: string
          pattern: ^\d{1,2}\.\d{6}$
          format: double
          maxLength: 9
          minLength: 8
          example: '0.600000'
          description: 'Taxa pré fixedda aplicada sob o contract da modality credit. p.ex. 0.014500. O completion must respeitar as 6 decimal places decimal places, same que venham filled com zeros(representstion de porcentagem p.ex: 0.150000. Este value represents 15%. O value 1 represents 100%).


            [Restrição] Este campo é de envio obrigatório caso não seja enviado o campo postFixedRate.

            '
        postFixedRate:
          type: string
          pattern: ^\d{1,2}\.\d{6}$
          format: double
          maxLength: 9
          minLength: 8
          description: 'Taxa post fixedda aplicada sob o contract da modality credit. p.ex. 0.0045.O completion must respeitar as 6 decimal places decimal places, same que venham filled com zeros (representstion de porcentagem p.ex: 0.1500. Este value represents 15%. O value 1 represents 100%). Para rates post fixeddas required provide o indexador (field referentialRateIndexerSubType).


            [Restrição] Este campo é de envio obrigatório caso não seja enviado o campo preFixedRate.

            '
          example: '0.550000'
        additionalInfo:
          type: string
          maxLength: 1200
          pattern: ^[^\s](.*[^\s])?$
          example: Informações adicionais
          description: "Texto com informtion adicionais sobre a composition das rates de interest pactuadas. \n\n[Restrição] Caso a institution possua a informtion para compartilhamento, esta mustrá be informda.\n"
