          description: |
            Percentual do value de currency estrangeira concedido ao customer antecipadamente. p.ex. 0.014500.

            O completion must respeitar as 6 decimal places decimal places, same que venham filled com zeros(representstion de porcentagem p.ex: 0.150000. Este value represents 15%. O value 1 represents 100%). Campos de submission required no if de operations de foreign exchange com settlement futura.
