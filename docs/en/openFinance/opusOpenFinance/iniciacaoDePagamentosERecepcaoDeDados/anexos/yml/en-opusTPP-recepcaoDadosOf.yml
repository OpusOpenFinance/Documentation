        taxType:
          type: string
          description: '"Tipo de Taxa (vide  Enum)

            - NOMINAL (taxa nominal é uma taxa de juros em que a unidade referencial não coincide com a unidade de tempo da capitalização. Ela é sempre fornecida em termos anuais, e seus períodos de capitalização podem ser diários, mensais, trimestrais ou semestrais. p.ex. Uma taxa de 12% ao ano com capitalização mensal)

            - EFETIVA (É a taxa de juros em que a unidade referencial coincide com a unidade de tempo da capitalização. Como as unidades de medida de tempo da taxa de juros e dos períodos de capitalização são iguais, usa-se exemplos simples como 1% ao mês, 60% ao ano)"

            '
          enum:
          - NOMINAL
          - EFETIVA
          example: EFETIVA
        interestRateType:
          type: string
          description: '"Tipo de Juros  (vide  Enum)

            - SIMPLES (aplicada/cobrada sempre sobre o capital inicial, que é o valor emprestado/investido. Não há cobrança de juros sobre juros acumulados no(s) período(s) anterior(es). Exemplo: em um empréstimo de R$1.000, com taxa de juros simples de 8% a.a., com duração de 2 anos, o total de juros será R$80 no primeiro ano e R$ 80 no segundo ano. Ao final do contrato, o tomador irá devolver o principal e os juros simples de cada ano: R$1.000+R$80+R$80=R$1.160)

            - COMPOSTO (para cada período do contrato (diário, mensal, anual etc.), há um “novo capital” para a cobrança da taxa de juros contratada. Esse “novo capital” é a soma do capital e do juro cobrado no período anterior. Exemplo: em um empréstimo de R$1.000, com taxa de juros composta de 8% a.a., com duração de 2 anos, o total de juros será R$80 no primeiro ano. No segundo ano, os juros vão ser somados ao capital (R$1.000 + R$ 80 = R$ 1.080), resultando em juros de R$ 86 (8%de R$ 1.080))"

            '
          enum:
          - SIMPLES
          - COMPOSTO
          example: SIMPLES
        taxPeriodicity:
          type: string
          description: '"Periodicity da rate . (Vide  Enum)

            a.m - ao mês

            a.a. - ao ano"

            '
          enum:
          - AM
          - AA
          example: AA
        calculation:
          type: string
          description: Base de calculation
          enum:
          - 21/252
          - 30/360
          - 30/365
          example: 21/252
        referentialRateIndexerType:
          type: string
          description: '"Tipos de rates referenciais ou indexadores, according to Anexo 5: Taxa referencial ou Indexador (Indx), do Documento 3040"

            '
          enum:
          - SEM_TIPO_INDEXADOR
          - PRE_FIXADO
          - POS_FIXADO
          - FLUTUANTES
          - INDICES_PRECOS
          - CREDITO_RURAL
          - OUTROS_INDEXADORES
          example: PRE_FIXADO
        referentialRateIndexerSubType:
          type: string
          description: '"Sub types de rates referenciais ou indexadores, according to Anexo 5: Taxa referencial ou Indexador (Indx), do Documento 3040"

            '
          enum:
          - SEM_SUB_TIPO_INDEXADOR
          - PRE_FIXADO
          - TR_TBF
          - TJLP
          - LIBOR
          - TLP
          - OUTRAS_TAXAS_POS_FIXADAS
          - CDI
          - SELIC
          - OUTRAS_TAXAS_FLUTUANTES
          - IGPM
          - IPCA
          - IPCC
          - OUTROS_INDICES_PRECO
          - TCR_PRE
          - TCR_POS
          - TRFC_PRE
          - TRFC_POS
          - OUTROS_INDEXADORES
          example: TJLP
        referentialRateIndexerAdditionalInfo:
          type: string
          maxLength: 140
          pattern: ^[^\s](.*[^\s])?$
          example: Informações adicionais
          description: 'Campo livre para complementar a informtion relativa ao Tipo de rate referencial ou indexador.


            [Restrição] Obrigatório para complementar a informação relativa ao Tipo de taxa referencial ou indexador, quando selecionada o tipo ou subtipo OUTRO.

            '
        preFixedRate:
          type: string
          format: double
          maxLength: 9
          minLength: 8
          pattern: ^\d{1,2}\.\d{6}$
          example: '0.600000'
          description: "Taxa pré fixedda aplicada sob o contract da modality credit. p.ex. 0.014500.   \nO completion must respeitar as 6 decimal places decimal places, same que venham filled com zeros(representstion de porcentagem p.ex: 0.150000. Este value represents 15%. O value 1 represents 100%).\n"
        postFixedRate:
          type: string
          format: double
          maxLength: 9
          minLength: 8
          pattern: ^\d{1,2}\.\d{6}$
          example: '0.550000'
          description: "Taxa post fixedda aplicada sob o contract da modality credit. p.ex. 0.014500.   \nO completion must respeitar as 6 decimal places decimal places, same que venham filled com zeros (representstion de porcentagem p.ex: 0.150000. Este value represents 15%. O value 1 represents 100%).\n"
        additionalInfo:
          type: string
          maxLength: 1200
          pattern: ^[^\s](.*[^\s])?$
          example: Informações adicionais
          description: "Texto com informtion adicionais sobre a composition das rates de interest pactuadas. \n\n[Restrição] Caso a institution possua a informtion para compartilhamento, esta mustrá be informda.\n"
