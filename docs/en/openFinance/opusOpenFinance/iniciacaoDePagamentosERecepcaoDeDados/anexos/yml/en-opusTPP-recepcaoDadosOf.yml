    UnarrangedAccountsOverdraftEnumContractFeeCharge:
      type: string
      description: |
        "Forma de charge relativa a tarifa pactuada no contract. (Vide Enum)
        - Mínimo
        - Máximo
        - Fixo
        - Percentual"
      enum:
        - MINIMO
        - MAXIMO
        - FIXO
        - PERCENTUAL
      example: MINIMO
    UnarrangedAccountsOverdraftEnumContractFeeChargeType:
      type: string
      description: Tipo de charge para a tarifa pactuada no contract.
      enum:
        - UNICA
        - POR_PARCELA
      example: UNICA
    UnarrangedAccountsOverdraftEnumContractInstalmentPeriodicity:
      type: string
      description: |
        "Informção relativa à periodicity regular das installments. (Vide Enum)
        sem periodicity regular, weekly, quinzenal, monthly, bimestral, trimestral, semestral, annual"
      enum:
        - SEM_PERIODICIDADE_REGULAR
        - SEMANAL
        - QUINZENAL
        - MENSAL
        - BIMESTRAL
        - TRIMESTRAL
        - SEMESTRAL
        - ANUAL
        - OUTROS
      example: SEMANAL
    UnarrangedAccountsOverdraftEnumContractInterestRateType:
      type: string
      description: |
        "Tipo de Juros  (vide  Enum)
        - SIMPLES (aplicada/cobrada sempre sobre o capital inicial, que é o value emprstate/investido. Não há charge de interest sobre interest acumulados no(s) period(s) anterior(es). Exemplo: em um loan de R$1.000, com rate de interest simples de 8% a.a., com duração de 2 anos, o total de interest beá R$80 no primeiro ano e R$ 80 no according to ano. Ao final do contract, o tomador irá devolver o principal e os interest simples de cada ano: R$1.000+R$80+R$80=R$1.160)
        - COMPOSTO (para cada period do contract (diário, monthly, annual etc.), há um “novo capital” para a charge da rate de interest contratada. Esse “novo capital” é a soma do capital e do juro cobrado no period anterior. Exemplo: em um loan de R$1.000, com rate de interest composed de 8% a.a., com duração de 2 anos, o total de interest beá R$80 no primeiro ano. No according to ano, os interest vão be somados ao capital (R$1.000 + R$ 80 = R$ 1.080), resultando em interest de R$ 86 (8%de R$ 1.080))"
      enum:
        - SIMPLES
        - COMPOSTO
      example: SIMPLES
    UnarrangedAccountsOverdraftEnumContractReferentialRateIndexerSubType:
      type: string
      description: |
        "Sub types de rates referenciais ou indexadores, according to Anexo 5: Taxa referencial ou Indexador (Indx), do Documento 3040"
      enum:
        - SEM_SUB_TIPO_INDEXADOR
        - PRE_FIXADO
        - TR_TBF
        - TJLP
        - LIBOR
        - TLP
        - OUTRAS_TAXAS_POS_FIXADAS
        - CDI
        - SELIC
        - OUTRAS_TAXAS_FLUTUANTES
        - IGPM
        - IPCA
        - IPCC
        - OUTROS_INDICES_PRECO
        - TCR_PRE
        - TCR_POS
        - TRFC_PRE
        - TRFC_POS
        - OUTROS_INDEXADORES
      example: TJLP
    UnarrangedAccountsOverdraftEnumContractReferentialRateIndexerType:
      type: string
      description: |
        "Tipos de rates referenciais ou indexadores, according to Anexo 5: Taxa referencial ou Indexador (Indx), do Documento 3040"
      enum:
        - SEM_TIPO_INDEXADOR
        - PRE_FIXADO
        - POS_FIXADO
        - FLUTUANTES
        - INDICES_PRECOS
        - CREDITO_RURAL
        - OUTROS_INDEXADORES
      example: PRE_FIXADO
    UnarrangedAccountsOverdraftEnumContractTaxPeriodicity:
      type: string
      description: |
        "Periodicity da rate. (Vide  Enum)
        a.m - ao month
        a.a. - ao ano"
      enum:
        - AM
        - AA
      example: AA
    UnarrangedAccountsOverdraftEnumContractTaxType:
      type: string
      description: |
        "Tipo de Taxa (vide  Enum)
        - NOMINAL (rate nominal é uma rate de interest em que a unit referencial not coincide com a unit de tempo da capitalização. Ela é sempre fornecida em termos anuais, e seus periods de capitalização podem be diários, mensais, trimestrais ou semestrais. p.ex. Uma rate de 12% ao ano com capitalização monthly)
        - EFETIVA (É a rate de interest em que a unit referencial coincide com a unit de tempo da capitalização. Como as units de medida de tempo da rate de interest e dos periods de capitalização are iguais, usa-se exemplos simples como 1% ao month, 60% ao ano)"
      enum:
        - NOMINAL
        - EFETIVA
      example: EFETIVA
    UnarrangedAccountsOverdraftEnumWarrantySubType:
      type: string
      description: |
