    AccountsEnumAccountSubType:
      type: string
      enum:
        - INDIVIDUAL
        - CONJUNTA_SIMPLES
        - CONJUNTA_SOLIDARIA
      description: |
        Subtype de account (vide Enum):
        Account individual - has um single titular
        Account conjunta simples - onde as movements financeiras só podem beem realizadas mediante authorization de TODOS os correntistas da account.
        Account conjunta solidária - é a modality cujos titulares podem realizar movements de form isolada, isto é, sem que be necessária a authorization dos demais titulares
      example: INDIVIDUAL
    AccountsEnumCompletedAuthorisedPaymentIndicator:
      type: string
      description: |
        Indicador da transaction:
          - Transação efetivada: a transaction atinge esse status when o `transactionId` torna-se immutable;
          - Lançamento futuro: a transaction beá efetivada em momento futuro, ou be, o `transactionId` pode mudar;
          - Transação processando: a transaction is em processamento, ou be, o `transactionId` pode mudar.
      enum:
        - TRANSACAO_EFETIVADA
        - LANCAMENTO_FUTURO
        - TRANSACAO_PROCESSANDO
      example: TRANSACAO_EFETIVADA
    AccountsEnumTransactionTypes:
      type: string
      description: |
        O field must classificar a transaction em um dos types described.
        O transmissor must classificar as transactions available associando-a a um dos itens do Enum listdo neste field.
        A option OUTROS só must be utilizada para os ifs em que de fato a transaction compartilhada not possa be classificada como um dos itens deste Enum.
        Por exemplo no if de recebimento de penare alimentícia.
      enum:
        - TED
        - DOC
        - PIX
        - TRANSFERENCIA_MESMA_INSTITUICAO
        - BOLETO
        - CONVENIO_ARRECADACAO
        - PACOTE_TARIFA_SERVICOS
        - TARIFA_SERVICOS_AVULSOS
        - FOLHA_PAGAMENTO
        - DEPOSITO
        - SAQUE
        - CARTAO
        - ENCARGOS_JUROS_CHEQUE_ESPECIAL
        - RENDIMENTO_APLIC_FINANCEIRA
        - PORTABILIDADE_SALARIO
        - APLICACAO_FINANCEIRA
        - RESGATE_APLIC_FINANCEIRA
        - OPERACAO_CREDITO
        - TRANSFERENCIA_SALDO_RESERVADO
        - OUTROS
      example: PIX
    AccountsLinks:
      type: object
      description: Referências para other recusos da API requisitada.
      required:
        - self
      properties:
        self:
          type: string
          format: url
          maxLength: 4048
          description: URI completo que gerou a response atual.
          example: 'https://api.banco.com.br/open-banking/api/v2/resource'
        first:
          type: string
          format: url
          maxLength: 4048
          description: URI da primeira page que originou essa list de resultados. Restrição - Obrigatório when not for a primeira page da response
          example: 'https://api.banco.com.br/open-banking/api/v2/resource'
        prev:
