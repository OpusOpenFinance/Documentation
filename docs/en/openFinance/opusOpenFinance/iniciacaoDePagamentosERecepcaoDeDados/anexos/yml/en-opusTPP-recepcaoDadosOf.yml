    FinancingsListContract:
      type: object
      description: Conjunto de informtion  de contracts de financiamento held pelo customer na date-transmitting institution e para os quais ele has provided consent
      required:
      - contractId
      - brandName
      - companyCnpj
      - productType
      - productSubType
      - ipocCode
      properties:
        contractId:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$
          maxLength: 100
          example: '92792126019929279212650822221989319252576'
          description: Identifica de form single o contract da operation de credit do customer, mantendo as regras de imutabilidade dentro da date-transmitting institution.
        brandName:
          type: string
          pattern: ^[^\s](.*[^\s])?$
          maxLength: 80
          example: Organização A
          description: Nome da Marca reportada pelo participant no Open Finance. Recomenda-se utilizar, sempre que possible, o same name de marca assigned no field do directory Customer Friendly Server Name (Authorisation Server).
        companyCnpj:
          type: string
          pattern: ^[0-9A-Z]{12}[0-9]{2}$
          description: "Registro completo do CNPJ da institution responsible pelo Cadastro - o CNPJ corresponds a representstion alphanumeric da registration no Cadastro de Pessoa Jurídica. \nDeve-se ter only os caracteres do CNPJ, sem mask.\n"
          maxLength: 14
          example: '21128159000166'
        productType:
          $ref: '#/components/schemas/FinancingsEnumProductType'
        productSubType:
          $ref: '#/components/schemas/FinancingsEnumProductSubType'
        ipocCode:
          type: string
          maxLength: 67
          minLength: 22
          pattern: ^[\w\W]{22,67}$
          example: '92792126019929279212650822221989319252576'
          description: "Número padronizado do contract - IPOC (Identificação Padronizada da Operação de Crédito). Segundo DOC 3040, composed por:\n- **CNPJ da institution:** 8 (oito) positions iniciais;\n- **Modalidade da operation:** 4 (quatro) positions;\n- **Tipo do customer:** 1 (uma) position( 1 = natural person - CPF, 2= legal entity – CNPJ, 3 = individual no exterior, 4 = legal entity no exterior, 5 = natural person sem CPF e 6 = legal entity sem CNPJ);\n- **Código do customer:** O number de positions varia according to o type do customer:\n  1. Para customers individual com CPF (type de customer = 1), provide as 11 (onze) positions do CPF;\n  2. Para customers legal entity com CNPJ (type de customer = 2), provide as 8 (oito) positions iniciais do CNPJ;\n  3. Para os demais customers (types de customer 3, 4, 5 e 6), provide 14 (catorze) positions com complement de zeros à esquerda se a identifiestion tiver tamanho inferior;\n- **Código do contract:** 1 (uma) up to 40 (quarenta) positions, sem complement de caracteres.\n"
