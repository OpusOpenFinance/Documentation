    CreditFixedIncomesMeta:
      type: object
      description: Meta informtion related to a API requisitada.
      required:
        - totalRecords
        - totalPages
        - requestDateTime
      properties:
        totalRecords:
          type: integer
          format: int32
          description: Número total de registros no resultado
          example: 1
        totalPages:
          type: integer
          format: int32
          description: Número total de pages no resultado
          example: 1
        requestDateTime:
          description: 'Data e time da query, according to specification RFC-3339, formt UTC.'
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
    CreditFixedIncomesMetaTransactions:
      type: object
      description: Meta informtion related to a API requisitada.
      required:
        - requestDateTime
      properties:
        requestDateTime:
          description: 'Data e time da query, according to specification RFC-3339, formt UTC.'
          type: string
          maxLength: 20
          format: date-time
          example: '2021-05-21T08:30:00Z'
    CreditFixedIncomesResponseBalances:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: object
          required:
            - referenceDateTime
            - updatedUnitPrice
            - quantity
            - grossAmount
            - netAmount
            - incomeTax
            - financialTransactionTax
            - blockedBalance
            - purchaseUnitPrice
          properties:
            referenceDateTime:
              type: string
              format: date-time
              description: 'date e time da last position consolidada available a que se referem os date transacionais do customer available nos canais electronic; Na representstion date must se considerar os minutos e according tos como zero (00:00:00Z)'
              maxLength: 20
              pattern: '(^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$)'
              example: '2022-07-21T17:32:00Z'
            updatedUnitPrice:
              type: object
              description: value bruto unit atualizado na date de reference;
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,8}$'
                  maxLength: 24
                  minLength: 4
                  example: '1000.0400'
                  description: Valor related ao objeto.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
            quantity:
              type: string
              format: double
              description: quantity de securities detidos na date da position do customer
              maxLength: 24
              minLength: 4
              pattern: '^\d{1,15}\.\d{2,8}$'
              example: '15.00'
            grossAmount:
              type: object
              description: value do investment que se refere a quantity x PU atualizado na date de reference
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  maxLength: 20
                  minLength: 4
                  example: '1000.04'
                  description: Valor related ao objeto.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
            netAmount:
              type: object
              description: 'value do investment atualizado na date de reference, posterior a deduction de impostos (IOF e IR)'
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  maxLength: 20
                  minLength: 4
                  example: '1000.04'
                  description: Valor related ao objeto.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
            incomeTax:
              type: object
              description: Valor do imposto de income provisionado considerando a tax rate vigente na date de reference.
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  maxLength: 20
                  minLength: 4
                  example: '1000.04'
                  description: Valor related ao objeto.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
            financialTransactionTax:
              type: object
              description: Valor do imposto (IOF) provisionado considerando a tax rate vigente na date de reference.
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  maxLength: 20
                  minLength: 4
                  example: '1000.04'
                  description: Valor related ao objeto.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
            blockedBalance:
              type: object
              description: Valor not available para movement naquele momento por qualquer reason (block judicial, block em garantia, entre other). Prazo de carência not é considerado como block.
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,4}$'
                  maxLength: 20
                  minLength: 4
                  example: '1000.04'
                  description: Valor related ao objeto.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
            purchaseUnitPrice:
              type: object
              description: value unit negociado com o customer na date de acquisition
              required:
                - amount
                - currency
              properties:
                amount:
                  type: string
                  format: double
                  pattern: '^\d{1,15}\.\d{2,8}$'
                  maxLength: 24
                  minLength: 4
                  example: '1000.000004'
                  description: Valor related ao objeto.
                currency:
                  $ref: '#/components/schemas/CreditFixedIncomesCurrencyCode'
            preFixedRate:
              type: string
              description: |
