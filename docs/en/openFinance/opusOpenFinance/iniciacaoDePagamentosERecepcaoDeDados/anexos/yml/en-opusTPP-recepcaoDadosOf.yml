    TreasureTitlesBlockedBalance:
      description: Valor not available para movement naquele momento por qualquer reason (block judicial, block em garantia, entre other). Prazo de carência not é considerado como block.
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          $ref: '#/components/schemas/TreasureTitlesBlockedBalanceAmount'
        currency:
          $ref: '#/components/schemas/TreasureTitlesCurrency'
    TreasureTitlesBlockedBalanceAmount:
      description: Valor related ao objeto.
      maxLength: 20
      pattern: '^\d{1,15}\.\d{2,4}$'
      example: '1000.04'
      type: string
      format: double
    TreasureTitlesBrandName:
      description: |
        Nome da Marca reportada pelo participant no Open Finance.
        Recomenda-se utilizar, sempre que possible, o same name de marca assigned no
        field do directory Customer Friendly Server Name (Authorisation Server).
      maxLength: 80
      pattern: '^[^\s](.*[^\s])?$'
      example: Organização A
      type: string
    TreasureTitlesCalculation:
      description: Base de calculation (days úteis ou days corridos)
      example: DIAS_CORRIDOS
      enum:
        - DIAS_UTEIS
        - DIAS_CORRIDOS
      type: string
    TreasureTitlesCompanyCnpj:
      description: |
        Registro completo do CNPJ da institution responsible pelo Cadastro - o CNPJ corresponds a representstion alphanumeric da registration no Cadastro de Pessoa Jurídica. Deve-se ter only os caracteres do CNPJ, sem mask.
      maxLength: 14
      pattern: '^[0-9A-Z]{12}[0-9]{2}$'
      example: '21128159000166'
      type: string
    TreasureTitlesCurrency:
      description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
      maxLength: 3
      pattern: '^[A-Z]{3}$'
      example: BRL
      type: string
    TreasureTitlesDueDate:
      description: Data de due date do title.
      maxLength: 10
      pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
      example: '2018-02-15'
      type: string
      format: date
    TreasureTitlesFinancialTransactionTax:
      description: |
        IOF provisionado.

        Caso be um product com tax rate zero esse objeto pode be sent sem values (empty).
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          $ref: '#/components/schemas/TreasureTitlesFinancialTransactionTaxAmount'
