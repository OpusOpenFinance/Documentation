    ExchangesResponseOperationList:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/ExchangesProductList'
        links:
          $ref: '#/components/schemas/ExchangesLinks'
        meta:
          $ref: '#/components/schemas/ExchangesMeta'
      additionalProperties: false
    ExchangesProductList:
      type: object
      description: Lista de operations de foreign exchange
      required:
        - brandName
        - companyCnpj
        - operationId
      properties:
        brandName:
          type: string
          description: 'Nome da Marca reportada pelo participant no Open Finance. Recomenda-se utilizar, sempre que possible, o same name de marca assigned no field do directory Customer Friendly Server Name (Authorisation Server). Instituição authorized a operar'
          pattern: '[\w\W\s]*'
          example: Organização A
          maxLength: 80
        companyCnpj:
          type: string
          description: 'Registro completo do CNPJ da institution responsible pelo Cadastro - o CNPJ corresponds a representstion alphanumeric da registration no Cadastro de Pessoa Jurídica. Deve-se ter only os caracteres do CNPJ, sem mask.'
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '21128159000166'
        operationId:
          type: string
          description: 'Identifica de form single  o relacionamento do customer com o product, mantendo as regras de imutabilidade dentro da date-transmitting institution.'
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,99}$'
          example: '92792126019929240'
      additionalProperties: false
    ExchangesResponseOperationDetails:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          $ref: '#/components/schemas/ExchangesOperationDetails'
        links:
          $ref: '#/components/schemas/ExchangesLinksOperationId'
        meta:
          $ref: '#/components/schemas/ExchangesMetaOperationId'
    ExchangesOperationDetails:
      type: object
      description: Detalhes da operation de foreign exchange.
      required:
        - authorizedInstitutionCnpjNumber
        - authorizedInstitutionName
        - operationType
        - operationDate
        - dueDate
        - localCurrencyOperationTax
        - localCurrencyOperationValue
        - foreignOperationValue
        - deliveryForeignCurrency
        - operationCategoryCode
      properties:
        authorizedInstitutionCnpjNumber:
          type: string
          description: CNPJ da institution authorized a operar no mercado de foreign exchange.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '11225860000140'
        authorizedInstitutionName:
          type: string
          description: Nome da Instituição Financeira no Brasil.
          maxLength: 250
          pattern: '[\w\W\s]*'
          example: AGENCIA CORRETORA
        intermediaryInstitutionCnpjNumber:
          type: string
          description: |
            CNPJ da institution intermediadora authorized a operar no mercado de foreign exchange.
            Campo de submission required nos ifs em que houver institution intermediadora.
          maxLength: 14
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
          example: '11225860000140'
        intermediaryInstitutionName:
          type: string
          description: |
            Nome da corretora interveniente authorized a operar no mercado de foreign exchange.

            [Restrição] Campo de completion required pelas participants when o field 'intermediaryInstitutionCnpjNumber' for provided.
          maxLength: 250
          pattern: '[\w\W\s]*'
          example: AGENCIA CORRETORA
        operationNumber:
          type: string
          description: Número do registro da operation no Bacen. Deve be filled no compartilhamento, after registro no Sistema de Foreign Exchange e number available na transmissora/detentora.
          maxLength: 12
          pattern: '^\d{12}$'
          example: '393874649456'
        operationType:
          $ref: '#/components/schemas/ExchangesEnumOperationType'
        operationDate:
          type: string
          format: date-time
          description: Data do fechamento do contract de foreign exchange.
          maxLength: 20
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$'
          example: '2023-03-07T08:30:00Z'
        dueDate:
          type: string
          format: date
          pattern: '^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])$'
          description: Data em que a operation (compra ou venda) is prevista para be liquidada.
