    VariableIncomesBrokerData:
      type: object
      required:
        - brokerNoteNumber
        - grossValue
        - brokerageFee
        - clearingSettlementFee
        - clearingRegistrationFee
        - stockExchangeAssetTradeNoticeFee
        - stockExchangeFee
        - clearingCustodyFee
        - taxes
        - incomeTax
        - netValue
      properties:
        brokerNoteNumber:
          type: string
          description: Identificador da nota de trading. Não must be utilizado como chave na API.
          maxLength: 16
          pattern: '^\d{1,16}$'
          example: '1854009930314350'
        grossValue:
          type: object
          description: o value da nota de trading é o somatório das operations realizadas. Total de compra e venda do dia.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor related ao objeto.
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              maxLength: 21
              example: '5000.0024'
            currency:
              type: string
              description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        brokerageFee:
          type: object
          description: |
            a rate de corretagem incide sobre o value bruto da nota de trading, e é livremente pactuada entre o investidor e o seu intermediário.
            Pode be cobrada como um value fixo por operation, ou um como um percentage sobre o value negociado, ou ainda de form mista, according to guia CVM do investidor.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor related ao objeto.
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              maxLength: 21
              example: '13.8751'
            currency:
              type: string
              description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        clearingSettlementFee:
          type: object
          description: Valor cobrado para settlement na custody.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor related ao objeto.
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              maxLength: 21
              example: '13.8751'
            currency:
              type: string
              description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        clearingRegistrationFee:
          type: object
          description: Valor cobrado para registro na custody.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor related ao objeto.
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              maxLength: 21
              example: '13.8751'
            currency:
              type: string
              description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        stockExchangeAssetTradeNoticeFee:
          type: object
          description: Valor cobrada pela bolsa pelo aviso de trading de ativo.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor related ao objeto.
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              maxLength: 21
              example: '13.8751'
            currency:
              type: string
              description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        stockExchangeFee:
          type: object
          description: Valor cobrado pela bolsa para remunerar os beviços de registro prstates.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor related ao objeto.
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              maxLength: 21
              example: '13.8751'
            currency:
              type: string
              description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        clearingCustodyFee:
          type: object
          description: Taxa cobrada pelas IF para custody.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor related ao objeto.
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              maxLength: 21
              example: '13.8751'
            currency:
              type: string
              description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        taxes:
          type: object
          description: 'Impostos cobrados na operation, inclusive imposto de income day-trade, exceto imposto de income retido na fonte.'
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor related ao objeto.
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              maxLength: 21
              example: '13.8751'
            currency:
              type: string
              description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        incomeTax:
          type: object
          description: Imposto de income retido na fonte.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor related ao objeto.
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              maxLength: 21
              example: '13.8751'
            currency:
              type: string
              description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
        netValue:
          type: object
          description: Valor net da nota de trading after despesas com rate de corretagem, rate de settlement, rate de registro, rate A.N.A, emolumentos, rate de custody, impostos e IRRF.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              format: double
              description: Valor related ao objeto.
              pattern: '^-?\d{1,15}\.\d{2,4}$'
              maxLength: 21
              example: '4889.0012'
            currency:
              type: string
              description: 'Moeda related to ao value monetary, seguindo o modelo ISO-4217.'
              pattern: '^[A-Z]{3}$'
              maxLength: 3
              example: BRL
      additionalProperties: false
