    InvoiceFinancingsEnumContractAmortizationScheduled:
      type: string
      description: |
        Sistema de amortization (Vide Enum):
        - SAC (Sistema de Amortização Constante) - É aquele em que o value da amortization permanece igual up to o final. Os interest cobrados sobre o installmentmento not entram nesta account.
        - PRICE (Sistema Francês de Amortização) - As installments are fixeds do início ao fim do contract. Ou be, all as installments terão o same value, desde a primeira up to a last. Nos primeiros payments, a maior parte do value da prestação corresponds aos interest. Ao longo do tempo, a rate de interest vai decrescendo. Como o value da prestação é fixo, com o passar das installments, o value de amortization vai aumentando.
        - SAM (Sistema de Amortização Misto) - Cada prestação (payment) é a média aritmética das installments respectivas no Sistemas Price e no Sistema de Amortização Constante (SAC).
        - SEM SISTEMA DE AMORTIZAÇÃO
      enum:
        - SAC
        - PRICE
        - SAM
        - SEM_SISTEMA_AMORTIZACAO
        - OUTROS
      example: SAC
    InvoiceFinancingsEnumContractCalculation:
      type: string
      description: Base de calculation
      enum:
        - 21/252
        - 30/360
        - 30/365
      example: 21/252
    InvoiceFinancingsContractedFee:
      type: object
      description: Objeto que traz o set de informtion necessárias para demonstrar a composition das rates de interest remuneratórios da Modalidade de credit
      required:
        - feeName
        - feeCode
        - feeChargeType
        - feeCharge
      properties:
        feeName:
          type: string
          maxLength: 140
          minLength: 2
          pattern: '[\w\W\s]+'
          description: |
            Denominação da Tarifa pactuada
          example: Excesso em Conta
        feeCode:
          type: string
          maxLength: 140
          minLength: 2
          pattern: '[\w\W\s]+'
          description: |
            Sigla identifiera da tarifa pactuada
          example: EXCESSO_CONTA
        feeChargeType:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractFeeChargeType'
        feeCharge:
          $ref: '#/components/schemas/InvoiceFinancingsEnumContractFeeCharge'
        feeAmount:
          type: string
          format: double
          pattern: '^\d{1,15}\.\d{2,4}$'
          maxLength: 20
          minLength: 4
          example: '1000.0400'
          description: |
            Valor monetary da tarifa pactuada no contract.

            [Restrição] Preenchimento required when a form de charge for diferente de Percentual.
        feeRate:
          type: string
          pattern: '^\d{1}\.\d{6}$'
          format: double
          minLength: 8
          maxLength: 8
          description: |
            É o value da tarifa em percentage pactuada no contract.

            [Restrição] Preenchimento required when a form de charge for Percentual.
          example: '0.062000'
    InvoiceFinancingsEnumContractFeeCharge:
      type: string
      description: |
        "Forma de charge relativa a tarifa pactuada no contract. (Vide Enum)
        - Mínimo
        - Máximo
        - Fixo
        - Percentual"
      enum:
        - MINIMO
        - MAXIMO
        - FIXO
        - PERCENTUAL
      example: MINIMO
    InvoiceFinancingsEnumContractFeeChargeType:
      type: string
      description: Tipo de charge para a tarifa pactuada no contract.
      enum:
        - UNICA
        - POR_PARCELA
      example: UNICA
    InvoiceFinancingsEnumContractFinanceChargeType:
      type: string
      description: Tipo de encargo pactuado no contract.
      enum:
        - JUROS_REMUNERATORIOS_POR_ATRASO
        - MULTA_ATRASO_PAGAMENTO
        - JUROS_MORA_ATRASO
        - IOF_CONTRATACAO
        - IOF_POR_ATRASO
        - SEM_ENCARGO
        - OUTROS
      example: JUROS_REMUNERATORIOS_POR_ATRASO
    InvoiceFinancingsEnumContractInterestRateType:
      type: string
      description: |
        "Tipo de Juros  (vide  Enum)
        - SIMPLES (aplicada/cobrada sempre sobre o capital inicial, que é o value emprstate/investido. Não há charge de interest sobre interest acumulados no(s) period(s) anterior(es). Exemplo: em um loan de R$1.000, com rate de interest simples de 8% a.a., com duração de 2 anos, o total de interest beá R$80 no primeiro ano e R$ 80 no according to ano. Ao final do contract, o tomador irá devolver o principal e os interest simples de cada ano: R$1.000+R$80+R$80=R$1.160)
        - COMPOSTO (para cada period do contract (diário, monthly, annual etc.), há um “novo capital” para a charge da rate de interest contratada. Esse “novo capital” é a soma do capital e do juro cobrado no period anterior. Exemplo: em um loan de R$1.000, com rate de interest composed de 8% a.a., com duração de 2 anos, o total de interest beá R$80 no primeiro ano. No according to ano, os interest vão be somados ao capital (R$1.000 + R$ 80 = R$ 1.080), resultando em interest de R$ 86 (8%de R$ 1.080))"
      enum:
        - SIMPLES
        - COMPOSTO
      example: SIMPLES
    InvoiceFinancingsEnumContractReferentialRateIndexerSubType:
      type: string
      description: |
        "Sub types de rates referenciais ou indexadores, according to Anexo 5: Taxa referencial ou Indexador (Indx), do Documento 3040"
      enum:
        - SEM_SUB_TIPO_INDEXADOR
        - PRE_FIXADO
        - TR_TBF
        - TJLP
        - LIBOR
        - TLP
